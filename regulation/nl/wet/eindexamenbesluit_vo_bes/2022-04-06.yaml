        artikel: '29'
  - number: '18.1'
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo stelt een
      examenreglement vast, dat in elk geval bevat:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18
  - number: 18.1.a
    text: regels over de organisatie van het eindexamen en de gang van zaken tijdens het eindexamen;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18
  - number: 18.1.b
    text: |-
      informatie over de toepassing van de maatregelen bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel5
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '5'
        hoofdstuk: I
  - number: 18.1.c
    text: |-
      inhaal- en herkansingsmogelijkheden van het schoolexamen, waarbij in ieder geval wordt voorzien in een
      inhaalmogelijkheid voor de kandidaat die door ziekte of ten gevolge van een bijzondere van zijn wil onafhankelijke
      omstandigheid niet in staat is geweest aan een of meer toetsen van het schoolexamen deel te nemen; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18
  - number: 18.1.d
    text: |-
      in het geval van een school voor voortgezet onderwijs, de samenstelling en het adres van de in
      [artikel 5, vierde en vijfde lid][ref1], bedoelde commissie van beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel5
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '5'
        hoofdstuk: I
  - number: '18.2'
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs wijkt bij de vaststelling van het examenreglement
      slechts af van het voorstel, bedoeld in [artikel 23b, eerste lid, onderdeel a][ref1], nadat het bevoegd gezag:


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel23b
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 23b
        hoofdstuk: III
        afdeling: '3'
  - number: 18.2.a
    text: overleg heeft gepleegd met de examencommissie; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18
  - number: 18.2.b
    text: de afwijking schriftelijk heeft gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18
  - number: '18.3'
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs zendt de schriftelijke motivering, bedoeld in het tweede
      lid, zo spoedig mogelijk aan de examencommissie
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18
  - number: '18.5'
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo zendt jaarlijks
      voor 1 oktober het vastgestelde examenreglement aan de kandidaten en de inspectie.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18
  - number: '18.6'
    text: Dit artikel is van overeenkomstige toepassing op deeleindexamens.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18
  - number: 18a.1
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo stelt jaarlijks
      voor 1 oktober een programma van toetsing en afsluiting vast voor het desbetreffende schooljaar.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18a.2
    text: 'Het programma van toetsing en afsluiting vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18a.2.a
    text: welke examenstof van het examenprogramma in het schoolexamen wordt getoetst;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18a.2.b
    text: welke door het bevoegd gezag vast te stellen examenstof in het schoolexamen wordt getoetst;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18a.2.c
    text: de inhoud van de toetsen die onderdeel uitmaken van het schoolexamen;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18a.2.d
    text: de wijze waarop en tijdvakken waarbinnen de toetsen en herkansingen van het schoolexamen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18a.2.e
    text: de regels voor de wijze waarop het cijfer voor het schoolexamen voor een kandidaat tot stand komt.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18a.3
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo draagt er
      zorg voor dat ten aanzien van de toetsen die deel uitmaken van het schoolexamen, in het programma van toetsing en
      afsluiting duidelijk en herleidbaar wordt aangegeven welke toetsen bijdragen aan de afsluiting van:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18a.3.a
    text: de verplichte examenstof van het examenprogramma die behoort bij het schoolexamen;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18a.3.b
    text: |-
      de examenstof van het examenprogramma die behoort tot de verplichte examenstof van het centraal examen, maar die
      ook in het schoolexamen zal worden getoetst; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18a.3.c
    text: examenstof die is gekozen door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18a.4
    text: Dit artikel is van overeenkomstige toepassing op deeleindexamens.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18a
  - number: 18b.1
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs wijkt bij de vaststelling van het programma van toetsing
      en afsluiting als bedoeld in [artikel 18a, eerste lid][ref1], slechts af van het voorstel van de examencommissie,
      bedoeld in [artikel 23b , eerste lid, onderdeel b][ref2], nadat het bevoegd gezag:


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel23b
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 18a
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029990
        artikel: 23b
        hoofdstuk: III
        afdeling: '3'
  - number: 18b.1.a
    text: overleg heeft gepleegd met de examencommissie; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18b
  - number: 18b.1.b
    text: de afwijking schriftelijk heeft gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18b
  - number: 18b.2
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs zendt de schriftelijke motivering bedoeld in het tweede
      lid, zo spoedig mogelijk aan de examencommissie
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18b
  - number: 18b.3
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo zendt jaarlijks
      voor 1 oktober het vastgestelde programma van toetsing en afsluiting voor het desbetreffende schooljaar aan de
      kandidaten en de inspectie.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18b
  - number: 18b.4
    text: Dit artikel is van overeenkomstige toepassing op deeleindexamens.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18b
  - number: 18c.1
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo kan het
      programma van toetsing en afsluiting na 1 oktober slechts wijzigen:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18c
  - number: 18c.1.a
    text: |-
      in het geval van een bijzonder onvoorziene omstandigheid die leidt tot praktische onuitvoerbaarheid van het
      programma van toetsing en afsluiting; of
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18c
  - number: 18c.1.b
    text: |-
      ter verbetering van een kennelijke onjuistheid of kennelijke onvolledigheid in het programma van toetsing en
      afsluiting.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18c
  - number: 18c.2
    text: |-
      De examencommissie van de school voor voortgezet onderwijst wordt vooraf in de gelegenheid gesteld om te adviseren
      over een wijziging als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18c
  - number: 18c.3
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs wijkt bij de vaststelling van een wijziging van het
      programma van toetsing en afsluiting slechts af van het advies van de examencommissie nadat het bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18c
  - number: 18c.3.a
    text: overleg heeft gepleegd met de examencommissie; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18c
  - number: 18c.3.b
    text: de afwijking schriftelijk heeft gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18c
  - number: 18c.4
    text: |-
      [Artikel 18b, derde lid][ref1], is van overeenkomstige toepassing op de vaststelling van de wijziging van het
      programma van toetsing en afsluiting na 1 oktober.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel18b
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 18b
        hoofdstuk: III
        afdeling: '1'
  - number: 18c.5
    text: Dit artikel is van overeenkomstige toepassing op deeleindexamens.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel18c
  - number: '19.1'
    text: Het bevoegd gezag bepaalt het tijdstip waarop het schoolexamen aanvangt.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel19
  - number: '19.2'
    text: |-
      Het schoolexamen wordt afgesloten voor de aanvang van het eerste tijdvak, bedoeld in [artikel 25][ref1]. Bij
      toepassing van artikel 25, zevende lid, wordt het schoolexamen in het vak waarop de toets betrekking heeft,
      afgesloten tien werkdagen voor de afname van die toets.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel25
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '25'
        hoofdstuk: IV
  - number: '19.3'
    text: |-
      Het bevoegd gezag kan in afwijking van het tweede lid een kandidaat die ten gevolge van ziekte of een andere van
      zijn wil onafhankelijke omstandigheid het schoolexamen in één of meer vakken niet heeft kunnen afsluiten voor
      de aanvang van het eerste tijdvak, in de gelegenheid stellen het schoolexamen in dat vak of in die vakken af te
      sluiten vóór het centraal examen in dat vak of in die vakken, doch na de aanvang van het eerste tijdvak.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel19
  - number: '19.4'
    text: |-
      Indien het bevoegd gezag gebruikmaakt van de afwijkingsbevoegdheid in het derde lid, zendt het de resultaten
      die zijn behaald met het schoolexamen en het profielwerkstuk in het vmbo zo spoedig mogelijk aan de inspectie,
      tenzij het bevoegd gezag op grond van [artikel 179, tweede lid, van de wet](onbekend) examengegevens samen met het
      persoonsgebonden nummer verstrekt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel19
  - number: '20.1'
    text: |-
      Voor de aanvang van het eerste tijdvak van het centraal examen verstrekt de directeur respectievelijk de
      examencommissie vavo aan de kandidaat, voor zover van toepassing, het volgende:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel20
  - number: 20.1.a
    text: |-
      een overzicht van behaalde resultaten van alle onderdelen in het examendossier bedoeld in [artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel23
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '23'
        hoofdstuk: III
        afdeling: '2'
  - number: 20.1.b
    text: een overzicht van de cijfers die de kandidaat heeft behaald voor het schoolexamen;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel20
  - number: 20.1.c
    text: de beoordeling voor de vakken waarvoor geen cijfer wordt vastgesteld; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel20
  - number: 20.1.d
    text: de beoordeling van het profielwerkstuk in het vmbo.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel20
  - number: '20.2'
    text: |-
      De directeur, de examensecretaris dan wel de examencommissie vavo tekenen voor verstrekking van de in het eerste
      lid genoemde overzichten en beoordelingen aan de kandidaat.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel20
  - number: '20.3'
    text: De kandidaat tekent voor ontvangst van de in het eerste lid genoemde overzichten en beoordelingen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel20
  - number: '21.1'
    text: |-
      Het cijfer van het schoolexamen wordt uitgedrukt in een cijfer uit een schaal van cijfers lopende van 1 tot en
      met 10.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel21
  - number: '21.2'
    text: |-
      Indien in een vak tevens centraal examen wordt afgelegd, worden de in het eerste lid genoemde cijfers gebruikt met
      de daartussen liggende cijfers met 1 decimaal.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel21
  - number: '21.3'
    text: |-
      In afwijking van het eerste lid, worden de kunstvakken en het vak lichamelijke opvoeding uit het gemeenschappelijk
      deel van elk profiel, beoordeeld met «voldoende» of «goed». Deze beoordeling gaat uit van de mogelijkheden van de
      leerling en geschiedt op de grondslag van het genoegzaam afsluiten van de desbetreffende vakken, zoals blijkend uit
      het examendossier.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel21
  - number: '21.4'
    text: |-
      In afwijking van het eerste lid wordt het profielwerkstuk in het vmbo beoordeeld met «voldoende» of «goed». Deze
      beoordeling geschiedt op de grondslag van het genoegzaam voltooien van het profielwerkstuk, zoals blijkend uit het
      examendossier. Het profielwerkstuk in het vmbo wordt beoordeeld door ten minste twee examinatoren.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel21
  - number: '22.1'
    text: |-
      Het bevoegd gezag kan bepalen dat de kandidaat die eindexamen of deeleindexamen aflegt, voor één of meer vakken het
      schoolexamen waarin geen centraal examen wordt afgenomen, opnieuw kan afleggen, met dien verstande dat het bevoegd
      gezag dit recht in elk geval verleent voor het vak maatschappijleer behorend tot het gemeenschappelijk deel van de
      leerwegen, indien de kandidaat voor dat vak een eindcijfer heeft behaald lager dan 6. Het herexamen omvat door het
      bevoegd gezag aangegeven onderdelen van het examenprogramma.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel22
  - number: '22.2'
    text: |-
      Het bevoegd gezag stelt vast hoe het cijfer van het in het eerste lid bedoelde herexamen wordt bepaald. Het hoogste
      van de cijfers behaald bij het herexamen in een vak en bij het eerder afgelegde schoolexamen in dat vak geldt als
      het definitieve cijfer van het schoolexamen in dat vak.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel22
  - number: '23'
    text: |-
      Het schoolexamen bestaat uit een examendossier. Het examendossier is het geheel van de onderdelen van het
      schoolexamen zoals gedocumenteerd in een door het bevoegd gezag gekozen vorm. Het examendossier voor het vmbo omvat
      tevens de resultaten die de leerling heeft behaald voor de vakken, bedoeld in [artikel 24, eerste lid][ref1], of
      [artikel 26, tweede lid, van het Inrichtingsbesluit WVO BES][ref2], voor zover in die vakken geen eindexamen is
      afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0029589#Artikel26
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0029589
        artikel: '26'
  - number: 23a.1
    text: 'Het bevoegd gezag van een school voor voortgezet onderwijs:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.1.a
    text: stelt een of meer examencommissies in ten behoeve van de borging van de kwaliteit van de schoolexaminering;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.1.b
    text: benoemt de leden van de examencommissie; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.1.c
    text: draagt zorg voor het onafhankelijk en deskundig functioneren van de examencommissie.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.2
    text: De examencommissie heeft een oneven aantal leden en ten minste drie leden.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.3
    text: 'De volgende personen kunnen niet worden benoemd tot lid van de examencommissie:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.3.a
    text: leden van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.3.b
    text: de directeur van de school;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.3.c
    text: |-
      leden van de medezeggenschapsraad of de gemeenschappelijke medezeggenschapsraad van de school als bedoeld in
      [artikel 57 WVO BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel57
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '57'
  - number: 23a.3.d
    text: leerlingen van de school en hun wettelijk vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.4
    text: |-
      Bij de benoeming van de leden van de examencommissie draagt het bevoegd gezag er zorg voor dat de examencommissie
      deskundig is op het gebied van:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.4.a
    text: de desbetreffende schoolsoort;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.4.b
    text: de regelgeving over examinering in het voortgezet onderwijs; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.4.c
    text: de kwaliteit van examinering.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23a.5
    text: Alvorens tot benoeming van een lid over te gaan, hoort het bevoegd gezag de overige leden van de examencommissie .
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23a
  - number: 23b.1
    text: |-
      De examencommissie heeft voor de borging van de kwaliteit van de schoolexaminering de volgende taken en
      bevoegdheden:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23b
  - number: 23b.1.a
    text: |-
      het opstellen van een voorstel voor een examenreglement als bedoeld in [artikel 31][ref1] voor het bevoegd gezag;


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel31
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '31'
        hoofdstuk: IV
  - number: 23b.1.b
    text: |-
      het jaarlijks opstellen van een voorstel voor een programma van toetsing en afsluiting als bedoeld in
      [artikel 18a][ref1] voor het bevoegd gezag;


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel18a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 18a
        hoofdstuk: III
        afdeling: '1'
  - number: 23b.1.c
    text: het borgen van het afsluitend karakter en de kwaliteit van het schoolexamen;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23b
  - number: 23b.1.d
    text: het vaststellen van richtlijnen en aanwijzingen om te komen tot een beoordeling van het schoolexamen; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23b
  - number: 23b.1.e
    text: overige door het bevoegd gezag aan de commissie opgedragen taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23b
  - number: 23b.2
    text: De examencommissie stelt regels vast over haar werkwijze.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23b
  - number: 23b.3
    text: De examencommissie stelt jaarlijks een verslag op van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23b
  - number: 23b.4
    text: |-
      De examencommissie evalueert jaarlijks de kwaliteit van de schoolexaminering en stelt een advies op aan het bevoegd
      gezag en de directeur over noodzakelijke en wenselijke verbeteringen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23b
  - number: 23b.5
    text: |-
      De examencommissie verstrekt de regels over haar werkwijze, het verslag, de evaluatie en het advies bedoeld in het
      tweede tot en met het vierde lid, aan het bevoegd gezag, aan de directeur en aan de examensecretaris van een school
      voor voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel23b
  - number: '24.1'
    text: |-
      Onze Minister wijst voor elke school een of meer gecommitteerden aan en maakt deze aanwijzing bekend aan de scholen
      waarvoor zij de tweede correctie verrichten.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel24
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid worden voor het praktisch gedeelte van het centraal examen vmbo geen
      gecommitteerden aangewezen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel24
  - number: '25.1'
    text: Het centraal examen voor de scholen voor voortgezet onderwijs kent een eerste, tweede en derde tijdvak.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel25
  - number: '25.2'
    text: Het eerste en tweede tijdvak worden afgenomen in het laatste leerjaar.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel25
  - number: '25.3'
    text: Het derde tijdvak wordt aansluitend aan het laatste leerjaar afgenomen door het College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel25
  - number: '25.4'
    text: |-
      Het College voor toetsen en examens kan vakken aanwijzen waarin wegens het zeer geringe aantal kandidaten, het
      centraal examen in het tweede tijdvak wordt afgenomen door het College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel25
  - number: '25.5'
    text: 'Bij toepassing van het derde of vierde lid, gelden de volgende regels:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel25
  - number: 25.5.a
    text: de directeur deelt aan Onze Minister mee welke kandidaten het centraal examen zullen afleggen en in welke vakken;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel25
  - number: 25.5.b
    text: |-
      de kandidaten leveren de opgaven, de door hen gemaakte aantekeningen alsmede andere door hen gemaakte stukken
      in bij een van degenen die toezicht houden. Het College voor toetsen en examens bepaalt, in welke gevallen wordt
      afgeweken van de eerste volzin alsmede in welke gevallen en op welk tijdstip de opgaven, de aantekeningen en de
      andere stukken, bedoeld in die volzin aan de kandidaten worden teruggegeven;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel25
  - number: 25.5.c
    text: |-
      het College voor toetsen en examens deelt het door de kandidaat behaalde cijfer voor het centraal examen aan de
      directeur mee.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel25
  - number: '25.6'
    text: |-
      Het College voor toetsen en examens kan bepalen dat een toets wordt afgenomen op een tijdstip dat is gelegen voor
      de aanvang van het eerste tijdvak.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel25
  - number: '25.7'
    text: |-
      Het College voor toetsen en examens kan voor een toets een afnameperiode instellen waarbinnen het bevoegd gezag
      zelf de afnametijdstippen bepaalt. Deze afnameperiode vangt niet eerder aan dan op 1 april van het desbetreffende
      examenjaar en omvat het eerste en tweede tijdvak van dat examenjaar.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel25
  - number: '25.8'
    text: Het College voor toetsen en examens kan regels stellen voor de uitvoering van een toets van het centraal examen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel25
  - number: '26.1'
    text: |-
      In afwijking van [artikel 25, tweede lid][ref1], kan het bevoegd gezag een leerling uit het voorlaatste of direct
      daaraan voorafgaande leerjaar toelaten tot het centraal examen in één of meer vakken, niet zijnde alle vakken van
      het eindexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel25
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '25'
        hoofdstuk: IV
  - number: '26.2'
    text: |-
      Bij toepassing van het eerste lid wordt het schoolexamen in dat vak of die vakken afgesloten voordat in dat
      leerjaar het centraal examen in dat vak of die vakken aanvangt.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel26
  - number: '26.3'
    text: |-
      [Artikel 37, zevende lid][ref1], en [artikel 37a, vijfde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: '26.4'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt het derde tijdvak aansluitend aan het voorlaatste of
      direct daaraan voorafgaande leerjaar afgenomen door het College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel26
  - number: '26.5'
    text: |-
      Indien de leerling in één of meer vakken centraal examen heeft afgelegd in het voorlaatste of direct daaraan
      voorafgaande leerjaar, en niet is bevorderd tot het volgende leerjaar, vervallen de met dit centraal examen of deze
      centrale examens behaalde resultaten.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel26
  - number: '27'
    text: |-
      De directeur deelt jaarlijks voor 1 november aan Onze Minister mede hoeveel kandidaten in elk vak aan het centraal
      examen in het eerste tijdvak zullen deelnemen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel27
  - number: '28.1'
    text: |-
      Onze Minister zorgt ervoor dat de opgaven, bedoeld in
      [artikel 2, onderdeel c, van de Wet College voor toetsen en examens][ref1] tijdig beschikbaar worden gesteld aan de
      directeur van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '28.2'
    text: |-
      De directeur zorgt ervoor, dat de opgaven voor het centraal examen geheim blijven tot de aanvang van de toets
      waarbij deze opgaven aan de kandidaten worden voorgelegd. Het College voor toetsen en examens kan opgaven aanwijzen
      waarop de eerste volzin niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel28
  - number: '28.3'
    text: |-
      Tijdens een toets van het centraal examen worden aan de kandidaten geen mededelingen van welke aard ook, aangaande
      de opgaven gedaan, uitgezonderd mededelingen van het College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel28
  - number: '28.4'
    text: De directeur draagt er zorg voor dat het nodige toezicht bij het centraal examen wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel28
  - number: '28.5'
    text: |-
      Zij die toezicht hebben gehouden, maken een proces-verbaal op. Zij leveren dit in bij de directeur samen met het
      gemaakte examenwerk.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel28
  - number: '28.6'
    text: |-
      Een kandidaat die te laat komt, mag tot uiterlijk een half uur na de aanvang van de toets tot die toets worden
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel28
  - number: '28.7'
    text: |-
      De aan de kandidaten voorgelegde opgaven voor een toets van het centraal examen blijven in het examenlokaal tot het
      einde van die toets.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel28
  - number: '29.1'
    text: |-
      De directeur doet het gemaakte werk van het centraal examen met een exemplaar van de opgaven, de
      beoordelingsnormen en met het proces-verbaal van het examen toekomen aan de examinator in het desbetreffende
      vak. De examinator beoordeelt het werk zo spoedig mogelijk en past daarbij de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1] toe. De examinator drukt
      zijn beoordeling uit in de score, bedoeld in artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en
      examens. De examinator zendt de score en het beoordeelde werk aan de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '29.2'
    text: |-
      De directeur doet de van de examinator ontvangen stukken met een exemplaar van de opgaven, de beoordelingsnormen,
      het proces-verbaal en de regels voor het bepalen van de score, bedoeld in het eerste lid, onverwijld aan de
      directeur van de school, bedoeld in [artikel 24, tweede lid][ref1], toekomen. De directeur stelt deze documenten
      ter hand aan de gecommitteerde.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel24
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '24'
        hoofdstuk: IV
  - number: '29.3'
    text: |-
      De gecommitteerde beoordeelt het werk zo spoedig mogelijk en past daarbij toe de beoordelingsnormen en de daarbij
      behorende scores, bedoeld in [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1].
      De gecommitteerde voegt bij het gecorrigeerde werk een verklaring betreffende de verrichtte correctie. Deze
      verklaring is medeondertekend door het bevoegd gezag van de school waarbij de gecommitteerde werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '29.4'
    text: |-
      Bij digitale examinering worden de handelingen, bedoeld in het eerste en tweede lid, digitaal verricht,
      uitgezonderd de handelingen die betrekking hebben op het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel29
  - number: '29.5'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van het eerste tot en met
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel29
  - number: '30.1'
    text: |-
      De directeur draagt er zorg voor dat bij het maken van het cspe van een eindexamen vmbo, de examinator
      in het desbetreffende vak of programma aanwezig is. De examinator beoordeelt de prestaties tijdens
      het maken van de opgaven en legt zijn bevindingen van de verrichtingen van de kandidaat schriftelijk
      vast, volgens daartoe door het College voor toetsen en examens gegeven richtlijnen. De examinator
      beoordeelt het werk zo spoedig mogelijk en past daarbij toe de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1]. De examinator drukt zijn
      beoordeling uit in de score, bedoeld in artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en
      examens. De examinator zendt de score en voor zover mogelijk het beoordeelde werk aan de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '30.2'
    text: |-
      Voor het cspe vmbo vindt de beoordeling tevens plaats door een tweede examinator. De tweede examinator kan een
      deskundige als bedoeld in [artikel 72, tweede lid, van de wet](onbekend) of een andere examinator van de school
      zijn. De tweede examinator beoordeelt het resultaat van de opgaven, alsmede de verrichtingen van de kandidaat zoals
      blijkend uit de in het eerste lid bedoelde schriftelijke vastlegging daarvan. De directeur overhandigt de tweede
      examinator daartoe een exemplaar van de opgaven, de beoordelingsnormen, het proces-verbaal, alsmede de regels
      voor het bepalen van de score, bedoeld in het eerste lid. [Artikel 29, vierde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '29'
        hoofdstuk: IV
  - number: '31.1'
    text: |-
      De examinator en de gecommitteerde stellen in onderling overleg de score voor het centraal examen vast. Indien
      de examinator en de gecommitteerde daarbij niet tot overeenstemming komen, wordt het geschil voorgelegd aan het
      bevoegd gezag van de gecommitteerde. Dit bevoegd gezag kan hierover in overleg treden met het bevoegd gezag van
      de examinator. Indien het geschil niet kan worden beslecht, wordt hiervan melding gemaakt aan de inspectie. De
      inspectie kan een onafhankelijke corrector aanwijzen. De beoordeling van deze corrector komt in de plaats van de
      eerdere beoordelingen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel31
  - number: '31.2'
    text: |-
      De directeur stelt het cijfer voor het centraal examen in een vak vast op grond van
      de score, bedoeld in het eerste lid, en met inachtneming van de regels, bedoeld in
      [artikel 2, tweede lid, onderdeel e, van de Wet College voor toetsen en examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '32.1'
    text: |-
      Indien het centraal examen naar het oordeel van de inspectie niet op regelmatige wijze heeft plaatsgehad kan zij
      besluiten dat het geheel of gedeeltelijk voor een of meer kandidaten opnieuw wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel32
  - number: '32.2'
    text: |-
      De inspectie verzoekt het College voor toetsen en examens nieuwe opgaven vast te stellen en bepaalt op welke wijze
      en door wie het examen zal worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel32
  - number: '33'
    text: |-
      Indien door onvoorziene omstandigheden het centraal examen in één of meer vakken aan één of meer scholen niet op de
      voorgeschreven wijze kan worden afgenomen, beslist Onze Minister hoe alsdan moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel33
  - number: '34.1'
    text: |-
      Indien een kandidaat om een geldige reden, ter beoordeling van de directeur, is verhinderd bij één of meer toetsen
      in het eerste tijdvak tegenwoordig te zijn, wordt hem in het tweede tijdvak de gelegenheid gegeven het centraal
      examen voor ten hoogste twee toetsen per dag alsnog te voltooien.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel34
  - number: '34.2'
    text: |-
      Indien een kandidaat in het tweede tijdvak evenzeer verhinderd is, of wanneer hij het centraal examen in het tweede
      tijdvak niet kan voltooien, wordt hij in de gelegenheid gesteld in het derde tijdvak ten overstaan van het College
      voor toetsen en examens zijn eindexamen te voltooien.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel34
  - number: '34.3'
    text: |-
      De kandidaat meldt zich zo spoedig mogelijk door tussenkomst van de directeur aan bij het College voor toetsen en
      examens. In dat geval deelt de directeur aan het College voor toetsen en examens mede, wanneer dat zich voordoet,
      dat ten behoeve van de kandidaat toepassing is gegeven aan [artikel 43, eerste, tweede dan wel derde lid][ref1], en
      waaruit deze toepassing bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel43
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '43'
        hoofdstuk: VI
  - number: '34.4'
    text: Na afloop van het derde tijdvak deelt het College voor toetsen en examens het resultaat mede aan de directeur.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel34
  - number: '34.5'
    text: |-
      Indien het bevoegd gezag op grond van [artikel 25, zevende lid][ref1], zelf de afnametijdstippen bepaalt, kan de
      directeur een kandidaat de gelegenheid geven om binnen de afnameperiode die het College voor toetsen en examens
      daarvoor heeft ingesteld, alsnog de toetsen te voltooien waarvoor hij eerder was verhinderd.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel25
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '25'
        hoofdstuk: IV
  - number: '35.1'
    text: |-
      Het eindcijfer voor alle vakken van het eindexamen wordt uitgedrukt in een geheel cijfer uit de reeks 1 tot en
      met 10.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel35
  - number: '35.2'
    text: |-
      De directeur bepaalt het eindcijfer op het rekenkundig gemiddelde van het cijfer voor het schoolexamen en het
      cijfer voor het centraal examen. Indien de uitkomst van de berekening niet een geheel getal is, wordt dat getal
      indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of
      hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel35
  - number: '35.3'
    text: |-
      Indien in een vak alleen een schoolexamen is afgenomen en niet tevens een centraal examen is het cijfer voor het
      schoolexamen tevens het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel35
  - number: '36.1'
    text: |-
      De directeur en de examensecretaris van het eindexamen stellen in geval van een eindexamen de uitslag vast met
      inachtneming van [artikel 37][ref1] of [artikel 37a][ref2], en voor zover van toepassing [artikel 40][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel40
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '40'
        hoofdstuk: V
  - number: '36.2'
    text: De uitslag luidt «geslaagd» of «afgewezen».
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
  - number: '36.3'
    text: |-
      Indien dat nodig is om de kandidaat te laten slagen betrekken de directeur en de examensecretaris van het
      eindexamen een of meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven
      vakken dienen een eindexamen te vormen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
  - number: '36.4'
    text: |-
      Indien de kandidaat aan een instelling voor educatie en beroepsonderwijs examen aflegt in één vak of in een aantal
      vakken die samen geen eindexamen vormen, kan de kandidaat daaraan voorafgaand aan de examencommissie vavo kenbaar
      maken, het volledig eindexamen te willen afleggen door voor de ontbrekende vakken in aanvulling op de cijferlijst
      voor die vakken aan deze examencommissie één of meer van de volgende bewijsstukken te overleggen:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
  - number: 36.4.a
    text: |-
      een of meer in [artikel 39, eerste lid][ref1], of [artikel 40][ref2], bedoelde cijferlijsten van een school voor
      voortgezet onderwijs, uitgereikt in een eerder jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel40
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '39'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '40'
        hoofdstuk: V
  - number: 36.4.b
    text: |-
      een of meer door een andere instelling voor educatie en beroepsonderwijs afgegeven cijferlijsten als bedoeld in
      [artikel 39, eerste lid][ref1], of [41, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel41
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '39'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '41'
        hoofdstuk: V
  - number: 36.4.c
    text: |-
      een of meer cijferlijsten als bedoeld in [artikel 28, eerste of tweede lid][ref1], of
      [artikel 29, eerste lid, van het Staatsexamenbesluit VO BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0029981#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0029981#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0029981
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0029981
        artikel: '29'
  - number: 36.4.d
    text: |-
      een of meer bewijzen van ontheffing als bedoeld in [artikel 9, vierde lid][ref1], van dit besluit, of als bedoeld
      in [artikel 10, vierde lid, van het Staatsexamenbesluit VO BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0029981#Artikel10
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029981
        artikel: '10'
  - number: '36.5'
    text: |-
      Cijferlijsten worden uitsluitend bij de vaststelling van de uitslag betrokken, indien na het jaar waarin zij zijn
      vastgesteld, nog geen 10 jaren zijn verstreken. Bewijzen van ontheffing worden uitsluitend bij de vaststelling
      van de uitslag betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
  - number: '36.6'
    text: |-
      De kandidaat toont in voorkomend geval ten genoegen van de directeur aan dat hij recht heeft op een
      vrijstelling of ontheffing ingevolge de [artikelen 11][ref1], [12][ref2], [13][ref3], [14][ref4],
      [15][ref5], [16][ref6] of [17][ref7], of ingevolge [artikel 8][ref8], van dit besluit, dan wel als bedoeld in
      [artikel 9 van het Staatsexamenbesluit VO BES][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0029990#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0029990#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0029990#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0029990#Artikel17
      [ref8]: https://wetten.overheid.nl/BWBR0029990#Artikel8
      [ref9]: https://wetten.overheid.nl/BWBR0029981#Artikel9
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '13'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0029990
        artikel: '14'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0029990
        artikel: '15'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0029990
        artikel: '16'
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0029990
        artikel: '17'
        hoofdstuk: II
      - id: ref8
        bwb_id: BWBR0029990
        artikel: '8'
        hoofdstuk: II
      - id: ref9
        bwb_id: BWBR0029981
        artikel: '9'
  - number: '36.7'
    text: |-
      De directeur vergewist zich ervan dat het eindexamen de in de [artikelen 11][ref1], [12][ref2], [13][ref3],
      [14][ref4], [15][ref5], [16][ref6] of [17][ref7] voorgeschreven vakken omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0029990#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0029990#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0029990#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0029990#Artikel17
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '13'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0029990
        artikel: '14'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0029990
        artikel: '15'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0029990
        artikel: '16'
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0029990
        artikel: '17'
        hoofdstuk: II
  - number: '36.8'
    text: |-
      Indien de kandidaat eindexamen heeft afgelegd en in datzelfde jaar deelstaatsexamen heeft afgelegd of
      deeleindexamen aan een instelling voor educatie en beroepsonderwijs, worden de met het deelstaatsexamen
      respectievelijk deeleindexamen behaalde cijfers, indien de kandidaat daarom tijdig en schriftelijk heeft verzocht,
      betrokken bij de uitslagbepaling.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel36
  - number: '37.1'
    text: 'De kandidaat die het eindexamen van een leerweg in het vmbo heeft afgelegd, is geslaagd indien:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: 37.1.a
    text: het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: 37.1.b
    text: 'hij:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: 37.1.b.1°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of meer en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: 37.1.b.2°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer waarvan ten minste één 7 of meer heeft behaald; of
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: 37.1.b.3°
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer waarvan ten minste één 7 of meer heeft
      behaald;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: 37.1.c
    text: hij voor geen van de onderdelen, genoemd in het derde of vierde lid, lager dan het eindcijfer 4 heeft behaald;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: 37.1.d
    text: |-
      hij voor de vakken lichamelijke opvoeding en het kunstvak uit het gemeenschappelijk deel de kwalificatie
      «voldoende» of «goed» heeft behaald; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: 37.1.e
    text: |-
      als het een eindexamen gemengde of theoretische leerweg betreft: hij voor het profielwerkstuk de kwalificatie
      «voldoende» of «goed» heeft behaald.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: '37.2'
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de theoretische leerweg het eindcijfer
      van een profielvak of beroepsgericht keuzevak behorende tot het eindexamen van de gemengde leerweg als bedoeld
      in[ artikel 17][ref1] niet betrokken, tenzij deze vakken samen tenminste een volledig beroepsgericht programma
      als bedoeld in artikel 17, eerste lid, onderdeel d, vormen. In dat geval is het vierde lid van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel17
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '17'
        hoofdstuk: II
  - number: '37.3'
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de basisberoepsgerichte leerweg en de
      kaderberoepsgerichte leerweg het gemiddelde van de eindcijfers van alle beroepsgerichte keuzevakken aangemerkt als
      het eindcijfer van één vak.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: '37.4'
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de gemengde leerweg het gemiddelde van de
      eindcijfers van het profielvak en alle beroepsgerichte keuzevakken aangemerkt als het eindcijfer van één vak, met
      dien verstande dat het eindcijfer voor het profielvak daarbij net zo vaak meetelt als het aantal eindcijfers van
      beroepsgerichte keuzevakken dat in de berekening wordt betrokken.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: '37.5'
    text: |-
      De directeur bepaalt het eindcijfer, bedoeld in het derde en vierde lid, als het rekenkundig gemiddelde van de
      eindcijfers van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is,
      wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat
      cijfer een 5 of hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: '37.6'
    text: |-
      In afwijking van het eerste lid, is de kandidaat die het eindexamen vmbo in de basisberoepsgerichte leerweg heeft
      afgelegd ter afsluiting van een leerwerktraject als bedoeld in [artikel 19 van de wet][ref1] geslaagd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel19
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '19'
  - number: 37.6.a
    text: hij voor het vak Nederlandse taal als eindcijfer 5 of meer heeft behaald;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: 37.6.b
    text: hij voor het profielvak als eindcijfer 6 of meer heeft behaald; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: 37.6.c
    text: hij als eindcijfer, bedoeld in het derde lid, 6 of meer heeft behaald.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
  - number: '37.7'
    text: |-
      Zodra de eindcijfers en indien mogelijk de uitslag zijn vastgesteld, maakt de directeur deze schriftelijk aan de
      kandidaat bekend, onder mededeling van het in [artikel 38][ref1] bepaalde. De uitslag is de definitieve uitslag
      indien artikel 38, eerste lid, geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel38
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '38'
        hoofdstuk: V
  - number: 37a.1
    text: 'De kandidaat die eindexamen vwo of havo heeft afgelegd, is geslaagd indien:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.1.a
    text: het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.1.b
    text: |-
      hij voor één van de vakken Nederlandse taal en literatuur, Engelse taal en literatuur en voor zover van toepassing
      wiskunde A, wiskunde B of wiskunde C als eindcijfer 5 of meer heeft behaald en hij voor het andere vak dan wel
      vakken, genoemd in dit subonderdeel als eindcijfer 6 of meer heeft behaald;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.1.c
    text: 'hij onverminderd onderdeel b:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.1.c.1°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of meer en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.1.c.2°
    text: |-
      voor één van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.1.c.3°
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of meer heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt; of
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.1.c.4°
    text: |-
      voor één van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor één van deze vakken als
      eindcijfer 5 heeft behaald en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of
      meer heeft behaald, en het gemiddelde van de eindcijfers ten minste 6,0 bedraagt;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.1.d
    text: hij voor geen van de onderdelen, genoemd in het tweede lid, lager dan het eindcijfer 4 heeft behaald; en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.1.e
    text: |-
      hij voor het vak lichamelijke opvoeding van het gemeenschappelijk deel van elk profiel de kwalificatie «voldoende»
      of «goed» heeft behaald.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.2
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, wordt het gemiddelde van de eindcijfers van ten minste de volgende
      onderdelen aangemerkt als het eindcijfer van één vak, voor zover voor deze onderdelen een eindcijfer is bepaald:
      maatschappijleer, culturele en kunstzinnige vorming en het profielwerkstuk. Het bevoegd gezag kan daaraan
      toevoegen:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.2.a
    text: |-
      literatuur, als onderdeel van alle afzonderlijke moderne talen, met dien verstande dat indien het bevoegd gezag
      daartoe niet besluit, literatuur voor de bepaling van de eindcijfers een onderdeel is van het schoolexamen van de
      desbetreffende taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.2.b
    text: algemene natuurwetenschappen in het havo en vwo;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.2.c
    text: |-
      bij bijzondere scholen: godsdienst of levensbeschouwelijk vormingsonderwijs, met dien verstande dat
      indien het bevoegd gezag daartoe niet besluit, godsdienst of levensbeschouwelijk vormingsonderwijs
      geen onderdeel is van het eindexamen, tenzij Onze Minister daarvoor goedkeuring heeft verleend met
      toepassing van [artikel 11, eerste lid, onder c][ref1], [artikel 12, eerste lid, onder c][ref2], of
      [artikel 13, eerste lid, onder c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel13
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '13'
        hoofdstuk: II
  - number: 37a.3
    text: |-
      Indien het bevoegd gezag toepassing geeft aan de tweede volzin van het tweede lid, wordt in het examenreglement,
      bedoeld in [artikel 18][ref1], vermeld welk onderdeel of welke onderdelen worden toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 37a.4
    text: |-
      De directeur bepaalt het eindcijfer, bedoeld in het tweede lid, als het rekenkundig gemiddelde van de eindcijfers
      van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is, wordt dat getal
      indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of
      hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
  - number: 37a.5
    text: |-
      Zodra de eindcijfers en indien mogelijk de uitslag zijn vastgesteld, maakt de directeur deze schriftelijk aan de
      kandidaat bekend, onder mededeling van het in [artikel 38][ref1] bepaalde. De uitslag is de definitieve uitslag
      indien artikel 38, eerste lid, geen toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel38
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '38'
        hoofdstuk: V
  - number: '38.1'
    text: |-
      De kandidaat heeft voor één vak van het eindexamen waarin hij reeds centraal examen heeft afgelegd, in het tweede
      of, indien [artikel 34, eerste lid][ref1], van toepassing is, derde tijdvak opnieuw deel te nemen aan het centraal
      examen of aan het cspe. Bij het eindexamen van de basis- of kaderberoepsgerichte leerweg in het vmbo, heeft de
      kandidaat het recht, bedoeld in de eerste volzin, ook voor het cspe dat door het bevoegd gezag aansluitend aan
      het eerste of in het tweede tijdvak wordt afgenomen. De herkansing van het cspe bestaat uit het opnieuw afleggen
      van deze toets of van één of meer onderdelen daarvan. De kandidaat heeft het recht, bedoeld in de eerste volzin,
      alleen indien op grond van [artikel 37, vierde lid][ref2], of [artikel 37a, vijfde lid][ref3], de eindcijfers zijn
      bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '34'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: '38.2'
    text: |-
      De kandidaat stelt de directeur voor een door deze laatste te bepalen dag en tijdstip schriftelijk in kennis van
      gebruikmaking van het in het eerste lid bedoelde recht.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel38
  - number: '38.3'
    text: |-
      Het hoogste van de cijfers behaald bij de herkansing en bij het eerder afgelegde centraal examen geldt als
      definitief cijfer voor het centraal examen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel38
  - number: '38.4'
    text: |-
      Na afloop van de herkansing in het laatste leerjaar wordt de uitslag definitief vastgesteld met overeenkomstige
      toepassing van [artikel 36][ref1] en wordt deze schriftelijk aan de kandidaat bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel36
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '36'
        hoofdstuk: V
  - number: '38.5'
    text: |-
      Na afloop van een herkansing in het voorlaatste of direct daaraan voorafgaande leerjaar wordt het eindcijfer
      schriftelijk aan de kandidaat bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel38
  - number: '38.6'
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op de vakken waarin in een examenjaar
      deeleindexamen is afgelegd. De kandidaat die in een examenjaar zowel eindexamen als een of meer deeleindexamens
      aflegt, oefent het in het eerste lid bedoelde recht per examenjaar ten hoogste eenmaal uit.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel38
  - number: 38a
    text: |-
      Indien een kandidaat gebruik heeft gemaakt van de mogelijkheid tot het afleggen van eindexamen in een vak op
      hoger niveau dan het niveau van de schoolsoort of leerweg van inschrijving, stelt de directeur de kandidaat in de
      gelegenheid in dat vak alsnog het eindexamen af te leggen van die schoolsoort of leerweg.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel38a
  - number: '39.1'
    text: |-
      De directeur reikt op grond van de definitieve uitslag aan elke kandidaat die eindexamen heeft afgelegd, een
      cijferlijst uit waarop voor zover van toepassing zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.1.a
    text: de cijfers voor het schoolexamen en de cijfers voor het centraal examen,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.1.b
    text: voor vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.1.c
    text: voor vmbo het thema en de beoordeling van het profielwerkstuk,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.1.d
    text: de beoordeling van het vak lichamelijke opvoeding in vwo en havo,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.1.e
    text: |-
      de beoordeling van het kunstvak en het vak lichamelijke opvoeding uit het gemeenschappelijk deel van de leerweg in
      mavo en vbo,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.1.f
    text: |-
      de eindcijfers voor de examenvakken met inbegrip van het cijfer bepaald op grond van
      [artikel 37a, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: 39.1.g
    text: de uitslag van het eindexamen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: '39.2'
    text: |-
      De directeur reikt op grond van de definitieve uitslag aan elke voor het eindexamen geslaagde kandidaat, daaronder
      mede begrepen de kandidaat die zijn eindexamen met gunstig gevolg heeft voltooid ten overstaan van het College
      voor toetsen en examens, een diploma uit, waarop het profiel of de profielen zijn vermeld die bij de uitslag zijn
      betrokken. Op het diploma vmbo is in elk geval de leerweg vermeld die bij de uitslag is betrokken.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: '39.3'
    text: |-
      Indien een kandidaat in meer vakken examen heeft afgelegd dan in de vakken die ten minste samen een eindexamen
      vormen, worden de vakken die niet bij de bepaling van de uitslag zijn betrokken, op de cijferlijst vermeld, tenzij
      de kandidaat daartegen bedenkingen heeft geuit.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: '39.4'
    text: Onze Minister stelt het model van de cijferlijst vast.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: '39.5'
    text: |-
      Voor de vermelding op de cijferlijst van vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend bij
      het eindexamen geldt het volgende:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.5.a
    text: 'indien het betreft het eindexamen vwo of het eindexamen havo:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.5.a.1°
    text: |-
      de vakken culturele en kunstzinnige vorming en lichamelijke opvoeding van het gemeenschappelijk deel worden
      niet vermeld op de cijferlijst indien de kandidaat het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.5.a.2°
    text: |-
      de vakken maatschappijleer en culturele en kunstzinnige vorming waarvoor de kandidaat bij het eindexamen vwo is
      vrijgesteld op grond van het bezit van een diploma havo, worden niet vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.5.a.3°
    text: |-
      vakken waarvoor de kandidaat is vrijgesteld op grond van [artikel 8][ref1] van dit besluit of
      [artikel 9 van het Staatsexamenbesluit VO BES][ref2], worden vermeld op de cijferlijst, met vermelding van het
      eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029981#Artikel9
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029981
        artikel: '9'
  - number: 39.5.a.4°
    text: |-
      vakken waarvoor de kandidaat bij het eindexamen vwo is vrijgesteld op grond van een eerder afgelegd eindexamen havo
      of eindexamen vmbo waarvan deze vwo-vakken deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van
      het eerder behaalde cijfer;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.5.a.5°
    text: |-
      vakken waarvoor de kandidaat bij het eindexamen havo is vrijgesteld op grond van een eerder afgelegd eindexamen
      vmbo waarvan deze vakken dan wel de overeenkomstige vakken, bedoeld in [artikel 40, achtste lid, van de wet][ref1],
      deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel40
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '40'
  - number: 39.5.a.6°
    text: |-
      andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.5.b
    text: 'indien het betreft het eindexamen vmbo:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.5.b.1°
    text: |-
      de vakken behorende tot de beeldende vorming, muziek, dans, drama en lichamelijke opvoeding van het
      gemeenschappelijk deel worden niet vermeld op de cijferlijst indien de kandidaat het eindexamen aflegt aan een
      instelling voor educatie en beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: 39.5.b.2°
    text: |-
      vakken waarvoor de kandidaat is vrijgesteld op grond van [artikel 8][ref1] van dit besluit of
      [artikel 9 van het Staatsexamenbesluit VO BES][ref2], worden vermeld op de cijferlijst, met vermelding van het
      eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029981#Artikel9
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029981
        artikel: '9'
  - number: 39.5.b.3°
    text: |-
      vakken waarvoor de kandidaat bij het eindexamen vmbo voor zover het betreft de theoretische leerweg, is
      vrijgesteld op grond van een eerder afgelegd eindexamen vmbo voor zover het betreft de kaderberoepsgerichte
      leerweg of de basisberoepsgerichte leerweg waarvan deze vakken dan wel de overeenkomstige vakken, bedoeld in
      [artikel 16, negende lid, van de wet][ref1], deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van
      het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel16
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '16'
  - number: 39.5.b.4°
    text: |-
      vakken waarvoor de kandidaat op grond van [artikel 15, zevende lid][ref1], [artikel 16, vijfde lid][ref2], of
      [artikel 17, vijfde lid][ref3], bij het eindexamen vmbo zijn vrijgesteld, worden vermeld op de cijferlijst, met
      vermelding van het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel17
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '15'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '16'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '17'
        hoofdstuk: II
  - number: 39.5.b.5°
    text: |-
      vakken die op grond van [artikel 14, zevende lid][ref1], zijn gekozen in aanvulling op de daar bedoelde
      voorgeschreven vakken, worden vermeld op de cijferlijst, met vermelding van het daarvoor behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel14
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '14'
        hoofdstuk: II
  - number: 39.5.b.6°
    text: |-
      andere vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, worden vermeld op de cijferlijst,
      zonder vermelding van een cijfer.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: '39.6'
    text: De directeur en de examensecretaris van het eindexamen ondertekenen de diploma’s en de cijferlijsten.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: '39.7'
    text: |-
      Indien de kandidaat in een bepaald jaar is geslaagd voor het eindexamen, draagt de directeur er op verzoek
      van de kandidaat zorg voor dat de behaalde cijfers voor de vakken waarin in datzelfde jaar deeleindexamen of
      deelstaatsexamen is afgelegd, worden vermeld op de cijferlijst.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
  - number: '39.8'
    text: |-
      De directeur van een scholengemeenschap die in elk geval een school voor mavo omvat, reikt op verzoek van de
      kandidaat die met goed gevolg het examen vmbo in de gemengde leerweg aan die school heeft afgelegd en bovendien
      examen heeft afgelegd in een extra algemeen vak en met het meetellen van dat vak voldoet aan [artikel 37][ref1]
      voor zover het betreft de uitslag van het eindexamen vmbo in de theoretische leerweg, het diploma vmbo van de
      theoretische leerweg uit.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
  - number: 39a.1
    text: |-
      Een kandidaat is geslaagd voor het eindexamen vwo met toekenning van het judicium cum laude indien zijn examen
      voldoet aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.1.a
    text: 'ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.1.a.1°
    text: |-
      de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer berekend op grond van
      [artikel 37a, tweede lid][ref1], en de vakken van het profieldeel, en


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: 39a.1.a.2°
    text: het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.1.b
    text: |-
      ten minste het eindcijfer 7 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 37a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: 39a.2
    text: |-
      Een kandidaat is geslaagd voor het eindexamen havo met toekenning van het judicium cum laude indien zijn examen
      voldoet aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.2.a
    text: 'ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.2.a.1°
    text: |-
      de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer berekend op grond van
      [artikel 37a, tweede lid][ref1], en de vakken van het profieldeel, en


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: 39a.2.a.2°
    text: het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.2.b
    text: |-
      ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 37a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: 39a.3
    text: |-
      Een kandidaat is geslaagd voor het eindexamen vmbo theoretische leerweg met toekenning van het judicium cum laude
      indien zijn examen voldoet aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.3.a
    text: 'ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.3.a.1°
    text: de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het profieldeel, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.3.a.2°
    text: het vak uit het vrije deel, waarvoor het hoogste eindcijfer is vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.3.b
    text: |-
      ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor het profielwerkstuk en alle vakken die
      meetellen bij de uitslagbepaling op grond van [artikel 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
  - number: 39a.4
    text: |-
      Een kandidaat is geslaagd voor het eindexamen vmbo basisberoepsgerichte leerweg of kaderberoepsgerichte leerweg met
      toekenning van het judicium cum laude indien zijn examen voldoet aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.4.a
    text: 'ten minste het gemiddelde eindcijfer 8,0, berekend op basis van:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.4.a.1°
    text: de eindcijfers voor het profielvak en de twee algemene vakken van het profieldeel, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.4.a.2°
    text: het eindcijfer berekend op grond van artikel 37, derde lid, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.4.b
    text: |-
      ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
  - number: 39a.5
    text: |-
      Een kandidaat is geslaagd voor het eindexamen vmbo gemengde leerweg met toekenning van het judicium cum laude
      indien zijn examen voldoet aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.5.a
    text: 'ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.5.a.1°
    text: de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het profieldeel, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
  - number: 39a.5.a.2°
    text: |-
      het algemene vak uit het vrije deel of het eindcijfer berekend op grond van [artikel 37, vierde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
  - number: 39a.5.b
    text: |-
      ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor het profielwerkstuk en alle vakken die
      meetellen bij de uitslagbepaling op grond van [artikel 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
  - number: 39b
    text: |-
      De directeur van een scholengemeenschap of school voor vwo die gymnasium verzorgt, kan in plaats van een diploma
      gymnasium een diploma atheneum uitreiken aan een kandidaat indien:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39b
  - number: 39b.a
    text: de scholengemeenschap of school voor vwo atheneum onderwijs verzorgt;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39b
  - number: 39b.b
    text: |-
      de scholengemeenschap of school voor vwo overeenkomstig [artikel 44 van de wet][ref1] kenbaar heeft gemaakt dat het
      behalen van een diploma atheneum en het volgen van atheneumonderwijs mogelijk is; en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel44
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '44'
  - number: 39b.c
    text: de kandidaat staat ingeschreven voor atheneum onderwijs.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel39b
  - number: '40.1'
    text: |-
      Indien de kandidaat een centraal examen of een afsluitend schoolexamen in één of meer vakken heeft afgelegd in
      het voorlaatste of direct daaraan voorafgaande leerjaar en vervolgens de school verlaat zonder het eindexamen te
      voltooien, verstrekt de directeur hem een voorlopige cijferlijst met de behaalde eindcijfers, voor zover deze niet
      op grond van [artikel 26, vijfde lid,][ref1] zijn vervallen. De eerste volzin is van overeenkomstige toepassing op
      de kandidaat die het gespreid centraal examen, bedoeld in [artikel 47][ref2], aflegt.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel47
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '26'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '47'
        hoofdstuk: VI
  - number: '40.2'
    text: |-
      Op de voorlopige cijferlijst worden het vak of de vakken waarin de kandidaat centraal examen heeft afgelegd
      vermeld, alsmede het cijfer van het schoolexamen, het cijfer van het centraal examen en het eindcijfer, met de
      aantekening of gebruik is gemaakt van de herkansingsmogelijkheid.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel40
  - number: '40.3'
    text: |-
      Indien de kandidaat een afsluitend schoolexamen heeft afgelegd wordt de beoordeling of het cijfer daarvan vermeld
      op de voorlopige cijferlijst.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel40
  - number: '40.4'
    text: Onze Minister stelt het model van de voorlopige cijferlijst vast.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel40
  - number: '40.5'
    text: |-
      Aan de voorlopige cijferlijst kunnen geen rechten meer worden ontleend met ingang van het moment waarop aan de
      kandidaat tevens een cijferlijst als bedoeld in [artikel 39, eerste lid][ref1], is uitgereikt die ten minste de
      eindcijfers van de voorlopige cijferlijst omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel39
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '39'
        hoofdstuk: V
  - number: '41.1'
    text: |-
      De examencommissie vavo reikt aan de kandidaat die deeleindexamen heeft afgelegd aan een instelling voor educatie
      en beroepsonderwijs, een cijferlijst uit waarop zijn vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
  - number: 41.1.a
    text: de cijfers voor het schoolexamen en het centraal examen,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
  - number: 41.1.b
    text: voor het vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
  - number: 41.1.c
    text: voor het vmbo het thema alsmede de beoordeling van het profielwerkstuk, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
  - number: 41.1.d
    text: |-
      de eindcijfers voor de examenvakken met inbegrip van het cijfer, bepaald op grond van
      [artikel 37a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: '41.2'
    text: |-
      De examencommissie vavo reikt aan de in het eerste lid bedoelde kandidaat, alsmede aan de kandidaat aan wie
      op grond van de definitieve uitslag niet op grond van [artikel 39, tweede lid][ref1], een diploma kan worden
      uitgereikt, een certificaat uit, waarop zijn vermeld, voor zover van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel39
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '39'
        hoofdstuk: V
  - number: 41.2.a
    text: het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
  - number: 41.2.b
    text: voor het vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
  - number: 41.2.c
    text: voor het vmbo het thema van het profielwerkstuk, voor zover beoordeeld met «goed» of «voldoende».
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
  - number: '41.3'
    text: |-
      De directeur reikt aan de definitief voor het eindexamen vmbo afgewezen kandidaat die de school verlaat en die
      voor een of meer vakken van dat eindexamen een eindcijfer 6 of meer heeft behaald, een certificaat uit, waarop zijn
      vermeld, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
  - number: 41.3.a
    text: het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of meer heeft behaald, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
  - number: 41.3.b
    text: het thema van het profielwerkstuk, voor zover beoordeeld met «goed» of voldoende».
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
  - number: '41.4'
    text: Onze Minister stelt het model van het certificaat en de cijferlijst vast.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel41
  - number: '42.1'
    text: Duplicaten van afgegeven diploma’s, certificaten, bewijzen van ontheffing en cijferlijsten worden niet verstrekt.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel42
  - number: '42.2'
    text: |-
      Een schriftelijke verklaring dat een in het eerste lid bedoeld document is afgegeven, welke verklaring dezelfde
      waarde heeft als dat document zelf, kan uitsluitend door Onze Minister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel42
  - number: '43.1'
    text: |-
      De directeur kan toestaan dat een gehandicapte kandidaat het examen geheel of gedeeltelijk aflegt op een wijze
      die is aangepast aan de mogelijkheden van die kandidaat. In dat geval bepaalt de directeur de wijze waarop het
      examen zal worden afgelegd, met dien verstande dat aan de overige bepalingen in dit besluit wordt voldaan. Hij doet
      hiervan zo spoedig mogelijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel43
  - number: '43.2'
    text: |-
      Tenzij sprake is van een objectief waarneembare lichamelijke handicap, geldt ten aanzien van de in het eerste lid
      bedoelde aangepaste wijze van examineren dat:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel43
  - number: 43.2.a
    text: |-
      er een deskundigenverklaring is die door een ter zake kundige psycholoog, orthopedagoog, neuroloog of psychiater
      is opgesteld,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel43
  - number: 43.2.b
    text: |-
      de aanpassing voor zover betrekking hebbend op het centraal examen in ieder geval kan bestaan uit een verlenging
      van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel43
  - number: 43.2.c
    text: |-
      een andere aanpassing slechts kan worden toegestaan voor zover daartoe in de onder a genoemde deskundigenverklaring
      ten aanzien van betrokkene een voorstel wordt gedaan dan wel indien de aanpassing aantoonbaar aansluit bij de
      begeleidingsadviezen, vermeld in die deskundigenverklaring.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel43
  - number: '43.3'
    text: |-
      Het bevoegd gezag kan in verband met onvoldoende beheersing van de Nederlandse taal afwijken van de voorschriften
      gegeven bij of krachtens dit besluit, ten aanzien van een kandidaat die met inbegrip van het schooljaar waarin hij
      eindexamen aflegt, ten hoogste zes jaren Nederlandstalig onderwijs heeft gevolgd en voor wie het Nederlands niet de
      moedertaal is. De in de eerste volzin bedoelde afwijking kan betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel43
  - number: 43.3.a
    text: het vak Nederlandse taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel43
  - number: 43.3.b
    text: het vak Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel43
  - number: 43.3.c
    text: enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel43
  - number: '43.4'
    text: |-
      De in het derde lid bedoelde afwijking bestaat voor zover betrekking hebbend op het centraal examen slechts uit
      een verlenging van de duur van de desbetreffende toets van het centraal examen met ten hoogste 30 minuten en het
      verlenen van toestemming tot het gebruik van een verklarend woordenboek der Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel43
  - number: '43.5'
    text: Van elke afwijking op grond van het derde lid wordt mededeling gedaan aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel43
  - number: '44.1'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de eindcijfers in het voorlaatste of direct daaraan voorafgaande
      leerjaar, voor zover van toepassing, en na de vaststelling van de definitieve uitslag stuurt het bevoegd gezag aan
      Onze Minister en aan de inspectie een opgave waarop voor de kandidaten voor zover van toepassing zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel44
  - number: 44.1.a
    text: het profiel of de profielen danwel de leerweg waarop het examen betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel44
  - number: 44.1.b
    text: de vakken waarin examen is afgelegd;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel44
  - number: 44.1.c
    text: |-
      de cijfers van het schoolexamen alsmede in voorkomend geval, het vak of de vakken waarop het profielwerkstuk in het
      vwo of havo betrekking heeft en de beoordeling en het thema van het profielwerkstuk in het vmbo;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel44
  - number: 44.1.d
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel44
  - number: 44.1.e
    text: de eindcijfers;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel44
  - number: 44.1.f
    text: de uitslag van het eindexamen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel44
  - number: '44.2'
    text: |-
      Het eerste lid is niet van toepassing op een bevoegd gezag dat op grond van [artikel 179, tweede lid, van de
      wet](onbekend) of op grond van [artikel 2.3.4, tweede lid van de Wet educatie en beroepsonderwijs BES][ref1]
      examengegevens samen met het persoonsgebonden nummer verstrekt aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
  - number: '45.1'
    text: |-
      Het werk van het centraal examen der kandidaten wordt gedurende ten minste zes maanden na de vaststelling van de
      uitslag bewaard door de directeur, ter inzage voor belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel45
  - number: '45.2'
    text: |-
      Een door de directeur en de secretaris van het eindexamen ondertekend exemplaar van de opgave, bedoeld in
      [artikel 44][ref1] wordt gedurende ten minste zes maanden na de vaststelling van de uitslag in het archief van de
      school bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel44
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '44'
        hoofdstuk: VI
  - number: '45.3'
    text: |-
      De directeur draagt er zorg voor dat een volledig stel van de bij de centrale examens gebruikte opgaven gedurende
      ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief van de school.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel45
  - number: '45.4'
    text: |-
      Een kandidaat die voor een vak ten overstaan van het College voor toetsen en examens centraal examen aflegt met
      geheime opgaven, kan omtrent zijn werk gedurende genoemde periode van zes maanden inlichtingen inwinnen bij het
      College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel45
  - number: '46'
    text: |-
      Ten behoeve van experimenten met een andere inrichting van het eindexamen kan Onze Minister toestaan dat van dit
      besluit wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel46
  - number: '47.1'
    text: |-
      Het bevoegd gezag kan, de inspectie gehoord, toestaan dat een kandidaat die in het laatste leerjaar langdurig ziek
      is, en een kandidaat die lange tijd ten gevolge van een bijzondere, van de wil van de kandidaat onafhankelijke
      omstandigheid niet in staat is geweest het onderwijs in alle betrokken eindexamenvakken gedurende het laatste
      leerjaar te volgen, het centraal examen en in voorkomend geval het schoolexamen, voor een deel van de vakken in het
      ene schooljaar en voor het andere deel in het daarop volgende schooljaar aflegt. In dat geval wordt het eindexamen
      in een vak in het eerste of in het tweede van deze schooljaren afgesloten.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47
  - number: '47.2'
    text: |-
      Het bevoegd gezag geeft zijn in het eerste lid bedoelde toestemming uiterlijk voor de aanvang van het eerste
      tijdvak van het centraal examen. In bijzondere gevallen kan het bevoegd gezag afwijken van de eerste volzin ten
      behoeve van een kandidaat die nog niet in alle betrokken eindexamenvakken centraal examen heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47
  - number: '47.3'
    text: |-
      [Artikel 38, eerste tot en met vierde lid][ref1], is ten aanzien van de kandidaat van toepassing in het eerste en
      in het tweede schooljaar van het gespreid centraal examen, met dien verstande dat het in dat artikel bedoelde recht
      in het eerste schooljaar ontstaat nadat de eindcijfers van de vakken waarvoor in het eerste schooljaar het centraal
      examen is afgesloten, voor de eerste maal zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel38
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '38'
        hoofdstuk: V
  - number: '47.4'
    text: |-
      Zo spoedig mogelijk na de vaststelling van de eindcijfers, behaald tot en met het eerste schooljaar van het
      gespreid centraal examen, zendt het bevoegd gezag aan Onze Minister een opgave waarop voor die kandidaat zijn
      vermeld de gegevens, genoemd in [artikel 44, onderdelen a tot en met e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel44
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '44'
        hoofdstuk: VI
  - number: '47.5'
    text: |-
      De directeur en de examensecretaris stellen op verzoek van de kandidaat de uitslag van het eindexamen reeds
      vast aan het einde van het eerste schooljaar van het gespreid centraal examen of het gespreid schoolexamen, met
      overeenkomstige toepassing van [artikel 37][ref1] of [artikel 37a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: 47a
    text: |-
      Onze Minister kan bij of krachtens dit besluit vastgestelde voorschriften buiten toepassing laten of daarvan
      afwijken voor zover onverkorte toepassing zal leiden tot onbillijkheden van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47a
  - number: 47b
    text: |-
      De bepalingen in dit hoofdstuk zijn van toepassing op de eindexamens die worden afgenomen in het schooljaar 2021–
      2022.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47b
  - number: 47c.1
    text: |-
      Het bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo wijzigt
      het examenreglement, bedoeld in [artikel 18, eerste lid][ref1], indien dat ter uitvoering van dit hoofdstuk
      noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47c
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 47c.2
    text: |-
      [Artikel 18, tweede, derde en het zesde lid][ref1], zijn van overeenkomstige toepassing op de wijziging bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47c
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '18'
        hoofdstuk: III
        afdeling: '1'
  - number: 47c.3
    text: |-
      De wijziging, bedoeld in het eerste lid, wordt schriftelijk gemotiveerd en na vaststelling onverwijld door het
      bevoegd gezag van een school voor voortgezet onderwijs respectievelijk de examencommissie vavo aan de inspectie
      gezonden en verstrekt aan de kandidaten.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47c
  - number: 47d.1
    text: De kandidaat kan de toetsen van het centraal examen in het eerste en in het tweede tijdvak voor het eerst afleggen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47d
  - number: 47d.2
    text: |-
      De kandidaat stelt de directeur uiterlijk 22 april op een door de directeur te bepalen wijze in kennis van de
      toetsen van het centraal examen die hij in het eerste of tweede tijdvak voor het eerst wil afleggen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47d
  - number: 47d.3
    text: |-
      Indien de kandidaat de directeur niet overeenkomstig het tweede lid in kennis stelt, laat de directeur uiterlijk
      29 april aan de kandidaat weten welke toetsen van het centraal examen de kandidaat in het eerste en het tweede
      tijdvak voor het eerst aflegt.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47d
  - number: 47d.4
    text: |-
      In aanvulling op [artikel 34, eerste en tweede lid][ref1], geeft de directeur een kandidaat die door te voldoen
      aan de verplichting opgenomen in [artikel 58nh van de Wet publieke gezondheid][ref2], of aan de richtlijnen van
      het Rijksinstituut voor Volksgezondheid en Milieu zoals beschreven in het generiek kader voortgezet onderwijs en
      voortgezet speciaal onderwijs, niet in staat is om één of meerdere toetsen van het centraal examen af te leggen de
      gelegenheid die toetsen in het eerstvolgende tijdvak af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58nh
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47d
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '34'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58nh
  - number: 47e.1
    text: Het derde tijdvak wordt onder verantwoordelijkheid van het bevoegd gezag in het laatste leerjaar afgenomen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47e
  - number: 47e.2
    text: |-
      [Artikel 25, vierde lid][ref1], is van overeenkomstige toepassing op het derde tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel25
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47e
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '25'
        hoofdstuk: IV
  - number: 47e.3
    text: |-
      [Artikel 25, vijfde lid][ref1], is alleen van toepassing op artikel 25, vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel25
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47e
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '25'
        hoofdstuk: IV
  - number: 47e.4
    text: |-
      Het eerste lid is ook van toepassing op het centraal examen, bedoeld in [artikel 26, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel26
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47e
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '26'
        hoofdstuk: IV
  - number: 47e.5
    text: |-
      In [artikel 34, tweede lid][ref1], wordt in plaats van «ten overstaan van het College voor toetsen en examens»
      gelezen «onder verantwoordelijkheid van het bevoegd gezag».


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel34
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47e
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '34'
        hoofdstuk: IV
  - number: 47e.6
    text: |-
      [Artikel 25, derde lid][ref1], [artikel 26, vierde lid][ref2], en [artikel 34, derde en vierde lid][ref3], blijven
      buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel34
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47e
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '25'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '26'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '34'
        hoofdstuk: IV
  - number: 47f.1
    text: |-
      Het schoolexamen van het profielvak en het schoolexamen van het beroepsgericht keuzevak worden uiterlijk 22 juli
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47f
  - number: 47f.2
    text: Het cspe wordt niet afgenomen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47f
  - number: 47f.3
    text: |-
      Het eindexamen van het profielvak wordt afgesloten met een schoolexamen dat de examenstof van het examenprogramma
      van het profielvak beslaat.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47f
  - number: 47f.4
    text: |-
      Het bevoegd gezag biedt de kandidaat een gelegenheid tot herkansing van ten minste een significant onderdeel van
      het schoolexamen in het profielvak.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47f
  - number: 47f.5
    text: |-
      In afwijking van [artikel 21, eerste lid][ref1], wordt het cijfer van het schoolexamen, bedoeld in het derde lid,
      uitgedrukt in een cijfer met 1 decimaal.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel21
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47f
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '21'
        hoofdstuk: III
        afdeling: '2'
  - number: 47f.6
    text: |-
      [Artikel 35, tweede lid][ref1], laatste volzin is van overeenkomstige toepassing op de afronding van het eindexamen
      in het profielvak.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel35
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47f
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '35'
        hoofdstuk: V
  - number: 47f.7
    text: |-
      Het cijfer, bedoeld in het vijfde lid, wordt betrokken bij de berekening van het rekenkundig gemiddelde, bedoeld in
      [artikel 37, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47f
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
  - number: 47f.8
    text: |-
      [Artikel 30][ref1] en [artikel 38, eerste lid][ref2], blijven buiten toepassing voor zover deze bepalingen
      betrekking hebben op het cspe.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel38
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47f
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '30'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '38'
        hoofdstuk: V
  - number: 47g.1
    text: |-
      In afwijking van [artikel 38, eerste lid][ref1], heeft de kandidaat die in het schooljaar 2021–2022 het eindexamen
      afsluit en de kandidaat, bedoeld in [artikel 47, eerste lid][ref2], het recht om voor twee vakken van het
      eindexamen waarin de kandidaat al centraal examen heeft afgelegd, in het tweede of derde tijdvak opnieuw deel te
      nemen aan het centraal examen.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel47
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47g
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '38'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '47'
        hoofdstuk: VI
  - number: 47g.2
    text: |-
      De kandidaat, bedoeld in [artikel 26][ref1], die in het voorlaatste of direct daaraan voorafgaande schooljaar is
      toegelaten tot het eindexamen in één of meerdere vakken kan het recht, bedoeld in het eerste lid, ook toepassen op
      die vakken, met dien verstande dat de kandidaat:


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel26
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47g
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '26'
        hoofdstuk: IV
  - number: 47g.2.a
    text: |-
      het recht bedoeld in het eerste lid niet kan gebruiken voor vakken waarvoor de kandidaat in het schooljaar 2019–
      2020 een resultaatsverbeteringstoets heeft gemaakt;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47g
  - number: 47g.2.b
    text: |-
      in afwijking van het eerste lid, slechts het recht heeft om opnieuw deel te nemen aan het centraal
      examen van één vak indien hij in het schooljaar 2019–2020 voor twee andere vakken dan het profielvak een
      resultaatsverbeteringstoets heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47g
  - number: 47g.3
    text: |-
      In afwijking van [artikel 38, tweede lid][ref1], stelt de kandidaat de directeur op een door de directeur te
      bepalen wijze en voor een door de directeur te bepalen tijdstip in kennis van de vakken die hij in het tweede of
      derde tijdvak herkanst.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel38
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47g
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '38'
        hoofdstuk: V
  - number: 47h.1
    text: |-
      Indien dat nodig is om de kandidaat te laten slagen, laten de directeur en de examensecretaris bij de bepaling van
      de definitieve uitslag op grond van [artikel 36, eerste lid][ref1], het eindcijfer van één vak buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel36
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47h
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '36'
        hoofdstuk: V
  - number: 47h.2
    text: |-
      Een vak bedoeld in het eerste lid kan voor het eindexamen vwo en havo niet bestaan uit het vak Nederlandse taal en
      literatuur, het vak Engelse taal en literatuur en voor zover van toepassing het vak wiskunde A, B of C, bedoeld in
      [artikel 37a, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47h
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: 47h.3
    text: 'Het eindcijfer bedoeld in het eerste lid kan niet zijn:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47h
  - number: 47h.3.a
    text: |-
      het eindcijfer bedoeld in [artikel 37, derde en vierde lid][ref1], voor het eindexamen van een leerweg in het vmbo;


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47h
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
  - number: 47h.3.b
    text: |-
      het eindcijfer bedoeld in [artikel 37a, tweede lid][ref1], voor het eindexamen vwo en havo.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47h
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: 47h.4
    text: |-
      Het eerste lid kan alleen worden toegepast als de kandidaat met inbegrip van het vak dat buiten beschouwing wordt
      gelaten een eindexamen heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47h
  - number: 47h.5
    text: 'Het cijfer, bedoeld in het eerste lid, wordt:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47h
  - number: 47h.5.a
    text: |-
      opgenomen op de cijferlijst als bedoeld in [artikel 39, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel39
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47h
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '39'
        hoofdstuk: V
  - number: 47h.5.b
    text: |-
      betrokken bij de toepassing van [artikel 39a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel39a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47h
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 39a
        hoofdstuk: V
  - number: 47h.6
    text: |-
      Bij de berekening, bedoeld in [artikel 37, vierde lid][ref1], wordt het gewicht van het profielvak bepaald
      voorafgaand aan toepassing van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47h
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
  - number: 47b_bis.1
    text: |-
      Voor de kandidaat die het eindexamen of deeleindexamen voor 1 oktober 2021 afsluit aan een instelling voor educatie
      en beroepsonderwijs, gelden de bij of krachtens het Eindexamenbesluit VO BES gegeven voorschriften zoals deze
      luidden op 31 juli 2021.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47b
  - number: 47b_bis.2
    text: Dit artikel vervalt op bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel47b
  - number: '48'
    text: |-
      De eindexamens, bedoeld in artikel 32 van de Landsverordening voortgezet onderwijs, zoals deze luidde op 9 oktober
      2010, worden voor de laatste maal afgenomen aan het einde van het schooljaar:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel48
  - number: 48.a
    text: |-
      2014–2015 voor de eindexamens voorbereidend secundair beroepsonderwijs als bedoeld in artikel 9 van voornoemde
      landsverordening;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel48
  - number: 48.b
    text: |-
      2015–2016 voor de eindexamens hoger algemeen voortgezet onderwijs als bedoeld in artikel 8 van voornoemde
      landsverordening;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel48
  - number: 48.c
    text: |-
      2016–2017 voor de eindexamens voorbereidend wetenschappelijk onderwijs als bedoeld in artikel 7 van voornoemde
      landsverordening.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel48
  - number: 48a.1
    text: |-
      Het cijfer van het schoolexamen van het profielvak, bedoeld in [artikel 47f, derde lid][ref1], zoals dat
      artikel luidde op 1 mei 2021, wordt betrokken bij de berekening van het rekenkundig gemiddelde, bedoeld in
      [artikel 37 eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel47f
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel37
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 47f
        hoofdstuk: VIa
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
  - number: 48a.2
    text: |-
      De kandidaat, bedoeld in [artikel 26][ref1] en [artikel 47][ref2], die in het schooljaar 2020–2021 het eindexamen
      in het profielvak heeft afgerond behoudt het recht bedoeld in [artikel 38, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel38
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '26'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '47'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '38'
        hoofdstuk: V
  - number: 48a.3
    text: Deze bepaling vervalt op 1 januari 2032.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel48a
  - number: 48b.1
    text: |-
      Het cijfer van het schoolexamen van het profielvak, bedoeld in [artikel 47f, derde lid][ref1], zoals dat
      artikel luidde op 1 mei 2022, wordt betrokken bij de berekening van het rekenkundig gemiddelde, bedoeld in
      [artikel 37, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel47f
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel37
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 47f
        hoofdstuk: VIa
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
  - number: 48b.2
    text: |-
      De kandidaat, bedoeld in [artikel 26][ref1] of [artikel 47][ref2], die in het schooljaar 2021–2022 het
      eindexamen in het profielvak heeft afgerond, behoudt het recht op herkansing van het cspe bedoeld in
      [artikel 38, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel38
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '26'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '47'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '38'
        hoofdstuk: V
  - number: '49.1'
    text: |-
      Dit besluit treedt, met uitzondering van de [artikelen 9, zesde lid][ref1], [39, vierde lid][ref2],
      [40, vierde lid][ref3] en [41, vierde lid][ref4] in werking met ingang van 1 augustus 2011 in Bonaire, Sint
      Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0029990#Artikel41
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '39'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '40'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0029990
        artikel: '41'
        hoofdstuk: V
  - number: '49.2'
    text: |-
      De [artikelen 9, zesde lid][ref1], [39, vierde lid][ref2], [40, vierde lid][ref3] en [41, vierde lid][ref4] treden
      in werking met ingang van 1 januari 2012 in Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0029990#Artikel41
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '39'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '40'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0029990
        artikel: '41'
        hoofdstuk: V
  - number: '50'
    text: 'Dit besluit wordt aangehaald als: Eindexamenbesluit VO BES.'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel50
