  - number: '14.1'
    text: |-
      Het eindexamen vmbo voor zover het betreft de theoretische leerweg, genoemd in [artikel 16 van de wet][ref1], omvat
      in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
  - number: 14.1.a
    text: |-
      de vakken die het gemeenschappelijk deel ingevolge [artikel 16, vijfde lid, van de wet][ref1], omvat,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
  - number: 14.1.b
    text: |-
      de twee vakken die het profieldeel ingevolge [artikel 16, zesde lid, van de wet][ref1] omvat, waaronder tevens
      begrepen een profielwerkstuk, en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
  - number: 14.1.c
    text: |-
      in het vrije deel twee nog niet in het profieldeel gekozen vakken, bedoeld onderscheidenlijk genoemd in
      [artikel 16, zevende lid, onderdelen a en b, van de wet][ref1], met dien verstande dat het profieldeel en het vrije
      deel tezamen ten minste twee vakken omvatten die geen moderne taal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
  - number: '14.2'
    text: |-
      In afwijking van het eerste lid is de kandidaat in de sector economie of leerwegondersteunend onderwijs ten aanzien
      van wie toepassing is gegeven aan [artikel 29, tweede lid, van het Inrichtingsbesluit WVO BES][ref1], bij het
      eindexamen vrijgesteld van het vak Franse taal of het vak Spaanse taal, genoemd [artikel 29, tweede lid][ref2].
      In plaats van het vak waarvoor vrijstelling is verleend, doet de kandidaat eindexamen in het vak Arabisch, het
      vak Turks, het vak Duitse taal, het vak Papiaments, het vak maatschappijleer II, het vak aardrijkskunde of het vak
      geschiedenis en staatsinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '29'
        hoofdstuk: IV
  - number: '14.3'
    text: |-
      In afwijking van het eerste lid is de kandidaat met het profiel economie of met
      leerwegondersteunend onderwijs, ten aanzien van wie toepassing is gegeven aan
      [artikel 29, tweede of derde lid, van het Inrichtingsbesluit WVO BES][ref1], bij het eindexamen vrijgesteld van
      het vak Franse taal of het vak Spaanse taal. In plaats van het vak waarvoor vrijstelling is verleend, doet de
      kandidaat eindexamen in één van de vakken Arabische taal, Turkse taal, Duitse taal, Papiaments, maatschappijkunde,
      geschiedenis en staatsinrichting, of aardrijkskunde.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '29'
  - number: '14.4'
    text: |-
      In geval van toepassing van [artikel 16, negende lid, van de wet][ref1], zijn het eerste tot en met het derde lid
      van toepassing, met dien verstande dat het vervangen vak niet als extra vak als bedoeld in het zevende lid, gekozen
      kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
  - number: '14.5'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs vrijgesteld van de vakken lichamelijke opvoeding en de vakken behorende tot de beeldende vorming,
      muziek, dans of drama van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
  - number: '14.6'
    text: |-
      In afwijking van het eerste lid kan de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, op zijn verzoek bij het eindexamen ontheffing worden verleend van de vakken Franse taal of
      Spaanse taal van het profieldeel of van beide. [Artikel 11, zesde en zevende lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel11
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '11'
        hoofdstuk: II
  - number: '14.7'
    text: |-
      In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover nog
      niet gekozen:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
  - number: 14.7.a
    text: |-
      een vak als bedoeld in [artikel 16, zevende lid, onderdelen a en b, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
  - number: 14.7.b
    text: |-
      een vak dat behoort tot het eindexamen van de gemengde leerweg als bedoeld in [artikel 29 van de wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
  - number: 14.7.c
    text: |-
      een vak genoemd in, dan wel aangewezen op grond van, [artikel 39][ref1] of [40 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel40
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '40'
  - number: '14.8'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor
      vmbo, voor zover het betreft de theoretische leerweg, bij het eindexamen vrijgesteld van de vakken
      waarvoor ontheffing is verleend van het volgende van onderwijs in lichamelijke opvoeding op grond van
      [artikel 29, eerste lid, van het Inrichtingsbesluit WVO BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel14
    references:
