  - number: 5a.3
    text: |-
      1 De minister verstrekt op aanvraag een kleine innovatievoucher aan een MKB-ondernemer als bedoeld in
      [artikel 5a.2, eerste lid][ref1]. [Artikel 5a.2, tweede lid, derde lid, onderdeel a, b en c, en vierde lid][ref2]
      is van overeenkomstige toepassing.

      2 Geen kleine innovatievoucher wordt verstrekt aan een ondernemer aan wie op grond van dit hoofdstuk,
      [hoofdstuk 5][ref3] of de [Subsidieregeling innovatievouchers][ref4] reeds een kleine of grote innovatievoucher
      is verstrekt of aan wie op grond van de [Beleidsregel verstrekking innovatievouchers 2004][ref5],
      de [Beleidsregel verstrekking innovatievouchers pilot 2005][ref6], de
      [Beleidsregel verstrekking innovatievouchers pilot 2005 tweede fase][ref7],
      [artikel 2:22 van de Regeling LNV-subsidies][ref8] of de [Subsidieregeling zorginnovatie][ref9] een
      innovatievoucher is verstrekt.

      3 Geen kleine innovatievoucher wordt verstrekt aan een ondernemer in het kader van een kennisoverdrachtproject dat
      een kennisvraag betreft van een aantal ondernemers gezamenlijk.

      4 Het tweede lid is niet van toepassing indien voorafgaand aan de aanvraag een kleine of grote innovatievoucher
      werd verstrekt ten behoeve van een subsidie krachtens [paragraaf 4 van hoofdstuk 5][ref10] of [paragraaf 4][ref11]
      van de Subsidieregeling innoveren.

      5 Het tweede lid is niet van toepassing indien een verstrekte innovatievoucher op verzoek van de ondernemer die de
      voucher heeft ontvangen, door de minister is ingetrokken voordat deze voucher op grond van [artikel 5a.9][ref12]
      bij de minister is ingeleverd of voordat de geldigheidsduur ervan is verstreken.


