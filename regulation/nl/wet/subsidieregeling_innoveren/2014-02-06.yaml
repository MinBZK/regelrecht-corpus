  - number: '5.4'
    text: |-
      1 De aanvraag door een ondernemer van een grote of kleine innovatievoucher wordt ingediend:

      a. met gebruikmaking van een papieren formulier, dat is opgenomen in de bij deze regeling behorende
      [bijlage 5.1][ref1], en gaat, overeenkomstig hetgeen in het formulier is vermeld, vergezeld van de in het formulier
      aangegeven bescheiden of

      b. op elektronische wijze, met gebruikmaking van het formulier, dat is opgenomen in de bij deze regeling behorende
      [bijlage 5.4][ref2].

      2 Een ondernemer kan ten hoogste één voucher tegelijkertijd aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024855
