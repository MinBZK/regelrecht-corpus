  - number: '4.18'
    text: |-
      1 De minister verstrekt op aanvraag aan de deelnemers in een IPC-verband subsidie voor het uitvoeren van een IPC-
      project, waarbij:

      a. de IPC-penvoerder subsidie ontvangt voor de uitvoering van zijn activiteiten die zijn beschreven in het
      overkoepelende plan en

      b. een IPC-deelnemer subsidie ontvangt voor de uitvoering van zijn innovatieplan.

      2 De subsidiabele kosten voor de activiteiten van een IPC-deelnemer in het kader van een innovatieplan:

      a. bedragen € 30.000 of meer,

      b. bestaan voor ten minste 20 procent uit collectieve activiteiten en

      c. bestaan voor ten minste 60 procent uit overige kosten als bedoeld in [artikel 4.20, eerste lid, onder b][ref1].

      3 In aanvulling op [artikel 3, eerste lid, van het Kaderbesluit EZ-subsidies][ref2] kan ook subsidie worden
      verstrekt aan een IPC-penvoerder of een IPC-deelnemer die gevestigd is in het openbaar lichaam Bonaire, Sint
      Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel4.20
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel3
