        bwb_id: BWBR0024796
        artikel: '13'
  - number: '1.4'
    text: |-
      1 Het uurtarief, bedoeld in [artikel 13, tweede lid, van het Kaderbesluit EZ-subsidies][ref1], bedraagt € 60.

      2 Het uurtarief, bedoeld in [artikel 14 van het Kaderbesluit EZ-subsidies][ref2], bedraagt € 60.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel14
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel1.4
