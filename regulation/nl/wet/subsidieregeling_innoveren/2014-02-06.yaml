  - number: '5.5'
    text: |-
      1 Bij ministeriële regeling wordt bepaald gedurende welke periodes grote innovatievouchers en kleine
      innovatievouchers kunnen worden aangevraagd en wordt per periode bepaald hoeveel grote innovatievouchers en kleine
      innovatievouchers voor binnen dezelfde periode ingediende aanvragen beschikbaar zijn.

      2 De minister verdeelt de beschikbare grote innovatievouchers en kleine innovatievouchers in de
      volgorde van ontvangst van de aanvragen, met dien verstande dat indien een aanvrager niet heeft
      voldaan aan enig voorschrift voor het in behandeling nemen van de aanvraag en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag voldoet aan de voorschriften met betrekking tot de verdeling als datum van ontvangst geldt.

      3 Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare aantal
      grote innovatievouchers of het beschikbare aantal kleine innovatievouchers zou worden overschreden, stelt de
      minister de onderlinge rangschikking van deze aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5.5
