  - number: 5a.1
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

        - *grote innovatievoucher:* een op grond van [artikel 5a.2, eerste lid][ref1], door de minister aan een ondernemer
      afgegeven document, dat deze ondernemer kan inleveren bij een instelling, niet zijnde een kennisinstelling als
      bedoeld in [artikel 5.1][ref2], ten behoeve van de uitvoering van een kennisoverdrachtproject.
        - *kennisoverdrachtproject:* een door een instelling verrichte activiteit, bestaande uit het, al dan niet op
      basis van te verrichten nader onderzoek, beantwoorden van een toepassingsgerichte kennisvraag van een ondernemer
      of ten hoogste tien ondernemers gezamenlijk, uitgaande van voor de ondernemer nieuwe kennis met betrekking tot
      de vernieuwing van producten, productieprocessen of diensten en van welke activiteit de gevolgen naar verwachting
      grotendeels ten goede zullen komen aan de Nederlandse economie. Geen kennisoverdrachtsproject is een project
      waarbij de beantwoording van een toepassingsgerichte kennisvraag plaatsvindt door het leveren van goederen, het
      geven van cursussen of het verrichten van activiteiten op het gebied van verkoop van producten of diensten, zoals
      het ontwikkelen en vervaardigen van marketinginstrumenten en verkoopondersteunend promotiemateriaal;
        - *kleine innovatievoucher:* een op grond van [artikel 5a.3, eerste lid][ref3], door de minister aan een ondernemer
      afgegeven document, dat deze ondernemer kan inleveren bij een instelling, niet zijnde een kennisinstelling als
      bedoeld in [artikel 5.1][ref4], ten behoeve van de uitvoering van een kennisoverdrachtproject.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel5a.2
      [ref2]: https://wetten.overheid.nl/BWBR0024855#Artikel5.1
      [ref3]: https://wetten.overheid.nl/BWBR0024855#Artikel5a.3
      [ref4]: https://wetten.overheid.nl/BWBR0024855#Artikel5.1
