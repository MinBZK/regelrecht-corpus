  - number: '5.11'
    text: |-
      1 Een aanvraag om subsidie wordt na afloop van het kennisoverdrachtproject ingediend en wordt behandeld op volgorde
      van binnenkomst.

      2 De aanvraag moet binnen een jaar nadat de voucher aan de ondernemer is verstrekt, zijn ontvangen. Op een voor het
      einde van de termijn daartoe ingediend schriftelijk verzoek kan de minister deze termijn eenmalig verlengen.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5.11
  - number: '5.12'
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. de ondernemer en de kennisinstelling reeds voor de afgiftedatum van de innovatievoucher verplichtingen jegens
      elkaar zijn aangegaan;

      b. indien op de overgelegde voucher is vermeld dat zij zal worden gebruikt voor subsidiëring krachtens paragraaf 4
      van dit hoofdstuk;

      c. de ondernemer de innovatievoucher aangewend heeft voor een kennisoverdrachtproject waarvoor reeds door een
      bestuursorgaan of de Commissie van de Europese Gemeenschappen subsidie is verstrekt of dat deel uitmaakt van een
      project of programma waarvoor reeds door een bestuursorgaan of de Commissie van de Europese Gemeenschappen subsidie
      is verstrekt.

      2 De afwijzingsgronden, genoemd in [artikel 23 van het Kaderbesluit EZ-subsidies][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
