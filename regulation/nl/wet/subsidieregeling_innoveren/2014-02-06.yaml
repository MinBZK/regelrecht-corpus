        hoofdstuk: '4'
        paragraaf: '4'
  - number: '4.20'
    text: |-
      1 In afwijking van [artikel 11 van het Kaderbesluit EZ-subsidies][ref1] komen, voor activiteiten bedoeld in
      [artikel 4.18, eerste lid, onderdeel b][ref2], uitsluitend de volgende kosten voor subsidie in aanmerking:

      a. het aantal uren gemaakt door personeel van de IPC-deelnemer of personeel van ondernemingen waarmee de IPC-
      deelnemer in een groep verbonden is, vermenigvuldigd met een vast uurtarief van € 60;

      b. de specifiek ten behoeve van de uitvoering van het innovatieplan gemaakte overige kosten.

      2 In afwijking van het eerste lid komen de volgende kosten niet voor subsidie in aanmerking: de kosten van
      het maken van een innovatieplan; de kosten van implementatie van de innovatie, waaronder begrepen marketing-
      en salesactiviteiten, herhalingstesten en het inrichten van de productie; de kosten van het opzetten van
      kwaliteitssystemen; de kosten van opleidingen; de kosten van deelname aan tentoonstellingen en symposia; de
      reiskosten en kosten die verband houden met penvoerdersactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0024855#Artikel4.18
