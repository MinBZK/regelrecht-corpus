  - number: '6.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *operationele eindgebruiker:* de ambulancesector, de brandweerorganisatie, defensie, de politieorganisatie en
      overige publieke operationele veiligheidsorganisaties;
        - *veiligheidsproject:* een planmatig geheel van activiteiten bestaande uit industrieel onderzoek, experimentele
      ontwikkeling of een combinatie daarvan op het terrein van de maatschappelijke veiligheid dat past binnen de thema’s
      • Optreden in ketens en netwerken, • Opleiden en trainen met behulp van geavanceerde simulatie, of • Fysieke
      bescherming van de Maatschappelijke Innovatieagenda Veiligheid, zoals omschreven in [bijlage 6.1][ref1] en dat
      leidt tot technologische vernieuwing of wezenlijk nieuwe toepassingen van een bestaande technologie.


      [ref1]: https://wetten.overheid.nl/BWBR0024855
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0024855
  - number: '6.2'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een ondernemer die of een deelnemer in een samenwerkingsverband dat
      een veiligheidsproject uitvoert.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel6.2
  - number: '6.3'
    text: |-
      1 Het samenwerkingsverband bestaat uit hetzij twee of meer ondernemers, hetzij een of meer ondernemers en een of
      meer onderzoeksorganisaties.

      2 De penvoerder is een ondernemer.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel6.3
  - number: '6.4'
    text: De minister verdeelt het beschikbare bedrag op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel6.4
  - number: '6.5'
    text: |-
      1 Er is een Adviescommissie innovatie voor maatschappelijke veiligheid, die tot taak heeft de minister
      op zijn verzoek te adviseren omtrent de afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en
      [23 van het Kaderbesluit EZ-subsidies][ref2] en [artikel 6.7][ref3] en de rangschikkingscriteria, bedoeld in
      [artikel 6.8][ref4].

      2 De commissie bestaat uit ten minste vijf en ten hoogste zeven leden.

      3 De voorzitter en de andere leden worden benoemd voor een termijn van ten hoogste vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0024855#Artikel6.7
      [ref4]: https://wetten.overheid.nl/BWBR0024855#Artikel6.8
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0024855
        artikel: '6.7'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0024855
        artikel: '6.8'
        hoofdstuk: '6'
  - number: '6.6'
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1] is twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '6.7'
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. indien uit de aanvraag om subsidie voor het veiligheidsproject geen betrokkenheid blijkt van het operationele
      veld;

      b. voor zover het gevraagde subsidiebedrag voor het veiligheidsproject hoger is dan € 1.500.000;

      c. indien van het veiligheidsproject onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten
      zijn.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel6.7
  - number: '6.8'
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate;

      a. de bijdrage aan technologische vernieuwing of aan wezenlijk nieuwe toepassingen van een bestaande technologie
      voor maatschappelijke veiligheid groter is;

      b. meer wordt bijgedragen aan het creëren van een veiliger Nederland;

      c. de doelmatigheid en doeltreffendheid van het project groter is;

      d. de projectresultaten meer economische waarde creëren, beter wordt aangesloten bij de doelstellingen van de
      deelnemende ondernemingen en de toepassingsmogelijkheden van de projectresultaten uitgebreider zijn.

      2 Voor de rangschikking wegen de in het eerste lid vermelde criteria even zwaar.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel6.8
  - number: '6.9'
    text: |-
      Het formulier voor het indienen van een aanvraag voor:

      a. een subsidie is opgenomen in [bijlage 6.2][ref1];

      b. een subsidievaststelling is opgenomen in [bijlage 2.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024855
      [ref2]: https://wetten.overheid.nl/BWBR0024855
