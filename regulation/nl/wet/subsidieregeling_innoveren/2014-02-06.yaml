  - number: 5a.16
    text: |-
      1 De subsidie-ontvanger verleent medewerking aan een evaluatie van de toepassing van dit hoofdstuk, voor zover deze
      medewerking redelijkerwijs van hem verlangd kan worden.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5a.16
  - number: 5b.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *jonggehandicapte:* de jonggehandicapte, bedoeld in [artikel 2:3][ref1] of
      [artikel 3:2 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref2];
        - *minister van SZW:* Minister van Sociale Zaken en Werkgelegenheid;
        - *re-integratiebedrijf:* een natuurlijke persoon dan wel rechtspersoon die in het kader van de uitoefening van
      beroep of bedrijf de inschakeling van personen in de arbeid bevordert;
        - *Wajong adviesvoucher:* een op grond van [artikel 5b.3, eerste lid][ref3], door de minister van SZW aan een
      ondernemer afgegeven document, dat deze ondernemer kan inleveren bij een door de minister van SZW aangewezen re-
      integratiebedrijf ten behoeve van een onderzoek naar en advies over de mogelijkheden om binnen het bedrijf van de
      ondernemer werkzaamheden in dienstbetrekking door jonggehandicapten te laten uitvoeren.


