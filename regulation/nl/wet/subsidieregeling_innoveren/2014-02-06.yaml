      1 De subsidie-ontvanger verleent medewerking aan een evaluatie van de toepassing van dit hoofdstuk, voor zover deze
      medewerking redelijkerwijs van hem verlangd kan worden.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5.13
  - number: '5.14'
    text: |-
      De minister verstrekt op aanvraag aan een ondernemer, die een op grond van [paragraaf 2][ref1] van dit hoofdstuk of
      [paragraaf 2 van de Subsidieregeling innovatievouchers][ref2] verstrekte innovatievoucher overlegt, een subsidie in
      de kosten van het aanvragen en verkrijgen van één of meer octrooien, indien dat doel bij de aanvraag om de voucher
      is aangegeven en op de verstrekte voucher is vermeld.


