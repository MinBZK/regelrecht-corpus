        bwb_id: BWBR0024855
  - number: 5b.15
    text: |-
      1 De subsidie-ontvanger verleent medewerking aan een evaluatie van de toepassing van dit hoofdstuk, voor zover deze
      medewerking redelijkerwijs van hem verlangd kan worden.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.

      3 De subsidie-ontvanger verleent aan de toezichthouders op de toepassing van dit hoofdstuk alle medewerking die
      dezen redelijkerwijs kunnen vorderen bij de uitoefening van hun bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5b.15
  - number: 5c.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *kennisoverdrachtproject elektrische mobiliteit:* een door een kennisinstelling verrichte activiteit, bestaande
      uit het, al dan niet op basis van te verrichten nader onderzoek, beantwoorden van een toepassingsgerichte
      kennisvraag van een MKB-ondernemer gericht op het versterken van innovatie op het gebied van elektrische
      mobiliteit, uitgaande van voor de ondernemer nieuwe kennis met betrekking tot de ontwikkeling van producten,
      productieprocessen, diensten of bijdragen aan een business case, zoals het uitvoeren van haalbaarheidsonderzoek,
      literatuurstudie, testwerk en algemeen marktonderzoek, het opstellen van een innovatie- of marktstrategie, en het
      ontwikkelen of vernieuwen van producten of processen. Geen kennisoverdrachtproject is in ieder geval een project
      waarbij de beantwoording van een toepassingsgerichte kennisvraag plaatsvindt door het leveren van goederen,
      het geven van cursussen, het verrichten van activiteiten op het gebied van verkoop van producten of diensten,
      zoals het ontwikkelen en vervaardigen van marketinginstrumenten en verkoopondersteunend promotiemateriaal, de
      automatisering van boekhouding en procesautomatisering, het uitvoeren van octrooionderzoek of octrooiaanvraag door
      de kennisinstellingen alsmede organisatieonderzoek en duurzaamheidsonderzoek, of sociale innovatie;
        - a) elektrische voertuigen; b) elektrische vaartuigen; c) elektrische oplaadpunten; d) componenten van elektrische
      voertuigen, elektrische vaartuigen en elektrische oplaadpunten, die essentieel zijn om elektrisch te rijden, en e)
      diensten, die gekoppeld zijn aan elektrische voertuigen, elektrische vaartuigen en elektrische oplaadpunten;
        - *elektrische voertuigen:* voertuigen voorzien van een elektromotor als hoofdmotor en een accu, eventueel in
      combinatie met een verbrandingsmotor, waarvan de accu kan worden opgeladen door middel van een oplaadvoorziening
      buiten het voertuig, niet zijnde een fiets, vorkheftruck, scootmobiel, tram of een metro, en die voldoen aan de
      volgende eisen: a) voor voertuigen met kenteken een CO-uitstoot van minder dan 50 gram per kilometer is, of b) voor
      voertuigen zonder kenteken een actieradius van ten minste 50 kilometer op een volle accu is, en c) zijn bestemd
      voor vervoer over de openbare weg of op bedrijfsterreinen in de open lucht;
        - *elektrische vaartuigen:* vaartuigen bestemd voor personen- of goederenvervoer, die voor de voortstuwing voorzien
      zijn van uitsluitend een elektromotor of een elektromotor als hoofdmotor, gecombineerd met een verbrandingsmotor
      (hybride);
        - *elektrische oplaadpunten:* oplaadpunten voor het laden van accu's van voer- of vaartuigen, die een elektromotor
      als hoofdmotor hebben;
        - *kennisinstelling:* een kennisinstelling als bedoeld in [artikel 5.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5c.1
    references:
