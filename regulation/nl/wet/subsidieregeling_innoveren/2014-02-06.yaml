  - number: '4.21'
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel4.21
  - number: '4.22'
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1], is twee jaar en wordt
      gerekend vanaf de aanvang van de activiteiten, bedoeld in [artikel 4.18, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024855#Artikel4.18
