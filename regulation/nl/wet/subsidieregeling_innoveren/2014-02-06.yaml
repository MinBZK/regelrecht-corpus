  - number: '5.10'
    text: |-
      1 De kosten die in aanmerking komen voor subsidie op grond van deze paragraaf zijn de in [artikel 5.9][ref1]
      bedoelde kosten met dien verstande dat:

      a. de door de kennisinstelling gemaakte kosten voor maximaal de helft bestaan uit kosten die de kennisinstelling
      heeft gemaakt doordat de kennisinstelling het onderzoek in het kader van het kennisoverdrachtproject gedeeltelijk
      heeft uitbesteed aan een derde, niet zijnde een bij dat kennisoverdrachtproject betrokken aanvrager;

      b. geen subsidie wordt verstrekt voor zover het onderzoek is uitbesteed aan een persoon, die ook een
      dienstbetrekking heeft met de kennisinstelling;

      c. indien de in onderdeel a bedoelde helft van de kosten wordt overschreden, de door de kennisinstelling gemaakte
      kosten, in aanmerking te nemen bij de toepassing van [artikel 5.9, eerste lid][ref2], tweemaal de kosten bedragen
      van het eigen onderzoek van de kennisinstelling;

      d. niet subsidiabel zijn kosten die in het kader van stages van studenten van kennisinstellingen worden gemaakt,
      noch kosten voor activiteiten waarvoor studenten studiepunten krijgen.

      2 De [artikelen 10 tot en met 14 van het Kaderbesluit EZ-subsidies][ref3] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel5.9
