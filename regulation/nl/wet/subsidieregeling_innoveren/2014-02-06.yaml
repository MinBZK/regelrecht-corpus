        bwb_id: BWBR0024855
  - number: 5a.5
    text: |-
      1 Bij ministeriële regeling wordt bepaald gedurende welke periodes grote innovatievouchers en kleine
      innovatievouchers kunnen worden aangevraagd en wordt per periode bepaald hoeveel grote innovatievouchers en kleine
      innovatievouchers voor binnen dezelfde periode ingediende aanvragen beschikbaar zijn.

      2 De minister verdeelt de beschikbare grote innovatievouchers en kleine innovatievouchers in de
      volgorde van ontvangst van de aanvragen, met dien verstande dat indien een aanvrager niet heeft
      voldaan aan enig voorschrift voor het in behandeling nemen van de aanvraag en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag voldoet aan de voorschriften met betrekking tot de verdeling als datum van ontvangst geldt.

      3 Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare aantal
      grote innovatievouchers of het beschikbare aantal kleine innovatievouchers zou worden overschreden, stelt de
      minister de onderlinge rangschikking van deze aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5a.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: 5a.6
    text: De minister geeft een beschikking binnen zes weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5a.6
  - number: 5a.7
    text: |-
      1 De ondernemer sluit in overleg met een adviseur van Syntens een overeenkomst met een instelling over de besteding
      van de voucher.

      2 Syntens stuurt een advies over de besteding van de voucher aan de ondernemer en de minister.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5a.7
  - number: 5a.8
    text: |-
      De minister kan een beschikking tot verlening van een voucher intrekken indien:

      a. het niet aannemelijk is dat de activiteiten die met de voucher zullen worden bekostigd een
      kennisoverdrachtproject vormen;

      b. de beoogde activiteiten onvoldoende bijdragen aan nieuwe producten, diensten en processen bij de ondernemer;

      c. onvoldoende vertrouwen bestaat dat de instelling in staat is om de benodigde inzet of expertise voor het
      kennisoverdrachtproject te leveren of de expertise heeft om de kennisvraag van de ondernemer te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5a.8
  - number: 5a.9
    text: |-
      De minister verstrekt op aanvraag een subsidie aan een instelling, niet zijnde een kennisinstelling als bedoeld
      in [artikel 5.1][ref1], die een kennisoverdrachtproject heeft uitgevoerd en in verband daarmee een of meer geldige
      grote innovatievouchers of een geldige kleine innovatievoucher overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5a.9
    references:
      - id: ref1
        bwb_id: BWBR0024855
        artikel: '5.1'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5a.11
    text: |-
      1 De subsidie bedraagt 50 procent van het bedrag van de door de instelling voor het kennisoverdrachtsproject
      gemaakte kosten, exclusief eventueel in rekening te brengen omzetbelasting, maar niet meer dan € 3750, dan wel het
      krachtens [artikel 5a.2, vierde lid][ref1], op de voucher vermelde bedrag per overgelegde grote innovatievoucher
      en, indien het kennisoverdrachtsproject gericht is op beantwoorden van een kennisvraag van meerdere ondernemers
      gezamenlijk, niet meer dan € 37.500 in totaal.

      2 De subsidie bedraagt het bedrag van de door de instelling voor het kennisoverdrachtproject gemaakte kosten,
      exclusief eventueel in rekening te brengen omzetbelasting, maar niet meer dan € 2500 dan wel het krachtens
      [artikel 5a.2, vierde lid][ref2], op de voucher vermelde bedrag voor de overgelegde kleine innovatievoucher.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel5a.2
      [ref2]: https://wetten.overheid.nl/BWBR0024855#Artikel5a.2
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5a.11
    references:
