    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een IPC-penvoerder voor het verkennen van de mogelijkheden
      voor samenwerking van MKB-bedrijven met een of meer ondernemingen of publieke kennisinstellingen resulterend
      in een rapportage waarin zijn opgenomen innovatieonderwerpen waarop met een of meer ondernemingen of publieke
      kennisinstellingen kan worden samengewerkt, een inventarisatie van mogelijke IPC-deelnemers en een voorstel voor
      samenwerkingsprojecten.

      2 In aanvulling op [artikel 3, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] kan ook subsidie worden
      verstrekt aan een IPC-penvoerder die gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.


