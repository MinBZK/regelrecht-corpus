        artikel: '10'
  - number: 5a.13
    text: |-
      1 Een aanvraag om subsidie wordt na afloop van het kennisoverdrachtproject ingediend en wordt behandeld op volgorde
      van binnenkomst.

      2 De aanvraag moet binnen een jaar nadat de voucher aan de ondernemer is verstrekt, zijn ontvangen. Op een voor het
      einde van de termijn daartoe ingediend schriftelijk verzoek kan de minister deze termijn eenmalig verlengen.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5a.13
  - number: 5a.14
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. de ondernemer en de instelling reeds voor de afgiftedatum van de innovatievoucher verplichtingen jegens elkaar
      zijn aangegaan;

      b. de uitvoering van het kennisoverdrachtproject in belangrijke mate afwijkt van de overeenkomst, bedoeld in
      [artikel 5a.7][ref1];

      c. de ondernemer en de instelling verbonden zijn in een groep;

      d. de ondernemer de innovatievoucher aangewend heeft voor een kennisoverdrachtproject waarvoor reeds door een
      bestuursorgaan of de Commissie van de Europese Gemeenschappen subsidie is verstrekt of dat deel uitmaakt van een
      project of programma waarvoor reeds door een bestuursorgaan of de Commissie van de Europese Gemeenschappen subsidie
      is verstrekt.

      2 De afwijzingsgronden, genoemd in [artikel 23 van het Kaderbesluit EZ-subsidies][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel5a.7
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5a.14
