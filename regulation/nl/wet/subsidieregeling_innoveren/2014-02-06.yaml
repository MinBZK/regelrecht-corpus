  - number: '4.23'
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. indien het overkoepelende plan niet het vertrouwen geeft dat de IPC-penvoerder de begeleiding van de IPC-
      deelnemers bij het uitvoeren van hun innovatieplannen en de totstandkoming en begeleiding van de in het plan
      opgenomen samenwerkingsprojecten naar behoren kan uitvoeren;

      b. voor zover voor dezelfde werkzaamheden met dezelfde IPC-deelnemers reeds op grond van deze paragraaf subsidie is
      verleend of in dezelfde periode is aangevraagd;

      c. indien aan een IPC-deelnemer eerder subsidie is verstrekt krachtens dit hoofdstuk of de Subsidieregeling
      innovatieprestatiecontracten, en

      1°. tussen de datum waarop het IPC-project start en de datum waarop het vorige IPC-project is gestart, een periode
      verstreken is van minder dan drie jaar, of

      2°. de IPC-deelnemer toestemming heeft verkregen om het IPC-project in een langere periode dan drie jaar af te
      ronden, maar binnen die toegestane aanvullende periode een nieuw IPC-project start;

      d. indien de datum waarop het IPC-project start, meer dan zes maanden na de datum van de ontvangst van de
      subsidieaanvraag ligt;

      e. uit het innovatieplan onvoldoende blijkt dat de IPC-deelnemer activiteiten verricht die gericht zijn op
      innovatie van zijn producten, diensten of processen.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel4.23
  - number: '4.24'
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. er sprake is van meer innovatie;

      b. de kwaliteit van de samenwerking hoger is.

      2 Voor de rangschikking telt het criterium a voor 60 procent en het criterium b voor 40 procent.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel4.24
  - number: '4.25'
    text: |-
      1 Voor subsidies boven de € 25.000 bedraagt de hoogte van het eerste voorschot 100 procent van de maximale hoogte
      van de subsidie. De hoogte van de overige voorschotten, indien van toepassing, bedraagt 0 procent van de maximale
      hoogte van de subsidie.

      2 [Artikel 39, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] is niet van toepassing op subsidies boven de
      € 25.000.

      3 Indien de door de minister verleende subsidie meer bedraagt dan € 25.000, wordt deze subsidie ambtshalve
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel39
