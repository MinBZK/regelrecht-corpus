  - number: 5a.12
    text: |-
      1 De kosten die in aanmerking komen voor subsidie op grond van deze paragraaf zijn de in [artikel 5a.11][ref1]
      bedoelde kosten met dien verstande dat geen subsidie wordt verstrekt voor zover het onderzoek is uitbesteed aan
      een derde.

      2 De [artikelen 10 tot en met 14 van het Kaderbesluit EZ-subsidies][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel5a.11
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel10
