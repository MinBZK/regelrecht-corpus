  - number: '4.7'
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a.

      b. de IPC-penvoerder niet aannemelijk maakt dat er een aanzienlijke kans is dat de subsidiabele activiteiten zullen
      leiden tot het tot stand komen van een IPC-verband, waarvan de deelnemers overeenkomstig [paragraaf 4][ref1] van
      dit hoofdstuk voor subsidie in aanmerking komen en de IPC-penvoerder niet het vertrouwen geeft in staat te zijn om
      de daarbij benodigde inzet te leveren;

      c. van de activiteiten onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn;

      d. in dezelfde indieningsperiode reeds subsidie is aangevraagd op grond van deze paragraaf voor dezelfde
      activiteiten door een andere organisatie als bedoeld in [artikel 4.3, eerste lid][ref2].


