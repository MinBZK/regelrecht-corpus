articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *experimentele ontwikkeling:* experimentele ontwikkeling als bedoeld in paragraaf 2.2, onder g, van de
      Communautaire kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie, nr. 2006/C 323/01
      (PbEU C 323);
        - *industrieel onderzoek:* industrieel onderzoek als bedoeld in paragraaf 2.2, onder f, van de Communautaire
      kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie, nr. 2006/C 323/01 (PbEU C 323);
        - *minister:* de Minister van Economische Zaken, Landbouw en Innovatie.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel1.1
  - number: '1.2'
    text: |-
      1 Het rapport van feitelijke bevindingen, bedoeld in
      [artikel 12, derde lid, van het Kaderbesluit EZ-subsidies][ref1], wordt opgesteld overeenkomstig het protocol dat
      is opgenomen in [bijlage 1.1][ref2] bij deze regeling.

      2 Als rapport als bedoeld in [artikel 12, vierde lid, van het Kaderbesluit EZ-subsidies][ref3] wordt aangewezen
      een afschrift van het rapport van feitelijke bevindingen van een externe accountant inzake de actueel gebruikte
      methode voor berekening van de personeelskosten en indirecte kosten dat is opgesteld in het kader van [verordening
      (EG) nr. 1906/2006](32006R1906) van het Europees Parlement en de Raad van de Europese Unie van 18 december 2006
      tot vaststelling van de regels voor de deelname van ondernemingen, onderzoekscentra en universiteiten aan acties
      op grond van het zevende kaderprogramma, en voor verspreiding van onderzoeksresultaten (2007–2013) (PbEU L 391)
      en, indien de subsidie-ontvanger daarover beschikt, een afschrift van de goedkeuring door de Europese Commissie van
      dat rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024855
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel12
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel1.2
