  - number: '5.6'
    text: De minister geeft een beschikking binnen zes weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5.6
  - number: '5.7'
    text: |-
      De minister verstrekt op aanvraag een subsidie aan een kennisinstelling die een kennisoverdrachtproject heeft
      uitgevoerd en in verband daarmee een of meer geldige grote innovatievouchers of een geldige kleine innovatievoucher
      overlegt.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5.7
  - number: '5.9'
    text: |-
      1 De subsidie bedraagt tweederde deel van het bedrag van de door de kennisinstelling voor het
      kennisoverdrachtproject gemaakte kosten, exclusief eventueel in rekening te brengen omzetbelasting, maar niet meer
      dan € 5000, dan wel het krachtens [artikel 5.2, vierde lid][ref1], op de voucher vermelde bedrag per overgelegde
      grote innovatievoucher en, indien het kennisoverdrachtproject gericht is op het beantwoorden van een kennisvraag
      van meerdere ondernemers gezamenlijk, niet meer dan € 50.000 in totaal.

      2 De subsidie bedraagt het bedrag van de door de kennisinstelling voor het kennisoverdrachtproject gemaakte
      kosten, exclusief eventueel in rekening te brengen omzetbelasting, maar niet meer dan € 2500 dan wel het krachtens
      [artikel 5.2, vierde lid][ref2], op de voucher vermelde bedrag voor de overgelegde kleine innovatievoucher.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0024855#Artikel5.2
