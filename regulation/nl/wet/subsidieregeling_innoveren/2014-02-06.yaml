  - number: 5b.3
    text: |-
      1 De minister van SZW verstrekt op aanvraag een Wajong adviesvoucher aan een ondernemer die een onderzoek wil laten
      uitvoeren naar de mogelijkheden om een jonggehandicapte werkzaamheden in dienstbetrekking binnen zijn bedrijf te
      laten uitvoeren.

      2 De aanvraag, bedoeld in het eerste lid, kan worden ingediend van 15 februari 2010 tot en met 29 april 2011.

      3 Per ondernemer kan één Wajong adviesvoucher worden verstrekt. Per franchiseketen kunnen ten hoogste 100 Wajong
      adviesvouchers worden verstrekt.

      4 Geen Wajong adviesvoucher wordt verstrekt aan een ondernemer:

      a. die failliet is verklaard, aan wie surseance van betaling is verleend, ten aanzien van wie de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, of voor wie een verzoek daartoe bij de
      rechtbank is ingediend;

      b. die reeds eerder een aanvraag om verstrekking van een Wajong adviesvoucher op grond van dit hoofdstuk heeft
      gedaan waarop de minister van SZW nog geen beschikking heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5b.3
  - number: 5b.4
    text: |-
      De aanvraag van een Wajong adviesvoucher door een ondernemer wordt ingediend met gebruikmaking van een formulier,
      dat is opgenomen in de bij deze regeling behorende [bijlage 5b.1][ref1], en gaat, overeenkomstig hetgeen in het
      formulier is vermeld, vergezeld van de in het formulier aangegeven bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0024855
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5b.4
    references:
      - id: ref1
        bwb_id: BWBR0024855
  - number: 5b.5
    text: |-
      1 Er zijn 1000 Wajong adviesvouchers beschikbaar.

      2 De minister van SZW verdeelt de beschikbare Wajong adviesvouchers in de volgorde van ontvangst van de aanvragen,
      met dien verstande dat indien een aanvrager niet heeft voldaan aan enig voorschrift voor het in behandeling nemen
      van de aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft
      gehad de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de voorschriften met betrekking tot de
      verdeling als datum van ontvangst geldt.

      3 Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare aantal
      Wajong adviesvouchers zou worden overschreden en de volgorde van die aanvragen niet kan worden vastgesteld, stelt
      de minister van SZW de onderlinge rangschikking van deze aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5b.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: 5b.6
    text: |-
      De minister van SZW geeft een beschikking binnen zes weken na ontvangst van de aanvraag om een Wajong
      adviesvoucher. Indien een beschikking niet binnen de termijn van zes weken kan worden gegeven, wordt die termijn
      met een redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5b.6
  - number: 5b.7
    text: |-
      De ondernemer die een Wajong adviesvoucher heeft ontvangen sluit een overeenkomst met een door de minister van SZW
      aangewezen re-integratiebedrijf over de besteding van de voucher.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5b.7
  - number: 5b.8
    text: |-
      De minister van SZW verstrekt op aanvraag een subsidie aan een door hem aangewezen re-integratiebedrijf, indien dat
      re-integratiebedrijf een onderzoek naar de mogelijkheden om een jonggehandicapte werkzaamheden in dienstbetrekking
      binnen het bedrijf van een ondernemer te laten verrichten heeft uitgevoerd en in verband daarmee een:

      a. geldige Wajong adviesvoucher; en

      b. een door de ondernemer, die opdracht heeft gegeven tot het onderzoek, getekende verklaring dat het onderzoek
      is uitgevoerd;

      overlegt.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5b.8
  - number: 5b.9
    text: |-
      1 Een re-integratiebedrijf als bedoeld in [artikel 5b.8][ref1] kan op aanvraag door de minister van SZW worden
      aangewezen, indien dat bedrijf in ieder geval:

      a. is ingeschreven bij de Kamer van Koophandel dan wel het nationale beroepshandelsregister, of een daarmee
      vergelijkbaar buitenlands register;

      b. heeft aangegeven dat de onderzoeken naar de mogelijkheden om een jonggehandicapte werkzaamheden in
      dienstbetrekking binnen het bedrijf van een ondernemer te laten uitvoeren, zullen worden uitgevoerd door een
      arbeidsdeskundige;

      c. aantoont dat het in de periode van 1 december 2006 tot 1 december 2009 tenminste 30
      jonggehandicapten die recht hadden op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref2] heeft ondersteund bij de inschakeling in het
      arbeidsproces;

      d. aantoont dat de arbeidsdeskundige die de onderzoeken gaat uitvoeren ervaring heeft met het re-integreren van
      personen in de regio, bedoeld in het tweede en derde lid, waarin het bedrijf wenst te worden aangewezen.

      2 Ten behoeve van de uitvoering van dit hoofdstuk wordt Nederland verdeeld in vijf regio’s:

      a. Regio 1: de provincies Groningen, Friesland en Drenthe;

      b. Regio 2: de provincies Overijssel, Gelderland en Flevoland;

      c. Regio 3: de provincies Utrecht en Noord-Holland;

      d. Regio 4: de provincies Zuid-Holland en Zeeland; en

      e. Regio 5: de provincies Noord Brabant en Limburg

      3 Per regio, bedoeld in het tweede lid, wijst de minister van SZW ten hoogste zes re-integratiebedrijven aan.

      4 Een aanvraag als bedoeld in het eerste lid wordt ingediend bij de minister van SZW voor 31 januari 2010.

      5 Indien per regio meer dan zes re-integratiebedrijven een aanvraag om aanwijzing hebben ingediend en alle voldoen
      aan de voorwaarden, bedoeld in het eerste lid, wijst de minister van SZW de zes re-integratiebedrijven aan door
      middel van een loting onder de re-integratiebedrijven die voldoen aan de voorwaarden bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel5b.8
      [ref2]: https://wetten.overheid.nl/BWBR0024796
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5b.9
    references:
