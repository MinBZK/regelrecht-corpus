  - number: '1.5'
    text: |-
      Deze regeling valt onder de [verordening (EG) nr. 800/2008](32008R0800) van de Commissie van de Europese
      Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van de artikelen 87 en 88 van het
      Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (‘de algemene groepsvrijstellingsverordening’)
      (PbEU L214).
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel1.5
  - number: '1.6'
    text: |-
      Indien door de minister op grond van deze regeling een subsidie wordt verleend van minder dan € 25.000, wordt de
      subsidie ambtshalve vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel1.6
  - number: '2.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *Eurostars High Level Group:* het door de lidstaten die deelnemen aan het Eurostars Programma opgerichte
      samenwerkingsorgaan dat de rangschikking van internationale samenwerkingsprojecten door het Internationaal
      Evaluatie Panel goedkeurt;
        - *Eurostars Programma:* het gezamenlijke Eurostars Programma van EUREKA en de Europese Unie, inhoudend een
      internationaal Europees stimuleringsprogramma voor internationale samenwerkingsprojecten voor innovatieve
      ontwikkeling binnen het EUREKA-kader;
        - *Eurostarsproject:* een internationaal samenwerkingsproject voor innovatieve ontwikkeling binnen het EUREKA-
      kader dat voldoet aan de criteria van het Eurostars Programma, waarvan de rangschikking door de Eurostars High
      Level Group is goedgekeurd, bestaande uit een samenhangend geheel van activiteiten van industrieel onderzoek of
      experimentele ontwikkeling of een combinatie daarvan;
        - *Internationaal Evaluatie Panel:* panel van onafhankelijke deskundigen dat binnen het Eurostars Programma de
      ingediende voorstellen voor internationale samenwerkingsprojecten voor innovatieve ontwikkeling beoordeelt en
      rangschikt.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel2.1
  - number: '2.2'
    text: |-
      De minister verstrekt op aanvraag subsidie aan:

      a. een ondernemer of onderzoeksorganisatie die bijdraagt aan een Eurostarsproject of

      b. indien twee of meer binnen Nederland gevestigde partijen bijdragen aan hetzelfde Eurostarsproject, aan een
      deelnemer in het door deze partijen gevormde samenwerkingsverband, die bijdraagt aan een Eurostarsproject.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel2.2
  - number: '2.3'
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie:

      a. 50 procent van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek en worden
      gemaakt door een onderzoeksorganisatie;

      b. 35 procent van de subsidiabele kosten voor zover deze betrekking hebben op industrieel onderzoek en worden
      gemaakt door een ondernemer;

      c. 25 procent van de subsidiabele kosten voor zover deze betrekking hebben op experimentele ontwikkeling.

      2 De percentages genoemd in het eerste lid, onderdeel b en c, worden verhoogd met tien procentpunten, indien
      subsidie wordt verstrekt aan een MKB-ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0026689
  - number: '2.5'
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel2.5
  - number: '2.6'
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1], is drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '2.7'
    text: |-
      1 De minister beschikt afwijzend op een aanvraag indien:

      a. het Eurostarsproject een onvoldoende totaalscore heeft gekregen van het Internationaal Evaluatie Panel;

      b. het Eurostarsproject een onvoldoende score voor een criterium heeft gekregen van het Internationaal Evaluatie
      Panel;

      c. aannemelijk is dat het Eurostarsproject, voor zover het door een in Nederland gevestigde ondernemer of
      onderzoeksorganisatie wordt uitgevoerd, ook zonder de subsidie zonder belangrijke vertraging zou worden uitgevoerd;

      d. aannemelijk is dat het Eurostarsproject geen doorgang kan vinden om redenen die samenhangen met omstandigheden
      in de andere deelnemende landen van het Eurostarsproject of met financiële of technische problemen van een van de
      deelnemende parttijen in een ander deelnemend land.

      2 De minister beslist tevens afwijzend op een aanvraag voor zover het gevraagde subsidiebedrag hoger is als
      € 500.000.

      3 De afwijzingsgronden, genoemd in
      [artikel 23, onderdelen d tot en met f en h, van het Kaderbesluit EZ-subsidies][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '2.8'
    text: |-
      De minister rangschikt de aanvragen waarop niet afwijzend is beslist overeenkomstig de door de Eurostars High Level
      Group vastgestelde rangschikking.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel2.8
  - number: '2.9'
    text: |-
      In afwijking van [artikel 39 van het Kaderbesluit EZ-subsidies][ref1] brengt de subsidie-ontvanger steeds
      na afloop van een periode van zes maanden aan de minister schriftelijk verslag uit omtrent de uitvoering van
      het Eurostarsproject, met inbegrip van een vergelijking van die uitvoering met het projectplan en de bij de
      subsidieverlening vermelde raming van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel39
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '39'
  - number: '2.10'
    text: |-
      1 De subsidie-ontvanger voert het Eurostarsproject in Nederland uit, behoudens voorafgaande schriftelijke
      ontheffing van de minister voor gedeeltelijke uitvoering buiten Nederland.

      2 Aan een ontheffing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel2.10
  - number: '2.11'
    text: |-
      Het formulier voor het indienen van een aanvraag voor:

      a. een subsidie is opgenomen in [bijlage 2.1][ref1];

      b. een subsidievaststelling is opgenomen in [bijlage 2.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024855
      [ref2]: https://wetten.overheid.nl/BWBR0024855
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0024855
      - id: ref2
        bwb_id: BWBR0024855
  - number: '3.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - certificeringstraject: certificering op basis van de resultaten van uitvoerige beproevingen en berekeningen;
        - klinisch ontwikkelingsproject: een planmatig geheel van activiteiten in de fase van experimentele ontwikkeling,
      gericht op het omzetten van resultaten van industrieel onderzoek in plannen, schema’s of ontwerpen voor nieuwe,
      gewijzigde of verbeterde producten of processen, die nieuw zijn voor Nederland, en a. aan de ontwikkeling van
      welke producten en processen klinische risico’s en daarmee samenhangende financiële risico’s zijn verbonden en
      b. welke producten of processen door het goede commerciële perspectief kunnen leiden tot substantiële economische
      activiteiten van de onderneming;
        - klinisch risico: risico voor het welslagen van het product of proces dat voortvloeit uit de noodzaak dat het
      nieuwe product of proces een testfase in de mens doorloopt;
        - technisch ontwikkelingsproject: een planmatig geheel van activiteiten in de fase van experimentele ontwikkeling,
      gericht op het omzetten van resultaten van industrieel onderzoek in plannen, schema’s of ontwerpen voor
      nieuwe, gewijzigde of verbeterde producten, processen of diensten, die nieuw zijn voor Nederland, en a. waaraan
      substantiële technische, maar geen klinische, risico’s en daarmee samenhangende financiële risico’s zijn verbonden
      en b. welke producten, processen of diensten door het goede commerciële perspectief kunnen leiden tot substantiële
      economische activiteiten van de onderneming;
        - ontwikkelingsproject: een technisch ontwikkelingsproject of een klinisch ontwikkelingsproject;
        - uitstaand saldo: het totaalbedrag dat aan de subsidie-ontvanger is uitbetaald als subsidie in de vorm van
      krediet, verhoogd met de verschenen rente, bedoeld in [artikel 3.8, tweede en derde lid][ref1], en verminderd met
      de betalingen, gedaan overeenkomstig [artikel 3.8, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel3.8
      [ref2]: https://wetten.overheid.nl/BWBR0024855#Artikel3.8
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0024855
        artikel: '3.8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024855
        artikel: '3.8'
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      1 De minister verstrekt op aanvraag ten behoeve van de financiering van een ontwikkelingsproject subsidie aan een
      ondernemer, die een ontwikkelingsproject uitvoert. De subsidie wordt verstrekt in de vorm van krediet.

      2 In aanvulling op [artikel 3, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] kan ook subsidie worden
      verstrekt aan een ondernemer die gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel3
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '3'
  - number: '3.3'
    text: |-
      In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie in de vorm van krediet aan een
      kleine onderneming die deel uitmaakt van een samenwerking als bedoeld in paragraaf 5.1.3, onderdeel b, van de
      *Communautaire kaderregeling (EU) nr. C 323/1 van de Commissie van 30 december 2006 inzake staatssteun voor
      onderzoek, ontwikkeling en innovatie (PbEU 2006, C 323)*, 50 procent van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0026689
  - number: '3.4'
    text: |-
      1 Het maximum subsidiebedrag bedraagt € 5.000.000 per subsidie-ontvanger.

      2 Indien door een ondernemer, dan wel door ondernemers die behoren tot eenzelfde groep, meer dan één
      ontwikkelingsproject wordt uitgevoerd en daarvoor subsidieaanvragen in het kader van dit hoofdstuk zijn ingediend,
      wordt in een kalenderjaar aan die ondernemer, dan wel aan die ondernemers die tot eenzelfde groep behoren
      gezamenlijk, ten hoogste het in het eerste lid genoemde bedrag aan subsidie verleend.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.4
  - number: '3.5'
    text: De minister verdeelt de subsidieplafonds op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.5
  - number: '3.6'
    text: |-
      1 De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1] is vier jaar.

      2 De minister kan de termijn, bedoeld in het eerste lid, op verzoek met ten hoogste twee jaar verlengen indien
      sprake is van een technisch ontwikkelingsproject met een certificeringstraject.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '3.7'
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. hij de subsidiabele kosten raamt op minder dan € 150.000;

      b. onvoldoende vertrouwen bestaat dat de subsidie-ontvanger het ontwikkelingsproject en de daarop volgende fase van
      commercialisatie kan financieren;

      c. onvoldoende vertrouwen bestaat dat de subsidie-ontvanger een ontwikkelingsproject zowel in technische als in
      economische zin tot een succes zal kunnen maken;

      d. onvoldoende vertrouwen bestaat dat de subsidie-ontvanger de subsidie terug kan betalen binnen de in
      [artikel 3.8, vierde lid][ref1], genoemde periode;

      e. van het ontwikkelingsproject onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn.

      2 De afwijzingsgrond, genoemd in [artikel 23, onderdeel b, van het Kaderbesluit EZ-subsidies][ref2] is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel3.8
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0024855
        artikel: '3.8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '3.8'
    text: |-
      1 De subsidie-ontvanger is verplicht de verstrekte subsidie volgens een in de beschikking tot subsidieverlening
      vastgelegd schema terug te betalen aan de minister.

      2 De subsidie-ontvanger is verplicht over het uitstaande saldo aan de minister jaarlijks een bij de beschikking
      tot subsidieverlening, overeenkomstig [artikel 3.9][ref1], bepaald rentepercentage te betalen, dat op een
      ontwikkelingsproject van toepassing blijft tot aan de betalingsverplichtingen geheel is voldaan.

      3 De rente wordt aan het eind van elk kalenderjaar rentedragend bij het uitstaande saldo bijgeschreven.

      4 De subsidie-ontvanger is verplicht het uitstaande saldo binnen 10 jaar na vaststelling van de subsidie aan de
      minister te betalen.

      5 De termijn genoemd in het vierde lid kan naar aanleiding van een ontheffingsverzoek als bedoeld in
      [artikel 42, vijfde lid, van het Kaderbesluit EZ-subsidies][ref2] worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel3.9
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel42
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0024855
        artikel: '3.9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '42'
  - number: '3.9'
    text: |-
      1 Het rentepercentage, bedoeld in [artikel 3.8, tweede lid][ref1], is opgebouwd uit:

      a. het basispercentage en de opslag voor technische ontwikkelingsprojecten onderscheidenlijk voor klinische
      ontwikkelingsprojecten, of

      b. het op grond van onderdeel a vastgestelde percentage vermeerderd met de opslag voor het risico dat de
      ontvanger niet in staat is om de subsidie terug te betalen bij uitblijven van commercieel succes van het
      ontwikkelingsproject.

      2 De percentages, bedoeld in het eerste lid, worden jaarlijks bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel3.8
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0024855
        artikel: '3.8'
        hoofdstuk: '3'
  - number: '3.10'
    text: |-
      De minister kan besluiten dat de verstrekte subsidie in de vorm van krediet versneld of in een keer terugbetaald
      wordt, indien:

      a. de aandelen van de subsidie-ontvanger worden vervreemd;

      b. de resultaten van het project geheel of gedeeltelijk worden vervreemd.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.10
  - number: '3.11'
    text: |-
      1 Indien ontheffing is verleend op basis van [artikel 37, derde lid, van het Kaderbesluit EZ-subsidies][ref1], kan
      de minister op aanvraag van de subsidie-ontvanger het bedrag van een eerder voor een ontwikkelingsproject verleende
      subsidie verhogen tot maximaal het bedrag dat voor dat ontwikkelingsproject kan worden verkregen.

      2 De aanvraag, bedoeld in het eerste lid, wordt volgens eenzelfde procedure en volgens dezelfde criteria behandeld
      als een eerste aanvraag om subsidie voor een ontwikkelingsproject.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel37
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '37'
  - number: '3.12'
    text: |-
      1 De subsidie-ontvanger verleent medewerking aan evaluatie van de effecten van het door hem uitgevoerde
      ontwikkelingsproject, voor zover deze medewerking redelijkerwijs van hem verlangd kan worden.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.12
  - number: '3.13'
    text: |-
      Het formulier voor het indienen van een aanvraag voor:

      a. een subsidie is opgenomen in [bijlage 3.1][ref1];

      b. een subsidievaststelling is opgenomen in [bijlage 2.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024855
      [ref2]: https://wetten.overheid.nl/BWBR0024855
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel3.13
