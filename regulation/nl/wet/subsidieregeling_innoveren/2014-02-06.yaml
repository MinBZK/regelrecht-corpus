  - number: '5.3'
    text: |-
      1 De minister verstrekt op aanvraag een kleine innovatievoucher aan een MKB-ondernemer als bedoeld in
      [artikel 5.2, eerste lid][ref1]. Artikel 5.2, tweede lid, derde lid, onderdeel a en b, vierde en vijfde lid is van
      overeenkomstige toepassing.

      2 Geen kleine innovatievoucher wordt verstrekt aan een ondernemer aan wie op grond van dit hoofdstuk,
      [hoofdstuk 5a][ref2] of de [Subsidieregeling innovatievouchers][ref3] reeds een kleine of grote innovatievoucher
      is verstrekt of aan wie op grond van de [Beleidsregel verstrekking innovatievouchers 2004][ref4],
      de [Beleidsregel verstrekking innovatievouchers pilot 2005][ref5], de
      [Beleidsregel verstrekking innovatievouchers pilot 2005 tweede fase][ref6],
      [artikel 2:22 van de Regeling LNV-subsidies][ref7] of de [Subsidieregeling zorginnovatie][ref8] een
      innovatievoucher is verstrekt.

      3 Geen kleine innovatievoucher wordt verstrekt aan een ondernemer in het kader van een kennisoverdrachtproject dat
      een kennisvraag betreft van een aantal ondernemers gezamenlijk.

      4 Het tweede lid is niet van toepassing indien voorafgaand aan de aanvraag een kleine of grote innovatievoucher
      werd verstrekt ten behoeve van een subsidie krachtens [paragraaf 4][ref9] van dit hoofdstuk of paragraaf 4 van
      de Subsidieregeling innoveren, dan wel indien het betreft de aanvraag van een innovatievoucher met het oog op
      toepassing van paragraaf 4 van dit hoofdstuk; in het laatste geval wordt dat op de voucher vermeld.

      5 Het tweede lid is niet van toepassing indien een verstrekte innovatievoucher op verzoek van de ondernemer die de
      voucher heeft ontvangen, door de minister is ingetrokken voordat deze voucher op grond van [artikel 5.7][ref10] bij
      de minister is ingeleverd of voordat de geldigheidsduur ervan is verstreken.


