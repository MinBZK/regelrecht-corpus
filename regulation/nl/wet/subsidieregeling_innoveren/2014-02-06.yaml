  - number: 5b.10
    text: De subsidie bedraagt € 2500,00 per overgelegde Wajong adviesvoucher.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5b.10
  - number: 5b.11
    text: Geen subsidie wordt verstrekt indien het onderzoek door het re-integratiebedrijf is uitbesteed aan een derde.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5b.11
  - number: 5b.12
    text: |-
      1 Een aanvraag om subsidie wordt na afloop van het onderzoek naar de mogelijkheden om een jonggehandicapte
      werkzaamheden in dienstbetrekking binnen een onderneming te laten uitvoeren, ingediend en wordt behandeld op
      volgorde van binnenkomst.

      2 De aanvraag om subsidie moet binnen zes maanden nadat de Wajong adviesvoucher aan de ondernemer is verstrekt,
      zijn ontvangen. Op een voor het einde van de termijn daartoe ingediend schriftelijk verzoek kan de minister van SZW
      deze termijn eenmalig verlengen.

      3 De minister van SZW geeft binnen 13 weken na ontvangst van de aanvraag een beschikking tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5b.12
  - number: 5b.13
    text: |-
      De minister van SZW beslist afwijzend op een aanvraag om subsidie indien:

      a. de ondernemer en het re-integratiebedrijf reeds voor de afgiftedatum van de Wajong adviesvoucher verplichtingen
      jegens elkaar zijn aangegaan;

      b. de uitvoering van het onderzoek naar de mogelijkheden om een jonggehandicapte werkzaamheden in dienstbetrekking
      binnen een onderneming te laten uitvoeren in belangrijke mate afwijkt van de overeenkomst, bedoeld in
      [artikel 5b.7][ref1];

      c. de ondernemer en het re-integratiebedrijf zijn verbonden in een groep;

      d. de ondernemer de Wajong adviesvoucher heeft aangewend voor een project waarvoor reeds door een bestuursorgaan of
      de Commissie van de Europese Gemeenschappen subsidie is verstrekt of dat deel uitmaakt van een project of programma
      waarvoor reeds door een bestuursorgaan of de Commissie van de Europese Gemeenschappen subsidie is verstrekt;

      e. het onderzoek naar de mogelijkheden om een jonggehandicapte werkzaamheden in dienstbetrekking
      binnen een onderneming te laten uitvoeren niet is uitgevoerd door de arbeidsdeskundige, bedoeld in
      [artikel 5b.9, eerste lid, onderdelen b en d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024855#Artikel5b.7
      [ref2]: https://wetten.overheid.nl/BWBR0024855#Artikel5b.9
