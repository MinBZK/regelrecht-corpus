        bwb_id: BWBR0024855
        artikel: '5.1'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5c.2
    text: |-
      1 De minister verstrekt op aanvraag een innovatievoucher elektrische mobiliteit ter waarde van maximaal € 5000,–
      (inclusief BTW) aan een MKB-ondernemer die voor eigen rekening en risico producten, processen of diensten – niet
      zijnde adviezen – verkoopt en levert op het gebied van elektrische mobiliteit.

      2 Een innovatievoucher elektrische mobiliteit kan worden ingeleverd bij een kennisinstelling ten behoeve van de
      uitvoering van een kennisoverdrachtproject elektrische mobiliteit.

      3 Per MKB-ondernemer kan één innovatievoucher elektrische mobiliteit worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5c.2
  - number: 5c.3
    text: Deze paragraaf valt onder de de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5c.3
  - number: 5c.4
    text: |-
      1 Bij ministeriële regeling wordt bepaald gedurende welke periodes innovatievouchers elektrische mobiliteit kunnen
      worden aangevraagd en wordt per periode bepaald hoeveel innovatievouchers elektrische mobiliteit voor binnen
      dezelfde periode ingediende aanvragen beschikbaar zijn.

      2 De minister verdeelt de beschikbare innovatievouchers elektrische mobiliteit in de volgorde van ontvangst van de
      aanvragen. Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare
      aantal innovatievouchers elektrische mobiliteit zou worden overschreden, stelt de minister de onderlinge
      rangschikking van deze aanvragen vast door middel van loting.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5c.4
  - number: 5c.5
    text: |-
      De minister verstrekt op aanvraag subsidie aan een kennisinstelling die een kennisoverdrachtproject elektrische
      mobiliteit heeft uitgevoerd en in verband daarmee een geldige innovatievoucher elektrische mobiliteit overlegt.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5c.5
  - number: 5c.6
    text: |-
      De subsidie bedraagt het bedrag van de door de kennisinstelling ten behoeve van de uitvoering van een
      kennisoverdrachtproject elektrische mobiliteit gemaakte kosten, maar niet meer dan € 5000,–.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5c.6
  - number: 5c.7
    text: |-
      1 Een aanvraag om subsidie wordt na afloop van het kennisoverdrachtproject elektrische mobiliteit ingediend en
      wordt behandeld op volgorde van binnenkomst.

      2 De aanvraag moet binnen een jaar nadat de innovatievoucher elektrische mobiliteit aan de ondernemer is verstrekt
      zijn ontvangen. Op een voor het einde van de termijn daartoe ingediend verzoek kan de minister deze termijn
      eenmalig verlengen met uiterlijk zes maanden.
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5c.7
  - number: 5c.8
    text: |-
      Het formulier voor het indienen van een aanvraag voor:

      a. een innovatievoucher elektrische mobiliteit is opgenomen in [bijlage 5c.1][ref1];

      b. een subsidie als bedoeld in [artikel 5c.5][ref2] is opgenomen in [bijlage 5c.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024855
      [ref2]: https://wetten.overheid.nl/BWBR0024855#Artikel5c.5
      [ref3]: https://wetten.overheid.nl/BWBR0024855
    url: https://wetten.overheid.nl/BWBR0024855/2014-02-06#Artikel5c.8
