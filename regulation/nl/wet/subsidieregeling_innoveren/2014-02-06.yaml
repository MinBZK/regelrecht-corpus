  - number: '5.1'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

        - *grote innovatievoucher:* een op grond van [artikel 5.2, eerste lid][ref1], door de minister aan een ondernemer
      afgegeven document, dat deze ondernemer kan inleveren bij een kennisinstelling ten behoeve van de uitvoering
      van een kennisoverdrachtproject, danwel – voor de toepassing van [paragraaf 4][ref2] van dit hoofdstuk – dat de
      ondernemer kan gebruiken ten behoeve van een subsidie in de kosten van het aanvragen en verkrijgen van een octrooi,
      waarbij van de ondernemer een eigen bijdrage verlangd wordt;
        - *kennisoverdrachtproject:* een door een kennisinstelling verrichte activiteit, bestaande uit het, al dan niet op
      basis van te verrichten nader onderzoek, beantwoorden van een toepassingsgerichte kennisvraag van een ondernemer
      of ten hoogste 10 ondernemers gezamenlijk, uitgaande van voor de ondernemer nieuwe kennis met betrekking tot de
      vernieuwing van producten, productieprocessen of diensten en van welke activiteit de gevolgen naar verwachting
      grotendeels ten goede zullen komen aan de Nederlandse economie. Geen kennisoverdrachtsproject is een project
      waarbij de beantwoording van een toepassingsgerichte kennisvraag plaatsvindt door het leveren van goederen, het
      geven van cursussen of het verrichten van activiteiten op het gebied van verkoop van producten of diensten, zoals
      het ontwikkelen en vervaardigen van marketinginstrumenten en verkoopondersteunend promotiemateriaal;
        - *kleine innovatievoucher:* een op grond van [artikel 5.3, eerste lid][ref3], door de minister aan een ondernemer
      afgegeven document, dat deze ondernemer kan inleveren bij een kennisinstelling ten behoeve van de uitvoering
      van een kennisoverdrachtproject, danwel – voor de toepassing van [paragraaf 4][ref4] van dit hoofdstuk – dat de
      ondernemer kan gebruiken ten behoeve van een subsidie in de kosten van het aanvragen en verkrijgen van een octrooi,
      zonder dat een eigen bijdrage van de ondernemer verlangd wordt.

      2 In dit hoofdstuk wordt verstaan onder kennisinstelling:

      a. een [onder a, b, c, f of g van de bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek]
      (onbekend) genoemde instelling voor hoger onderwijs en een [onder i van de bijlage bij die wet](onbekend) bedoeld
      academisch ziekenhuis, Nyenrode Business Universiteit alsmede andere instellingen van hoger onderwijs, die op
      basis van [artikel 6.9][ref5] of [16.14 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6]
      zijn aangewezen en zich als kennisinstelling in de zin van dit hoofdstuk of van de
      [Subsidieregeling innovatievouchers][ref7] bij de minister hebben aangemeld;

      b. instellingen als bedoeld in [artikel 1.1.1, onderdeel b][ref8], [artikel 12.3.8][ref9] en
      [artikel 12.3.9 van de Wet educatie en beroepsonderwijs][ref10];

      c. een andere dan onder a bedoelde geheel of gedeeltelijk, meerjarig door de overheid gefinancierde
      onderzoeksorganisatie zonder winstoogmerk die activiteiten verricht met als doel de algemene wetenschappelijke of
      technische kennis uit te breiden;

      d. een geheel of gedeeltelijk, meerjarig door een andere lidstaat van de Europese Unie gefinancierde:

      1°. openbare instelling voor hoger onderwijs of een daaraan verbonden ziekenhuis gelijkwaardig aan een instelling
      respectievelijk academisch ziekenhuis als bedoeld onder a,

      2°. instelling van middelbaar beroepsonderwijs gelijkwaardig aan een instelling als bedoeld onder b of

      3°. onderzoeksorganisatie zonder winstoogmerk die activiteiten verricht met als doel de algemene wetenschappelijke
      en technische kennis uit te breiden;

      e. een rechtspersoon ten aanzien waarvan een instelling als bedoeld onder a, b, c of d direct of indirect:

      1°. meer dan de helft van het geplaatste kapitaal verschaft,

      2°. volledig aansprakelijk vennoot is of

      3°. overwegende zeggenschap heeft;

      f. een onderzoeksorganisatie zonder winstoogmerk met eigen medewerkers in loondienst, die tot doel heeft
      om via het structureel doen van eigen onderzoek en het ontwikkelen en testen van technische toepassingen
      door haar medewerkers, de technologische kennis op een specifiek terrein te bevorderen, die geen instelling
      is als bedoeld onder a tot en met e en die zich als kennisinstelling in de zin van dit hoofdstuk of van de
      [Subsidieregeling innovatievouchers][ref11] bij de minister heeft aangemeld;

      g. een onderzoeksafdeling, die onderdeel vormt van een onderneming of groep die niet als hoofddoelstelling
      onderzoek en ontwikkeling heeft en die in 2008 kosten voor onderzoek en ontwikkeling had van ten minste
      € 45.000.000.


