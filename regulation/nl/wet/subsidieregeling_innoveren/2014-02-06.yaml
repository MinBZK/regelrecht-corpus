  - number: 5a.4
    text: |-
      1 De aanvraag door een ondernemer van een grote of kleine innovatievoucher wordt ingediend met gebruikmaking van
      een formulier, dat is opgenomen in de bij deze regeling behorende [bijlage 5a.1][ref1], en gaat, overeenkomstig
      hetgeen in het formulier is vermeld, vergezeld van de in het formulier aangegeven bescheiden.

      2 Een ondernemer kan ten hoogste één voucher tegelijkertijd aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024855
