  - number: '5.16'
    text: |-
      De subsidie bedraagt:

      a. indien bij de aanvraag een grote innovatievoucher wordt overgelegd tweederde deel van het bedrag dat de
      persoon, die krachtens [artikel 23b van de Rijksoctrooiwet][ref1] of artikel 134, eerste lid, van het Europees
      Octrooiverdrag, bevoegd is als gemachtigde op te treden of de tot octrooiverlening bevoegde autoriteit, waarvan
      bij de aanvraag de facturen zijn overgelegd, blijkens die facturen aan de ondernemer in rekening heeft gebracht,
      exclusief eventueel in rekening te brengen omzetbelasting, maar niet meer dan € 5000 dan wel het krachtens
      [artikel 5.2, vierde lid][ref2], op de voucher vermelde bedrag;

      b. indien bij de aanvraag een kleine innovatievoucher wordt overgelegd het factuurbedrag, exclusief
      eventueel in rekening te brengen omzetbelasting, maar niet meer dan € 2500 dan wel het krachtens
      [artikel 5.2, vierde lid][ref3], op de voucher vermelde bedrag.


