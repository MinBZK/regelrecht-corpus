$id: regeling_gebruik_hoogtemeter
regulatory_layer: WET
publication_date: '2014-12-11'
valid_from: '1993-08-01'
bwb_id: BWBR0006076
url: https://wetten.overheid.nl/BWBR0006076/1993-08-01
preamble:
  text: |-
    Handelend in overeenstemming met de Minister van Defensie;

    Gelet op artikel 12 van het Luchtverkeersreglement (Stb. 1992, 697);

    Gezien de paragrafen 3.1.3., 4.5., 5.2.2. en 5.3.1. en aanhangsel 3 van bijlage 2 (Rules of the Air) van het
    Verdrag inzake de internationale burgerluchtvaart en ICAO-document 8186/OPS/611 (Aircraft Operations-Altimeter
    Setting Procedures);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:



            a
            Altimeter Setting Region, afgekort ASR:

              hoogtemeter- instellingsgebied;



            b
            grondkoers:

              de projectie op het aardoppervlak van de vliegbaan van een luchtvaartuig waarvan de richting op enig punt
      wordt uitgedrukt in graden ten opzichte van het ware (T), het magnetische (M) of het kaartnet-noorden (G);



            c
            hoogte:

              de verticale afstand tussen een vlak, een punt of als een punt te beschouwen voorwerp en een
      referentievlak, referentiepunt of als referentiepunt te beschouwen voorwerp;



            d
            overgangshoogte:

              de hoogte boven gemiddeld zeeniveau waarop en waar beneden de vlieghoogte wordt uitgedrukt in hoogte boven
      gemiddeld zeeniveau;



            e
            overgangsniveau:

              het laagst beschikbare vliegniveau boven de overgangshoogte;



            f
            QFE:

              de atmosferische druk op het aardoppervlak;



            g
            QNH:

              de QFE herleid tot gemiddeld zeeniveau in de ICAO-standaardatmosfeer;



            h
            voet, afgekort ft:

              de gelijke lengte aan 0,3048 m.
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel1
  - number: '2'
    text: |-
      1 Vliegniveau nul is gelegen op het atmosferische drukvlak van 1013.2 hPa. Opeenvolgende vliegniveaus zijn
      gescheiden door een drukinterval dat overeenkomst met ten minste 500 ft. in de ICAO-standaardatmosfeer.

      2 Een vliegniveau wordt aangeduid met de hoofdletters FL gevolgd door een getal, dat overeenkomt met een honderdste
      deel van de desbetreffende hoogte in voeten in de ICAO-standaardatmosfeer.
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel2
  - number: '3'
    text: |-
      1 De overgangshoogte in het vluchtinformatiegebied Amsterdam is voor IFR-vluchten 915m (3000 ft) en voor VFR-
      vluchten 1070m (3500 ft).

      2 Het overgangsniveau in het vluchtinformatiegebied Amsterdam is gelegen op of boven 1220m (4000 ft) boven
      gemiddeld zeeniveau.
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel3
  - number: '4'
    text: |-
      Het overgangsniveau, bedoeld in [artikel 3, tweede lid][ref1], wordt elk uur vastgesteld door de Luchtvaart
      Meteorologische Dienst van het KNMI te Schiphol en zo snel mogelijk aan de Nederlandse luchtverkeersdiensten
      doorgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006076#Artikel3
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006076
        artikel: '3'
        afdeling: I
  - number: '5'
    text: |-
      1 In het vluchtinformatiegebied Amsterdam en de daarbuiten gelegen luchtruimten boven het Nederlandse deel van het
      continentaal plat zijn de volgende hoogtemeterinstellingsgebieden ingesteld:

      a. ASR Amsterdam;

      b. ASR Maastricht;

      c. ASR North Sea;

      d. ASR noord van 54e breedtegraad.

      2 Genoemde gebieden worden lateraal begrensd zoals aangegeven in de Luchtvaartgids, deel 1, RAC-2-5.

      3 Voor genoemde gebieden worden elk uur door de Luchtvaart Meteorologische Dienst van het KNMI te Schiphol als
      ‘regionale QNH’ ononderscheidelijk vastgesteld en zo snel mogelijk aan de Nederlandse luchtverkeersdiensten
      doorgegeven;

      a. de QNH van luchtvaartterrein Schiphol;

      b. de QNH van luchtvaartterrein Zuid-Limburg;

      c. de QNH van booreiland K 13-A (positie 53.13.06 N 03.13.12 O);

      d. de verwachte QNH van het gebied noord van de 54e breedtegraad.
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel5
  - number: '6'
    text: |-
      1 Vóór het opstijgen moet tenminste één drukhoogtemeter worden ingesteld op de QNH van het luchtvaartterrein.

      2 Bij het tijdens de stijgvlucht passeren van de overgangshoogte moet tenminste één drukhoogtemeter zijn ingesteld
      op de drukwaarde van 1013.2 hPa.
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel6
  - number: '7'
    text: |-
      Tijdens een vlucht op een kruishoogte op of beneden de overgangshoogte moet ten minste één drukhoogtemeter zijn
      ingesteld op regionale QNH.
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel7
  - number: '8'
    text: |-
      1 Bij het tijdens de daalvlucht passeren van het overgangsniveau moet tenminste één drukhoogtemeter worden
      ingesteld op QNH van het luchtvaartterrein.

      2 De in het eerste lid bedoelde instelling op QNH kan reeds vóór het passeren van het overgangsniveau geschieden,
      indien de betrokken luchtverkeersleidingsdienst – na het verstrekken van de naderingsklaring – toestaat om
      vlieghoogte uit te drukken in hoogte boven gemiddeld zeeniveau nadat de einddaling is ingezet en wordt voorzien dat
      boven de overgangshoogte geen horizontale vlucht meer zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel8
  - number: '9'
    text: |-
      Kruishoogte en andere vlieghoogtes moeten worden uitgedrukt in:

      a. vliegniveau, voor het deel van de vlucht op of boven het overgangsniveau;

      b. hoogte boven gemiddeld zeeniveau, voor het deel van de vlucht beneden het overgangsniveau.
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel9
  - number: '10'
    text: |-
      1 Een horizontaal deel van een VFR-vlucht boven 1070m (3500 ft) boven de grond of water moet worden uitgevoerd op
      een vliegniveau als aangegeven in de bijlage.

      2 Een horizontaal deel van een gecontroleerde vlucht binnen een luchtverkeersleidingsgebied moet worden uitgevoerd
      op een kruishoogte als in de bijlage aangegeven voor een IFR-vlucht.

      3 Een horizontaal deel van een IFR-vlucht buiten een luchtverkeersleidingsgebied moet worden uitgevoerd op een
      kruishoogte als aangegeven in de bijlage.
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel10
  - number: '11'
    text: |-
      1 In afwijking van het gestelde in [artikel 10][ref1] geldt, binnen het vluchtinformatiegebied Amsterdam en de
      daarbuiten gelegen luchtruimte tot en met 915m (3000 ft) boven gemiddeld zeeniveau boven het Nederlandse deel van
      het continentaal plat, de in bijlage C opgenomen vereenvoudigde tabel van kruishoogtes.

      2 Voor de toepassing van de in het eerste lid genoemde tabel geldt:

      a. voor vluchten langs de luchtverkeersroutes A5, B31, UA5, UB31, en UG11 de indeling in grondkoersen en
      onderscheidenlijk 090M°269M° en 270M° — 089M°;

      b. voor IFR-vluchten op of beneden 915m (3000 ft) de grondkoers van het belangrijkste deel van de vlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0006076#Artikel10
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006076
        artikel: '10'
        afdeling: III
  - number: '12'
    text: |-
      Van het gestelde in [artikel 11, tweede lid, onder b][ref1], kan de betreffendeluchtverkeersdienst afwijken door
      het buiten toepassing te verklaren dan wel een afwijkende verklaring te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006076#Artikel11
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006076
        artikel: '11'
        afdeling: III
  - number: '13'
    text: |-
      De regeling van de Directeur-Generaal van de Rijksluchtvaartdienst, de Chef van de Marinestaf en de Chef van de
      luchtmachtstaf van 28 juli 1981/nr. LVB/23871 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel13
  - number: '14'
    text: Deze regeling treedt in werking met ingang van 1 augustus 1993.
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Regeling gebruik hoogtemeter.'
    url: https://wetten.overheid.nl/BWBR0006076/1993-08-01#Artikel15
