---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_permanente_eisen_taxis
regulatory_layer: WET
publication_date: '2009-04-29'
valid_from: '2008-11-20'
bwb_id: BWBR0009110
url: https://wetten.overheid.nl/BWBR0009110/2008-11-20
preamble:
  text: |-
    Gelet op artikel 159 van het Besluit personenvervoer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder taxi een auto waarmee het in
      [artikel 1, onder j, van de Wet personenvervoer 2000][ref1], bedoelde taxivervoer wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel1
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '1'
  - number: '2.1'
    text: |-
      Als regels voor de afgifte van een keuringsbewijs van motorrijtuigen, waarvan het kentekenbewijs deel I A dan wel
      kentekenbewijs deel I onder bijzonderheden vermeldt: ’taxi, zie bijlage’, worden vastgesteld de regels welke zijn
      opgenomen in de [artikelen 3 tot en met 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009110#Artikel3
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009110
        artikel: '3'
  - number: '2.2'
    text: |-
      De bijlage welke deel uitmaakt van het kentekenbewijs deel I A dan wel kentekenbewijs deel I moet overeenkomstig
      het bepaalde in de bijlage behorend bij deze regeling zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel2
  - number: '3.1'
    text: |-
      In het geval op de bijlage rails of andere bevestigingspunten voor de bevestiging van rolstoelen zijn aangegeven,
      mag het aantal stoelen of banken in de taxi minder zijn dan op de bijlage is aangegeven en behoeft de positionering
      van de stoelen of banken niet overeenkomstig de bijlage te zijn.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel3
  - number: '3.2'
    text: |-
      Indien op de rails stoelen of banken zijn bevestigd, moet de positionering ervan zodanig zijn dat voldoende
      doorgang naar een deur is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel3
  - number: '4'
    text: De deuren moeten van binnen en van buiten kunnen worden geopend en gesloten.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel4
  - number: '5.1'
    text: 'Indien op de bijlage een nooduitgang in het dak dan wel een hamertje is aangegeven moet:'
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel5
  - number: 5.1.a
    text: een nooduitgang in het dak aanwezig zijn, of
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel5
  - number: 5.1.b
    text: een noodhamertje op een zichtbare plaats zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel5
  - number: '5.2'
    text: De in het eerste lid genoemde nooduitgang in het dak moet van binnen en van buiten kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel5
  - number: 5.2.a
    text: |-
      Het in het eerste lid genoemde noodhamertje moet zijn voorzien van een signalering dat de chauffeur van de taxi
      waarschuwt in geval van verwijdering van het noodhamertje.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel5
  - number: 5.2.b
    text: |-
      Indien aan het noodhamertje een kabel is verbonden, moet deze een zodanige lengte hebben dat met het noodhamertje
      het midden van de ruit in welke directe omgeving het hamertje is bevestigd, kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel5
  - number: '5.4'
    text: |-
      Met een op de bijlage bij een schuifdeur aangegeven tweede deurklink, moet de betreffende schuifdeur kunnen worden
      geopend.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel5
  - number: '6.1'
    text: |-
      Indien de taxi is bestemd voor het vervoer van personen in rolstoelen, moeten een lift, oprijplaten dan wel andere
      middelen aanwezig zijn om de rolstoelen in de taxi te kunnen plaatsen.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid genoemde middelen moeten deugdelijk aan de taxi kunnen worden bevestigd en de lift moet
      functioneren.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel6
  - number: '7.1'
    text: |-
      Op de plaats waar rolstoelen kunnen worden bevestigd moeten, met uitzondering van de plaatsen waar eventuele
      stoelen of banken zijn bevestigd, de bevestigingsmiddelen voor deze rolstoelen en de daarbij behorende autogordels
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel7
  - number: '7.2'
    text: |-
      De rails en de vastzetinrichtingen alsmede de onderdelen ervan voor de bevestiging van rolstoelen, mogen niet zijn
      vervormd of beschadigd.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel7
  - number: '7.3'
    text: Vastzetinrichtingen moeten op de daarvoor aanwezige bevestigingspunten passend kunnen worden bevestigd.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel7
  - number: '7.4'
    text: Vergrendelinrichtingen van vastzetinrichtingen moeten met de hand te bedienen zijn en moeten functioneren.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel7
  - number: '7.5'
    text: |-
      Bevestigingsmiddelen niet zijnde vastzetinrichtingen en autogordels moeten zijn voorzien van een goedwerkende
      sluiting en mogen niet zodanig zijn beschadigd dat de sterkte ervan in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel7
  - number: '7.6'
    text: |-
      De vrije ruimte voor een rolstoelplaats moet bestaan uit een fictief blok met een lengte van 120 cm, een hoogte van
      140 cm, een breedte van 68 cm tot een hoogte van 60 cm en een breedte van 50 cm daarboven, waarvan een van de korte
      ribben aan het bovenvlak is afgerond met een straal van 90 cm.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel7
  - number: '7.7'
    text: |-
      De in het zesde lid bedoelde maten mogen worden verminderd tot een lengtemaat van 110 cm in situaties waarin
      meerdere rolstoelen in elkaars verlengde worden geplaatst en tot een breedtemaat van 65 cm in situaties waarin
      meerdere rolstoelen naast elkaar worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel7
  - number: '7.8'
    text: |-
      De [artikelen 2.12.1][ref1] en [2.12.2 van de Regeling permanente eisen][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009581
        artikel: '2'
  - number: '8'
    text: Aanwezige interieurdelen mogen de doorgang naar een uitgang niet belemmeren.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel8
  - number: '9.1'
    text: De in deze regeling gestelde eisen worden beoordeeld door middel van visuele controle.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel9
  - number: '9.2'
    text: |-
      Bij controle van [artikel 4][ref1] moeten de deuren aan de binnen- en buitenzijde worden geopend en gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0009110#Artikel4
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009110
        artikel: '4'
  - number: '9.3'
    text: |-
      Bij controle van [artikel 5, tweede lid][ref1], moet de nooduitgang aan de binnen- en buitenzijde worden geopend
      en gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0009110#Artikel5
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009110
        artikel: '5'
  - number: '9.4'
    text: |-
      Bij controle van [artikel 5, derde lid, onderdeel a][ref1], moet het noodhamertje uit de inklemming worden
      verwijderd en weer aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009110#Artikel5
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009110
        artikel: '5'
  - number: '9.5'
    text: |-
      Bij controle van [artikel 5, derde lid, onderdeel b][ref1], moet het noodhamertje uit de inklemming worden
      verwijderd en moet worden gecontroleerd of het midden van de ruit kan worden bereikt waarna het noodhamertje weer
      moet worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009110#Artikel5
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009110
        artikel: '5'
  - number: '9.6'
    text: |-
      Bij controle van [artikel 5, vierde lid][ref1], moet de schuifdeur aan de binnenzijde worden geopend en gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0009110#Artikel5
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009110
        artikel: '5'
  - number: '9.7'
    text: |-
      Bij controle van [artikel 6, tweede lid][ref1], moet de lift in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009110#Artikel6
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009110
        artikel: '6'
  - number: '9.8'
    text: |-
      Bij controle van [artikel 7, derde lid][ref1], moet de vastzetinrichting op het betreffende bevestigingspunt worden
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009110#Artikel7
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009110
        artikel: '7'
  - number: '9.9'
    text: |-
      Bij controle van [artikel 7, vierde lid][ref1], moet de vergrendelinrichting worden bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009110#Artikel7
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009110
        artikel: '7'
  - number: '9.10'
    text: |-
      Bij controle van [artikel 7, vijfde lid][ref1], moet worden beproefd of de sluiting van de autogordels
      functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0009110#Artikel7
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009110
        artikel: '7'
  - number: '10'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 21 december 1994, nr. F15D40008/JZ, Rijksdienst voor het
      Wegverkeer (Stcrt. 1994, 252) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel10
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling permanente eisen taxi’s.'
    url: https://wetten.overheid.nl/BWBR0009110/2008-11-20#Artikel12
