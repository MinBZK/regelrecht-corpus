preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in de Wet werk en bijstand, de Wet inkomensvoorziening
    oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers en de Wet inkomensvoorziening oudere en gedeeltelijk
    arbeidsongeschikte gewezen zelfstandigen nadere bepalingen op te nemen met betrekking tot de plicht tot
    arbeidsinschakeling van een alleenstaande ouder met een kind dat de leeftijd van vijf jaar nog niet heeft bereikt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0025029/2009-01-01#ArtikelAanhef
articles:
  - number: IV
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0025029/2009-01-01#ArtikelIV
  - number: V
    text: 'Deze wet wordt aangehaald als: Wet verbetering arbeidsmarktpositie alleenstaande ouders.'
    url: https://wetten.overheid.nl/BWBR0025029/2009-01-01#ArtikelV
