---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_subsidiering_oorlogsgravenstichting
regulatory_layer: WET
publication_date: '2010-02-25'
valid_from: '2002-01-01'
bwb_id: BWBR0008761
url: https://wetten.overheid.nl/BWBR0008761/2002-01-01
preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            de minister:

              de Minister van Binnenlandse Zaken;



            b
            de stichting:

              de Oorlogsgravenstichting.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel1
  - number: '2.1'
    text: De minister verstrekt subsidie aan de stichting.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel2
  - number: '2.2'
    text: De subsidie wordt per boekjaar verstrekt. Het boekjaar is gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      De subsidie bedraagt ten hoogste het bedrag dat uit de begroting van het Ministerie van Binnenlandse Zaken blijkt
      (de maximum subsidie). Een subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de
      voorwaarde dat voldoende gelden ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel2
  - number: '3.1'
    text: 'Subsidie wordt slechts verstrekt voor uitgaven die direct samenhangen met de volgende activiteiten:'
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel3
  - number: 3.1.a
    text: het aanleggen en in stand houden van de in de statuten van de stichting bedoelde graven en erevelden;
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel3
  - number: 3.1.b
    text: bezoeken van nabestaanden aan graven en erevelden die zich buiten Nederland bevinden;
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel3
  - number: 3.1.c
    text: het verstrekken van informatie aan nabestaanden;
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel3
  - number: 3.1.d
    text: het doen van necrologisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Subsidie wordt tevens verstrekt ten behoeve van een door de stichting te vormen bestemmingsreserve met het
      oog op de op termijn beoogde financiële zelfstandigheid van de stichting. De subsidie ten behoeve van de
      bestemmingsreserve bedraagt de maximum subsidie verminderd met het bedrag dat is uitgegeven aan de in het eerste
      lid bedoelde activiteiten. De bestemmingsreserve bedraagt ten hoogste € 1.815.120,86.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel3
  - number: '3.3'
    text: Uit de bestemmingsreserve kunnen geen bedragen worden onttrokken dan met toestemming van de minister.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel3
  - number: '4.1'
    text: De aanvraag van de subsidie voor een boekjaar wordt uiterlijk 1 oktober van het voorafgaande boekjaar ingediend.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel4
  - number: '4.2'
    text: De aanvraag gaat vergezeld van een begroting en een activiteitenplan.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      De begroting behelst een overzicht van de voor het boekjaar geraamde inkomsten en uitgaven van de aanvrager, voor
      zover deze betrekking hebben op de activiteiten waarvoor de subsidie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel5
  - number: '5.2'
    text: De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      Tenzij voor de activiteiten waarop de aanvraag betrekking heeft nog niet eerder subsidie werd verstrekt, bevat de
      begroting een vergelijking met de begroting van het lopende boekjaar en de gerealiseerde inkomsten en uitgaven van
      het jaar, voorafgaand aan het lopende boekjaar.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel5
  - number: '6'
    text: |-
      De minister geeft twee maanden na ontvangst van de in [artikel 4, tweede lid][ref1], genoemde schriftelijke
      stukken, de beschikking tot subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0008761#Artikel4
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008761
        artikel: '4'
  - number: '7.1'
    text: De minister kan op de subsidie een voorschot verlenen.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel7
  - number: '7.2'
    text: De beschikking tot subsidieverlening vermeldt het bedrag van het voorschot.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel7
  - number: '7.3'
    text: Het voorschot wordt in twee termijnen uitbetaald, en wel op 1 februari en op 1 juni.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel7
  - number: '8.1'
    text: De aanvraag tot vaststelling van de subsidie wordt ingediend binnen zes maanden na afloop van het boekjaar.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel8
  - number: '8.2'
    text: De aanvraag tot vaststelling van de subsidie gaat vergezeld van een financieel verslag en een activiteitenverslag.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel8
  - number: '9.1'
    text: Het financieel verslag omvat de balans en de exploitatierekening met de toelichting.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het financieel verslag geeft volgens de normen die in het maatschappelijk verkeer als aanvaardbaar worden
      beschouwd, een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent:
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel9
  - number: 9.2.a
    text: het vermogen en het exploitatiesaldo, en
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel9
  - number: 9.2.b
    text: voor zover de aard van het financieel verslag dat toelaat, de solvabiliteit en de liquiditeit van de stichting.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      De balans met de toelichting geeft getrouw, duidelijk en stelselmatig de grootte en de samenstelling in actief- en
      passiefposten van het vermogen op het einde van het boekjaar weer.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel9
  - number: '9.4'
    text: |-
      De exploitatierekening met de toelichting geeft getrouw, duidelijk en stelselmatig de grootte van het
      exploitatiesaldo van het boekjaar weer.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel9
  - number: '9.5'
    text: |-
      Het financieel verslag sluit aan op de begroting waarvoor subsidie is verleend en bevat een vergelijking met de
      gerealiseerde inkomsten en uitgaven van het jaar, voorafgaand aan het boekjaar.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      De stichting geeft opdracht tot onderzoek van het financieel verslag aan een accountant als bedoeld in
      [artikel 393, eerste lid, van boek 2, van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '10.2'
    text: |-
      De accountant onderzoekt of het financieel verslag voldoet aan de bij of krachtens de wet gestelde voorschriften en
      of het activiteitenverslag, voor zover hij dat verslag kan beoordelen, met het financieel verslag verenigbaar is.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel10
  - number: '10.3'
    text: De accountant onderzoekt tevens de naleving van de aan de subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel10
  - number: '10.4'
    text: |-
      De accountant geeft de uitslag van zijn onderzoek weer in een schriftelijk verklaring omtrent de getrouwheid van
      het financieel verslag.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel10
  - number: '10.5'
    text: De aanvraag tot vaststelling van de subsidie gaat vergezeld van de in het derde lid bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      De minister stelt de subsidie vast binnen vier maanden na ontvangst van de aanvraag tot vaststelling van de
      subsidie.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      De minister kan bij de vaststelling van de subsidie het bedrag van de subsidie verminderen of in het geheel geen
      subsidie toekennen indien de stichting niet heeft voldaan aan de voorschriften in verband met de subsidie.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel11
  - number: '12'
    text: Vijf jaar na inwerkingtreding van deze regeling, en daarna om de vijf jaar, wordt deze regeling geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel12
  - number: '13'
    text: De Regeling Subsidiëring Oorlogsgravenstichting 1992 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel13
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 1997.
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Regeling subsidiëring Oorlogsgravenstichting.'
    url: https://wetten.overheid.nl/BWBR0008761/2002-01-01#Artikel15
