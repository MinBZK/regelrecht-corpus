  - number: X
    text: |-
      1 De door een open commanditaire vennootschap als gevolg van de toepassing van [artikel IX, eerste lid][ref1],
      behaalde winst behoeft niet in aanmerking te worden genomen, mits alle commanditaire vennoten op het tijdstip
      onmiddellijk voorafgaand aan 1 januari 2025 zijn onderworpen aan de vennootschapsbelasting zonder ervan te
      zijn vrijgesteld, dan wel op 1 januari 2025 als gevolg van het niet langer aan de vennootschapsbelasting
      onderworpen zijn van de commanditaire vennootschap zijn onderworpen aan de vennootschapsbelasting zonder
      ervan te zijn vrijgesteld, en voor het bepalen van de winst bij de open commanditaire vennootschap op het
      tijdstip onmiddellijk voorafgaand aan 1 januari 2025, en bij al die commanditaire vennoten, afgezien van
      [artikel 9, eerste lid, onderdeel e, van de Wet op de vennootschapsbelasting 1969][ref2] zoals dat luidde
      op 31 december 2024, dezelfde bepalingen van toepassing zijn, noch bij die open commanditaire vennootschap,
      noch bij die commanditaire vennoten aanspraak bestaat op voorwaartse verrekening van verliezen op de voet
      van [artikel 20 van de Wet op de vennootschapsbelasting 1969][ref3], op vermindering ter voorkoming van
      dubbele belasting ter zake van buitenlandse resultaten, op toepassing van de innovatiebox op de voet van
      [artikel 12b van de Wet op de vennootschapsbelasting 1969][ref4], op voortwenteling van een saldo aan renten
      op de voet van [artikel 15b van die wet][ref5], op toepassing van de objectvrijstelling voor buitenlandse
      ondernemingswinsten op de voet van [artikel 15e van die wet][ref6], op toepassing van de deelnemingsverrekening op
      de voet van [artikel 23c van die wet][ref7], op toepassing van de verrekening bij buitenlandse ondernemingswinsten
      op de voet van [artikel 23d van die wet][ref8] of op voortwenteling van voorheffingen op de voet van
      [artikel 25a, vierde lid, van die wet][ref9] en mits latere heffing van vennootschapsbelasting is verzekerd. Indien
      de winst ingevolge de eerste zin niet in aanmerking wordt genomen, treden de commanditaire vennoten met betrekking
      tot al hetgeen als gevolg van de toepassing van [artikel IX, eerste lid][ref10], aan hen wordt geacht te zijn
      overgedragen in de plaats van de open commanditaire vennootschap.

      2 Ingeval niet is voldaan aan de vereisten, bedoeld in het eerste lid, eerste zin, kan Onze Minister op een
      gezamenlijk verzoek van de open commanditaire vennootschap en alle commanditaire vennoten, mits die vennoten op
      1 januari 2025 zijn onderworpen aan de vennootschapsbelasting zonder ervan te zijn vrijgesteld, onder door hem
      te stellen voorwaarden de inspecteur die is belast met de aanslagregeling van de open commanditaire vennootschap
      toestaan de winst die is behaald als gevolg van de toepassing van [artikel IX, eerste lid][ref11], geheel of
      ten dele buiten aanmerking te laten. Daarbij treden die vennoten met betrekking tot al hetgeen als gevolg van
      de toepassing van artikel IX, eerste lid, aan hen wordt geacht te zijn overgedragen, voor zover daaraan geen
      voorwaarden zijn gesteld, in de plaats van de open commanditaire vennootschap. De inspecteur beslist op het verzoek
      bij voor bezwaar vatbare beschikking waarin de voorwaarden, bedoeld in de eerste zin, zijn opgenomen.

      3 De voorwaarden, bedoeld in het tweede lid, mogen slechts strekken ter verzekering van de heffing en de
      invordering van belasting welke verschuldigd zou zijn of zou worden indien het tweede lid, eerste zin, buiten
      toepassing zou blijven. Voorts kunnen voorwaarden worden gesteld die betrekking hebben op het bepalen van de
      in een jaar genoten winst van de commanditaire vennoten, de toelaatbare reserves, de verrekening van verliezen
      op de voet van [artikel 20 van de Wet op de vennootschapsbelasting 1969][ref12], de vermindering ter voorkoming
      van dubbele belasting ter zake van buitenlandse resultaten, de toepassing van de innovatiebox op de voet van
      [artikel 12b van de Wet op de vennootschapsbelasting 1969][ref13], de voortwenteling van een saldo aan renten
      op de voet van [artikel 15b van die wet][ref14], de toepassing van de objectvrijstelling voor buitenlandse
      ondernemingswinsten op de voet van [artikel 23d van die wet][ref15], de toepassing van de deelnemingsverrekening
      op de voet van [artikel 23c van die wet][ref16], de toepassing van de verrekening bij buitenlandse
      ondernemingswinsten op de voet van artikel 23d van die wet, of op de voortwenteling van voorheffingen op de voet
      van [artikel 25a, vierde lid, van die wet][ref17] en kunnen voorwaarden worden gesteld indien op het tijdstip
      onmiddellijk voorafgaand aan 1 januari 2025 de waarde in het economische verkeer van de vermogensbestanddelen
      die aan de commanditaire vennoten worden geacht te zijn overgedragen lager is dan de boekwaarde van deze
      vermogensbestanddelen.

      4 Het verzoek, bedoeld in het tweede lid, wordt uiterlijk op het tijdstip van het doen van de aangifte
      vennootschapsbelasting van de open commanditaire vennootschap over het boekjaar dat eindigt op 31 december 2024
      schriftelijk gedaan.


