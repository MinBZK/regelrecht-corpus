  - number: XVII
    text: |-
      De [artikelen IX tot en met XVI][ref1] zijn van overeenkomstige toepassing op een maatschap, een vennootschap
      onder firma en een naar het recht van een andere staat opgericht of aangegaan lichaam waarvan de rechtsvorm
      vergelijkbaar is met die van een dergelijke maatschap of vennootschap onder firma die op het tijdstip
      onmiddellijk voorafgaand aan 1 januari 2025 zijn onderworpen aan de vennootschapsbelasting zonder ervan te
      zijn vrijgesteld, alsmede op de maten of vennoten van een dergelijke maatschap of vennootschap onder firma,
      onderscheidenlijk de participanten in een dergelijk lichaam, voor zover de maatschap, vennootschap onder
      firma, onderscheidenlijk het lichaam, met ingang van 1 januari 2025 als gevolg van de inwerkingtreding van
      deze wet niet langer onderworpen is aan de vennootschapsbelasting op grond van de [artikelen 2][ref2] of
      [3 van de Wet op de vennootschapsbelasting 1969][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0049130#ArtikelIX
