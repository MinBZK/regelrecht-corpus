  - number: XI
    text: |-
      Indien een open commanditaire vennootschap als bedoeld in [artikel IX, eerste lid][ref1], een pensioenverplichting
      heeft als bedoeld in [artikel 38n van de Wet op de loonbelasting 1964][ref2] en die vennootschap die
      verplichting uiterlijk op 31 december 2024 overdraagt aan een toegelaten verzekeraar als bedoeld in
      [artikel 19a, eerste lid, onderdeel d, van de Wet op de loonbelasting 1964][ref3], zoals dat luidde op 31 december
      2016, worden voor de toepassing van de [Wet op de vennootschapsbelasting 1969][ref4] de bij de overdragende
      vennootschap hierbij ontstane last en de door de ontvangende verzekeraar hierbij behaalde winst niet in aanmerking
      genomen.


