  - number: XIII
    text: |-
      1 Op verzoek van de commanditaire vennoot wordt het als gevolg van de toepassing van [artikel IX, derde lid][ref1],
      door hem behaalde resultaat niet in aanmerking genomen, mits de vermogensbestanddelen, bedoeld in artikel IX,
      derde lid, met ingang van 1 januari 2025 worden gebruikt in de onderneming waaruit die vennoot, anders dan als
      ondernemer of aandeelhouder, als medegerechtigde tot het vermogen winst gaat genieten. In dat geval stelt de
      commanditaire vennoot, als medegerechtigde tot het vermogen van de commanditaire vennootschap, de betreffende
      vermogensbestanddelen te boek op de waarde waarvoor die vermogensbestanddelen op het tijdstip onmiddellijk
      voorafgaand aan 1 januari 2025 bij de werkzaamheid te boek waren gesteld.

      2 Dit artikel is van overeenkomstige toepassing met betrekking tot de fiscale reserves, bedoeld in
      [artikel 3.53, eerste lid, onderdelen a en b, van de Wet inkomstenbelasting 2001][ref2], de doorschuiving via
      te conserveren inkomen naar een andere werkzaamheid op de voet van [artikel 3.64 van die wet][ref3], alsmede
      voorzieningen die in overeenstemming met [artikel 3.25 van die wet][ref4] zijn gevormd bij de bepaling van het
      resultaat uit de werkzaamheid. Degene die, anders dan als ondernemer of aandeelhouder, als medegerechtigde tot het
      vermogen winst gaat genieten en naar wie de reserve of voorziening overgaat dan wel bij wie er via te conserveren
      inkomen wordt doorgeschoven, wordt voor het bepalen van de winst geacht in de plaats te zijn getreden van degene
      die de reserve of voorziening heeft gevormd.

      3 Indien als gevolg van de inwerkingtreding van deze wet de terbeschikkingstelling van onroerende zaken aan
      een open commanditaire vennootschap als bedoeld in [artikel IX, eerste lid][ref5], met ingang van 1 januari
      2025 niet langer als een werkzaamheid als bedoeld in [artikel 3.92 van de Wet inkomstenbelasting 2001][ref6]
      wordt aangemerkt en de onroerende zaken met ingang van dat tijdstip dienstbaar zijn aan de onderneming
      waarin als gevolg van de inwerkingtreding van deze wet een medegerechtigdheid is ontstaan, dan worden
      voor de toets of is voldaan aan de periode van één jaar, onderscheidenlijk vijf jaren, bedoeld in
      [artikel 35d, eerste lid, van de Successiewet 1956][ref7], de onmiddellijk aan 1 januari 2025 voorafgaande periode
      van die terbeschikkingstelling en de periode waarin die onroerende zaken dienstbaar zijn aan de onderneming waarin
      die medegerechtigdheid is ontstaan bij elkaar gevoegd als ware het één periode.

      4 Indien als gevolg van de inwerkingtreding van deze wet de terbeschikkingstelling van onroerende
      zaken aan een open commanditaire vennootschap als bedoeld in [artikel IX, eerste lid][ref8],
      met ingang van 1 januari 2025 niet langer als een werkzaamheid als bedoeld in
      [artikel 3.92 van de Wet inkomstenbelasting 2001][ref9] wordt aangemerkt, wordt dit niet als een gebeurtenis
      als bedoeld in [artikel 35e, eerste lid, onderdeel d, onder 1°, van de Successiewet 1956][ref10]
      aangemerkt, mits de onroerende zaken met ingang van dat tijdstip dienstbaar zijn aan de onderneming waarin
      als gevolg van de inwerkingtreding van deze wet een medegerechtigdheid is ontstaan. Daarbij worden voor
      de toets of is voldaan aan het voortzettingsvereiste gedurende de periode van vijf jaren, bedoeld in
      [artikel 35b, vijfde lid, van de Successiewet 1956][ref11], de onmiddellijk aan 1 januari 2025 voorafgaande periode
      van die terbeschikkingstelling en de periode waarin die onroerende zaken dienstbaar zijn aan de onderneming waarin
      die medegerechtigdheid is ontstaan bij elkaar gevoegd als ware het één periode.


