  - number: XII
    text: |-
      1 Voor de toepassing van de [afdelingen 3.2][ref1] en [3.4][ref2], [hoofdstuk 4][ref3] en de
      [afdelingen 7.2][ref4], [7.3][ref5] en [7.5 van de Wet inkomstenbelasting 2001][ref6] en de
      [Wet op de vennootschapsbelasting 1969][ref7] behoeft het voordeel dat is behaald door een commanditaire
      vennoot ter zake van de vervreemding van zijn aandeel in een open commanditaire vennootschap als bedoeld in
      [artikel IX, eerste lid][ref8], in het kader van een aandelenfusie als bedoeld in het tweede lid niet in aanmerking
      te worden genomen indien die aandelenfusie uiterlijk op 31 december 2024 plaatsvindt en latere heffing is
      verzekerd. De eerste zin is niet van toepassing op een in het kader van een aandelenfusie genoten bijbetaling.

      2 Voor de toepassing van dit artikel en de [artikelen XIII][ref9], [XIV][ref10] en [XVI][ref11] is sprake
      van een aandelenfusie indien een vennootschap (verkrijgende vennootschap) tegen uitreiking van eigen
      aandelen of winstbewijzen, eventueel met bijbetaling, dan wel bij wijze van storting op de aandelen in die
      vennootschap, het aandeel van de commanditaire vennoot in de open commanditaire vennootschap, bedoeld in
      [artikel IX, eerste lid][ref12], verwerft, tenzij:

      a. de bijbetaling 10 percent van de nominale waarde van de uitgereikte aandelen te boven gaat;

      b. de commanditaire vennoot die een aanmerkelijk belang heeft in de commanditaire vennootschap na het vervreemden
      van zijn aandeel in die vennootschap aan de verkrijgende vennootschap in het kader van de fusie geen aanmerkelijk
      belang heeft in die verkrijgende vennootschap; of

      c. de fusie per saldo resulteert in een vermogensverschuiving van de commanditaire vennoot in de open commanditaire
      vennootschap naar een of meer andere aandeelhouders in of andere gerechtigden tot het vermogen van de verkrijgende
      vennootschap.

      3 Indien de commanditaire vennoot onderworpen is aan de vennootschapsbelasting of het aandeel van de
      commanditaire vennoot in de open commanditaire vennootschap behoort tot het vermogen van een onderneming of van
      een werkzaamheid als bedoeld in de [afdelingen 3.2][ref13] en [7.2][ref14], onderscheidenlijk [3.4][ref15] en
      [7.2, van de Wet inkomstenbelasting 2001][ref16] en het voordeel volgens het eerste lid buiten aanmerking blijft,
      wordt voor de toepassing van de [Wet op de vennootschapsbelasting 1969][ref17] of de betreffende afdelingen van
      de [Wet inkomstenbelasting 2001][ref18] door die commanditaire vennoot de boekwaarde van de in het kader van de
      aandelenfusie verworven aandelen of winstbewijzen in de verkrijgende vennootschap gesteld op, dan wel wordt de
      boekwaarde van de aandelen in de verkrijgende vennootschap waarop in het kader van de aandelenfusie is gestort
      verhoogd met, de waarde waarvoor zijn aandeel in de open commanditaire vennootschap op het tijdstip onmiddellijk
      voorafgaand aan het fusietijdstip te boek was gesteld.

      4 Indien de commanditaire vennoot een aanmerkelijk belang als
      bedoeld in [hoofdstuk 4 van de Wet inkomstenbelasting 2001][ref19] of
      [artikel 17, derde lid, onderdeel b, van de Wet op de vennootschapsbelasting 1969][ref20] in de open commanditaire
      vennootschap heeft en het voordeel volgens het eerste lid buiten aanmerking blijft, wordt voor de toepassing van
      genoemd hoofdstuk 4, onderscheidenlijk genoemd artikel 17, derde lid, onderdeel b, de verkrijgingsprijs van de
      in het kader van de aandelenfusie verworven aandelen of winstbewijzen in de verkrijgende vennootschap gesteld
      op, dan wel wordt de verkrijgingsprijs van de aandelen in de verkrijgende vennootschap waarop in het kader van de
      aandelenfusie is gestort verhoogd met, de verkrijgingsprijs van het in het kader van de aandelenfusie vervreemde
      aandeel in de open commanditaire vennootschap.

      5 De [artikelen 13h][ref21] en [13i van de Wet op de vennootschapsbelasting 1969][ref22] zijn van overeenkomstige
      toepassing.

      6 In geval van een aandelenfusie als bedoeld in het tweede lid worden voor de toets of is voldaan aan de periode
      van één jaar, onderscheidenlijk vijf jaren, bedoeld in [artikel 35d, eerste lid, van de Successiewet 1956][ref23],
      de bezitsperiode van de in het kader van de aandelenfusie verkregen aandelen of winstbewijzen en de bezitsperiode
      van het in het kader van de aandelenfusie vervreemde aandeel in de open commanditaire vennootschap bij elkaar
      gevoegd als ware het één periode.

      7 Indien een commanditaire vennoot resultaat uit een werkzaamheid in de zin van
      [artikel 3.92, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref24] geniet vanwege het
      ter beschikking stellen van onroerende zaken aan een open commanditaire vennootschap als bedoeld in
      [artikel IX][ref25], eerste lid, en deze resultaatgenieter als gevolg van een aandelenfusie als bedoeld in
      het tweede lid met ingang van het tijdstip waarop de aandelenfusie plaatsvindt resultaat uit een werkzaamheid
      in de zin van [artikel 3.92, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref26] geniet,
      dan worden voor de toets of is voldaan aan de periode van één jaar, onderscheidenlijk vijf jaren, bedoeld in
      [artikel 35d, eerste lid, van de Successiewet 1956][ref27], beide periodes van het genieten van resultaat uit een
      werkzaamheid bij elkaar gevoegd als ware het één periode.

      8 Een aandelenfusie als bedoeld in het tweede lid wordt in afwijking van
      [artikel 35e van de Successiewet 1956][ref28] niet als een gebeurtenis als bedoeld in dat artikel aangemerkt.


