  - number: XIIIa
    text: |-
      Indien zonder toepassing van dit artikel een open commanditaire
      vennootschap als bedoeld in [artikel IX, eerste lid][ref1], op grond van
      [artikel 2.1, eerste lid, onderdeel e, van de Wet bronbelasting 2021][ref2] belastingplichtig is voor de
      bronbelasting met betrekking tot voordelen als bedoeld in [artikel 3.1, onderdeel c, van die wet][ref3] wordt
      voor de toepassing van die wet en de daarop berustende bepalingen niet die open commanditaire vennootschap maar
      elke achterliggende gerechtigde die een belang heeft in die open commanditaire vennootschap aangemerkt als de
      gerechtigde tot die voordelen, zulks naar rato van ieders gerechtigdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0049130#ArtikelIX
      [ref2]: https://wetten.overheid.nl/BWBR0042952#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0042952#Artikel3.1
