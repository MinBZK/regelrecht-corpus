  - number: XIV
    text: |-
      1 Voor zover een commanditaire vennoot die een aanmerkelijk belang als bedoeld in
      [artikel 35c, eerste lid, onderdeel c, juncto derde lid, van de Successiewet 1956][ref1] heeft in een open
      commanditaire vennootschap als bedoeld in [artikel IX][ref2], eerste lid, op 1 januari 2025 als gevolg van
      de inwerkingtreding van deze wet medegerechtigde als bedoeld in artikel 35c, eerste lid, onderdelen b of
      c, van de Successiewet 1956 wordt tot het vermogen van een door middel van die commanditaire vennootschap
      gedreven onderneming, wordt deze medegerechtigdheid voor de toepassing van de [Successiewet 1956](onbekend)
      en de daarop berustende bepalingen gelijkgesteld met een medegerechtigdheid die een rechtstreekse voortzetting
      vormt van een eerder door de erflater, schenker of vennootschap gedreven onderneming als bedoeld in
      [artikel 3.2 van de Wet inkomstenbelasting 2001][ref3].

      2 Indien het eerste lid is toegepast, worden voor de toets of is voldaan aan de periode van één jaar,
      onderscheidenlijk vijf jaren, bedoeld in [artikel 35d, eerste lid, van de Successiewet 1956][ref4], de
      bezitsperiode van de ontstane medegerechtigdheid en de bezitsperiode van het voor de inwerkingtreding
      van de wet bestaande aanmerkelijk belang in de open commanditaire vennootschap, bedoeld in
      [artikel 35c, eerste lid, onderdeel c, juncto derde lid, van de Successiewet 1956][ref5], bij elkaar gevoegd als
      ware het één periode.

      3 Indien het eerste lid is toegepast, wordt dit niet als een gebeurtenis als bedoeld in
      [artikel 35e, eerste lid, onderdeel c, van de Successiewet 1956][ref6] aangemerkt, waarbij voor de toets
      of is voldaan aan de periode van vijf jaren, bedoeld in artikel 35e van die wet, de voortzettingsperiode
      van de ontstane medegerechtigheid en de voortzettingsperiode van het voor de inwerkingtreding
      van deze wet bestaande aanmerkelijk belang in de open commanditaire vennootschap, bedoeld in
      [artikel 35c, eerste lid, onderdeel c, juncto derde lid, van de Successiewet 1956][ref7], bij elkaar worden gevoegd
      als ware het één periode.


