preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van. Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is maatregelen te treffen om het fiscale
    kwalificatiebeleid inzake rechtsvormen wettelijk te verankeren en aan te vullen en tevens het toestemmingsvereiste
    bij de kwalificatie van rechtsvormen te laten vervallen waardoor geen zelfstandige vennootschapsbelastingplicht van
    personenvennootschappen meer mogelijk is;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049130/2025-01-01#ArtikelAanhef
articles:
  - number: IX
    text: |-
      1 Voor de toepassing van de [Wet op de vennootschapsbelasting 1969][ref1] wordt een open commanditaire
      vennootschap als bedoeld in [artikel 2, derde lid, onderdeel c, van de Algemene wet inzake rijksbelastingen][ref2]
      zoals dat luidde op 31 december 2024, die als gevolg van deze wet met ingang van 1 januari 2025
      niet langer onderworpen is aan de vennootschapsbelasting op grond van de [artikelen 2][ref3] of
      [3 van de Wet op de vennootschapsbelasting 1969][ref4], geacht op het tijdstip onmiddellijk voorafgaand aan
      1 januari 2025 al haar vermogensbestanddelen tegen de waarde in het economische verkeer te hebben overgedragen
      aan de natuurlijk personen of lichamen die participeren in die vennootschap naar rato van ieders gerechtigdheid en
      wordt die vennootschap geacht te zijn opgehouden in Nederland belastbare winst te genieten.

      2 Voor de toepassing van de [Wet inkomstenbelasting 2001][ref5] en de [Wet op de vennootschapsbelasting 1969][ref6]
      wordt de commanditaire vennoot in een open commanditaire vennootschap als bedoeld in het eerste lid geacht op het
      tijdstip onmiddellijk voorafgaand aan 1 januari 2025 zijn aandeel in en schuldvordering op de open commanditaire
      vennootschap te hebben vervreemd tegen de waarde in het economische verkeer.

      3 Voor de toepassing van de [Wet inkomstenbelasting 2001][ref7] wordt een belastingplichtige die resultaat uit
      een werkzaamheid in de zin van [artikel 3.92 van die wet][ref8] geniet vanwege het ter beschikking stellen van
      vermogensbestanddelen aan een open commanditaire vennootschap als bedoeld in het eerste lid, geacht op het tijdstip
      onmiddellijk voorafgaand aan 1 januari 2025 de tot die werkzaamheid behorende vermogensbestanddelen te hebben
      vervreemd tegen de waarde in het economische verkeer en wordt die belastingplichtige geacht te zijn opgehouden
      in Nederland belastbaar resultaat uit die werkzaamheid te genieten, tenzij de tot die werkzaamheid behorende
      vermogensbestanddelen op 1 januari 2025 door die belastingplichtige nog steeds worden aangewend ten behoeve van een
      werkzaamheid als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a of b][ref9], of [3.92 van die wet][ref10].
      De vervreemding, bedoeld in de eerste zin, wordt niet aangemerkt als een vervreemding als bedoeld in
      [artikel 25, veertiende lid, onderdeel a, van de Invorderingswet 1990][ref11].

      4 Indien een schuldvordering als bedoeld in het tweede lid kwalificeert als een schuldvordering als bedoeld
      in [artikel 17a, onderdeel c, van de Wet op de vennootschapsbelasting 1969][ref12] en die schuldvordering is
      afgewaardeerd ten laste van de belastbare winst uit een Nederlandse onderneming van een commanditaire vennoot,
      wordt voor de toepassing van het tweede lid ter zake van die schuldvordering tot de winst van die vennoot gerekend
      een bedrag gelijk aan die afwaardering voor zover met betrekking tot die schuldvordering niet reeds eerder in
      verband met die afwaardering een bedrag tot de winst van die vennoot is gerekend.


