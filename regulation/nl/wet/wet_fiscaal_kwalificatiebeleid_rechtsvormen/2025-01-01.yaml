  - number: XV
    text: |-
      1 In het kader van een aandelenfusie als bedoeld in [artikel XII][ref1] is van overdrachtsbelasting als bedoeld in
      [artikel 1, onderdeel a, van de Wet op belastingen van rechtsverkeer][ref2] vrijgesteld:

      a. de verkrijging door een vennootschap krachtens inbreng door de inbrenger; en

      b. de verkrijging door de inbrenger van aandelen als bedoeld in
      [artikel 4, eerste lid, onderdeel a, van de Wet op belastingen van rechtsverkeer][ref3];

      mits in het kader van de aandelenfusie de verkrijgende vennootschap aan de inbrenger aandelen uitreikt, dan wel
      een storting op de aandelenin die vennootschap plaatsvindt, en de inbrenger door middel van die uitgereikte,
      onderscheidenlijk bestaande, aandelen een soortgelijk belang houdt in die vennootschap, als hij had in de
      vennootschappelijke gemeenschap van de open commanditaire vennootschap, bedoeld in [artikel IX, eerste lid][ref4],
      op het tijdstip onmiddellijk voorafgaand aan de inbreng.

      2 De vrijstelling, bedoeld in het eerste lid, is niet van toepassing:

      a. indien de verkrijging betrekking heeft op voor onroerende zaken die zijn ingebracht in een open commanditaire
      vennootschap die tot stand is gekomen na 19 september 2023, 15:15 uur; of

      b. voor zover de verkrijging betrekking heeft op onroerende zaken die zijn ingebracht door commanditaire vennoten
      die na 19 september 2023, 15:15 uur, zijn toegetreden tot een open commanditaire vennootschap.

      3 De overdrachtsbelasting die ingevolge het eerste lid niet is geheven is alsnog verschuldigd indien de inbrenger
      het door de aandelen vertegenwoordigde soortgelijke belang binnen drie jaren na de aandelenfusie, bedoeld in
      [artikel XII][ref5], niet meer geheel in het bezit heeft. De bepaling is eveneens van toepassing bij vervreemding
      van claims of het verlenen van een koopoptie op de aandelen, alsmede bij een gehele of gedeeltelijke terugbetaling
      van hetgeen op de aandelen is gestort.

      4 Het derde lid blijft buiten toepassing in geval van een vervreemding van het door de aandelen vertegenwoordigde
      soortgelijke belang door de inbrenger, indien de verkrijger ter zake van de verkrijging van dat door de aandelen
      vertegenwoordigde soortgelijke belang overdrachtsbelasting verschuldigd is.

      5 Het derde lid blijft buiten toepassing in geval van een vervreemding van het door de aandelen vertegenwoordigde
      soortgelijke belang door de inbrenger:

      a. in het kader van een fusie of splitsing of interne reorganisatie waarop de vrijstelling, bedoeld in
      [artikel 15, eerste lid, onderdeel h, van de Wet op belastingen van rechtsverkeer][ref6], wordt toegepast; dan wel

      b. indien ten minste 75 percent van de aandelen van de vennootschap die de aandelen aan de inbrenger
      heeft toegekend wordt verkregen door een andere vennootschap tegen toekenning van een door eigen aandelen
      vertegenwoordigd soortgelijk belang.

      6 Voor de toepassing van het vijfde lid, onderdeel b, wordt onder toekenning van aandelen mede begrepen het geval
      waarin naast toekenning van aandelen tevens een bedrag in geld wordt betaald van ten hoogste10 percent van de
      nominale waarde van de toegekende aandelen.

      7 Het vijfde lid is slechts van toepassing indien het toegekende belang in de plaats komt van het door de aandelen
      vertegenwoordigde soortgelijke belang, bedoeld in het derde lid, dan wel het toegekende belang de resterende
      periode in het bezit blijft van de opvolgende verkrijger.

      8 [Artikel 15, negende lid, van de Wet op belastingen van rechtsverkeer][ref7] is van overeenkomstige toepassing op
      de vrijstelling, bedoeld in het eerste lid, met dien verstande dat aangifte wordt gedaan op een door de inspecteur
      aangegeven wijze.


