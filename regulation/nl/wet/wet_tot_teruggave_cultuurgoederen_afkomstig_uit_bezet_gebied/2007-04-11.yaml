---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_tot_teruggave_cultuurgoederen_afkomstig_uit_bezet_gebied
regulatory_layer: WET
publication_date: '2015-12-18'
valid_from: '2007-04-11'
bwb_id: BWBR0021656
url: https://wetten.overheid.nl/BWBR0021656/2007-04-11
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is cultuurgoederen die afkomstig zijn uit een tijdens
    een gewapend conflict bezet gebied, terug te geven aan de bevoegde autoriteiten van het gebied van herkomst
    teneinde te voldoen aan het Protocol van 14 mei 1954 behorend bij het op die dag tot stand gekomen Verdrag inzake
    de bescherming van culturele goederen in geval van een gewapend conflict (Trb. 1955, 47) en dat het daartoe
    wenselijk is regels te stellen die het mogelijk maken in voorkomende gevallen dergelijke cultuurgoederen in
    bewaring te nemen en ten aanzien daarvan een vordering tot teruggave in te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel1
  - number: 1.b
    text: |-
      Protocol: het Protocol van 14 mei 1954 behorend bij het op die dag te ’s-Gravenhage tot stand gekomen Verdrag
      inzake de bescherming van culturele goederen in geval van een gewapend conflict (Trb. 1955, 47);
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel1
  - number: 1.c
    text: 'cultuurgoederen: culturele goederen als bedoeld in artikel 1, onder a, van het onder b genoemde verdrag;'
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel1
  - number: 1.d
    text: |-
      bezet gebied: een op of na 14 januari 1959 tijdens een gewapend conflict bezet gebied waarop artikel I van het
      Protocol van toepassing is.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel1
  - number: '2'
    text: |-
      Het is verboden om cultuurgoederen afkomstig uit een bezet gebied Nederland binnen te brengen of in Nederland onder
      zich te houden.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister neemt cultuurgoederen ten aanzien waarvan een redelijk vermoeden bestaat dat het verbod van
      [artikel 2][ref1] wordt overtreden in bewaring:


      [ref1]: https://wetten.overheid.nl/BWBR0021656#Artikel2
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021656
        artikel: '2'
        hoofdstuk: '1'
  - number: 3.1.a
    text: uit eigen beweging bij het binnenbrengen in Nederland, of
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel3
  - number: 3.1.b
    text: op verzoek van de autoriteiten van het desbetreffende bezet gebied of eertijds bezet gebied.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister kan in Nederland aangetroffen cultuurgoederen ten aanzien waarvan het in het eerste lid bedoelde
      vermoeden bestaat, eveneens uit eigen beweging in bewaring nemen, indien tevens een redelijke verwachting bestaat
      dat een verzoek als bedoeld in het eerste lid, onder b, zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister stelt voorafgaand aan de inbewaringneming zijn beslissing daartoe op schrift. De schriftelijke
      beslissing is een beschikking.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel4
  - number: '4.2'
    text: 'De beschikking wordt zo spoedig mogelijk bekend gemaakt aan:'
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel4
  - number: 4.2.a
    text: de autoriteiten van het desbetreffende bezet gebied,
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel4
  - number: 4.2.b
    text: de eigenaar van de in bewaring genomen cultuurgoederen, zo deze bekend is,
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel4
  - number: 4.2.c
    text: beperkt gerechtigden met betrekking tot die goederen, zo deze bekend zijn, en
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel4
  - number: 4.2.d
    text: degene die ten tijde van de inbewaringneming die goederen onder zich hield.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel4
  - number: '4.3'
    text: |-
      Indien de situatie dermate spoedeisend is dat Onze Minister de beslissing tot inbewaringneming niet tevoren op
      schrift kan stellen, zorgt hij alsnog zo spoedig mogelijk voor opschriftstelling en voor de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel4
  - number: '5.1'
    text: |-
      De kosten verbonden aan de toepassing van inbewaringneming, kunnen, indien daartoe aanleiding bestaat, bij
      beschikking van Onze Minister geheel of ten dele ten laste worden gebracht van degene die het verbod van
      [artikel 2][ref1] overtreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0021656#Artikel2
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0021656
        artikel: '2'
        hoofdstuk: '1'
  - number: '5.2'
    text: 'In elk geval zijn geen kosten verschuldigd indien:'
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel5
  - number: 5.2.a
    text: |-
      bij uitspraak die in kracht van gewijsde is gegaan, de rechtsvordering, bedoeld in [artikel 7][ref1], wordt
      afgewezen dan wel een schadeloosstelling of billijke vergoeding als bedoeld in [artikel 7, derde lid][ref2], wordt
      toegekend, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0021656#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0021656#Artikel7
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0021656
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0021656
        artikel: '7'
        hoofdstuk: '3'
  - number: 5.2.b
    text: Onze Minister definitief van teruggave van het cultuurgoed afziet.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel5
  - number: '5.3'
    text: |-
      Indien zich een geval als bedoeld in het tweede lid voordoet, nadat Onze Minister reeds een beschikking als bedoeld
      in het eerste lid heeft gegeven, trekt hij deze beschikking in.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel5
  - number: '5.4'
    text: |-
      De beschikking vermeldt het in rekening te brengen bedrag. Onder de kosten kunnen worden begrepen de kosten
      verbonden aan de voorbereiding van de inbewaringneming.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel5
  - number: '5.5'
    text: |-
      Onze Minister kan van de overtreder bij dwangbevel de ingevolge de vorige leden verschuldigde kosten, verhoogd met
      de op de invordering vallende kosten, invorderen.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel5
  - number: '5.6'
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. Er vindt echter geen
      tenuitvoerlegging plaats zolang het geval van het tweede lid, onder a, zich nog kan voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '5.7'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel5
  - number: '5.8'
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van Onze Minister kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel5
  - number: '6.1'
    text: 'De inbewaringneming eindigt:'
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel6
  - number: 6.1.a
    text: |-
      bij teruggave van de cultuurgoederen aan de autoriteiten van het desbetreffende bezet gebied of eertijds bezet
      gebied na voorafgaande toewijzing van een rechtsvordering als bedoeld in [artikel 7][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0021656#Artikel7
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0021656
        artikel: '7'
        hoofdstuk: '3'
  - number: 6.1.b
    text: |-
      bij afwijzing van een rechtsvordering tot teruggave als bedoeld in [artikel 7][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0021656#Artikel7
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0021656
        artikel: '7'
        hoofdstuk: '3'
  - number: 6.1.c
    text: |-
      bij beschikking van Onze Minister, indien de autoriteiten van het desbetreffende bezet gebied of eertijds bezet
      gebied een door hen ingediend verzoek tot inbewaringneming van cultuurgoederen intrekken, dan wel indien zij bij
      inbewaringneming van cultuurgoederen uit eigen beweging door Onze Minister verklaren geen verzoek tot teruggave van
      cultuurgoederen in te dienen, of
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel6
  - number: 6.1.d
    text: bij beschikking van Onze Minister wegens andere redenen dan bedoeld onder a tot en met c.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel6
  - number: '6.2'
    text: |-
      Indien de inbewaringneming eindigt zonder dat het cultuurgoed wordt teruggegeven aan de in het eerste lid, onder
      a, bedoelde autoriteiten, wordt het afgegeven aan degene die het cultuurgoed bij de aanvang van de inbewaringneming
      onder zich hield, dan wel aan degene die redelijkerwijs als rechthebbende kan worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister stelt, nadat hij cultuurgoederen in bewaring heeft genomen, voor de rechter die naar de regels
      van het [Wetboek van Burgerlijke Rechtsvordering][ref1] bevoegd is, een rechtsvordering tot teruggave van die
      cultuurgoederen in tegen de bezitter, of bij ontstentenis van een bezitter, tegen de houder.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '7.2'
    text: |-
      De [artikelen 86][ref1], [88, eerste lid][ref2], en [99, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref3],
      noch overeenkomsten op grond waarvan cultuurgoederen afkomstig uit bezet gebied zijn vervreemd of bezwaard, kunnen
      worden tegengeworpen aan Onze Minister die op grond van het eerste lid cultuurgoederen opeist.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel99
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '86'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '88'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '99'
  - number: '7.3'
    text: |-
      De rechter die een rechtsvordering als bedoeld in het eerste lid toewijst, kent ten laste van de staat aan de
      bezitter of de houder toe:
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel7
  - number: 7.3.a
    text: |-
      een schadeloosstelling, indien deze aannemelijk maakt het cultuurgoed in eigendom te hebben of te hebben verkregen,
      dan wel voorzover het betreft andere gevallen:
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel7
  - number: 7.3.b
    text: |-
      een naar gelang van de omstandigheden billijke vergoeding, indien deze bij de verkrijging van het cultuurgoed de
      nodige zorgvuldigheid heeft betracht.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel7
  - number: '7.4'
    text: |-
      Indien de bezitter of de houder van wie de teruggave van een cultuurgoed wordt gevorderd, niet voldoet aan de
      verplichting die [artikel 87 van Boek 3 van het Burgerlijk Wetboek][ref1] hem oplegt, blijft het derde lid, onder
      b, ten aanzien van hem buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel87
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '87'
  - number: '7.5'
    text: Een rechtsvordering als bedoeld in het eerste lid verjaart niet.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel7
  - number: '8'
    text: 'Met het toezicht op de naleving van het bij deze wet bepaalde zijn belast:'
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel8
  - number: 8.a
    text: |-
      de inspecteur, bedoeld in [artikel 1, onder f, van de Wet tot behoud van cultuurbezit][ref1], en de ambtenaren,
      bedoeld in [artikel 15, eerste lid, van die wet][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003659#Artikel15
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003659
        artikel: '15'
  - number: 8.b
    text: de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel8
  - number: '9'
    text: |-
      De in [artikel 8, onder a][ref1], bedoelde ambtenaren zijn bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0021656#Artikel8
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021656
        artikel: '8'
        hoofdstuk: '4'
  - number: 9.a
    text: met medeneming van de benodigde apparatuur een woning binnen te treden zonder toestemming van de bewoner,
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel9
  - number: 9.b
    text: te vorderen dat de bewoner hun cultuurgoederen die in de woning aanwezig zijn, toont,
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel9
  - number: 9.c
    text: |-
      ruimten en voorwerpen te verzegelen, voorzover dat voor de uitoefening van de in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref1] bedoelde bevoegdheden redelijkerwijs noodzakelijk is, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.d
    text: |-
      zo nodig met behulp van de sterke arm de bevoegdheid, bedoeld in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref1] uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '10'
    text: |-
      Op de in de [artikelen 8, onder b][ref1], bedoelde ambtenaren zijn de [hoofdstukken 2][ref2] en
      [3 van de Douanewet][ref3], met uitzondering van [artikel 10 van hoofdstuk 2 van die wet][ref4], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021656#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007632#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0007632#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0007632#Artikel10
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0021656
        artikel: '8'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007632
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007632
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0007632
        artikel: '10'
  - number: '12'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel12
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Wet tot teruggave cultuurgoederen afkomstig uit bezet gebied.'
    url: https://wetten.overheid.nl/BWBR0021656/2007-04-11#Artikel13
