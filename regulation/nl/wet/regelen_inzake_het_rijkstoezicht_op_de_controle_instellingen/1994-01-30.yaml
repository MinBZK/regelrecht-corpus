preamble:
  text: |-
    Gelet op artikel 12, vierde lid, van de Landbouwkwaliteitswet (Stb. 1971, 371),

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003121/1994-01-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het rijkstoezicht is gericht op:

      a. de juiste uitvoering van de opgedragen taak door de controle-instelling;

      b. het naar behoren functioneren van de controle-instelling en haar onderdelen;

      c. een verantwoord administratief en financieel beheer;

      d. het naar behoren functioneren van het tuchtrechtelijk stelsel.

      2 Het rijkstoezicht omvat mede het toezicht op de naleving door de controle-instelling van haar statuten en
      reglementen.
    url: https://wetten.overheid.nl/BWBR0003121/1994-01-30#Artikel1
  - number: '2'
    text: |-
      1 Met de uitoefening van het rijkstoezicht op een controle-instelling zijn belast de ambtenaren, die de Minister
      van Landbouw, Natuurbeheer en Visserij daartoe heeft aangewezen. De Minister kan hun nader omschreven bevoegdheden
      verlenen.

      2 Een aanwijzing krachtens het bepaalde in [artikel 12, derde lid, van de Landbouwkwaliteitswet][ref1] (Stb. 1971,
      371) sluit in een aanwijzing, bedoeld in het voorgaande lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel12
    url: https://wetten.overheid.nl/BWBR0003121/1994-01-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '12'
  - number: '3'
    text: |-
      De controle-instelling is verplicht ten behoeve van het welslagen van het rijkstoezicht:

      a. aan de daarmede belaste ambtenaren, al dan niet op hun verzoek, alle mededelingen te doen of inlichtingen te
      verstrekken, het toezenden van uitgestuurde stukken daaronder begrepen, of hen anderszins op de hoogte te stellen
      omtrent, dan wel medewerking te verlenen aan al hetgeen van belang is of zou kunnen zijn voor de uitoefening van
      het rijkstoezicht;

      b. aan de ambtenaren, aangewezen krachtens het bepaalde in
      [artikel 12, derde lid, van de Landbouwkwaliteitswet][ref1], alle stukken, welke bestemd zijn voor het bestuur of
      het dagelijks bestuur van de controle-instelling tijdig toe te zenden;

      c. jaarlijks een verslag te doen aan de de Minister van Landbouw, Natuurbeheer en Visserij omtrent hetgeen de
      controle-instelling in het daaraan voorafgaande kalenderjaar heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel12
    url: https://wetten.overheid.nl/BWBR0003121/1994-01-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '12'
  - number: '4'
    text: |-
      1 De ambtenaren, belast met het rijkstoezicht, kunnen, al dan niet op grond van de ingevolge [artikel 3][ref1]
      verkregen wetenschap, verzoeken, dat de controle-instelling hun inzage geeft in uit te sturen stukken, dan wel
      overleg pleegt over zodanige stukken of andere te nemen besluiten.

      2 De ambtenaren, belast niet het rijkstoezicht, kunnen ten behoeve van het welslagen daarvan de medewerking
      inroepen van andere ambtenaren, werkzaam bij het Ministerie van Landbouw, Natuurbeheer en Visserij
      of bij de daaronder ressorterende diensten, instellingen of stichtingen. Voor het toezicht bedoeld in
      [artikel 1, eerste lid, onder b][ref2], kan de medewerking worden ingeroepen van het Rijkskwaliteitsinstituut voor
      land- en tuinbouwprodukten te Wageningen. De ingeroepen medewerking wordt naar behoren verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003121#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003121#Artikel1
    url: https://wetten.overheid.nl/BWBR0003121/1994-01-30#Artikel4
