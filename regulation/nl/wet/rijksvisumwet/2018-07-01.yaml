  - number: '17.1'
    text: |-
      Een op grond van het
      __REF000___________________________________________________________________________________________________________
      _______________________ verleend visum voor de toegang tot de landen of de openbare lichamen geldt als een visum,
      verleend op grond van deze rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0001822
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001822
  - number: '17.2'
    text: |-
      Op de behandeling van visumaanvragen die zijn ingediend voor het tijdstip van inwerkingtreding van deze rijkswet
      blijft het recht dat voor dat tijdstip gold van toepassing.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel17
  - number: '17.3'
    text: |-
      De bij inwerkingtreding van deze rijkswet geldende landsregelgeving met betrekking tot onderwerpen die bij deze
      rijkswet ter regeling aan landsregelgeving is overgelaten, geldt vanaf inwerkingtreding van deze rijkswet ten
      aanzien van die onderwerpen als landsregelgeving ingevolge deze rijkswet. Bepalingen die niet verenigbaar zijn met
      deze rijkswet of met het door Onze Minister van Buitenlandse Zaken bepaalde krachtens deze rijkswet blijven buiten
      toepassing.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel17
  - number: '18'
    text: |-
      Deze rijkswet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor invoering van de
      verschillende artikelen of onderdelen voor de afzonderlijke landen of openbare lichamen verschillend kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel18
  - number: '19'
    text: 'Deze rijkswet wordt aangehaald als: Rijksvisumwet.'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel19
