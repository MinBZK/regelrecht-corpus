---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: rijksvisumwet
regulatory_layer: WET
publication_date: '2016-09-08'
valid_from: '2018-07-01'
bwb_id: BWBR0038494
url: https://wetten.overheid.nl/BWBR0038494/2018-07-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het licht van de gewijzigde staatkundige verhoudingen binnen het
    Koninkrijk en met het oog op de naleving van de internationale verplichtingen van het Koninkrijk en het tegengaan
    van illegale immigratie wenselijk is harmonisatie van de visumverlening voor de toegang tot de afzonderlijke landen
    van het Koninkrijk te bevorderen door het regelen van de hoofdlijnen van het visumbeleid in een rijkswet op basis
    van artikel 3, eerste lid, onderdelen b en g, van het Statuut voor het Koninkrijk;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.a
    text: |-
      *Vreemdeling:* ieder die de Nederlandse nationaliteit niet bezit en niet op grond van een wettelijke bepaling als
      Nederlander moet worden behandeld;
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.b
    text: '*Nederland:* het land Nederland, met uitzondering van de openbare lichamen Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.c
    text: '*Landen:* de landen Curaçao, Aruba en Sint Maarten;'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.d
    text: '*Openbare lichamen:* de openbare lichamen Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.e
    text: |-
      *Visum voor de toegang tot de landen en de openbare lichamen:* beslissing van de bevoegde autoriteit dat op het
      moment van afgifte geen bezwaar bestaat tegen de toegang tot de landen en openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.f
    text: '*Bevoegde autoriteit:*'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.f.−
    text: 'wat betreft de openbare lichamen: Onze Minister van Buitenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.f.−
    text: 'wat betreft de landen: de Minister van het desbetreffende land wie het aangaat;'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.g
    text: |-
      *Geldigheidsduur van een visum:* het tijdvak waarbinnen na afgifte van een visum daarvan gebruik kan worden gemaakt
      voor het verkrijgen van toegang;
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.h
    text: |-
      *Verblijfstermijn:* de maximale duur van het geoorloofd verblijf op grond van [artikel 5, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038494#Artikel5
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0038494
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 1.i
    text: '*Landsregelgeving:*'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.i.−
    text: 'wat betreft de openbare lichamen: regeling van Onze Minister van Buitenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: 1.i.−
    text: |-
      wat betreft de landen: algemeen verbindende voorschriften, vastgesteld door het daartoe bevoegde orgaan van het
      desbetreffende land.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel1
  - number: '2.1'
    text: Deze wet is van toepassing op de verlening van visa voor de toegang tot de landen en de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister van Buitenlandse Zaken is belast met de verlening van de visa, bedoeld in artikel 2 van de
      Verordening van de Raad van de Europese Gemeenschappen van 15 maart 2001, nr. 539/2001/EG (Pb EU L81) voor de
      toegang tot Nederland. Bepalingen omtrent andere visa voor de toegang tot Nederland dan bedoeld in de eerste volzin
      worden bij of krachtens de wet vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel2
  - number: '3'
    text: |-
      De bevoegde autoriteit van elk van de landen neemt bij de uitoefening van haar bevoegdheden het door Onze Minister
      van Buitenlandse Zaken gevoerde beleid inzake de buitenlandse betrekkingen, daaronder begrepen het visumbeleid,
      in acht.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel3
  - number: '4'
    text: |-
      De hoofden van de diplomatieke en consulaire vertegenwoordigingen van het Koninkrijk zijn belast met de behandeling
      van visumaanvragen namens de bevoegde autoriteiten. In overeenstemming met Onze Minister van Buitenlandse Zaken
      kunnen de bevoegde autoriteiten van de landen aan de hoofden van de diplomatieke of consulaire vertegenwoordiging
      van het Koninkrijk aanwijzingen geven over de uitvoering van deze wet ten aanzien van het desbetreffende land door
      de ambtenaren werkzaam op die vertegenwoordiging.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel4
  - number: '5.1'
    text: |-
      Een visum, verleend op grond van deze rijkswet, is vereist voor het verkrijgen van een of meer malen toegang van
      vreemdelingen tot de landen en de openbare lichamen. Bij of krachtens landsregelgeving kan worden bepaald dat
      aan het visum een verblijfstermijn kan worden verbonden. De eerste volzin laat onverlet hetgeen overigens bij of
      krachtens enig wettelijk voorschrift is bepaald omtrent de toegang en de toelating tot de landen en de openbare
      lichamen.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel5
  - number: '5.2'
    text: 'Het eerste lid is niet van toepassing ten aanzien van vreemdelingen die:'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel5
  - number: 5.2.a
    text: krachtens verdrag of bindend besluit van een volkenrechtelijke organisatie daarvan zijn vrijgesteld,
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel5
  - number: 5.2.b
    text: |-
      drager zijn van een bij regeling van Onze Minister van Buitenlandse Zaken in overeenstemming met de bevoegde
      autoriteit aangewezen nationaliteit,
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel5
  - number: 5.2.c
    text: |-
      behoren tot een bij regeling van Onze Minister van Buitenlandse Zaken in overeenstemming met de bevoegde autoriteit
      aangeduide categorie of
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel5
  - number: 5.2.d
    text: |-
      beschikken over een geldige machtiging tot voorlopig verblijf, verleend op grond van de
      [Wet toelating en uitzetting BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028571
  - number: '5.3'
    text: |-
      Bij de vaststelling van de regelingen, bedoeld in het tweede lid, neemt Onze Minister van Buitenlandse Zaken het
      belang van harmonisatie van het visumbeleid binnen het Koninkrijk en de belangen van de landen en de openbare
      lichamen, met name hun economische belangen, in acht.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel5
  - number: '5.4'
    text: |-
      De bevoegde autoriteit kan in aanvulling op het bepaalde krachtens het tweede lid in bijzondere gevallen ontheffing
      verlenen van de visumplicht.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel5
  - number: '6'
    text: |-
      Een voor toegang tot een van de landen of openbare lichamen verleend visum geldt mede als visum voor de toegang
      tot de overige landen en openbare lichamen, tenzij de bevoegde autoriteit van een van de overige landen of openbare
      lichamen uit oogpunt van openbare orde of nationale veiligheid geen medegelding toestaat. In het geval geen
      medegelding wordt toegestaan, verbindt de bevoegde autoriteit die op de aanvraag beslist een territoriale beperking
      aan het visum.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel6
  - number: '7.1'
    text: |-
      Een visum wordt door de vreemdeling in persoon, indien de bevoegde autoriteit dat verlangt in aanwezigheid van
      diens wettelijke vertegenwoordiger, aangevraagd bij een diplomatieke of consulaire vertegenwoordiging van het
      Koninkrijk met gebruikmaking van het door Onze Minister van Buitenlandse Zaken daartoe vastgestelde formulier.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel7
  - number: '7.2'
    text: |-
      De bevoegde autoriteit kan vrijstelling of ontheffing verlenen van de verplichting tot persoonlijke verschijning,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel7
  - number: '7.3'
    text: |-
      Bij regeling van Onze Minister van Buitenlandse Zaken kan in aanvulling op het eerste lid worden bepaald dat een
      visum elders dan bij een diplomatieke of consulaire vertegenwoordiging van het Koninkrijk kan worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel7
  - number: '7.4'
    text: |-
      In afwijking van het eerste lid kan bij regeling van Onze Minister van Buitenlandse Zaken worden bepaald dat een
      visum langs elektronische weg kan worden aangevraagd. In deze regeling worden nadere regels gesteld met betrekking
      tot de wijze waarop de aanvraag wordt ingediend, alsmede met betrekking tot het beheer van bij de aanvraag
      verstrekte gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de aanvrager niet heeft voldaan aan het bij of krachtens deze rijkswet bepaalde voor het in behandeling
      nemen van de aanvraag of indien de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de
      aanvraag, kan de bevoegde autoriteit besluiten de aanvraag niet te behandelen, mits de aanvrager de gelegenheid
      heeft gehad binnen een door de bevoegde autoriteit gestelde termijn de aanvraag aan te vullen.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid kan de bevoegde autoriteit besluiten een aanvraag niet te behandelen zonder de
      aanvrager in de gelegenheid te hebben gesteld de aanvraag aan te vullen indien:
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel8
  - number: 8.2.a
    text: |-
      de aanvraag niet door de vreemdeling in persoon is ingediend, onverminderd [artikel 7, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0038494#Artikel7
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0038494
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
  - number: 8.2.b
    text: voor de aanvraag geen gebruik is gemaakt van het voorgeschreven formulier dat volledig is ingevuld en ondertekend,
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel8
  - number: 8.2.c
    text: de aanvraag niet is gesteld in de Nederlandse, Franse, Engelse of Spaanse taal of
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel8
  - number: 8.2.d
    text: de voor de behandeling van de aanvraag verschuldigde vergoeding niet is voldaan.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel8
  - number: '9.1'
    text: 'De bevoegde autoriteit kan op aanvraag van de vreemdeling een visum verlenen indien de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel9
  - number: 9.1.a
    text: beschikt over een geldig reisdocument,
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel9
  - number: 9.1.b
    text: geen gevaar oplevert voor de openbare orde,
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel9
  - number: 9.1.c
    text: geen gevaar oplevert voor de nationale veiligheid,
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel9
  - number: 9.1.d
    text: geen gevaar oplevert voor de volksgezondheid,
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel9
  - number: 9.1.e
    text: geen gevaar oplevert voor de internationale betrekkingen en
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel9
  - number: 9.1.f
    text: |-
      beschikt over voldoende middelen van bestaan, zowel voor het voorgenomen verblijf als voor de terugreis of de
      doorreis naar een derde Staat waar de toegang is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel9
  - number: '9.2'
    text: |-
      De bevoegde autoriteit kan in afwijking van het eerste lid en onverminderd [artikel 13][ref1] een visum verlenen
      indien daarmee een wezenlijk belang van de landen of de openbare lichamen is gediend of klemmende redenen van
      humanitaire aard daartoe nopen dan wel het belang van de internationale betrekkingen de verlening van een visum
      vordert. Bij toepassing van de eerste volzin verbindt de bevoegde autoriteit in voorkomend geval een territoriale
      beperking aan het visum.


      [ref1]: https://wetten.overheid.nl/BWBR0038494#Artikel13
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0038494
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: '9.3'
    text: |-
      Bij landsregelgeving kunnen nadere regels worden gesteld voor de toepassing van het eerste lid, onder b, c, d en f,
      en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel9
  - number: '10.1'
    text: |-
      Ten behoeve van de beoordeling van een visumaanvraag verlangt de bevoegde autoriteit van de vreemdeling dat deze
      het doel en de omstandigheden van het voorgenomen verblijf op een door de bevoegde autoriteit te bepalen wijze
      aannemelijk maakt.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel10
  - number: '10.2'
    text: Bij landsregelgeving kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel10
  - number: '11.1'
    text: 'De bevoegde autoriteit weigert het visum indien:'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel11
  - number: 11.1.a
    text: |-
      de vreemdeling niet voldoet aan de vereisten, bedoeld in [artikel 9, eerste lid][ref1], onverminderd artikel 9,
      tweede lid, dan wel niet voldoet aan [artikel 10, eerste lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0038494#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0038494#Artikel10
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0038494
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0038494
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
  - number: 11.1.b
    text: |-
      het reisdocument zijn geldigheid zal verliezen binnen drie maanden, in bijzondere gevallen binnen een maand, na
      afloop van het ten hoogste toegestane verblijf.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel11
  - number: '11.2'
    text: 'Voorts kan een visum worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel11
  - number: 11.2.a
    text: de vreemdeling een aanvraag om een verblijfsrecht heeft gedaan waarop nog niet is beslist,
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel11
  - number: 11.2.b
    text: |-
      de vreemdeling voorafgaand aan diens visumaanvraag in een van de landen of openbare lichamen verblijf hield zonder
      daartoe geldige titel,
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel11
  - number: 11.2.c
    text: de vreemdeling bij de aanvraag onjuiste gegevens heeft verstrekt of
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel11
  - number: 11.2.d
    text: |-
      grond bestaat om aan te nemen dat de vreemdeling de verplichtingen verbonden aan het visum of het daarmee verband
      houdende verblijf niet zal nakomen; zulke grond bestaat in elk geval indien de vreemdeling de verplichtingen
      verbonden aan een eerder verleend visum of verblijfsrecht niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel11
  - number: '12.1'
    text: |-
      De bevoegde autoriteit stelt de geldigheidsduur van het visum vast, kan daaraan overeenkomstig de regels, bedoeld
      in [artikel 5, eerste lid][ref1], een verblijfstermijn verbinden en kan met het oog op de bescherming van de
      openbare orde, de nationale veiligheid, de volksgezondheid of de internationale betrekkingen of met het oog op het
      toezicht op de naleving van het bepaalde bij of krachtens deze rijkswet:


      [ref1]: https://wetten.overheid.nl/BWBR0038494#Artikel5
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038494
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 12.1.a
    text: het visum onder beperkingen verlenen,
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel12
  - number: 12.1.b
    text: voorschriften aan het visum verbinden.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel12
  - number: '12.2'
    text: |-
      De bevoegde autoriteit kan een reeds verleend visum waarvan de geldigheidsduur of de op grond van
      [artikel 5, eerste lid][ref1], daaraan verbonden verblijfstermijn niet is verstreken, wijzigen of intrekken indien
      de visumverlening onjuist was, gewijzigde omstandigheden zich tegen handhaving van het visum verzetten of de
      vreemdeling de aan het visum verbonden verplichtingen niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0038494#Artikel5
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038494
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '13'
    text: |-
      Indien het belang van de internationale betrekkingen betrokken kan zijn bij een besluit van de bevoegde autoriteit
      inzake visumverlening stelt de bevoegde autoriteit Onze Minister van Buitenlandse Zaken in de gelegenheid om zijn
      zienswijze aan de bevoegde autoriteit kenbaar te maken. De bevoegde autoriteit neemt diens zienswijze in acht bij
      zijn besluit.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel13
  - number: '14.1'
    text: |-
      De bevoegde autoriteit brengt het visum aan in het reisdocument. Indien het reisdocument is afgegeven door een
      autoriteit van een niet als zodanig door het Koninkrijk der Nederlanden erkende staat of andere omstandigheden in
      de weg staan aan toepassing van de eerste volzin wordt het visum afzonderlijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel14
  - number: '14.2'
    text: Onze Minister van Buitenlandse Zaken stelt het model van het visum vast.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister van Buitenlandse Zaken en de bevoegde autoriteiten van de landen voeren regelmatig overleg over
      aangelegenheden die de toepassing van deze wet ten aanzien van de landen en de openbare lichamen betreffen. Het
      overleg is gericht op bevordering van de eenheid van het visumbeleid, in aanmerking genomen de belangen van de
      landen en de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0038494/2018-07-01#Artikel15
  - number: '15.2'
    text: |-
      Indien naar het oordeel van Onze Minister van Buitenlandse Zaken of de bevoegde autoriteiten ten aanzien van een
      aangelegenheid, bedoeld in het eerste lid, sprake is van ernstige bezwaren voor de buitenlandse betrekkingen,
      de eenheid van het visumbeleid, de doelmatigheid van de uitvoering of de belangen van de landen of de openbare
      lichamen en het overleg leidt niet tot overeenstemming dan kan het geschilpunt met overeenkomstige toepassing
      van [paragraaf 2 van het Statuut voor het Koninkrijk][ref1] aan de raad van ministers van het Koninkrijk worden
      voorgelegd.


