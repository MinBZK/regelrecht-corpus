preamble:
  text: |-
    Wij Willem Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de governance van accountantsorganisaties te versterken
    en de bevoegdheden van de Autoriteit Financiële Markten ten aanzien van het toezicht op accountantsorganisaties
    uit te breiden, alsmede enige andere wijzigingen en verbeteringen in de wetgeving op het terrein van
    accountantsorganisaties en het accountantsberoep aan te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040928/2019-01-01#ArtikelAanhef
articles:
  - number: VI.1
    text: |-
      Natuurlijke personen die op het tijdstip van inwerkingtreding van [artikel I, onderdeel D][ref1], van deze wet
      het dagelijks beleid van een accountantsorganisatie bepalen worden tot twaalf maanden na dat tijdstip, geacht
      geschikt te zijn in de zin van [artikel 16, derde lid, van de Wet toezicht accountantsorganisaties][ref2], zolang
      niet een wijziging in de relevante feiten of omstandigheden een redelijke aanleiding geeft tot een beoordeling van
      die geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0040928#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel16
    url: https://wetten.overheid.nl/BWBR0040928/2019-01-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0040928
        artikel: I
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '16'
  - number: VI.2
    text: |-
      Natuurlijke personen die op het tijdstip van inwerkingtreding van [artikel I, onderdeel D][ref1],
      van deze wet het dagelijks beleid bepalen van het netwerkonderdeel bedoeld in
      [artikel 16, vierde lid, van de Wet toezicht accountantsorganisaties][ref2], worden tot twaalf maanden na dat
      tijdstip, geacht geschikt te zijn in de zin van dat artikel, zolang niet een wijziging in de relevante feiten of
      omstandigheden een redelijke aanleiding geeft tot een beoordeling van die geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0040928#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel16
    url: https://wetten.overheid.nl/BWBR0040928/2019-01-01#ArtikelVI
    references:
      - id: ref1
