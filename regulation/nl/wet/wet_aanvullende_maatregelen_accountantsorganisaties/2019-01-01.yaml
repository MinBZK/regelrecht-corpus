        artikel: '16'
  - number: VI.4
    text: |-
      De [artikelen 14a][ref1] en [25b van de Wet toezicht accountantsorganisaties][ref2] zijn van toepassing op
      wettelijke controles met betrekking tot jaarrekeningen en bestuursverslagen die worden opgesteld over de boekjaren
      die aanvangen op of na 1 januari 2017.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel14a
