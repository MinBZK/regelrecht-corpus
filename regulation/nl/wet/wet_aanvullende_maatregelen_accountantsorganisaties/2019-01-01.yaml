        artikel: I
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '16'
  - number: VI.3
    text: |-
      Personen die op het tijdstip van inwerkingtreding van [artikel I, onderdeel D][ref1], van deze wet binnen een
      accountantsorganisatie belast zijn met het interne toezicht worden tot achttien maanden na dat tijdstip, geacht
      geschikt te zijn in de zin van [artikel 16, vijfde lid, van de Wet toezicht accountantsorganisaties][ref2], zolang
      niet een wijziging in de relevante feiten of omstandigheden een redelijke aanleiding geeft tot een beoordeling van
      die geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0040928#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel16
    url: https://wetten.overheid.nl/BWBR0040928/2019-01-01#ArtikelVI
