  - number: '10'
    text: |-
      Een ieder die ophoudt een dochtermaatschappij te zijn en die beschikt over een substantiële deelneming of een
      of meer aandelen met een bijzonder statutair recht inzake de zeggenschap in een uitgevende instelling, meldt dit
      onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel10
  - number: '11'
    text: |-
      1 Een ieder die op het tijdstip waarop een naamloze vennootschap naar Nederlands recht een uitgevende instelling
      wordt naar hij weet of behoort te weten beschikt over een substantiële deelneming of een of meer aandelen met
      een bijzonder statutair recht inzake de zeggenschap in deze uitgevende instelling, meldt dat onverwijld aan Onze
      Minister.

      2 Een ieder die op het tijdstip waarop een rechtspersoon, opgericht naar het recht van een staat, die niet een
      lidstaat is van de Europese Unie, een uitgevende instelling wordt naar hij weet of behoort te weten beschikt over
      een substantiële deelneming in deze uitgevende instelling, meldt dat onverwijld aan Onze Minister.

      3 Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen een meldingsplichtige behoort te weten
      dat hij beschikt over een substantiële deelneming in een uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel11
  - number: '12'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens die bij een melding als
      bedoeld in de [artikelen 6 tot en met 11][ref1] dienen te worden verstrekt en met betrekking tot de wijze van
      melden.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
