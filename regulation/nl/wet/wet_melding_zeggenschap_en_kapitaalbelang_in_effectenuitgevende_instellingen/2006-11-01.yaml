  - number: '2'
    text: |-
      1 De uitgevende instelling meldt onverwijld aan Onze Minister het totaal van de wijzigingen van haar kapitaal
      waardoor dit kapitaal ten opzichte van de vorige melding met een procent of meer is gewijzigd. De uitgevende
      instelling kan tevens aan Onze Minister op ieder tijdstip voorafgaand aan het tijdstip van de in het tweede lid
      bedoelde periodieke melding de overige wijzigingen van haar kapitaal melden.

      2 De uitgevende instelling meldt periodiek aan Onze Minister het totaal van de wijzigingen van haar kapitaal
      waarvoor geen meldingsplicht bestaat op grond van het eerste lid, eerste volzin, voor zover zij deze wijzigingen
      niet reeds heeft gemeld op grond van het eerste lid, tweede volzin. Bij algemene maatregel van bestuur worden
      de periode vastgesteld waarop de melding betrekking heeft en de termijn waarbinnen de melding moet hebben
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel2
  - number: '3'
    text: |-
      1 De uitgevende instelling meldt onverwijld aan Onze Minister iedere wijziging in haar stemmen, voor zover deze
      wijziging niet voortvloeit uit wijzigingen als bedoeld in [artikel 2, tweede lid][ref1]. Indien een wijziging
      in de stemmen voortvloeit uit een wijziging als bedoeld in [artikel 2, eerste lid, tweede volzin][ref2], kan de
      uitgevende instelling deze wijziging gelijktijdig met die wijziging melden aan Onze Minister.

      2 De uitgevende instelling meldt periodiek aan Onze Minister het totaal van de wijzigingen in de stemmen waarvoor
      geen meldingsplicht bestaat op grond van het eerste lid, eerste volzin, voor zover zij deze wijzigingen niet
      reeds heeft gemeld op grond van het eerste lid, tweede volzin. Bij algemene maatregel van bestuur wordt de periode
      vastgesteld waarop de melding betrekking heeft en de termijn waarbinnen de melding moet hebben plaatsgevonden.

      3 De uitgevende instelling meldt onverwijld aan Onze Minister elke uitgifte of intrekking met haar medewerking
      van aandelen als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2°][ref3], voor zover deze betrekking
      heeft op een procent of meer van haar kapitaal. De uitgevende instelling kan tevens aan Onze Minister op ieder
      tijdstip voorafgaand aan het tijdstip van de in het vierde lid bedoelde periodieke melding elke overige uitgifte of
      intrekking van aandelen als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2°][ref4], melden.

      4 De uitgevende instelling meldt periodiek aan Onze Minister het totaal van de uitgegeven of ingetrokken aandelen
      als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2°][ref5] waarvoor geen meldingsplicht bestaat op grond
      van het derde lid, eerste volzin, voor zover zij deze niet reeds heeft gemeld op grond van het derde lid, tweede
      volzin. Bij algemene maatregel van bestuur worden de periode vastgesteld waarop de melding betrekking heeft en de
      termijn waarbinnen de melding moet hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel2
