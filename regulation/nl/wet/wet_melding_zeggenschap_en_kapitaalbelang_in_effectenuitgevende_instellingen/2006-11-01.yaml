preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de reikwijdte van de Wet melding zeggenschap in ter
    beurze genoteerde vennootschappen 1996 te vergroten, alsmede nieuwe regels te stellen met het oog op het vergroten
    van de doorzichtigheid van de zeggenschap en van het kapitaalbelang in effectenuitgevende instellingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt, voor zover niet anders is bepaald, verstaan onder:

      a. uitgevende instelling: een naamloze vennootschap naar Nederlands recht waarvan aandelen als bedoeld in
      onderdeel d, onder 1° of 2°, zijn toegelaten tot de handel op een gereglementeerde markt in Nederland of in een
      andere lidstaat, of een rechtspersoon, opgericht naar het recht van een staat die niet een lidstaat is, waarvan
      aandelen als bedoeld in onderdeel d, onder 1° of 2°, zijn toegelaten tot de handel op een gereglementeerde markt
      in Nederland;

      b. Onze Minister: Onze Minister van Financiën;

      c. kapitaal: het geplaatste kapitaal van de uitgevende instelling;

      d. aandelen:

      1°. aandelen als bedoeld in [artikel 79, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];

      2°. certificaten van aandelen of andere met certificaten van aandelen gelijk te stellen verhandelbare
      waardebewijzen;

      3°. andere verhandelbare waardebewijzen, niet zijnde opties als bedoeld onder 4°, ter verwerving van de onder 1°
      bedoelde aandelen of van de onder 2° bedoelde waardebewijzen;

      4°. opties ter verwerving van de onder 1° bedoelde aandelen of van de onder 2° bedoelde waardebewijzen. Bij
      algemene maatregel van bestuur kan worden bepaald wat onder opties wordt verstaan;

      e. stemmen: stemmen die op de aandelen kunnen worden uitgebracht, met inbegrip van rechten ingevolge een
      overeenkomst tot verkrijging van stemmen;

      f. substantiële deelneming: vijf procent of meer van de aandelen, of het kunnen uitbrengen van vijf procent of
      meer van de stemmen; bij het bepalen van het aantal stemmen dat een natuurlijke persoon of rechtspersoon in een
      uitgevende instelling kan uitbrengen worden tot zijn stemmen mede gerekend de stemmen waarover hij beschikt of
      geacht wordt te beschikken op grond van [artikel 13][ref2];

      g. dochtermaatschappij: een dochtermaatschappij als bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref3] of een rechtspersoon of vennootschap waarin de rechten
      en bevoegdheden als bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref4] kunnen worden uitgeoefend
      door een natuurlijk persoon;

      h. meldingsplichtige: de natuurlijke persoon of rechtspersoon die bij of krachtens deze wet een meldingsplicht
      heeft;

      i. drempelwaarde: een percentage van het kapitaal of de stemmen, waarvan het bereiken, overschrijden of
      onderschrijden door degene die aandelen houdt of verwerft of stemmen kan uitbrengen of verwerft, leidt tot een
      meldingsplicht ingevolge deze wet;

      j. gereglementeerde markt: een markt als bedoeld in artikel 4, eerste lid, onderdeel 14, van [richtlijn nr.
      2004/39/EG](32004L0039) van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004 betreffende
      markten voor financiële instrumenten, tot wijziging van de [Richtlijnen 85/611/EEG](31985L0611) en [93/6/EEG]
      (31993L0006) van de Raad en [Richtlijn 2000/12/EG](32000L0012) van het Europees Parlement en de Raad en houdende
      intrekking van [Richtlijn 93/22/EEG](31993L0022) van de Raad (PbEU L 145);

      k. lidstaat: een staat die lid is van de Europese Unie alsmede een staat, niet zijnde een lidstaat van de Europese
      Unie, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;

      l. marketmaker: een persoon als bedoeld in artikel 4, eerste lid, onderdeel 8, van [richtlijn nr. 2004/39/EG]
      (32004L0039) van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004 betreffende markten voor
      financiële instrumenten, tot wijziging van de [Richtlijnen 85/611/EEG](31985L0611) en [93/6/EEG](31993L0006) van
      de Raad en [Richtlijn 2000/12/EG](32000L0012) van het Europees Parlement en de Raad en houdende intrekking van
      [Richtlijn 93/22/EEG](31993L0022) van de Raad (PbEU L 145);

      m. clearingbedrijf: het als bedrijf sluiten van overeenkomsten van koop en verkoop van aandelen, met een centrale
      tegenpartij als bedoeld in [art. 212a, onderdeel c, van de Faillissementswet][ref5], van welke overeenkomsten
      de hoofdverbintenissen overeenkomen met de hoofdverbintenissen die voortvloeien uit overeenkomsten, gesloten
      door derden, of door de desbetreffende onderneming of instelling zelf in haar hoedanigheid van partij op een
      gereglementeerde markt;

      n. handelsportefeuille: een portefeuille als bedoeld in artikel 2, zesde lid, van [richtlijn nr. 93/6/EEG]
      (31993L0006) van de Raad van de Europese Gemeenschappen van 15 maart 1993 inzake de kapitaaltoereikendheid van
      beleggingsondernemingen en kredietinstellingen (PbEG L 141);

      o. beheerder: een rechtspersoon als bedoeld in
      [artikel 1, onderdeel e, van de Wet toezicht beleggingsinstellingen][ref6].

      2 In deze wet en de daarop berustende bepalingen wordt onder uitgevende instelling niet verstaan een
      beleggingsmaatschappij als bedoeld in [artikel 1, onderdeel a, van de Wet toezicht beleggingsinstellingen][ref7],
      waarvan de rechten van deelneming op verzoek van de deelnemers ten laste van de activa van deze
      beleggingsmaatschappij direct of indirect worden ingekocht of terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel79
