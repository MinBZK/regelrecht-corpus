  - number: '60'
    text: |-
      1 Iedere bestuurder of commissaris van een uitgevende instelling als bedoeld in [artikel 16, eerste lid][ref1], die
      op het tijdstip van inwerkingtreding van deze wet de beschikking heeft over aandelen of stemmen in deze uitgevende
      instelling of de daaraan gelieerde uitgevende instellingen als bedoeld in [artikel 16, tweede lid][ref2], doet
      daarvan binnen vier weken na het tijdstip van inwerkingtreding van deze wet aan Onze Minister melding.

      2 Indien op grond van [artikel 16, vierde, vijfde, zesde of zevende lid][ref3], een onverwijlde melding dient
      plaats te vinden en een melding op grond van het eerste lid nog niet heeft plaatsgevonden, wordt de laatstbedoelde
      melding gelijktijdig met de onverwijlde melding gedaan.

      3 Een melding als bedoeld in het eerste lid bevat de volgende gegevens:

      a. de naam van de meldingsplichtige;

      b. het adres en de woonplaats van de meldingsplichtige;

      c. het tijdstip waarop de meldingsplicht is ontstaan;

      d. de naam van de uitgevende instelling of van de gelieerde uitgevende instellingen;

      e. het aantal en de soort aandelen en stemmen in de uitgevende instelling of in de gelieerde uitgevende
      instellingen waarover de meldingsplichtige beschikte op het tijdstip waarop de meldingsplicht is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0020052#Artikel16
