      1 Onze Minister kan een bestuurlijke boete opleggen terzake van overtreding van voorschriften, gesteld
      bij of krachtens de [artikelen 2][ref1], [3][ref2], [4][ref3], [5][ref4], [6][ref5], [7][ref6],
      [8][ref7], [9][ref8], [10][ref9], [11][ref10], [12][ref11], [15][ref12], [16][ref13], [18][ref14],
      [19, eerste, vierde, vijfde en zevende lid][ref15], [58][ref16], [59][ref17] en [60][ref18].

      2 De bestuurlijke boete komt toe aan de Staat. Voor zover Onze Minister met toepassing van
      [artikel 25, eerste lid][ref19], de bevoegdheid tot het opleggen van een bestuurlijke boete heeft overgedragen aan
      een rechtspersoon, komt de boete toe aan die rechtspersoon.

      3 Onze Minister, in overeenstemming met Onze Minister van Justitie, kan regels stellen terzake van de uitoefening
      van de bevoegdheid, bedoeld in het eerste lid.


