  - number: '6'
    text: |-
      1 Een ieder die de beschikking krijgt of verliest over aandelen waardoor, naar hij weet of behoort te weten, het
      percentage van het kapitaal waarover hij beschikt een drempelwaarde bereikt, overschrijdt dan wel onderschrijdt,
      meldt dat onverwijld aan Onze Minister.

      2 Een ieder die de beschikking krijgt of verliest over stemmen waardoor, naar hij weet of behoort te weten, het
      percentage van de stemmen waarover hij beschikt een drempelwaarde bereikt, overschrijdt dan wel onderschrijdt,
      meldt dat onverwijld aan Onze Minister.

      3 De drempelwaarden, bedoeld in het eerste en tweede lid, zijn: 5 procent, 10 procent, 15 procent, 20 procent, 25
      procent, 30 procent, 40 procent, 50 procent, 60 procent, 75 procent en 95 procent.

      4 Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen een meldingsplichtige behoort te weten
      dat hij een drempelwaarde bereikt, overschrijdt dan wel onderschrijdt.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel6
  - number: '7'
    text: |-
      1 Een ieder wiens percentage van het kapitaal of van de stemmen waarover hij beschikt, naar hij weet of behoort
      te weten, een drempelwaarde bereikt, overschrijdt dan wel onderschrijdt als gevolg van een wijziging die op
      grond van een melding als bedoeld in [artikel 2][ref1] of [3][ref2] door Onze Minister in het register, bedoeld
      in [artikel 17][ref3], is verwerkt, meldt dat aan Onze Minister. De melding vindt plaats uiterlijk op de vierde
      handelsdag na de in de vorige volzin bedoelde verwerking in het register. Bij algemene maatregel van bestuur kan
      worden bepaald wat onder handelsdag wordt verstaan.

      2 De drempelwaarden, bedoeld in het eerste lid, eerste volzin, zijn: 5 procent, 10 procent, 15 procent, 20 procent,
      25 procent, 30 procent, 40 procent, 50 procent, 60 procent, 75 procent en 95 procent.

      3 Artikel 6, vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel3
