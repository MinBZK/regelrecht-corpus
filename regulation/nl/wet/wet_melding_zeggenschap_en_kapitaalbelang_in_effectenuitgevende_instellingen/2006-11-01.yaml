  - number: '4'
    text: |-
      Een naamloze vennootschap naar Nederlands recht of een rechtspersoon, opgericht naar het recht van een staat die
      niet een lidstaat is, die een uitgevende instelling wordt meldt onverwijld aan Onze Minister haar kapitaal en haar
      stemmen, alsmede de aandelen, bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
  - number: '5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens die bij een melding als
      bedoeld in de [artikelen 2][ref1], [3][ref2] en [4][ref3] dienen te worden verstrekt en met betrekking tot de
      wijze van melden.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel3
