        hoofdstuk: '3'
  - number: '9'
    text: |-
      1 Een ieder wiens substantiële deelneming op 31 december om 24.00 uur ten opzichte van diens vorige melding een
      afwijkende samenstelling heeft als gevolg van een omwisseling van:

      a. aandelen als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2°][ref1], in aandelen als bedoeld in
      [artikel 1, eerste lid, onderdeel d, onder 1° of 2°][ref2], of omgekeerd, dan wel;

      b. aandelen als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 1°][ref3], in aandelen als bedoeld in
      [artikel 1, eerste lid, onderdeel d, 2°][ref4], of omgekeerd; meldt dat binnen vier weken na dat tijdstip aan Onze
      Minister. Aan de verplichting op grond van de eerste volzin is voldaan door een bestuurder of commissaris, indien
      terzake van hetzelfde feit een melding is gedaan als bedoeld in [artikel 16, zesde of zevende lid][ref5].

      2 Een ieder wiens substantiële deelneming op 31 december om 24.00 uur ten opzichte van diens vorige melding een
      afwijkende samenstelling heeft als gevolg van de uitoefening van rechten ingevolge een overeenkomst tot verkrijging
      van stemmen of omgekeerd, meldt dat binnen vier weken na dat tijdstip aan Onze Minister. Aan de verplichting op
      grond van de eerste volzin is voldaan door een bestuurder of commissaris, indien terzake van hetzelfde feit een
      melding is gedaan als bedoeld in [artikel 16, zevende lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel1
