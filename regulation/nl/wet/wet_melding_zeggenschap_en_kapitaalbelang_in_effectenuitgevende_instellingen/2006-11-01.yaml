---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_melding_zeggenschap_en_kapitaalbelang_in_effectenuitgevende_instellingen
regulatory_layer: WET
publication_date: '2006-12-07'
valid_from: '2006-11-01'
bwb_id: BWBR0020052
url: https://wetten.overheid.nl/BWBR0020052/2006-11-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de reikwijdte van de Wet melding zeggenschap in ter
    beurze genoteerde vennootschappen 1996 te vergroten, alsmede nieuwe regels te stellen met het oog op het vergroten
    van de doorzichtigheid van de zeggenschap en van het kapitaalbelang in effectenuitgevende instellingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt, voor zover niet anders is bepaald, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.a
    text: |-
      uitgevende instelling: een naamloze vennootschap naar Nederlands recht waarvan aandelen als bedoeld in onderdeel d,
      onder 1° of 2°, zijn toegelaten tot de handel op een gereglementeerde markt in Nederland of in een andere lidstaat,
      of een rechtspersoon, opgericht naar het recht van een staat die niet een lidstaat is, waarvan aandelen als bedoeld
      in onderdeel d, onder 1° of 2°, zijn toegelaten tot de handel op een gereglementeerde markt in Nederland;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.b
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.c
    text: 'kapitaal: het geplaatste kapitaal van de uitgevende instelling;'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.d
    text: 'aandelen:'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.d.1°
    text: |-
      aandelen als bedoeld in [artikel 79, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel79
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '79'
  - number: 1.1.d.2°
    text: certificaten van aandelen of andere met certificaten van aandelen gelijk te stellen verhandelbare waardebewijzen;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.d.3°
    text: |-
      andere verhandelbare waardebewijzen, niet zijnde opties als bedoeld onder 4°, ter verwerving van de onder 1°
      bedoelde aandelen of van de onder 2° bedoelde waardebewijzen;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.d.4°
    text: |-
      opties ter verwerving van de onder 1° bedoelde aandelen of van de onder 2° bedoelde waardebewijzen. Bij algemene
      maatregel van bestuur kan worden bepaald wat onder opties wordt verstaan;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.e
    text: |-
      stemmen: stemmen die op de aandelen kunnen worden uitgebracht, met inbegrip van rechten ingevolge een overeenkomst
      tot verkrijging van stemmen;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.f
    text: |-
      substantiële deelneming: vijf procent of meer van de aandelen, of het kunnen uitbrengen van vijf procent of
      meer van de stemmen; bij het bepalen van het aantal stemmen dat een natuurlijke persoon of rechtspersoon in een
      uitgevende instelling kan uitbrengen worden tot zijn stemmen mede gerekend de stemmen waarover hij beschikt of
      geacht wordt te beschikken op grond van [artikel 13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel13
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '13'
        hoofdstuk: '4'
  - number: 1.1.g
    text: |-
      dochtermaatschappij: een dochtermaatschappij als bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1] of een rechtspersoon of vennootschap waarin de rechten
      en bevoegdheden als bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref2] kunnen worden uitgeoefend
      door een natuurlijk persoon;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 1.1.h
    text: 'meldingsplichtige: de natuurlijke persoon of rechtspersoon die bij of krachtens deze wet een meldingsplicht heeft;'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.i
    text: |-
      drempelwaarde: een percentage van het kapitaal of de stemmen, waarvan het bereiken, overschrijden of onderschrijden
      door degene die aandelen houdt of verwerft of stemmen kan uitbrengen of verwerft, leidt tot een meldingsplicht
      ingevolge deze wet;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.j
    text: |-
      gereglementeerde markt: een markt als bedoeld in artikel 4, eerste lid, onderdeel 14, van [richtlijn nr. 2004/39/
      EG](32004L0039) van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004 betreffende markten
      voor financiële instrumenten, tot wijziging van de [Richtlijnen 85/611/EEG](31985L0611) en [93/6/EEG](31993L0006)
      van de Raad en [Richtlijn 2000/12/EG](32000L0012) van het Europees Parlement en de Raad en houdende intrekking van
      [Richtlijn 93/22/EEG](31993L0022) van de Raad (PbEU L 145);
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.k
    text: |-
      lidstaat: een staat die lid is van de Europese Unie alsmede een staat, niet zijnde een lidstaat van de Europese
      Unie, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.l
    text: |-
      marketmaker: een persoon als bedoeld in artikel 4, eerste lid, onderdeel 8, van [richtlijn nr. 2004/39/EG]
      (32004L0039) van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004 betreffende markten voor
      financiële instrumenten, tot wijziging van de [Richtlijnen 85/611/EEG](31985L0611) en [93/6/EEG](31993L0006) van
      de Raad en [Richtlijn 2000/12/EG](32000L0012) van het Europees Parlement en de Raad en houdende intrekking van
      [Richtlijn 93/22/EEG](31993L0022) van de Raad (PbEU L 145);
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.m
    text: |-
      clearingbedrijf: het als bedrijf sluiten van overeenkomsten van koop en verkoop van aandelen, met een centrale
      tegenpartij als bedoeld in [art. 212a, onderdeel c, van de Faillissementswet][ref1], van welke overeenkomsten
      de hoofdverbintenissen overeenkomen met de hoofdverbintenissen die voortvloeien uit overeenkomsten, gesloten
      door derden, of door de desbetreffende onderneming of instelling zelf in haar hoedanigheid van partij op een
      gereglementeerde markt;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
  - number: 1.1.n
    text: |-
      handelsportefeuille: een portefeuille als bedoeld in artikel 2, zesde lid, van [richtlijn nr. 93/6/EEG]
      (31993L0006) van de Raad van de Europese Gemeenschappen van 15 maart 1993 inzake de kapitaaltoereikendheid van
      beleggingsondernemingen en kredietinstellingen (PbEG L 141);
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
  - number: 1.1.o
    text: |-
      beheerder: een rechtspersoon als bedoeld in
      [artikel 1, onderdeel e, van de Wet toezicht beleggingsinstellingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '1'
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder uitgevende instelling niet verstaan een
      beleggingsmaatschappij als bedoeld in [artikel 1, onderdeel a, van de Wet toezicht beleggingsinstellingen][ref1],
      waarvan de rechten van deelneming op verzoek van de deelnemers ten laste van de activa van deze
      beleggingsmaatschappij direct of indirect worden ingekocht of terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '1'
  - number: '2.1'
    text: |-
      De uitgevende instelling meldt onverwijld aan Onze Minister het totaal van de wijzigingen van haar kapitaal
      waardoor dit kapitaal ten opzichte van de vorige melding met een procent of meer is gewijzigd. De uitgevende
      instelling kan tevens aan Onze Minister op ieder tijdstip voorafgaand aan het tijdstip van de in het tweede lid
      bedoelde periodieke melding de overige wijzigingen van haar kapitaal melden.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel2
  - number: '2.2'
    text: |-
      De uitgevende instelling meldt periodiek aan Onze Minister het totaal van de wijzigingen van haar kapitaal waarvoor
      geen meldingsplicht bestaat op grond van het eerste lid, eerste volzin, voor zover zij deze wijzigingen niet reeds
      heeft gemeld op grond van het eerste lid, tweede volzin. Bij algemene maatregel van bestuur worden de periode
      vastgesteld waarop de melding betrekking heeft en de termijn waarbinnen de melding moet hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel2
  - number: '3.1'
    text: |-
      De uitgevende instelling meldt onverwijld aan Onze Minister iedere wijziging in haar stemmen, voor zover deze
      wijziging niet voortvloeit uit wijzigingen als bedoeld in [artikel 2, tweede lid][ref1]. Indien een wijziging
      in de stemmen voortvloeit uit een wijziging als bedoeld in [artikel 2, eerste lid, tweede volzin][ref2], kan de
      uitgevende instelling deze wijziging gelijktijdig met die wijziging melden aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel2
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      De uitgevende instelling meldt periodiek aan Onze Minister het totaal van de wijzigingen in de stemmen waarvoor
      geen meldingsplicht bestaat op grond van het eerste lid, eerste volzin, voor zover zij deze wijzigingen niet
      reeds heeft gemeld op grond van het eerste lid, tweede volzin. Bij algemene maatregel van bestuur wordt de periode
      vastgesteld waarop de melding betrekking heeft en de termijn waarbinnen de melding moet hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel3
  - number: '3.3'
    text: |-
      De uitgevende instelling meldt onverwijld aan Onze Minister elke uitgifte of intrekking met haar medewerking
      van aandelen als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2°][ref1], voor zover deze betrekking
      heeft op een procent of meer van haar kapitaal. De uitgevende instelling kan tevens aan Onze Minister op ieder
      tijdstip voorafgaand aan het tijdstip van de in het vierde lid bedoelde periodieke melding elke overige uitgifte of
      intrekking van aandelen als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2°][ref2], melden.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
  - number: '3.4'
    text: |-
      De uitgevende instelling meldt periodiek aan Onze Minister het totaal van de uitgegeven of ingetrokken aandelen
      als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2°][ref1] waarvoor geen meldingsplicht bestaat op grond
      van het derde lid, eerste volzin, voor zover zij deze niet reeds heeft gemeld op grond van het derde lid, tweede
      volzin. Bij algemene maatregel van bestuur worden de periode vastgesteld waarop de melding betrekking heeft en de
      termijn waarbinnen de melding moet hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
  - number: '4'
    text: |-
      Een naamloze vennootschap naar Nederlands recht of een rechtspersoon, opgericht naar het recht van een staat die
      niet een lidstaat is, die een uitgevende instelling wordt meldt onverwijld aan Onze Minister haar kapitaal en haar
      stemmen, alsmede de aandelen, bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
  - number: '5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens die bij een melding als
      bedoeld in de [artikelen 2][ref1], [3][ref2] en [4][ref3] dienen te worden verstrekt en met betrekking tot de
      wijze van melden.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020052#Artikel4
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0020052
        artikel: '4'
        hoofdstuk: '2'
  - number: '6.1'
    text: |-
      Een ieder die de beschikking krijgt of verliest over aandelen waardoor, naar hij weet of behoort te weten, het
      percentage van het kapitaal waarover hij beschikt een drempelwaarde bereikt, overschrijdt dan wel onderschrijdt,
      meldt dat onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel6
  - number: '6.2'
    text: |-
      Een ieder die de beschikking krijgt of verliest over stemmen waardoor, naar hij weet of behoort te weten, het
      percentage van de stemmen waarover hij beschikt een drempelwaarde bereikt, overschrijdt dan wel onderschrijdt,
      meldt dat onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel6
  - number: '6.3'
    text: |-
      De drempelwaarden, bedoeld in het eerste en tweede lid, zijn: 5 procent, 10 procent, 15 procent, 20 procent, 25
      procent, 30 procent, 40 procent, 50 procent, 60 procent, 75 procent en 95 procent.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel6
  - number: '6.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen een meldingsplichtige behoort te weten dat
      hij een drempelwaarde bereikt, overschrijdt dan wel onderschrijdt.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel6
  - number: '7.1'
    text: |-
      Een ieder wiens percentage van het kapitaal of van de stemmen waarover hij beschikt, naar hij weet of behoort te
      weten, een drempelwaarde bereikt, overschrijdt dan wel onderschrijdt als gevolg van een wijziging die op grond
      van een melding als bedoeld in [artikel 2][ref1] of [3][ref2] door Onze Minister in het register, bedoeld in
      [artikel 17][ref3], is verwerkt, meldt dat aan Onze Minister. De melding vindt plaats uiterlijk op de vierde
      handelsdag na de in de vorige volzin bedoelde verwerking in het register. Bij algemene maatregel van bestuur kan
      worden bepaald wat onder handelsdag wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020052#Artikel17
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0020052
        artikel: '17'
        hoofdstuk: '6'
  - number: '7.2'
    text: |-
      De drempelwaarden, bedoeld in het eerste lid, eerste volzin, zijn: 5 procent, 10 procent, 15 procent, 20 procent,
      25 procent, 30 procent, 40 procent, 50 procent, 60 procent, 75 procent en 95 procent.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel7
  - number: '7.3'
    text: Artikel 6, vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel7
  - number: '8'
    text: |-
      Een ieder die de beschikking krijgt of verliest over een of meer aandelen met een bijzonder statutair recht
      inzake de zeggenschap in een uitgevende instelling, meldt dat onverwijld aan Onze Minister. Aan de verplichting
      op grond van de vorige volzin is voldaan, indien terzake van hetzelfde feit een melding is gedaan op grond van
      [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
  - number: '9.1'
    text: |-
      Een ieder wiens substantiële deelneming op 31 december om 24.00 uur ten opzichte van diens vorige melding een
      afwijkende samenstelling heeft als gevolg van een omwisseling van:
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel9
  - number: 9.1.a
    text: |-
      aandelen als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 2°][ref1], in aandelen als bedoeld in
      [artikel 1, eerste lid, onderdeel d, onder 1° of 2°][ref2], of omgekeerd, dan wel;


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.1.b
    text: |-
      aandelen als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 1°][ref1], in aandelen als bedoeld in
      [artikel 1, eerste lid, onderdeel d, 2°][ref2], of omgekeerd; meldt dat binnen vier weken na dat tijdstip aan Onze
      Minister. Aan de verplichting op grond van de eerste volzin is voldaan door een bestuurder of commissaris, indien
      terzake van hetzelfde feit een melding is gedaan als bedoeld in [artikel 16, zesde of zevende lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020052#Artikel16
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0020052
        artikel: '16'
        hoofdstuk: '5'
  - number: '9.2'
    text: |-
      Een ieder wiens substantiële deelneming op 31 december om 24.00 uur ten opzichte van diens vorige melding een
      afwijkende samenstelling heeft als gevolg van de uitoefening van rechten ingevolge een overeenkomst tot verkrijging
      van stemmen of omgekeerd, meldt dat binnen vier weken na dat tijdstip aan Onze Minister. Aan de verplichting op
      grond van de eerste volzin is voldaan door een bestuurder of commissaris, indien terzake van hetzelfde feit een
      melding is gedaan als bedoeld in [artikel 16, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel16
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '16'
        hoofdstuk: '5'
  - number: '10'
    text: |-
      Een ieder die ophoudt een dochtermaatschappij te zijn en die beschikt over een substantiële deelneming of een
      of meer aandelen met een bijzonder statutair recht inzake de zeggenschap in een uitgevende instelling, meldt dit
      onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel10
  - number: '11.1'
    text: |-
      Een ieder die op het tijdstip waarop een naamloze vennootschap naar Nederlands recht een uitgevende instelling
      wordt naar hij weet of behoort te weten beschikt over een substantiële deelneming of een of meer aandelen met
      een bijzonder statutair recht inzake de zeggenschap in deze uitgevende instelling, meldt dat onverwijld aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel11
  - number: '11.2'
    text: |-
      Een ieder die op het tijdstip waarop een rechtspersoon, opgericht naar het recht van een staat, die niet een
      lidstaat is van de Europese Unie, een uitgevende instelling wordt naar hij weet of behoort te weten beschikt over
      een substantiële deelneming in deze uitgevende instelling, meldt dat onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel11
  - number: '11.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen een meldingsplichtige behoort te weten dat
      hij beschikt over een substantiële deelneming in een uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel11
  - number: '12'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens die bij een melding als
      bedoeld in de [artikelen 6 tot en met 11][ref1] dienen te worden verstrekt en met betrekking tot de wijze van
      melden.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
  - number: '13.1'
    text: Iemand beschikt over de aandelen die hij houdt, alsmede over de stemmen die hij kan uitbrengen als aandeelhouder.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
  - number: '13.2'
    text: |-
      Iemand beschikt over de stemmen die hij, indien toepassing is gegeven aan [artikel 88, derde lid][ref1], of
      [artikel 89, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref2], als vruchtgebruiker onderscheidenlijk
      pandhouder kan uitbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel89
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '89'
  - number: '13.3'
    text: |-
      Iemand wordt geacht te beschikken over de aandelen die zijn dochtermaatschappij houdt, alsmede over de stemmen
      die zijn dochtermaatschappij kan uitbrengen. Een dochtermaatschappij wordt geacht niet te beschikken over aandelen
      of stemmen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
  - number: '13.4'
    text: |-
      Iemand wordt geacht te beschikken over de aandelen die door een derde voor zijn rekening worden gehouden, alsmede
      over de stemmen die deze derde kan uitbrengen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
  - number: '13.5'
    text: |-
      Iemand wordt geacht te beschikken over de stemmen waarover een derde beschikt, met wie hij een overeenkomst heeft
      gesloten die voorziet in een duurzaam gemeenschappelijk beleid inzake het uitbrengen van de stemmen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
  - number: '13.6'
    text: |-
      Iemand wordt geacht te beschikken over de stemmen waarover een derde beschikt, met wie hij een overeenkomst heeft
      gesloten waarin een tijdelijke en betaalde overdracht van deze stemmen is geregeld.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
  - number: '13.7'
    text: |-
      De beheerder van een beleggingsfonds als bedoeld in
      [artikel 1, onder b, van de Wet toezicht beleggingsinstellingen][ref1] wordt geacht te beschikken over de aandelen
      die de bewaarder houdt en de daaraan verbonden stemmen. De bewaarder van een beleggingsfonds wordt geacht niet te
      beschikken over aandelen of stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '1'
  - number: '13.8'
    text: |-
      Aandelen en stemmen die deel uitmaken van een gemeenschap worden in evenredigheid van hun gerechtigdheid
      toegerekend aan de deelgenoten. In afwijking van de vorige volzin worden stemmen die deel uitmaken van een
      wettelijke gemeenschap van goederen als bedoeld in [artikel 93 van Boek 1 van het Burgerlijk Wetboek][ref1]
      toegerekend aan de echtgenoot van wiens zijde de stemmen in de gemeenschap zijn gevallen als bedoeld in
      [artikel 97 van Boek 1 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel97
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '93'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '97'
  - number: '13.9'
    text: Iemand wordt geacht te beschikken over de stemmen die hij als gevolmachtigde naar eigen goeddunken kan uitbrengen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
  - number: '13.10'
    text: |-
      Het derde lid is volgens bij algemene maatregel van bestuur te stellen regels niet van toepassing op degene wiens
      dochtermaatschappij:
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
  - number: 13.10.a
    text: |-
      een beheerder is die de stemmen die zijn verbonden aan de aandelen die worden gehouden door de
      beleggingsinstelling, bedoeld in [artikel 1, onderdeel a, van de Wet toezicht beleggingsinstellingen][ref1],
      waarover hij het beheer voert, dan wel de stemmen waarover hij ingevolge het zevende lid, eerste volzin, wordt
      geacht te beschikken, naar eigen goeddunken kan uitbrengen; of


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '1'
  - number: 13.10.b
    text: |-
      een vermogensbeheerder is als bedoeld in [artikel 1, onderdeel c, van de Wet toezicht effectenverkeer 1995][ref1],
      die de stemmen die zijn verbonden aan de aandelen waarover hij het beheer voert naar eigen goeddunken kan
      uitbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
  - number: '14.1'
    text: |-
      De verplichtingen om te melden op grond van de [artikelen 6 tot en met 11][ref1] zijn, voor zover de aandelen en
      de daaraan verbonden stemmen in de regelmatige uitoefening van hun bedrijf en gedurende een korte periode worden
      gehouden, niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
  - number: 14.1.a
    text: |-
      ondernemingen of instellingen die het clearingbedrijf uitoefenen en die geen kredietinstelling zijn als bedoeld in
      [artikel 1, onderdeel a, van de Wet toezicht kredietwezen 1992][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 14.1.b
    text: |-
      afwikkelende instanties als bedoeld in [artikel 212a, onderdeel f, van de Faillissementswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
  - number: 14.1.c
    text: |-
      nationale centrale banken die onderdeel uitmaken van het Europees Stelsel van Centrale Banken, bedoeld in artikel 8
      van het Verdrag tot oprichting van de Europese Gemeenschap, voorzover de stemmen niet worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
  - number: '14.2'
    text: |-
      De verplichtingen om te melden op grond van de [artikelen 6 tot en met 11][ref1] zijn, voor zover de aandelen en de
      daaraan verbonden stemmen worden gehouden in de regelmatige uitoefening van hun bedrijf, niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
  - number: 14.2.a
    text: |-
      bewaarnemers van aandelen, voorzover deze de aan deze aandelen verbonden stemmen niet naar eigen goeddunken kunnen
      uitbrengen;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
  - number: 14.2.b
    text: |-
      marketmakers die de beschikking krijgen of verliezen over aandelen en de daaraan verbonden stemmen waardoor,
      naar zij weten of behoren te weten, het percentage van het kapitaal of de stemmen waarover zij beschikken de
      drempelwaarde van 5 procent bereikt, overschrijdt of onderschrijdt, voor zover deze geen invloed uitoefenen in
      het bestuur van de desbetreffende uitgevende instelling en in hun lidstaat van herkomst een vergunning hebben
      als bedoeld in [richtlijn nr. 2004/39/EG](32004L0039) van het Europees Parlement en de Raad van de Europese Unie
      van 21 april 2004 betreffende markten voor financiële instrumenten, tot wijziging van de [Richtlijnen 85/611/EEG]
      (31985L0611) en [93/6/EEG](31993L0006) van de Raad en [Richtlijn 2000/39/EG](32000L0039) van het Europees Parlement
      en de Raad en houdende intrekking van [Richtlijn 93/22/EEG](31993L0022) van de Raad (PbEU L 145).
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
  - number: '14.3'
    text: |-
      Voor zover de aandelen en de daaraan verbonden stemmen tot de handelsportefeuille behoren en de drempelwaarde van
      vijf procent niet overschrijden, en indien de stemmen niet worden uitgebracht en niet anderszins invloed wordt
      uitgeoefend in het bestuur van de desbetreffende uitgevende instellingen, zijn de verplichtingen om te melden op
      grond van de [artikelen 6 tot en met 11][ref1], niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
  - number: 14.3.a
    text: |-
      instellingen die beschikken over een vergunning als bedoeld in
      [artikel 7, eerste lid, van de Wet toezicht effectenverkeer 1995][ref1] en instellingen die beschikken over
      een vergunning als bedoeld in [artikel 6][ref2] of [38 van de Wet toezicht kredietwezen 1992][ref3] dan wel een
      verklaring van ondertoezichtstelling als bedoeld in [artikel 45 van die wet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel45
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0005792
        artikel: '45'
  - number: 14.3.b
    text: |-
      instellingen die in een andere lidstaat zijn gevestigd en van de toezichthoudende autoriteit van die lidstaat een
      vergunning hebben verkregen als bedoeld in artikel 5, eerste lid, eerste volzin, van [richtlijn nr. 2004/39/EG]
      (32004L0039) van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004 betreffende markten voor
      financiële instrumenten, tot wijziging van de [Richtlijnen 85/611/EEG](31985L0611) en [93/6/EEG](31993L0006) van
      de Raad en [Richtlijn 2000/12/EG](32000L0012) van het Europees Parlement en de Raad en houdende intrekking van
      [Richtlijn 93/22/EEG](31993L0022) van de Raad (PbEU L 145);
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
  - number: 14.3.c
    text: |-
      kredietinstellingen die in een andere lidstaat zijn gevestigd en van de toezichthoudende autoriteit van die andere
      lidstaat een vergunning hebben verkregen als bedoeld in artikel 1, onderdeel 2, van [richtlijn nr. 2000/12/EG]
      (32000L0012) van het Europees Parlement en de Raad van de Europese Unie van 20 maart 2000 betreffende de toegang
      tot en de uitoefening van de werkzaamheden van kredietinstellingen (PbEG L 126);
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
  - number: 14.3.d
    text: |-
      in een andere lidstaat gevestigde financiële instellingen als bedoeld in artikel 1, onderdeel 5, van [richtlijn nr.
      2000/12/EG](32000L0012) van het Europees Parlement en de Raad van de Europese Unie van 20 maart 2000 betreffende de
      toegang tot en de uitoefening van de werkzaamheden van kredietinstellingen (PbEG L 126).
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
  - number: '14.4'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste, tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
  - number: '14.5'
    text: |-
      Indien een in het eerste, tweede of derde lid bedoelde onderneming of instelling op het tijdstip waarop de
      toepasselijkheid van het eerste, tweede of derde lid eindigt de aandelen nog houdt dan wel de stemmen nog kan
      uitbrengen, wordt zij geacht op dat tijdstip de beschikking te hebben verkregen over deze aandelen en stemmen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel14
  - number: '15'
    text: |-
      Met betrekking tot aandelen of stemmen in een rechtspersoon, opgericht naar het recht van een staat die niet
      een lidstaat is, waarvan aandelen zijn toegelaten tot de handel op een gereglementeerde markt in Nederland en
      voor welke aandelen Nederland lidstaat van ontvangst is als bedoeld in artikel 2, eerste lid, onderdeel j, van
      [richtlijn nr. 2004/109/EG](32004L0109) van het Europees Parlement en de Raad van de Europese Unie van 15 december
      2004 betreffende de transparantievereisten die gelden voor informatie over uitgevende instellingen waarvan effecten
      tot de handel op een gereglementeerde markt zijn toegelaten en tot wijziging van [Richtlijn 2001/34/EG](32001L0034)
      (PbEU L 390):
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel15
  - number: 15.a
    text: |-
      zijn de [artikelen 8][ref1], [9][ref2] en [10][ref3] niet van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0020052#Artikel10
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '9'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020052
        artikel: '10'
        hoofdstuk: '3'
  - number: 15.b
    text: |-
      gelden, in afwijking van [artikel 6, derde lid][ref1], voor de in [artikel 6, eerste en tweede lid][ref2],
      genoemde meldingsplichten de drempelwaarden 5 procent en 10 procent, voor zover de meldingsplichtige een uitgevende
      instelling is die meldingsplichtig is als gevolg van het verkrijgen of verliezen van de beschikking over haar eigen
      aandelen;


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel6
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
  - number: 15.c
    text: |-
      gelden voor de in de [artikelen 6][ref1] en [7][ref2] genoemde meldingsplichten de drempelwaarden 5 procent, 10
      procent, 15 procent, 20 procent, 25 procent, 30 procent, 50 procent en 75 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel7
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '7'
        hoofdstuk: '3'
  - number: '16.1'
    text: |-
      In dit artikel en de daarop berustende bepalingen wordt, in afwijking van
      [artikel 1, eerste lid, onderdeel a][ref1], onder uitgevende instelling verstaan: een naamloze vennootschap naar
      Nederlands recht waarvan aandelen als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 1° en 2°][ref2], zijn
      toegelaten tot de handel op een gereglementeerde markt in Nederland of in een andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
  - number: '16.2'
    text: |-
      In dit artikel en de daarop berustende bepalingen wordt onder gelieerde uitgevende instelling verstaan: iedere
      andere uitgevende instelling:
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
  - number: 16.2.1°
    text: |-
      waarmee de uitgevende instelling in een groep is verbonden of waarin de uitgevende instelling een deelneming heeft
      als bedoeld in [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref1], indien de meest recent vastgestelde
      omzet van die andere uitgevende instelling tenminste tien procent van de geconsolideerde omzet van de uitgevende
      instelling bedraagt; of


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 16.2.2°
    text: |-
      die rechtstreeks of middellijk meer dan vijfentwintig procent van het kapitaal van de uitgevende instelling
      verschaft.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
  - number: '16.3'
    text: |-
      Een bestuurder of commissaris van een uitgevende instelling meldt aan Onze Minister de aandelen en stemmen in de
      uitgevende instelling en de gelieerde uitgevende instellingen waarover hij beschikt. Deze meldingen worden gedaan
      binnen twee weken na de aanwijzing of benoeming als bestuurder of commissaris.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
  - number: '16.4'
    text: |-
      Een bestuurder of commissaris van een naamloze vennootschap die een uitgevende instelling wordt in de zin van het
      eerste lid, meldt onverwijld aan Onze Minister de aandelen en stemmen in de uitgevende instelling en de gelieerde
      uitgevende instellingen waarover hij beschikt. Aan de verplichting op grond van de vorige volzin is voldaan, indien
      terzake van hetzelfde feit een melding is gedaan op grond van [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel11
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '11'
        hoofdstuk: '3'
  - number: '16.5'
    text: |-
      Een bestuurder of commissaris van een uitgevende instelling ten opzichte waarvan een andere naamloze vennootschap
      een gelieerde uitgevende instelling wordt in de zin van het tweede lid, meldt onverwijld aan Onze Minister de
      aandelen en stemmen in deze gelieerde uitgevende instelling waarover hij beschikt. Aan de verplichting op grond
      van de vorige volzin is voldaan, indien terzake van deze aandelen of stemmen een melding is gedaan op grond van de
      [artikelen 6, eerste of tweede lid][ref1], [7, eerste lid][ref2], [8][ref3] of [11][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020052#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0020052#Artikel11
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '7'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020052
        artikel: '8'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0020052
        artikel: '11'
        hoofdstuk: '3'
  - number: '16.6'
    text: |-
      Een bestuurder of commissaris van een uitgevende instelling meldt onverwijld aan Onze Minister iedere wijziging
      in de aandelen in de uitgevende instelling en de gelieerde uitgevende instellingen waarover hij beschikt. Aan de
      verplichting op grond van de vorige volzin is voldaan, indien terzake van hetzelfde feit een melding is gedaan op
      grond van [artikel 6, eerste lid][ref1], of [8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel8
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '8'
        hoofdstuk: '3'
  - number: '16.7'
    text: |-
      Een bestuurder of commissaris van een uitgevende instelling meldt onverwijld aan Onze Minister iedere wijziging
      in de stemmen in de uitgevende instelling en de gelieerde uitgevende instellingen waarover hij beschikt. Aan de
      verplichting op grond van de vorige volzin is voldaan, indien terzake van hetzelfde feit een melding is gedaan op
      grond van [artikel 6, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
  - number: '16.8'
    text: |-
      Een uitgevende instelling meldt het feit dat een bestuurder of commissaris niet langer in functie is onverwijld aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
  - number: '16.9'
    text: |-
      Indien een bestuurder van een uitgevende instelling een rechtspersoon is, zijn het derde tot en met het achtste lid
      van overeenkomstige toepassing op de natuurlijke personen die het dagelijks beleid van deze rechtspersoon bepalen,
      alsmede op de natuurlijke personen die toezicht houden op het beleid van het bestuur en de algemene gang van zaken
      in deze rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
  - number: '16.10'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens die bij een melding als
      bedoeld in dit artikel dienen te worden verstrekt en met betrekking tot de wijze van melden.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister houdt een register met de gegevens die worden gemeld op grond van deze wet. Bij algemene maatregel
      van bestuur kunnen regels worden gesteld met betrekking tot de inrichting en de werking van het register.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel17
  - number: '17.2'
    text: Onze Minister houdt de gegevens in het register voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel17
  - number: '17.3'
    text: |-
      Behoudens het bepaalde in het vijfde lid, doet Onze Minister, nadat hij een melding heeft ontvangen, onverwijld
      mededeling van deze melding aan de desbetreffende uitgevende instelling en aan de meldingsplichtige. De in de
      eerste volzin bedoelde mededeling strekt voor de meldingsplichtige tot bewijs dat deze aan zijn verplichting tot
      het doen van een melding heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel17
  - number: '17.4'
    text: |-
      Behoudens het bepaalde in het vijfde lid, verwerkt Onze Minister binnen een werkdag volgend op de werkdag waarop
      hij een melding heeft ontvangen, de daarin opgenomen gegevens, voor zover van toepassing, in het register. Onze
      Minister doet onverwijld na de in de vorige volzin bedoelde verwerking mededeling van de inhoud van de melding aan
      de desbetreffende uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel17
  - number: '17.5'
    text: |-
      Indien Onze Minister de verwerking van een melding in het register heeft opgeschort op grond van
      [artikel 19, zesde lid][ref1], verwerkt hij de in het vierde lid bedoelde gegevens in het register in elk geval
      binnen een werkdag volgend op de werkdag waarop de gevorderde inlichtingen zijn verkregen dan wel, indien de
      gevorderde inlichtingen niet zijn verkregen, zodra hij verwerking in het register mogelijk acht. Onze Minister
      doet in dat geval onverwijld na de in de vorige volzin bedoelde verwerking mededeling van de melding aan de
      meldingsplichtige en mededeling van de inhoud van de melding aan de desbetreffende uitgevende instelling. De in de
      tweede volzin bedoelde mededeling strekt voor de meldingsplichtige tot bewijs dat deze aan zijn verplichting tot
      het doen van een melding heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel19
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '19'
        hoofdstuk: '7'
  - number: '18'
    text: |-
      Indien een uitgevende instelling, op grond van een mededeling betreffende een melding als bedoeld in
      [artikel 17, vierde lid, tweede volzin, of vijfde lid, tweede volzin][ref1], vermoedt dat een onjuiste melding is
      gedaan, stelt zij Onze Minister daarvan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel17
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '17'
        hoofdstuk: '6'
  - number: '19.1'
    text: |-
      Onze Minister kan degene die een onjuiste melding heeft gedaan of ten onrechte geen melding heeft gedaan in de
      gelegenheid stellen alsnog een juiste melding te doen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
  - number: '19.2'
    text: |-
      Ter bevordering van de juistheid van het register, kan Onze Minister, onverminderd het derde lid, inlichtingen
      inwinnen of doen inwinnen bij:
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
  - number: 19.2.a
    text: de meldingsplichtige, indien Onze Minister het redelijk vermoeden heeft dat deze een onjuiste melding heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
  - number: 19.2.b
    text: |-
      effecteninstellingen, effectenbewaarbedrijven en houders van een effectenbeurs als bedoeld in de
      [Wet toezicht effectenverkeer 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007657
  - number: 19.2.c
    text: |-
      de uitgevende instelling die aandelen heeft uitgegeven en waarop het kapitaalbelang of de stemmen van de
      meldingsplichtige betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
  - number: 19.2.d
    text: de houder van een substantiële deelneming.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
  - number: '19.3'
    text: |-
      Indien Onze Minister door toepassing van zijn bevoegdheden als bedoeld in het tweede lid het redelijk vermoeden
      heeft dat ten onrechte geen melding is gedaan, kan hij inlichtingen inwinnen of doen inwinnen bij degene van wie
      wordt vermoed dat deze meldingsplichtig is.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
  - number: '19.4'
    text: |-
      Degene van wie de inlichtingen, bedoeld in het tweede en derde lid, worden verlangd, verstrekt deze binnen de door
      Onze Minister te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
  - number: '19.5'
    text: |-
      Ten aanzien van de personen die ingevolge het tweede en derde lid door Onze Minister zijn belast
      met het inwinnen of doen inwinnen van inlichtingen zijn de [artikelen 5:12][ref1], [5:13][ref2],
      [5:16][ref3] en [5:20 van de Algemene wet bestuursrecht][ref4] van overeenkomstige toepassing.
      Ten aanzien van de personen die ingevolge het tweede lid, onder a en b, en derde lid door Onze
      Minister zijn belast met het inwinnen of doen inwinnen van inlichtingen is, in aanvulling op
      de [eerste volzin, artikel 5:17 van de Algemene wet bestuursrecht][ref5] van overeenkomstige
      toepassing. Ten aanzien van de personen die ingevolge het tweede lid, onder b, door Onze
      Minister zijn belast met het inwinnen of doen inwinnen van inlichtingen is, in aanvulling op de
      [eerste en tweede volzin, artikel 5:15 van de Algemene wet bestuursrecht][ref6] van overeenkomstige toepassing.
      Indien een onderzoek als bedoeld in [artikel 22, eerste lid][ref7], wordt ingesteld, is degene bij wie het
      onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht staat, slechts gehouden tot het verlenen
      van inzage in zakelijke gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0020052#Artikel22
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0020052
        artikel: '22'
        hoofdstuk: '8'
  - number: '19.6'
    text: |-
      Onze Minister kan de verwerking van een melding in het register voor de duur van het inwinnen of doen inwinnen
      van inlichtingen als bedoeld in het tweede en derde lid opschorten. Hij stelt de uitgevende instelling en de
      meldingsplichtige van een opschorting in kennis.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
  - number: '19.7'
    text: |-
      De meldingsplichtige verstrekt desgevraagd aan Onze Minister, binnen een door de Minister te stellen termijn,
      nadere gegevens op grond waarvan de melding is gedaan.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
  - number: '19.8'
    text: |-
      Indien een melding naar het oordeel van Onze Minister onjuist is en de melding is niet hersteld, of indien
      een melding ten onrechte niet is gedaan en de juiste melding blijft achterwege, kan Onze Minister de naar zijn
      oordeel juiste gegevens in het register opnemen, nadat hij daarvan aan de betrokken uitgevende instelling en de
      meldingsplichtige mededeling heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel19
  - number: '20.1'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt of van een instantie
      als bedoeld in [artikel 21, eerste lid][ref1], verkregen, of van gegevens of inlichtingen, bij het onderzoek van
      zakelijke gegevens en bescheiden verkregen, verder of anders bekendheid te geven dan voor de uitoefening van zijn
      taak of door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel21
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '21'
        hoofdstuk: '8'
  - number: '20.2'
    text: |-
      Het in het eerste lid bepaalde laat, ten aanzien van degene op wie het eerste lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '21.1'
    text: |-
      In afwijking van [artikel 20, eerste lid][ref1], kan Onze Minister gegevens of inlichtingen, verkregen bij
      de vervulling van de hem ingevolge deze wet opgedragen taak, verstrekken aan Nederlandse of buitenlandse
      overheidsinstanties dan wel aan Nederlandse of buitenlandse van overheidswege aangewezen instanties die belast zijn
      met het toezicht op financiële markten of op natuurlijke personen, rechtspersonen en vennootschappen die op die
      markten werkzaam zijn, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel20
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '20'
        hoofdstuk: '8'
  - number: 21.1.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende is bepaald;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
  - number: 21.1.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
  - number: 21.1.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
  - number: 21.1.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
  - number: 21.1.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
  - number: 21.1.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
  - number: '21.2'
    text: |-
      Voor zover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een buitenlandse
      overheidsinstantie dan wel van een buitenlandse van overheidswege aangewezen instantie, die is belast met het
      toezicht op financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn,
      verstrekt Onze Minister deze niet aan een Nederlandse of buitenlandse instantie als bedoeld in het eerste lid,
      tenzij de buitenlandse instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk heeft ingestemd
      met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het gebruik voor een
      ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
  - number: '21.3'
    text: |-
      Indien een buitenlandse instantie als bedoeld in het eerste of tweede lid aan Onze Minister verzoekt om de gegevens
      of inlichtingen die op grond van dat lid zijn verstrekt te mogen gebruiken voor een ander doel dan waarvoor zij
      zijn verstrekt, wordt dat verzoek slechts ingewilligd:
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
  - number: 21.3.a
    text: indien het beoogde gebruik niet in strijd is met het eerste lid; of
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
  - number: 21.3.b
    text: |-
      indien die buitenlandse instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met inachtneming
      van de daarvoor geldende procedures voor dat andere doel de beschikking over die gegevens of inlichtingen zou
      kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
  - number: '21.4'
    text: |-
      Indien het in het derde lid bedoelde verzoek betrekking heeft op een onderzoek naar strafbare feiten, wordt dit
      niet ingewilligd dan na toestemming van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel21
  - number: '22.1'
    text: |-
      Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn, kan Onze Minister ten
      behoeve van een instantie die werkzaam is in een Staat die met Nederland partij is bij een verdrag of die met
      Nederland valt onder eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die Staat is belast
      met de uitvoering van wettelijke regelingen inzake het toezicht op het effectenverkeer, inlichtingen vragen aan of
      een onderzoek instellen of doen instellen bij een ieder die ingevolge deze wet onder zijn toezicht valt dan wel bij
      een ieder waarvan redelijkerwijs kan worden vermoed dat hij over gegevens of inlichtingen beschikt die van belang
      kunnen zijn voor de uitvoering van de wettelijke regelingen als hiervoor bedoeld.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel22
  - number: '22.2'
    text: |-
      Degene aan wie gegevens of inlichtingen als bedoeld in het eerste lid worden gevraagd, verstrekt deze gegevens of
      inlichtingen binnen een door Onze Minister te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister kan toestaan dat een functionaris van een buitenlandse instantie als bedoeld in
      [artikel 22, eerste lid][ref1], deelneemt aan de uitvoering van een verzoek als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel22
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '22'
        hoofdstuk: '8'
  - number: '23.2'
    text: |-
      Degene bij wie een onderzoek als bedoeld in [artikel 22, eerste lid][ref1], wordt ingesteld, verleent aan de in
      het eerste lid bedoelde functionaris alle medewerking die nodig is voor een goede uitvoering van dat onderzoek,
      met dien verstande dat degene bij wie het onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht
      staat, slechts is gehouden tot het verlenen van inzage in zakelijke gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel22
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '22'
        hoofdstuk: '8'
  - number: '23.3'
    text: |-
      De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      verzoek is belast.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel23
  - number: '24'
    text: |-
      Onze Minister kan de kosten die voor de uitvoering van deze wet worden gemaakt volgens door Onze Minister te
      stellen regels in rekening brengen bij de uitgevende instellingen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel24
  - number: '25.1'
    text: |-
      Met uitzondering van de bevoegdheid, bedoeld in [artikel 24][ref1], om regels te stellen voor het verhaal
      van kosten, de bevoegdheid, bedoeld in het vijfde lid, eerste volzin, en de bevoegdheid, bedoeld in de
      [artikelen 28, derde lid][ref2] en [29, derde lid][ref3], kunnen taken en bevoegdheden die Onze Minister op grond
      van deze wet heeft bij algemene maatregel van bestuur worden overgedragen aan een of meer rechtspersonen. Alsdan
      gelden de verplichtingen op grond van deze wet jegens Onze Minister, met uitzondering van de verplichting op grond
      van het vijfde lid, eerste volzin, als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0020052#Artikel29
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '24'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '28'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0020052
        artikel: '29'
        hoofdstuk: '11'
  - number: '25.2'
    text: 'Een overdracht vindt slechts plaats indien de betrokken rechtspersoon aan de volgende eisen voldoet:'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel25
  - number: 25.2.a
    text: hij dient in staat te zijn de overgedragen taken en bevoegdheden naar behoren uit te oefenen; en
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel25
  - number: 25.2.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de betrokken rechtspersoon dat een
      onafhankelijke uitoefening van de overgedragen taken en bevoegdheden zoveel mogelijk is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel25
  - number: '25.3'
    text: Aan de overdracht kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel25
  - number: '25.4'
    text: |-
      De rechtspersoon stelt eenmaal per jaar, uiterlijk op 1 september, het beleid vast met betrekking tot de
      uitoefening van de overgedragen taken en bevoegdheden in het komende kalenderjaar. Dit beleid wordt door de zorg
      van Onze Minister openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel25
  - number: '25.5'
    text: |-
      De rechtspersoon brengt eenmaal per jaar, uiterlijk op 1 mei, verslag uit aan Onze Minister over de uitoefening
      van de overgedragen taken en bevoegdheden in het voorgaande kalenderjaar. Dit verslag wordt door de zorg van Onze
      Minister openbaar gemaakt, met dien verstande dat gegevens met betrekking tot afzonderlijke uitgevende instellingen
      en degenen op wie een meldingsplicht rust niet worden opgenomen in het register, tenzij het gaat om gegevens die
      door Onze Minister reeds in het register zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel25
  - number: '26.1'
    text: |-
      Indien een melding waartoe deze wet verplicht niet overeenkomstig deze wet is gedaan, kan de rechtbank van de
      plaats waar de betrokken uitgevende instelling is gevestigd, op vordering van degene die krachtens het tweede lid
      daartoe bevoegd is, de in het vierde lid genoemde maatregelen treffen. Indien een melding betrekking heeft op een
      vennootschap die buiten Nederland is gevestigd, is de rechtbank te ’s-Gravenhage bevoegd.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: '26.2'
    text: 'Tot het instellen van een vordering zijn bevoegd:'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: 26.2.a
    text: een of meer houders van aandelen die alleen of gezamenlijk beschikken over een substantiële deelneming;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: 26.2.b
    text: |-
      een houder van een of meer aandelen met een bijzonder statutair recht inzake de zeggenschap in een uitgevende
      instelling;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: 26.2.c
    text: een uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: '26.3'
    text: |-
      De bevoegdheid om de vordering in te stellen vervalt door verloop van drie maanden vanaf de dag waarop degene die
      bevoegd is de vordering in te stellen van de overtreding kennis heeft genomen of heeft kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: '26.4'
    text: 'De maatregelen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: 26.4.a
    text: veroordeling van de meldingsplichtige tot melding overeenkomstig deze wet;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: 26.4.b
    text: |-
      schorsing van het uitbrengen van de stemmen waarover de meldingsplichtige beschikt gedurende een door de rechtbank
      te bepalen periode van ten hoogste drie jaren;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: 26.4.c
    text: |-
      schorsing van een besluit van de algemene vergadering van aandeelhouders van de uitgevende instelling totdat over
      een maatregel als bedoeld in onderdeel d onherroepelijk is beslist;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: 26.4.d
    text: |-
      vernietiging van een besluit van de algemene vergadering van aandeelhouders van de uitgevende instelling voor zover
      aannemelijk is dat dit besluit niet zou zijn genomen indien de stemmen waarover de meldingsplichtige beschikt niet
      zouden zijn uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: 26.4.e
    text: |-
      een bevel aan de meldingsplichtige om zich gedurende een door de rechtbank te bepalen periode van ten hoogste vijf
      jaren te onthouden van het verkrijgen van de beschikking over aandelen of stemmen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: '26.5'
    text: |-
      Een maatregel als bedoeld in het vierde lid, onderdelen b en e, geldt niet voor aandelen die ten titel van beheer
      worden gehouden door een ander dan de meldingsplichtige, tenzij de meldingsplichtige bevoegd is om zich deze
      aandelen te verschaffen of te bepalen hoe de daaraan verbonden stemmen worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: '26.6'
    text: De rechtbank regelt zo nodig de gevolgen van de door haar getroffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: '26.7'
    text: |-
      De rechtbank kan op vordering van degene die de oorspronkelijke vordering heeft ingesteld of van degene tegen wie
      de maatregel is gericht de periode, bedoeld in het vierde lid, onderdelen b en e, verkorten.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: '26.8'
    text: Een maatregel als bedoeld in het vierde lid, onderdeel d, kan niet uitvoerbaar bij voorraad worden verklaard.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: '26.9'
    text: |-
      Indien de vordering, bedoeld in het eerste lid, betrekking heeft op aandelen die niet door de meldingsplichtige
      zelf worden gehouden of op stemmen die hij niet zelf als aandeelhouder, pandhouder of vruchtgebruiker kan
      uitbrengen, roept de eiser de desbetreffende houder, pandhouder of vruchtgebruiker in het geding op, zo die aan de
      eiser bekend is.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: '26.10'
    text: |-
      Een onmiddellijke voorziening bij voorraad kan slechts worden gevorderd bij de president van de rechtbank die op
      grond van het eerste lid bevoegd is. De vordering kan slechts betrekking hebben op de maatregelen, bedoeld in het
      vierde lid, onderdelen a, b, c en e. Het vijfde en negende lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
  - number: '27'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '28.1'
    text: |-
      Onze Minister kan een last onder dwangsom opleggen terzake van overtreding van voorschriften, gesteld bij of
      krachtens [artikel 19, eerste, vierde, vijfde en zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel19
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '19'
        hoofdstuk: '7'
  - number: '28.2'
    text: |-
      De [artikelen 5:32, tweede tot en met vijfde lid][ref1], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '28.3'
    text: Onze Minister kan regels stellen terzake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel28
  - number: '29.1'
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen terzake van overtreding van voorschriften, gesteld
      bij of krachtens de [artikelen 2][ref1], [3][ref2], [4][ref3], [5][ref4], [6][ref5], [7][ref6],
      [8][ref7], [9][ref8], [10][ref9], [11][ref10], [12][ref11], [15][ref12], [16][ref13], [18][ref14],
      [19, eerste, vierde, vijfde en zevende lid][ref15], [58][ref16], [59][ref17] en [60][ref18].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020052#Artikel4
