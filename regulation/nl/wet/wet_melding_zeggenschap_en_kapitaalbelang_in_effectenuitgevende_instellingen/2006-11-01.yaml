  - number: '26'
    text: |-
      1 Indien een melding waartoe deze wet verplicht niet overeenkomstig deze wet is gedaan, kan de rechtbank van de
      plaats waar de betrokken uitgevende instelling is gevestigd, op vordering van degene die krachtens het tweede lid
      daartoe bevoegd is, de in het vierde lid genoemde maatregelen treffen. Indien een melding betrekking heeft op een
      vennootschap die buiten Nederland is gevestigd, is de rechtbank te ’s-Gravenhage bevoegd.

      2 Tot het instellen van een vordering zijn bevoegd:

      a. een of meer houders van aandelen die alleen of gezamenlijk beschikken over een substantiële deelneming;

      b. een houder van een of meer aandelen met een bijzonder statutair recht inzake de zeggenschap in een uitgevende
      instelling;

      c. een uitgevende instelling.

      3 De bevoegdheid om de vordering in te stellen vervalt door verloop van drie maanden vanaf de dag waarop degene die
      bevoegd is de vordering in te stellen van de overtreding kennis heeft genomen of heeft kunnen nemen.

      4 De maatregelen, bedoeld in het eerste lid, zijn:

      a. veroordeling van de meldingsplichtige tot melding overeenkomstig deze wet;

      b. schorsing van het uitbrengen van de stemmen waarover de meldingsplichtige beschikt gedurende een door de
      rechtbank te bepalen periode van ten hoogste drie jaren;

      c. schorsing van een besluit van de algemene vergadering van aandeelhouders van de uitgevende instelling totdat
      over een maatregel als bedoeld in onderdeel d onherroepelijk is beslist;

      d. vernietiging van een besluit van de algemene vergadering van aandeelhouders van de uitgevende instelling voor
      zover aannemelijk is dat dit besluit niet zou zijn genomen indien de stemmen waarover de meldingsplichtige beschikt
      niet zouden zijn uitgeoefend;

      e. een bevel aan de meldingsplichtige om zich gedurende een door de rechtbank te bepalen periode van ten hoogste
      vijf jaren te onthouden van het verkrijgen van de beschikking over aandelen of stemmen.

      5 Een maatregel als bedoeld in het vierde lid, onderdelen b en e, geldt niet voor aandelen die ten titel van
      beheer worden gehouden door een ander dan de meldingsplichtige, tenzij de meldingsplichtige bevoegd is om zich deze
      aandelen te verschaffen of te bepalen hoe de daaraan verbonden stemmen worden uitgeoefend.

      6 De rechtbank regelt zo nodig de gevolgen van de door haar getroffen maatregelen.

      7 De rechtbank kan op vordering van degene die de oorspronkelijke vordering heeft ingesteld of van degene tegen wie
      de maatregel is gericht de periode, bedoeld in het vierde lid, onderdelen b en e, verkorten.

      8 Een maatregel als bedoeld in het vierde lid, onderdeel d, kan niet uitvoerbaar bij voorraad worden verklaard.

      9 Indien de vordering, bedoeld in het eerste lid, betrekking heeft op aandelen die niet door de meldingsplichtige
      zelf worden gehouden of op stemmen die hij niet zelf als aandeelhouder, pandhouder of vruchtgebruiker kan
      uitbrengen, roept de eiser de desbetreffende houder, pandhouder of vruchtgebruiker in het geding op, zo die aan de
      eiser bekend is.

      10 Een onmiddellijke voorziening bij voorraad kan slechts worden gevorderd bij de president van de rechtbank die op
      grond van het eerste lid bevoegd is. De vordering kan slechts betrekking hebben op de maatregelen, bedoeld in het
      vierde lid, onderdelen a, b, c en e. Het vijfde en negende lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel26
