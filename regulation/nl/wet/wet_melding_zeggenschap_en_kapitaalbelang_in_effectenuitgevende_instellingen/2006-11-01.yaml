        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0020052
        artikel: '40'
        hoofdstuk: '12'
  - number: '46'
    text: |-
      1 De bevoegdheid om op grond van [artikel 40][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na
      de dag waarop het feit heeft plaats gehad.

      2 De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel40
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '40'
        hoofdstuk: '12'
  - number: '47'
    text: |-
      De werkzaamheden in verband met het op grond van [artikel 40][ref1] ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan voorafgaande
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel40
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel47
