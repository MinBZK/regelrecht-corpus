  - number: '14'
    text: |-
      1 De verplichtingen om te melden op grond van de [artikelen 6 tot en met 11][ref1] zijn, voor zover de aandelen en
      de daaraan verbonden stemmen in de regelmatige uitoefening van hun bedrijf en gedurende een korte periode worden
      gehouden, niet van toepassing op:

      a. ondernemingen of instellingen die het clearingbedrijf uitoefenen en die geen kredietinstelling zijn als bedoeld
      in [artikel 1, onderdeel a, van de Wet toezicht kredietwezen 1992][ref2];

      b. afwikkelende instanties als bedoeld in [artikel 212a, onderdeel f, van de Faillissementswet][ref3];

      c. nationale centrale banken die onderdeel uitmaken van het Europees Stelsel van Centrale Banken, bedoeld in
      artikel 8 van het Verdrag tot oprichting van de Europese Gemeenschap, voorzover de stemmen niet worden uitgebracht.

      2 De verplichtingen om te melden op grond van de [artikelen 6 tot en met 11][ref4] zijn, voor zover de aandelen en
      de daaraan verbonden stemmen worden gehouden in de regelmatige uitoefening van hun bedrijf, niet van toepassing op:

      a. bewaarnemers van aandelen, voorzover deze de aan deze aandelen verbonden stemmen niet naar eigen goeddunken
      kunnen uitbrengen;

      b. marketmakers die de beschikking krijgen of verliezen over aandelen en de daaraan verbonden stemmen waardoor,
      naar zij weten of behoren te weten, het percentage van het kapitaal of de stemmen waarover zij beschikken de
      drempelwaarde van 5 procent bereikt, overschrijdt of onderschrijdt, voor zover deze geen invloed uitoefenen in
      het bestuur van de desbetreffende uitgevende instelling en in hun lidstaat van herkomst een vergunning hebben
      als bedoeld in [richtlijn nr. 2004/39/EG](32004L0039) van het Europees Parlement en de Raad van de Europese Unie
      van 21 april 2004 betreffende markten voor financiële instrumenten, tot wijziging van de [Richtlijnen 85/611/EEG]
      (31985L0611) en [93/6/EEG](31993L0006) van de Raad en [Richtlijn 2000/39/EG](32000L0039) van het Europees Parlement
      en de Raad en houdende intrekking van [Richtlijn 93/22/EEG](31993L0022) van de Raad (PbEU L 145).

      3 Voor zover de aandelen en de daaraan verbonden stemmen tot de handelsportefeuille behoren en de drempelwaarde
      van vijf procent niet overschrijden, en indien de stemmen niet worden uitgebracht en niet anderszins invloed wordt
      uitgeoefend in het bestuur van de desbetreffende uitgevende instellingen, zijn de verplichtingen om te melden op
      grond van de [artikelen 6 tot en met 11][ref5], niet van toepassing op:

      a. instellingen die beschikken over een vergunning als bedoeld in
      [artikel 7, eerste lid, van de Wet toezicht effectenverkeer 1995][ref6] en instellingen die beschikken over
      een vergunning als bedoeld in [artikel 6][ref7] of [38 van de Wet toezicht kredietwezen 1992][ref8] dan wel een
      verklaring van ondertoezichtstelling als bedoeld in [artikel 45 van die wet][ref9];

      b. instellingen die in een andere lidstaat zijn gevestigd en van de toezichthoudende autoriteit van die lidstaat
      een vergunning hebben verkregen als bedoeld in artikel 5, eerste lid, eerste volzin, van [richtlijn nr. 2004/39/
      EG](32004L0039) van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004 betreffende markten
      voor financiële instrumenten, tot wijziging van de [Richtlijnen 85/611/EEG](31985L0611) en [93/6/EEG](31993L0006)
      van de Raad en [Richtlijn 2000/12/EG](32000L0012) van het Europees Parlement en de Raad en houdende intrekking van
      [Richtlijn 93/22/EEG](31993L0022) van de Raad (PbEU L 145);

      c. kredietinstellingen die in een andere lidstaat zijn gevestigd en van de toezichthoudende autoriteit van die
      andere lidstaat een vergunning hebben verkregen als bedoeld in artikel 1, onderdeel 2, van [richtlijn nr. 2000/12/
      EG](32000L0012) van het Europees Parlement en de Raad van de Europese Unie van 20 maart 2000 betreffende de toegang
      tot en de uitoefening van de werkzaamheden van kredietinstellingen (PbEG L 126);

      d. in een andere lidstaat gevestigde financiële instellingen als bedoeld in artikel 1, onderdeel 5, van [richtlijn
      nr. 2000/12/EG](32000L0012) van het Europees Parlement en de Raad van de Europese Unie van 20 maart 2000
      betreffende de toegang tot en de uitoefening van de werkzaamheden van kredietinstellingen (PbEG L 126).

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste, tweede of derde
      lid.

      5 Indien een in het eerste, tweede of derde lid bedoelde onderneming of instelling op het tijdstip waarop de
      toepasselijkheid van het eerste, tweede of derde lid eindigt de aandelen nog houdt dan wel de stemmen nog kan
      uitbrengen, wordt zij geacht op dat tijdstip de beschikking te hebben verkregen over deze aandelen en stemmen.


