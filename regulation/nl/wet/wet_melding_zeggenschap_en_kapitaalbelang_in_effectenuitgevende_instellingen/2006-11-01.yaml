  - number: '13'
    text: |-
      1 Iemand beschikt over de aandelen die hij houdt, alsmede over de stemmen die hij kan uitbrengen als aandeelhouder.

      2 Iemand beschikt over de stemmen die hij, indien toepassing is gegeven aan [artikel 88, derde lid][ref1], of
      [artikel 89, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref2], als vruchtgebruiker onderscheidenlijk
      pandhouder kan uitbrengen.

      3 Iemand wordt geacht te beschikken over de aandelen die zijn dochtermaatschappij houdt, alsmede over de stemmen
      die zijn dochtermaatschappij kan uitbrengen. Een dochtermaatschappij wordt geacht niet te beschikken over aandelen
      of stemmen.

      4 Iemand wordt geacht te beschikken over de aandelen die door een derde voor zijn rekening worden gehouden, alsmede
      over de stemmen die deze derde kan uitbrengen.

      5 Iemand wordt geacht te beschikken over de stemmen waarover een derde beschikt, met wie hij een overeenkomst heeft
      gesloten die voorziet in een duurzaam gemeenschappelijk beleid inzake het uitbrengen van de stemmen.

      6 Iemand wordt geacht te beschikken over de stemmen waarover een derde beschikt, met wie hij een overeenkomst heeft
      gesloten waarin een tijdelijke en betaalde overdracht van deze stemmen is geregeld.

      7 De beheerder van een beleggingsfonds als bedoeld in
      [artikel 1, onder b, van de Wet toezicht beleggingsinstellingen][ref3] wordt geacht te beschikken over de aandelen
      die de bewaarder houdt en de daaraan verbonden stemmen. De bewaarder van een beleggingsfonds wordt geacht niet te
      beschikken over aandelen of stemmen.

      8 Aandelen en stemmen die deel uitmaken van een gemeenschap worden in evenredigheid van hun gerechtigdheid
      toegerekend aan de deelgenoten. In afwijking van de vorige volzin worden stemmen die deel uitmaken van een
      wettelijke gemeenschap van goederen als bedoeld in [artikel 93 van Boek 1 van het Burgerlijk Wetboek][ref4]
      toegerekend aan de echtgenoot van wiens zijde de stemmen in de gemeenschap zijn gevallen als bedoeld in
      [artikel 97 van Boek 1 van het Burgerlijk Wetboek][ref5].

      9 Iemand wordt geacht te beschikken over de stemmen die hij als gevolmachtigde naar eigen goeddunken kan
      uitbrengen.

      10 Het derde lid is volgens bij algemene maatregel van bestuur te stellen regels niet van toepassing op degene
      wiens dochtermaatschappij:

      a. een beheerder is die de stemmen die zijn verbonden aan de aandelen die worden gehouden door de
      beleggingsinstelling, bedoeld in [artikel 1, onderdeel a, van de Wet toezicht beleggingsinstellingen][ref6],
      waarover hij het beheer voert, dan wel de stemmen waarover hij ingevolge het zevende lid, eerste volzin, wordt
      geacht te beschikken, naar eigen goeddunken kan uitbrengen; of

      b. een vermogensbeheerder is als bedoeld in [artikel 1, onderdeel c, van de Wet toezicht effectenverkeer 1995][ref7],
      die de stemmen die zijn verbonden aan de aandelen waarover hij het beheer voert naar eigen goeddunken kan
      uitbrengen.


