        artikel: '40'
        hoofdstuk: '12'
  - number: '58'
    text: |-
      1 De uitgevende instelling meldt binnen vier weken na het tijdstip van inwerkingtreding van deze wet aan Onze
      Minister haar kapitaal en haar stemmen zoals aanwezig op het tijdstip van inwerkingtreding van deze wet. Indien op
      grond van [artikel 2, eerste lid][ref1], of [artikel 3, eerste lid][ref2], een onverwijlde melding dient plaats te
      vinden en een melding op grond van het onderhavige artikel nog niet heeft plaatsgevonden, wordt de laatstbedoelde
      melding gelijktijdig met de onverwijlde melding gedaan.

      2 Een melding als bedoeld in het eerste lid, eerste volzin, bevat de volgende gegevens:

      a. de naam van de uitgevende instelling;

      b. voor zover van toepassing: het nummer van inschrijving van de uitgevende instelling in het handelsregister,
      bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref3];

      c. het tijdstip waarop de meldingsplicht is ontstaan;

      d. het kapitaal op het tijdstip waarop de meldingsplicht is ontstaan;

      e. het aantal en de soort aandelen, bedoeld in [artikel 1, eerste lid, onderdeel d, onder 1°][ref4], waarin het
      kapitaal is verdeeld op het tijdstip waarop de meldingsplicht is ontstaan;

      f. het aantal en de soort stemmen op het tijdstip waarop de meldingsplicht is ontstaan;

      g. voor zover van toepassing: het aantal en de soort aandelen, bedoeld in
      [artikel 1, eerste lid, onderdeel d, onder 2°][ref5], op het tijdstip waarop de meldingsplicht is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007893#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0020052#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0020052#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel58
