    text: |-
      1 In dit artikel en de daarop berustende bepalingen wordt, in afwijking van
      [artikel 1, eerste lid, onderdeel a][ref1], onder uitgevende instelling verstaan: een naamloze vennootschap naar
      Nederlands recht waarvan aandelen als bedoeld in [artikel 1, eerste lid, onderdeel d, onder 1° en 2°][ref2], zijn
      toegelaten tot de handel op een gereglementeerde markt in Nederland of in een andere lidstaat.

      2 In dit artikel en de daarop berustende bepalingen wordt onder gelieerde uitgevende instelling verstaan: iedere
      andere uitgevende instelling:

      1°. waarmee de uitgevende instelling in een groep is verbonden of waarin de uitgevende instelling een deelneming
      heeft als bedoeld in [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref3], indien de meest recent vastgestelde
      omzet van die andere uitgevende instelling tenminste tien procent van de geconsolideerde omzet van de uitgevende
      instelling bedraagt; of

      2°. die rechtstreeks of middellijk meer dan vijfentwintig procent van het kapitaal van de uitgevende instelling
      verschaft.

      3 Een bestuurder of commissaris van een uitgevende instelling meldt aan Onze Minister de aandelen en stemmen in de
      uitgevende instelling en de gelieerde uitgevende instellingen waarover hij beschikt. Deze meldingen worden gedaan
      binnen twee weken na de aanwijzing of benoeming als bestuurder of commissaris.

      4 Een bestuurder of commissaris van een naamloze vennootschap die een uitgevende instelling wordt in de zin van het
      eerste lid, meldt onverwijld aan Onze Minister de aandelen en stemmen in de uitgevende instelling en de gelieerde
      uitgevende instellingen waarover hij beschikt. Aan de verplichting op grond van de vorige volzin is voldaan, indien
      terzake van hetzelfde feit een melding is gedaan op grond van [artikel 11, eerste lid][ref4].

      5 Een bestuurder of commissaris van een uitgevende instelling ten opzichte waarvan een andere naamloze vennootschap
      een gelieerde uitgevende instelling wordt in de zin van het tweede lid, meldt onverwijld aan Onze Minister de
      aandelen en stemmen in deze gelieerde uitgevende instelling waarover hij beschikt. Aan de verplichting op grond
      van de vorige volzin is voldaan, indien terzake van deze aandelen of stemmen een melding is gedaan op grond van de
      [artikelen 6, eerste of tweede lid][ref5], [7, eerste lid][ref6], [8][ref7] of [11][ref8].

      6 Een bestuurder of commissaris van een uitgevende instelling meldt onverwijld aan Onze Minister iedere wijziging
      in de aandelen in de uitgevende instelling en de gelieerde uitgevende instellingen waarover hij beschikt. Aan de
      verplichting op grond van de vorige volzin is voldaan, indien terzake van hetzelfde feit een melding is gedaan op
      grond van [artikel 6, eerste lid][ref9], of [8][ref10].

      7 Een bestuurder of commissaris van een uitgevende instelling meldt onverwijld aan Onze Minister iedere wijziging
      in de stemmen in de uitgevende instelling en de gelieerde uitgevende instellingen waarover hij beschikt. Aan de
      verplichting op grond van de vorige volzin is voldaan, indien terzake van hetzelfde feit een melding is gedaan op
      grond van [artikel 6, tweede lid][ref11].

      8 Een uitgevende instelling meldt het feit dat een bestuurder of commissaris niet langer in functie is onverwijld
      aan Onze Minister.

      9 Indien een bestuurder van een uitgevende instelling een rechtspersoon is, zijn het derde tot en met het achtste
      lid van overeenkomstige toepassing op de natuurlijke personen die het dagelijks beleid van deze rechtspersoon
      bepalen, alsmede op de natuurlijke personen die toezicht houden op het beleid van het bestuur en de algemene gang
      van zaken in deze rechtspersoon.

      10 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevens die bij een melding als
      bedoeld in dit artikel dienen te worden verstrekt en met betrekking tot de wijze van melden.


