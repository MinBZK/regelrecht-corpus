  - number: '29.2'
    text: |-
      De bestuurlijke boete komt toe aan de Staat. Voor zover Onze Minister met toepassing van
      [artikel 25, eerste lid][ref1], de bevoegdheid tot het opleggen van een bestuurlijke boete heeft overgedragen aan
      een rechtspersoon, komt de boete toe aan die rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel25
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '25'
        hoofdstuk: '9'
  - number: '29.3'
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Justitie, kan regels stellen terzake van de uitoefening van
      de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel29
  - number: '30.1'
    text: |-
      Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de boete voor
      een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel30
  - number: '30.2'
    text: De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel30
  - number: '30.3'
    text: De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel30
  - number: '30.4'
    text: |-
      Onze Minister kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de
      boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel30
  - number: '31'
    text: |-
      Degene jegens wie door Onze Minister een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan
      verbinden dat hem wegens een overtreding een boete zal worden opgelegd, is niet verplicht terzake daarvan enige
      verklaring af te leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel31
  - number: '32.1'
    text: |-
      Indien Onze Minister voornemens is een boete op te leggen, geeft hij de betrokkene daarvan kennis onder vermelding
      van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel32
  - number: '32.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt Onze Minister de betrokkene in de
      gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt
      opgelegd, tenzij het een overtreding betreft die in de bijlage, bedoeld in [artikel 30][ref2], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel30
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '30'
        hoofdstuk: '11'
  - number: '33.1'
    text: Onze Minister legt de boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel33
  - number: '33.2'
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel33
  - number: 33.2.a
    text: het feit terzake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel33
  - number: 33.2.b
    text: het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel33
  - number: 33.2.c
    text: |-
      de termijn, bedoeld in [artikel 35, eerste lid][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel35
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '35'
        hoofdstuk: '11'
  - number: '34.1'
    text: |-
      De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel34
  - number: '34.2'
    text: |-
      In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 32, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel32
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '32'
        hoofdstuk: '11'
  - number: '35.1'
    text: De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel35
  - number: '35.2'
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 32, tweede lid][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel32
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '32'
        hoofdstuk: '11'
  - number: '35.3'
    text: |-
      Indien de boete niet tijdig is betaald, stuurt Onze Minister schriftelijk een aanmaning om binnen twee weken
      de boete, verhoogd met de kosten van de aanmaning, alsnog te betalen. De aanmaning bevat de aanzegging, dat de
      boete, voor zover deze niet binnen de gestelde termijn wordt betaald, overeenkomstig het vierde lid zal worden
      ingevorderd.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel35
  - number: '35.4'
    text: |-
      Bij gebreke van tijdige betaling kan Onze Minister de boete, verhoogd met de kosten van de aanmaning en van de
      invordering, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel35
  - number: '35.5'
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '35.6'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      rechtspersoon die de boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel35
  - number: '35.7'
    text: |-
      Het verzet schorst de tenuitvoerlegging niet, tenzij de president van de rechtbank in kort geding desgevraagd
      anders beslist.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel35
  - number: '35.8'
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel35
  - number: '36.1'
    text: |-
      De bevoegdheid een boete op te leggen vervalt indien terzake van de overtreding een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, alsmede het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '36.2'
    text: |-
      Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in [artikel 29][ref1] vervalt, indien
      Onze Minister terzake van die overtreding reeds een boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel29
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '29'
        hoofdstuk: '11'
  - number: '37.1'
    text: De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel37
  - number: '37.2'
    text: |-
      De termijn, bedoeld in het eerste lid, wordt gestuit door de bekendmaking van de beschikking waarbij een boete
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel37
  - number: '38'
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel38
  - number: '39'
    text: |-
      Met het oog op een adequate functionering van de effectenmarkten of de positie van de beleggers op die markten, kan
      Onze Minister, onverminderd [artikel 20, eerste lid][ref1], het feit terzake waarvan de last onder dwangsom of de
      bestuurlijke boete is opgelegd, het overtreden voorschrift, alsmede de naam, het adres en de woonplaats van degene
      aan wie de last onder dwangsom of de bestuurlijke boete is opgelegd, ter openbare kennis brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel20
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '20'
        hoofdstuk: '8'
  - number: '40'
    text: |-
      Onze Minister kan, in afwijking van [artikel 20, eerste lid][ref1], teneinde de naleving van deze wet te
      bevorderen, het feit dat een meldingsplichtige naar zijn oordeel een onjuiste melding heeft gedaan of ten onrechte
      geen melding heeft gedaan ter openbare kennis brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel20
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '20'
        hoofdstuk: '8'
  - number: '41'
    text: |-
      Degene jegens wie door Onze Minister een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking
      kan verbinden dat Onze Minister zijn handelen of nalaten op grond van [artikel 40][ref1] ter openbare kennis zal
      brengen, is niet verplicht terzake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld
      alvorens hem mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel40
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '40'
        hoofdstuk: '12'
  - number: '42'
    text: |-
      De beschikking om op grond van [artikel 40][ref1] een feit ter openbare kennis te brengen vermeldt in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel40
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '40'
        hoofdstuk: '12'
  - number: 42.a
    text: het feit dat ter openbare kennis wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel42
  - number: 42.b
    text: de wijze waarop het feit ter openbare kennis wordt gebracht; en
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel42
  - number: 42.c
    text: de termijn waarna het feit ter openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel42
  - number: '43'
    text: |-
      Tenzij de bevordering van de naleving van deze wet geen uitstel toelaat, wordt de werking van de beschikking om
      op grond van [artikel 40][ref1] een feit ter openbare kennis te brengen opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel40
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '40'
        hoofdstuk: '12'
  - number: '44'
    text: |-
      In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht][ref1] treedt de beschikking in werking op de dag
      waarop het feit ter openbare kennis is gebracht zonder dat de werking voor de duur van de beroepstermijn of, indien
      beroep is ingesteld, van het beroep wordt opgeschort, indien van de betrokkene geen adres bekend is en het adres
      ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '45.1'
    text: |-
      De bevoegdheid om op grond van [artikel 40][ref1] een feit ter openbare kennis te brengen vervalt indien terzake
      van het feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen,
      alsmede het recht tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '40'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '45.2'
    text: |-
      Het recht tot strafvervolging met betrekking tot een feit als bedoeld in [artikel 40][ref1] vervalt, indien Onze
      Minister het feit reeds ter openbare kennis heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel40
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '40'
        hoofdstuk: '12'
  - number: '46.1'
    text: |-
      De bevoegdheid om op grond van [artikel 40][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na de
      dag waarop het feit heeft plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel40
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '40'
        hoofdstuk: '12'
  - number: '46.2'
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel46
  - number: '47'
    text: |-
      De werkzaamheden in verband met het op grond van [artikel 40][ref1] ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan voorafgaande
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel40
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '40'
        hoofdstuk: '12'
  - number: '58.1'
    text: |-
      De uitgevende instelling meldt binnen vier weken na het tijdstip van inwerkingtreding van deze wet aan Onze
      Minister haar kapitaal en haar stemmen zoals aanwezig op het tijdstip van inwerkingtreding van deze wet. Indien op
      grond van [artikel 2, eerste lid][ref1], of [artikel 3, eerste lid][ref2], een onverwijlde melding dient plaats te
      vinden en een melding op grond van het onderhavige artikel nog niet heeft plaatsgevonden, wordt de laatstbedoelde
      melding gelijktijdig met de onverwijlde melding gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel3
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '3'
        hoofdstuk: '2'
  - number: '58.2'
    text: 'Een melding als bedoeld in het eerste lid, eerste volzin, bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel58
  - number: 58.2.a
    text: de naam van de uitgevende instelling;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel58
  - number: 58.2.b
    text: |-
      voor zover van toepassing: het nummer van inschrijving van de uitgevende instelling in het handelsregister, bedoeld
      in [artikel 2 van de Handelsregisterwet 1996][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel2
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '2'
  - number: 58.2.c
    text: het tijdstip waarop de meldingsplicht is ontstaan;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel58
  - number: 58.2.d
    text: het kapitaal op het tijdstip waarop de meldingsplicht is ontstaan;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel58
  - number: 58.2.e
    text: |-
      het aantal en de soort aandelen, bedoeld in [artikel 1, eerste lid, onderdeel d, onder 1°][ref1], waarin het
      kapitaal is verdeeld op het tijdstip waarop de meldingsplicht is ontstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
  - number: 58.2.f
    text: het aantal en de soort stemmen op het tijdstip waarop de meldingsplicht is ontstaan;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel58
  - number: 58.2.g
    text: |-
      voor zover van toepassing: het aantal en de soort aandelen, bedoeld in
      [artikel 1, eerste lid, onderdeel d, onder 2°][ref1], op het tijdstip waarop de meldingsplicht is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel1
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '1'
        hoofdstuk: '1'
  - number: '59.1'
    text: |-
      Een ieder die op het tijdstip van inwerkingtreding van deze wet, naar hij weet of behoort te weten, beschikt over
      een substantiële deelneming of over een of meer aandelen met een bijzonder statutair recht inzake de zeggenschap
      in een uitgevende instelling, doet daarvan binnen vier weken na dat tijdstip aan Onze Minister melding. Indien
      op grond van de [artikelen 6, eerste of tweede lid][ref1], [7, eerste lid][ref2], [8][ref3] of [10][ref4] een
      onverwijlde melding dient plaats te vinden en een melding op grond van het onderhavige artikel nog niet heeft
      plaatsgevonden, wordt de laatstbedoelde melding gelijktijdig met de onverwijlde melding gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020052#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0020052#Artikel10
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '7'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020052
        artikel: '8'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0020052
        artikel: '10'
        hoofdstuk: '3'
  - number: '59.2'
    text: 'Een melding als bedoeld in het eerste lid, eerste volzin, bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel59
  - number: 59.2.a
    text: de naam van de meldingsplichtige;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel59
  - number: 59.2.b
    text: het adres en de woonplaats van de meldingsplichtige;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel59
  - number: 59.2.c
    text: het tijdstip waarop de meldingsplicht is ontstaan;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel59
  - number: 59.2.d
    text: de naam van de uitgevende instelling;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel59
  - number: 59.2.e
    text: |-
      het aantal en de soort aandelen en stemmen waarover de meldingsplichtige beschikte op het tijdstip waarop de
      meldingsplicht is ontstaan;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel59
  - number: 59.2.f
    text: |-
      voor zover [artikel 13, derde lid, eerste volzin][ref1], van toepassing is: de naam van de desbetreffende
      dochtermaatschappij;


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel13
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '13'
        hoofdstuk: '4'
  - number: 59.2.g
    text: het aantal en de aard van de stemmen.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel59
  - number: '60.1'
    text: |-
      Iedere bestuurder of commissaris van een uitgevende instelling als bedoeld in [artikel 16, eerste lid][ref1], die
      op het tijdstip van inwerkingtreding van deze wet de beschikking heeft over aandelen of stemmen in deze uitgevende
      instelling of de daaraan gelieerde uitgevende instellingen als bedoeld in [artikel 16, tweede lid][ref2], doet
      daarvan binnen vier weken na het tijdstip van inwerkingtreding van deze wet aan Onze Minister melding.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel16
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '16'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '16'
        hoofdstuk: '5'
  - number: '60.2'
    text: |-
      Indien op grond van [artikel 16, vierde, vijfde, zesde of zevende lid][ref1], een onverwijlde melding dient plaats
      te vinden en een melding op grond van het eerste lid nog niet heeft plaatsgevonden, wordt de laatstbedoelde melding
      gelijktijdig met de onverwijlde melding gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel16
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '16'
        hoofdstuk: '5'
  - number: '60.3'
    text: 'Een melding als bedoeld in het eerste lid bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel60
  - number: 60.3.a
    text: de naam van de meldingsplichtige;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel60
  - number: 60.3.b
    text: het adres en de woonplaats van de meldingsplichtige;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel60
  - number: 60.3.c
    text: het tijdstip waarop de meldingsplicht is ontstaan;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel60
  - number: 60.3.d
    text: de naam van de uitgevende instelling of van de gelieerde uitgevende instellingen;
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel60
  - number: 60.3.e
    text: |-
      het aantal en de soort aandelen en stemmen in de uitgevende instelling of in de gelieerde uitgevende instellingen
      waarover de meldingsplichtige beschikte op het tijdstip waarop de meldingsplicht is ontstaan.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel60
  - number: '61'
    text: |-
      In geval voor het tijdstip van inwerkingtreding van deze wet beroep is ingesteld tegen een op grond van de
      [Wet melding zeggenschap in ter beurze genoteerde vennootschappen 1996][ref1] genomen besluit wordt op het beroep
      beslist met toepassing van het voor dat tijdstip geldende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0008369
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0008369
  - number: '62'
    text: |-
      Ingeval voor het tijdstip van inwerkingtreding van deze wet kosten in rekening zijn gebracht bij een vennootschap
      voor de uitvoering van de [Wet melding zeggenschap in ter beurze genoteerde vennootschappen 1996][ref1] worden die
      kosten geacht verschuldigd te zijn op grond van [artikel 24][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008369
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel24
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0008369
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '24'
        hoofdstuk: '8'
  - number: '63'
    text: |-
      Op het tijdstip van inwerkingtreding van deze wet worden de gegevens in het register, bedoeld in
      [artikel 7a van de Wet melding zeggenschap in ter beurze genoteerde vennootschappen 1996][ref1], opgenomen in het
      register, bedoeld in [artikel 17, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008369#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0020052#Artikel17
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008369
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0020052
        artikel: '17'
        hoofdstuk: '6'
  - number: '65'
    text: |-
      De [Wet melding zeggenschap in ter beurze genoteerde vennootschappen 1996][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008369
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008369
  - number: '66'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel66
  - number: '67'
    text: 'Deze wet wordt aangehaald als: Wet melding zeggenschap en kapitaalbelang in effectenuitgevende instellingen.'
