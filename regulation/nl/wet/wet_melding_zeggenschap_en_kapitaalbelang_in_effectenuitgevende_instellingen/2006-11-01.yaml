        artikel: '19'
        hoofdstuk: '7'
  - number: '18'
    text: |-
      Indien een uitgevende instelling, op grond van een mededeling betreffende een melding als bedoeld in
      [artikel 17, vierde lid, tweede volzin, of vijfde lid, tweede volzin][ref1], vermoedt dat een onjuiste melding is
      gedaan, stelt zij Onze Minister daarvan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0020052#Artikel17
    url: https://wetten.overheid.nl/BWBR0020052/2006-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020052
        artikel: '17'
        hoofdstuk: '6'
  - number: '19'
    text: |-
      1 Onze Minister kan degene die een onjuiste melding heeft gedaan of ten onrechte geen melding heeft gedaan in de
      gelegenheid stellen alsnog een juiste melding te doen.

      2 Ter bevordering van de juistheid van het register, kan Onze Minister, onverminderd het derde lid, inlichtingen
      inwinnen of doen inwinnen bij:

      a. de meldingsplichtige, indien Onze Minister het redelijk vermoeden heeft dat deze een onjuiste melding heeft
      gedaan;

      b. effecteninstellingen, effectenbewaarbedrijven en houders van een effectenbeurs als bedoeld in de
      [Wet toezicht effectenverkeer 1995][ref1];

      c. de uitgevende instelling die aandelen heeft uitgegeven en waarop het kapitaalbelang of de stemmen van de
      meldingsplichtige betrekking hebben;

      d. de houder van een substantiële deelneming.

      3 Indien Onze Minister door toepassing van zijn bevoegdheden als bedoeld in het tweede lid het redelijk vermoeden
      heeft dat ten onrechte geen melding is gedaan, kan hij inlichtingen inwinnen of doen inwinnen bij degene van wie
      wordt vermoed dat deze meldingsplichtig is.

      4 Degene van wie de inlichtingen, bedoeld in het tweede en derde lid, worden verlangd, verstrekt deze binnen de
      door Onze Minister te stellen termijn.

      5 Ten aanzien van de personen die ingevolge het tweede en derde lid door Onze Minister zijn belast
      met het inwinnen of doen inwinnen van inlichtingen zijn de [artikelen 5:12][ref2], [5:13][ref3],
      [5:16][ref4] en [5:20 van de Algemene wet bestuursrecht][ref5] van overeenkomstige toepassing.
      Ten aanzien van de personen die ingevolge het tweede lid, onder a en b, en derde lid door Onze
      Minister zijn belast met het inwinnen of doen inwinnen van inlichtingen is, in aanvulling op
      de [eerste volzin, artikel 5:17 van de Algemene wet bestuursrecht][ref6] van overeenkomstige
      toepassing. Ten aanzien van de personen die ingevolge het tweede lid, onder b, door Onze
      Minister zijn belast met het inwinnen of doen inwinnen van inlichtingen is, in aanvulling op de
      [eerste en tweede volzin, artikel 5:15 van de Algemene wet bestuursrecht][ref7] van overeenkomstige toepassing.
      Indien een onderzoek als bedoeld in [artikel 22, eerste lid][ref8], wordt ingesteld, is degene bij wie het
      onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht staat, slechts gehouden tot het verlenen
      van inzage in zakelijke gegevens en bescheiden.

      6 Onze Minister kan de verwerking van een melding in het register voor de duur van het inwinnen of doen inwinnen
      van inlichtingen als bedoeld in het tweede en derde lid opschorten. Hij stelt de uitgevende instelling en de
      meldingsplichtige van een opschorting in kennis.

      7 De meldingsplichtige verstrekt desgevraagd aan Onze Minister, binnen een door de Minister te stellen termijn,
      nadere gegevens op grond waarvan de melding is gedaan.

      8 Indien een melding naar het oordeel van Onze Minister onjuist is en de melding is niet hersteld, of indien
      een melding ten onrechte niet is gedaan en de juiste melding blijft achterwege, kan Onze Minister de naar zijn
      oordeel juiste gegevens in het register opnemen, nadat hij daarvan aan de betrokken uitgevende instelling en de
      meldingsplichtige mededeling heeft gedaan.


