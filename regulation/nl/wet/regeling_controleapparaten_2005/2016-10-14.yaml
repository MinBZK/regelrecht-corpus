---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_controleapparaten_2005
regulatory_layer: WET
publication_date: '2019-04-23'
valid_from: '2016-10-14'
bwb_id: BWBR0018540
url: https://wetten.overheid.nl/BWBR0018540/2016-10-14
preamble:
  text: |-
    Gelet op artikel 9:2, eerste lid, van de Arbeidstijdenwet en artikel 2.4:12, aanhef en onderdelen f en g, en
    artikel 2.4:13, eerste lid, van het Arbeidstijdenbesluit vervoer;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel1
  - number: 1.a
    text: |-
      analoge tachograaf: hetgeen hieronder wordt verstaan in artikel 2, tweede lid, onder g, van verordening (EU) nr.
      165/2014;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel1
  - number: 1.b
    text: |-
      digitale tachograaf: hetgeen hieronder wordt verstaan in artikel 2, tweede lid, onder h, van verordening (EU) nr.
      165/2014;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel1
  - number: 1.c
    text: |-
      onderzoek: het op grond van [artikel 46, onderdeel a en b][ref1], verplichte onderzoek van het controleapparaat;


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel46
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '46'
        paragraaf: '9'
  - number: 1.d
    text: |-
      erkenninghouder: een installateur of een reparateur van controleapparaten die op grond van deze regeling als
      zodanig is erkend;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel1
  - number: 1.e
    text: |-
      installateur: natuurlijke persoon of rechtspersoon die bedrijfsmatig de installatie verzorgt van alsmede
      onderzoeken verricht aan controleapparaten;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel1
  - number: 1.f
    text: 'reparateur: natuurlijk persoon of rechtspersoon die bedrijfsmatig reparaties uitvoert aan controleapparaten;'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel1
  - number: 1.g
    text: 'importeur: door de fabrikant contractueel erkende importeur;'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel1
  - number: 1.h
    text: 'werkplaats: inrichting waarin een erkenninghouder de werkzaamheden als bedoeld in deze regeling mag verrichten;'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel1
  - number: 1.i
    text: 'inrichting: perceel of enkele kadastraal aangrenzende percelen waarop één of meer gebouwen zijn geplaatst;'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel1
  - number: 1.j
    text: |-
      mobiele installatie-eenheid: installatie-eenheid waarmee een erkenninghouder afwisselend in verscheidene
      werkplaatsen als installateur werkzaamheden als bedoeld in deze regeling mag verrichten.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel1
  - number: '2.1'
    text: |-
      Een goedkeuring van een controleapparaat of registratieblad wordt door de Dienst Wegverkeer verleend indien voldaan
      wordt aan het bepaalde bij of krachtens artikel 4, tweede tot en met vierde lid, 12, vierde tot en met zesde lid,
      en 17, eerste lid, van verordening (EU) nr. 165/2014.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel2
  - number: '2.2'
    text: |-
      De aanvraag tot goedkeuring van een controleapparaat of registratieblad wordt ingediend bij de Dienst Wegverkeer,
      waarbij alle op het controleapparaat en het registratieblad betrekking hebbende gegevens worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel2
  - number: '3.1'
    text: 'De Dienst Wegverkeer kan een erkenning verlenen als:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel3
  - number: 3.1.a
    text: installateur;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel3
  - number: 3.1.b
    text: reparateur.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel3
  - number: '3.2'
    text: 'In de erkenning wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel3
  - number: 3.2.a
    text: of het een erkenning als installateur, dan wel als reparateur betreft;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel3
  - number: 3.2.b
    text: naam en adres van de erkenninghouder;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel3
  - number: 3.2.c
    text: |-
      het adres van de werkplaats waar de met installatie, onderzoek en reparatie verband houdende werkzaamheden worden
      verricht;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel3
  - number: 3.2.d
    text: |-
      het ingevolge [artikel 7][ref1] toegekende verzegelnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel7
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '7'
        paragraaf: '3'
  - number: '3.3'
    text: |-
      In plaats van de gegevens van [artikel 3, tweede lid, onderdeel c][ref1], wordt in de erkenning als bedoeld in
      [artikel 4, tweede lid][ref2], vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018540#Artikel4
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018540
        artikel: '4'
        paragraaf: '3'
  - number: 3.3.a
    text: de naam van de persoon die de werkzaamheden verricht; en
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel3
  - number: 3.3.b
    text: het kenteken van het voertuig van waaruit de werkzaamheden worden verricht.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel3
  - number: '4.1'
    text: |-
      De Dienst Wegverkeer verleent een erkenning als installateur of reparateur aan de natuurlijke persoon of
      rechtspersoon voor een of meer in Nederland gevestigde werkplaatsen die elk voldoen aan de in [paragraaf 4][ref1]
      gestelde erkenningseisen voor de door hen gevoerde merken controleapparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018540
        paragraaf: '4'
  - number: '4.2'
    text: |-
      Dienst Wegverkeer verleent een erkenning als installateur aan de natuurlijke persoon of rechtspersoon voor een
      in Nederland werkzame mobiele installatie-eenheid die voldoet aan de eisen, gesteld in de [artikelen 9][ref1],
      [11][ref2], [12, eerste lid, onder a][ref3], [13][ref4] en [14][ref5] voor de door deze gevoerde merken
      controleapparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0018540#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0018540#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0018540#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0018540#Artikel14
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018540
        artikel: '11'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018540
        artikel: '12'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0018540
        artikel: '13'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0018540
        artikel: '14'
        paragraaf: '4'
  - number: '5.1'
    text: |-
      De aanvraag voor een erkenning wordt bij de Dienst Wegverkeer ingediend door middel van een volledig ingevuld en
      ondertekend aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel5
  - number: '5.2'
    text: 'De aanvrager van een erkenning overlegt tegelijk met het aanvraagformulier de volgende bescheiden:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel5
  - number: 5.2.a
    text: |-
      een niet ouder dan twee maanden zijnde met het oog op de uitoefening van de functie
      van installateur of reparateur verleende verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 5.2.b
    text: |-
      voor zover inschrijving in het handelsregister ingevolge de [Handelsregisterwet][ref1] verplicht is, een niet
      eerder dan één jaar vóór het tijdstip van indiening van de aanvraag door de Kamer van Koophandel, waarbij
      de aanvrager of een onderneming waarop de aanvraag betrekking heeft, is ingeschreven, verstrekt schriftelijk
      uittreksel, waaruit blijkt dat de aanvrager of de onderneming op het tijdstip van afgifte van dat geschrift was
      ingeschreven in het handelsregister;


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 5.2.c
    text: |-
      voor zover inschrijving in het handelsregister ingevolge [boek 2 van het Burgerlijk Wetboek][ref1] verplicht is
      of inschrijving in het handelsregister ingevolge [artikel 30, derde lid, van Boek 2 van genoemd wetboek][ref2] is
      geschied, een niet eerder dan één jaar vóór het tijdstip van indiening van de aanvraag door de Kamer van Koophandel
      waarbij de aanvrager is ingeschreven, verstrekte schriftelijke mededeling, waaruit blijkt dat de aanvrager op het
      tijdstip van afgifte van die afdruk of mededeling was ingeschreven in het handelsregister;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel30
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '30'
  - number: 5.2.d
    text: |-
      indien de aanvraag namens de aanvrager door een ander wordt ingediend, een gewaarmerkt afschrift van een geschrift
      waaruit blijkt dat die ander tot de vertegenwoordiging bevoegd is.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel5
  - number: '6.1'
    text: |-
      De Dienst Wegverkeer kent aan de erkenninghouder toegangscodes toe voor de melding van de installatie of het
      onderzoek, bedoeld in [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel36
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '36'
        paragraaf: '6'
  - number: '6.2'
    text: |-
      De Dienst Wegverkeer verstrekt op aanvraag aan een installateur die het diploma tachograaftechnicus overlegt
      een bevoegdheidspas en pincode ten behoeve van de melding van installatie of het onderzoek als bedoeld in
      [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel36
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '36'
        paragraaf: '6'
  - number: '6.3'
    text: De bevoegdheidspas, bedoeld in het tweede lid, heeft een geldigheidsduur van vier jaar.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel6
  - number: '6.4'
    text: |-
      De bevoegdheidspas wordt telkens met vier jaar verlengd als de houder van het diploma tachograaftechnicus het
      examen bevoegdheidsverlenging tachograaftechnicus met goed gevolg heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel6
  - number: '6.5'
    text: De Dienst Wegverkeer stelt het examen bevoegdheidsverlenging op, en neemt dit af.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel6
  - number: '6.6'
    text: |-
      Het examen bevoegdheidsverlenging tachograaftechnicus heeft betrekking op de onderwerpen, genoemd in
      [artikel 12, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel12
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '12'
        paragraaf: '4'
  - number: '7'
    text: 'De Dienst Wegverkeer kent een verzegelnummer toe aan:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel7
  - number: 7.a
    text: de erkenninghouder;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel7
  - number: 7.b
    text: |-
      de op grond van [artikel 8:1, tweede lid, van de Arbeidstijdenwet][ref1] aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel8
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '8'
  - number: '8'
    text: |-
      De aanvrager van een erkenning als installateur of reparateur beschikt over een werkplaats die verwarmd, overdekt,
      behoorlijk af te sluiten en goed verlicht is.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel8
  - number: '9.1'
    text: 'De aanvrager van een erkenning als installateur beschikt over:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: 9.1.a
    text: |-
      door de fabrikant of importeur van controleapparaten voorgeschreven dan wel door de Dienst Wegverkeer gelijkwaardig
      geachte wegdraaital-meetapparatuur geschikt voor zowel mechanische als elektronische controleapparaataandrijving;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: 9.1.b
    text: |-
      een door de fabrikant of importeur van controleapparaten voorgeschreven dan wel een door de Dienst Wegverkeer
      gelijkwaardig geachte impulsenteller ten behoeve van het afstellen van elektronisch aanpasbare controleapparaten;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: 9.1.c
    text: |-
      een door de Dienst Wegverkeer goedgekeurde rollentestbank of remmentestbank ten behoeve van het bepalen van het
      wegdraaital of het bepalen van de bandenomtrek dan wel een voor motorrijtuigen geschikte horizontale effen meetbaan
      van ten minste 20 meter lengte;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: 9.1.d
    text: een verzegelinrichting, geschikt voor de gevoerde merken controleapparaat;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: 9.1.e
    text: een bandenpomp met bandenluchtdrukmeetapparatuur;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: 9.1.f
    text: een doelmatige bandenprofieldieptemeter met verende stift en met een meetnauwkeurigheid van 0,1 mm;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: 9.1.g
    text: |-
      door de fabrikant of importeur van controleapparaten voorgeschreven dan wel door de Dienst Wegverkeer gelijkwaardig
      geachte testapparatuur voor snelheids- en afstandsmetingen alsmede voor de daarop betrekking hebbende registratie;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: 9.1.h
    text: |-
      overige, door de fabrikant of importeur van de gevoerde merken controleapparaat voorgeschreven dan wel door de
      Dienst Wegverkeer gelijkwaardig geachte gereedschappen, apparatuur, werkplaatshandboeken en documentatie;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: 9.1.i
    text: |-
      een afsluitbare kast, dan wel over een gelijkwaardige voorziening, waarin de in het eerste lid onder d genoemde
      verzegelinrichting en onder a, b en f genoemde testapparatuur kunnen worden opgeborgen.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: '9.2'
    text: |-
      De aanvrager van een erkenning als installateur voor een analoog controleapparaat beschikt in aanvulling op het
      eerste lid over:
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: 9.2.a
    text: apparatuur voorzien van een loep voor het onderzoeken van registratiebladen;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: 9.2.b
    text: een onderzoeksjablone, waarop de toegestane tolerantiegebieden staan aangegeven;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: '9.3'
    text: |-
      De apparatuur, genoemd in het eerste lid, onderdeel f, en het tweede lid, onderdelen a en b, is niet vereist voor
      werkplaatsen van fabrikanten of importeurs van motorrijtuigen, mits de installaties uitsluitend betrekking hebben
      op motorrijtuigen die voor de eerste maal in gebruik worden genomen.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: '9.4'
    text: De in dit artikel bedoelde apparatuur is deugdelijk en verkeert in goede staat.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel9
  - number: '10.1'
    text: 'De aanvrager van een erkenning als reparateur beschikt over:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel10
  - number: 10.1.a
    text: |-
      een door de fabrikant of importeur van controleapparaten voorgeschreven dan wel een door de Dienst Wegverkeer
      gelijkwaardig geachte impulsenteller ten behoeve van het afstellen van elektronisch aanpasbare controleapparaten;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel10
  - number: 10.1.b
    text: |-
      door de fabrikant of importeur van controleapparaten voorgeschreven dan wel door de Dienst Wegverkeer gelijkwaardig
      geachte testapparatuur voor snelheids- en afstandsmetingen alsmede voor de daarop betrekking hebbende registratie;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel10
  - number: 10.1.c
    text: een verzegelinrichting welke geschikt is voor de gevoerde merken controleapparaat;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel10
  - number: 10.1.d
    text: |-
      overige, door de fabrikant of importeur van de gevoerde merken controleapparaat voorgeschreven dan wel door de
      Dienst Wegverkeer gelijkwaardig geachte gereedschappen, apparatuur, werkplaatshandboeken en documentatie.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel10
  - number: '10.2'
    text: |-
      De aanvrager van een erkenning als reparateur voor een analoog controleapparaat beschikt in aanvulling op het
      eerste lid over:
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel10
  - number: 10.2.a
    text: apparatuur voorzien van een loep voor het onderzoeken van registratiebladen;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel10
  - number: 10.2.b
    text: een onderzoekssjablone, waarop de toegestane tolerantiegebieden staan aangegeven.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel10
  - number: '10.3'
    text: De in dit artikel bedoelde apparatuur is deugdelijk en verkeert in goede staat.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel10
  - number: '11.1'
    text: |-
      De aanvrager van een erkenning als installateur of reparateur beschikt over een register, waarin de gegevens als
      bedoeld in de [artikelen 30][ref1] en [31][ref2] kunnen worden opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0018540#Artikel31
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '30'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0018540
        artikel: '31'
        paragraaf: '6'
  - number: '11.2'
    text: |-
      De aanvrager van een erkenning als installateur of reparateur van digitale controleapparaten kan door tussenkomst
      van de fabrikant of importeur van het digitale controleapparaat beschikken over een certificaat van onmogelijkheid
      van gegevensoverdracht, waarop de gegevens als bedoeld in [artikel 34, zesde lid][ref1], zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel34
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '34'
        paragraaf: '6'
  - number: '12.1'
    text: 'De aanvrager van een erkenning als:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: 12.1.a
    text: |-
      installateur, dan wel het personeel dat door hem is aangewezen voor installatie en onderzoek van controleapparaten,
      beschikt over het diploma tachograaftechnicus,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: 12.1.b
    text: |-
      reparateur, dan wel het personeel dat door hem is aangewezen voor reparatie van controleapparaten, beschikt over
      het diploma tachograaftechnicus, met betrekking tot de door de erkenninghouder te voeren merken controleapparaten.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: '12.2'
    text: 'De Dienst Wegverkeer:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: 12.2.a
    text: stelt examens op ter verkrijging van het diploma, bedoeld in het eerste lid, en neemt deze af, en
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: 12.2.b
    text: |-
      verstrekt, indien het examen door de geëxamineerde met goed gevolg is afgelegd, het diploma, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: '12.3'
    text: 'Het examen voor diploma tachograaftechnicus heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: 12.3.a
    text: het installeren, kalibreren, repareren en functioneren van controleapparaten,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: 12.3.b
    text: |-
      het functioneren van motorrijtuigen en van snelheidsbegrenzers met betrekking tot de aspecten die van belang zijn
      bij de installatie en het onderzoek van controleapparaten, en
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: 12.3.c
    text: |-
      de wettelijke voorschriften ten aanzien van controleapparaten, alsmede van snelheidsbegrenzers, voor zover van
      belang voor de installatie en het onderzoek van controleapparaten.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: '12.4'
    text: |-
      Alvorens het examen ter verkrijging van het diploma, bedoeld in het eerste lid, wordt afgenomen, toont de aspirant
      geëxamineerde aan dat hij een cursus heeft doorlopen met betrekking tot de onderwerpen, genoemd in het derde lid.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: '12.5'
    text: |-
      Cursussen als bedoeld in het vierde lid zijn georganiseerd door fabrikanten of importeurs en kunnen tevens worden
      georganiseerd door de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel12
  - number: '13.1'
    text: |-
      De aanvrager van de erkenning als installateur of reparateur meldt bij de Dienst Wegverkeer de personen, bedoeld in
      [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel12
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '12'
        paragraaf: '4'
  - number: '13.2'
    text: |-
      Op het diploma, bedoeld in [artikel 12, eerste lid][ref1], is tenminste vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel12
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '12'
        paragraaf: '4'
  - number: 13.2.a
    text: datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel13
  - number: 13.2.b
    text: de merken en typen controleapparaat waarop het diploma betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel13
  - number: 13.2.c
    text: de naam van de gediplomeerde;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel13
  - number: 13.2.d
    text: uniek volgnummer, indien het diploma betrekking heeft op een digitaal controleapparaat.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel13
  - number: '14.1'
    text: |-
      De aanvrager van een erkenning als installateur beschikt over een voorziening voor het door middel van
      datacommunicatie melden van de installatie en het onderzoek aan de Dienst Wegverkeer. Deze voorziening moet
      geschikt zijn voor de toegangsstructuur van een door de Dienst Wegverkeer geaccepteerd netwerk.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel14
  - number: '14.2'
    text: |-
      Het in het eerste lid bepaalde geldt niet voor fabrikanten of importeurs van motorrijtuigen, mits deze zich
      uitsluitend beperken tot het installeren van controleapparaten in motorrijtuigen die voor de eerste maal in gebruik
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel14
  - number: '15.1'
    text: |-
      Behoudens in geval van een erkenning als bedoeld in [artikel 4, tweede lid][ref1], worden de met de installatie,
      het onderzoek en de reparatie verband houdende werkzaamheden slechts verricht in de werkplaats die in de erkenning
      is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel4
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '4'
        paragraaf: '3'
  - number: '15.2'
    text: |-
      In geval van een erkenning als bedoeld in [artikel 4, tweede lid][ref1], worden de met de installatie en het
      onderzoek verband houdende werkzaamheden slechts verricht in een werkplaats van een erkenninghouder waarvan de
      erkenning niet is geschorst of is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel4
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '4'
        paragraaf: '3'
  - number: '16.1'
    text: |-
      Behoudens in geval van een erkenning als bedoeld in [artikel 4, tweede lid][ref1], is vanaf de buitenkant van
      elke werkplaats waarvoor de erkenning geldt, op een door de Dienst Wegverkeer vastgestelde en in de Staatscourant
      bekendgemaakte wijze zichtbaar dat een erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel4
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '4'
        paragraaf: '3'
  - number: '16.2'
    text: |-
      In elke werkplaats of mobiele installatie-eenheid waarvoor de erkenning geldt, is het door de Dienst Wegverkeer
      afgegeven bewijs aanwezig waaruit blijkt dat voor de werkplaats een erkenning is verleend en voor welke merken
      controleapparaten de erkenning geldt.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel16
  - number: '16.3'
    text: |-
      In elke werkplaats of mobiele installatie-eenheid is het diploma aanwezig, bedoeld in
      [artikel 12, eerste lid][ref1], van de erkenninghouder dan wel het door hem voor installatie, onderzoek en
      reparatie aangewezen personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel12
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '12'
        paragraaf: '4'
  - number: '16.4'
    text: Op verzoek van de Dienst Wegverkeer of belanghebbende wordt het diploma of de bevoegdheidspas getoond.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel16
  - number: '17.1'
    text: De ten behoeve van de erkenning aanwezige apparatuur is deugdelijk en verkeert in goede staat van onderhoud.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel17
  - number: '17.2'
    text: |-
      Aan de eisen in het eerste lid is in ieder geval voldaan indien de in deze regeling genoemde testapparatuur
      als bedoeld in [artikel 9, eerste lid, onderdelen a, b, c en f, tweede lid, onderdelen a en b][ref1] en
      [artikel 10, eerste lid, onderdelen a en b][ref2], werken binnen de toleranties die voor het controleapparaat op
      grond van verordening (EU) nr. 165/2014 zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0018540#Artikel10
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018540
        artikel: '10'
        paragraaf: '4'
  - number: '17.3'
    text: |-
      Als een daartoe geschikte proefbank, bedoeld in verordening (EU) nr. 165/2014 wordt aangemerkt een aangepaste
      rollentestbank, een aangepaste remmentestbank of een meetbaan.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel17
  - number: '18.1'
    text: |-
      De erkenninghouder draagt er zorg voor dat de bij hem in gebruik zijnde verzegelinrichting, werkplaatskaarten
      alsmede de aan hem verstrekte toegangscodes niet toegankelijk zijn voor onbevoegden.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel18
  - number: '18.2'
    text: |-
      De houder van de werkplaatskaart en erkenninghouder dragen er zorg voor dat de werkplaatskaart met bijbehorende
      pincode niet toegankelijk is voor andere personen dan voor de houder van de werkplaatskaart.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel18
  - number: '19.1'
    text: |-
      Behoudens de erkenninghouder als bedoeld in [artikel 4, tweede lid][ref1], voldoet de erkenninghouder als
      installateur voldoet voortdurend aan de eisen, gesteld in de [artikelen 8][ref2], [9][ref3] en [11][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018540#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0018540#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0018540#Artikel11
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018540
        artikel: '8'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018540
        artikel: '9'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0018540
        artikel: '11'
        paragraaf: '4'
  - number: '19.2'
    text: |-
      De erkenninghouder als reparateur voldoet voortdurend aan de eisen, gesteld in de [artikelen 8][ref1], [10][ref2]
      en [11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018540#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0018540#Artikel11
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '8'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018540
        artikel: '10'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018540
        artikel: '11'
        paragraaf: '4'
  - number: '19.3'
    text: |-
      De erkenninghouder als bedoeld in [artikel 4, tweede lid][ref1], voldoet voortdurend aan de eisen, gesteld in de
      [artikelen 9][ref2] en [11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018540#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0018540#Artikel11
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018540
        artikel: '9'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018540
        artikel: '11'
        paragraaf: '4'
  - number: '20'
    text: |-
      De erkenninghouder zorgt ervoor dat installaties, onderzoeken en reparaties slechts worden uitgevoerd door de in
      [artikel 12, eerste lid][ref1], bedoelde personen, bevoegd voor het desbetreffende merk en type controleapparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel12
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '12'
        paragraaf: '4'
  - number: '21'
    text: |-
      Onverminderd het bepaalde in [artikel 12][ref1] beschikt de erkenninghouder dan wel het door hem aangewezen
      personeel aantoonbaar over actuele kennis en documentatie vanuit de fabrikant omtrent de in het kader van de
      erkenning te voeren merken en typen controleapparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel12
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '12'
        paragraaf: '4'
  - number: '22'
    text: |-
      De erkenninghouder meldt bij de Dienst Wegverkeer wijzigingen van of aanvullingen op de reeds in
      [artikel 12, eerste en tweede lid][ref1], vermelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel12
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '12'
        paragraaf: '4'
  - number: '23'
    text: |-
      Indien zich een wijziging voordoet van de natuurlijke persoon of de rechtspersoon als bedoeld in
      [artikel 4, eerste en tweede lid][ref1], zijn zowel de natuurlijke persoon of rechtspersoon aan wie de erkenning
      oorspronkelijk was verleend als degene die de bedrijfsvoering voortzet, verplicht de Dienst Wegverkeer hiervan zo
      spoedig mogelijk schriftelijk in kennis te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel4
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '4'
        paragraaf: '3'
  - number: '24'
    text: |-
      Het controleapparaat wordt geïnstalleerd met inachtneming van de instructies van de fabrikant of importeur met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel24
  - number: 24.a
    text: het desbetreffende merk controleapparaat;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel24
  - number: 24.b
    text: |-
      het functioneren van snelheidsbegrenzers met betrekking tot aspecten die van belang zijn bij de installatie en het
      onderzoek van controleapparaten;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel24
  - number: 24.c
    text: |-
      het functioneren van motorrijtuigen met betrekking tot aspecten die van belang zijn bij de installatie en het
      onderzoek van controleapparaten.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel24
  - number: '25'
    text: |-
      De houder van een werkplaatskaart plaatst bij alle werkzaamheden als bedoeld in deze regeling zijn werkplaatskaart
      direct in het digitale controleapparaat.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel25
  - number: '26'
    text: |-
      Bij nieuwe voertuigen wordt het digitale controleapparaat uiterlijk geactiveerd en geïnstalleerd op het tijdstip
      dat het voertuig voor het eerst in gebruik wordt genomen.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel26
  - number: '27.1'
    text: |-
      Voorafgaand aan het onderzoek wordt beoordeeld of de tachograafinstallatie is gemanipuleerd sinds het laatste
      onderzoek dat op de installatieplaat is vermeld.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: '27.2'
    text: 'De beoordeling bestaat uit de volgende handelingen:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.2.a
    text: controle parameters tachograaf met de installatieplaat;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.2.b
    text: controle op verbroken verzegelingen;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.2.c
    text: controle op beschadigingen van de installatie die de integriteit in twijfel trekken;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.2.d
    text: controle op aanwezige voorvallen en fouten in de tachograaf die duiden op manipulatie; en
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.2.e
    text: toepassen van de externe kabelprocedure om manipulatieapparatuur detecteren.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: '27.3'
    text: Van elke beoordeling wordt een registratie bijgehouden.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: '27.4'
    text: |-
      Vaststelling van manipulatie wordt aan de Dienst Wegverkeer gemeld overeenkomstig een door deze Dienst vastgesteld
      model.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: '27.5'
    text: 'Bij het onderzoek wordt een testregistratie gemaakt met ten minste de registraties van:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.5.a
    text: de snelheid, in ten minste drie stappen;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.5.b
    text: de snelheid bij maximum snelheidsbereik;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.5.c
    text: de werktijd, rijtijd en rusttijd;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.5.d
    text: de afgelegde weg;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.5.e
    text: de werking van de schrijfstiftgeleiding.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: '27.6'
    text: 'De in het vijfde lid bedoelde testregistratie wordt uitgevoerd met behulp van:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.6.a
    text: |-
      een voor het desbetreffende controleapparaat goedgekeurd registratieblad indien het een analoog controleapparaat
      betreft; of
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: 27.6.b
    text: een visuele controle op snelheid indien het een digitaal controleapparaat betreft.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: '27.7'
    text: |-
      Met behulp van een leesapparaat, voorzien van een loep en een onderzoekssjabloon, wordt beoordeeld of de
      testregistraties op het testregistratieblad de maximaal toelaatbare fouten, genoemd in hoofdstuk III, onder f) 1
      en 2 van bijlage I van verordening (EU) nr. 165/2014 niet overschrijden, indien het een analoog controleapparaat
      betreft.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel27
  - number: '28.1'
    text: |-
      De verzegeling op het mechanisme van het controleapparaat wordt slechts door een fabrikant van controleapparaten of
      een reparateur aangebracht.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel28
  - number: '28.2'
    text: |-
      De verzegeling van de bewegingssensor aan het voertuig met het aan de erkenninghouder toegekende verzegelnummer
      volstaat indien het een controleapparaat betreft dat met encryptisch gecodeerde signalen werkt.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel28
  - number: '28.3'
    text: |-
      In geval van verbreking in het belang van toezicht op de naleving door de op grond van
      [artikel 8:1, tweede lid, van de Arbeidstijdenwet][ref1] aangewezen ambtenaren wordt door de betreffende ambtenaar
      een nieuwe verzegeling aangebracht op de plaatsen waar deze verbroken is.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel8
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '8'
  - number: '28.4'
    text: 'Verbreking als bedoeld in het derde lid vindt slechts plaats ter controle van:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel28
  - number: 28.4.a
    text: de juiste instelling van de apparaatconstante van het controleapparaat;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel28
  - number: 28.4.b
    text: de juiste aansturing van de snelheidsbegrenzer;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel28
  - number: 28.4.c
    text: de aanwezigheid van voorzieningen waarmee de juiste werking van het controleapparaat kan worden beïnvloed;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel28
  - number: 28.4.d
    text: |-
      de aanwezigheid van voorzieningen waarmee de juiste werking van de snelheidsbegrenzer kan worden beïnvloed, indien
      het snelheidssignaal ten behoeve van de snelheidsbegrenzer afkomstig is van het controleapparaat.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel28
  - number: '28.5'
    text: |-
      Van de verzegeling als bedoeld in het derde lid, wordt aan de bestuurder een schriftelijke kennisgeving,
      gewaarmerkt door de betreffende ambtenaar en voorzien van het in [artikel 7, onderdeel b][ref1], bedoelde
      verzegelnummer, uitgereikt met de reden waarom de verzegeling werd verbroken.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel7
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '7'
        paragraaf: '3'
  - number: '29'
    text: |-
      Na het onderzoek wordt een korte rijproef uitgevoerd, waarbij het in [artikel 25, tweede lid][ref1], bedoelde
      testregistratieblad dan wel de werkplaatskaart in het controleapparaat aanwezig is, opdat vastgesteld kan worden
      dat het controleapparaat functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel25
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '25'
        paragraaf: '6'
  - number: '30.1'
    text: |-
      Van iedere installatie en ieder onderzoek worden de volgende gegevens in het register als bedoeld in
      [artikel 11][ref1] vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel11
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '11'
        paragraaf: '4'
  - number: 30.1.a
    text: 'met betrekking tot de installateur:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.a.1°
    text: de naam en het adres van de installateur,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.a.2°
    text: de naam van de persoon die de installatie of het onderzoek heeft verricht,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.a.3°
    text: werkplaatskaartnummer, indien het een digitaal controleapparaat betreft;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.b
    text: 'met betrekking tot het motorrijtuig:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.b.1°
    text: het kenteken of indien het motorrijtuig nog niet is voorzien van een kenteken, het identificatienummer,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.b.2°
    text: merk en type,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.b.3°
    text: de kilometerstand,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.b.4°
    text: de effectieve omtrek van de wielbanden wielen in mm,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.b.5°
    text: de ongecorrigeerde kenmerkende coëfficiënt van het motorrijtuig in omw/km of imp/km,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.b.6°
    text: 'indien het een digitaal controleapparaat betreft:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.b.6°.i
    text: de bandenmaat,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.b.6°.ii
    text: de instelling van de snelheidsbegrenzer;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.c
    text: 'met betrekking tot de installatie:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.c.1°
    text: |-
      de ongecorrigeerde kenmerkende coëfficiënt in omw/km of imp/km of in geval van een aanpasbaar controleapparaat de
      ingestelde apparaatconstante in imp/km,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.c.2°
    text: het merk, type en serienummer van het controleapparaat;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.d
    text: 'met betrekking tot de uitgevoerde werkzaamheden:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.d.1°
    text: de datum en tijd van de installatie of het onderzoek,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.d.2°
    text: de ondertekening door de in onderdeel a, onder 2°, bedoelde persoon,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.1.d.3°
    text: doel van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: '30.2'
    text: |-
      Het eerste lid geldt niet voor fabrikanten of importeurs van motorrijtuigen, mits deze zich uitsluitend beperken
      tot het installeren van controleapparaten in motorrijtuigen die voor de eerste maal in gebruik worden genomen.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: '30.3'
    text: |-
      Bij het register als bedoeld in [artikel 11][ref1] wordt gevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel11
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '11'
        paragraaf: '4'
  - number: 30.3.a
    text: het bij de installatie of het onderzoek van een analoog controleapparaat gebruikte testregistratieblad;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.3.b
    text: |-
      het bij de reparatie van een analoog controleapparaat gebruikte testregistratieblad dan wel een afschrift van dat
      testregistratieblad, mits dit blad de in [artikel 27][ref1] bedoelde registraties bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel27
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '27'
        paragraaf: '6'
  - number: 30.3.c
    text: |-
      het bij de installatie of het onderzoek van een digitaal controleapparaat gemaakt afdruk of opgeslagen document met
      de testresultaten;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: 30.3.d
    text: |-
      het bij de reparatie van een digitaal controleapparaat gemaakte gemaakt afdruk of opgeslagen document met de
      testresultaten.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel30
  - number: '31'
    text: |-
      Van iedere reparatie worden de volgende gegevens in het in [artikel 11][ref1] bedoelde register vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel11
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '11'
        paragraaf: '4'
  - number: 31.a
    text: de naam en het adres van de reparateur;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel31
  - number: 31.b
    text: de naam van de persoon die de reparatie heeft uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel31
  - number: 31.c
    text: merk, type en serienummer van het controleapparaat;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel31
  - number: 31.d
    text: de aard van de reparatie;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel31
  - number: 31.e
    text: de datum en tijd van de reparatie;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel31
  - number: 31.f
    text: |-
      de ondertekening door de in onderdeel b bedoelde persoon indien het de reparatie van een analoog controleapparaat
      betreft.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel31
  - number: 31a
    text: |-
      Waar in deze paragraaf en in [paragraaf 7][ref1] sprake is van onderzoek, wordt hieronder mede verstaan de aan het
      onderzoek voorafgaande beoordeling, bedoeld in [artikel 27][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Paragraaf7
      [ref2]: https://wetten.overheid.nl/BWBR0018540#Artikel27
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0018540
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0018540
        artikel: '27'
        paragraaf: '6'
  - number: '32'
    text: |-
      De erkenninghouder bewaart de gegevens in het register gedurende ten minste drie jaar vanaf het tijdstip van
      installatie, onderzoek of reparatie.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel32
  - number: '33.1'
    text: |-
      De erkenninghouder en de houder van een werkplaatskaart dragen er zorg voor dat op de werkplaatskaart opgeslagen
      kalibreringsgegevens, regelmatig wordt overgebracht naar een computer om te voorkomen dat reeds opgeslagen
      kalibreringsgegevens worden overschreven of op andere wijze verloren gaan.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel33
  - number: '33.2'
    text: Bij de gegevensoverdracht als bedoeld in het eerste lid mogen geen wijzigingen worden aangebracht in de gegevens.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel33
  - number: '34.1'
    text: |-
      Indien een erkenninghouder een digitaal controleapparaat buiten bedrijf stelt of in een ander motorrijtuig
      installeert, stelt hij, voor zover dit mogelijk is, alle gegevens uit het apparaat veilig.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: '34.2'
    text: |-
      De erkenninghouder moet de in het eerste lid bedoelde gegevens ten minste 52 weken bewaren vanaf de datum van
      gegevensoverdracht.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: '34.3'
    text: In de in het eerste en tweede lid bedoelde gegevens mogen geen wijzigingen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: '34.4'
    text: |-
      De in het eerste bedoelde gegevens worden op zodanige wijze bewaard, dat zij niet toegankelijk zijn voor
      onbevoegden.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: '34.5'
    text: |-
      Op schriftelijk verzoek van de werkgever of de persoon als bedoeld in
      [artikel 2:7, eerste lid, van de Arbeidstijdenwet][ref1] verstrekt de erkenninghouder aan hem de gegevens uit een
      digitaal controleapparaat die dat bedrijf betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel2
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '2'
  - number: '34.6'
    text: |-
      In geval van onmogelijkheid van gegevensoverdracht bevat het door de erkenninghouder af te geven certificaat van
      onmogelijkheid van gegevensoverdracht in ieder geval de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.a
    text: 'met betrekking tot de erkenninghouder:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.a.1°
    text: de naam en het adres,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.a.2°
    text: het nummer van de erkenninghouder,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.b
    text: 'met betrekking tot de installateur of reparateur die het onderzoek heeft verricht:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.b.1°
    text: de naam,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.b.2°
    text: het nummer van de werkplaatskaart,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.b.3°
    text: de handtekening;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.c
    text: 'met betrekking tot het motorrijtuig:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.c.1°
    text: het kenteken,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.c.2°
    text: het identificatienummer,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.c.3°
    text: het merk en het type;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.d
    text: 'met betrekking tot het digitale controleapparaat:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.d.1°
    text: de fabrikant,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.d.2°
    text: het type en serienummer van het digitale controleapparaat,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.d.3°
    text: de datum van fabricage,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.d.4°
    text: de plaats in de cabine van het motorrijtuig,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.d.5°
    text: het keurmerk van de typegoedkeuring,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.d.6°
    text: de zichtbaarheid van het installatieplaatje;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.e
    text: |-
      met betrekking tot de werkgever of de persoon als bedoeld in
      [artikel 2:7, eerste lid, van de Arbeidstijdenwet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel2
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '2'
  - number: 34.6.e.1°
    text: de bedrijfsnaam,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.e.2°
    text: het adres,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.e.3°
    text: het nummer van de bedrijfskaart;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.f
    text: 'met betrekking tot het certificaat van onmogelijkheid van gegevensoverdracht:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.f.1°
    text: de datum en plaats van afgifte,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.f.2°
    text: het door de Dienst Wegverkeer verstrekte certificaatnummer,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.f.3°
    text: verklaring van onmogelijkheid van gegevensoverdracht,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.6.f.4°
    text: het antwoord op de vraag of het maken van een afdruk uit het controleapparaat nog mogelijk is.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: '34.7'
    text: 'Bij het certificaat van onmogelijkheid van gegevensoverdracht wordt als bijlage gevoegd:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.7.a
    text: bij positieve beantwoording van de vraag als bedoeld in het zesde lid, onderdeel f, onder 4º, de gemaakte afdruk;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: 34.7.b
    text: het schriftelijk verzoek als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
  - number: '34.8'
    text: |-
      De Dienst Wegverkeer verstrekt op verzoek van de erkenninghouder ten behoeve van een af te geven certificaat van
      onmogelijkheid van gegevensoverdracht een uniek certificaatnummer. De erkenninghouder levert hiertoe de door de
      Dienst Wegverkeer te bepalen gegevens aan, die de Dienst Wegverkeer registreert. De gegevens in het register worden
      op verzoek van ambtenaren, aangewezen op grond van [artikel 8:1, tweede lid, van de Arbeidstijdenwet][ref1], aan
      die ambtenaren door de Dienst Wegverkeer beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel8
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '8'
  - number: '34.9'
    text: |-
      Op schriftelijk verzoek van de op grond van [artikel 8:1, tweede lid, van de Arbeidstijdenwet][ref1] aangewezen
      ambtenaren verstrekt de erkenninghouder aan hem alle gegevens betreffende een bepaald bedrijf uit een digitaal
      controleapparaat dat buiten bedrijf is gesteld of in een ander motorrijtuig is geïnstalleerd dan wel het ten
      behoeve van dat apparaat en bedrijf afgegeven certificaat van onmogelijkheid van gegevensoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel8
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '8'
  - number: '35'
    text: |-
      De erkenninghouder en de houder van een werkplaatskaart dragen er zorg voor dat alle verzamelde gegevens, verkregen
      bij het installeren, onderzoeken of repareren van digitale controleapparaten juist en volledig zijn opgeslagen en
      zodanig zijn geordend dat deze eenvoudig door de Dienst Wegverkeer zijn te raadplegen.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel35
  - number: '36.1'
    text: |-
      Na de installatie of het onderzoek van het controleapparaat worden door middel van datacommunicatie de volgende
      gegevens aan de Dienst Wegverkeer gemeld:
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel36
  - number: 36.1.a
    text: de toegangscodes,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel36
  - number: 36.1.b
    text: |-
      Pasnummer en pincode als bedoeld in [artikel 6, tweede lid][ref1], van de erkenninghouder dan wel het door hem
      aangewezen personeel,


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel6
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '6'
        paragraaf: '3'
  - number: 36.1.c
    text: het kenteken en de meldcode, gevormd door de laatste vier cijfers van het identificatienummer,
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel36
  - number: 36.1.d
    text: merk en serienummer en ingestelde apparaatconstante van het controleapparaat.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel36
  - number: '36.2'
    text: |-
      In afwijking van het eerste lid, onderdeel c, wordt, indien het motorrijtuig nog niet is voorzien van een kenteken
      het volledige identificatienummer gemeld.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel36
  - number: '36.3'
    text: |-
      Onverminderd het eerste lid wordt bij een melding door een erkenninghouder als bedoeld in
      [artikel 4, tweede lid][ref1], het adres met postcode van de werkplaats waar de installatie of het onderzoek is
      verricht, gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel4
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '4'
        paragraaf: '3'
  - number: '36.4'
    text: |-
      De in het eerste lid genoemde meldingsplicht geldt niet voor fabrikanten of importeurs van motorrijtuigen, voor
      zover het de installatie betreft in motorrijtuigen die voor de eerste maal in gebruik worden genomen.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel36
  - number: '36.5'
    text: De door de Dienst Wegverkeer gegeven aanwijzingen met betrekking tot de melding worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel36
  - number: '37'
    text: |-
      Nadat is vastgesteld dat alle verzegelingen als bedoeld in hoofdstuk V, paragraaf 4, van bijlage I van verordening
      (EU) nr. 165/2014 aanwezig zijn, wordt in de bestuurdersruimte op het controleapparaat overeenkomstig [verordening
      (EEG) nr. 3821/85](31985R3821) op onuitwisbare wijze een installatieplaatje aangebracht.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel37
  - number: '38'
    text: |-
      Het in [artikel 37][ref1] bedoelde installatieplaatje wordt niet eerder aangebracht dan nadat is vastgesteld dat
      het controleapparaat goed is afgesteld en verzegeld en door de Dienst Wegverkeer is medegedeeld dat:


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel37
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '37'
        paragraaf: '6'
  - number: 38.a
    text: |-
      de in [artikel 36][ref1] bedoelde melding niet leidt tot een steekproefsgewijze controle van de installatie of het
      onderzoek door de Dienst Wegverkeer; of


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel36
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '36'
        paragraaf: '6'
  - number: 38.b
    text: |-
      de melding leidt tot een steekproefsgewijze controle van de installatie of het onderzoek, doch deze controle niet
      binnen 90 minuten na de melding wordt begonnen; dan wel
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel38
  - number: 38.c
    text: |-
      de melding leidt tot een steekproefsgewijze controle van de installatie of het onderzoek en deze controle heeft
      geleid tot een goedkeuring van de betreffende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel38
  - number: '39.1'
    text: |-
      Nadat een erkenning is verleent verricht de Dienst Wegverkeer ten minste één keer per 2 jaar een herschouwing op de
      werkplaats of de mobiele installatie-eenheid van de erkenninghouder.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel39
  - number: '39.2'
    text: |-
      De Dienst Wegverkeer voert tenminste eenmaal per jaar op ten minste 5% van de landelijk verrichte installaties en
      onderzoeken een controle uit.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel39
  - number: '40.1'
    text: |-
      In het kader van het toezicht op de erkenninghouder, bedoeld in
      [artikel 9:1, tweede lid, van de Arbeidstijdenwet][ref1], wordt door de Dienst Wegverkeer ten aanzien van het
      bepaalde in [paragraaf 6][ref2] een systeem van bonus- en strafpunten voor de erkenninghouder vastgesteld, dat
      bekend wordt gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0018540#Paragraaf6
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0018540
        paragraaf: '6'
  - number: '40.2'
    text: |-
      Aan de hand van het systeem als bedoeld in het eerste lid kan worden vastgesteld of het toezicht wordt verminderd,
      het toezicht wordt verscherpt dan wel dat de erkenning wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel40
  - number: '40.3'
    text: |-
      Indien als gevolg van een wijziging als bedoeld in [artikel 23][ref1] de bedrijfsvoering van het reeds erkende
      bedrijf wordt voortgezet door een andere natuurlijke persoon of rechtspersoon, worden de opgelegde sancties alsmede
      de toegekende bonus- en strafpunten van het systeem als bedoeld in het tweede lid beschouwd als te zijn toegekend
      aan deze natuurlijke persoon of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel23
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '23'
        paragraaf: '5'
  - number: '41'
    text: |-
      De erkenninghouder mag in de staat van een motorrijtuig dat aan een controle als bedoeld in
      [artikel 39, tweede lid][ref1], zal worden onderworpen, gedurende een periode van 90 minuten na het tijdstip van
      melding van de installatie of het onderzoek geen wijziging aanbrengen of laten aanbrengen en mag met betrekking tot
      het voertuig geen metingen verrichten of laten verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel39
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '39'
        paragraaf: '7'
  - number: '42.1'
    text: |-
      De erkenninghouder verleent alle medewerking aan de in [artikel 39, eerste en tweede lid,][ref1] bedoelde
      handelingen en de terzake door de Dienst Wegverkeer gegeven aanwijzingen worden in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel39
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '39'
        paragraaf: '7'
  - number: '42.2'
    text: |-
      Onder alle medewerking wordt in het kader van de in [artikel 39, tweede lid][ref1], bedoelde handelingen in ieder
      geval verstaan dat:


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel39
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '39'
        paragraaf: '7'
  - number: 42.2.a
    text: |-
      degene die de installatie of het onderzoek heeft verricht aanwezig gedurende de hele steekproef aanwezig is en zelf
      feitelijk assistentie verleent, zonodig met behulp van zijn werkplaatskaart, bij het uitvoeren van de steekproef;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel42
  - number: 42.2.b
    text: |-
      indien de installatie of het onderzoek is verricht door een mobiele installatie-eenheid tevens het voertuig,
      van waaruit door de mobiele installatie-eenheid de installaties of onderzoeken zijn verricht, bij de steekproef
      aanwezig is;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel42
  - number: 42.2.c
    text: |-
      het voertuig, ongeacht het tijdstip van aanvang van de steekproef, niet uit de werkplaats wordt verwijderd
      gedurende de steekproef;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel42
  - number: 42.2.d
    text: de desbetreffende ruimte en apparatuur gedurende de steekproef beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel42
  - number: '43.1'
    text: |-
      De Dienst Wegverkeer trekt een erkenning geheel of gedeeltelijk in, indien degene aan wie de erkenning is verleend,
      daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel43
  - number: '43.2'
    text: |-
      De Dienst Wegverkeer kan een erkenning geheel of gedeeltelijk intrekken indien degene aan wie de erkenning is
      verleend:
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel43
  - number: 43.2.a
    text: |-
      niet meer voldoet aan de erkenningseisen, neergelegd in [paragraaf 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018540
        paragraaf: '4'
  - number: 43.2.b
    text: |-
      in strijd handelt met de erkenningsvoorschriften, neergelegd in [paragraaf 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018540
        paragraaf: '5'
  - number: 43.2.c
    text: |-
      in strijd met de voorschriften, neergelegd in [paragraaf 6][ref1], een installatie, onderzoek of reparatie
      verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Paragraaf6
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018540
        paragraaf: '6'
  - number: 43.2.d
    text: |-
      de verplichtingen, neergelegd in [paragraaf 7][ref1], niet nakomt


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Paragraaf7
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018540
        paragraaf: '7'
  - number: 43.2.e
    text: |-
      het aan het toezicht verbonden tarief als bedoeld in [artikel 12:2, derde lid, van de Arbeidstijdenwet][ref1] niet
      voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel12
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '12'
  - number: '43.3'
    text: |-
      De Dienst Wegverkeer kan de aan een erkenning verbonden voorschriften wijzigen indien gewijzigde inzichten dan wel
      ontwikkelingen in de techniek zulks noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel43
  - number: '44.1'
    text: |-
      Indien er sprake is van een situatie waarin aan een of meer erkenningseisen of erkenningsvoorschriften of algemene
      erkenningsvoorschriften niet wordt voldaan, terwijl de situatie op korte termijn kan worden hersteld, kan, in
      plaats van intrekking of wijziging van de erkenning, overgegaan worden tot schorsing van de erkenning voor een
      termijn van ten hoogste 12 weken.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel44
  - number: '44.2'
    text: |-
      Wordt binnen de in het eerste lid genoemde termijn niet aangetoond dat wederom aan de erkenningseisen of algemene
      erkenningsvoorschriften wordt voldaan, dan volgt alsnog intrekking of wijziging van de erkenning.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel44
  - number: '45.1'
    text: |-
      De werkgever en de persoon als bedoeld in [artikel 2:7, eerste lid van de Arbeidstijdenwet][ref1] zorgen ervoor
      dat het controleapparaat door een erkenninghouder als installateur is aangebracht, en door deze is voorzien van een
      installatieplaatje en van verzegelingen, als bedoeld in [artikel 37][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018540#Artikel37
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018540
        artikel: '37'
        paragraaf: '6'
  - number: '45.2'
    text: |-
      In afwijking van het eerste lid mag een motorrijtuig, ingevoerd uit één der lidstaten van de Europese Unie of een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, zijn voorzien van een
      controleapparaat dat volgens de in die lidstaten geldende voorschriften is geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel45
  - number: '46'
    text: |-
      De werkgever en de persoon als bedoeld in [artikel 2:7, eerste lid van de Arbeidstijdenwet][ref1] zorgen ervoor
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel2
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '2'
  - number: 46.a
    text: ten minste eenmaal per twee jaar het controleapparaat door een erkenninghouder als installateur wordt onderzocht;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel46
  - number: 46.b
    text: |-
      na iedere verbreking van verzegelingen als bedoeld in hoofdstuk V, paragraaf 4, van bijlage I van verordening
      (EU) nr. 165/2014, met uitzondering van een verbreking als bedoeld in [artikel 28, derde lid][ref1], en na iedere
      wijziging aan het motorrijtuig waardoor wegdraaital of bandenomtrek zijn beïnvloed, het controleapparaat door een
      erkenninghouder als installateur of reparateur wordt onderzocht;


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel28
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '28'
        paragraaf: '6'
  - number: 46.c
    text: |-
      na ieder onderzoek het controleapparaat door een erkenninghouder als installateur of reparateur is voorzien van een
      installatieplaatje en van verzegelingen als bedoeld in hoofdstuk V, paragraaf 4, van bijlage I van verordening (EU)
      nr. 165/2014;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel46
  - number: 46.d
    text: |-
      tijdens het gebruik van het motorrijtuig waarin een analoog dan wel digitaal controleapparaat is geïnstalleerd de
      maximaal toelaatbare fouten, aangegeven in van verordening (EU) nr. 165/2014 niet worden overschreden;
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel46
  - number: 46.e
    text: de onder c bedoelde verzegelingen ongewijzigd en intact blijven.
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel46
  - number: '50.1'
    text: |-
      Erkenningen verleend ingevolge de [Regeling controleapparaten][ref1] worden gelijk gesteld met een erkenning
      verleend op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010021
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0010021
  - number: '50.2'
    text: 'Met een diploma als bedoeld:'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel50
  - number: 50.2.a
    text: |-
      in [artikel 12, eerste lid, onder a][ref1], wordt gelijkgesteld een voor 1 januari 2017 behaald diploma
      installateur,


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel12
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '12'
        paragraaf: '4'
  - number: 50.2.b
    text: |-
      in [artikel 12, eerste lid, onder b][ref1], wordt gelijkgesteld een voor 1 januari 2017 behaald diploma reparateur.


      [ref1]: https://wetten.overheid.nl/BWBR0018540#Artikel12
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018540
        artikel: '12'
        paragraaf: '4'
  - number: '51'
    text: |-
      De [Regeling controleapparaten][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010021
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0010021
  - number: '52'
    text: 'Deze regeling wordt aangehaald als: Regeling controleapparaten 2005.'
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel52
  - number: '53'
    text: |-
      Deze regeling treedt in werking met ingang van het tijdstip van inwerkingtreding van de wet van 6 juli 2004
      tot wijziging van de Arbeidstijdenwet en de Wegenverkeerswet 1994 in verband met de invoering van het digitale
      controleapparaat (Stb. 2004, 347).
    url: https://wetten.overheid.nl/BWBR0018540/2016-10-14#Artikel53
