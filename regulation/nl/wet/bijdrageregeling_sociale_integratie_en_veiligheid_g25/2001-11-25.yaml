        artikel: '4'
      - id: ref2
        bwb_id: BWBR0010613
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0010613
        artikel: '4'
  - number: '9'
    text: |-
      1 Het gemeentebestuur brengt uiterlijk 1 oktober 2004 aan de minister voor Grote Steden- en Integratiebeleid
      verslag uit over de besteding van de bijdrage.

      2 Het financieel verslag, bedoeld in het eerste lid, maakt deel uit van de rekening, bedoeld in artikel
      197 van de Gemeentewet derde lid. Het verslag is voorzien van de accountantsverklaring, bedoeld in
      [artikel 213, tweede lid, van de Gemeentewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
  - number: '10'
    text: |-
      De ministers kunnen de bijdrage geheel of gedeeltelijk terugvorderen, indien uit het financieel verslag,
      bedoeld in [artikel 9][ref1], blijkt dat de bijdrage niet is besteed aan de uitvoering van de in
      [artikel 5, tweede lid][ref2], bedoelde maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0010613#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010613#Artikel5
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel10
