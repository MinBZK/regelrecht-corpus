preamble:
  text: >-
    In overeenstemming met het gevoelen van de ministerraad;


    Besluiten:
  url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a)
            de ministers:

              De Minister voor Grote Steden- en Integratiebeleid, de Minister van Binnenlandse Zaken en Koninkrijks-
      relaties en voor zover het betreft het onderwijs de Minister van Onderwijs Cultuur en Wetenschappen;



            b)
            G25:

              de gemeenten Almelo, Arnhem, Amsterdam, Breda, Den Haag, Deventer, Dordrecht, Eindhoven, Enschede,
      Groningen, Haarlem, Heerlen, Hengelo, Helmond, ’s Her-togenbosch, Leeuwarden, Leiden, Maastricht, Nijmegen,
      Rotterdam, Schiedam, Tilburg, Utrecht, Venlo en Zwolle;



            c)
            gemeentebestuur:

              het college van burgemeester en wethouders van een tot de G25 behorende gemeente;



            d)
            doorstartconvenant:

              het convenant dat op 17 december 1998 tussen het Rijk en de G25 is gesloten;



            e)
            meerjarig ontwikkelingsprogramma:

              het ontwikkelingsprogramma dat het gemeentebestuur overeenkomstig de in het doorstartconvenant opgenomen
      afspraken vóór 1 november 1999 bij het Rijk indient.
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel1
  - number: '2'
    text: |-
      1 De ministers verstrekken het gemeentebestuur voor de uitvoering van het gemeentelijk beleid ter verbetering van
      de sociale integratie en veiligheid een bijdrage voor de periode 1999 tot en met 2003, indien het gemeentebestuur
      in het meerjarig ontwikkelingsprogramma een samenstel van maatregelen opneemt dat naar het oordeel van de ministers
      en gehoord de minister van Justitie voldoet aan de in de [artikelen 4][ref1] tot en met [6][ref2] gestelde
      voorwaarden.

      2 Het gemeentebestuur besteedt de bijdrage als aanvullende financiering van het onderdeel sociale integratie en
      veiligheid van het meerjarig ontwikkelingsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0010613#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010613#Artikel6
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010613
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0010613
        artikel: '6'
  - number: '3'
    text: >-
      1 De bijdrage die het gemeentebestuur wordt toegekend na goedkeuring van het meerjarig ontwikkelingsprogramma staat
      vermeld in de bij deze regeling behorende bijlage.


      2 De op grond van deze regeling toe te kennen bijdragen worden beschikbaar gesteld onder het voorbehoud van
      autorisatie door de begrotingswetgever.
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel3
  - number: '4'
    text: >-
      Aan het onderdeel sociale integratie en veiligheid van het meerjarig ontwikkelingsprogramma legt het
      gemeentebestuur de volgende doelstellingen ten grondslag:


      a) Het verbeteren van de leefbaarheid en veiligheid van de leefomgeving. Hierbij staan vergroting van objectieve en
      subjectieve veiligheid als prioriteiten voorop;


      b) Het verminderen en tegengaan van jeugdcriminaliteit door middel van een integrale aanpak, van preventie tot en
      met repressie, waarbij aandacht wordt gegeven aan het tot stand brengen van de aansluiting tussen organisaties en
      voorzieningen ten behoeve van een doorgaande ontwikkelingslijn voor jongeren tot en met 24 jaar;


      c) Het vergroten van deelname aan en succesvolle afronding van trajecten voor beheersing van de Nederlandse taal
      door werklozen en opvoeders uit de groep oudkomers;


      d) Het verminderen en tegengaan van voortijdig schoolverlaten;


      e) Het bevorderen van een sluitende structuur voor 24-uursopvang van kwetsbare groepen;


      f) Het bevorderen van burgerparticipatie;


      g) Het bevorderen van de betrokkenheid van het bedrijfsleven bij het bevorderen van leefbaarheid en veiligheid.
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel4
  - number: '5'
    text: |-
      1 Het gemeentebestuur geeft voor het onderdeel sociale integratie en veiligheid van het meerjarig
      ontwikkelingsprogramma een beschrijving van de problematiek en van de omvang en samenstelling van de groepen waarop
      het gemeentelijk beleid met het oog op het bereiken van de in [artikel 4][ref1] genoemde doelstellingen is gericht.

      2 Het gemeentebestuur geeft voor het onderdeel sociale integratie en veiligheid van het meerjarig
      ontwikkelingsprogramma een beschrijving van de maatregelen die met het oog op de in [artikel 4][ref2] genoemde
      doelstellingen worden genomen en een globale indicatie van de bestedingen die ten laste van de bijdrage zullen
      worden gedaan.

      3 Het gemeentebestuur geeft ten aanzien van de in het tweede lid bedoelde maatregelen aan welke prestaties in
      termen van streefcijfers ten opzichte van de vastgestelde beginsituatie zullen worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0010613#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010613#Artikel4
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010613
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0010613
        artikel: '4'
  - number: '6'
    text: |-
      1 Het gemeentebestuur geeft in het onderdeel sociale integratie en veiligheid van het meerjarig
      ontwikkelingsprogramma een beschrijving van de maatregelen die op andere beleidsterreinen worden genomen en
      relevant zijn voor de uitvoering van de in [artikel 5, tweede lid][ref1], bedoelde maatregelen. Dit geldt in ieder
      geval voor:

      - de relatie met de inzet van de middelen in het kader van het gemeentelijk onderwijs- en achterstandenbeleid;
      - de relatie met de regionale meld- en coördinatiefunctie voortijdig schoolverlaters en middelen;
      - de relatie met de inzet van de middelen uit de Europese Structuurfondsen (ESF-3) die voor het bevorderen van een
      leven lang leren en het tegengaan van voortijdig schoolverlaten aan onderwijsinstellingen worden verstrekt.

      2 Het gemeentebestuur geeft in het onderdeel sociale integratie en veiligheid van het meerjarig
      ontwikkelingsprogramma aan op welke wijze de opvattingen van lokale en regionale onderwijs- en welzijnsinstellingen
      alsmede bewonersorganisaties worden betrokken in het driehoeksoverleg ten aanzien van de aanpak van de
      jeugdcriminaliteit en ten aanzien van voortijdig schoolverlaten en met welke partijen afspraken worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010613#Artikel5
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010613
        artikel: '5'
  - number: '7'
    text: |-
      Indien de ministers, gehoord de minister van Justitie van oordeel zijn dat het onderdeel sociale integratie en
      veiligheid van het meerjarig ontwikkelingsprogramma niet voldoet aan de [artikelen 4][ref1] tot en met [6][ref2],
      stellen zij het gemeentebestuur in de gelegenheid het meerjarig ontwikkelingsprogramma aan te passen. Zij stellen
      daarbij een termijn en geven aan op welke onderdelen het ontwikkelingsprogramma aanpassing behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0010613#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010613#Artikel6
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010613
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0010613
        artikel: '6'
  - number: '8'
    text: |-
      1 Het gemeentebestuur ontvangt de bijdrage in vijf jaarlijkse termijnen, die telkens voor 1 juli betaalbaar worden
      gesteld.

      2 In afwijking van het eerste lid wordt de eerste jaartermijn voor 1 december 1999 verstrekt onder voorbehoud van
      goedkeuring van het meerjarig ontwikkelingsprogramma.

      3 In afwijking van het eerste lid ontvangt het gemeentebestuur de jaartermijn 2000 van de in
      [artikel 4, onder e][ref1], bedoelde middelen, voor 31 december 2000 onder voorbehoud van goedkeuring van de
      daarmee verband houdende wijziging van het meerjarig ontwikkelingsprogramma.

      4 In afwijking van het eerste lid ontvangt het gemeentebestuur de jaartermijn 2001 van de in
      [artikel 4, onder f][ref2], bedoelde middelen, voor 15 december 2001, onder voorbehoud van goedkeuring van de
      daarmee verband houdende wijziging van het meerjarig ontwikkelingsprogramma. In deze wijziging die voor 1 december
      2001 wordt ingediend, geeft het gemeentebestuur aan op welke manier er vorm is gegeven aan burgerparticipatie en op
      welke wijze het bedrag van de rijksbijdrage met tenminste de helft wordt vermeerderd.

      5 In afwijking van het eerste lid ontvangt het gemeentebestuur de in [artikel 4, onder g][ref3], bedoelde middelen,
      voor 15 december 2001, onder voorbehoud van goedkeuring van de daarmee verband houdende wijziging van het meerjarig
      ontwikkelingsprogramma. In deze wijziging geeft het gemeentebestuur aan op welke manier er vorm is gegeven aan de
      betrokkenheid van het bedrijfsleven en waaraan een door het bedrijfsleven beschikbaar gesteld bedrag dat tenminste
      gelijk is aan de rijksmiddelen wordt besteed.


      [ref1]: https://wetten.overheid.nl/BWBR0010613#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010613#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010613#Artikel4
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel8
    references:
      - id: ref1
