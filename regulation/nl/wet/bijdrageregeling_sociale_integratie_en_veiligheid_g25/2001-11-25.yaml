  - number: '11'
    text: >-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Bijdrageregeling sociale integratie en veiligheid G25.'
    url: https://wetten.overheid.nl/BWBR0010613/2001-11-25#Artikel12
