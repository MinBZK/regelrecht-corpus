articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a)
            de ministers:

              De Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties, de Minister van Binnenlandse Zaken en
      Koninkrijks-relaties en voor zover het betreft het onderwijs de Minister van Onderwijs Cultuur en Wetenschappen;



            b)
            G25:

              de gemeenten Almelo, Arnhem, Amsterdam, Breda, Den Haag, Deventer, Dordrecht, Eindhoven, Enschede,
      Groningen, Haarlem, Heerlen, Hengelo, Helmond, ’s Her-togenbosch, Leeuwarden, Leiden, Maastricht, Nijmegen,
      Rotterdam, Schiedam, Tilburg, Utrecht, Venlo en Zwolle;



            c)
            gemeentebestuur:

              het college van burgemeester en wethouders van een tot de G25 behorende gemeente;



            d)
            doorstartconvenant:

              het convenant dat op 17 december 1998 tussen het Rijk en de G25 is gesloten;



            e)
            meerjarig ontwikkelingsprogramma:

              het ontwikkelingsprogramma dat het gemeentebestuur overeenkomstig de in het doorstartconvenant opgenomen
      afspraken vóór 1 november 1999 bij het Rijk indient.
    url: https://wetten.overheid.nl/BWBR0010613/2005-01-23#Artikel1
  - number: '2'
    text: |-
      1 De ministers verstrekken het gemeentebestuur voor de uitvoering van het gemeentelijk beleid ter verbetering
      van de sociale integratie en veiligheid een bijdrage voor de periode 1999 tot en met 31 maart 2005, indien het
      gemeentebestuur in het meerjarig ontwikkelingsprogramma een samenstel van maatregelen opneemt dat naar het oordeel
      van de ministers en gehoord de minister van Justitie voldoet aan de in de [artikelen 4 tot en met 6][ref1] gestelde
      voorwaarden.

      2 Het gemeentebestuur besteedt de bijdrage als aanvullende financiering van het onderdeel sociale integratie en
      veiligheid van het meerjarig ontwikkelingsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0010613#Artikel4
    url: https://wetten.overheid.nl/BWBR0010613/2005-01-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010613
        artikel: '4'
  - number: '3'
    text: |-
      1 De bijdrage die het gemeentebestuur wordt toegekend na goedkeuring van het meerjarig ontwikkelingsprogramma staat
      vermeld in de bij deze regeling behorende bijlage.

      2 De op grond van deze regeling toe te kennen bijdragen worden beschikbaar gesteld onder het voorbehoud van
      autorisatie door de begrotingswetgever.
    url: https://wetten.overheid.nl/BWBR0010613/2005-01-23#Artikel3
  - number: '4'
    text: |-
      Aan het onderdeel sociale integratie en veiligheid van het meerjarig ontwikkelingsprogramma legt het
      gemeentebestuur de volgende doelstellingen ten grondslag:

      a) Het verbeteren van de leefbaarheid en veiligheid van de leefomgeving. Hierbij staan vergroting van objectieve en
      subjectieve veiligheid als prioriteiten voorop;

      b) Het verminderen en tegengaan van jeugdcriminaliteit door middel van een integrale aanpak, van preventie tot en
      met repressie, waarbij aandacht wordt gegeven aan het tot stand brengen van de aansluiting tussen organisaties en
      voorzieningen ten behoeve van een doorgaande ontwikkelingslijn voor jongeren tot en met 24 jaar;

      c) Het verminderen en tegengaan van voortijdig schoolverlaten;

      d) Het bevorderen van een sluitende structuur voor 24-uursopvang van kwetsbare groepen;

      e) Het bevorderen van burgerparticipatie;

      f) Het bevorderen van de betrokkenheid van het bedrijfsleven bij het bevorderen van leefbaarheid en veiligheid;

      g) het bevorderen van een sluitende aanpak van sociale opvang en hulpverlening gericht op overlastgevende personen,
      waaronder dak- en thuislozen, met gecompliceerde, meervoudige problemen;

      h) realisatie van toezicht op locaties met een verhoogd overlast- en/of criminaliteitsrisico;

      i) het verbeteren van de nazorg voor stelselmatige daders;

      j) het ontwikkelen en uitvoeren van een gedegen veiligheidsanalyse, het investeren in de regiefunctie van de
      gemeente, het verbeteren van de informatievoorziening en het opstellen van veiligheidsarrangementen, in het
      bijzonder voor stationsgebieden en andere gebieden ten behoeve van het openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0010613/2005-01-23#Artikel4
  - number: '5'
    text: |-
      1 Het gemeentebestuur geeft voor het onderdeel sociale integratie en veiligheid van het meerjarig
      ontwikkelingsprogramma een beschrijving van de problematiek en van de omvang en samenstelling van de groepen waarop
      het gemeentelijk beleid met het oog op het bereiken van de in [artikel 4][ref1] genoemde doelstellingen is gericht.

      2 Het gemeentebestuur geeft voor het onderdeel sociale integratie en veiligheid van het meerjarig
      ontwikkelingsprogramma een beschrijving van de maatregelen die met het oog op de in [artikel 4][ref2] genoemde
      doelstellingen worden genomen en een globale indicatie van de bestedingen die ten laste van de bijdrage zullen
      worden gedaan.

      3 Het gemeentebestuur geeft ten aanzien van de in het tweede lid bedoelde maatregelen aan welke prestaties in
      termen van streefcijfers ten opzichte van de vastgestelde beginsituatie zullen worden bereikt.

      4 Met betrekking tot de doelstelling genoemd in [artikel 4, onderdeel h][ref3], omschrijft het gemeentebestuur de
      prestaties, bedoeld in het derde lid, in het aantal te realiseren plaatsen in de maatschappelijke opvang binnen
      de gemeente.

      5 Met betrekking tot de doelstelling genoemd in [artikel 4, onderdeel i][ref4], omschrijft het gemeentebestuur de
      prestaties, bedoeld in het derde lid, in:

      a. het aantal regulier gemaakte instroom/doorstroombanen,

      b. het aantal gerealiseerde aanvullende opleidingen voor toezichthouders, en

      c. het aantal gerealiseerde arbeidsmarkttoeleidingstrajecten voor toezichthouders.

      6 Met betrekking tot de doelstelling genoemd in [artikel 4, onderdeel i][ref5], omschrijft het gemeentebestuur
      de prestaties bedoeld in het derde lid in: de totstandkoming van een convenant tussen de bij de nazorg betrokken
      lokale partijen, daarbij inbegrepen een vaststelling van de beginsituatie van het aantal aangeboden nazorgtrajecten
      en afspraken over het aantal nazorgtrajecten in de jaren 2005–2009. Met betrekking tot de doelstelling genoemd in
      [artikel 4, onderdeel i][ref6], omschrijven de gemeentebesturen van Amsterdam, Rotterdam, Den Haag en Utrecht de
      prestaties bedoeld in het derde lid, tevens in het aantal nazorgtrajecten aangeboden aan stelselmatige daders, in
      relatie tot het totale aantal stelselmatige daders.


