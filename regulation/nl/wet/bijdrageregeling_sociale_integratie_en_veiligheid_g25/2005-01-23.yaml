  - number: '9'
    text: |-
      1 Het gemeentebestuur brengt uiterlijk 15 juli 2005 aan de minister voor Grote Steden- en Integratiebeleid verslag
      uit over de besteding van de bijdrage.

      2 Het financieel verslag, bedoeld in het eerste lid, maakt deel uit van de rekening, bedoeld in
      [artikel 197 van de Gemeentewet derde lid][ref1]. Het verslag is voorzien van de accountantsverklaring, bedoeld in
      [artikel 213, tweede lid, van de Gemeentewet][ref2].


