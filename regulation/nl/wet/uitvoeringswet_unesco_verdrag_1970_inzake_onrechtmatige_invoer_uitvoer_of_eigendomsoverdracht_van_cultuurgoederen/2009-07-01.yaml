preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet uitvoering te geven aan de Overeenkomst
    inzake de middelen om de onrechtmatige invoer, uitvoer of eigendomsoverdracht van culturele goederen te verbieden
    en te verhinderen (Parijs, 14 november 1970, Trb.  1972, nr. 50 en 1983, nr. 66) en in verband daarmee onder meer
    wijzigingen aan te brengen in het Wetboek van Burgerlijke Rechtsvordering, het Burgerlijk Wetboek en de Wet tot
    behoud van cultuurbezit;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0025996/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap.
        - *Verdrag:* op 14 november 1970 te Parijs tot stand gekomen Overeenkomst inzake de middelen om onrechtmatige
      invoer, uitvoer of eigendomsoverdracht te verbieden en te verhinderen (Trb. 1972, nr. 50 en Trb. 1983, nr. 66);
        - *verdragsstaat:* staat die het Verdrag heeft bekrachtigd;
        - *cultuurgoederen:* goederen die om godsdienstige of wereldlijke redenen door elke Staat zijn aangewezen als
      belangrijk voor de oudheidkunde, de prehistorie, de geschiedenis, de letterkunde, de kunst of de wetenschap en
      derhalve van wezenlijk belang zijn voor zijn cultureel erfgoed en die behoren tot de in artikel 1 van het Verdrag
      opgesomde categorieën.
    url: https://wetten.overheid.nl/BWBR0025996/2009-07-01#Artikel1
  - number: '2'
    text: |-
      Als cultuurgoederen voor Nederland worden aangewezen:

      a. de beschermde voorwerpen bedoeld in [artikel 1 onder a van de Wet tot behoud van cultuurbezit][ref1];

      b. de roerende zaken bedoeld in [artikel 14a van de Wet tot behoud van cultuurbezit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003659#Artikel14a
    url: https://wetten.overheid.nl/BWBR0025996/2009-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003659
        artikel: 14a
  - number: '3'
    text: |-
      Het is verboden cultuurgoederen binnen Nederland te brengen die:

      a. buiten het grondgebied van een verdragsstaat zijn gebracht met schending van de bepalingen welke in
      overeenstemming met de doelstellingen van het verdrag door die verdragsstaat zijn vastgesteld ter zake van de
      uitvoer van cultuurgoederen uit die verdragsstaat of ter zake van eigendomsoverdracht van cultuurgoederen; dan wel

      b. in een verdragsstaat zijn ontvreemd.
    url: https://wetten.overheid.nl/BWBR0025996/2009-07-01#Artikel3
  - number: '4'
    text: |-
      Van cultuurgoederen die in strijd met het verbod, bedoeld in [artikel 3][ref1], binnen Nederland zijn gebracht, kan
      met inachtneming van de [artikelen 1011a tot en met 1011d van het Wetboek van Burgerlijke Rechtsvordering][ref2]
      teruggave worden gevorderd door de verdragsstaat waaruit die goederen afkomstig zijn of door de rechthebbende op
      die goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0025996#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1011a
    url: https://wetten.overheid.nl/BWBR0025996/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025996
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 1011a
  - number: '7'
    text: |-
      Onze Minister verricht hetgeen in aanmerking komt ter uitvoering van de artikelen 2, 5, 6, 7, 9, 10, 13 onder a,
      b en d en 14 van het Verdrag, behoudens voor zover het betreft het in artikel 10 onder a van het Verdrag bedoelde
      opleggen aan antiekhandelaren van regels, waarvan de overtreding strafbaar is. Bij ministeriële regeling kunnen in
      verband met die uitvoering nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025996/2009-07-01#Artikel7
  - number: '8'
    text: |-
      Met het toezicht op de naleving van het bij deze wet bepaalde en met het daartoe nodige onderzoek zijn, belast:

      a. de inspecteur, bedoeld in [artikel 1, onder f, van de Wet tot behoud van cultuurbezit][ref1], en de ambtenaren,
      bedoeld in [artikel 15, eerste lid, van die wet][ref2];

      b. de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003659#Artikel15
    url: https://wetten.overheid.nl/BWBR0025996/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003659
        artikel: '15'
  - number: '9'
    text: |-
      De in [artikel 8 onder a][ref1] bedoelde ambtenaren zijn bevoegd:

      a. met medeneming van de nodige apparatuur, een woning binnen te treden zonder toestemming van de bewoner;

      b. te vorderen dat de bewoner hun de cultuurgoederen die in de woning aanwezig zijn, toont;

      c. ruimten en voorwerpen te verzegelen, voor zover dat voor de uitoefening van de in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bedoelde bevoegdheid redelijkerwijs noodzakelijk is;

      d. zonodig met behulp van de sterke arm de bevoegdheid, bedoeld in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref3] uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0025996#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel517
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel517
    url: https://wetten.overheid.nl/BWBR0025996/2009-07-01#Artikel9
    references:
