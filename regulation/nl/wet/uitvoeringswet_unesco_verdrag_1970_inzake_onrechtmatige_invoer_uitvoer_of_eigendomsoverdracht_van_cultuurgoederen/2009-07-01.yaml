  - number: '10'
    text: |-
      1 Onze Minister kan een cultuurgoed ten aanzien waarvan een redelijk vermoeden bestaat dat daarmee het verbod van
      [artikel 3][ref1] is overtreden, in bewaring nemen voor de tijd die onze Minister nodig acht om de verdragsstaat
      waaruit het cultuurgoed afkomstig is, in staat te stellen op dit cultuurgoed beslag te doen leggen, welke tijd niet
      langer dan twaalf weken mag bedragen.

      2 Onze Minister stelt zijn beslissing voorafgaande aan de inbewaringneming op schrift en maakt degene onder wie
      zich het cultuurgoed bevindt en zo mogelijk ook de bezitter, met de inbewaringneming bekend. De schriftelijke
      beslissing is een beschikking. Indien de situatie zo spoedeisend is dat onze Minister de inbewaringneming niet
      tevoren op schrift kan stellen, zorgt hij zo spoedig mogelijk voor opschriftstelling en bekendmaking.

      3 De inbewaringneming kan éénmaal voor ten hoogste twaalf weken worden verlengd. Het tweede lid is van
      overeenkomstige toepassing.

      4 De inbewaringneming eindigt, doordat op het cultuurgoed in opdracht van de staat waaruit het afkomstig is, beslag
      wordt gelegd, of de tijd waarvoor de inbewaringneming geldt, ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0025996#Artikel3
    url: https://wetten.overheid.nl/BWBR0025996/2009-07-01#Artikel10
