  - number: '3'
    text: |-
      1 De gegevens, bedoeld in [artikel 23c, eerste lid, van de wet][ref1] zijn:

      a. een opgave van de naam, het adres, het telefoon- en faxnummer en het emailadres van de aanbieder en, indien van
      toepassing, van zijn bijkantoren;

      b. een opgave van de rechtsvorm van de aanbieder;

      c. een opgave van de statutaire zetel, de statutaire naam en de handelsnaam of handelsnamen;

      d. een opgave van het nummer van inschrijving in het handelsregister of, indien van toepassing, een opgave van de
      LEI code;

      e. indien van toepassing een gewaarmerkt afschrift van de statuten;

      f. een opgave van de activiteiten die de aanbieder voornemens is te gaan verrichten;

      g. de identiteit van degenen die het beleid van de aanbieder bepalen of mede bepalen;

      h. de identiteit van degenen die een gekwalificeerde deelneming bezitten in de aanbieder;

      i. gegevens op basis waarvan De Nederlandsche Bank N.V. kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 23h, eerste lid, van de wet][ref2] is bepaald met betrekking tot de geschiktheid van de personen die het
      beleid bepalen of mede bepalen;

      j. gegevens op basis waarvan De Nederlandsche Bank N.V. kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 23h, tweede lid, van de wet][ref3] is bepaald met betrekking tot de betrouwbaarheid van de personen die
      het beleid bepalen of mede bepalen of onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid en
      de algemene gang van zaken;

      k. gegevens op basis waarvan De Nederlandsche Bank N.V. kan beoordelen of wordt voldaan aan hetgeen ingevolge
      [artikel 23h, vierde lid, van de wet][ref4] is bepaald met betrekking tot de betrouwbaarheid van de personen die
      een gekwalificeerde deelneming houden;

      l. een beschrijving van de formele en feitelijke zeggenschapsstructuur van de aanbieder;

      m. een beschrijving van de organisatiestructuur van de aanbieder;

      n. de inrichting van de bedrijfsvoering met betrekking tot de integere en beheerste bedrijfsuitoefening bedoeld in
      [artikel 23j van de wet][ref5];

      o. overige gegevens en bescheiden die de toezichthouder nodig acht in het belang van de registratie.

      2 De gegevens bedoeld in het eerste lid, onderdelen i, j en k zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, de nationaliteit, het privéadres, het telefoon- en
      faxnummer, het emailadres en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten;

      f. de antecedenten van degenen, genoemd in het eerste lid, onderdelen g en h.

      3 In afwijking van het eerste lid wordt voor de antecedenten van de personen, bedoeld in het eerste lid, onderdelen
      g en h, indien deze eerder zijn beoordeeld voor de toepassing van de [Wet op het financieel toezicht][ref6] of de
      [Wet toezicht trustkantoren 2018][ref7], bij de aanvraag volstaan met vermelding hiervan en een verwijzing naar de
      datum van beoordeling van deze antecedenten.


