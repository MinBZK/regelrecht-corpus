  - number: '4'
    text: |-
      1 Als documenten op basis waarvan kan worden voldaan aan [artikel 11, eerste lid, eerste volzin, van de wet][ref1]
      worden aangewezen:

      a. een geldig paspoort;

      b. een geldige Nederlandse identiteitskaart;

      c. een geldige identiteitskaart die is afgegeven door het daartoe bevoegde gezag in een andere lidstaat en is
      voorzien van een pasfoto en de naam van de houder;

      d. een geldig Nederlands rijbewijs;

      e. een geldig rijbewijs dat is afgegeven door het daartoe bevoegde gezag in een andere lidstaat en is voorzien van
      een pasfoto en de naam van de houder;

      f. reisdocumenten voor vluchtelingen en vreemdelingen;

      g. vreemdelingendocumenten, afgegeven op grond van de [Vreemdelingenwet 2000][ref2];

      h. een voldoende betrouwbaar identificatiemiddel.

      2 Als documenten op basis waarvan kan worden voldaan aan [artikel 11, tweede lid, eerste volzin, van de wet][ref3],
      worden aangewezen:

      a. een uittreksel uit het handelsregister;

      b. een akte of verklaring, opgemaakt onderscheidenlijk afgegeven door een in Nederland of in een andere lidstaat
      gevestigde advocaat, notaris, kandidaat-notaris of een hiermee vergelijkbare, onafhankelijke beoefenaar van een
      juridisch beroep;

      c. een document waaruit blijkt dat een kerkgenootschap of lichaam waarin zij is verenigd, is aangesloten bij
      het Interkerkelijk Contact in Overheidszaken dan wel dat het kerkgenootschap of lichaam is aangemerkt als een
      instelling als bedoeld in [artikel 6.33, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref4];

      d. een document waaruit blijkt dat een zelfstandig onderdeel van een kerkgenootschap als bedoeld in onderdeel c
      deel uitmaakt van dat kerkgenootschap en het kerkgenootschap voldoet aan het bepaalde in onderdeel c.

      3 De identiteit van een cliënt als bedoeld in [artikel 11, vierde lid, van de wet][ref5] kan worden geverifieerd
      aan de hand van documenten, gegevens of inlichtingen uit betrouwbare en onafhankelijke bron.

      4 Onverminderd het derde lid kan de identiteit van een vereniging van eigenaars als bedoeld in
      [artikel 112, eerste lid, onderdeel e, van Boek 5 van het Burgerlijk Wetboek][ref6] worden geverifieerd aan de hand
      van de statuten van die vereniging die deel uitmaken van het reglement van de akte van splitsing als bedoeld in
      [artikel 111 van Boek 5 van het Burgerlijk Wetboek][ref7].


