  - number: 2a
    text: |-
      1 De toezichthoudende autoriteiten, bedoeld in [artikel 1d, eerste lid, onderdelen a en b, onderdeel c][ref1],
      met uitzondering voor zover het betreft de instellingen als bedoeld in
      [artikel 1a, vierde lid, onderdeel d, van de wet][ref2], en onderdelen e en f van de wet, verstrekken aan de
      Minister van Financiën op diens verzoek onverwijld alle inlichtingen die van belang kunnen zijn voor de nakoming
      van internationale afspraken en verplichtingen of voor een onderzoek naar de toereikendheid van de wet.

      2 De toezichthoudende autoriteiten, bedoeld in het eerste lid, dragen bij aan de totstandkoming van procedurele
      afspraken met betrekking tot de handhaving tussen hen en de betrokken ministeries en andere overheidsinstellingen.

      3 De toezichthoudende autoriteiten, bedoeld in het eerste lid, maken afspraken met andere autoriteiten die belast
      zijn met de uitvoering en handhaving van de wet over de onderlinge samenwerking en informatie-uitwisseling ten
      behoeve van de uitoefening van hun taken.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1d
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
