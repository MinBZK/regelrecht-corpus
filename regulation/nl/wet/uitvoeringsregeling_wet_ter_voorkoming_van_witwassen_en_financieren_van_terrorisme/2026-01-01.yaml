  - number: '5'
    text: |-
      1 De Commissie inzake de meldingsplicht van ongebruikelijke transacties, bedoeld in
      [artikel 21, eerste lid, van de wet][ref1], bestaat uit vertegenwoordigers van:

      a. de Minister van Financiën;

      b. de Minister van Justitie en Veiligheid;

      c. de instellingen;

      d. De Nederlandsche Bank N.V.;

      e. de Stichting Autoriteit Financiële Markten;

      f. het Bureau Financieel Toezicht;

      g. de Dienst Financieel-Economische Integriteit;

      h. de Belastingdienst/Fiscale inlichtingen- en opsporingsdienst – Economische Controledienst;

      i. het openbaar ministerie;

      j. de politie;

      k. de kansspelautoriteit.

      2 De leden van de commissie worden door de Minister van Financiën en de Minister van Justitie en Veiligheid
      gezamenlijk aangewezen. Bij de samenstelling van de commissie streven de Minister van Financiën en de Minister van
      Justitie en Veiligheid naar een evenwichtige vertegenwoordiging van de instellingen, bedoeld in het eerste lid,
      onderdeel c.

      3 De Minister van Financiën en de Minister van Justitie en Veiligheid wijzen gezamenlijk de voorzitter van de
      commissie aan.

      4 De commissie bepaalt haar eigen werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel21
