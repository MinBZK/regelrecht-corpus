    text: |-
      Van de bij of krachtens de wet gestelde regels zijn vrijgesteld instellingen als bedoeld in
      [artikel 1a, vierde lid, onderdeel n, van de wet][ref1], voor zover zij beroeps- of bedrijfsmatig
      gelegenheid geven als bedoeld in de [artikelen 3][ref2], [8][ref3], [14a][ref4], [15][ref5], [23][ref6] en
      [27a van de Wet op de kansspelen][ref7] of activiteiten verrichten als bedoeld in de [artikelen 7a][ref8],
      [30b][ref9] en [30h van die wet][ref10].


