  - number: '57'
    text: |-
      1 De bepalingen van de [afdelingen 1 en 2 van titel 9 van Boek 3 van het Burgerlijk Wetboek][ref1] en de bepalingen
      van de [veertiende titel van Boek 7A van dat wetboek](onbekend) zijn op de banken van lening van toepassing, voor
      zover daarvan bij deze wet niet wordt afgeweken.

      2 Ter zake van vorderingen op den pandnemer wordt geen beslag gelegd op panden.

      3 De wet van 16 Pluviôse an XII vervalt.


