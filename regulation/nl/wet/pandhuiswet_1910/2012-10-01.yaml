  - number: '51'
    text: |-
      1 Hij, die weigert, den rechtmatigen houder van een pandbewijs tot lossing van het pand toe te laten; die een pand
      verkoopt binnen den termijn, ingevolge [art. 20, letter d][ref1], op het pandbewijs vermeld; die in het geval,
      bedoeld in [art. 21, tweede lid][ref2], het pand niet tegen ontvangst van het verschuldigde terug geeft; of die
      weigert, het bedrag, bedoeld in [art. 20, letter e][ref3], aan den rechthebbende uit te keeren, wordt gestraft met
      hechtenis van ten hoogste een maand of geldboete van de eerste categorie.

      2 Met gelijke straf wordt gestraft hij, die handelt in strijd met het bepaalde in [art. 35, eerste lid][ref4], of
      met een besluit, vastgesteld ingevolge [art. 37, letter c][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0001880#Artikel21
