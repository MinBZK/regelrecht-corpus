  - number: '53'
    text: |-
      1 De opsporingsambtenaren zijn te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij
      kunnen daartoe hun uitlevering vorderen.

      2 De voormelde ambtenaren hebben te allen tijde vrijen toegang tot alle localiteiten en alle plaatsen, waar een
      bank van leening wordt gehouden of waar redelijkerwijze vermoed kan worden, dat een bank van leening gehouden
      wordt.

      3 Bij het opsporen van een bij of krachtens deze wet strafbaar gesteld feit hebben de in het eerste lid bedoelde
      ambtenaren toegang tot elke plaats, waar een bank van lening wordt gehouden of waar redelijkerwijs vermoed kan
      worden, dat een bank van lening gehouden wordt, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig
      is.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel53
  - number: '54'
    text: |-
      De reglementen van de gemeentelijke banken van leening vervallen zes maanden na het in werking treden van deze wet,
      indien zij niet met inachtneming van de bepalingen van deze wet binnen dien termijn zijn herzien.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel54
  - number: '55'
    text: |-
      1 Verpachting van een gemeentelijke bank van leening en het aannemen van zaken ter beleening door inbrengers wordt
      niet voortgezet dan krachtens een bepaling van het reglement.

      2 Die bepaling is telkens voor slechts vijf jaren geldig.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel55
  - number: '56'
    text: |-
      1 Particuliere banken van leening kunnen gedurende een jaar na de inwerkingtreding van deze wet worden gehouden
      zonder de in [art. 13][ref1] gevorderde toelating.

      2 Het bepaalde in de [artt. 17-20][ref2], [23-36][ref3], [38][ref4], [39][ref5], [46][ref6] en [47][ref7] blijft
      gedurende dien termijn buiten toepassing; houders van banken van leening zijn eerst na afloop van dien termijn
      met inachtneming van het bepaalde in [art. 37, tweede lid][ref8], gehouden tot naleving van een besluit, te voren
      vastgesteld op grond van [art. 37, eerste lid, letter b, c, d, e of f][ref9].


