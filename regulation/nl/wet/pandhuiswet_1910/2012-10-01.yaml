preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben dat het wenschelijk is een wettelijke regeling vast te stellen voor de
    banken van leening en daarmede gelijk te stellen inrichtingen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet verstaat onder banken van leening alle inrichtingen, waar gewoonte wordt gemaakt van het in ontvangst
      nemen van roerende zaken tegen afgifte van geld en het weder afgeven van die zaken tegen ontvangst van geld of
      andere roerende zaken aan houders van bij de ontvangst van de roerende zaken afgegeven geschreven of andere stukken
      of andere voorwerpen.

      2 Het bepaalde in het vorige lid is niet van toepassing op inrichtingen, waar uitsluitend geld tot een hooger
      bedrag dan € 11,34 op een onderpand wordt verstrekt.

      3 Deze wet verstaat onder pand de roerende zaak, die in een bank van leening in ontvangst wordt genomen tegen
      afgifte van geld; onder beleensom het afgegeven geld; onder beleening de afgifte van geld tegen het in ontvangst
      nemen van een roerende zaak.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel1
  - number: '2'
    text: |-
      In elke gemeente, waarin aan een gemeentelijke bank van leening genoegzame behoefte bestaat, wordt zoodanige bank
      opgericht.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel2
  - number: '3'
    text: |-
      1 Een gemeentelijke bank van leening wordt opgericht en opgeheven bij besluit van burgemeester en wethouders.

      2 Burgemeester en wethouders stellen een reglement vast voor de gemeentelijke bank van leening.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel3
  - number: '4'
    text: |-
      1 In het reglement van een gemeentelijke bank van leening wordt, behalve hetgeen burgemeester en wethouders daarin
      verder wensen vast te stellen, geregeld:

      1°. het bestuur en het beheer van de bank, benevens benoeming, schorsing, ontslag, bezoldiging, werkkring en
      aansprakelijkheid van de ambtenaren en bedienden;

      2°. de inrichting en de wijze van bijhouding van de registers;

      3°. de inrichting der uit te reiken pandbewijzen;

      4°. de nummering, de schatting en de bewaring der panden en de vergoeding ingeval van brand- of diefstalschade;

      5°. de rente benevens kosten, die ter zake van de beleening verschuldigd zijn;

      6°. de termijn, na welken, gerekend van den dag der beleening, panden, die niet zijn gelost, verkocht kunnen
      worden;

      7°. de verkoop van de panden, die niet zijn gelost, en de wijze van aankondiging van dien verkoop;

      8°. de tijd gedurende welken hetgeen een pand bij verkoop meer heeft opgebracht dan de beleensom en hetgeen ter
      zake van de beleening verschuldigd is, door den rechthebbende kan worden opgevorderd;

      9°. wat door de ambtenaren van de bank moet worden gedaan wanneer zaken als door diefstal verloren worden
      aangegeven, of wanneer tot pand worden aangeboden zaken, die als door diefstal verloren zijn aangegeven of waarvan
      vermoed wordt, dat zij door diefstal zijn verloren;

      10°. het bedrijfskapitaal van de bank en de daarvoor te betalen vergoeding;

      11°. de bestemming van winst;

      12°. op welke wijze zal worden geweerd verspreiding van besmettelijke ziekten door panden.

      2 Voor verschillende soorten van panden kunnen verschillende termijnen worden bepaald, na welke, gerekend van den
      dag der beleening, de panden die niet zijn gelost, verkocht kunnen worden.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel4
  - number: '5'
    text: |-
      In het reglement wordt bepaald:

      1°. dat de bank op Zondagen en algemeen erkende Christelijke feestdagen gesloten is;

      2°. dat van kinderen, die kenlijk den leeftijd van zestien jaren nog niet hebben bereikt, en van personen, in
      kenlijken staat van dronkenschap, panden of gelden niet worden aangenomen en aan die kinderen en personen panden of
      gelden niet worden verstrekt;

      3°. dat niet tot pand worden aangenomen:

      a. zaken, die kenlijk tot den eeredienst behooren of kenlijk afkomstig zijn van instellingen van weldadigheid;

      b. zaken, die met duidelijke omschrijving bij de bank als door diefstal verloren zijn aangegeven, behoudens
      schriftelijke machtiging van de burgemeester;

      c. zaken, behoorende tot de kleeding, uitrusting of wapening van een krijgsman beneden den rang van officier.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel5
  - number: '6'
    text: |-
      Burgemeester en wethouders zijn bevoegd, een of meer van de in [art. 4][ref1] genoemde onderwerpen, betreffende de
      ambtenaren van de bank, te regelen bij een of meer afzonderlijke reglementen. Met betrekking tot zoodanig reglement
      is van toepassing het bepaalde in [art. 3, lid 2 en 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001880#Artikel3
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001880
        artikel: '3'
  - number: '7'
    text: |-
      Indien hetgeen ingevolge het reglement ter zake van een beleening op een pandbewijs is vermeld niet overeenstemt
      met hetgeen te dier zake in het register is ingeschreven, beslist de inhoud van het pandbewijs, zoolang niet de
      valschheid of de vervalsching van het pandbewijs is bewezen.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel7
  - number: '8'
    text: |-
      1 Hetgeen de opbrengst van een pand meer bedraagt dan de beleensom en hetgeen ter zake van de beleening
      verschuldigd is, wordt aan den rechthebbende uitgekeerd, indien deze een daartoe strekkend verzoek doet binnen den
      in het reglement bepaalden termijn na den verkoop. Bij gebreke van tijdig verzoek vervalt dat bedrag aan de bank.

      2 Het op een pand geleden verlies wordt door de bank gedragen.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel8
  - number: '9'
    text: |-
      De bank is, behoudens het bepaalde in [art. 11][ref1], verplicht de panden tot de lossing of den verkoop te
      bewaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel11
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '11'
  - number: '10'
    text: |-
      Indien een pand door brand of diefstal verloren is gegaan, en de panden tegen brand- of diefstalschade zijn
      verzekerd, wordt hetgeen de krachtens de verzekering te vorderen vergoeding meer bedraagt dan de beleensom en
      hetgeen ter zake van de beleening verschuldigd is, aan den rechthebbende uitgekeerd, indien deze een daartoe
      strekkend verzoek doet binnen twaalf maanden na den dag, waarop het pand gelost had moeten worden.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel10
  - number: '11'
    text: |-
      1 In geval van onbevoegdheid van de pandgever is [artikel 238 lid 1 van Boek 3 van het Burgerlijk Wetboek][ref1]
      van toepassing, indien de bank te goeder trouw is op het tijdstip waarop de zaak in zijn macht is gebracht.

      2 Indien de bank op dat tijdstip niet te goeder trouw is of indien de zaak door diefstal is verloren, wordt de
      zaak, mits deze nog in de macht van de bank is, aan de eigenaar teruggegeven tegen betaling van de beleensom en van
      hetgeen ter zake van de belening is verschuldigd.

      3 Een zaak, die voor de aanneming tot pand met duidelijke omschrijving als door diefstal verloren bij de bank is
      aangegeven, wordt aan de eigenaar onvergolden teruggegeven, indien de afgifte binnen zes maanden na de aangifte
      wordt gevraagd en het pand nog in de macht van de bank is.

      4 Is het pand reeds verkocht op het tijdstip van de aanvraag, en is hetgeen de verkoopsom meer bedraagt dan
      de beleensom en hetgeen ter zake van de beleening verschuldigd is, nog niet aan den houder van het pandbewijs
      uitgekeerd, dan geschiedt de uitkeering aan den eigenaar.

      5 Het bestuur der bank kan borgstelling vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel238
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '238'
  - number: '12'
    text: |-
      1 Het pand strekt tot zekerheid uitsluitend van de schuld, voor welke het is verbonden en kan zonder toestemming
      van den pandgever niet strekken tot zekerheid van een andere schuld.

      2 Het pandbewijs geeft, behoudens in het geval, bedoeld in [art. 11][ref1], recht de lossing van het pand te
      vorderen tegen betaling van de beleensom en hetgeen ter zake van de beleening verschuldigd is.

      3 Indien ter lossing van het pand volstaan wordt met de enkele afgifte van kwijting, blijft de bank gedurende zes
      maanden na de lossing van het pand tot het bedrag van de geschatte waarde voor het pand aansprakelijk jegens de
      rechtmatige houder van het pandbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel11
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '11'
  - number: '13'
    text: Particuliere banken van leening worden niet gehouden dan na toelating door Burgemeester en Wethouders.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel13
  - number: '14'
    text: |-
      1 De toelating wordt schriftelijk gevraagd onder overlegging van een opgave van het perceel en de localiteiten,
      waarin de bank zal worden gehouden.

      2 Zij wordt alleen geweigerd, indien:

      a. te duchten is, dat de bank niet in overeenstemming met de bepalingen van deze wet of van plaatselijke
      verordeningen zal worden gehouden of overigens misbruiken ten nadeele van de beleeners zijn te duchten;

      b. de localiteiten, waarin de bank zal worden gehouden, niet voldoen aan eischen, daarvoor bij plaatselijke
      verordening gesteld.

      3 Het verzoek om toelating wordt binnen een week, nadat het is ingekomen, ter openbare kennis gebracht. Ieder kan
      tegen de inwilliging bezwaren bij Burgemeester en Wethouders inbrengen.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel14
  - number: '15'
    text: |-
      1 Binnen twee maanden wordt op het verzoek om toelating schriftelijk beschikt. Indien de toelating wordt verleend,
      wordt in het besluit opgenomen een omschrijving van de localiteiten, waarin de bank zal worden gehouden.

      2 De toelating geldt alleen voor de localiteiten in het besluit vermeld Zij geeft slechts bevoegdheid tot
      het houden van de bank door den toegelatene persoonlijk of voor en ten name van den toegelatene en onder zijn
      verantwoordelijkheid door een ander, die door hem daartoe schriftelijk gemachtigd is.

      3 De toelating geldt mede voor hem, die na het overlijden van den toegelatene het bedrijf voortzet, gedurende drie
      maanden na het overlijden, en, indien door hem binnen dien termijn toelating is gevraagd, tot de beschikking op
      zijn verzoek.

      4 De toelating vervalt, indien de toegelatene insolvent verklaard of onder curateele gesteld is.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel15
  - number: '17'
    text: |-
      Op of terzijde van elke deur, die toegang geeft tot het perceel, waarin de bank wordt gehouden, is, duidelijk
      zichtbaar, een wit bord aangebracht, waarop in zwarte letters van den openbaren weg duidelijk leesbaar is te lezen:
      "Pandhuis".
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel17
  - number: '18'
    text: |-
      In een uitsluitend daartoe bestemd register, waarvan de bladen door of van wege de burgemeester zijn gewaarmerkt,
      wordt op den dag der beleening achtereenvolgens zonder open vakken, tusschenregels of kantteekeningen, met
      betrekking tot ieder pand ingeschreven het nummer van het pand, het bedrag der geschatte waarde van het pand,
      de beleensom, een omschrijving van het pand en de dag der beleening. In dat register wordt bij ieder pand mede
      ingeschreven ingeval van lossing of van verkoop de datum daarvan en in geval van verkoop bovendien de opbrengst van
      den verkoop.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel18
  - number: '19'
    text: |-
      1 Voor iedere beleening wordt aan den pandgever een pandbewijs afgegeven; aan het pand wordt een dubbel van dat
      bewijs gehecht.

      2 De panden worden gedurende ieder kalenderjaar doorloopend genummerd.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel19
  - number: '20'
    text: |-
      Het pandbewijs houdt in:

      a. het nummer van het pand;

      b. een omschrijving van het pand, het bedrag van de geschatte waarde en de beleensom;

      c. den datum der beleening;

      d. den termijn, na welken, gerekend van den dag der beleening, het pand, indien het niet gelost is, verkocht kan
      worden;

      e. de vermelding, dat hetgeen het pand bij verkoop meer heeft opgebracht dan de beleensom en hetgeen ter zake
      van de beleening verschuldigd is, door den rechthebbende gedurende twaalf maanden na den verkoop kan worden
      opgevorderd.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel20
  - number: '21'
    text: |-
      1 De termijn, bedoeld in [art. 20, letter ][ref1], is niet korter dan zes maanden.

      2 Indien het pandbewijs de bepaling, bedoeld in [art. 20, letter ][ref2], niet inhoudt, is de pandnemer te allen
      tijde gehouden tot teruggave van het pand tegen ontvangst van de beleensom en hetgeen ter zake van de beleening
      verschuldigd is.

      3 Indien de houder van een bank van leening een pand, waarvan de lossing verlangd wordt met inachtneming van den
      termijn, bedoeld in [art. 20, letter ][ref3], of krachtens het bepaalde in het vorige lid, niet meer onder zijn
      macht heeft, is hij gehouden tot betaling aan den pandgever van hetgeen de geschatte waarde van het pand meer
      bedraagt dan de beleensom en hetgeen ter zake van de beleening verschuldigd is.

      4 Indien het vermelde op het pandbewijs niet overeenstemt met het vermelde in het register, beslist de inhoud van
      het pandbewijs, zoolang niet de valschheid of de vervalsching van het pandbewijs is bewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0001880#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0001880#Artikel20
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0001880
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0001880
        artikel: '20'
  - number: '22'
    text: |-
      1 Burgemeester en Wethouders kunnen een model voor het pandbewijs, bedoeld in [art. 20][ref1], vaststellen. Het
      besluit tot vaststelling wordt ter openbare kennis gebracht en aan de houders van banken van leening medegedeeld.

      2 Van den dertigsten dag af na den dag der mededeeling worden door hen geen andere pandbewijzen uitgereikt dan die
      zijn ingericht overeenkomstig het vastgestelde model.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel20
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '20'
  - number: '23'
    text: |-
      1 De panden worden door den houder van de bank tegen brand- en diefstalschade verzekerd.

      2 Indien Burgemeester en Wethouders de verzekering of het verzekerde bedrag onvoldoende achten, geven zij daarvan
      met redenen omkleed schriftelijk kennis aan den houder van de bank van leening, die binnen een maand aan de gerezen
      bezwaren tegemoet komt.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel23
  - number: '24'
    text: |-
      1 Verkoop van panden geschiedt in het openbaar na openbare aankondiging ten minste veertien dagen te voren, in een
      of meer nieuwsbladen van de gemeente, of, bij gebreke daarvan, in een of meer nieuwsbladen van naburige gemeenten,
      alsmede door aanplakking aan het gebouw van de bank. Bij die aankondiging worden vermeld de maanden, waarin de
      pandbewijzen, welke betrekking hebben op de panden, die verkocht zullen worden, zijn afgegeven. De panden worden
      vóór de verkooping tenminste één dag ter bezichtiging gesteld.

      2 De houder van de bank is verplicht te waken voor een ordelijken gang van de verkooping en er voor te zorgen, dat
      de bezichtiging van de panden behoorlijk kan plaats hebben.

      3 Een pand kan bij de verkooping worden opgehouden, indien het niet tenminste het bedrag van de beleensom en
      hetgeen ter zake van de beleening verschuldigd is, kan opbrengen. Het kan daarna ondershands worden verkocht.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel24
  - number: '25'
    text: |-
      1 Hetgeen de opbrengst van een pand meer bedraagt dan de beleensom en hetgeen ter zake van de beleening
      verschuldigd is, wordt aan den rechthebbende uitgekeerd, indien deze een daartoe strekkend verzoek doet binnen
      twaalf maanden na den verkoop. Bij gebreke van tijdig verzoek vervalt dat bedrag aan den houder van de bank.

      2 Het op een pand geleden verlies wordt door den houder van de bank gedragen.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel25
  - number: '26'
    text: |-
      Op Zondagen en algemeen erkende Christelijke feestdagen worden panden niet aangenomen of afgegeven en wordt geld
      niet verstrekt of in ontvangst genomen.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel26
  - number: '27'
    text: |-
      Van kinderen, die kenlijk den leeftijd van zestien jaren nog niet hebben bereikt, en van personen, in kenlijken
      staat van dronkenschap, worden panden of gelden niet aangenomen; aan die kinderen en personen worden panden of
      gelden niet verstrekt.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel27
  - number: '28'
    text: |-
      Tot pand worden niet aangenomen:

      a. zaken, die kenlijk tot den eeredienst behooren of kenlijk afkomstig zijn van instellingen van weldadigheid;

      b. zaken, die met duidelijke omschrijving bij den houder van de bank als door diefstal verloren zijn aangegeven,
      behoudens schriftelijke machtiging van de burgemeester;

      c. zaken, behoorende tot de kleeding, uitrusting of wapening van een krijgsman beneden den rang van officier.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel28
  - number: '29'
    text: |-
      De houder van de bank is, behoudens het bepaalde in [art. 33][ref1], verplicht de panden tot de lossing of den
      verkoop te bewaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel33
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '33'
  - number: '30'
    text: |-
      Indien een pand door brand of diefstal verloren is gegaan, wordt hetgeen de krachtens de verzekering te
      vorderen vergoeding meer bedraagt dan de beleensom en hetgeen ter zake van de beleening verschuldigd is, aan den
      rechthebbende uitgekeerd, indien deze een daartoe strekkend verzoek doet binnen twaalf maanden na den dag, waarop
      het pand gelost had moeten worden.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel30
  - number: '31'
    text: |-
      1 Schriftelijke aangifte van door diefstal verloren zaken wordt afzonderlijk bewaard gedurende tenminste een jaar.

      2 Van zoodanige aangifte wordt op verzoek terstond aan hem, die de aangifte deed, bewijs afgegeven, vermeldende de
      zaak, die als door diefstal verloren is aangegeven en dag en uur van aangifte.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel31
  - number: '32'
    text: |-
      1 Tot pand aangeboden zaken, die met duidelijke omschrijving als door diefstal verloren bij de bank zijn
      aangegeven, worden aangehouden.

      2 Daarvan wordt terstond kennis gegeven aan de burgemeester.

      3 De in het eerste lid bedoelde zaken worden niet afgegeven dan na schriftelijke machtiging van de burgemeester.

      4 Die zaken worden desverlangd aan de justitie verstrekt tegen bewijs van afgifte. Dat bewijs wordt afzonderlijk
      bewaard.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel32
  - number: '33'
    text: |-
      1 In geval van onbevoegdheid van de pandgever is [artikel 238 lid 1 van Boek 3 van het Burgerlijk Wetboek][ref1]
      van toepassing, indien de bank te goeder trouw is op het tijdstip waarop de zaak in zijn macht is gebracht.

      2 Indien de bank op dat tijdstip niet te goeder trouw is of indien de zaak door diefstal is verloren, wordt de
      zaak, mits deze nog in de macht van de bank is, aan de eigenaar teruggegeven tegen betaling van de beleensom en van
      hetgeen ter zake van de belening is verschuldigd.

      3 Een zaak, die voor de aanneming tot pand met duidelijke omschrijving als door diefstal verloren bij de bank is
      aangegeven, wordt aan de eigenaar onvergolden teruggegeven, indien de afgifte binnen zes maanden na de aangifte
      wordt gevraagd en het pand nog in de macht van de bank is.

      4 Is het pand reeds verkocht op het tijdstip van de aanvraag, en is hetgeen de verkoopsom meer bedraagt dan
      de beleensom en hetgeen ter zake van de beleening verschuldigd is, nog niet aan den houder van het pandbewijs
      uitgekeerd, dan geschiedt de uitkeering aan den eigenaar.

      5 De houder van de bank kan borgstelling vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel238
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '238'
  - number: '34'
    text: |-
      1 Het pand strekt tot zekerheid uitsluitend van de schuld, voor welke het is verbonden en kan zonder toestemming
      van den pandgever niet strekken tot zekerheid van een andere schuld.

      2 Het pandbewijs geeft behoudens in de gevallen, bedoeld in [art. 33, eerste en tweede lid][ref1], recht de lossing
      van het pand te vorderen tegen betaling van de beleensom en hetgeen ter zake van de beleening verschuldigd is.

      3 Indien ter lossing van het pand volstaan wordt met de enkele afgifte van kwijting, blijft de bank gedurende zes
      maanden na de lossing van het pand tot het bedrag van de geschatte waarde voor het pand aansprakelijk jegens de
      rechtmatige houder van het pandbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel33
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '33'
  - number: '35'
    text: |-
      1 Ter zake van een beleening mag niet anders worden gevorderd dan één bedrag, waarvan vooruitbetaling niet mag
      worden geëischt.

      2 Het is een bedrag ten honderd van de beleensom, met dien verstande dat een geldsom als minimum mag worden
      vastgesteld.

      3 Het bedrag ten honderd, bedoeld in het tweede lid, kan verschillend zijn naar gelang van de soort en de geschatte
      waarde der panden, van het bedrag der beleensom en van den duur der beleening.

      4 Bij de berekening van hetgeen verschuldigd is, wordt een onderdeel van een cent, dat minder is dan een halve
      cent, gerekend voor een halven cent; het wordt gerekend voor een cent, indien het meer is dan een halve cent.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel35
  - number: '36'
    text: |-
      1 In de localiteit of in de localiteiten, waarin de bank wordt gehouden, zijn gedrukte exemplaren, zonder
      bijschrijvingen, van de voorwaarden voor beleening aanwezig. Exemplaren worden op verzoek aan de pandgevers en aan
      de politie kosteloos uitgereikt.

      2 Die voorwaarden behelzen:

      a. het bedrag ten honderd, dat ter zake van een beleening verschuldigd is, met inachtneming van de in
      [art. 35, derde lid][ref1], toegelaten onderscheidingen, voor zoover zij gemaakt zijn, en het minimum, bedoeld in
      [art. 35, tweede lid][ref2], indien dat vastgesteld is;

      b. den termijn na welken, gerekend van den dag der beleening, het pand, indien het niet gelost is, verkocht kan
      worden;

      c. de vermelding, dat hetgeen het pand bij verkoop meer heeft opgebracht dan de beleensom en hetgeen ter zake
      van de beleening verschuldigd is, door den rechthebbende gedurende twaalf maanden na den verkoop kan worden
      opgevorderd;

      d. de dagen en de uren, gedurende welke de inrichting geopend is.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001880#Artikel35
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0001880
        artikel: '35'
  - number: '37'
    text: |-
      1 Burgemeester en wethouders kunnen bepalen:

      a. eischen, waaraan localiteiten, waarin een bank van leening zal worden gehouden, moeten voldoen, alvorens de
      toelating, bedoeld in [art. 13][ref1], kan worden verleend;

      b. een model voor het register, bedoeld in [art. 18][ref2];

      c. een maximum van hetgeen ingevolge [art. 35][ref3] gevorderd mag worden, met inachtneming van de in
      [art. 35, derde lid][ref4], toegelaten onderscheidingen;

      d. uren gedurende welke de banken van leening gesloten moeten zijn;

      e. dat in de localiteiten of in het perceel, waarin een bank van leening gehouden wordt, zekere beroepen of
      bedrijven niet of niet zonder toestemming van Burgemeester en Wethouders uitgeoefend mogen worden of zekere
      bezigheden niet of niet zonder toestemming van Burgemeester en Wethouders mogen geschieden;

      f. wat door den houder van een bank van leening moet worden gedaan ter wering van verspreiding van besmettelijke
      ziekten door panden.

      2 Een besluit, vastgesteld ingevolge het vorige lid, wordt ter openbare kennis gebracht en aan de houders van
      banken van leening medegedeeld. De houders van banken van leening zijn van den tweeden dag af na den dag der
      mededeeling gehouden tot naleving van een besluit als bedoeld onder letter *c* en *d* van het vorige lid; tot
      naleving van een besluit, als bedoeld onder letter *b*, *e* en *f* zijn zij gehouden van den dertigsten dag af na
      den dag der mededeeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001880#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0001880#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0001880#Artikel35
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0001880
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0001880
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0001880
        artikel: '35'
  - number: '38'
    text: |-
      1 Burgemeester en Wethouders doen ten minste eenmaal 's jaars en voorts zoo dikwijls zij dit noodig oordeelen door
      een of meer bij schriftelijke lastgeving aan te wijzen personen in de banken van leening een onderzoek instellen
      naar het beheer van de bank.

      2 De houders van de banken van leening verstrekken aan personen, voorzien van voormelde lastgeving, op verzoek alle
      ter zake van het in het eerste lid bedoelde onderzoek noodige inlichtingen of inzage van bescheiden.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel38
  - number: '39'
    text: |-
      Burgemeester en Wethouders zenden een schriftelijke waarschuwing aan den houder van een bank van leening, door
      of voor wien of in wiens bank wordt gehandeld in strijd met een van de bepalingen van deze wet, voor zoover tegen
      overtreding van die bepalingen niet bij de [artt. 49-52][ref1] straf is bedreigd, of in strijd met de bepalingen
      van een krachtens deze wet vastgestelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel49
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '49'
  - number: '40'
    text: |-
      De toelating van den houder van een bank van leening kan door Burgemeester en Wethouders worden ingetrokken:

      1°. indien omstandigheden zich voordoen op grond waarvan, indien zij vroeger bekend of te duchten geweest waren, de
      toelating zou zijn geweigerd;

      2°. indien blijkt, dat er binnen vijf jaren na de waarschuwing, bedoeld in [art. 39][ref1], andermaal termen zouden
      zijn voor toepassing van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel39
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '39'
  - number: '41'
    text: |-
      Indien de intrekking onherroepelijk is geworden, kan nieuwe toelating van denzelfden persoon niet plaats hebben
      vóór dat vijf jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel41
  - number: '42'
    text: |-
      1 Burgemeester en Wethouders brengen iedere onherroepelijk geworden intrekking van een toelating onverwijld ter
      openbare kennis en kondigen haar onverwijld af in een of meer nieuwsbladen van de gemeente of, bij gebreke daarvan,
      in een of meer nieuwsbladen van naburige gemeenten en door aanplakking aan het gebouw van de bank. De afkondiging
      in de nieuwsbladen wordt zoo spoedig mogelijk driemalen herhaald.

      2 Zij doen de ingevolge [art. 17][ref1] aangebrachte witte borden, nadat de intrekking onherroepelijk is geworden,
      onverwijld verwijderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel17
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '17'
  - number: '43'
    text: |-
      1 De houder van een bank van leening, wiens toelating is ingetrokken, kan gedurende zes maanden na de eerste
      bekendmaking het bedrijf voortzetten uitsluitend voor de lossing der panden.

      2 Indien de houder van de bank weigert mede te werken tot lossing van de panden, doen Burgemeester en Wethouders
      alle panden in beslag nemen en aan de houders van de pandbewijzen tegen vergoeding van voor het beslag gemaakte
      kosten terug geven.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel43
  - number: '44'
    text: |-
      1 Panden, die binnen zes maanden na de eerste bekendmaking, voorgeschreven in [art. 42][ref1], niet zijn gelost,
      worden binnen veertien dagen in het openbaar verkocht.

      2 Indien die verkoop niet binnen den bepaalden termijn heeft plaats gehad, dragen Burgemeester en Wethouders zorg
      dat hij alsnog plaats vinde. Zij zijn bevoegd, daartoe alles wat op het bedrijf betrekking heeft, in beslag te doen
      nemen of onder bewaking te doen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel42
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '42'
  - number: '45'
    text: |-
      1 De opbrengst van de ingevolge [art. 44][ref1] verkochte panden en hetgeen overeenkomstig het bepaalde in
      [art. 20 letter ][ref2] door den rechthebbende kan worden opgevorderd ter zake van panden, die vóór de intrekking
      van de toelating zijn verkocht, wordt gestort in de kas van den gemeente-ontvanger. Die bedragen en de storting
      worden door Burgemeester en Wethouders onverwijld ter openbare kennis gebracht en afgekondigd in een of meer
      nieuwsbladen van de gemeente of, bij gebreke daarvan, in een of meer nieuwsbladen van naburige gemeenten.

      2 Uit die gelden wordt, indien een daartoe strekkend verzoek binnen zes maanden na voormelde afkondiging wordt
      gedaan, aan de houders van pandbewijzen uitgekeerd hetgeen de opbrengst van het pand meer bedraagt dan de beleensom
      en hetgeen ter zake van de beleening verschuldigd is. Indien evenwel hetgeen in de kas van den gemeente-ontvanger
      wordt gestort terzake van panden, die vóór de intrekking van de toelating zijn verkocht, niet toereikend is om
      aan de rechthebbenden het hun toekomende uit te keeren, wordt het beschikbare bedrag naar evenredigheid van ieders
      vordering onder hen verdeeld.

      3 Uit hetgeen daarna overblijft worden de door Burgemeester en Wethouders bij de uitvoering van de [artt. 42][ref3]
      en [44][ref4] gemaakte kosten vergoed; het overige blijft gedurende een jaar na den verkoop der panden ter
      beschikking van hem, die de bank van leening gehouden heeft, of, indien deze overleden is, van zijne erfgenamen of
      rechtverkrijgenden, en vervalt, indien het door dezen niet binnen dien termijn is opgevorderd, aan de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0001880#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0001880#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0001880#Artikel44
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0001880
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0001880
        artikel: '42'
      - id: ref4
        bwb_id: BWBR0001880
        artikel: '44'
  - number: '46'
    text: |-
      1 Het bepaalde in de [artt. 42][ref1] en [44][ref2] is mede van toepassing indien de houder van een bank
      van leening insolvent verklaard of onder curateele gesteld is, met dien verstande, dat de in [art. 42][ref3]
      voorgeschreven bekendmaking en afkondiging en verwijdering van de borden door den curator wordt verricht en dat de
      lossing van panden geschiedt bij en de openbare verkoop door den curator.

      2 Hetgeen de opbrengst der door den curator en der vóór het vervallen van de toelating verkochte panden meer
      bedraagt dan de beleensom en hetgeen ter zake van de beleening verschuldigd is, wordt voor ieder pand in een
      nieuwsblad bekend gemaakt en blijft gedurende zes maanden ter beschikking van de pandgevers. Indien evenwel
      hetgeen ter beschikking van de pandgevers blijft ter zake van vóór het vervallen van de toelating verkochte panden
      niet toereikend is om aan de rechthebbenden het hun toekomende uit te keeren, wordt het beschikbare bedrag naar
      evenredigheid van ieders vordering onder hen verdeeld.

      3 Hetgeen binnen den in het tweede lid bepaalden termijn niet is opgevorderd, vervalt aan den boedel.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0001880#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0001880#Artikel42
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0001880
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0001880
        artikel: '42'
  - number: '47'
    text: |-
      De houders van banken van leening verleenen te allen tijde aan personen, voorzien van een schriftelijke lastgeving
      van Burgemeester en Wethouders tot binnentreden, toegang tot hun localiteiten.
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel47
  - number: '48'
    text: |-
      Hij, die behoudens het bepaalde in [art. 43, eerste lid][ref1], zonder de vereischte toelating een bank van leening
      houdt, wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel43
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '43'
  - number: '49'
    text: |-
      1 Hij, die opzettelijk onjuiste opgaven inschrijft in het register, bedoeld in [art. 18][ref1], wordt gestraft met
      hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie.

      2 Met gelijke straf wordt gestraft hij, die niet voldoet aan een verzoek, tot hem gericht ingevolge
      [art. 38, tweede lid][ref2], of die handelt in strijd met het bepaalde in [art. 47][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001880#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0001880#Artikel47
    url: https://wetten.overheid.nl/BWBR0001880/2012-10-01#Artikel49
    references:
