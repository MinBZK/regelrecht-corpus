        bwb_id: BWBR0001880
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001880
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0001880
        artikel: '47'
  - number: '50'
    text: |-
      Hij, die handelt in strijd met het bepaalde in de [artt. 26][ref1], [27][ref2] of [32][ref3] of met een besluit,
      vastgesteld ingevolge [art. 37, letter d, of e][ref4], of die nalaat, daartoe verplicht zijnde, het bewijs af te
      geven, bedoeld in [art. 31, tweede lid][ref5], wordt gestraft met geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0001880#Artikel27
