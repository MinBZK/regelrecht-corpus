        paragraaf: '3.7'
  - number: '5'
    text: |-
      Een aanvraag als bedoeld in [artikel 3, eerste lid][ref1], wordt afgewezen, indien de proeve van bekwaamheid, dan
      wel de aanpassingsstage, bedoeld in [artikel 4][ref2], als onvoldoende zijn beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0024144#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024144#Artikel4
    url: https://wetten.overheid.nl/BWBR0024144/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024144
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024144
        artikel: '4'
  - number: '6'
    text: |-
      Een dienstverrichter als bedoeld in [artikel 21 van de wet][ref1] overlegt voorafgaand aan de eerste
      dienstverrichting:

      a. de documenten bedoeld in [artikel 23, derde lid, onderdeel a, c en d, van de wet][ref2], en

      b. een geldige geneeskundige verklaring als bedoeld in
      [artikel 31, eerste lid, van de Wet bemanning zeeschepen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0050681#Artikel31
    url: https://wetten.overheid.nl/BWBR0024144/2025-07-01#Artikel6
