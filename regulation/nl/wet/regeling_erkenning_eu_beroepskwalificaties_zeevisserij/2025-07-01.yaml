preamble:
  text: |-
    Gelet op richtlijn nr. 2005/36/EG van het Europees Parlement en de Raad van de Europese Unie van 7 september 2005
    betreffende de erkenning van beroepskwalificaties (PbEU L 255) en artikel 33, eerste en tweede lid, van de Algemene
    wet erkenning EG-beroepskwalificaties;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024144/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      derde land: een andere staat dan Zwitserland, een lidstaat van de Europese Unie of een andere staat die behoort tot
      de Europese Economische Ruimte;

      Minister: Minister van Infrastructuur en Milieu;

      wet: [Algemene wet erkenning EU-beroepskwalificaties][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0024144/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023066
  - number: '2'
    text: |-
      Deze regeling is van toepassing op een aanvraag van een migrerende beroepsbeoefenaar tot het verkrijgen van
      erkenning van beroepskwalificaties voor de toegang tot de uitoefening van de gereglementeerde beroepen, genoemd in
      [artikel 23, eerste lid, van de Wet bemanning zeeschepen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel23
    url: https://wetten.overheid.nl/BWBR0024144/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0050681
        artikel: '23'
  - number: '3'
    text: |-
      1 Een aanvraag tot het verkrijgen van erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de wet][ref1] wordt ingediend bij de Minister.

      2 Bij de aanvraag overlegt de aanvrager:

      a. de documenten, bedoeld in [artikel 13, eerste lid, onderdelen a, b en c, van de wet][ref2], en

      b. een geldige geneeskundige verklaring als bedoeld in
      [artikel 31, eerste lid, van de Wet bemanning zeeschepen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0050681#Artikel31
    url: https://wetten.overheid.nl/BWBR0024144/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0050681
        artikel: '31'
  - number: '4'
    text: |-
      1 De aanvrager maakt zijn keuze voor een proeve van bekwaamheid of een aanpassingsstage binnen een daartoe door de
      Minister gestelde termijn kenbaar.

      2 Indien de aanvrager een opleidingstitel afkomstig uit een derde land heeft overgelegd, maakt, in afwijking van
      het eerste lid, de Minister zijn keuze voor een proeve van bekwaamheid of een aanpassingsstage kenbaar binnen 4
      weken na ontvangst van de aanvraag, bedoeld in [artikel 3, eerste lid][ref1].

      3 De Minister stelt vast in overeenstemming met welke examenvakken de aanvrager de proeve van bekwaamheid aflegt
      of met betrekking tot welke vakken de aanvrager de aanpassingsstage doorloopt, alsmede de termijn waarbinnen dit
      geschiedt.

      4 De proeve van bekwaamheid wordt afgelegd bij een door de Minister aan te wijzen opleidingsinstituut als bedoeld
      in [paragraaf 3.7 van de Regeling bemanning zeeschepen][ref2]. Het opleidingsinstituut beoordeelt de proeve van
      bekwaamheid aan de hand van de voor het desbetreffende beroep in Nederland geldende exameneisen.

      5 Een door de Minister aan te wijzen opleidingsinstituut als bedoeld in
      [paragraaf 3.7 van de Regeling bemanning zeeschepen][ref3] beoordeelt of de aanvrager, na het doorlopen van de
      aanpassingsstage, de door de Minister vastgestelde vakken, bedoeld in het derde lid, in voldoende mate beheerst.


      [ref1]: https://wetten.overheid.nl/BWBR0024144#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0051068#Paragraaf3.7
      [ref3]: https://wetten.overheid.nl/BWBR0051068#Paragraaf3.7
    url: https://wetten.overheid.nl/BWBR0024144/2025-07-01#Artikel4
    references:
      - id: ref1
