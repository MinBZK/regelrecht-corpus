---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_opleiding_en_examen_bevoegdverklaringen_aml_en_jar_66_aml
regulatory_layer: WET
publication_date: '2008-10-24'
valid_from: '2006-01-28'
bwb_id: BWBR0012925
url: https://wetten.overheid.nl/BWBR0012925/2006-01-28
preamble:
  text: |-
    Gelet op de artikelen 13, eerste lid, 14, derde lid, 15, derde lid en 16 van het Besluit bewijzen van bevoegdheid
    voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De minister kan een opleidingsinstelling voor het examen ten aanzien van de basiskennis of de typekennis
      registreren.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel1
  - number: '2'
    text: |-
      Een aanvraag voor registratie wordt ingediend door middel van een door de minister verstrekt aanvraagformulier,
      onder bijsluiting van de volgende bescheiden:
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel2
  - number: 2.a
    text: een overzicht van het bij de opleiding betrokken leidinggevend en onderwijzend personeel;
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel2
  - number: 2.b
    text: de curricula vitae van het personeel bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel2
  - number: 2.c
    text: een overzicht van de voor de opleiding gebruikte theorie- en praktijkruimten;
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel2
  - number: 2.d
    text: |-
      een kruisverwijzing van het examen conform de eisen volgens JAR-66 of de bijlagen 70 tot en met 77 bij deze
      regeling, inzake basiskennis of typekennis, naar het leerplan en de leermiddelen van de opleiding;
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel2
  - number: 2.e
    text: een beschrijving van het door de opleidingsinstelling gebruikte beoordelingsregistratiesysteem, en
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel2
  - number: 2.f
    text: |-
      indien van toepassing, een overzicht en de curricula vitae van de personen die door en namens de
      opleidingsinstelling worden voorgedragen voor de examencommissie, bedoeld in het [zesde artikel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel6
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '6'
        hoofdstuk: '2'
  - number: '3'
    text: |-
      Een opleidingsinstelling wordt geregistreerd indien er opleidingen voor het examen conform de eisen van JAR-66 of
      de bijlagen 70 tot en met 77 bij deze regeling, inzake basis- of typekennis worden verzorgd en nadat is aangetoond
      dat wordt voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel3
  - number: 3.a
    text: voldoende en geschikt personeel;
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel3
  - number: 3.b
    text: voldoende en geschikte theorie- en praktijkruimten;
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel3
  - number: 3.c
    text: |-
      een leerplan dat een duidelijk overzicht van de leerstof omvat, alsmede het vereiste aantal lesuren en de verdeling
      over de voor de opleiding beschikbare tijd;
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel3
  - number: 3.d
    text: voldoende en geschikte leermiddelen, en
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel3
  - number: 3.e
    text: |-
      een beoordelingsregistratiesysteem waarmee de resultaten van de cursisten op overzichtelijke wijze worden
      bijgehouden en bewaard tot tenminste 2 jaar na het door cursisten beëindigen van de opleiding.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel3
  - number: '4.1'
    text: |-
      Van de registratie wordt aan de opleidingsinstelling een bewijs afgegeven waarop de opleiding waarop de registratie
      van toepassing is, is vermeld.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel4
  - number: '4.2'
    text: |-
      Registratie van de opleidingsinstelling vindt plaats voor één cohort deelnemers en wordt vervolgens steeds
      stilzwijgend per cohort verlengd.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel4
  - number: '5.1'
    text: |-
      Wanneer de opleiding wordt gewijzigd of beëindigd, alsmede ingeval van wijzigingen ten aanzien van het personeel,
      de faciliteiten, het leerplan, de leermiddelen of het beoordelingsregistratiesysteem ten behoeve van deze
      opleiding, stelt de geregistreerde opleidingsinstelling de minister hiervan per omgaande in kennis.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel5
  - number: '5.2'
    text: |-
      De registratie kan geheel of gedeeltelijk worden ingetrokken ingeval de opleidingsinstelling verzuimt de minister
      in kennis te stellen van wijzigingen bedoeld in het eerste lid, alsmede in geval deze wijzigingen tot gevolg hebben
      dat niet langer wordt voldaan aan [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel3
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '3'
        hoofdstuk: '1'
  - number: '5.3'
    text: |-
      De gehele of gedeeltelijke intrekking van de registratie van de opleidingsinstelling door de minister wordt bij
      aangetekende brief aan de opleidingsinstelling medegedeeld.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel5
  - number: '6'
    text: |-
      De examencommissie voor onderhoudstechnici in de luchtvaart is bevoegd tot het afnemen van het examen waarmee
      wordt aangetoond dat wordt voldaan aan de eisen inzake basiskennis of typekennis voor afgifte van de bijzondere
      bevoegdverklaringen die kunnen worden vermeld op een AML of een JAR-66 AML.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel6
  - number: '7.1'
    text: |-
      De minister stelt ten minste eenmaal per twee jaar het aantal examinatoren vast en biedt gelegenheid aan erkende
      onderhoudsorganisaties, erkende en geregistreerde opleidingsinstellingen, examinatoren en de voorzitter, bij een
      vacature personen voor te dragen.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel7
  - number: '7.2'
    text: |-
      De minister kan een voorgedragen persoon voor ten hoogste twee jaren autoriseren als examinator, nadat is
      aangetoond, dat hij of zij beschikt over de kennis, ervaring en bekwaamheid die voor het afnemen van het examen
      relevant is.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel7
  - number: '7.3'
    text: De minister benoemt de voorzitter en de secretaris. De secretaris vervangt de voorzitter bij diens afwezigheid.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel7
  - number: '7.4'
    text: De voorzitter roept de examencommissie ten minste eenmaal per jaar bijeen.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel7
  - number: '8.1'
    text: Een examinator heeft recht op een vergoeding voor de door hem verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel8
  - number: '8.2'
    text: 'De vergoeding, bedoeld in het eerste lid, is samengesteld uit:'
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel8
  - number: 8.2.a
    text: |-
      een honorarium voor het examen basisbevoegdheden, bestaande uit € 50 per gemaakte examenset, € 25 per uur voor bij
      het examen vereiste aanwezigheid en € 5 per beoordeeld examenresultaat;
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel8
  - number: 8.2.b
    text: |-
      een honorarium voor het examen typebevoegdheden, bestaande uit € 400 per voorbereiding van een type-examen en € 25
      per uur voor het afnemen van het examen;
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel8
  - number: 8.2.c
    text: |-
      een vergoeding volgens het [Reisbesluit binnenland][ref1] voor gemaakte reis- en verblijfkosten voor alle
      werkzaamheden ten behoeve van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005889
  - number: '8.3'
    text: |-
      De voorzitter en de secretaris kunnen bij de minister een vergoeding voor de verrichte werkzaamheden declareren. De
      vergoeding bedraagt voor:
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel8
  - number: 8.3.a
    text: de voorzitter € 40 per uur voor alle werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel8
  - number: 8.3.b
    text: de secretaris € 25 per uur voor alle werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel8
  - number: '8.4'
    text: |-
      Het eerste lid is niet van toepassing op de in het eerste en derde lid bedoelde personen, die rijksambtenaar zijn
      en de desbetreffende werkzaamheden verrichtten tijdens diensttijd.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel8
  - number: '8.5'
    text: |-
      In afwijking van het eerste lid wordt aan examinatoren die door de minister zijn geautoriseerd op voordracht
      van een geregistreerde opleidingsinstelling, geen vergoeding verstrekt, wanneer het examen wordt afgenomen van
      deelnemers van die opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel8
  - number: '9'
    text: |-
      De examinator is verplicht tot geheimhouding met betrekking tot de examenopgaven en de overige gegevens waarvan de
      vertrouwelijke aard is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel9
  - number: '10.1'
    text: |-
      De autorisatie kan worden geschorst wanneer een ernstig vermoeden bestaat dat de examinator in strijd heeft
      gehandeld met het bepaalde in [artikel 9][ref1], of het examenreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel9
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '9'
        hoofdstuk: '2'
  - number: '10.2'
    text: |-
      De autorisatie kan worden ingetrokken wanneer de examinator in strijd heeft gehandeld met het bepaalde in
      [artikel 9][ref1], of het examenreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel9
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '9'
        hoofdstuk: '2'
  - number: '10.3'
    text: De minister informeert de examinator over schorsing of intrekking van de autorisatie per aangetekende brief.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel10
  - number: '11.1'
    text: Ten behoeve van het examen wordt door de examencommissie een examenreglement opgesteld.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel11
  - number: '11.2'
    text: Het examenreglement wordt ter vaststelling voorgelegd aan de minister.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel11
  - number: '12.1'
    text: |-
      Het examen voor de volgende bevoegdverklaringen op een AML waarmee wordt aangetoond dat wordt voldaan aan de
      eisen inzake basiskennis voor afgifte van die bevoegdverklaringen, is vastgelegd in de bij deze regeling behorende
      bijlagen 70 tot en met 77 en [tabellen 1][ref1] en [2][ref2], volgens het onderstaande schema:







                    **Bevoegdverklaring**


                    **Basiskennis**


                    **Examen**




                    AB1Z/T


                    bijlage 70


                    tabel 1




                    AB2Z/T


                    bijlage 71


                    tabel 1




                    AB3Z/T


                    bijlage 72


                    tabel 1




                    C(E)F


                    bijlage 73


                    tabel 1




                    DG


                    bijlage 74


                    tabel 1




                    A


                    bijlage 75


                    tabel 2




                    B


                    bijlage 76


                    tabel 2




                    C


                    bijlage 77


                    tabel 2


      [ref1]: https://wetten.overheid.nl/BWBR0012925
      [ref2]: https://wetten.overheid.nl/BWBR0012925
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012925
      - id: ref2
        bwb_id: BWBR0012925
  - number: '12.2'
    text: |-
      Wanneer de examenkandidaat houder is van een AML, omvat het examen bedoeld in het eerste lid, de modules zoals
      opgenomen in de bij deze regeling behorende [tabel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012925
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012925
  - number: '12.3'
    text: |-
      Het examen bedoeld in het eerste lid is met goed gevolg afgelegd wanneer de examinandus in ten hoogste twee jaren
      voor iedere module ten minste het cijfer 6,0 heeft behaald.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel12
  - number: '12.4'
    text: |-
      Het examen typebevoegdheid wordt afgelegd op basis van de onderhoudsdocumentatie van het vliegtuigtype, waarvoor
      examen wordt afgelegd. De examenkandidaat biedt daartoe de examencommissie inzage in die documentatie, die geheel
      bijgewerkt dient te zijn.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel12
  - number: '12.5'
    text: |-
      De wijze van examineren en de duur van het examen, bedoeld in het vierde lid, is opgenomen in [tabel 4][ref1]. Het
      examen typebevoegdheid is met goed gevolg afgelegd wanneer de examinandus het cijfer 6,0 of hoger heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012925
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012925
  - number: '13.1'
    text: |-
      Het examen voor de bevoegdverklaringen op een JAR-66 AML, waarmee wordt aangetoond dat wordt voldaan aan de
      eisen inzake basiskennis voor afgifte van die bevoegdverklaringen, is vastgelegd in JAR-66 Certifying Staff
      Maintenance, Section 2 - Acceptable Means of Compliance and Interpretative / Explanatory Material, Appendix 1 en
      JAA Administrative & Guidance Material, Section 2 - Maintenance, Part 2 - Procedures, Chapter 23.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel13
  - number: '13.2'
    text: |-
      Wanneer de examenkandidaat houder is van een JAR-66 AML omvat het examen, bedoeld in het eerste lid, de modules
      opgenomen in de bij deze regeling behorende [tabel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012925
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012925
  - number: '13.3'
    text: |-
      De procedures overeenkomstig JAA Administrative & Guidance Material, Section 2: Maintenance, Part 2: Procedures,
      Chapter 23 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel13
  - number: '14.1'
    text: Als regel wordt tweemaal per jaar gelegenheid gegeven tot het afleggen van het examen.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel14
  - number: '14.2'
    text: |-
      In afwijking van het eerste lid kan, wanneer in een jaar het aantal examenkandidaten minder dan 10 bedraagt, de
      voorzitter besluiten dat in het daaropvolgende jaar slechts eenmaal gelegenheid wordt gegeven tot het afleggen van
      het examen.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel14
  - number: '14.3'
    text: |-
      De voorzitter stelt na consultatie van de examencommissie de plaats, datum en tijd van het examen vast en
      publiceert deze op de internet website www.ivw.nl van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel14
  - number: '14.4'
    text: |-
      In afwijking van het derde lid kan een examinator die door de minister is geautoriseerd op voordracht van
      een geregistreerde opleidingsinstelling na instemming van de voorzitter het examen van de deelnemers van die
      opleidingsinstelling afnemen op een door hem vastgestelde plaats, datum en tijd.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel14
  - number: '15.1'
    text: Aanmelding voor het examen vindt plaats bij de secretaris van de examencommissie.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel15
  - number: '15.2'
    text: Een ieder, die daartoe een aanvraag indient, wordt met inachtneming van het derde lid tot het examen toegelaten.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel15
  - number: '15.3'
    text: |-
      Toelating vindt plaats nadat de kosten volgens de Regeling tarieven luchtvaart zijn vergoed en de examinandus een
      wettig en geldig legitimatiebewijs heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel15
  - number: '15.4'
    text: |-
      In afwijking van het eerste, tweede en derde lid behoeft geen aanvraag te worden ingediend en geen vergoeding van
      de kosten plaats te vinden wanneer sprake is van een examen bedoeld in [artikel 14, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel14
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '14'
        hoofdstuk: '3'
  - number: '16.1'
    text: |-
      De examinandus kan door de examinator van verdere deelname aan het examen worden uitgesloten indien deze in strijd
      handelt met het reglement, bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel11
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '11'
        hoofdstuk: '3'
  - number: '16.2'
    text: De voorzitter wordt door de examinator over een uitsluiting, bedoeld in het eerste lid, geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel16
  - number: '17.1'
    text: |-
      Het examenresultaat wordt als regel beoordeeld door de examinator die het examen heeft afgenomen. De voorzitter is
      evenwel bevoegd een andere examinator voor de beoordeling van het examenresultaat aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel17
  - number: '17.2'
    text: |-
      De uitslag van het examen wordt namens de minister vastgesteld door de beoordelende examinator met instemming van
      de voorzitter. Bij een uitsluiting bedoeld in [artikel 16, het eerste lid][ref1], wordt als uitslag van het examen
      het cijfer 1,0 of 0% vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel16
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '16'
        hoofdstuk: '3'
  - number: '17.3'
    text: |-
      De uitslag van het examen wordt uiterlijk zes weken nadat het examen is afgelegd schriftelijk aan de examinandus
      bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel17
  - number: '18'
    text: Deze regeling treedt in werking met ingang van 1 november 2001 en werkt terug tot en met 1 oktober 2001.
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel18
  - number: '19'
    text: 'Deze regeling wordt aangehaald als: Regeling opleiding en examen bevoegdverklaringen AML en JAR-66 AML.'
    url: https://wetten.overheid.nl/BWBR0012925/2006-01-28#Artikel19
