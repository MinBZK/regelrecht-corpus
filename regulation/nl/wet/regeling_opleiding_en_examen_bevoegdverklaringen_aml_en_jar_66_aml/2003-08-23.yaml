preamble:
  text: |-
    Gelet op de artikelen 13, eerste lid, 14, derde lid, 15, derde lid en 16 van het Besluit bewijzen van bevoegdheid
    voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De minister kan een opleidingsinstelling voor het examen ten aanzien van de basiskennis of de typekennis
      registreren.
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel1
  - number: '2'
    text: |-
      Een aanvraag voor registratie wordt ingediend door middel van een door de minister verstrekt aanvraagformulier,
      onder bijsluiting van de volgende bescheiden:

      a. een overzicht van het bij de opleiding betrokken leidinggevend en onderwijzend personeel;

      b. de curricula vitae van het personeel bedoeld onder a;

      c. een overzicht van de voor de opleiding gebruikte theorie- en praktijkruimten;

      d. een kruisverwijzing van het examen conform de eisen volgens JAR-66 of de bijlagen 70 tot en met 77 bij deze
      regeling, inzake basiskennis of typekennis, naar het leerplan en de leermiddelen van de opleiding;

      e. een beschrijving van het door de opleidingsinstelling gebruikte beoordelingsregistratiesysteem, en

      f. indien van toepassing, een overzicht en de curricula vitae van de personen die door en namens de
      opleidingsinstelling worden voorgedragen voor de examencommissie, bedoeld in het [zesde artikel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel6
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '6'
        hoofdstuk: '2'
  - number: '3'
    text: |-
      Een opleidingsinstelling wordt geregistreerd indien er opleidingen voor het examen conform de eisen van JAR-66 of
      de bijlagen 70 tot en met 77 bij deze regeling, inzake basis- of typekennis worden verzorgd en nadat is aangetoond
      dat wordt voldaan aan de volgende voorwaarden:

      a. voldoende en geschikt personeel;

      b. voldoende en geschikte theorie- en praktijkruimten;

      c. een leerplan dat een duidelijk overzicht van de leerstof omvat, alsmede het vereiste aantal lesuren en de
      verdeling over de voor de opleiding beschikbare tijd;

      d. voldoende en geschikte leermiddelen, en

      e. een beoordelingsregistratiesysteem waarmee de resultaten van de cursisten op overzichtelijke wijze worden
      bijgehouden en bewaard tot tenminste 2 jaar na het door cursisten beëindigen van de opleiding.
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel3
  - number: '4'
    text: |-
      1 Van de registratie wordt aan de opleidingsinstelling een bewijs afgegeven waarop de opleiding waarop de
      registratie van toepassing is, is vermeld.

      2 Registratie van de opleidingsinstelling vindt plaats voor één cohort deelnemers en wordt vervolgens steeds
      stilzwijgend per cohort verlengd.
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel4
  - number: '5'
    text: |-
      1 Wanneer de opleiding wordt gewijzigd of beëindigd, alsmede ingeval van wijzigingen ten aanzien van het personeel,
      de faciliteiten, het leerplan, de leermiddelen of het beoordelingsregistratiesysteem ten behoeve van deze
      opleiding, stelt de geregistreerde opleidingsinstelling de minister hiervan per omgaande in kennis.

      2 De registratie kan geheel of gedeeltelijk worden ingetrokken ingeval de opleidingsinstelling verzuimt de minister
      in kennis te stellen van wijzigingen bedoeld in het eerste lid, alsmede in geval deze wijzigingen tot gevolg hebben
      dat niet langer wordt voldaan aan [artikel 3][ref1].

      3 De gehele of gedeeltelijke intrekking van de registratie van de opleidingsinstelling door de minister wordt bij
      aangetekende brief aan de opleidingsinstelling medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel3
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '3'
        hoofdstuk: '1'
  - number: '6'
    text: |-
      De examencommissie voor onderhoudstechnici in de luchtvaart is bevoegd tot het afnemen van het examen waarmee
      wordt aangetoond dat wordt voldaan aan de eisen inzake basiskennis of typekennis voor afgifte van de bijzondere
      bevoegdverklaringen die kunnen worden vermeld op een AML of een JAR-66 AML.
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel6
  - number: '7'
    text: |-
      1 Tenminste eenmaal per twee jaar stelt de minister het aantal examinatoren vast en biedt gelegenheid aan erkende
      onderhoudsorganisaties en erkende en geregistreerde opleidingsinstellingen personen voor te dragen voor de ontstane
      vacatures.

      2 De minister kan een voorgedragen persoon voor ten hoogste twee jaren autoriseren als examinator, nadat is
      aangetoond, dat hij of zij beschikt over de kennis, ervaring en bekwaamheid die voor het afnemen van het examen
      relevant is.

      3 Aan de examencommissie worden door de minister ambtenaren toegevoegd als voorzitter en secretaris. De secretaris
      vervangt de voorzitter bij afwezigheid.

      4 De voorzitter roept de examencommissie ten minste eenmaal per jaar bijeen.
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel7
  - number: '8'
    text: |-
      1 Een examinator kan bij de minister een vergoeding voor een afgenomen examen declareren.

      2 De vergoeding bedoeld in het eerste lid bestaat uit:

      a. een honorarium van 23 Euro (f 50,68) per uur voor bij het examen vereiste aanwezigheid en 4,50 Euro (f 9,92) per
      beoordeeld examenresultaat, met dien verstande dat dit honorarium per examen tenminste 91 Euro (f 200,54) en ten
      hoogste 182 Euro (f 401,08) bedraagt, en

      b. de voor het afnemen van het examen gemaakte reis- en verblijfskosten volgens het [Reisbesluit binnenland][ref1],
      met dien verstande dat voor de reis- en verblijfskosten per examen ten hoogste 182 Euro (f 401,08) wordt vergoed.

      3 In afwijking van het eerste lid wordt aan examinatoren die door de minister zijn geautoriseerd op voordracht
      van een geregistreerde opleidingsinstelling, geen vergoeding verstrekt, wanneer het examen wordt afgenomen van
      deelnemers van die opleidingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005889
  - number: '9'
    text: |-
      De examinator is verplicht tot geheimhouding met betrekking tot de examenopgaven en de overige gegevens waarvan de
      vertrouwelijke aard is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel9
  - number: '10'
    text: |-
      1 De autorisatie kan worden geschorst wanneer een ernstig vermoeden bestaat dat de examinator in strijd heeft
      gehandeld met het bepaalde in [artikel 9][ref1], of het examenreglement.

      2 De autorisatie kan worden ingetrokken wanneer de examinator in strijd heeft gehandeld met het bepaalde in
      [artikel 9][ref2], of het examenreglement.

      3 De minister informeert de examinator over schorsing of intrekking van de autorisatie per aangetekende brief.


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0012925#Artikel9
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0012925
        artikel: '9'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      1 Ten behoeve van het examen wordt door de examencommissie een examenreglement opgesteld.

      2 Het examenreglement wordt ter vaststelling voorgelegd aan de minister.
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel11
  - number: '12'
    text: |-
      1 Het examen voor de volgende bevoegdverklaringen op een AML waarmee wordt aangetoond dat wordt voldaan aan de
      eisen inzake basiskennis voor afgifte van die bevoegdverklaringen, is vastgelegd in de bij deze regeling behorende
      bijlagen 70 tot en met 77 en [tabellen 1][ref1] en [2][ref2], volgens het onderstaande schema:









                    **Bevoegdverklaring**


                    **Basiskennis**


                    **Examen**




                    AB1Z/T


                    bijlage 70


                    tabel 1




                    AB2Z/T


                    bijlage 71


                    tabel 1




                    AB3Z/T


                    bijlage 72


                    tabel 1




                    C(E)F


                    bijlage 73


                    tabel 1




                    DG


                    bijlage 74


                    tabel 1




                    A


                    bijlage 75


                    tabel 2




                    B


                    bijlage 76


                    tabel 2




                    C


                    bijlage 77


                    tabel 2






      2 Wanneer de examenkandidaat houder is van een AML, omvat het examen bedoeld in het eerste lid, de modules zoals
      opgenomen in de bij deze regeling behorende [tabel 3][ref3].

      3 Het examen bedoeld in het eerste lid is met goed gevolg afgelegd wanneer de examinandus in ten hoogste twee jaren
      voor iedere module ten minste het cijfer 6,0 heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012925
      [ref2]: https://wetten.overheid.nl/BWBR0012925
      [ref3]: https://wetten.overheid.nl/BWBR0012925
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012925
      - id: ref2
        bwb_id: BWBR0012925
      - id: ref3
        bwb_id: BWBR0012925
  - number: '13'
    text: |-
      1 Het examen voor de bevoegdverklaringen op een JAR-66 AML, waarmee wordt aangetoond dat wordt voldaan aan de
      eisen inzake basiskennis voor afgifte van die bevoegdverklaringen, is vastgelegd in JAR-66 Certifying Staff
      Maintenance, Section 2 - Acceptable Means of Compliance and Interpretative / Explanatory Material, Appendix 1 en
      JAA Administrative & Guidance Material, Section 2 - Maintenance, Part 2 - Procedures, Chapter 23.

      2 Wanneer de examenkandidaat houder is van een JAR-66 AML omvat het examen, bedoeld in het eerste lid, de modules
      opgenomen in de bij deze regeling behorende [tabel 4][ref1].

      3 De procedures overeenkomstig JAA Administrative & Guidance Material, Section 2: Maintenance, Part 2: Procedures,
      Chapter 23 zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012925
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012925
  - number: '14'
    text: |-
      1 Als regel wordt tweemaal per jaar gelegenheid gegeven tot het afleggen van het examen.

      2 In afwijking van het eerste lid kan, wanneer in een jaar het aantal examenkandidaten minder dan 10 bedraagt, de
      voorzitter besluiten dat in het daaropvolgende jaar slechts eenmaal gelegenheid wordt gegeven tot het afleggen van
      het examen.

      3 De voorzitter stelt na consultatie van de examencommissie de plaats, datum en tijd van het examen vast en
      publiceert deze in een Aeronautical Information Circular Series B.

      4 In afwijking van het derde lid kan een examinator die door de minister is geautoriseerd op voordracht van
      een geregistreerde opleidingsinstelling na instemming van de voorzitter het examen van de deelnemers van die
      opleidingsinstelling afnemen op een door hem vastgestelde plaats, datum en tijd.
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel14
  - number: '15'
    text: |-
      1 Aanmelding voor het examen vindt plaats bij de secretaris van de examencommissie.

      2 Een ieder, die daartoe een aanvraag indient, wordt met inachtneming van het derde lid tot het examen toegelaten.

      3 Toelating vindt plaats nadat de kosten volgens de Regeling tarieven luchtvaart zijn vergoed en de examinandus een
      wettig en geldig legitimatiebewijs heeft overgelegd.

      4 In afwijking van het eerste, tweede en derde lid behoeft geen aanvraag te worden ingediend en geen vergoeding van
      de kosten plaats te vinden wanneer sprake is van een examen bedoeld in [artikel 14, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel14
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '14'
        hoofdstuk: '3'
  - number: '16'
    text: |-
      1 De examinandus kan door de examinator van verdere deelname aan het examen worden uitgesloten indien deze in
      strijd handelt met het reglement, bedoeld in [artikel 11][ref1].

      2 De voorzitter wordt door de examinator over een uitsluiting, bedoeld in het eerste lid, geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel11
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '11'
        hoofdstuk: '3'
  - number: '17'
    text: |-
      1 Het examenresultaat wordt als regel beoordeeld door de examinator die het examen heeft afgenomen. De voorzitter
      is evenwel bevoegd een andere examinator voor de beoordeling van het examenresultaat aan te wijzen.

      2 De uitslag van het examen wordt namens de minister vastgesteld door de beoordelende examinator met instemming van
      de voorzitter. Bij een uitsluiting bedoeld in [artikel 16, het eerste lid][ref1], wordt als uitslag van het examen
      het cijfer 1,0 of 0% vastgesteld.

      3 De uitslag van het examen wordt uiterlijk zes weken nadat het examen is afgelegd schriftelijk aan de examinandus
      bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0012925#Artikel16
    url: https://wetten.overheid.nl/BWBR0012925/2003-08-23#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012925
        artikel: '16'
        hoofdstuk: '3'
