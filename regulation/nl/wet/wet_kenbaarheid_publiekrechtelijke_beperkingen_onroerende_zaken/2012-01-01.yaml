  - number: 17c
    text: |-
      De inschrijving van een beperkingenbesluit als bedoeld in [artikel 3, eerste of tweede lid][ref1], dat dateert van
      voor het tijdstip van de inwerkingtreding van deze wet en de grondslag vormt voor een op dat tijdstip niet meer van
      kracht zijnde publiekrechtelijke beperking, alsmede een op dat beperkingenbesluit betrekking hebbende beslissing in
      administratief beroep of rechterlijke uitspraak, blijft achterwege.


