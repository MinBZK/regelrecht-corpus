  - number: '7'
    text: |-
      1 Burgemeester en wethouders dragen er zorg voor dat een beperkingenbesluit, een daarop betrekking hebbende
      beslissing in administratief beroep of een rechterlijke uitspraak als bedoeld in [artikel 3, eerste lid][ref1],
      wordt voorzien van de kadastrale aanduidingen van de onroerende zaak of zaken waarop deze betrekking heeft en wordt
      ingeschreven in het gemeentelijke beperkingenregister.

      2 De inschrijving, bedoeld in het eerste lid, geschiedt door op het beperkingenbesluit, de beslissing in
      administratief beroep of de rechterlijke uitspraak, een aantekening te plaatsen en het tijdstip van inschrijving
      te vermelden.

      3 De inschrijving, bedoeld in het eerste lid, geschiedt:

      a. bij een beperkingenbesluit als bedoeld in [artikel 1, onderdeel b, onder 1°][ref2], binnen vier dagen na de dag
      van bekendmaking van het beperkingenbesluit;

      b. bij een beperkingenbesluit als bedoeld in [artikel 1, onderdeel b, onder 2°][ref3], binnen vier dagen na de dag
      waarop burgemeester en wethouders het beperkingenbesluit hebben ontvangen;

      c. bij een beperkingenbesluit als bedoeld in [artikel 1, onderdeel b, onder 5°][ref4], binnen vier dagen na de dag
      waarop het beperkingenbesluit is verzonden of van het beperkingenbesluit kennisgeving is gedaan;

      d. bij een beperkingenbesluit als bedoeld in [artikel 1, onderdeel b, onder 6°][ref5], binnen vier dagen na de
      dag waarop de inschrijving van het besluit tot aanwijzing van een onroerende zaak als beschermd monument heeft
      plaatsgevonden;

      e. bij een op een beperkingenbesluit betrekking hebbende beslissing in administratief beroep of rechterlijke
      uitspraak, binnen vier dagen na de dag waarop burgemeester en wethouders een gewaarmerkt afschrift daarvan hebben
      ontvangen.

      4 Indien een publiekrechtelijke beperking die voortvloeit uit een in het gemeentelijke beperkingenregister
      ingeschreven beperkingenbesluit onherroepelijk en anders dan ten gevolge van een beperkingenbesluit of een
      daarop betrekking hebbende beslissing in administratief beroep of rechterlijke uitspraak is vervallen, dragen
      burgemeester en wethouders er zorg voor dat binnen vier dagen na de dag waarop dit bij hen bekend is geworden en
      met overeenkomstige toepassing van het eerste en tweede lid een verklaring met betrekking tot dat vervallen wordt
      ingeschreven in dat register.


