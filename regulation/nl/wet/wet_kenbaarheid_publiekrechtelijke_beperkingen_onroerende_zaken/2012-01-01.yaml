  - number: '12'
    text: |-
      1 Een betrokkene als bedoeld in [artikel 1, onder f, van de Wet bescherming persoonsgegevens][ref1] kan met het
      oog op de bescherming van zijn persoonlijke levenssfeer burgemeester en wethouders verzoeken de hem betreffende,
      in het gemeentelijke beperkingenregister en de gemeentelijke beperkingenregistratie opgenomen persoonsgegevens af
      te schermen.

      2 Ten aanzien van een verzoek als bedoeld in het eerste lid is [artikel 11, tweede, derde en vijfde lid][ref2], van
      overeenkomstige toepassing.

      3 Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van de persoonlijke levenssfeer
      van een betrokkene als bedoeld in het eerste lid nadere regels worden gegeven met betrekking tot de wijze waarop
      persoonsgegevens overeenkomstig dat lid worden afgeschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016876#Artikel11
