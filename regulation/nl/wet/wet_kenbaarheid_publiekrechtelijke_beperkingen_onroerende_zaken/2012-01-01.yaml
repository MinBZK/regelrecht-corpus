  - number: '6'
    text: |-
      1 In de gemeentelijke beperkingenregistratie worden ten minste de volgende gegevens opgenomen:

      a. een korte aanduiding van de aard en inhoud van een publiekrechtelijke beperking,

      b. het tijdstip van inwerkingtreding van het desbetreffende beperkingenbesluit of van het van kracht worden van een
      daarop betrekking hebbende beslissing in administratief beroep of rechterlijke uitspraak, dan wel het tijdstip van
      inschrijving van een vervallenverklaring als bedoeld in [artikel 7, vierde lid][ref1],

      c. het nummer waaronder het beperkingenbesluit, de beslissing in administratief beroep of de rechterlijke
      uitspraak, dan wel de vervallenverklaring, bedoeld in [artikel 7, vierde lid][ref2], in het gemeentelijke
      beperkingenregister is ingeschreven, en

      d. de kadastrale aanduiding van de onroerende zaak of zaken waarop het beperkingenbesluit, de beslissing
      in administratief beroep of rechterlijke uitspraak, dan wel de vervallenverklaring, bedoeld in
      [artikel 7, vierde lid][ref3], betrekking heeft.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven met betrekking tot de vorm en
      inrichting van de gemeentelijke beperkingenregistratie en de daarin op te nemen soorten gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0016876#Artikel7
