  - number: '17'
    text: |-
      De rechtspersoon waartoe het bestuursorgaan, bedoeld in [artikel 15, eerste lid][ref1], behoort, is aansprakelijk
      voor schade die is veroorzaakt door vergissingen, verzuimen, vertragingen of andere onregelmatigheden, door
      hem of door personen voor wier gedragingen hij aansprakelijk is begaan bij de nakoming van de bij of krachtens
      [artikel 15, eerste tot en met derde lid][ref2], en [artikel 16, tweede en derde lid][ref3], aan dat bestuursorgaan
      opgedragen verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0016876#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0016876#Artikel16
