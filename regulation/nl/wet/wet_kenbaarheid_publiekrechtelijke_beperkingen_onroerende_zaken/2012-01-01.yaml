  - number: 15a
    text: |-
      Met het oog op de kenbaarheid van de in de basisregistratie kadaster opgenomen gegevens van beperkingenbesluiten
      als bedoeld in [artikel 3, tweede lid][ref1], en daarop betrekking hebbende beslissingen in administratief beroep
      en rechterlijke uitspraken, alsmede van vervallenverklaringen als bedoeld in [artikel 15, derde lid][ref2],
      verlenen burgemeester en wethouders op verzoek ten kantore van de gemeente aan eenieder inzage in de
      basisregistratie kadaster door middel van een aansluiting op die registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016876#Artikel15
