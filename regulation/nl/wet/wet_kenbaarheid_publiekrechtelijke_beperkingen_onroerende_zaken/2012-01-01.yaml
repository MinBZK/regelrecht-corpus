  - number: 10a
    text: |-
      1 De Dienst beheert de landelijke voorziening, bedoeld in [artikel 10, eerste lid][ref1]. Dit beheer geschiedt in
      overleg met een representatieve vertegenwoordiging van burgemeester en wethouders van de gemeenten.

      2 De uitkomsten van het overleg, bedoeld in het eerste lid, worden voorgelegd aan Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, indien dit door de Dienst of de vertegenwoordiging van
      burgemeester en wethouders van de gemeenten bij het overleg noodzakelijk wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel10
    url: https://wetten.overheid.nl/BWBR0016876/2012-01-01#Artikel10a
