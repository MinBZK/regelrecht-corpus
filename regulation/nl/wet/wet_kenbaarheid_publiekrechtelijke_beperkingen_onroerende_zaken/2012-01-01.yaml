  - number: '8'
    text: |-
      1 Burgemeester en wethouders dragen zorg voor het bijhouden van de gemeentelijke beperkingenregistratie in geval
      van:

      a. inschrijving van een beperkingenbesluit, een daarop betrekking hebbende beslissing in administratief beroep of
      rechterlijke uitspraak als bedoeld in [artikel 7, eerste lid][ref1],

      b. inschrijving van een vervallenverklaring als bedoeld in [artikel 7, vierde lid][ref2],

      c. door de Dienst op de voet van [artikel 104 van de Kadasterwet][ref3] verstrekte gegevens aangaande wijzigingen
      van de kadastrale aanduiding van de binnen het grondgebied van de gemeente gelegen onroerende zaak of zaken ten
      aanzien waarvan een publiekrechtelijke beperking van kracht is, en

      d. herstel van een fout als bedoeld in [artikel 11, eerste lid][ref4], dan wel een daartoe strekkende beslissing in
      administratief beroep of rechterlijke uitspraak.

      2 De in [artikel 7, derde lid][ref5], genoemde termijnen zijn van toepassing op het bijhouden als bedoeld in het
      eerste lid, onder a en d.

      3 De in [artikel 7, vierde lid][ref6], genoemde termijn is van toepassing op het bijhouden als bedoeld in het
      eerste lid, onder b.

      4 Het bijhouden als bedoeld in het eerste lid, onder c, geschiedt binnen vier weken na de dag waarop een gemeente
      de daar bedoelde gegevens heeft ontvangen.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven met betrekking tot het
      bijhouden als bedoeld in dit artikel.


