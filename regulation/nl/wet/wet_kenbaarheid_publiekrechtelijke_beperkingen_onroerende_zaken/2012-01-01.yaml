    text: |-
      Op de inschrijving in de openbare registers van een beperkingenbesluit, een daarop betrekking hebbende beslissing
      in administratief beroep of rechterlijke uitspraak als bedoeld in [artikel 3, tweede lid][ref1], en een
      vervallenverklaring als bedoeld in [artikel 15, derde lid][ref2], zijn de [artikelen 24, eerste lid][ref3], en
      [26 van Boek 3 van het Burgerlijk Wetboek][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel3
