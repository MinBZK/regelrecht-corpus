preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter bevordering van de rechtszekerheid ten aanzien van
    onroerende zaken, de toegankelijkheid van overheidsinformatie en een goede vervulling van publiekrechtelijke taken,
    de kenbaarheid van publiekrechtelijke beperkingen ten aanzien van onroerende zaken te vergroten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016876/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. publiekrechtelijke beperking:

      1º. beperking van de bevoegdheid tot gebruik van of beschikking over een onroerende zaak of een recht waaraan die
      zaak is onderworpen, niet zijnde een privaatrechtelijke beperking,

      2º. schuldplichtigheid die rust op een onroerende zaak of een recht waaraan die zaak is onderworpen;

      b. beperkingenbesluit:

      1°. op grond van [artikel 2][ref1] aangewezen schriftelijke publiekrechtelijke rechtshandeling waaruit een
      publiekrechtelijke beperking voortvloeit dan wel waarbij deze wordt gewijzigd of komt te vervallen;

      2°. een melding aan het bevoegd gezag van een voornemen tot sanering als bedoeld in
      [artikel 39b, derde lid, van de Wet bodembescherming][ref2];

      3°. een mededeling van een adviesaanvraag door Onze Minister van Onderwijs, Cultuur en Wetenschap als bedoeld in
      [artikel 3, derde lid, van de Monumentenwet 1988][ref3] betreffende de aanwijzing van een binnen het grondgebied
      van een gemeente gelegen onroerend monument als beschermd monument;

      4°. een afschrift van een inschrijving door Onze Minister van Onderwijs, Cultuur en Wetenschap van een als
      beschermd monument aangewezen onroerend monument in het register, bedoeld in [artikel 6, eerste lid][ref4], of
      [artikel 7, derde lid, van de Monumentenwet 1988][ref5];

      5°. een schriftelijke handeling, niet zijnde een besluit, van een bestuursorgaan van een provincie of gemeente op
      grond van een provinciale respectievelijk gemeentelijke verordening, waardoor, voordat op grond van die verordening
      een besluit tot aanwijzing van een onroerende zaak als beschermd monument is genomen, op die onroerende zaak de
      in de betreffende verordening opgenomen bepalingen ten aanzien van krachtens die verordening aangewezen beschermde
      monumenten van overeenkomstige toepassing worden;

      6°. een afschrift van een inschrijving op dan wel in een provinciale of gemeentelijke monumentenlijst
      respectievelijk een provinciaal of gemeentelijk monumentenregister door een bestuursorgaan van een provincie
      of gemeente van een besluit tot aanwijzing van een onroerende zaak als beschermd monument, indien door die
      inschrijving de in de betreffende provinciale of gemeentelijke verordening opgenomen bepalingen ten aanzien van
      krachtens die verordening aangewezen beschermde monumenten rechtstreeks van toepassing worden;

      c. gemeentelijk beperkingenregister: openbaar gemeentelijk register waarin een beperkingenbesluit van een
      bestuursorgaan als bedoeld in [artikel 3, eerste lid][ref6], wordt ingeschreven;

      d. gemeentelijke beperkingenregistratie: openbare gemeentelijke registratie die gegevens omtrent in het
      gemeentelijke beperkingenregister ingeschreven beperkingenbesluiten bevat;

      e. openbare registers: openbare registers als bedoeld in [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref7];

      f. basisregistratie kadaster: basisregistratie kadaster als bedoeld in
      [artikel 48, eerste lid, van de Kadasterwet][ref8];

      g. Dienst: Dienst voor het kadaster en de openbare registers als bedoeld in
      [artikel 2 van de Organisatiewet Kadaster][ref9];

      h. persoonsgegeven: persoonsgegeven als bedoeld in
      [artikel 1, onder a, van de Wet bescherming persoonsgegevens][ref10].


