  - number: '4'
    text: |-
      1 Voorzover burgemeester en wethouders ter uitvoering van deze wet persoonsgegevens verwerken, doen zij dat
      uitsluitend ten behoeve van de doeleinden waarin deze wet voorziet.

      2 Ten aanzien van de verwerking van persoonsgegevens, bedoeld in het eerste lid, zijn burgemeester en wethouders
      verantwoordelijke in de zin van [artikel 1, eerste lid, onder d, van de Wet bescherming persoonsgegevens][ref1].

      3 Burgemeester en wethouders verwerken geen persoonsgegevens als bedoeld in het eerste lid in verband met de
      totstandbrenging of de instandhouding van een directe relatie tussen de verantwoordelijke of een derde en degene op
      wie zodanige persoonsgegevens betrekking hebben met het oog op werving voor commerciële of charitatieve doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
