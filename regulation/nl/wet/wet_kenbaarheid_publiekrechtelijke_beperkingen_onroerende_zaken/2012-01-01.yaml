  - number: '13'
    text: |-
      1 Een gemeente is aansprakelijk voor schade die is veroorzaakt doordat:

      a. de inschrijving van een beperkingenbesluit, een daarop betrekking hebbende beslissing in administratief beroep
      of rechterlijke uitspraak, dan wel een vervallenverklaring als bedoeld in [artikel 7, vierde lid][ref1], in het
      gemeentelijke beperkingenregister, dan wel

      b. het opnemen van gegevens daaromtrent in de gemeentelijke beperkingenregistratie,

      in strijd met deze wet en de daarop berustende bepalingen heeft plaatsgehad dan wel is nagelaten.

      2 Een gemeente is voorts aansprakelijk voor schade die is veroorzaakt door alle verdere vergissingen, verzuimen,
      vertragingen of andere onregelmatigheden, door haar of door personen voor wier gedragingen zij aansprakelijk is,
      begaan bij:

      a. het houden of bijhouden van het gemeentelijke beperkingenregister, onderscheidenlijk de gemeentelijke
      beperkingenregistratie,

      b. het verlenen van inzage en het opmaken en verstrekken van een afschrift, uittreksel of verklaring als bedoeld in
      [artikel 9, eerste lid][ref2], dan wel

      c. het beschikbaar houden van gegevens voor de Dienst, bedoeld in [artikel 10, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0016876#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0016876#Artikel10
