  - number: '16'
    text: |-
      1 Onverminderd het bepaalde bij of krachtens een andere wet dan deze wet verstrekt de Dienst periodiek
      aan een bestuursorgaan als bedoeld in [artikel 15, eerste lid][ref1], een overzicht van wijzigingen in de
      kadastrale aanduidingen van de onroerende zaak of zaken waarop een door dat bestuursorgaan op grond van
      [artikel 15, eerste lid][ref2], ter inschrijving in de openbare registers aangeboden beperkingenbesluit of
      een daarop betrekking hebbende beslissing in administratief beroep of rechterlijke uitspraak betrekking heeft,
      voorzover deze documenten de grondslag vormen voor een van kracht zijnde publiekrechtelijke beperking. Deze
      verstrekking is kosteloos.

      2 Een bestuursorgaan als bedoeld in het eerste lid dat een overzicht als bedoeld in dat lid ontvangt, doet binnen
      vier weken na de dag van ontvangst opgave aan de Dienst van de geactualiseerde kadastrale aanduidingen van de
      onroerende zaak of zaken waarop een beperkingenbesluit, beslissing in administratief beroep of rechterlijke
      uitspraak dan wel vervallenverklaring als bedoeld in dat lid betrekking heeft.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot:

      a. de gevallen waarin een overzicht als bedoeld in het eerste lid wordt verstrekt,

      b. de frequentie van het verstrekken van een overzicht als bedoeld in het eerste lid,

      c. het doen van een opgave als bedoeld in het tweede lid alsmede de vorm daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0016876#Artikel15
    url: https://wetten.overheid.nl/BWBR0016876/2012-01-01#Artikel16
