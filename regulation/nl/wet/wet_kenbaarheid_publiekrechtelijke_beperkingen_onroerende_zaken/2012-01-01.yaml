  - number: '11'
    text: |-
      1 Burgemeester en wethouders dragen ambtshalve of op verzoek van een belanghebbende zorg voor het herstel van een
      fout, gemaakt bij:

      a. de inschrijving van een beperkingenbesluit, een daarop betrekking hebbende beslissing in administratief beroep
      of rechterlijke uitspraak, dan wel een vervallenverklaring als bedoeld in [artikel 7, vierde lid][ref1], in het
      gemeentelijke beperkingenregister, of

      b. het bijhouden van de gemeentelijke beperkingenregistratie.

      2 Een verzoek tot herstel van een fout als bedoeld in het eerste lid bevat de redenen voor dat verzoek en zo
      mogelijk de aan te brengen wijzigingen.

      3 Binnen vier weken na de dag van ontvangst van een verzoek als bedoeld in het eerste lid beslissen burgemeester
      en wethouders op het verzoek. Zij delen hun beslissing schriftelijk mede aan de verzoeker en aan andere
      belanghebbenden. Deze beslissing geldt als een besluit in de zin van de [Algemene wet bestuursrecht][ref2].

      4 In geval van een ambtshalve herstel als bedoeld in het eerste lid delen burgemeester en wethouders
      dit schriftelijk mede aan een belanghebbende. Deze mededeling geldt als een besluit in de zin van de
      [Algemene wet bestuursrecht][ref3].

      5 [Artikel 38 van de Wet bescherming persoonsgegevens][ref4] is van toepassing voorzover het herstel van een fout
      als bedoeld in het eerste lid leidt tot verbetering, aanvulling of verwijdering van persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0011468#Artikel38
