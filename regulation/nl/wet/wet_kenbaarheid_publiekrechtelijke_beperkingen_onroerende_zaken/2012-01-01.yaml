  - number: 17a
    text: |-
      1 Een beperkingenbesluit als bedoeld in [artikel 3, eerste lid][ref1], dat dateert van voor het tijdstip van de
      inwerkingtreding van deze wet en de grondslag vormt voor een op dat tijdstip van kracht zijnde publiekrechtelijke
      beperking, alsmede een op dat beperkingenbesluit betrekking hebbende beslissing in administratief
      beroep of rechterlijke uitspraak, worden binnen twee jaren na dat tijdstip ingeschreven overeenkomstig
      [artikel 7, eerste en tweede lid][ref2]. De inschrijving mag achterwege blijven indien de betreffende
      publiekrechtelijke beperking voordien ophoudt van kracht te zijn.

      2 Ingeschreven worden de in het eerste lid bedoelde documenten dan wel een opgave van die documenten, die ten
      minste inhoudt een door burgemeester en wethouders vastgestelde lijst met de volgende gegevens:

      a. een korte aanduiding van de aard en inhoud van de publiekrechtelijke beperking;

      b. de actuele kadastrale aanduiding van de onroerende zaak of zaken waarop het beperkingenbesluit, de beslissing in
      administratief beroep of rechterlijke uitspraak betrekking heeft.

      3 Op verzoek van burgemeester en wethouders verleent de Dienst medewerking aan de uitvoering van het eerste lid,
      voorzover het betreft beperkingenbesluiten alsmede daarop betrekking hebbende beslissingen in administratief
      beroep of rechterlijke uitspraken, die op het tijdstip van de inwerkingtreding van deze wet zijn ingeschreven in de
      openbare registers.

      4 Burgemeester en wethouders melden schriftelijk aan de Dienst het tijdstip waarop de inschrijving van de in het
      derde lid bedoelde documenten is voltooid. Na ontvangst van deze melding vindt met bekwame spoed bijhouding plaats
      van de basisregistratie kadaster als bedoeld in [hoofdstuk 4, titel 1, van de Kadasterwet][ref3], in zoverre dat in
      elk geval de vermeldingen van de korte aanduiding van de betreffende publiekrechtelijke beperkingen vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016876#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004541
