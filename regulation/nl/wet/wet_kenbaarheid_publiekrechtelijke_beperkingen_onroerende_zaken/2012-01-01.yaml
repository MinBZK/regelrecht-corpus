  - number: '10'
    text: |-
      1 Burgemeester en wethouders dragen er zorg voor dat de in [artikel 6][ref1] bedoelde gegevens door middel van een
      daartoe strekkende landelijke voorziening op zodanige wijze beschikbaar worden gehouden voor de Dienst dat deze de
      betreffende gegevens te allen tijde langs elektronische weg kan ophalen en raadplegen.

      2 Op verzoek verleent de Dienst aan eenieder met betrekking tot van kracht zijnde publiekrechtelijke beperkingen
      inzage in de in [artikel 6][ref2] bedoelde gegevens door deze op te halen uit de landelijke voorziening, bedoeld in
      het eerste lid.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gegeven met betrekking tot het berichtenverkeer met
      de landelijke voorziening, bedoeld in het eerste lid. Bij of krachtens algemene maatregel van bestuur kunnen tevens
      regels worden gegeven omtrent het verlenen van inzage, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016876#Artikel6
