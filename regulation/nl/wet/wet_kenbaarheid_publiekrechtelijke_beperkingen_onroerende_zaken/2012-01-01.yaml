  - number: '5'
    text: |-
      1 Burgemeester en wethouders dragen zorg voor het houden van een gemeentelijk beperkingenregister en een
      gemeentelijke beperkingenregistratie.

      2 Bij algemene maatregel van bestuur kunnen ten aanzien van het gemeentelijke beperkingenregister regels worden
      gegeven met betrekking tot:

      a. de vorm en inrichting van het register,

      b. de wijze waarop de kadastrale aanduiding van een onroerende zaak of zaken kenbaar wordt gemaakt op
      een beperkingenbesluit, een beslissing in administratief beroep of rechterlijke uitspraak, dan wel een
      vervallenverklaring als bedoeld in [artikel 7, vierde lid][ref1],

      c. de wijze waarop een aantekening als bedoeld in [artikel 7, tweede lid][ref2], kenbaar wordt gemaakt
      op een beperkingenbesluit, een beslissing in administratief beroep of rechterlijke uitspraak, dan wel een
      vervallenverklaring als bedoeld in [artikel 7, vierde lid][ref3].

      3 Bij algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot de gevallen waarin en
      de wijze waarop andere aantekeningen dan die, bedoeld in het tweede lid, onder c, kenbaar worden gemaakt
      op een beperkingenbesluit, een beslissing in administratief beroep of rechterlijke uitspraak, dan wel een
      vervallenverklaring als bedoeld in [artikel 7, vierde lid][ref4].

      4 Bij ministeriële regeling kunnen nadere regels omtrent de uitvoering van de in het tweede en derde lid genoemde
      onderwerpen worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel7
