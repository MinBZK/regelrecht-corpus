  - number: '9'
    text: |-
      1 Op verzoek verlenen burgemeester en wethouders aan eenieder kosteloos inzage in het gemeentelijke
      beperkingenregister en de gemeentelijke beperkingenregistratie. Tevens verstrekken zij op verzoek:

      a. een gewaarmerkt afschrift of uittreksel van een in het gemeentelijke beperkingenregister ingeschreven
      beperkingenbesluit, beslissing in administratief beroep of rechterlijke uitspraak, dan wel vervallenverklaring als
      bedoeld in [artikel 7, vierde lid][ref1],

      b. een gewaarmerkt afschrift of uittreksel van in de gemeentelijke beperkingenregistratie opgenomen gegevens, of

      c. een schriftelijke verklaring dat er blijkens de in de gemeentelijkebeperkingenregistratie opgenomen gegevens
      geen publiekrechtelijke beperking van kracht is ten aanzien van de daarbij aangegeven onroerende zaak of zaken.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot:

      a. de inzage in het gemeentelijke beperkingenregister en de gemeentelijke beperkingenregistratie, en

      b. de vorm en wijze van het verstrekken van een afschrift, uittreksel of verklaring als bedoeld in het eerste lid.

      3 Voor het verstrekken van een afschrift, uittreksel of verklaring als bedoeld in het eerste lid kan overeenkomstig
      [artikel 229, eerste lid, aanhef en onder b, van de Gemeentewet][ref2], een recht worden geheven.

      4 [Artikel 35 van de Wet bescherming persoonsgegevens][ref3] is niet van toepassing op persoonsgegevens opgenomen
      in het gemeentelijke beperkingenregister en de gemeentelijke beperkingenregistratie.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel35
