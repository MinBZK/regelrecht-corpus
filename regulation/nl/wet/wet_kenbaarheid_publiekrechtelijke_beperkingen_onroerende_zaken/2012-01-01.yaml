  - number: '3'
    text: |-
      1 In het gemeentelijke beperkingenregister worden ingeschreven een beperkingenbesluit van een
      bestuursorgaan van de desbetreffende gemeente, van het bestuur van een openbaar lichaam als bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1] waarin de desbetreffende gemeente deelneemt of van een gemeenschappelijk
      orgaan in laatstbedoelde zin, alsmede een daarop betrekking hebbende beslissing in administratief beroep of
      rechterlijke uitspraak, indien daarbij het beperkingenbesluit wordt herroepen, vernietigd, ingetrokken of
      gewijzigd.

      2 In de openbare registers worden ingeschreven een beperkingenbesluit van een ander bestuursorgaan dan een
      bestuursorgaan als bedoeld in het eerste lid, niet zijnde een beslissing in administratief beroep als bedoeld
      in het eerste lid, alsmede een daarop betrekking hebbende beslissing in administratief beroep of rechterlijke
      uitspraak, indien daarbij het beperkingenbesluit wordt herroepen, vernietigd, ingetrokken of gewijzigd.

      3 Ingeschreven wordt het origineel dan wel een gewaarmerkt afschrift van een beperkingenbesluit, beslissing in
      administratief beroep of rechterlijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0016876/2012-01-01#Artikel3
