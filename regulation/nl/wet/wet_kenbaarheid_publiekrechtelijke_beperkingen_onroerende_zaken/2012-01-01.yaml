  - number: 17b
    text: |-
      1 Een beperkingenbesluit als bedoeld in [artikel 3, tweede lid][ref1], dat dateert van voor het tijdstip van de
      inwerkingtreding van deze wet en de grondslag vormt voor een op dat tijdstip van kracht zijnde publiekrechtelijke
      beperking, alsmede een op dat beperkingenbesluit betrekking hebbende beslissing in administratief beroep of
      rechterlijke uitspraak, worden binnen twee jaren na dat tijdstip aan de Dienst ter inschrijving aangeboden
      overeenkomstig [artikel 15, eerste lid][ref2]. Het aanbieden ter inschrijving mag achterwege blijven indien de
      betreffende publiekrechtelijke beperking voordien ophoudt van kracht te zijn.

      2 In afwijking van het eerste lid worden de in dat lid bedoelde beperkingenbesluiten ingeschreven overeenkomstig
      [artikel 7, eerste en tweede lid][ref3], voorzover het betreft beperkingenbesluiten krachtens de Wet
      bodembescherming die zijn genomen door een orgaan van een provincie en nadien een gemeente of plusregio als bedoeld
      in [artikel 104 van de Wet gemeenschappelijke regelingen][ref4] met de betreffende provincie is gelijkgesteld bij
      of krachtens [artikel 88 van de Wet bodembescherming][ref5]. [Artikel 17a, vierde lid][ref6], is op de inschrijving
      van deze beperkingenbesluiten van overeenkomstige toepassing.

      3 Ter inschrijving aangeboden worden de in het eerste lid bedoelde documenten dan wel een opgave van die
      documenten, die ten minste inhoudt een door het betreffende bestuursorgaan vastgestelde lijst met de volgende
      gegevens:

      a. een korte aanduiding van de aard en inhoud van de publiekrechtelijke beperking;

      b. de actuele kadastrale aanduiding van de onroerende zaak of zaken waarop het beperkingenbesluit, de beslissing in
      administratief beroep of rechterlijke uitspraak betrekking heeft.

      4 Beperkingenbesluiten als bedoeld in [artikel 3, tweede lid][ref7], alsmede daarop betrekking hebbende
      beslissingen in administratief beroep of rechterlijke uitspraken, die op het tijdstip van de inwerkingtreding van
      deze wet zijn ingeschreven in de openbare registers, gelden met ingang van dat tijdstip als ingeschreven in die
      registers overeenkomstig deze wet.


