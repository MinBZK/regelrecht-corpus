  - number: '2'
    text: |-
      1 Bij algemene maatregel van bestuur worden in het belang van een doelmatige kenbaarheid van publiekrechtelijke
      beperkingen categorieën van beperkingenbesluiten als bedoeld in [artikel 1, onderdeel b, onder 1°][ref1],
      aangewezen, waarop deze wet van toepassing is.

      2 De aanwijzing kan bij ministeriële regeling plaatsvinden indien het betreft beperkingenbesluiten die worden
      vastgesteld op grond van een verordening van respectievelijk een gemeente, waterschap of provincie als bedoeld in
      respectievelijk [artikel 149 van de Gemeentewet][ref2], [artikel 56, eerste lid, van de Waterschapswet][ref3] of
      [artikel 145 van de Provinciewet][ref4].

      3 Tenzij bij de in het eerste of tweede lid bedoelde aanwijzing anders is bepaald, behoren tot de aangewezen
      categorieën van beperkingenbesluiten mede die beperkingenbesluiten die dezelfde publiekrechtelijke beperkingen
      hebben doen ontstaan als de tot de aangewezen categorieën behorende beperkingenbesluiten en als wettelijke
      grondslag hebben een inmiddels gewijzigde of vervallen wet, waarvan de werking ten aanzien van de op die wet
      gebaseerde beperkingenbesluiten ingevolge een latere wet is geëerbiedigd.

      4 Tot de aangewezen categorieën van beperkingenbesluiten behoren verder mede die beperkingenbesluiten waarbij
      een publiekrechtelijke beperking die is voortgevloeid uit een beperkingenbesluit als vermeld in een aangewezen
      categorie, wordt gewijzigd of komt te vervallen. De eerste zin is van overeenkomstige toepassing op de
      beperkingenbesluiten, bedoeld in [artikel 1, onderdeel b, onder 2° tot en met 5°][ref5].

      5 Bij de in het eerste of tweede lid bedoelde aanwijzing kan ten aanzien van een categorie van beperkingenbesluiten
      onderscheid worden gemaakt naar:

      a. de vorm waarin een beperkingenbesluit beschikbaar is,

      b. de aard van het object waarop een beperkingenbesluit betrekking heeft,

      c. de periode gedurende welke een beperkingenbesluit van kracht is,

      d. de kring van personen jegens wie een beperkingenbesluit geldt.


