  - number: '15'
    text: |-
      1 Het bestuursorgaan dat een beperkingenbesluit als bedoeld in [artikel 3, eerste lid][ref1], heeft vastgesteld
      dan wel Onze Minister die het aangaat, indien een beperkingenbesluit een algemeen verbindend voorschrift in
      een wet of algemene maatregel van bestuur is, draagt er zorg voor dat het beperkingenbesluit dan wel een daarop
      betrekking hebbende beslissing in administratief beroep of rechterlijke uitspraak wordt voorzien van de actuele
      kadastrale aanduidingen van het object waarop deze betrekking heeft of de actuele identificatie van dat object uit
      een basisregistratie dan wel de handmatig ingetekende geometrie en in elektronische vorm ter inschrijving in de
      openbare registers aan de Dienst wordt aangeboden.

      2 Het ter inschrijving aanbieden, bedoeld in het eerste lid, geschiedt:

      a. bij een beperkingenbesluit als bedoeld in [artikel 1, onderdeel b, onder 1°][ref2], binnen vier dagen na de dag
      van bekendmaking van het beperkingenbesluit;

      b. bij een beperkingenbesluit als bedoeld in [artikel 1, onderdeel b, onder 2°][ref3], binnen vier dagen na de dag
      waarop het beperkingenbesluit is verzonden;

      c. bij een beperkingenbesluit als bedoeld in [artikel 1, onderdeel b, onder 3°][ref4], binnen vier dagen
      na de dag waarop de inschrijving door Onze Minister van Onderwijs, Cultuur en Wetenschap van de aanwijzing
      van een monument of archeologisch monument als rijksmonument in het rijksmonumentenregister, bedoeld in
      [artikel 1.1 van de Erfgoedwet][ref5], heeft plaatsgevonden;

      d. bij een beperkingenbesluit als bedoeld in [artikel 1, onderdeel b, onder 4°][ref6], binnen vier dagen na de dag
      waarop het beperkingenbesluit is verzonden of van het beperkingenbesluit kennisgeving is gedaan;

      e. bij een beperkingenbesluit als bedoeld in [artikel 1, onderdeel b, onder 5°][ref7], binnen vier dagen na de
      dag waarop de inschrijving van het besluit tot aanwijzing van een onroerende zaak als beschermd monument heeft
      plaatsgevonden;

      f. bij een op een beperkingenbesluit betrekking hebbende beslissing in administratief beroep of rechterlijke
      uitspraak, binnen vier dagen na de dag waarop het bestuursorgaan een gewaarmerkt afschrift daarvan heeft ontvangen.

      3 Indien een publiekrechtelijke beperking die voortvloeit uit een in de openbare registers ingeschreven
      beperkingenbesluit onherroepelijk en anders dan ten gevolge van een beperkingenbesluit of een daarop betrekking
      hebbende beslissing in administratief beroep of rechterlijke uitspraak is vervallen, biedt het bestuursorgaan,
      bedoeld in het eerste lid, binnen vier dagen na de dag waarop dit bij hem bekend is geworden en met overeenkomstige
      toepassing van het eerste lid, de Dienst ter inschrijving in de openbare registers een verklaring met betrekking
      tot het vervallen van die beperking aan.

      4 De Dienst maakt inzichtelijk aan bestuursorganen wanneer een object uit een van de basisregistraties, waarop het
      bestuursorgaan een vigerende beperking heeft gelegd, niet langer actueel is.

      5 Bij ministeriële regeling worden nadere regels gegeven over:

      a. de identificatie van het object en de geometrie, bedoeld in het eerste lid, alsmede wijzigingen daarvan, en

      b. de wijze van aanleveren van de beperkingenbesluiten alsmede de daarop betrekking hebbende beslissingen in
      administratief beroep of rechterlijke uitspraken en de daarbij aan te leveren gegevens.

      6 Bij regeling van het bestuur van de Dienst kunnen nadere regels worden gegeven omtrent wijzigingen
      van de identificatie van het object of de geometrie, bedoeld in het eerste lid, en de manier waarop de
      beperkingenbesluiten en de gegevens, bedoeld in het vijfde lid, onderdeel b, worden aangeleverd.


