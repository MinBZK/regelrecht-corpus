  - number: '3'
    text: |-
      1 In de openbare registers worden ingeschreven een beperkingenbesluit van een bestuursorgaan alsmede een
      daarop betrekking hebbende beslissing in administratief beroep of rechterlijke uitspraak, indien daarbij het
      beperkingenbesluit wordt herroepen, vernietigd, ingetrokken of gewijzigd.

      2 Ingeschreven wordt het origineel dan wel een gewaarmerkt afschrift van een beperkingenbesluit, beslissing in
      administratief beroep of rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0016876/2024-01-01#Artikel3
  - number: '14'
    text: |-
      Op de inschrijving in de openbare registers van een beperkingenbesluit, een daarop betrekking hebbende beslissing
      in administratief beroep of rechterlijke uitspraak als bedoeld in [artikel 3, eerste lid][ref1], en een
      vervallenverklaring als bedoeld in [artikel 15, derde lid][ref2], zijn de [artikelen 24, eerste lid][ref3], en
      [26 van Boek 3 van het Burgerlijk Wetboek][ref4] niet van toepassing.


