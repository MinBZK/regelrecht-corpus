  - number: '17'
    text: |-
      De rechtspersoon waartoe het bestuursorgaan, bedoeld in [artikel 15, eerste lid][ref1], behoort, is aansprakelijk
      voor schade die is veroorzaakt door vergissingen, verzuimen, vertragingen of andere onregelmatigheden, door hem of
      door personen voor wier gedragingen hij aansprakelijk is begaan bij de nakoming van de bij of krachtens artikel 15
      aan dat bestuursorgaan opgedragen verplichtingen.


