preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter bevordering van de rechtszekerheid ten aanzien van
    onroerende zaken, de toegankelijkheid van overheidsinformatie en een goede vervulling van publiekrechtelijke taken,
    de kenbaarheid van publiekrechtelijke beperkingen ten aanzien van onroerende zaken te vergroten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016876/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. publiekrechtelijke beperking:

      1º. beperking van de bevoegdheid tot gebruik van of beschikking over een onroerende zaak of een recht waaraan die
      zaak is onderworpen, niet zijnde een privaatrechtelijke beperking,

      2º. schuldplichtigheid die rust op een onroerende zaak of een recht waaraan die zaak is onderworpen;

      b. beperkingenbesluit:

      1°. op grond van [artikel 2][ref1] aangewezen schriftelijke publiekrechtelijke rechtshandeling waaruit een
      publiekrechtelijke beperking voortvloeit dan wel waarbij deze wordt gewijzigd of komt te vervallen;

      2°. een toezending van een ontwerpbesluit door Onze Minister van Onderwijs, Cultuur en
      Wetenschap als bedoeld in [artikel 3.2, eerste lid, van de Erfgoedwet][ref2], in samenhang met
      [artikel 3:13, eerste lid, van de Algemene wet bestuursrecht][ref3];

      3°. een afschrift van een inschrijving door Onze Minister van Onderwijs, Cultuur en Wetenschap van een
      als rijksmonument aangewezen monument of archeologisch monument in het rijksmonumentenregister, bedoeld in
      [artikel 1.1 van de Erfgoedwet][ref4];

      c. openbare registers: openbare registers als bedoeld in [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref5];

      d. basisregistratie kadaster: basisregistratie kadaster als bedoeld in
      [artikel 48, eerste lid, van de Kadasterwet][ref6];

      e. Dienst: Dienst voor het kadaster en de openbare registers als bedoeld in
      [artikel 2 van de Organisatiewet Kadaster][ref7].


