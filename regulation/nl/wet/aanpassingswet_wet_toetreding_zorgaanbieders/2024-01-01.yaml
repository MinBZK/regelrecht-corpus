preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor de invoering van de Wet toetreding zorgaanbieders
    een aantal wetten te wijzigen zodra die wet in werking treedt;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043812/2024-01-01#ArtikelAanhef
articles:
  - number: XVIII
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0043812/2024-01-01#ArtikelXVIII
  - number: XIX
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0043812/2024-01-01#ArtikelXIX
  - number: XXIV
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043812/2024-01-01#ArtikelXXIV
  - number: XXV
    text: 'Deze wet wordt aangehaald als: Aanpassingswet Wet toetreding zorgaanbieders.'
    url: https://wetten.overheid.nl/BWBR0043812/2024-01-01#ArtikelXXV
