articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze code gelden de begrippen en bijbehorende begripsbepalingen uit de
      [Begrippencode elektriciteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037938
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037938
  - number: '2'
    text: |-
      Met deze code wordt beoogd een optimale afstemming te bereiken tussen de netbeheerders, teneinde te bewerkstelligen
      dat iedere netbeheerder zijn wettelijke taken en verplichtingen kan nakomen.

      Daartoe is iedere netbeheerder gehouden om bij het nemen van besluiten en het verrichten van handelingen rekening
      te houden met de gevolgen daarvan voor de uitvoering van de wettelijke taken door andere netbeheerders.

      Voorts zijn de netbeheerders gehouden om daar waar dit aan dit doel bijdraagt elkaar zo nodig en zo spoedig
      mogelijk te informeren en, afhankelijk van het onderwerp, met elkaar in overleg te treden en/of samen te werken.
      In het bijzonder zullen de netbeheerders ingeval er voor een adequate elektriciteitsinfrastructuur verschillende
      opties met aanzienlijk uiteenlopende kosten bestaan, zo mogelijk die optie realiseren die maatschappelijk gezien de
      laagste integrale kosten met zich meebrengt.
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel2
  - number: '3'
    text: |-
      Het door iedere netbeheerder beheerde net is in [bijlage 2][ref1] bij deze code zodanig weergegeven dat daarop ten
      minste per spanningsniveau de verbinding van ieder net van een netbeheerder met een net van een andere netbeheerder
      is aangegeven. Onverminderd het bepaalde in [artikel 12 van de Elektriciteitswet 1998][ref2] zijn de netbeheerders
      gehouden wijzigingen ter zake met inachtneming van nader af te spreken criteria en format aan elkaar door te geven.

      Mochten er onverhoopt in de door de Minister van Economische Zaken goedgekeurde gebieden overlappingen of
      hiaten zijn, dan zullen de betrokken netbeheerders met elkaar in overleg treden en, onverminderd het wettelijke
      aansluitrecht van aangeslotenen, voor zover mogelijk tezamen afspreken wie in het betreffende gebied aansluit.
      Voor zover ter zake niet binnen een redelijke termijn in der minne overeenstemming wordt bereikt, kan de afnemer de
      Minister, gelet op zijn wettelijke instemmingsrecht ten aanzien van de aangewezen netbeheerders, om een uitspraak
      verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0037937
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel12
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0037937
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '12'
  - number: '4'
    text: |-
      De netbeheerders verbinden zich voor producenten, netbeheerders, particuliere neteigenaren en andere aangeslotenen
      gezamenlijk de uitgangspunten of een model voor een overeenkomst voor aansluiting op de door hen beheerde netten
      (aansluit- en transportovereenkomst) en – voorzover van toepassing – algemene voorwaarden op te stellen.
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel4
  - number: '5'
    text: |-
      Iedere netbeheerder is gehouden producenten, netbeheerders, particuliere neteigenaren en andere aangeslotenen
      uitsluitend op het door hem beheerde net aan te sluiten indien deze zich op hun beurt in of krachtens de aansluit-
      en transportovereenkomst verbinden de op hen van toepassing zijnde passages uit de [Netcode elektriciteit][ref1],
      [Meetcode elektriciteit][ref2] en [Tarievencode elektriciteit][ref3] volledig in acht te nemen en na te komen.
      Onverminderd de keuze- en afwijkingsmogelijkheden die de codes zelf bieden, zal een netbeheerder in of krachtens de
      aansluit- en transportovereenkomst niet van een code afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0037940
      [ref2]: https://wetten.overheid.nl/BWBR0037946
      [ref3]: https://wetten.overheid.nl/BWBR0037951
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037940
      - id: ref2
        bwb_id: BWBR0037946
      - id: ref3
        bwb_id: BWBR0037951
  - number: '6'
    text: |-
      Onverminderd het elders in of krachtens deze code bepaalde erkent de netbeheerder van het landelijk
      hoogspanningsnet overeenkomstig de [Netcode elektriciteit][ref1] BRP’s en sluit de netbeheerder van het landelijk
      hoogspanningsnet zelf ter zake een overeenkomst met BRP’s.

      De netbeheerders verbinden zich gezamenlijk voor laatstbedoelde overeenkomst een model op te stellen.
      De netbeheerder van het landelijk hoogspanningsnet is gehouden alle bepalingen uit de aldus opgestelde
      modelovereenkomst die direct of indirect gevolgen voor andere netbeheerders kunnen hebben, ongewijzigd te
      hanteren. Laatstbedoelde andere netbeheerders zijn gehouden de netbeheerder van het landelijk hoogspanningsnet de
      noodzakelijke medewerking te verlenen bij de uitvoering van het systeem van balanceringsverantwoordelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0037940
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037940
  - number: '7'
    text: |-
      Iedere netbeheerder zal zodanig een systeem van kwaliteitszorg invoeren en instandhouden dat hij kan aantonen dat
      hij de kritische bedrijfsprocessen verband houdend met de uitvoering van zijn wettelijke taken en verplichtingen,
      goed beheerst.
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel7
  - number: '8'
    text: |-
      Teneinde hun wettelijke taken en verplichtingen zo doelmatig mogelijk na te komen, en onverminderd ieders eigen
      verantwoordelijkheid ter zake, zullen de netbeheerders zich periodiek gezamenlijk beraden over gewenste c.q.
      mogelijke toekomstige ontwikkelingen ten aanzien van het elektriciteitsvoorzieningssysteem, zo mogelijk ter
      zake een gezamenlijke visie ontwikkelen en eventueel gezamenlijk projecten betreffende onderzoek en ontwikkeling
      (inclusief pilot-projecten) (doen) uitvoeren.
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel8
  - number: '9'
    text: |-
      Met inachtneming van het bepaalde in [artikel 79 van de Elektriciteitswet 1998][ref1] omtrent geheimhouding en
      onder de voorwaarde dat de gegevens uitsluitend mogen worden gebruikt voor het doel waarvoor ze verstrekt worden,
      zal iedere netbeheerder andere netbeheerders die gegevens verstrekken die laatstbedoelden redelijkerwijs nodig
      hebben om hun taken uit te voeren. Tenzij anders wordt overeengekomen, zal dit gratis geschieden.

      Tot de gegevens die een netbeheerder andere netbeheerders dient te verstrekken, behoren in ieder geval de gegevens
      die conform de [Netcode elektriciteit][ref2], [Meetcode elektriciteit][ref3] en [Tarievencode elektriciteit][ref4]
      verstrekt moeten worden.

      De netbeheerders zullen gezamenlijk het voor de onderlinge informatie-/data-uitwisseling te hanteren
      communicatieprotocol vaststellen. In dit communicatieprotocol zal ook worden vastgelegd dat respectievelijk welke
      belangrijke communicatie (zoals een afschakelinstructie) zal worden geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0037940
      [ref3]: https://wetten.overheid.nl/BWBR0037946
      [ref4]: https://wetten.overheid.nl/BWBR0037951
