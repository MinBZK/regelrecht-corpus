  - number: '10'
    text: |-
      Iedere netbeheerder is verantwoordelijk voor het hebben van calamiteitenplannen. Indien en voor zover nodig zullen
      de netbeheerders deze individuele plannen uitwisselen, bespreken en afstemmen. Indien noodzakelijk zullen er door
      alle betrokken netbeheerders gemeenschappelijke plannen worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel10
  - number: '11'
    text: |-
      Deze code kan conform de [Elektriciteitswet 1998][ref1] op verzoek van netbeheerders en ambtshalve door de
      Autoriteit Consument en Markt gewijzigd worden. Onverminderd deze mogelijkheid, geldt de code voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009755
  - number: '12'
    text: |-
      Geschillen tussen netbeheerders betreffende het bepaalde in of krachtens deze code, de
      [Netcode elektriciteit][ref1], [Meetcode elektriciteit][ref2] of de [Tarievencode elektriciteit][ref3] zullen
      zoveel mogelijk langs minnelijke weg worden opgelost. Op verzoek of met instemming van de betreffende netbeheerders
      kunnen de netbeheerders gezamenlijk één of drie terzake deskundige personen aanwijzen om dit te bevorderen.

      Alle geschillen die niet in der minne kunnen worden opgelost, zullen uiteindelijk door arbitrage conform het
      reglement van het Nederlands Arbitrage Instituut (N.A.I.) door drie arbiters worden beslecht, tenzij een der
      partijen binnen 10 werkdagen na ontvangst van een schriftelijke mededeling van de andere partij over te willen gaan
      tot arbitrage, schriftelijk de wens te kennen geeft het geschil door de bevoegde rechter te laten beslechten.


      [ref1]: https://wetten.overheid.nl/BWBR0037940
      [ref2]: https://wetten.overheid.nl/BWBR0037946
      [ref3]: https://wetten.overheid.nl/BWBR0037951
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037940
      - id: ref2
        bwb_id: BWBR0037946
      - id: ref3
        bwb_id: BWBR0037951
  - number: '14'
    text: |-
      14.1 De netbeheerders zijn gehouden mee te werken aan de oprichting en instandhouding van een samenwerkingsverband
      voor alle netbeheerders en onder andere:

        - deze code, de [Netcode elektriciteit][ref1], de [Meetcode elektriciteit][ref2], de
      [Tarievencode elektriciteit][ref3] en aanverwante codes na te komen en waar nodig uitbreidingen en wijzigingen voor
      te bereiden;
        - voor zover wettelijk vereist en/of gewenst te overleggen met representatieve organisaties van partijen op
      de elektriciteitsmarkt en daartoe één of meer platforms in te stellen waaraan alle bedoelde representatieve
      organisaties kunnen deelnemen.

      14.2 Met inachtneming van het bepaalde in [artikel 16, tweede lid, van de Elektriciteitswet 1998][ref4] neemt de
      netbeheerder van het landelijk hoogspanningsnet deel aan het overleg in Entso-E verband en zal de netbeheerder
      van het landelijk hoogspanningsnet binnen het in het eerste lid bedoelde samenwerkingsverband overleg voeren en
      afstemmen over in Entso-E verband te maken afspraken en over de uitvoering van de aldus in Entso-E verband gemaakte
      afspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0037940
      [ref2]: https://wetten.overheid.nl/BWBR0037946
      [ref3]: https://wetten.overheid.nl/BWBR0037951
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037940
      - id: ref2
        bwb_id: BWBR0037946
      - id: ref3
        bwb_id: BWBR0037951
      - id: ref4
        bwb_id: BWBR0009755
        artikel: '16'
  - number: '15'
    text: |-
      15.1 De Samenwerkingsregeling Elektriciteit, zoals vastgesteld bij besluit van 12 november 1999 en nadien diverse
      malen gewijzigd, wordt ingetrokken.

      15.2 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het
      is geplaatst.

      15.3 Dit besluit wordt aangehaald als: Samenwerkingscode elektriciteit.
    url: https://wetten.overheid.nl/BWBR0037937/2019-07-10#Artikel15
