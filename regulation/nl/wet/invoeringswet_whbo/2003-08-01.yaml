preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het tijdstip van inwerkingtreding van de Wet op het hoger
    beroepsonderwijs (Stb. 1985, 80) en het overgangsrecht bij wet dienen te worden geregeld;

    dat voorts wijzigingen in de Wet op het hoger beroepsonderwijs in het bijzonder met betrekking tot de advies- en
    overlegstructuur, de wijze van bekostiging alsmede het gebruik van gebouwen, terreinen en roerende zaken wenselijk
    zijn gebleken;

    dat in verband met de inwerkingtreding van de Wet op het hoger beroepsonderwijs wijzigingen in de Wet op het
    voortgezet onderwijs en enige andere wetten dienen te worden aangebracht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelAanhef
articles:
  - number: E.9.1
    text: |-
      De op 31 juli 1986 uit ’s Rijks kas bekostigde opleidingen en cursussen, genoemd in het tweede lid, kunnen tot
      de in dat lid vermelde datum verbonden blijven aan de instelling voor hoger beroepsonderwijs waartoe de betrokken
      school, scholengemeenschap, groep cursussen, instituut of academie ingevolge [artikel E.1][ref1] is omgezet. Indien
      in het tweede lid is bepaald tot welk tijdstip een opleiding of cursus uiterlijk in stand kan worden gehouden, kan
      Onze minister een eerdere datum vaststellen voor beëindiging van de bekostiging uit ’s Rijks kas.


