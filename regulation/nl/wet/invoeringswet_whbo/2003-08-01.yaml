      - id: ref2
        bwb_id: BWBR0005746
        artikel: '17'
  - number: E.65.1
    text: |-
      Met ingang van 1 augustus 1986 kunnen tot een bij koninklijk besluit te bepalen datum de op 31 juli 1986 uit
      ’s Rijks kas bekostigde scholengemeenschappen waarvan naast ander voortgezet onderwijs scholen en cursussen
      voor hoger beroepsonderwijs, opleidingen voor onderwijzend personeel en kunstonderwijs daaronder begrepen, deel
      uitmaken, in stand blijven als onderwijsgemeenschap HBO-instelling/voortgezet onderwijs, indien het bevoegd
      gezag zulks wenselijk oordeelt. De centrale directie dan wel het college van bestuur van de instelling voor hoger
      beroepsonderwijs staat tevens aan het hoofd van de scholen en cursussen voor voortgezet onderwijs die deel uitmaken
      van de onderwijsgemeenschap.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
  - number: E.65.2
    text: |-
      In afwijking van het bepaalde in het eerste lid kunnen met ingang van 1 augustus 1986 de op 31 juli uit ’s Rijks
      kas bekostigde scholengemeenschappen waarvan scholen en cursussen hoger sociaal-pedagogisch onderwijs en middelbaar
      dienstverlenings- en gezondheidszorgonderwijs deel uitmaken waarvan het onderwijs in nauwe onderlinge samenhang is
      geprogrammeerd, als onderwijsgemeenschap HBO-instelling/voortgezet onderwijs in stand blijven.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
  - number: E.65.3
    text: |-
      Onze minister kan toestaan dat ten aanzien van bepaalde studierichtingen die deel uitmaken van een
      onderwijsgemeenschap, wordt afgeweken van de voorschriften van het HBO-statuut met betrekking tot de
      vooropleidingseisen, indien deze studierichtingen worden geprogrammeerd in nauwe samenhang met de overeenkomstige
      opleiding behorend tot het middelbaar beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
  - number: E.65.4
    text: |-
      De [artikelen 26][ref1] en [77, derde lid, van de W.V.O.][ref2] zijn van overeenkomstige toepassing ten aanzien van
      scholen en cursussen voor voortgezet onderwijs die deel uitmaken van een onderwijsgemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel77
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '77'
  - number: E.65.5
    text: |-
      Een openbare onderwijsgemeenschap HBO-instelling/voortgezet onderwijs kan uitgaan van een openbaar lichaam,
      ingesteld bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1],
      waarin deelnemen een of meer gemeenten dan wel een of meer gemeenten en het Rijk al dan niet te zamen met een
      of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid. Als bevoegd gezag van een openbare
      onderwijsgemeenschap als bedoeld in de eerste volzin, wordt het krachtens de desbetreffende regeling bevoegde
      orgaan aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: E.65.6
    text: Indien het bevoegd gezag besluit
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
  - number: E.65.6.a
    text: |-
      met ingang van 1 augustus 1986 geen onderwijsgemeenschap HBO-instelling/voortgezet onderwijs in stand te houden,
      dan wel
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
  - number: E.65.6.b
    text: |-
      op enig later tijdstip de onderwijsgemeenschap te beëindigen, wordt de bekostiging uit ’s Rijks kas van de scholen
      en cursussen voor voortgezet onderwijs uitsluitend voortgezet, indien is voldaan aan door Onze minister te stellen
      voorwaarden met betrekking tot de omvang van deze scholen en cursussen alsmede de spreiding ervan in het licht
      van een evenwichtig geheel van onderwijsvoorzieningen. [Hoofdstuk I van titel III van de Wet op het voortgezet
      onderwijs](onbekend) is in dat geval niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
  - number: E.65.7
    text: |-
      Indien niet aan de krachtens het vorige lid gestelde voorwaarden wordt voldaan, bepaalt Onze minister de datum van
      de beëindiging van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
  - number: E.65.8
    text: |-
      Onze minister geeft voorschriften met betrekking tot de gevolgen voor het personeel en voor de terreinen, gebouwen
      en de inventaris van de totstandkoming en beëindiging van onderwijsgemeenschappen HBO-instelling/voortgezet
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
  - number: E.65.9
    text: |-
      Indien onderwijsgemeenschappen dienen te worden beëindigd omdat bij koninklijk besluit de datum, bedoeld in het
      eerste lid, is bepaald, zijn het zesde en zevende lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
  - number: E.65.10
    text: |-
      Tegen een besluit als bedoeld in het zesde en het zevende lid kan een belanghebbende beroep instellen bij de
      Afdeling bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.65
