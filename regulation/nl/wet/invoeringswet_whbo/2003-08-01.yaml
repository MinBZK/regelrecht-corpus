  - number: E.45.2
    text: |-
      Aan de instelling alsmede aan de scholen en cursussen, bedoeld in het eerste lid, wordt voor 1 november 1986
      een medezeggenschapsraad gekozen. Het bevoegd gezag en de medezeggenschapsraad, gekozen aan de in het eerste lid
      bedoelde scholengemeenschap, treffen voor de periode tot aan de verkiezing van de in de eerste volzin bedoelde raad
      een voorziening voor de uitoefening van de in de wet en het reglement neergelegde medezeggenschapsbevoegdheden.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.45
  - number: E.45.3
    text: |-
      [Artikel E.44][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003966#Afdeling9
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.45
