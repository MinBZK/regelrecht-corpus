  - number: E.9.3
    text: |-
      Ten aanzien van de vooropleidingseisen, de cursusduur, de stages, de examens en de vakanties van de in het tweede
      lid genoemde opleidingen en cursussen blijven de op 31 juli 1986 geldende voorschriften van toepassing. Onze
      minister kan toestaan dat wordt afgeweken van de op 31 juli 1986 geldende voorschriften, voor zover dit naar zijn
      oordeel voor een goede gang van zaken noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.9
  - number: E.9.4
    text: |-
      De bekostiging van de in het tweede lid genoemde opleidingen en cursussen geschiedt volgens door Onze minister te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.9
  - number: E.9.5
    text: |-
      Op de in het tweede lid genoemde opleidingen en cursussen zijn de bepalingen van de titels III tot en met VI van
      hoofdstuk II van de W.H.B.O. met uitzondering van de artikelen 38, 40, 41 en 43, alsmede de op die titels van
      toepassing zijnde bepalingen in deze wet, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.9
  - number: E.9.6
    text: |-
      De bij een instelling ingeschreven studenten voor een opleiding of cursus, genoemd in het tweede lid, tellen niet
      mee bij de vaststelling van het aantal bij de instelling ingeschreven studenten, bedoeld in artikel 166 van de
      W.H.B.O., met uitzondering van de studenten ingeschreven voor de cursussen bedoeld in de onderdelen *s* en *t* van
      dat lid.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.9
  - number: E.9.7
    text: |-
      De cursussen bedoeld in de onderdelen *s* en *t* van het tweede lid, worden voor de toepassing van artikel 14,
      tweede lid, van de W.H.B.O. beschouwd als opleidingen van de tweede fase.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.9
  - number: E.9.8
    text: |-
      Onze minister kan toestaan dat het bevoegd gezag na beëindiging van de bekostiging van het hoogste leerjaar
      ingevolge het eerste en tweede lid, ten aanzien van de cursussen bedoeld in de onderdelen *s* en *t* van het tweede
      lid alsnog voor een studiejaar een hoogste leerjaar vormt volgens de op 31 juli 1986 geldende voorschriften. De
      tweede volzin van het derde lid is van toepassing.
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.9
  - number: E.45.1
    text: |-
      Het medezeggenschapsreglement, vastgesteld aan een scholengemeenschap als bedoeld in [artikel E.65][ref1],
      eerste lid, geldt met ingang van 1 augustus 1986 als krachtens de W.H.B.O. onderscheidenlijk de
      [Wet medezeggenschap onderwijs][ref2] vastgesteld aan de instelling die krachtens [artikel E.1][ref3] uit
      deze scholengemeenschap voortkomt, onderscheidenlijk aan de scholen en cursussen voor ander voortgezet
      onderwijs, bedoeld in [artikel E.65, eerste lid][ref4], met uitzondering van de bepalingen ten aanzien waarvan
      het bevoegd gezag en de medezeggenschapsraad gezamenlijk constateren dat zij, gezien de veranderingen in de
      feitelijke situatie, niet kunnen werken in de situatie vanaf 1 augustus 1986. Het bevoegd gezag legt tijdig
      voor laatstgenoemde datum een voorstel aan de medezeggenschapsraad voor tot aanpassing van het reglement aan de
      situatie vanaf 1 augustus 1986, voor zover dit uit de veranderingen in de feitelijke situatie noodzakelijkerwijs
      voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0003966#Afdeling11
      [ref2]: https://wetten.overheid.nl/BWBR0005746
      [ref3]: https://wetten.overheid.nl/BWBR0003966#Afdeling1
      [ref4]: https://wetten.overheid.nl/BWBR0003966#Afdeling11
