  - number: E.48
    text: |-
      Tot het tijdstip waarop toepassing wordt gegeven aan artikel 70, tweede lid, van de W.H.B.O.,
      is van overeenkomstige toepassing het op de dag voor de datum van inwerkingtreding van de
      [Wet medezeggenschap onderwijs 1992][ref1] (*Stb.* 1992, 663) bepaalde bij of krachtens
      [artikel 17, tweede lid, van de Wet medezeggenschap onderwijs][ref2] (*Stb.* 1981, 778).


      [ref1]: https://wetten.overheid.nl/BWBR0005746
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel17
    url: https://wetten.overheid.nl/BWBR0003966/2003-08-01#ArtikelE.48
    references:
