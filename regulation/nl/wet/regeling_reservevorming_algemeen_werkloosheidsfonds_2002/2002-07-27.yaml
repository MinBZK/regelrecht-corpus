  - number: '2'
    text: |-
      1 De in [artikel 79 van de Werkloosheidswet][ref1] bedoelde reserve voor het Algemeen Werkloosheidsfonds wordt
      niet gevormd of instandgehouden, indien in het tweede jaar voorafgaande aan het jaar waarin de reserve zou worden
      gevormd of instandgehouden, of in de 14 aan dat tweede jaar voorafgaande jaren, het lastenpercentage van de
      werkloosheidslasten niet ten minste éénmaal een wijziging van minimaal 0,2 procentpunt heeft gekend.

      2 De reserve heeft aan het einde van elk jaar een omvang van ten hoogste 2,5 maal de verzekerde loonsom in dat jaar
      maal het verschil tussen de grootste wijziging van het lastenpercentage van de werkloosheidslasten, bedoeld in het
      eerste lid, en 0,2 procentpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel79
    url: https://wetten.overheid.nl/BWBR0013828/2002-07-27#Artikel2
