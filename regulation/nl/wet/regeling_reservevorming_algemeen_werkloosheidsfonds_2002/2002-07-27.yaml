preamble:
  text: |-
    Gelet op artikel 51, achtste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013828/2002-07-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            jaar:

              kalenderjaar;



            b
            de verzekerde loonsom:

              het totaalbedrag van het loon, bedoeld in [artikel 84 van de Werkloosheidswet][ref1], waarover het
      Uitvoeringsinstituut werknemersverzekeringen in een jaar de aldaar bedoelde premies ten gunste van het Algemeen
      Werkloosheidsfonds zou ontvangen, indien [artikel 9, vierde lid, van de Coördinatiewet Sociale Verzekering][ref2]
      buiten toepassing zou blijven;



            c
            de werkloosheidslasten:

              hetgeen op grond van [artikel 93, onderdeel a, van de Werkloosheidswet][ref3] ten laste van het Algemeen
      werkloosheidsfonds komt;



            d
            het lastenpercentage:

              het percentage van de verzekerde loonsom in een jaar waarin de werkloosheidslasten van dat jaar tot
      uitdrukking komen;



            e
            de wijziging van het lastenpercentage in een jaar:

              het verschil tussen het lastenpercentage in een jaar en het lastenpercentage in het daaraan voorafgaande
      jaar.


