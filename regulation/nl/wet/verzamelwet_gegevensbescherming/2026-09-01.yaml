valid_from: '2026-09-01'
bwb_id: BWBR0052755
url: https://wetten.overheid.nl/BWBR0052755/2026-09-01
preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is te voorzien in een aanvulling op en wijziging van een
    aantal wettelijke regels ter bescherming van persoonsgegevens;


    Gelet op de Algemene verordening gegevensbescherming en artikel 10, tweede en derde lid, van de Grondwet;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0052755/2026-09-01#ArtikelAanhef
articles:
  - number: XIV
    text: >-
      Deze wet treedt in werking op een bij Koninklijk Besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0052755/2026-09-01#ArtikelXIV
  - number: XV
    text: 'Deze wet wordt aangehaald als: Verzamelwet gegevensbescherming.'
    url: https://wetten.overheid.nl/BWBR0052755/2026-09-01#ArtikelXV
