  - number: LXII
    text: |-
      Voor de periode 1 januari 1997 tot en met 28 februari 1997 kunnen, indien in de middelen tot dekking van de
      uitgaven verbonden aan de uitvoering van een door de Sociale Verzekeringsbank uit te voeren regeling wordt
      voorzien door het Rijk, bij ministeriële regeling regels worden gesteld ten aanzien van het beheer van gelden,
      uitvoeringskosten en verslaglegging als bedoeld in hoofdstuk VI van de Organisatiewet sociale verzekeringen, zoals
      deze wet op 28 februari 1997 luidde.
    url: https://wetten.overheid.nl/BWBR0009279/1999-01-01#ArtikelLXII
  - number: LXV
    text: |-
      De wet houdende bepalingen in verband met de aanpassing van de uitvoeringsorganisatie sociale verzekeringen per 1
      januari 1996 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009279/1999-01-01#ArtikelLXV
  - number: LXXI
    text: |-
      1 Ten aanzien van de mogelijkheid om beroep in te stellen tegen een besluit als bedoeld in artikel
      55 van de Organisatiewet sociale verzekeringen 1997 dat voor de datum van inwerkingtreding van
      [artikel LV, de onderdelen E, F en G][ref1], van deze wet is bekendgemaakt, is het recht zoals dat geldt vanaf die
      datum van toepassing.

      2 [Artikel 6:15, derde lid, van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing ten aanzien
      van beroepschriften tegen besluiten als bedoeld in het eerste lid, die op en na de datum van inwerkingtreding van
      [artikel LV, de onderdelen E, F en G][ref3], van deze wet zijn ingediend bij de rechtbank.

      3 De behandeling van het beroep tegen een besluit als bedoeld in artikel 55 van de Organisatiewet sociale
      verzekeringen 1997 dat voor de datum van inwerkingtreding van [artikel LV, de onderdelen E, F en G][ref4], van deze
      wet is ingediend bij de rechtbank wordt vanaf die datum voortgezet door de Centrale Raad van Beroep, tenzij op die
      datum partijen zijn uitgenodigd op een zitting van de rechtbank te verschijnen of schriftelijk toestemming hebben
      gegeven voor het achterwege blijven van het onderzoek ter zitting.

      4 De rechtbank informeert partijen over de verdere behandeling van het beroep door de Centrale Raad van Beroep.


