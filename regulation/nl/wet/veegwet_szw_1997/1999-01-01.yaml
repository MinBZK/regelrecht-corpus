preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet Werkloosheidsvoorziening te wijzigen en op een
    later tijdstip in te trekken, te komen tot een eenvormige definiëring van de term gezamenlijke huishouding in een
    aantal sociale zekerheidswetten en voorts, in verband met gebleken onvolkomenheden, die wetten en enige andere
    wetten aan te passen en daarnaast ook enige andere wijzigingen daarin aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009279/1999-01-01#ArtikelAanhef
articles:
  - number: XXIX
    text: |-
      Indien de toepassing van [artikel XXVIII, onderdeel A, onder 1][ref1], leidt tot wijziging in de verlening van
      woonvoorzieningen, vervoersvoorzieningen en rolstoelen op grond van de [Wet voorzieningen gehandicapten][ref2],
      gaat deze wijziging eerst één jaar na inwerkingtreding van deze wet in.


      [ref1]: https://wetten.overheid.nl/BWBR0009279#ArtikelXXVIII
      [ref2]: https://wetten.overheid.nl/BWBR0006169
