  - number: LXXIj
    text: |-
      Artikel IV van de wet van 19 december 1996, Stb. 665, houdende wijziging van de Organisatiewet sociale
      verzekeringen en enkele andere wetten, werkt terug tot en met 1 augustus 1993.
    url: https://wetten.overheid.nl/BWBR0009279/1999-01-01#ArtikelLXXIj
  - number: LXXII
    text: |-
      1 Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst, met uitzondering van de artikelen XV en XVI, die in werking treden met ingang van een bij
      koninklijk besluit te bepalen tijdstip, de [artikelen XXXIV, onderdeel N][ref1], [XXXVI, onderdeel T][ref2],
      [XLIII, onderdeel I][ref3], [XLIV, onderdeel E][ref4], [XLV, onderdeel F][ref5], [LXXIA][ref6], [LXXIB][ref7] en
      [LXXIH][ref8], die in werking treden met ingang van 1 januari 1998, en [artikel LV, onderdeel C][ref9], dat in
      werking treedt met ingang van 1 januari 1999.

      2 Indien
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ____________________________________________________________ op het moment van inwerkingtreding van deze wet
      nog niet tot wet is verheven en in werking is getreden, treden de [artikelen XVII tot en met XXXII][ref11], in
      afwijking van het eerste lid, eerst in werking op de dag na inwerkingtreding van voornoemd [hoofdstuk 9][ref12].

      3 Deze wet werkt terug wat betreft [artikel XXXIII, onderdeel A][ref13], tot en met 1
      maart 1996, wat betreft de [artikelen XXXIV, de onderdelen F, onder 1, G en H][ref14],
      [XXXV, de onderdelen H en I][ref15], [XXXVI, onderdeel P][ref16], [XLVIII, de onderdelen A en B][ref17],
      [LIII][ref18], [LV, de onderdelen A en D, onder 2][ref19], en [LXVI][ref20] tot en met 1 april
      1997, wat betreft [artikel XXXIV, onderdeel F, onder 2][ref21], tot en met 25 januari 1994,
      wat betreft [artikel XXXV, onderdeel F][ref22], tot en met de dag, voorafgaande aan die waarop
      [artikel II van de Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref23] in werking
      treedt, wat betreft de [artikelen XXXVI, de onderdelen B, C, D, onder 1, H, I, M. N, O, Q, onder 2, en R][ref24],
      [XXXIX, de onderdelen A en D, onder 1][ref25], [XLII, onderdeel B][ref26], [XLIII, onderdeel D][ref27],
      en[ LV, onderdeel B][ref28], tot en met 1 maart 1997, wat betreft de [artikelen XXXVI, onderdeel Q, onder 1][ref29],
      en [XLVII][ref30] tot en met 1 augustus 1996, wat betreft [artikel XXXIX, onderdeel H][ref31], tot en met 2
      oktober 1996, wat betreft de [artikelen XLIII, onderdeel B][ref32], en [LI][ref33] tot en met 1 juli 1997 en wat
      betreft [artikel XLVI][ref34] tot en met 29 december 1995, wat betreft de [artikelen LVI][ref35], [LX][ref36],
      [LXIII][ref37], [LXIV][ref38] en [LXIX][ref39] tot en met de datum waarop het in die artikelen genoemde voorstel
      van wet in werking is getreden.


