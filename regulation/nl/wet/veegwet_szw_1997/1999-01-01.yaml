  - number: LXI
    text: |-
      1 Gedurende de periode 1 maart 1996 tot en met 31 maart 1997 wordt in
      [artikel 40, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] na de zinsnede
      «op grond van artikel 29, vijfde lid, van die wet» ingevoegd: dan wel na afloop van de in
      [artikel 1638c, eerste lid, van Boek 7A van het Burgerlijk Wetboek][ref2] bedoelde tijdvak van 52 weken.

      2 Gedurende de periode 1 maart 1996 tot en met 31 maart 1997 wordt in de
      [artikelen 41, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref3] en 30, tweede lid, van de
      Algemene Arbeidsongeschiktheidswet na de zinsnede «krachtens de [Ziektewet][ref4]» ingevoegd: dan wel na afloop van
      de in [artikel 1638c, eerste lid, van Boek 7A van het Burgerlijk Wetboek][ref5] bedoelde tijdvak van 52 weken.

      3 Gedurende de periode 1 maart 1996 tot en met 28 februari 1997 wordt in
      [artikel 89, eerste lid, van de Werkloosheidswet][ref6], onder vervanging van de punt achter onderdeel f door een
      puntkomma, een nieuw onderdeel toegevoegd luidende:

      g. de bijdragen van de werkgever of werknemer in de kosten van het onderzoek, bedoeld in artikel 56a van de
      Organisatiewet sociale verzekeringen.

      4 Gedurende de periode 1 maart 1997 tot en met 31 maart 1997 wordt in artikel 38, eerste lid, van de Organisatiewet
      sociale verzekeringen 1997, onder vervanging van de punt aan het slot van onderdeel i door een puntkomma, een nieuw
      onderdeel j toegevoegd, luidende:

      j. op verzoek van een werkgever toestemming te geven als bedoeld in
      [artikel 1638c, derde lid, onderdeel c, van Boek 7A van het Burgerlijk Wetboek][ref7], tenzij de belangen van de
      betrokken werknemer onevenredig worden geschaad.

      5 Gedurende de periode 1 augustus 1996 tot en met 28 februari 1997 wordt in
      [artikel 89, eerste lid, van de Werkloosheidswet][ref8], onder vervanging van de punt achter onderdeel g door een
      puntkomma, een nieuw onderdeel toegevoegd, luidende:

      h. de bedragen die de bedrijfsvereniging ontvangt door toepassing van [artikel 45a van de Ziektewet][ref9], voor
      zover deze verband houden met op grond van [artikel 29, tweede lid, onderdeel a, b en c, van de Ziektewet][ref10]
      te betalen uitkeringen.

      6 Gedurende de periode 1 maart 1996 tot en met 31 maart 1997 wordt in
      [artikel 90, eerste lid, van de Werkloosheidswet][ref11], onder vervanging van de punt achter onderdeel g door een
      puntkomma, een nieuw onderdeel toegevoegd, luidende:

      h. de uitvoeringskosten, voor zover deze betrekking hebben op de uitvoering van de
      [artikelen 38, vierde lid][ref12], en [39 van de Ziektewet][ref13] en niet reeds op grond van onderdeel d ten
      laste van een wachtgeldfonds worden gebracht, alsmede de uitvoeringskosten, voor zover deze betrekking hebben op de
      uitvoering van [artikel 1638c, derde lid, onderdeel c, van Boek 7A van het Burgerlijk Wetboek][ref14].

      7 Gedurende de periode 1 augustus 1996 tot en met 28 februari 1997 wordt in
      [artikel 92 van de Werkloosheidswet][ref15], onder vervanging van de punt achter onderdeel e door een puntkomma,
      een nieuw onderdeel toegevoegd, luidende:

      f. de bedragen die de bedrijfsvereniging ontvangt door toepassing van [artikel 45a van de Ziektewet][ref16], voor
      zover deze verband houden met te betalen uitkeringen op grond van de [Ziektewet][ref17], anders dan op grond van
      [artikel 29, tweede lid, onderdeel a, b en c, van die wet][ref18].


