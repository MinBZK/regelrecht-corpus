---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_geneeskundig_onderzoek_vaarbewijzen_binnenvaart
regulatory_layer: WET
publication_date: '2008-03-28'
valid_from: '2006-03-01'
bwb_id: BWBR0010270
url: https://wetten.overheid.nl/BWBR0010270/2006-03-01
preamble:
  text: |-
    Gelet op artikel 21 van de Binnenschepenwet en de artikelen 6, derde lid, en 7, zesde lid, van het Besluit
    vaarbewijzen binnenvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             Divisie Scheepvaart:

              divisie Scheepvaart van de Inspectie Verkeer en Waterstaat;



            b
             aanvrager:

              degene die in aanmerking wenst te komen voor de afgifte van een vaarbewijs als bedoeld in
      [artikel 16 van de Binnenschepenwet][ref1];



            c
             arts:

              de arts, bedoeld in [artikel 21, eerste lid, van de Binnenschepenwet][ref2];



            d
             deskundige:

              de deskundige, bedoeld in [artikel 21, tweede lid, van de Binnenschepenwet][ref3];



            e
            geneeskundig onderzoek:

              het onderzoek, bedoeld in [artikel 21 van de Binnenschepenwet][ref4];



            f
            geneeskundige verklaring:

              de verklaring, bedoeld in [artikel 21, eerste lid, van de Binnenschepenwet][ref5];



            g
             eigen verklaring:

              de verklaring, bedoeld in [artikel 23, tweede lid, van de Binnenschepenwet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0003443#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0003443#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0003443#Artikel23
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0003443
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0003443
        artikel: '21'
      - id: ref5
        bwb_id: BWBR0003443
        artikel: '21'
      - id: ref6
        bwb_id: BWBR0003443
        artikel: '23'
  - number: '2.1'
    text: |-
      Als artsen zijn aangewezen de in Nederland gevestigde geneeskundigen die op grond van
      [artikel 40, eerste lid, van de Zeevaartbemanningswet][ref1] zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
  - number: '2.2'
    text: |-
      Als deskundigen zijn aangewezen de medisch adviseur scheepvaart van de Divisie Scheepvaart en diens
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel2
  - number: '3.1'
    text: |-
      De aanvrager die een geneeskundige verklaring wenst te verkrijgen, wendt zich voor een geneeskundig onderzoek tot
      een arts, niet zijnde de behandelend arts van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel3
  - number: '3.2'
    text: De arts gaat niet tot een geneeskundig onderzoek over dan nadat de aanvrager zich heeft gelegitimeerd.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel3
  - number: '4.1'
    text: |-
      De arts verricht het geneeskundig onderzoek met inachtneming van de keuringseisen en keuringsaanwijzingen,
      opgenomen in [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010270
  - number: '4.2'
    text: |-
      De arts vermeldt de uitslag van het geneeskundig onderzoek op de geneeskundige verklaring, die is vastgesteld
      volgens het model, opgenomen in [bijlage II][ref1], en verstrekt de geneeskundige verklaring aan de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010270
  - number: '5.1'
    text: |-
      De arts verwijst de aanvrager voor een deelonderzoek door naar een op grond van
      [artikel 40, eerste lid, van de Zeevaartbemanningswet][ref1] aangewezen specialist, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
  - number: 5.1.a
    text: de aanvrager een gehoorapparaat draagt, een kunstlens heeft of refractieve chirurgie heeft ondergaan, of
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel5
  - number: 5.1.b
    text: |-
      er twijfel bestaat omtrent het voldoen aan de in de [bijlage I][ref1] opgenomen eisen ten aanzien van het gezichts-
      of gehoorvermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010270
  - number: '5.2'
    text: |-
      Indien in [bijlage I][ref1] een specialistisch rapport is voorgeschreven, verwijst de arts de aanvrager voor een
      deelonderzoek door naar een specialist.


      [ref1]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010270
  - number: '5.3'
    text: |-
      Indien de arts de aanvrager doorverwijst naar een specialist, maakt hij daartoe gebruik van het formulier dat is
      vastgesteld volgens het model, opgenomen in [bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010270
  - number: '6.1'
    text: |-
      De arts die na het geneeskundig onderzoek van oordeel is dat de aanvrager ongeschikt is, deelt de aanvrager mee dat
      een heronderzoek kan worden aangevraagd bij een van de deskundigen.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel6
  - number: '6.2'
    text: |-
      In het geval, bedoeld in het eerste lid, verzendt de arts een bericht van afkeuring dat is vastgesteld volgens
      het model, opgenomen in [bijlage III][ref1], naar de medisch adviseur scheepvaart van het Directoraat-Generaal. De
      medisch adviseur doet hiervan mededeling aan de Stichting Centraal Bureau Rijvaardigheidsbewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010270
  - number: '6.3'
    text: |-
      De aanvrager die een heronderzoek wenst, richt zich daarvoor tot een deskundige onder toezending van de
      geneeskundige verklaring.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel6
  - number: '6.4'
    text: |-
      Ten aanzien van het heronderzoek zijn de [artikelen 3, tweede lid][ref1], en [4][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010270#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010270#Artikel4
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010270
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010270
        artikel: '4'
  - number: '6.5'
    text: |-
      Indien de deskundige na het heronderzoek van oordeel is dat de aanvrager medisch ongeschikt is, doet hij hiervan
      mededeling aan de Stichting Centraal Bureau Rijvaardigheidsbewijzen.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel6
  - number: '7.1'
    text: |-
      De deskundige verwijst de aanvrager voor een deelonderzoek door naar een op grond van
      [artikel 40, eerste lid, van de Zeevaartbemanningswet][ref1] aangewezen specialist, indien er twijfel bestaat
      omtrent het voldoen aan de in de [bijlage I][ref2] opgenomen eisen ten aanzien van het gezicht- of gehoorvermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0010270
  - number: '7.2'
    text: De deskundige kan de aanvrager voor een deelonderzoek doorverwijzen naar een specialist.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel7
  - number: '8'
    text: |-
      Indien nog geen heronderzoek heeft plaatsgevonden, is een geneeskundige verklaring waarop is aangegeven dat de
      aanvrager geschikt is en die is afgegeven nadat door een andere arts een geneeskundige verklaring is afgegeven
      waarop is aangegeven dat de aanvrager ongeschikt is, ongeldig.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel8
  - number: '9.1'
    text: |-
      Indien de aanvrager van een klein vaarbewijs in de gevallen, bedoeld in [artikel 7, eerste lid][ref1], [aanhef
      en onder a, van het Besluit vaarbewijzen binnenvaart](onbekend), een eigen verklaring overlegt, maakt hij daartoe
      gebruik van het formulier dat is opgenomen in [bijlage V][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0010270
  - number: '9.2'
    text: |-
      Indien de aanvrager van een groot vaarbewijs in de gevallen, bedoeld in [artikel 7, eerste lid][ref1], [aanhef en
      onder b tot en met e, van het Besluit vaarbewijzen binnenvaart](onbekend), een eigen verklaring overlegt, maakt hij
      daartoe gebruik van het formulier dat is opgenomen in [bijlage VI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0010270
  - number: '9.3'
    text: |-
      Indien alle vragen van de eigen verklaring met ’nee’ zijn beantwoord, stuurt de aanvrager de ingevulde en
      ondertekende eigen verklaring in een gesloten enveloppe met daarop vermeld ’medisch beroepsgeheim’ naar:
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel9
  - number: 9.3.a
    text: de Koninklijke Nederlandse Toeristenbond ANWB in het geval, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel9
  - number: 9.3.b
    text: de Stichting Centraal Bureau Rijvaardigheidsbewijzen in het geval, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel9
  - number: '10.1'
    text: |-
      De eigen verklaring die op enige afwijking wijst, wordt voorzien van een aantekening van een arts, niet zijnde de
      behandelend arts van de aanvrager, waaruit de aard en de ernst van de afwijking blijkt.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel10
  - number: '10.2'
    text: |-
      De arts verzendt de in het eerste lid bedoelde eigen verklaring naar een deskundige. Voor de eigen verklaring
      die betrekking heeft op het klein vaarbewijs worden als deskundigen tevens aangewezen de keuringsartsen van het
      Centraal Bureau Rijvaardigheidsbewijzen.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel10
  - number: '11.1'
    text: |-
      In het geval, bedoeld in [artikel 10, eerste lid][ref1], verklaart de deskundige de aanvrager geschikt of
      ongeschikt. In geval van twijfel kan de deskundige de aanvrager oproepen voor een nader onderzoek. Indien nodig,
      kan de deskundige, onder gebruikmaking van het formulier dat is vastgesteld volgens het model, opgenomen in
      [bijlage IV][ref2], de aanvrager doorverwijzen voor een deelonderzoek naar een specialist.


      [ref1]: https://wetten.overheid.nl/BWBR0010270#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010270
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0010270
  - number: '11.2'
    text: |-
      In het geval, dat de deskundige de aanvrager geschikt verklaart, verstrekt de deskundige, onder vermelding van
      deze uitslag, de aanvrager een geneeskundige verklaring, die is vastgesteld volgens het model, opgenomen in
      [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010270
  - number: '11.3'
    text: |-
      In het geval, dat de deskundige de aanvrager ongeschikt verklaart, zendt de deskundige de aanvrager een bericht
      van afkeuring, dat is vastgesteld volgens het model, opgenomen in [bijlage III][ref1], onder mededeling van de
      mogelijkheid van heronderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010270
  - number: '11.4'
    text: |-
      De aanvrager die ongeschikt is verklaard en een heronderzoek wenst, wendt zich tot een deskundige die niet de
      deskundige is die reeds bij de beoordeling van de eigen verklaring was betrokken. Ten aanzien van het heronderzoek
      is [artikel 4][ref1] van overeenkomstige toepassing, met dien verstande, dat het heronderzoek kan bestaan uit het
      uitsluitend beoordelen van de ter beschikking staande medische gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0010270#Artikel4
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010270
        artikel: '4'
  - number: '11.5'
    text: 'De deskundige doet van het ongeschikt verklaren van een aanvrager mededeling aan:'
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel11
  - number: 11.5.a
    text: de Koninklijke Nederlandse Toeristenbond ANWB, indien het de aanvrage van een klein vaarbewijs betreft;
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel11
  - number: 11.5.b
    text: de Stichting Centraal Bureau Rijvaardigheidsbewijzen, indien het de aanvrage van een groot vaarbewijs betreft.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel11
  - number: '12'
    text: Onze Minister kan aanwijzingen geven ter uitvoering van de in deze regeling opgenomen bepalingen.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel12
  - number: '13'
    text: Het Keuringsbesluit vaarbewijzen binnenvaart wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling geneeskundig onderzoek vaarbewijzen binnenvaart.'
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel14
  - number: '15'
    text: Deze regeling treedt in werking met ingang van 1 maart 1999.
    url: https://wetten.overheid.nl/BWBR0010270/2006-03-01#Artikel15
