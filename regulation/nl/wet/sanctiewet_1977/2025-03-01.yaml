  - number: 10d
    text: |-
      1 Onze Minister van Financiën kan een bestuurlijke boete opleggen ter zake van overtreding van regels, gesteld
      krachtens [artikel 10b][ref1].

      2 Ten aanzien van de ondernemingen en instellingen, bedoeld in
      [artikel 10, tweede lid, onder a, b, c, d, f, g, h, i, j en k][ref2], is
      [artikel 1:85 van de Wet op het financieel toezicht][ref3] van overeenkomstige toepassing.

      3 Ten aanzien van de instellingen, bedoeld in [artikel 10, tweede lid, onder e][ref4], zijn [artikel 183][ref5] en
      [184 van de Pensioenwet][ref6] en [artikel 178][ref7] en [179 van de Wet verplichte beroepspensioenregeling][ref8],
      en de categorie-indeling op grond van de algemene maatregel van bestuur, bedoeld in
      [artikel 179 van de Pensioenwet][ref9], en de algemene maatregel van bestuur, bedoeld in
      [artikel 174 van de Wet verplichte beroepspensioenregeling][ref10] van overeenkomstige toepassing.

      4 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitoefening van de bevoegdheid,
      bedoeld in het eerste lid.


