preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is over te gaan tot vernieuwing en uitbreiding van de
    wettelijke mogelijkheden om, ter uitvoering van internationale besluiten, aanbevelingen en afspraken, beperkingen
    vast te stellen voor de betrekkingen met bepaalde staten of gebieden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003296/2025-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. sanctiebesluit: een algemene maatregel van bestuur als bedoeld in [artikel 2][ref1];

      b. sanctieregeling: een regeling als bedoeld in [artikel 2, tweede lid][ref2], of [artikel 7][ref3];

      c. Onze Minister: Onze Minister van Buitenlandse Zaken in overeenstemming met Onze Minister wie het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003296#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003296#Artikel7
