  - number: 10b
    text: |-
      1 Onze Minister van Financiën kan regels stellen voor de bedrijfsvoering met betrekking
      tot de administratieve organisatie en de interne controle van de instellingen, bedoeld in
      [artikel 10, tweede lid, onder a tot en met l][ref1].

      2 Onze Minister van Financiën kan regels stellen omtrent het al dan niet op verzoek verstrekken van gegevens door
      de instellingen, bedoeld in [artikel 10, tweede lid, onder a tot en met l][ref2].

      3 Onze Minister van Financiën kan ontheffing of vrijstelling verlenen van de op grond van het eerste en tweede lid
      gestelde regels.


