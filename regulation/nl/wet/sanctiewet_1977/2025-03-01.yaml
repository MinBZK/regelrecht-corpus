  - number: 10i
    text: |-
      1 Onze Minister van Financiën verstrekt, indien hij deelneemt aan een samenwerkingsverband als bedoeld in de
      [Wet gegevensverwerking door samenwerkingsverbanden][ref1], in afwijking van [artikel 10g, eerste lid][ref2], aan
      het samenwerkingsverband gegevens behorend tot de in [hoofdstuk 2 van die wet][ref3] of bij algemene maatregel
      van bestuur op grond van die wet aangewezen categorieën, voor zover dat noodzakelijk is voor het doel van dat
      samenwerkingsverband, tenzij naar het oordeel van Onze Minister van Financiën zwaarwegende redenen zich daartegen
      verzetten.

      2 Indien voor de verstrekking aan bepaalde partijen op grond van de
      [artikelen 10g, tweede tot en met vierde lid][ref4], en [10h][ref5] bijzondere regels gelden, geschiedt de in het
      eerste lid bedoelde verstrekking steeds met inachtneming van die regels.

      3 Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld aan de verstrekkingen op
      grond van dit artikel.


