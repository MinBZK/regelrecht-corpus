  - number: '3'
    text: |-
      1 De in [artikel 2][ref1] bedoelde regels kunnen betreffen het goederen-, diensten- en financieel verkeer,
      de scheepvaart, de luchtvaart, het wegverkeer, de post en de telecommunicatie en al hetgeen overigens is
      vereist ter voldoening aan de verdragen, besluiten, aanbevelingen dan wel internationale afspraken, bedoeld in
      [artikel 2][ref2].

      2 Onder het in het eerste lid genoemde verkeer wordt begrepen iedere handeling, die kennelijk rechtstreeks is
      gericht op het bewerkstelligen van zulk verkeer.

      3 De in [artikel 2][ref3] bedoelde regels kunnen mede voorschriften inhouden betreffende de in het verband van de
      onderwerpen, aangeduid in het eerste lid, gebruikelijke documenten.

      4 Deze wet laat de bevoegdheden krachtens de [Algemene douanewet][ref4] onverlet.


