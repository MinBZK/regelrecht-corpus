  - number: '10'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren of andere
      personen die door Onze Minister zijn aangewezen.

      2 Onverminderd het eerste lid kan Onze Minister van Financiën een of meer rechtspersonen aanwijzen die belast zijn
      met het toezicht op de naleving van het bij of krachtens deze afdeling bepaalde met betrekking tot het financieel
      verkeer, door:

      a. financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van
      bank mogen uitoefenen,

      b. financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref2] in Nederland rechten van
      deelneming in een beleggingsinstelling mogen aanbieden of beheerder van een beleggingsinstelling mogen zijn,

      c. financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref3] in Nederland het bedrijf van
      wisselinstelling mogen uitoefenen,

      d. financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref4] in Nederland beleggingsdiensten
      mogen verlenen,

      e. de pensioenfondsen, bedoeld in [artikel 1 van de Pensioenwet][ref5] en de beroepspensioenfondsen, bedoeld in
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref6],

      f. financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref7] in Nederland het bedrijf van
      verzekeraar mogen uitoefenen,

      g. het notarieel pensioenfonds, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________,

      h. de trustkantoren die zijn ingeschreven in het register, bedoeld in
      [artikel 9, eerste lid, van de Wet toezicht trustkantoren 2018][ref9],

      i. financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref10] in Nederland het bedrijf van
      elektronischgeldinstelling mogen uitoefenen,

      j. financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref11] in Nederland het bedrijf van
      betaaldienstverlener mogen uitoefenen;

      k. financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref12] in Nederland rechten van
      deelneming in een icbe mogen aanbieden of beheerder van een icbe mogen zijn;

      l. aanbieders van cryptoactivadiensten waarop de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref13] van toepassing is.

      3 Ten aanzien van personen die door een op grond van het tweede lid aangewezen rechtspersoon belast zijn
      met het toezicht op de naleving van het bij of krachtens deze afdeling bepaalde zijn de bepalingen van
      [hoofdstuk 5, afdeling 5.2, van de Algemene wet bestuursrecht][ref14] van overeenkomstige toepassing.

      4 Van een besluit tot aanwijzing op grond van het eerste of tweede lid wordt mededeling gedaan door plaatsing in
      de Staatscourant.


