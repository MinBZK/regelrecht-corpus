  - number: '13'
    text: |-
      De Nederlandse strafwet is toepasselijk op de Nederlander die zich buiten Nederland schuldig maakt aan een bij of
      krachtens deze wet strafbaar gesteld feit.
    url: https://wetten.overheid.nl/BWBR0003296/2025-03-01#Artikel13
  - number: '14'
    text: |-
      1 Deze wet, met uitzondering van de [artikelen 4][ref1], [10, tweede en derde lid][ref2], en
      [10a tot en met 11][ref3], is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, met
      inachtneming van het in deze afdeling bepaalde.

      2 [Titel 5.2 van de Algemene wet bestuursrecht][ref4] is van toepassing.


