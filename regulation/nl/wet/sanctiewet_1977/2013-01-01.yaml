      de pensioenfondsen, bedoeld in [artikel 1 van de Pensioenwet][ref1] en de beroepspensioenfondsen, bedoeld in
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10
