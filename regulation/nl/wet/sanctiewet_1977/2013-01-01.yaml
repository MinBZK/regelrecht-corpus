      [artikel 10, tweede lid, onder a, b, c, d, f, g, h, i en j][ref1], is
      [artikel 1:85 van de Wet op het financieel toezicht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '10'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 10d.3
    text: |-
