    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 10.2.d
    text: |-
      financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland beleggingsdiensten
