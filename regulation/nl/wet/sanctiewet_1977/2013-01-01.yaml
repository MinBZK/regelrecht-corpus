  - number: 10d.4
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitoefening van de bevoegdheid,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10d
  - number: 10e.1
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat
      de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 4 000 000 bedraagt. Indien tijdens het
      plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een bestuurlijke boete aan de
      overtreder ter zake van eenzelfde overtreding, wordt het bedrag van de bestuurlijke boete, bedoeld in de eerste
      volzin, voor een afzonderlijke overtreding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10e
  - number: 10e.2
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:








                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10 000,–


                    € 0,–


                    € 10 000,–




                    2


                    € 500 000,–


                    € 0,–


                    € 1 000 000,–




                    3


                    € 2 000 000,–


                    € 0,–


                    € 4 000 000,–
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10e
  - number: 10e.3
    text: |-
      In afwijking van het eerste en tweede lid kan de toezichthouder de hoogte van de bestuurlijke boete vaststellen
      op ten hoogste twee keer het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen indien
      diens voordeel groter is dan € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10e
  - number: 10f.1
    text: |-
      De bevoegdheden die Onze Minister van Financiën op grond van deze afdeling heeft, kunnen bij algemene maatregel
      van bestuur worden overgedragen aan een of meer rechtspersonen die ingevolge [artikel 10, tweede lid][ref1], zijn
      aangewezen. Alsdan gelden de verplichtingen op grond van deze afdeling jegens Onze Minister van Financiën als
      verplichtingen jegens de desbetreffende rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '10'
        afdeling: '5'
  - number: 10f.2
    text: Aan de overdracht, bedoeld in het eerste lid, kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10f
  - number: 10g.1
    text: |-
      Gegevens en inlichtingen die ingevolge het bij of krachtens deze afdeling bepaalde omtrent afzonderlijke
      ondernemingen, instellingen of personen zijn verstrekt of zijn verkregen en gegevens en inlichtingen die van een
      instantie als bedoeld in [artikel 10h][ref1] zijn ontvangen, worden niet gepubliceerd en zijn geheim.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10h
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: 10h
        afdeling: '5'
  - number: 10g.2
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze afdeling of krachtens deze afdeling genomen
      besluiten enige taak vervult, verboden van gegevens of inlichtingen, ingevolge genoemde artikelen verstrekt of
      van een instantie als bedoeld in [artikel 10h][ref1] ontvangen, of van gegevens of inlichtingen, bij het onderzoek
      van zakelijke gegevens en van bescheiden verkregen, verder of anders gebruik te maken of daaraan verder of anders
      bekendheid te geven dan voor de uitoefening van zijn taak of op grond van deze afdeling wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10h
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: 10h
        afdeling: '5'
  - number: 10g.3
    text: |-
      Het eerste en tweede lid laten, ten aanzien van degene op wie het tweede lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 10g.4
    text: |-
      Het in het eerste en tweede lid bepaalde laat evenzo, ten aanzien van degene op wie het tweede lid van toepassing
      is, onverlet de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] en
      van [artikel 66 van de Faillissementswet][ref2] welke betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze afdeling opgedragen taak, voor zover het
      gaat om gegevens of inlichtingen omtrent een bank die in staat van faillissement is verklaard of op grond van een
      rechterlijke uitspraak is ontbonden. Het in de vorige volzin bepaalde geldt niet voor gegevens of inlichtingen
      die betrekking hebben op ondernemingen of instellingen die betrokken zijn of zijn geweest bij een poging de
      desbetreffende bank in staat te stellen haar bedrijf voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel66
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '66'
  - number: 10h
    text: |-
      Onze Minister van Financiën is, onverminderd de bepalingen terzake in bindende besluiten van organen van de
      Europese Unie of andere volkenrechtelijke organisaties, in afwijking van [artikel 10g][ref1], bevoegd om gegevens
      of inlichtingen verkregen bij de vervulling van de hem bij deze wet opgedragen taak, te verstrekken aan Nederlandse
      of buitenlandse overheidsinstanties dan wel aan Nederlandse of buitenlandse van overheidswege aangewezen instanties
      die belast zijn met het toezicht op de naleving of met de uitvoering van de verdragen, besluiten, aanbevelingen
      en afspraken, bedoeld in [artikel 2][ref2], op het gebied van het financieel verkeer en de daartoe krachtens dat
      artikel dan wel [artikel 7][ref3] gestelde regels, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10g
      [ref2]: https://wetten.overheid.nl/BWBR0003296#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003296#Artikel7
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10h
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: 10g
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003296
        artikel: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003296
        artikel: '7'
        afdeling: '3'
  - number: 10h.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10h
  - number: 10h.b
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10h
  - number: 10h.c
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10h
  - number: 10h.d
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10h
  - number: 10h.e
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10h
  - number: '11.1'
    text: |-
      Onze Minister kan bevoegdheden die hem ingevolge een sanctiebesluit of een sanctieregeling toekomen, delegeren
      aan het bestuur van een bedrijfslichaam of het bestuur van een rechtspersoonlijkheid bezittend lichaam als bedoeld
      in [artikel 110 van de Wet op de bedrijfsorganisatie][ref1], tenzij het bepaalde bij of krachtens deze wet zich
      daartegen verzet. Onze Minister kan aan een delegatie op grond van de eerste volzin beperkingen verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel110
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '110'
  - number: '11.2'
    text: |-
      Besluiten van algemene strekking, vastgesteld met het oog op de uitoefening van een op grond van het eerste lid
      gedelegeerde bevoegdheid, behoeven de goedkeuring van Onze Minister. Goedkeuring kan slechts worden onthouden
      wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel11
  - number: '11.3'
    text: Een besluit van Onze Minister op grond van het eerste lid wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel11
  - number: '13'
    text: |-
      De Nederlandse strafwet is toepasselijk op de Nederlander die zich buiten Nederland schuldig maakt aan een bij of
      krachtens deze wet strafbaar gesteld feit.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel13
  - number: 14a
    text: |-
      Voor de toepassing van deze wet in de openbare lichamen Bonaire, Sint Eustatius en Saba gelden bindende besluiten,
      vastgesteld in het kader van het Gemeenschappelijk Buitenlands en Veiligheidsbeleid van de Europese Unie, als
      internationale verplichtingen in de zin van [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel2
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '2'
        afdeling: '2'
  - number: 14b
    text: |-
      Met de opsporing in de openbare lichamen Bonaire, Sint Eustatius en Saba van de in deze wet strafbaar gestelde
      feiten zijn belast, naast de in artikel 184 van het Wetboek van Strafvordering BES bedoelde ambtenaren, de daartoe
      bij besluit van Onze Minister van Justitie in overeenstemming met Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel14b
  - number: 14c.1
    text: |-
      Overtredingen van voorschriften gesteld bij of krachtens de [artikelen 2][ref1] en [7][ref2] zijn misdrijven
      voor zover zij opzettelijk zijn begaan. Voor zover deze gedragingen niet opzettelijk worden begaan, zijn zij
      overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003296#Artikel7
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003296
        artikel: '7'
        afdeling: '3'
  - number: 14c.2
    text: |-
      In geval van een misdrijf kan de rechter in de openbare lichamen Bonaire, Sint Eustatius en Saba een
      gevangenisstraf van ten hoogste zes jaar of een geldboete van de vijfde categorie opleggen.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel14c
  - number: 14c.3
    text: |-
      In geval van een overtreding kan de rechter in de openbare lichamen Bonaire, Sint Eustatius en Saba hechtenis van
      ten hoogste een jaar of een geldboete van de vierde categorie opleggen.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel14c
  - number: '15'
    text: De Uitvoerverbodenwet 1935 (*Stb.* 599) en de Sanctiewet 1935 (*Stb.* 621) treden voor Nederland buiten werking.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel15
  - number: '16.1'
    text: Deze wet kan worden aangehaald als Sanctiewet 1977.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel16
  - number: '16.2'
    text: Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel16
