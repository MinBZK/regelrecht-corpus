  - number: 10.2.f
    text: |-
      financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van
      verzekeraar mogen uitoefenen,


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 10.2.g
    text: |-
      het notarieel pensioenfonds, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________,


