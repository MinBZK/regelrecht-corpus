        artikel: '66'
  - number: '2.1'
    text: |-
      Ter voldoening aan verdragen, besluiten of aanbevelingen van organen van volkenrechtelijke organisaties, dan
      wel aan internationale afspraken, met betrekking tot de handhaving of het herstel van de internationale vrede en
      veiligheid of de bevordering van de internationale rechtsorde dan wel de bestrijding van terrorisme, kunnen bij
      algemene maatregel van bestuur ten aanzien van de in de [artikelen 3][ref1] en [4][ref2] bedoelde onderwerpen
      regels worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003296#Artikel4
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003296
        artikel: '4'
        afdeling: '2'
  - number: '2.2'
    text: |-
      Indien de te stellen regels uitsluitend strekken ter uitvoering van verplichtingen die voortvloeien uit verdragen
      of uit bindende besluiten van volkenrechtelijke organisaties kan Onze Minister deze vaststellen.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      De in [artikel 2][ref1] bedoelde regels kunnen betreffen het goederen-, diensten- en financieel verkeer,
      de scheepvaart, de luchtvaart, het wegverkeer, de post en de telecommunicatie en al hetgeen overigens is
      vereist ter voldoening aan de verdragen, besluiten, aanbevelingen dan wel internationale afspraken, bedoeld in
      [artikel 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003296#Artikel2
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003296
        artikel: '2'
        afdeling: '2'
  - number: '3.2'
    text: |-
      Onder het in het eerste lid genoemde verkeer wordt begrepen iedere handeling, die kennelijk rechtstreeks is gericht
      op het bewerkstelligen van zulk verkeer.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel3
  - number: '3.3'
    text: |-
      De in [artikel 2][ref1] bedoelde regels kunnen mede voorschriften inhouden betreffende de in het verband van de
      onderwerpen, aangeduid in het eerste lid, gebruikelijke documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel2
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '2'
        afdeling: '2'
  - number: '3.4'
    text: |-
      Deze wet laat de bevoegdheden krachtens de [Algemene douanewet][ref1] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0023746
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023746
  - number: '4'
    text: |-
      De in [artikel 2][ref1] bedoelde regels kunnen tevens de toegang en het verblijf van vreemdelingen betreffen, in
      die zin dat voor zover nodig in afwijking van de [artikelen 3][ref2] en [12 van de Vreemdelingenwet 2000][ref3] de
      toegang en het verblijf aan in de regels aangeduide vreemdelingen kunnen worden geweigerd en dat Onze Minister van
      Justitie verblijfsvergunningen als bedoeld in de [artikelen 14][ref4] en [20 van de Vreemdelingenwet 2000][ref5]
      van de bedoelde vreemdelingen kan intrekken. Een intrekking op grond van dit artikel geldt als een intrekking op
      grond van [artikel 19][ref6] respectievelijk [artikel 22 van de Vreemdelingenwet 2000][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0011823#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0011823#Artikel19
      [ref7]: https://wetten.overheid.nl/BWBR0011823#Artikel22
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '2'
