preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is over te gaan tot vernieuwing en uitbreiding van de
    wettelijke mogelijkheden om, ter uitvoering van internationale besluiten, aanbevelingen en afspraken, beperkingen
    vast te stellen voor de betrekkingen met bepaalde staten of gebieden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel1
  - number: 1.a
    text: |-
      sanctiebesluit: een algemene maatregel van bestuur als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel2
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel1
    references:
