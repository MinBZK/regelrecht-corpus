      [184 van de Pensioenwet][ref3] en [artikel 178][ref4] en [179 van de Wet verplichte beroepspensioenregeling][ref5],
      en de categorie-indeling op grond van de algemene maatregel van bestuur, bedoeld in
      [artikel 179 van de Pensioenwet][ref6], en de algemene maatregel van bestuur, bedoeld in
      [artikel 174 van de Wet verplichte beroepspensioenregeling][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel183
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel184
