      financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland rechten van
      deelneming in een beleggingsinstelling mogen aanbieden of beheerder van een beleggingsinstelling mogen zijn,


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10
    references:
      - id: ref1
