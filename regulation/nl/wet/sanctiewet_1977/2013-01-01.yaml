    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel1
  - number: 1.d
    text: |-
      bedrijfslichaam: een bedrijfslichaam als bedoeld in
      [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel1
    references:
