  - number: '10.3'
    text: |-
      Ten aanzien van personen die door een op grond van het tweede lid aangewezen rechtspersoon belast zijn
      met het toezicht op de naleving van het bij of krachtens deze afdeling bepaalde zijn de bepalingen van
      [hoofdstuk 5, afdeling 5.2, van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.2'
  - number: '10.4'
    text: |-
      Van een besluit tot aanwijzing op grond van het eerste of tweede lid wordt mededeling gedaan door plaatsing in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10
  - number: 10a
    text: |-
      Onze Minister van Financiën kan de krachtens [artikel 10, tweede lid][ref1], aangewezen rechtspersonen
      in de gelegenheid stellen hun zienswijze naar voren te brengen omtrent de uitvoering van de op grond van
      [artikel 2][ref2] dan wel [artikel 7][ref3] vastgestelde regels betreffende het financieel verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003296#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003296#Artikel7
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '10'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003296
        artikel: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003296
        artikel: '7'
        afdeling: '3'
  - number: 10b.1
    text: |-
      Onze Minister van Financiën kan regels stellen voor de bedrijfsvoering met betrekking
      tot de administratieve organisatie en de interne controle van de instellingen, bedoeld in
      [artikel 10, tweede lid, onder a tot en met j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '10'
        afdeling: '5'
  - number: 10b.2
    text: |-
      Onze Minister van Financiën kan regels stellen omtrent het al dan niet op verzoek verstrekken van gegevens door de
      instellingen, bedoeld in [artikel 10, tweede lid, onder a tot en met j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '10'
        afdeling: '5'
  - number: 10b.3
    text: |-
      Onze Minister van Financiën kan ontheffing of vrijstelling verlenen van de op grond van het eerste en tweede lid
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10b
  - number: 10c
    text: |-
      Onze Minister van Financiën kan een last onder dwangsom opleggen ter zake van overtreding van regels, gesteld
      krachtens [artikel 10b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10b
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: 10b
        afdeling: '5'
  - number: 10d.1
    text: |-
      Onze Minister van Financiën kan een bestuurlijke boete opleggen ter zake van overtreding van regels, gesteld
      krachtens [artikel 10b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10b
    url: https://wetten.overheid.nl/BWBR0003296/2013-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: 10b
        afdeling: '5'
  - number: 10d.2
    text: |-
