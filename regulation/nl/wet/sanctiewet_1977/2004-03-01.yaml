        artikel: '14'
      - id: ref5
        bwb_id: BWBR0011823
        artikel: '20'
      - id: ref6
        bwb_id: BWBR0011823
        artikel: '19'
      - id: ref7
        bwb_id: BWBR0011823
        artikel: '22'
  - number: '6.1'
    text: |-
      Een sanctiebesluit, zomede een besluit tot wijziging of intrekking daarvan, treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad,* waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel6
  - number: '6.2'
    text: |-
      Met betrekking tot een sanctiebesluit anders dan ter voldoening aan een verplichting die voortvloeit uit een
      verdrag of uit een bindend besluit van een volkenrechtelijke organisatie, dan wel met betrekking tot een besluit
      tot intrekking of wijziging daarvan, kan, binnen één maand na de datum van uitgifte van het *Staatsblad* waarin het
      betrokken besluit wordt geplaatst, door of namens één der Kamers der Staten-Generaal of door ten minste een vijfde
      van één dier Kamers de wens te kennen worden gegeven dat het betrokken besluit bij de wet zal worden bekrachtigd.
      Indien zodanige wens te kennen is gegeven dienen Wij zo spoedig mogelijk een desbetreffend wetsontwerp in.
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel6
  - number: '6.3'
    text: |-
      Indien een overeenkomstig het tweede lid ingediend wetsontwerp door één der beide Kamers der Staten-Generaal wordt
      verworpen, wordt het desbetreffende besluit onverwijld ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel6
  - number: '6.4'
    text: |-
      Een sanctiebesluit vervalt, behoudens eerdere intrekking, drie jaren na het in werking treden, tenzij bij nadere
      wet anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel6
  - number: '7'
    text: |-
      Bij regeling kan Onze Minister, wanneer hij overweegt een voordracht tot vaststelling, wijziging of intrekking van
      een sanctiebesluit te doen en naar zijn oordeel een gewichtige reden een onmiddellijke voorziening eist, regels
      overeenkomstig het in overweging zijnde besluit vaststellen alsmede in een bestaand sanctiebesluit vervatte regels
      buiten werking stellen.
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel7
  - number: '8'
    text: |-
      Een sanctieregeling op grond van [artikel 7][ref1] blijft, behoudens eerdere intrekking van kracht totdat een
      krachtens [artikel 2][ref2] vastgesteld besluit, dat hetzelfde onderwerp betreft, in werking treedt, doch uiterlijk
      tot tien maanden na het in werking treden van de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003296#Artikel2
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '7'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003296
        artikel: '2'
        afdeling: '2'
  - number: '9.1'
    text: |-
      Van voorschriften in regels op grond van [artikel 2][ref1] of [artikel 7][ref2] gesteld ten aanzien van de
      onderwerpen, bedoeld in [artikel 3][ref3], kan Onze in het sanctiebesluit of in de sanctieregeling aangewezen
      Minister vrijstelling en, op daartoe strekkend verzoek, ontheffing verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003296#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003296#Artikel3
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003296
        artikel: '7'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0003296
        artikel: '3'
        afdeling: '2'
  - number: '9.2'
    text: |-
      Een vrijstelling of ontheffing kan onder beperkingen worden verleend. Aan een vrijstelling of ontheffing kunnen
      verplichtingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel9
  - number: '9.3'
    text: |-
      Onze in het eerste lid bedoelde Minister kan een ontheffing intrekken indien de ter verkrijging daarvan verstrekte
      gegevens zodanig onjuist of onvolledig blijken, dat op de aanvrage een andere beslissing zou zijn genomen, als bij
      de beoordeling daarvan de juiste omstandigheden volledig bekend waren geweest.
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel9
  - number: '9.4'
    text: |-
      Onze in het eerste lid bedoelde Minister kan de ontheffingen behorende tot een door hem aangewezen groep,
      intrekken, indien een gewichtige reden dit naar zijn oordeel noodzakelijk maakt. De bekendmaking van een krachtens
      het eerste lid vastgesteld besluit geschiedt door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel9
  - number: '10.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren of andere
      personen die door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
  - number: '10.2'
    text: |-
      Onverminderd het eerste lid kan Onze Minister van Financiën een of meer rechtspersonen aanwijzen die belast zijn
      met het toezicht op de naleving van het bij of krachtens deze afdeling bepaalde met betrekking tot het financieel
      verkeer, door:
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
  - number: 10.2.a
    text: |-
      de kredietinstellingen en financiële instellingen die zijn geregistreerd op grond van
      [artikel 52, tweede lid, onder a, b, c, e en f van de Wet toezicht kredietwezen 1992][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
  - number: 10.2.b
    text: |-
      de beleggingsinstellingen die zijn geregistreerd op grond van
      [artikel 18, eerste lid, onder a en c, van de Wet toezicht beleggingsinstellingen][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel18
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '18'
  - number: 10.2.c
    text: |-
      de geldtransactiekantoren die zijn geregistreerd op grond van
      [artikel 2 van de Wet inzake de geldtransactiekantoren][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel2
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '2'
  - number: 10.2.d
    text: |-
      de effecteninstellingen, bedoeld in [artikel 7, tweede lid, onder i][ref1], en de effecteninstellingen die een
      vergunning hebben op grond van [artikel 7, vierde lid, van de Wet toezicht effectenverkeer 1995][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel7
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: '7'
  - number: 10.2.e
    text: |-
      de pensioenfondsen, bedoeld in [artikel 1, eerste lid, onder b, c, d en l, van de Pensioen- en Spaarfondsenwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '1'
  - number: 10.2.f
    text: |-
      de verzekeraars die op een lijst staan als bedoeld in
      [artikel 9, eerste lid, onder a en b, van de Wet toezicht verzekeringsbedrijf 1993][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel9
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '9'
  - number: 10.2.g
    text: |-
      het pensioenfonds, bedoeld in [artikel 13, derde lid, onder d, van de Wet toezicht verzekeringsbedrijf 1993][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel13
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '13'
  - number: 10.2.h
    text: |-
      de verzekeraars die op een lijst staan als bedoeld in
      [artikel 4, eerste lid, onder a, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel4
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '4'
  - number: 10.2.i
    text: |-
      de trustkantoren die zijn ingeschreven in het register, bedoeld in
      [artikel 7, eerste lid, van de Wet toezicht trustkantoren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel7
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '7'
  - number: '10.3'
    text: |-
      Ten aanzien van personen die door een op grond van het tweede lid aangewezen rechtspersoon belast zijn
      met het toezicht op de naleving van het bij of krachtens deze afdeling bepaalde zijn de bepalingen van
      [hoofdstuk 5, afdeling 5.2, van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.2'
  - number: '10.4'
    text: |-
      Van een besluit tot aanwijzing op grond van het eerste of tweede lid wordt mededeling gedaan door plaatsing in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10
  - number: 10a
    text: |-
      Onze Minister van Financiën kan de krachtens [artikel 10, tweede lid][ref1], aangewezen rechtspersonen in de
      gelegenheid stellen hun zienswijze naar voren te brengen omtrent de beoordeling van aanvragen om een ontheffing als
      bedoeld in [artikel 9, eerste lid][ref2], alsmede omtrent de uitvoering van de op grond van [artikel 2][ref3] dan
      wel [artikel 7][ref4] vastgestelde regels betreffende het financieel verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003296#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003296#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003296#Artikel7
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '10'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003296
        artikel: '9'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003296
        artikel: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003296
        artikel: '7'
        afdeling: '3'
  - number: 10b.1
    text: |-
      Onze Minister van Financiën kan regels stellen voor de bedrijfsvoering met betrekking
      tot de administratieve organisatie en de interne controle van de instellingen, bedoeld in
      [artikel 10, tweede lid, onder a tot en met h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '10'
        afdeling: '5'
  - number: 10b.2
    text: |-
      Onze Minister van Financiën kan regels stellen omtrent het al dan niet op verzoek verstrekken van gegevens door de
      instellingen, bedoeld in [artikel 10, tweede lid, onder a tot en met h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '10'
        afdeling: '5'
  - number: 10b.3
    text: |-
      Onze Minister van Financiën kan ontheffing of vrijstelling verlenen van de op grond van het eerste en tweede lid
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0003296/2004-03-01#Artikel10b
  - number: 10c.1
    text: |-
      Onze Minister van Financiën kan een last onder dwangsom opleggen ter zake van overtreding van regels,
      gesteld krachtens [artikel 10b][ref1]. De [artikelen 5:32, tweede tot en met vijfde lid][ref2], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht zijn van toepassing][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
