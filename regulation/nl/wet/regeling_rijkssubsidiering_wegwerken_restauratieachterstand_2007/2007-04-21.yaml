  - number: '8'
    text: |-
      1 Subsidiabel zijn de kosten van werkzaamheden, maatregelen en voorzieningen als bedoeld in de Leidraad Brim
      subsidiabele instandhoudingskosten, opgenomen als [bijlage bij de Regeling rijkssubsidiëring instandhouding
      monumenten](onbekend), met dien verstande dat kosten uitsluitend subsidiabel zijn voorzover de werkzaamheden:

      a. strekken tot restauratie van het beschermde monument en zijn monumentale waarden;

      b. sober en doelmatig zijn;

      c. technisch noodzakelijk zijn; en

      d. de werkzaamheden zijn gericht op maximaal behoud van aanwezige monumentale waarden, in het bijzonder historische
      materialen en constructies.

      2 Kosten voor werkzaamheden die zijn gericht op het voorkomen van verval of het voorkomen van vervolgschade, zijn
      subsidiabel.

      3 Kosten voor werkzaamheden die zijn gericht op vervanging van materialen die hun functie niet meer kunnen
      vervullen, zijn subsidiabel.

      4 Kosten voor werkzaamheden die zijn gericht op reconstructie, zijn niet subsidiabel, tenzij ze in uitzonderlijke
      gevallen naar het oordeel van de Minister ter versterking van de monumentale waarden gewenst zijn.

      5 Niet subsidiabel zijn:

      a. kosten voor werkzaamheden die voortvloeien uit veranderd gebruik; en

      b. kosten voor werkzaamheden die zijn gericht op comfortverbetering.
    url: https://wetten.overheid.nl/BWBR0021731/2007-04-21#Artikel8
  - number: '9'
    text: |-
      1 De subsidie voor eigenaren die geen recht hebben op fiscale aftrek van onderhoudskosten als bedoeld in
      [artikel 1, tweede lid, van het besluit][ref1] bedraagt 70% van de subsidiabele kosten.

      2 De subsidie voor eigenaren die recht hebben op fiscale aftrek van onderhoudskosten bedraagt 60% van de
      subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel1
    url: https://wetten.overheid.nl/BWBR0021731/2007-04-21#Artikel9
