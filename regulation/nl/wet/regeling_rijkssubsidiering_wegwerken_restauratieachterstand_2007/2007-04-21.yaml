  - number: '16'
    text: |-
      1 Nadat subsidie is verleend, kan de Minister aan de subsidieontvanger voorschotten verstrekken op basis van door
      de subsidieontvanger ingediende overzichten van gemaakte kosten die vergezeld gaan van de desbetreffende originele
      rekeningen en in voorkomend geval betalingsbewijzen.

      2 Indien rekeningen en betalingsbewijzen betrekking hebben op kosten van personeel dat in loondienst is bij
      de eigenaar, gaan de overzichten, bedoeld in het eerste lid, tevens vergezeld van een verklaring van een
      registeraccountant of een accountant-administratieconsulent waaruit blijkt hoeveel uren door dat personeel is
      besteed aan de restauratie, waarvoor subsidie is verleend.

      3 Onze Minister keert de voorschotten uit voorzover de rekeningen werkzaamheden betreffen die in overeenstemming
      zijn met het restauratieplan.
    url: https://wetten.overheid.nl/BWBR0021731/2007-04-21#Artikel16
  - number: '17'
    text: |-
      [Artikel 32 van het besluit][ref1] is van overeenkomstige toepassing met dien verstande dat uiterlijk drie maanden
      na afloop van de restauratie de subsidieontvanger een aanvraag tot vaststelling indient bij de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel32
