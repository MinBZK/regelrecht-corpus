        artikel: '1'
  - number: '10'
    text: |-
      Subsidie wordt niet verstrekt, indien:

      a. voor de voorgenomen restauratie geen vergunning als bedoeld in artikel 11 van de wet is verleend;

      b. naar het oordeel van de Minister niet is gewaarborgd, dat het beschermde monument na uitvoering van het
      restauratieplan zonder aanvullende restauratiewerkzaamheden in een goede staat kan worden gehouden; of

      c. de toekomstige bestemming van het te restaureren monument naar het oordeel van de Minister een belemmering vormt
      voor de instandhouding van het monument.
    url: https://wetten.overheid.nl/BWBR0021731/2007-04-21#Artikel10
  - number: '11'
    text: |-
      1 Onverminderd [artikel 10][ref1] wordt subsidie voor een monument met uitsluitend een orgelrestauratie niet
      verstrekt, indien:

      a. het monument behalve wat het orgel betreft ook voor het overige niet in een goede staat verkeert; of

      b. het binnenklimaat van het monument, waarvan het orgel een bestanddeel is, uit een oogpunt van instandhouding
      ongunstig is.

      2 Onverminderd [artikel 10][ref2] wordt subsidie voor molens niet verstrekt indien de functie als bedrijfsvaardige
      molen na restauratie naar het oordeel van de Minister onvoldoende is gewaarborgd.

      3 Onverminderd [artikel 10][ref3] wordt subsidie voor monumenten als bedoeld in
      [artikel 3, onderdelen f en g][ref4], niet verstrekt, indien voor de desbetreffende monumenten in het
      verleden subsidie is verleend op grond van het [Besluit rijkssubsidiëring restauratie monumenten 1997][ref5],
      het [Besluit rijkssubsidiëring grootschalige restauraties][ref6], het
      [Besluit rijkssubsidiëring grootschalige restauraties 2002][ref7] of het
      [Besluit rijkssubsidiëring grootschalige restauraties 2005][ref8].


