  - number: '3'
    text: |-
      De Minister verleent uitsluitend voor de volgende groepen monumenten subsidie:

      a. monumenten met een grootschalige restauratie, waarvan de subsidiabele kosten gelijk aan of hoger zijn dan
      € 4.000.000, maar lager zijn dan € 10.000.000;

      b. monumenten met uitsluitend een orgelrestauratie waarvan de subsidiabele kosten gelijk aan of hoger zijn dan
      € 150.000, maar lager zijn dan € 300.000;

      c. molens waarvan de subsidiabele kosten gelijk aan of hoger zijn dan € 100.000, maar lager zijn dan € 250.000;

      d. molens waarvan de subsidiabele kosten gelijk aan of hoger zijn dan € 250.000, maar lager zijn dan € 500.000;

      e. boerderijen met een agrarische functie waarvan de subsidiabele kosten gelijk aan of hoger zijn dan € 100.000,
      maar lager zijn dan € 500.000;

      f. andere monumenten dan monumenten met uitsluitend een orgelrestauratie, molens, of boerderijen met een agrarische
      functie, waarvan de subsidiabele kosten gelijk aan of hoger zijn dan € 200.000, maar lager zijn dan € 500.000;

      g. andere monumenten dan monumenten met uitsluitend een orgelrestauratie, molens, of boerderijen met een agrarische
      functie, waarvan de subsidiabele kosten gelijk aan of hoger zijn dan € 1.000.000, maar lager zijn dan € 3.000.000.
    url: https://wetten.overheid.nl/BWBR0021731/2007-04-21#Artikel3
  - number: '4'
    text: |-
      1 Per beschermd monument wordt één aanvraag voor subsidie op grond van deze regeling ingediend.

      2 Een aanvraag voor subsidie gaat vergezeld van:

      a. een restauratieplan;

      b. een bouwkundig inspectierapport per beschermd monument dat niet ouder is dan twee jaar;

      c. een financieel dekkingsplan waaruit blijkt dat de financiering van het gedeelte van de kosten van het
      restauratieplan dat niet door subsidie wordt gedekt, naar het oordeel van de Minister voldoende is gewaarborgd.
      Voor monumenten met een grootschalige restauratie wordt het financiële dekkingsplan voorzien van bewijsstukken van
      de dekking; en

      d. een afschrift van de voor de restauratie verleende vergunning, bedoeld in artikel 11 van de wet.

      3 Het restauratieplan, bedoeld in het tweede lid, onder a, bestaat uit:

      a. een beschrijving van de technische staat van het beschermde monument, waarbij de gebreken van het beschermde
      monument nauwkeurig staan vermeld;

      b. overzichts- en detailfoto’s die een duidelijke indruk geven van het beschermde monument en zijn gebreken;

      c. tekeningen van de bestaande toestand van het beschermde monument en tekeningen waarop de voorgenomen
      herstelwerkzaamheden of wijzigingen staan aangegeven;

      d. een op de onder a bedoelde beschrijving gebaseerd bestek of werkomschrijving per onderdeel van de toe te passen
      constructies, materialen, afwerkingen en kleuren alsmede van de wijze van verwerking daarvan;

      e. een begroting die niet ouder is dan twee jaar en is gespecificeerd in hoeveelheden uren, materialen, stelposten
      en onderaannemers; en

      f. in voorkomende gevallen rapporten inzake bouwfysische, bouwhistorische, constructieve, decoratieve,
      materiaaltechnische of preventieve aspecten.

      4 De Minister kan voor het indienen van aanvragen een formulier vaststellen.
    url: https://wetten.overheid.nl/BWBR0021731/2007-04-21#Artikel4
  - number: '5'
    text: |-
      1 De aanvragen voor monumenten met een grootschalige restauratie, als bedoeld in [artikel 3, onder a][ref1], worden
      ingediend voor 1 november 2007.

      2 De aanvragen voor:

      a. monumenten met uitsluitend een orgelrestauratie, als bedoeld in [artikel 3, onder b][ref2];

      b. molens als bedoeld in [artikel 3, onder c][ref3];

      c. molens als bedoeld in [artikel 3, onder d][ref4]; en

      d. boerderijen met een agrarische functie als bedoeld in [artikel 3, onder e][ref5], worden ingediend voor
      1 december 2007.

      3 De aanvragen voor monumenten als bedoeld in [artikel 3, onderdelen f en g][ref6], worden uiterlijk 31 december
      2007 ingediend.


