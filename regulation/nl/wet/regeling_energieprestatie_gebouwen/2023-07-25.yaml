articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - adviseur: persoon die de energieprestatie van een gebouw opneemt of registreert conform de BRL;
        - BRL: door InstallQ bindend verklaarde Nationale Beoordelingsrichtlijn;
        - besluit: [Besluit energieprestatie gebouwen][ref1];
        - certificaathouder: organisatie die beschikt over een geldig NL-EPBD procescertificaat;
        - certificerende instelling: instelling die NL-EPBD procescertificaten verstrekt;
        - energielabelklasse: energielabelklasse als bedoeld in
      [artikel 2.1, achtste lid, van het Besluit energieprestatie gebouwen][ref2];
        - energielabelplichtige: degene die op grond van [artikel 2.1, eerste tot en met zesde lid, van het besluit][ref3]
      de plicht heeft een energielabel voor een gebouw beschikbaar te stellen of aanwezig te hebben;
        - Minister: Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - opnamedatum: datum waarop de gegevens worden opgenomen op basis waarvan het energielabel wordt vastgesteld;
        - registratiedatum: datum waarop de gegevens die nodig zijn voor het vaststellen van een energielabel worden
      geregistreerd bij de Rijksdienst voor Ondernemend Nederland;
        - utiliteitsgebouw: een gebouw of gedeelte daarvan met een gebruiksfunctie als bedoeld in
      [artikel 1.1, tweede en derde lid, van het Bouwbesluit 2012][ref4], niet zijnde: − een woonfunctie als bedoeld in
      [artikel 1.1, tweede en derde lid, van dat besluit][ref5]; − een logiesfunctie niet gelegen in een logiesgebouw als
      bedoeld in [artikel 1.1, tweede en derde lid, van dat besluit;][ref6]
        - woning: een gebouw of gedeelte daarvan met een woonfunctie als bedoeld in
      [artikel 1.1, tweede en derde lid, van het Bouwbesluit 2012][ref7] of een gebouw of gedeelte daarvan met een
      logiesfunctie niet gelegen in een logiesgebouw als bedoeld in artikel 1.1, tweede en derde lid, van dat besluit.


