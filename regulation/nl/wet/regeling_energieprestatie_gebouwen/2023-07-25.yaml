  - number: 8a
    text: |-
      Wanneer een energielabelplichtige voor 1 januari 2021 de gegevens aan een erkende energielabeldeskundige heeft
      gestuurd als bedoeld in [artikel 3, eerste lid][ref1], zoals dat luidde voor 1 januari 2021, wordt het energielabel
      afgegeven met inachtneming van deze regeling zoals die luidde voor 1 januari 2021.


