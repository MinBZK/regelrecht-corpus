  - number: '4'
    text: |-
      Het energielabel, bedoeld in [artikel 2, tweede lid][ref1], en [artikel 3, tweede lid][ref2], wordt ten minste
      vastgesteld op basis van:

      a. gegevens met betrekking tot de algemene gebouwkenmerken, waaronder gebruiksfunctie, bouwjaar,
      gebruiksoppervlakte in m2 en, in het geval van een woning of woongebouw, woningtype;

      b. gegevens met betrekking tot de aanwezige isolatie, waaronder beglazing, isolatie van de gevel, isolatie van het
      dak en isolatie van de vloer;

      c. gegevens met betrekking tot de aanwezige installaties, waaronder verwarmingstoestel, tapwatertoestel,
      koelsysteem, ventilatiesysteem, zonneboiler, zonnepanelen en, in het geval van een utiliteitsgebouw, verlichting;

      d. gegevens met betrekking tot de berekende indicatoren van de energieprestatie, waaronder de energielabelklasse,
      het primair fossiel energiegebruik, het aandeel hernieuwbare energie in het geval van een woning of woongebouw de
      oververhitting in de zomer en de warmtebehoefte en, in het geval van een utiliteitsgebouw, de energiebehoefte.


      [ref1]: https://wetten.overheid.nl/BWBR0020921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020921#Artikel3
    url: https://wetten.overheid.nl/BWBR0020921/2023-07-25#Artikel4
