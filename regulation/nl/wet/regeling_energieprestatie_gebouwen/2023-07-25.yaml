  - number: '5'
    text: |-
      1 De Minister kan registreren:

      a. gegevens over voor welke gebouwen de energieprestatie is geregistreerd, waaronder
      adresgegevens, identificerend objectnummer van het pand of verblijfsobject als bedoeld in
      [artikel 19 van de Wet basisregistratie adressen en gebouwen][ref1] en de opleverstatus van het gebouw;

      b. kenmerken van de registratie van de energieprestatie bedoeld in [artikel 2, eerste lid][ref2], waaronder
      de aanduiding van het soort opname van de energieprestatie, de opnamedatum en gegevens over de adviseur, de
      certificaathouder en de geattesteerde software;

      c. de registratiedatum en het unieke registratienummer van het energielabel;

      d. de gegevens, bedoeld in [artikel 4][ref3], op basis waarvan het energielabel is vastgesteld.

      2 De Minister beheert de registratie.

      3 De registratie heeft tot doel het toezicht op de naleving en handhaving van de voorschriften op het gebied van
      energielabels te kunnen waarborgen en de verstrekking van de gegevens aan de instellingen en organisaties, bedoeld
      in het vijfde lid, mogelijk te maken voor zover de gegevens noodzakelijk zijn in verband met hun werkzaamheden als
      bedoeld in het vijfde lid.

      4 De Minister is verwerkingsverantwoordelijke voor de registratie.

      5 De Minister kan de gegevens, bedoeld in het eerste lid, verstrekken aan:

      a. certificerende instellingen, voor zover de gegevens noodzakelijk zijn voor het uitvoeren van hun taak zoals
      omschreven in BRL 9500-W van 15 april 2020, inclusief wijzigingsblad van 1 februari 2023 of BRL 9500-U van 15 april
      2020, inclusief wijzigingsblad van 1 februari 2023;

      b. het centraal bureau voor de statistiek, voor zover de gegevens noodzakelijk zijn voor het van overheidswege
      uitvoeren van statistisch onderzoek ten behoeve van praktijk, beleid en wetenschap;

      c. andere onderzoeksinstellingen en -organisaties, voor zover de gegevens gebruikt worden voor wetenschappelijke,
      statistische of historische doeleinden en de persoonlijke levenssfeer niet onevenredig geschaad wordt.

      6 De Minister kan het energielabel en de gegevens, bedoeld in het eerste lid, verstrekken aan de eigenaar van
      het gebouw waarvoor het energielabel is afgegeven en aan de persoon die in de basisregistratie personen op het
      woonadres van dat gebouw staat ingeschreven.

      7 De gegevens in de registratie worden ten hoogste vijftien jaar bewaard, gerekend vanaf de opnamedatum van een
      energielabel.


