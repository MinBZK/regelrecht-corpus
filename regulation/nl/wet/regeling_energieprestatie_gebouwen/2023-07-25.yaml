  - number: '6'
    text: |-
      Bij de toepassing van [artikel 2.4 van het besluit][ref1] wordt ten minste een weergave van de numerieke
      energieprestatie-indicator van het primair fossiel energiegebruik in kWh/m2.jr en de in een letter of
      lettercombinatie uitgedrukte weergave van dat energiegebruik opgehangen op een voor het publiek duidelijk zichtbare
      plaats in het gebouw.


      [ref1]: https://wetten.overheid.nl/BWBR0023734#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0020921/2023-07-25#Artikel6
