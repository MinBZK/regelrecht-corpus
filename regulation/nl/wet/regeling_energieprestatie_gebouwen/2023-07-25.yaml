        artikel: '2.4'
  - number: '7'
    text: |-
      Met een energielabel als bedoeld in deze regeling wordt gelijkgesteld een energielabel dat is vastgesteld door een
      persoon of een bedrijf die voldoet aan beroepseisen die worden gesteld in een andere lidstaat van de Europese Unie
      dan wel een staat, niet zijnde een lidstaat van de Europese Unie die partij is bij een daartoe strekkend of mede
      daartoe strekkend verdrag dat Nederland bindt en die een beroepsniveau waarborgen dat ten minste gelijkwaardig is
      aan het niveau dat met de nationale eis wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0020921/2023-07-25#Artikel7
  - number: 7a
    text: |-
      Onder energielabel wordt niet verstaan het document dat is opgesteld op basis van de energieprestatie geregistreerd
      in het kader van een vergunningsaanvraag als bedoeld in BRL 9500-W van 15 april 2020, inclusief wijzigingsblad van
      1 februari 2023 of BRL 9500-U van 15 april 2020, inclusief wijzigingsblad van 1 februari 2023.
    url: https://wetten.overheid.nl/BWBR0020921/2023-07-25#Artikel7a
  - number: 7b
    text: |-
      1 In afwijking van[ artikel 2, eerste lid][ref1], en [artikel 3, eerste lid][ref2], mag de energieprestatie van een
      woning, woongebouw of utiliteitsgebouw tot 1 november 2021 worden opgenomen en geregistreerd door een persoon die
      werkzaam is voor een certificaathouder en aantoonbaar in staat is volgens de voorschriften, bedoeld in BRL 9500-
      W van 15 april 2020, inclusief wijzigingsblad van 15 december 2020 en in BRL 9500-U van 15 april 2020, inclusief
      wijzigingsblad van 15 december 2020, een opname te maken van de bouwkundige schil en de installaties van het
      gebouw.

      2 Bij toepassing van het eerste lid controleert de certificaathouder aanvullend in ieder geval de eerste twee
      registraties van energieprestaties gedaan door de persoon, bedoeld in het eerste lid, middels controles op de
      dossiers als bedoeld in paragraaf 6.1 van BRL 9500-W van 15 april 2020, inclusief wijzigingsblad van 15 december
      2020 of paragraaf 6.1 van BRL 9500-U van 15 april 2020, inclusief wijzigingsblad van 15 december 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0020921#Artikel2
