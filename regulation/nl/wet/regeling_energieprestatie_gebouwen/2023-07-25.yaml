  - number: '2'
    text: |-
      1 De energieprestatie van een woning of woongebouw wordt opgenomen en geregistreerd door een adviseur werkzaam
      voor een certificaathouder en volgens de voorschriften, bedoeld in BRL 9500-W van 15 april 2020, inclusief
      wijzigingsblad van 1 februari 2023. Het bij de bepaling van de energieprestatie gebruikte rekenprogramma is
      geattesteerd en voldoet aan BRL 9501 van 15 april 2020, inclusief wijzigingsblad van 1 februari 2023.

      2 Na registratie van de energieprestatie door de adviseur bij de Rijksdienst voor Ondernemend Nederland, wordt het
      energielabel voor die woning of het woongebouw vastgesteld en afgegeven door de Minister.

      3 Het primair fossiel energiegebruik van de woning of het woongebouw wordt met behulp van de als [bijlage I][ref1]
      bij deze regeling opgenomen tabel omgezet in een letter of lettercombinatie. Bij de berekening van het primair
      fossiel energiegebruik van een woning of woongebouw wordt, indien energiemaatregelen op gebiedsniveau van
      toepassing zijn, gerekend met forfaitaire waarden voor deze maatregelen.

      4 Met een certificaathouder wordt tot 1 januari 2022 gelijkgesteld een organisatie die certificering heeft
      aangevraagd en de energieprestatie laat opnemen en registreren door een adviseur met een bewijs van vakbekwaamheid
      als bedoeld in paragraaf 4.1 van BRL 9500-W van 15 april 2020, inclusief wijzigingsblad van 1 februari 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0020921
