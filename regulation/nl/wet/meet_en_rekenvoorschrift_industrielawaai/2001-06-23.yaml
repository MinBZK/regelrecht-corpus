preamble:
  text: |-
    Gelet op artikel 73 van de Wet geluidhinder;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012527/2001-06-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *geluidsbron:*


              geluidafstralend toestel, apparaat, gebouw of activiteit, dan wel een combinatie hiervan, binnen een
      inrichting of industrieterrein;




              *immissiepunt:*


              plaats waarop het langtijdgemiddeld beoordelingsniveau wordt bepaald;




              *immissierelevante bronsterkte:*


              geluidvermogensniveau van een denkbeeldige bron, gelegen in het centrum van de werkelijke geluidsbron, die
      in de richting van het immissiepunt dezelfde geluiddrukniveaus veroorzaakt als de werkelijke geluidsbron;




              *representatieve bedrijfssituatie:*


              toestand waarbij de voor de geluidproductie relevante omstandigheden kenmerkend zijn voor een
      bedrijfsvoering bij volledige capaciteit in het te beschouwen gedeelte van het etmaal;




              *langtijdgemiddeld beoordelingsniveau:*


              equivalente geluidsniveau als bedoeld in [artikel 1 van de Wet geluidhinder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
    url: https://wetten.overheid.nl/BWBR0012527/2001-06-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
  - number: '2'
    text: |-
      1 Bij de bepaling van het langtijdgemiddeld beoordelingsniveau op een immissiepunt buiten een woning, gebouw of
      ander object ten behoeve van de vaststelling van de geluidsbelasting vanwege een industrieterrein of een gedeelte
      daarvan wordt rekening gehouden met:

      a. de over de betreffende periode energetisch gemiddelde immissierelevante bronsterkte bij een representatieve
      bedrijfssituatie;

      b. de verzwakking van het geluid ten gevolge van geometrische uitbreiding van het geluidsveld;

      c. meteorologische invloeden;

      d. de verzwakking van het geluid door absorptie van de geluidsenergie in de atmosfeer;

      e. de invloed van de bodem op de geluidsoverdracht;

      f. reflectie van het geluid;

      g. afscherming van het geluid;

      h. de invloed van de vegetatie op de geluidsoverdracht;

      i. de invloed van bebouwing in de overdrachtsweg.

      2 Bij de bepaling van het langtijdgemiddeld beoordelingsniveau op een immissiepunt buiten een woning of ander
      geluidsgevoelig gebouw ten behoeve van de vaststelling van de geluidsbelasting vanwege een industrieterrein of een
      gedeelte daarvan wordt slechts rekening gehouden met het op het immissiepunt invallend geluid.

      3 Indien de vaststelling van de geluidsbelasting vanwege een industrieterrein plaats vindt ten behoeve van de
      vaststelling of wijziging van een geluidszone rond dat terrein, bevindt het immissiepunt zich op een hoogte van
      vijf meter boven het maaiveld.

      4 Indien de vaststelling van de geluidsbelasting vanwege een industrieterrein plaats vindt ten behoeve van
      de vaststelling van de geluidsbelasting van de gevel van woningen, gebouwen of andere objecten, bevindt het
      immissiepunt zich op het punt van de gevel, waar de hoogste geluidsbelasting optreedt.
    url: https://wetten.overheid.nl/BWBR0012527/2001-06-23#Artikel2
  - number: '3'
    text: |-
      Bepaling van het langtijdgemiddeld beoordelingsniveau vanwege een industrieterrein of een gedeelte daarvan vindt
      plaats volgens een van de methoden van de Handleiding meten en rekenen industrielawaai 1999 (ISBN 90 422 02327),
      onder de in genoemde handleiding bepaalde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0012527/2001-06-23#Artikel3
  - number: '4'
    text: |-
      1 Van de in [artikel 3][ref1] bedoelde methoden kan, na overleg met betrokkenen, geheel of gedeeltelijk worden
      afgeweken, indien:

      a. aannemelijk wordt gemaakt dat die werkwijze:

      1e. e. een belangrijke tijdsbesparing of kostenbesparing oplevert en in de betreffende situatie nagenoeg even
      nauwkeurig is als een van de methoden van de in [artikel 3][ref2] bedoelde handleiding, of

      2e. e. in de betreffende situatie belangrijk nauwkeuriger is dan een van de methoden van de in [artikel 3][ref3]
      bedoelde handleiding, of

      3e. e. voldoende nauwkeurig is en geen van de methoden van de in [artikel 3][ref4] bedoelde handleiding in de
      betreffende situatie leidt tot een voldoende representatief langtijdgemiddeld beoordelingsniveau en

      b. de alternatieve methode zodanig is gedocumenteerd dat herhalingsmetingen of herhalingsberekeningen kunnen worden
      uitgevoerd en de resultaten daarvan kunnen worden gereproduceerd.

      2 Voor akoestisch onderzoek als bedoeld in de [artikelen 43][ref5], [62][ref6] en
      [71 van de Wet geluidhinder][ref7] worden onder betrokkenen, als bedoeld in het eerste lid, in ieder geval
      begrepen:

      a. indien burgemeester en wethouders het bevoegd gezag zijn: gedeputeerde staten, de Kamer van Koophandel of
      het bedrijfschap en indien sprake is van een gemeentegrens overschrijdende geluidszone het gemeentebestuur van
      betreffende gemeente;

      b. indien gedeputeerde staten het bevoegd gezag zijn: het gemeentebestuur, de Kamer van Koophandel of het
      bedrijfschap en indien sprake is van een grens overschrijdende geluidszone het gemeentebestuur van betreffende
      gemeente.


