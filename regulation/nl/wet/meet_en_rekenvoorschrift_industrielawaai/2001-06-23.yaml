  - number: '5'
    text: |-
      De resultaten van het akoestisch onderzoek, ter bepaling van het langtijdgemiddeld beoordelingsniveau, bedoeld
      in [artikel 2][ref1], worden vastgelegd in een akoestisch rapport, waarin inzichtelijk is gemaakt, welke meet- of
      rekenmethode is toegepast, welke invoergegevens zijn gebruikt en op welke wijze de resultaten zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0012527#Artikel2
    url: https://wetten.overheid.nl/BWBR0012527/2001-06-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012527
        artikel: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 Voor een akoestisch onderzoek als bedoeld in [artikel 43 van de Wet geluidhinder][ref1] wordt een van de in de
      [artikelen 3][ref2] of [4][ref3] bedoelde methoden toegepast vanaf het tijdstip van inwerkingtreding van deze
      regeling.

      2 Voor een akoestisch onderzoek als bedoeld in artikel 62 of 71van de [Wet geluidhinder][ref4] wordt een van de in
      de [artikelen 3][ref5] of [4][ref6] bedoelde methoden toegepast vanaf het tijdstip dat het bevoegd gezag zulks, na
      overleg met betrokkenen heeft besloten.

      3 Onder betrokkenen als bedoeld in het tweede lid, worden in ieder geval begrepen:

      a. indien burgemeester en wethouders het bevoegd gezag zijn: gedeputeerde staten, de Kamer van Koophandel of het
      bedrijfschap en indien sprake is van een gemeentegrens overschrijdende geluidszone het gemeentebestuur van de
      betreffende gemeente;

      b. indien gedeputeerde staten het bevoegd gezag zijn: het gemeentebestuur, de Kamer van Koophandel of het
      bedrijfschap en indien sprake is van een gemeentegrens overschrijdende geluidszone het gemeentebestuur van
      betreffende gemeente.


