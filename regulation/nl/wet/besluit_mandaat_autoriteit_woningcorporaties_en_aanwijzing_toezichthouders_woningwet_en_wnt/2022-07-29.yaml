  - number: '4'
    text: |-
      Aan de inspecteur-generaal wordt ten behoeve van de autoriteit mandaat en machtiging verleend tot uitoefening van
      de bevoegdheden van de minister, bedoeld in de [artikelen 5.3][ref1], [5.4][ref2], [5.5][ref3], [5.6][ref4] en
      [7.1 van de Wet normering bezoldiging topfunctionarissen publieke en semipublieke sector][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0032249#Artikel7
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0032249
        artikel: '7'
  - number: '5'
    text: |-
      Aan de inspecteur-generaal wordt ten behoeve van de autoriteit volmacht verleend voor het verrichten
      van rechtshandelingen op het terrein van de gemandateerde bevoegdheden, waaronder die verband houden
      met de invordering van verbeurde dwangsommen en van gemaakte kosten voor bestuursdwang als bedoeld in
      [artikel 5:25 van de Algemene wet bestuursrecht][ref1], voor zover deze verband houden met de bevoegdheden, bedoeld
      in [artikel 3, eerste en derde lid][ref2], en [artikel 4][ref3] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0036749#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0036749#Artikel4
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0036749
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0036749
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      Het op grond van dit besluit verleende mandaat ten behoeve van de autoriteit omvat mede de bevoegdheid tot het
      vaststellen, wijzigen of intrekken van beleidsregels met betrekking tot de uitoefening van de bevoegdheden, bedoeld
      in [artikel 3, eerste en derde lid][ref1], en [artikel 4][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0036749#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036749#Artikel4
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036749
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0036749
        artikel: '4'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Aan de inspecteur-generaal wordt ten behoeve van de autoriteit mandaat en machtiging verleend voor het behandelen
      van bezwaarschriften tegen besluiten als bedoeld in de [artikelen 3 tot en met 5][ref1], waaronder begrepen het
      nemen van beslissingen op bezwaarschriften, voor zover het besluit waartegen het bezwaar zich richt, niet door hem
      krachtens mandaat is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0036749#Artikel3
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036749
        artikel: '3'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Aan de inspecteur-generaal wordt ten behoeve van de werkzaamheden van de autoriteit tevens machtiging verleend voor
      het instellen en behandelen van juridische procedures, waaronder het voeren van verweer, het instellen van beroep,
      hoger beroep alsmede het indienen van verzoeken om voorlopige voorziening met betrekking tot een beslissing op
      bezwaar als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel7
  - number: '7.3'
    text: |-
      Het tweede lid is niet van toepassing op gerechtelijke procedures
      die vóór 1 juli 2015 aanhangig waren en die op grond van het
      __REF000___________________________________________________________________________________________________________
      __ zoals dat luidde voor dat tijdstip, door het Centraal Fonds voor de Volkshuisvesting werden behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035508
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035508
  - number: '8.1'
    text: |-
      De inspecteur-generaal kan voor de in de [artikelen 3 tot en met 7][ref1] bedoelde aangelegenheden ondermandaat en
      machtiging verlenen aan onder hem ressorterende functionarissen, werkzaam op het terrein van de autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0036749#Artikel3
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0036749
        artikel: '3'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      De inspecteur-generaal kan de volmacht, bedoeld in [artikel 5][ref1], verlenen aan onder hem ressorterende
      functionarissen, werkzaam op het terrein van de autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0036749#Artikel5
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0036749
        artikel: '5'
        paragraaf: '2'
  - number: '8.3'
    text: Het verlenen van volmacht, ondermandaat of machtiging alsmede wijziging daarvan, geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel8
  - number: '8.4'
    text: |-
      Een afschrift van een besluit inzake volmacht, ondermandaat en machtiging als bedoeld in het derde lid wordt
      gezonden aan de minister en aan degenen aan wie krachtens het besluit volmacht, ondermandaat of machtiging is
      verleend
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel8
  - number: '9'
    text: |-
      De inspecteur-generaal is niet bevoegd om zelfstandig verzoeken in het kader van de [Wet open overheid][ref1],
      de [Wet nationale ombudsman][ref2] of de Algemene verordening gegevensbescherming en de
      [Uitvoeringswet Algemene verordening gegevensbescherming][ref3], voor zover die verband houden met de uitvoering
      van de in de [artikelen 3][ref4], [4][ref5] en [7][ref6] van dit besluit bedoelde taken namens de minister
      af te doen. Dergelijke zaken worden door de inspecteur-generaal inhoudelijk voorbereid en ter afdoening, door
      tussenkomst van de Directie Constitutionele Zaken en Wetgeving van het ministerie, aan de secretaris-generaal van
      het ministerie onderscheidenlijk de minister voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0045754
      [ref2]: https://wetten.overheid.nl/BWBR0003372
      [ref3]: https://wetten.overheid.nl/BWBR0040940
      [ref4]: https://wetten.overheid.nl/BWBR0036749#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0036749#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0036749#Artikel7
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0045754
      - id: ref2
