  - number: '10.1'
    text: |-
      De inspecteur-generaal informeert de minister over zwaarwegende en politiek-bestuurlijk gevoelige omstandigheden en
      gebeurtenissen die betrekking hebben op de gemandateerde bevoegdheden inzake de autoriteit.
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel10
  - number: '10.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op bevoegdheden die zijn verleend op basis van volmacht en
      machtiging.
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel10
  - number: '11'
    text: |-
      Het krachtens dit besluit in mandaat, volmacht en machtiging ondertekenen van stukken inzake de autoriteit
      geschiedt als volgt: De Minister voor Volkshuisvesting en Ruimtelijke Ordening, namens deze: (aanduiding van de
      gemandateerde functionaris) (handtekening) (naam functionaris)
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel11
  - number: '12'
    text: |-
      De ambtenaren van de Inspectie Leefomgeving en Transport, met uitzondering van hen die meer in het bijzonder
      administratieve werkzaamheden uitoefenen, voor zover werkzaam op het terrein van de autoriteit, worden aangewezen
      als ambtenaren belast met het toezicht op de naleving van het bepaalde bij of krachtens de [hoofdstukken IIIA][ref1]
      en [IV van de wet][ref2] en de [Wet normering bezoldiging topfunctionarissen publieke en semipublieke sector][ref3]
      voor zover dit toezicht op toegelaten instellingen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
