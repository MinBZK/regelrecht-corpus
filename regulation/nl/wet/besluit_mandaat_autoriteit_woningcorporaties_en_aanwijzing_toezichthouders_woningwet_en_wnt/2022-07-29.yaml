  - number: '2.1'
    text: De inspecteur-generaal wordt belast met de uitoefening van de werkzaamheden van de autoriteit.
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel2
  - number: '2.2'
    text: |-
      De inspecteur-generaal stelt een organisatieonderdeel vast ter ondersteuning van de uitoefening van de
      werkzaamheden van de autoriteit.
    url: https://wetten.overheid.nl/BWBR0036749/2022-07-29#Artikel2
  - number: '3.1'
    text: |-
      Aan de inspecteur-generaal wordt ten behoeve van de werkzaamheden van de autoriteit mandaat
      en machtiging verleend voor de uitoefening van de bevoegdheden van de Minister, bedoeld in
      de [hoofdstukken IIIA][ref1] en[ IV van de wet][ref2] en [artikel 119, eerste lid][ref3],
      [130a][ref4] en [134 van de wet][ref5], voor zover die verband houden met de bevoegdheden
      waarvan de autoriteit ingevolge deze wet mandaat en machtiging wordt verleend.Daarnaast wordt
      mandaat en machtiging verleend voor de uitoefening van de bevoegdheden van de minister bedoeld in
      __REF005___________________________________________________________________________________________________________
      ________ en op basis van [artikel III, lid 7 van de Herzieningswet toegelaten instellingen volkshuisvesting][ref7]
      voor zover het de bevoegdheid betreft als bedoeld in [artikel 4:57 Algemene wet bestuursrecht][ref8], tot
      invordering van voor 1 juli 2015 ontvangen bijzondere projectsteun voor zover gekoppeld aan de eindafrekening van
      deze steun.


