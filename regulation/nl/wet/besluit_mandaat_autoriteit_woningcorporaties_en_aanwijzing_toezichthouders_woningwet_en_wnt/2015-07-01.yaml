        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      Het op grond van dit besluit verleende mandaat ten behoeve van de autoriteit omvat mede de bevoegdheid tot het
      vaststellen, wijzigen of intrekken van beleidsregels met betrekking tot de uitoefening van de bevoegdheden, bedoeld
      in [artikel 3, eerste en derde lid][ref1], en [artikel 4][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0036749#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036749#Artikel4
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036749
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0036749
        artikel: '4'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Aan de inspecteur-generaal wordt ten behoeve van de autoriteit mandaat en machtiging verleend voor het behandelen
      van bezwaarschriften tegen besluiten als bedoeld in de [artikelen 3 tot en met 5][ref1], waaronder begrepen het
      nemen van beslissingen op bezwaarschriften, voor zover het besluit waartegen het bezwaar zich richt, niet door hem
      krachtens mandaat is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0036749#Artikel3
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036749
        artikel: '3'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Aan de inspecteur-generaal wordt ten behoeve van de werkzaamheden van de autoriteit tevens machtiging verleend
      voor het behandelen van gerechtelijke procedures, waaronder het voeren van verweer, het instellen van beroep, hoger
      beroep alsmede het indienen van verzoeken om voorlopige voorziening met betrekking tot een beslissing op bezwaar
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel7
  - number: '7.3'
    text: |-
      Het tweede lid is niet van toepassing op gerechtelijke procedures
      die vóór 1 juli 2015 aanhangig waren en die op grond van het
      __REF000___________________________________________________________________________________________________________
      __ zoals dat luidde voor dat tijdstip, door het Centraal Fonds voor de Volkshuisvesting werden behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035508
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035508
  - number: '8.1'
    text: |-
      De inspecteur-generaal kan voor de in de [artikelen 3 tot en met 7][ref1] bedoelde aangelegenheden ondermandaat en
      machtiging verlenen aan onder hem ressorterende functionarissen, werkzaam op het terrein van de autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0036749#Artikel3
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0036749
        artikel: '3'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      De inspecteur-generaal kan de volmacht, bedoeld in [artikel 5][ref1], verlenen aan onder hem ressorterende
      functionarissen, werkzaam op het terrein van de autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0036749#Artikel5
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0036749
        artikel: '5'
        paragraaf: '2'
  - number: '8.3'
    text: Het verlenen van volmacht, ondermandaat of machtiging alsmede wijziging daarvan, geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel8
  - number: '8.4'
    text: |-
      Een afschrift van een besluit inzake volmacht, ondermandaat en machtiging als bedoeld in het derde lid wordt
      gezonden aan de minister en aan degenen aan wie krachtens het besluit volmacht, ondermandaat of machtiging is
      verleend
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel8
  - number: '9'
    text: |-
      De inspecteur-generaal is niet bevoegd om zelfstandig verzoeken in het kader van
      de [Wet openbaarheid van bestuur][ref1], de [Wet nationale ombudsman][ref2] of de
      [Wet bescherming persoonsgegevens][ref3], voor zover die verband houden met de uitvoering van de in de
      [artikelen 3][ref4], [4][ref5] en [7][ref6] van dit besluit bedoelde taken namens de minister af te doen.
      Dergelijke zaken worden door de inspecteur-generaal inhoudelijk voorbereid en ter afdoening, door tussenkomst van
      de Directie Constitutionele Zaken en Wetgeving van het ministerie, aan de secretaris-generaal van het ministerie
      onderscheidenlijk de minister voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
      [ref3]: https://wetten.overheid.nl/BWBR0011468
