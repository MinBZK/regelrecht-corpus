  - number: '2.1'
    text: De inspecteur-generaal wordt belast met de uitoefening van de werkzaamheden van de autoriteit.
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel2
  - number: '2.2'
    text: |-
      De inspecteur-generaal stelt een organisatieonderdeel vast ter ondersteuning van de uitoefening van de
      werkzaamheden van de autoriteit.
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel2
  - number: '3.1'
    text: |-
      Aan de inspecteur-generaal wordt ten behoeve van de werkzaamheden van de autoriteit mandaat en machtiging verleend
      voor de uitoefening van de bevoegdheden van de minister, bedoeld in [Hoofdstuk IV van de wet][ref1], voor zover die
      verband houden met de bevoegdheden waarvan de autoriteit ingevolge deze wet mandaat en machtiging wordt verleend.
      Daarnaast wordt mandaat en machtiging verleend voor de uitoefening van de bevoegdheden van de minister bedoeld in
      Hoofdstuk 2, artikel II derde lid tot en met zesde lid van de Herzieningswet toegelaten instellingen en op basis
      van [artikel III, lid 7 van de Herzieningswet toegelaten instellingen volkshuisvesting][ref2] voor zover het de
      bevoegdheid betreft als bedoeld in [artikel 4:57 Algemene wet bestuursrecht][ref3], tot invordering van voor 1 juli
      2015 ontvangen bijzondere projectsteun voor zover gekoppeld aan de eindafrekening van deze steun.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0036530#ArtikelIII
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel3
