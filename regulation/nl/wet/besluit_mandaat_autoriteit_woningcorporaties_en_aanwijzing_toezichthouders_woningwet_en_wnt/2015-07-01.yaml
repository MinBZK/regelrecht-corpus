  - number: '5'
    text: |-
      Aan de inspecteur-generaal wordt ten behoeve van de autoriteit volmacht verleend voor het verrichten van
      rechtshandelingen die verband houden met de invordering van verbeurde dwangsommen en van gemaakte kosten voor
      bestuursdwang als bedoeld in [artikel 5:25 van de Algemene wet bestuursrecht][ref1], voor zover deze verband houden
      met de bevoegdheden, bedoeld in [artikel 3, eerste en derde lid][ref2], en [artikel 4][ref3] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0036749#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0036749#Artikel4
    url: https://wetten.overheid.nl/BWBR0036749/2015-07-01#Artikel5
    references:
