preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is Richtlijn (EU) 2020/1828 van het Europees Parlement
    en de Raad van 25 november 2020 betreffende representatieve vorderingen ter bescherming van de collectieve
    belangen van consumenten en tot intrekking van Richtlijn 2009/22/EG (PbEU 2020, L 409) om te zetten in bepalingen
    van nationaal recht en dat daartoe de Boeken 3 en 6 van het Burgerlijk Wetboek en het Wetboek van Burgerlijke
    Rechtsvordering moeten worden gewijzigd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0047509/2023-06-25#ArtikelAanhef
articles:
  - number: VI
    text: |-
      [Titel 14A van het Derde Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1] zoals die op de dag voor de
      datum van inwerkingtreding van deze wet luidt blijft van toepassing op collectieve vorderingen die zijn ingesteld
      voor de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0047509/2023-06-25#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: IX
    text: |-
      Deze wet treedt in werking met ingang van 25 juni 2023. Indien het Staatsblad waarin deze wet wordt geplaatst,
      wordt uitgegeven na 24 juni 2023, treedt zij in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0047509/2023-06-25#ArtikelIX
  - number: X
    text: 'Deze wet wordt aangehaald als: Implementatiewet richtlijn representatieve vorderingen voor consumenten.'
    url: https://wetten.overheid.nl/BWBR0047509/2023-06-25#ArtikelX
