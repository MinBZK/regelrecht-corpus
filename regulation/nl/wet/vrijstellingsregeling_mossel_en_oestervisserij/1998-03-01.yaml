preamble:
  text: |-
    Gelet op de artikelen 12 en 13 van de Beschikking visserij, visserijzone, zeegebied en kustwateren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009009/1998-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van het bepaalde in [artikel 4 van de Beschikking visserij, visserijzone, zeegebied en kustwateren][ref1] wordt
      vrijstelling verleend voor het vissen met enig vistuig bestemd of mede bestemd voor het vissen op mosselen of
      zeesterren voor zover het betreft het vissen van:

      a. mosselen en zeesterren door de visrechthebbende op de mosselpercelen gelegen in de op grond van
      [artikel 2 van het Besluit aanwijzing zeegebied en kustwateren 1970][ref2] aangewezen kustwateren;

      b. mosselen en zeesterren door de visrechthebbende dan wel degene die daartoe toestemming heeft gekregen van de
      visrechthebbende op verwaterpercelen of

      c. oesters door de visrechthebbende op de oesterpercelen in de Oosterschelde.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002703#Artikel2
    url: https://wetten.overheid.nl/BWBR0009009/1998-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002703
        artikel: '2'
  - number: '2'
    text: |-
      Van het bepaalde in [artikel 9 van de Beschikking visserij, visserijzone, zeegebied en kustwateren][ref1] wordt
      vrijstelling verleend voor zover het betreft het uitzaaien van mosselen, afkomstig uit de Waddenzee, in de
      Oosterschelde aan:

      a. de visrechthebbende op de mosselpercelen gelegen in de op grond van
      [artikel 2 van het Besluit aanwijzing zeegebied en kustwateren 1970][ref2] aangewezen kustwateren of

      b. de visrechthebbende dan wel degene die daartoe toestemming heeft gekregen van de visrechthebbende op
      verwaterpercelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002703#Artikel2
    url: https://wetten.overheid.nl/BWBR0009009/1998-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002703
        artikel: '2'
  - number: '3'
    text: |-
      De vrijstellingen, bedoeld in de [artikelen 1][ref1] en [2][ref2], worden slechts verleend voor zover het betreft
      het vissen met:

      a. een vissersvaartuig dat is geregistreerd in het visserijregister, bedoeld in
      [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref3];

      b. korren, waarvan de opening niet breder is dan 1.90 meter en

      c. vistuigen waarmee geen schelpdieren kunnen worden opgezogen.


      [ref1]: https://wetten.overheid.nl/BWBR0009009#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009009#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0009009/1998-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009009
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009009
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009353
        artikel: '4'
  - number: '4'
    text: |-
      Onverminders het bepaalde in [artikel 3][ref1] is het vissen van mosselen, zeesterren en oesters, met uitzondering
      van het vissen op verwaterpercelen, verboden:

      a. tussen zonsondergang en zonsopgang;

      b. op zaterdagen en zondagen en op algemeen erkende christelijke feestdagen en

      c. bij een zicht van 250 meter of minder.


      [ref1]: https://wetten.overheid.nl/BWBR0009009#Artikel3
    url: https://wetten.overheid.nl/BWBR0009009/1998-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009009
        artikel: '3'
  - number: '5'
    text: De Vrijstellingsregeling mossel- en oestervisserij wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009009/1998-03-01#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0009009/1998-03-01#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Vrijstellingsregeling mossel- en oestervisserij.'
    url: https://wetten.overheid.nl/BWBR0009009/1998-03-01#Artikel7
