preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het nodig is enige regelen te stellen nopens de uitvoering van artikel
    70 van het Verdrag tot oprichting van de Europese Gemeenschap voor Kolen en Staal;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002418/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. kolen en staal: kolen en staal als bedoeld in artikel 81 van het Verdrag tot oprichting van de Europese
      Gemeenschap voor Kolen en Staal (*Trb.* 1951, 82).
    url: https://wetten.overheid.nl/BWBR0002418/1998-01-01#Artikel1
  - number: '2'
    text: |-
      1 Het is de ondernemer, die vervoer per spoor, over de weg of over de binnenwateren verricht, verboden voor het
      vervoer van kolen en staal andere vrachtprijzen toe te passen dan die, waardoor aan verbruikers daarvan, die in
      overeenkomstige omstandigheden verkeren, overeenkomstige prijzen worden berekend.

      2 In ieder geval zijn ingevolge het eerste lid verboden verschillen in vrachtprijzen, welke uitsluitend zijn
      gebaseerd op het land van oorsprong of bestemming der te vervoeren goederen.

      3 Bij algemene maatregel van bestuur kunnen andere verschillen in vrachtprijzen worden omschreven, welke in ieder
      geval dan wel in geen geval ingevolge het eerste lid zijn verboden.

      4 Het bepaalde in het eerste lid is mede van toepassing op vervoer, dat door een in Nederland gevestigde ondernemer
      buiten Nederland doch binnen de Europese Gemeenschap voor Kolen en Staal wordt verricht.

      5 Bij algemene maatregel van bestuur kan worden bepaald, dat het bepaalde in het eerste lid van dit artikel niet
      van toepassing is op bepaalde soorten van vervoer of op vervoer onder bepaalde omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002418/1998-01-01#Artikel2
  - number: '3'
    text: |-
      1 Teneinde een met het oog op de uitvoering van het Verdrag tot oprichting van de Europese Gemeenschap voor Kolen
      en Staal, benevens ter uitvoering van de overeenkomstig dit Verdrag gegeven Aanbevelingen doeltreffende publiciteit
      van schalen, vrachtprijzen en tariefbepalingen te verzekeren, treft Onze Minister overeenkomstig bij algemene
      maatregel van bestuur te geven voorschriften de nodige maatregelen.

      2 De in het eerste lid bedoelde voorschriften kunnen niet inhouden, dat de in [artikel 4, eerste lid][ref1],
      bedoelde gegevens op zodanige wijze worden openbaar gemaakt, dat daarmede algemene bekendheid wordt gegeven aan de
      schalen, vrachtprijzen en tariefbepalingen van de afzonderlijke ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0002418#Artikel4
    url: https://wetten.overheid.nl/BWBR0002418/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002418
        artikel: '4'
  - number: '4'
    text: |-
      1 De ondernemers, die vervoer van kolen en staal per spoor, over de weg of over de binnenwateren verrichten,
      zijn verplicht volgens bij of krachtens algemene maatregel van bestuur te stellen voorschriften gegevens,
      verband houdende met schalen, vrachtprijzen en tariefbepalingen, te verstrekken aan Onze Minister en de door deze
      aangewezen ambtenaren.

      2 Ter verzekering van de in het [eerste lid van artikel 3][ref1] genoemde publiciteit van schalen, vrachtprijzen
      en tariefbepalingen kunnen de in het eerste lid bedoelde ondernemers overeenkomstig bij algemene maatregel van
      bestuur te stellen voorschriften door Onze Minister andere dan de in het vorige lid bedoelde verplichtingen worden
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002418#Artikel3
    url: https://wetten.overheid.nl/BWBR0002418/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002418
        artikel: '3'
  - number: '5'
    text: |-
      1 Met het toezicht op de naleving van de bij of krachtens de [artikelen 2][ref1] en [4][ref2] gegeven
      voorschriften zijn belast de bij besluit van Onze Minister en Onze Minister van Justitie gezamenlijk aangewezen
      ambtenaren.

      2 De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref3] en
      [5:19 van de Algemene wet bestuursrecht][ref4].


