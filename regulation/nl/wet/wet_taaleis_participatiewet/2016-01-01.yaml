preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat voor alle bijstandsgerechtigden een basale kennis van de Nederlandse
    taal van zeer groot belang is in verband met het participeren en het inzetbaar zijn op de arbeidsmarkt en het met
    het oog daarop wenselijk is de Wet werk en bijstand aan te passen;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036496/2016-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Op de persoon die op de dag voorafgaand aan de datum van inwerkingtreding van deze wet recht op
      algemene bijstand heeft, is gedurende een periode van zes maanden na die datum [artikel 18b][ref1], of
      [artikel 47c, tweede lid, derde en vierde zin, van de Participatiewet][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18b
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel47c
    url: https://wetten.overheid.nl/BWBR0036496/2016-01-01#ArtikelII
