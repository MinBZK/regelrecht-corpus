articles:
  - number: '1'
    text: |-
      Mandaten, ondermandaten, volmachten en machtigingen, die op 13 oktober 2010 van kracht waren ten behoeve van
      functionarissen van het voormalige Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer ten
      aanzien van de aangelegenheden op het terrein van het Directoraat-Generaal Wonen, Wijken en Integratie en van de
      Rijksgebouwendienst worden aangemerkt als mandaten, volmachten en machtigingen die zijn verleend door de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties aan:

      a. de Secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      b. de directeur-generaal Wonen, Wijken en Integratie;

      c. de directeur-generaal Rijksgebouwendienst;

      d. de functionarissen die gemachtigd zijn om namens de voormalige Minister voor Wonen, Wijken en Integratie in
      rechte op te treden;

      e. de functionarissen aan wie door of namens de Secretaris-generaal van het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties, de directeur-generaal Wonen, Wijken en Integratie, de directeur-generaal Rijksgebouwendienst
      of de plaatsvervangend secretaris-generaal van het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer, ondermandaat, volmacht of machtiging is verleend.
    url: https://wetten.overheid.nl/BWBR0029897/2011-04-22#Artikel1
  - number: '2'
    text: |-
      Mandaten, volmachten en machtigingen, die op 13 oktober 2010 van kracht waren ten behoeve van functionarissen van
      Agentschap NL, de Dienst Uitvoering Onderwijs, Agentschap SZW en het Centraal Justitieel Incassobureau ten aanzien
      van aangelegenheden op het terrein van wonen, wijken en integratie, worden aangemerkt als mandaten, volmachten en
      machtigingen, verleend door de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0029897/2011-04-22#Artikel2
  - number: '3'
    text: |-
      De uitoefening van de beheersverantwoordelijkheid ten aanzien van het personeel van de centrale stafdiensten
      van het voormalige Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en de verlening van
      ondermandaat van deze bevoegdheid in de periode vanaf 14 oktober 2010 tot en met 31 december 2010 door de
      Secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties wordt aangemerkt als de
      uitoefening van die beheersverantwoordelijkheid waarvoor mandaat, volmacht en machtiging is verleend door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0029897/2011-04-22#Artikel3
  - number: '4'
    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het
