        bwb_id: BWBR0035303
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 10.1.f
    text: |-
      een bestuurlijke boete is opgelegd op grond van
      [artikel 35, tweede lid, onderdeel d, van de Huisvestingswet 2014][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel35
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '35'
  - number: '10.2'
    text: |-
      De vergunning, bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1],
      kan voorts worden ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel10
