      - id: ref4
        bwb_id: BWBR0048028
        artikel: '8'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: '20.1'
    text: |-
      Burgemeester en wethouders maken het feit dat een bestuurlijke boete als bedoeld in [artikel 19][ref1], is
      opgelegd voor het handelen in strijd met de regels van goed verhuurderschap, bedoeld in [artikel 2][ref2],
      overtreding van de verboden, bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref3], of een besluit als
      bedoeld in [artikel 12, eerste of tweede lid][ref4], is genomen, openbaar teneinde de naleving ervan te bevorderen,
      woningzoekenden en huurders te informeren en inzicht te geven in het uitvoeren van toezicht op de naleving van deze
      artikelen, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0048028#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0048028#Artikel12
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '19'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0048028
        artikel: '12'
        hoofdstuk: '5'
  - number: 20.1.a
    text: |-
      de namen van betrokken natuurlijke personen niet openbaar worden gemaakt, indien het belang van
      openbaarmaking naar het oordeel van de burgemeester en wethouders niet opweegt tegen het belang, bedoeld in
      [artikel 5.1, tweede lid, onderdeel e, van de Wet open overheid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
  - number: 20.1.b
    text: |-
      geen openbaarmaking plaatsvindt, indien het belang van de openbaarmaking naar het
      oordeel van burgemeester en wethouders niet opweegt tegen de belangen, bedoeld in
      [artikel 5.1, tweede lid, onderdeel c of d, van de Wet open overheid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
  - number: '20.2'
    text: |-
      De openbaarmaking geschiedt niet eerder dan nadat tien werkdagen zijn verstreken na de dag waarop het besluit van
      openbaarmaking aan belanghebbende bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel20
  - number: '20.3'
    text: |-
      Bij de openbaarmaking wordt vermeld of tegen een besluit tot oplegging van een bestuurlijke boete een rechtsmiddel
      is ingesteld dan wel of daartoe de mogelijkheid bestaat.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel20
  - number: '20.4'
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt de openbaarmaking opgeschort totdat de
      voorzieningenrechter een uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '20.5'
    text: |-
      Indien de openbaarmaking in strijd is of zou kunnen komen met het doel van het toezicht op de naleving dat door de
      door burgemeester en wethouders aangewezen ambtenaren wordt uitgeoefend, blijft openbaarmaking achterwege.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel20
  - number: '20.6'
    text: |-
      De openbaarmaking van het feit dat een bestuurlijke boete is opgelegd voor het handelen in strijd met de
      regels van goed verhuurderschap, bedoeld in [artikel 2][ref1], of overtreding van de verboden, bedoeld in
      [artikel 5, eerste lid, onderdeel a of b][ref2], wordt verwijderd vier jaar na de dagtekening van het besluit van
      openbaarmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
  - number: '20.7'
    text: |-
      De openbaarmaking van het feit dat een besluit als bedoeld in [artikel 12, eerste of tweede lid][ref1], is genomen
      wordt verwijderd op het moment dat burgemeester en wethouders besluiten tot het beëindigen van het beheer op grond
      van [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel16
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '12'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0048028
        artikel: '16'
        hoofdstuk: '5'
  - number: '20.8'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de openbaar te maken gegevens,
      waaronder de mogelijke reactie van een belanghebbende in verband met de openbaarmaking van zijn gegevens, de
      termijn waarop deze gegevens beschikbaar worden gesteld en de wijze waarop de openbaarmaking plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel20
  - number: '23.1'
    text: |-
      De verplichting tot het schriftelijk vastleggen van de huurovereenkomst, bedoeld in
      [artikel 2, tweede lid, onderdeel d][ref1], is uitsluitend van toepassing op huurovereenkomsten die worden
      afgesloten na het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: '23.2'
    text: |-
      Het schriftelijk verstrekken van informatie aan de huurder, bedoeld in [artikel 2, tweede lid, onderdeel e][ref1],
      vindt plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: 23.2.a
    text: |-
      voor huurovereenkomsten die zijn afgesloten na het tijdstip van inwerkingtreding van deze wet op het moment waarop
      de huurovereenkomst wordt aangegaan;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel23
  - number: 23.2.b
    text: |-
      voor huurovereenkomsten die zijn afgesloten voor de inwerkingtreding van deze wet, verstrekt de verhuurder deze
      informatie aan de huurder uiterlijk één jaar na het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel23
  - number: '23.3'
    text: |-
      De verplichting tot het afzonderlijk vastleggen van de huurovereenkomst van de arbeidsovereenkomst, bedoeld
      in [artikel 2, derde lid, onderdeel a][ref1], is uitsluitend van toepassing op huurovereenkomsten die worden
      afgesloten na het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: '23.4'
    text: |-
      Het schriftelijk verstrekken van informatie aan de huurder, bedoeld in [artikel 2, derde lid, onderdeel b][ref1],
      vindt plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: 23.4.a
    text: |-
      voor huurovereenkomsten die zijn afgesloten na het tijdstip van inwerkingtreding van deze wet op het moment waarop
      de huurovereenkomst wordt aangegaan;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel23
  - number: 23.4.b
    text: |-
      voor huurovereenkomsten die zijn afgesloten voor de inwerkingtreding van deze wet uiterlijk drie maanden na het
      tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel23
  - number: '23.5'
    text: |-
      Het tijdvak van acht jaar, bedoeld in [artikel 7, tweede lid, onderdeel a][ref1], met betrekking tot de
      regels van goed verhuurderschap, bedoeld in artikel 7, tweede lid, onderdeel a, onder 1°, en de regels van
      goed verhuurderschap, bedoeld in [artikel 10, eerste lid, onderdeel a][ref2], vangt aan op het tijdstip van
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel10
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '7'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0048028
        artikel: '10'
        hoofdstuk: '4'
  - number: '23.6'
    text: |-
      Het tijdvak van acht jaar, bedoeld in [artikel 7, tweede lid, onderdeel a][ref1] met betrekking tot
      een verbod als bedoeld in artikel 7, tweede lid, onderdeel a, onder 2°, en de voorwaarden, bedoeld in
      artikel 7, tweede lid, onderdeel a, onder 4°, vangt aan op het tijdstip waarop het verbod, bedoeld in
      [artikel 5, eerste lid, onderdeel a of b][ref2], in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '7'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
  - number: '24'
    text: |-
      Indien de gemeenteraad een verhuurverordening vaststelt, geldt voor verhuurders die een woon- of verblijfsruimte
      voor de inwerkingtreding van het verbod, bedoeld in [artikel 5, onderdeel a of b][ref1], verhuurden, dat dit verbod
      niet eerder dan zes maanden na de inwerkingtreding ervan geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
  - number: '25'
    text: |-
      In afwijking van [artikel 122 van de Gemeentewet][ref1], vervallen de onderdelen van gemeentelijke verordeningen
      die voorzien in regelingen inzake een verhuurdervergunning, de exploitatie van verhuurbemiddelingsbedrijven en het
      tegengaan van uitbuiting en onevenredige benadeling van huurders van rechtswege één jaar na inwerkingtreding van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel122
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '122'
  - number: '29'
    text: |-
      Onze Minister voor Volkshuisvesting en Ruimtelijke Ordening zendt binnen drie jaar na het tijdstip van
      inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze
      wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel29
  - number: '30'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel30
  - number: '31'
    text: 'Deze wet wordt aangehaald als: Wet goed verhuurderschap.'
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel31
