        paragraaf: 3a
  - number: '2.1'
    text: |-
      Een verhuurder of verhuurbemiddelaar van een woon- of verblijfsruimte handelt in overeenstemming met de regels van
      goed verhuurderschap.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: '2.2'
    text: 'Onder goed verhuurderschap wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.2.a
    text: 'het zich onthouden van iedere vorm van ongerechtvaardigd onderscheid door:'
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.2.a.1°
    text: het hanteren van een heldere en transparante selectieprocedure;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.2.a.2°
    text: |-
      het gebruiken en communiceren van objectieve selectiecriteria bij het openbaar aanbieden van de woon- of
      verblijfsruimte;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.2.a.3°
    text: het motiveren van de keuze voor de gekozen huurder aan de afgewezen kandidaat- huurders;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.2.b
    text: het zich onthouden van iedere vorm van intimidatie;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.2.c
    text: |-
      het zich onthouden van het in rekening brengen van een waarborgsom die hoger is dan hetgeen is bepaald in
      [artikel 261b, tweede lid van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel261b
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 261b
  - number: 2.2.d
    text: het schriftelijk vastleggen van de huurovereenkomst;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.2.e
    text: 'het schriftelijk verstrekken van informatie aan de huurder over:'
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.2.e.1°
    text: |-
      de rechten en plichten van de huurder ten aanzien van het gehuurde, voor zover deze rechten en plichten niet in de
      huurovereenkomst zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.2.e.2°
    text: |-
      indien een waarborgsom, als bedoeld in [artikel 261b van Boek 7 van het Burgerlijk Wetboek][ref1], in rekening
      wordt gebracht, de hoogte van de waarborgsom, de wijze waarop en de termijnen waarbinnen bij beëindiging van de
      huurovereenkomst de vordering van de huurder op de verhuurder ten aanzien van de waarborgsom wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel261b
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 261b
  - number: 2.2.e.3°
    text: de contactgegevens van een contactpunt waar de huurder terecht kan bij zaken die het gehuurde betreffen;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.2.e.4°
    text: |-
      de contactgegevens van het meldpunt, bedoeld in [artikel 4][ref1], van de gemeente waarin het gehuurde is gelegen;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel4
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '4'
        hoofdstuk: '3'
  - number: 2.2.e.5°
    text: |-
      indien servicekosten als bedoeld in [artikel 237, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref1], in
      rekening worden gebracht, de betalingsverplichting van de huurder waarbij geldt dat jaarlijks een volledige
      kostenspecificatie aan de huurder dient te worden verstrekt; en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel237
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '237'
  - number: 2.2.f
    text: |-
      het zich onthouden van het in rekening brengen van servicekosten anders dan in overeenstemming met de
      [artikelen 259][ref1] en [261 van Boek 7 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel259
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel261
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '259'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '261'
  - number: '2.3'
    text: 'Onverminderd het tweede lid wordt in het geval van verhuur van verblijfsruimte aan arbeidsmigranten:'
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.3.a
    text: de huurovereenkomst afzonderlijk van de arbeidsovereenkomst vastgelegd; en
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: 2.3.b
    text: |-
      de informatie, bedoeld in het tweede lid, onderdeel e, waaronder mede begrepen de rechten en plichten van de
      huurder ten aanzien van het gehuurde die in de huurovereenkomst zijn opgenomen, verstrekt in een taal waaraan de
      arbeidsmigrant de voorkeur geeft, tenzij er een andere taal kan worden gebruikt die hij begrijpt en waarin hij
      helder kan communiceren.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: '2.4'
    text: |-
      Onverminderd het tweede en derde lid handelt de verhuurbemiddelaar in overeenstemming met
      [artikel 417, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel417
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '417'
  - number: '2.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gegeven over de informatie die een verhuurder of
      verhuurbemiddelaar aan de huurder verstrekt op grond van het tweede lid, onderdeel e, onder 1°.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
  - number: '2.6'
    text: |-
      De verhuurder die een huurovereenkomst heeft opgezegd op grond van
      [artikel 274, eerste lid, onder h, van Boek 7 van het Burgerlijk Wetboek][ref1] doet een melding bij het
      meldpunt als bedoeld in [artikel 4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel274
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel4
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '274'
      - id: ref2
        bwb_id: BWBR0048028
        artikel: '4'
        hoofdstuk: '3'
  - number: '3.1'
    text: |-
      Ter uitvoering van [artikel 2][ref1] beschikt een verhuurder, verhuurbemiddelaar of beheerder van een woon- of
      verblijfsruimte in ieder geval over een werkwijze die gericht is op voorkoming van woondiscriminatie.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      De verhuurder, verhuurbemiddelaar of beheerder van een woon- of verblijfsruimte neemt in het kader van die
      werkwijze doeltreffende maatregelen en voert deze uit. Hij is daarbij in ieder geval gehouden werknemers die
      vanwege hun functie handelingen verrichten om een overeenkomst van huur van een woon- of verblijfsruimte tot stand
      te brengen, te informeren over voorkoming van woondiscriminatie en de maatregelen.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel3
  - number: '3.3'
    text: |-
      De verhuurder, verhuurbemiddelaar of beheerder van een woon- of verblijfsruimte past de werkwijze en maatregelen
      aan als de daarmee opgedane ervaring daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel3
  - number: '3.4'
    text: |-
      De verhuurder, verhuurbemiddelaar of beheerder van een woon- of verblijfsruimte zorgt ervoor dat eenieder kennis
      kan nemen van de geldende werkwijze.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel3
  - number: '3.5'
    text: |-
      De verhuurder, verhuurbemiddelaar of beheerder van een woon- of verblijfsruimte legt de werkwijze en de daarbij
      behorende maatregelen schriftelijk vast. Bij of krachtens algemene maatregel van bestuur kunnen nadere regels
      worden gesteld over de werkwijze.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel3
  - number: '4.1'
    text: |-
      Burgemeester en wethouders stellen een meldpunt in waar klachten over ongewenst verhuurgedrag en de in
      [artikel 2, zesde lid][ref1], genoemde opzeggingen kunnen worden gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      Burgemeester en wethouders zijn bevoegd tot het verwerken van persoonsgegevens ten behoeve van het afwikkelen
      van bij het meldpunt ingediende klachten. Burgemeester en wethouders zijn verwerkingsverantwoordelijke voor deze
      verwerking.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel4
  - number: '4.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de verwerking van de
      persoonsgegevens. Deze nadere regels hebben in ieder geval betrekking op de vastlegging, de bewaartermijn en de
      vernietiging van de persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel4
  - number: '5.1'
    text: 'De gemeenteraad kan in een verhuurverordening bepalen dat het voor een verhuurder verboden is om:'
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel5
  - number: 5.1.a
    text: |-
      een in de verordening aangewezen categorie van woonruimte die gelegen is in een in die verordening aangewezen
      gebied, zonder vergunning van burgemeester en wethouders te verhuren;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel5
  - number: 5.1.b
    text: |-
      een in de verordening aangewezen categorie van verblijfsruimte zonder vergunning van burgemeester en wethouders
      te verhuren.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel5
  - number: '5.2'
    text: |-
      De gemeenteraad maakt van de bevoegdheid, bedoeld in het eerste lid, onderdeel a, slechts gebruik indien dat in het
      aangewezen gebied noodzakelijk en geschikt is voor het behoud van de leefbaarheid.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel5
  - number: '5.3'
    text: |-
      Bij de voorbereiding van de vaststelling of wijziging van een verhuurverordening voeren burgemeester en wethouders
      overleg met burgemeester en wethouders van de overige gemeenten die deel uitmaken van de woningmarktregio, bedoeld
      in [artikel 1, onderdeel k, van de Huisvestingswet 2014][ref1], waarin de gemeente is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel1
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0035303
        artikel: '1'
  - number: '6.1'
    text: |-
      Een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1], kan slechts worden aangevraagd door
      de verhuurder van de woon- of verblijfsruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
  - number: '6.2'
    text: |-
      In het geval van een aanvraag voor een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1],
      betrekking heeft op een woon- of verblijfsruimte of het gebouw waarin die woon- of verblijfsruimte
      is gelegen en voor de realisatie van deze functie een omgevingsvergunning als bedoeld in
      [artikel 5.1, eerste lid, onderdeel a, of tweede lid, aanhef en onderdeel a, van de Omgevingswet][ref2], of een
      vergunning als bedoeld in [artikel 21, eerste lid, van de Huisvestingswet 2014][ref3] is aangevraagd, maar nog
      niet is verleend, wordt de aanvraag, bedoeld in het eerste lid, aangehouden tot dat een beslissing is genomen op de
      aanvraag van een omgevingsvergunning als bedoeld in artikel 5.1, eerste lid, onderdeel a, of tweede lid, aanhef en
      onderdeel a, van de Omgevingswet, of een vergunning als bedoeld in artikel 21, eerste lid, van de Huisvestingswet
      2014.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel21
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0035303
        artikel: '21'
  - number: '6.3'
    text: |-
      In afwijking van [artikel 2:15, eerste lid, van de Algemene wet bestuursrecht][ref1], stellen
      burgemeester en wethouders de elektronische weg open voor de aanvraag van een vergunning als bedoeld in
      [artikel 5, eerste lid, onderdeel a of b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
  - number: '7.1'
    text: |-
      Een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1], wordt geweigerd
      indien voor de realisatie van die woon- of verblijfsruimte een omgevingsvergunning als bedoeld in
      [artikel 5.1, eerste lid, aanhef en onderdeel a, of tweede lid, aanhef en onderdeel a, van de Omgevingswet][ref2],
      of een vergunning als bedoeld in [artikel 21, eerste lid, van de Huisvestingswet 2014][ref3], vereist is en de
      verhuurder die vergunning of een aanvraag voor die vergunning waarop het bevoegd gezag nog niet heeft beslist, niet
      heeft overgelegd bij de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel21
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0035303
        artikel: '21'
  - number: '7.2'
    text: |-
      Een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1], kan uitsluitend worden geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
  - number: 7.2.a
    text: |-
      indien aan de verhuurder binnen een tijdvak van acht jaar voorafgaand aan de aanvraag een bestuurlijke boete of een
      last onder bestuursdwang is opgelegd voor het handelen door de verhuurder in strijd met:
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel7
