  - number: '7.4'
    text: |-
      Indien de vergunning, bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1], wordt geweigerd en deze
      vergunning betrekking heeft op een woon- of verblijfsruimte die op het moment van de weigering van de vergunning is
      verhuurd, kunnen burgemeester en wethouders een besluit nemen als bedoeld in [artikel 12, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel12
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel7
