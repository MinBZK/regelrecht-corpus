        artikel: '12'
        hoofdstuk: '5'
  - number: '8.1'
    text: |-
      Burgemeester en wethouders kunnen aan een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a][ref1],
      voorwaarden verbinden die uitsluitend betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
  - number: 8.1.a
    text: |-
      de wijze waarop de verhuurder aantoont hoe hij invulling geeft aan de regels van goed verhuurderschap, bedoeld
      in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.1.b
    text: |-
      de maximale huurprijs en het maximale huurverhogingspercentage indien het een zelfstandige woonruimte als bedoeld
      in [artikel 234 van Boek 7 van het Burgerlijk Wetboek][ref1], betreft waarvan de maximale huurprijs volgens de bij
      of krachtens [artikel 10, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref2], bepaalde waardering niet
      hoger is dan het krachtens [artikel 3, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref3] vastgesteld
      bedrag. De maximale huurprijs wordt vastgesteld op de maximale huurprijs voor die woonruimte op basis van de bij of
      krachtens artikel 10, eerste lid, van de Uitvoeringswet huurprijzen woonruimte, bepaalde waardering en het maximale
      huurverhogingspercentage bedraagt het bij of krachtens artikel 10, tweede lid, van die wet vastgestelde maximale
      huurverhogingspercentage;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel3
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '234'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0014315
        artikel: '3'
  - number: 8.1.c
    text: |-
      het opstellen en uitvoeren van een onderhoudsplan waarvan een afschrift binnen een door burgemeester en wethouders
      te bepalen termijn aan hen wordt toegezonden, dat ten minste bevat:
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
  - number: 8.1.c.1°
    text: |-
      de in de periode van de komende vijf jaar uit te voeren onderhouds- en herstelwerkzaamheden aan en vernieuwingen
      van het gebouw;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
  - number: 8.1.c.2°
    text: |-
      een schatting van de aan de werkzaamheden en de vernieuwingen, bedoeld in onderdeel 1°, verbonden kosten en een
      gelijkmatige toerekening van die kosten aan de onderscheiden jaren; en
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
  - number: 8.1.c.3°
    text: |-
      een schatting van de benodigde jaarlijkse reservering voor andere dan de gewone jaarlijkse kosten na de periode
      waarop het onderhoudsplan betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
  - number: '8.2'
    text: |-
      Burgemeester en wethouders kunnen aan een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel b][ref1],
      voorwaarden verbinden die uitsluitend betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
  - number: 8.2.a
    text: |-
      de wijze waarop de verhuurder aantoont hoe hij invulling geeft aan de regels van goed verhuurderschap, bedoeld
      in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.2.b
    text: |-
      het in gebruik geven van een afzonderlijk afsluitbare verblijfsruimte die voldoet aan de daarvoor geldende eisen
      van de bouwregelgeving aan iedere arbeidsmigrant die geen huishouden vormt met een andere arbeidsmigrant; of
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
  - number: 8.2.c
    text: |-
      de voorzieningen voor het bewaren en bereiden van voeding, wasruimte en doucheruimte die in het gebouw waarin de
      verblijfsruimte gelegen is aanwezig moeten zijn, rekening houdend met het maximaal aantal arbeidsmigranten die in
      dat gebouw kunnen verblijven.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de verblijfsruimte een woonruimte betreft die bestemd is of gebruikt wordt voor de huisvesting van
      arbeidsmigranten, kunnen burgemeester en wethouders, onverminderd het tweede lid, aan een vergunning als bedoeld
      in [artikel 5, eerste lid, onderdeel b][ref1], ook de voorwaarden bedoeld in het eerste lid, onderdeel b en c
      verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
  - number: '8.4'
    text: |-
      De voorwaarde, bedoeld in het tweede lid, onderdeel b, kan uitsluitend aan de vergunning,
      bedoeld in [artikel 5, eerste lid, onderdeel b][ref1], worden verbonden voor verblijfsruimte
      die in gebruik wordt genomen na inwerkingtreding van deze wet. Voor verblijfsruimte die reeds
      in gebruik was voor inwerkingtreding van deze wet of waarvoor een vergunning als bedoeld in
      [artikel 5.1, eerste lid, onderdeel a, of tweede lid, aanhef en onderdeel a, van de Omgevingswet][ref2], is
      verstrekt voor inwerkingtreding van deze wet, kunnen burgemeester en wethouders de voorwaarde aan de vergunning
      verbinden dat de desbetreffende verblijfsruimte binnen drie jaar na inwerkingtreding van deze wet aan de
      voorwaarde, bedoeld in het tweede lid onderdeel b, moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: '9.1'
    text: |-
      Burgemeester en wethouders beslissen op de aanvraag, bedoeld in [artikel 6, eerste lid][ref1], binnen acht weken na
      de datum van ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel6
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '6'
        hoofdstuk: '4'
  - number: '9.2'
    text: |-
      Burgemeester en wethouders kunnen de termijn, bedoeld in het eerste lid, eenmaal verlengen met ten hoogste zes
      weken. Zij maken hun besluit daartoe bekend binnen de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel9
  - number: '9.3'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '10.1'
    text: |-
      Burgemeester en wethouders kunnen een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1],
      uitsluitend intrekken voor één of meerdere woon- of verblijfsruimten indien:


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
  - number: 10.1.a
    text: |-
      ter zake het niet naleven van de regels van goed verhuurderschap, bedoeld in [artikel 2][ref1], een last onder
      bestuursdwang of een bestuurlijke boete is opgelegd en de verhuurder deze regels opnieuw niet naleeft binnen een
      tijdvak van vier jaar nadat de last onder bestuursdwang of de bestuurlijke boete is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel10
    references:
