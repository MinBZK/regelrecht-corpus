      - id: ref2
        bwb_id: BWBR0048028
        artikel: '12'
        hoofdstuk: '5'
  - number: '11'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder beheer:'
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel11
  - number: 11.a
    text: het verhuren van een woon- of verblijfsruimte;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel11
  - number: 11.b
    text: het innen van de huur en andere vergoedingen voor de woon- of verblijfsruimte; en
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel11
  - number: 11.c
    text: |-
      het verrichten van alle handelingen met betrekking tot die woon- of verblijfsruimte die volgens het burgerlijk
      recht tot de rechten en plichten van een verhuurder behoren met uitzondering van vervreemden en bezwaren.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel11
  - number: '12.1'
    text: |-
      Burgemeester en wethouders kunnen de verhuurder verplichten tot het aan een beheerder in beheer geven van een woon-
      of verblijfsruimte of een gebouw waarin die woon- of verblijfsruimte is gelegen, indien:
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel12
  - number: 12.1.a
    text: |-
      de verhuurder binnen een tijdvak van vier jaar voorafgaand aan de constatering dat hij handelt in strijd met de
      regels van goed verhuurderschap, bedoeld in [artikel 2][ref1], reeds tweemaal een bestuurlijke boete is opgelegd
      voor het handelen in strijd met die regels; en


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: 12.1.b
    text: |-
      in het geval genoemd in [artikel 7, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel7
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '7'
        hoofdstuk: '4'
  - number: '12.2'
    text: |-
      Burgemeester en wethouders verplichten de verhuurder tot het aan een beheerder in beheer geven van een woon-
      of verblijfsruimte of een gebouw waarin die woon- of verblijfsruimte is gelegen, in het geval genoemd in
      [artikel 10, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel10
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '10'
        hoofdstuk: '4'
  - number: '12.3'
    text: |-
      Het is de verhuurder tot wie het besluit, bedoeld in het eerste of tweede lid, is gericht, gedurende de termijn
      waarvoor de woon- of verblijfsruimte of het gebouw waarin die woon- of verblijfsruimte gelegen is in beheer is
      genomen, verboden om beheershandelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel12
  - number: '12.4'
    text: De beoogde beheerder is niet verplicht de beheersopdracht te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel12
  - number: '13'
    text: |-
      In het besluit, bedoeld in [artikel 12, eerste of tweede lid][ref1], stellen burgemeester en wethouders de
      huurprijs van de woon- of verblijfsruimte vast op een bedrag dat redelijk is in het economisch verkeer en voldoet
      aan de voor de betreffende huurprijs geldende wettelijke regels die de beheerder in rekening mag brengen bij de
      gebruikers van de woon- of verblijfsruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel12
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '12'
        hoofdstuk: '5'
  - number: '14.1'
    text: |-
      Indien een woon- of verblijfsruimte of het gebouw waarin die woon- of verblijfsruimte gelegen is, noodzakelijke
      voorzieningen of aanpassingen behoeft, kunnen burgemeester en wethouders besluiten dat de beheerder binnen een in
      dat besluit bepaalde termijn die voorzieningen aanbrengt of aanpassingen uitvoert.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel14
  - number: '14.2'
    text: |-
      De uitvoering van de voorzieningen of aanpassingen, bedoeld in het eerste lid, geschiedt op kosten van de
      verhuurder.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel14
  - number: '15.1'
    text: |-
      In het besluit, bedoeld in [artikel 12, eerste of tweede lid][ref1], bepalen burgemeester en wethouders een
      kostendekkende beheervergoeding die de verhuurder aan hen is verschuldigd ten behoeve van het beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel12
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '12'
        hoofdstuk: '5'
  - number: '15.2'
    text: |-
      Burgemeester en wethouders verrekenen de door de beheerder geïnde huur voor de woonruimte of vergoeding voor
      het gebruik van de verblijfsruimte met de beheervergoeding en de verschuldigde kosten van de voorzieningen of
      aanpassingen, bedoeld in [artikel 14, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel14
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '14'
        hoofdstuk: '5'
  - number: '15.3'
    text: |-
      Op basis van de verrekening bepalen burgemeester en wethouders het bedrag dat de beheerder verschuldigd is aan
      de verhuurder.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel15
  - number: '15.4'
    text: |-
      Indien blijkt uit de verrekening dat de geïnde huur van de woonruimte of vergoeding voor het gebruik van
      de verblijfsruimte lager zijn dan de som van de beheervergoeding en de verschuldigde kosten, bedoeld in
      [artikel 14, tweede lid][ref1], kunnen burgemeester en wethouders het resterende bedrag bij de verhuurder
      invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel14
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '14'
        hoofdstuk: '5'
  - number: '16.1'
    text: 'Burgemeester en wethouders beëindigen het beheer:'
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel16
  - number: 16.1.a
    text: |-
      als de verhuurder door middel van een verhuurplan naar het oordeel van burgemeester en wethouders voldoende
      aannemelijk heeft gemaakt dat hij in de toekomst zal handelen in overeenstemming met de regels van
      goed verhuurderschap, bedoeld in [artikel 2][ref1], of de van toepassing zijnde voorwaarden, bedoeld in
      [artikel 8, eerste of tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel8
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0048028
        artikel: '8'
        hoofdstuk: '4'
  - number: 16.1.b
    text: |-
      indien van toepassing, de noodzakelijke voorzieningen of aanpassingen, bedoeld in [artikel 14, eerste lid][ref1],
      zijn uitgevoerd; en


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel14
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '14'
        hoofdstuk: '5'
  - number: 16.1.c
    text: |-
      indien van toepassing, de resterende kosten, bedoeld in [artikel 15, vierde lid][ref1], door de verhuurder zijn
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel15
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '15'
        hoofdstuk: '5'
  - number: '16.2'
    text: |-
      Indien het eigendom van de woon- of verblijfsruimte of het gebouw waarin die woon- of verblijfsruimte is gelegen
      door de verhuurder is overgedragen aan een nieuwe eigenaar beëindigen burgemeester en wethouders het beheer:
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel16
  - number: 16.2.a
    text: |-
      indien van toepassing, de noodzakelijke voorzieningen of aanpassingen, bedoeld in [artikel 14, eerste lid][ref1],
      zijn uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel14
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '14'
        hoofdstuk: '5'
  - number: 16.2.b
    text: |-
      indien van toepassing, de resterende kosten, bedoeld in [artikel 15, vierde lid][ref1], zijn voldaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel15
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '15'
        hoofdstuk: '5'
  - number: 16.2.c
    text: |-
      indien voor het verhuren van die woon- of verblijfsruimte een vergunning als bedoeld in
      [artikel 5, eerste lid, onderdeel a of b][ref1], verplicht is en deze aan de nieuwe eigenaar is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
  - number: '17'
    text: |-
      Burgemeester en wethouders dragen zorg voor de bestuursrechtelijke handhaving van het bij of krachtens deze wet
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel17
  - number: '18.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van
      burgemeester en wethouders aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel18
  - number: '18.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in het Gemeenteblad.
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel18
  - number: '18.3'
    text: |-
      Burgemeester en wethouders zijn bevoegd tot het opleggen van een bestuurlijke boete als bedoeld in
      [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel19
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '19'
        hoofdstuk: '6'
  - number: '19.1'
    text: |-
      De bestuurlijke boete ter zake van het handelen in strijd met de regels van goed verhuurderschap, bedoeld in
      [artikel 2][ref1], bedraagt ten hoogste:


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: 19.1.a
    text: |-
      het bedrag dat is vastgesteld voor de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 19.1.b
    text: |-
      het bedrag dat is vastgesteld voor de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], indien binnen een tijdvak van vier jaar
      voorafgaand aan de constatering van de overtreding een bestuurlijke boete is opgelegd voor het handelen in strijd
      met de regels van goed verhuurderschap, bedoeld in [artikel 2][ref2], of, indien toepassing is gegeven aan het
      tweede lid, voor het overtreden van de verboden, bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref3], of
      [artikel 12, derde lid][ref4], of de op basis van [artikel 8, eerste of tweede lid][ref5], aan een vergunning als
      bedoeld in artikel 5, eerste lid, onderdeel a of b, verbonden voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0048028#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0048028#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0048028#Artikel8
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
