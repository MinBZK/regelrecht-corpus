        bwb_id: BWBR0037885
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '21'
  - number: 10.1.e
    text: |-
      de verboden, bedoeld in [artikel 21, eerste lid, van de Huisvestingswet 2014][ref1] of
      [artikel 5.1, eerste lid, onderdeel a, of tweede lid, aanhef en onderdeel a, van de Omgevingswet][ref2], met
      betrekking tot de woon- of verblijfsruimten worden overtreden; of


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel10
    references:
