        bwb_id: BWBR0048028
        artikel: '2'
        hoofdstuk: '2'
  - number: 10.1.b
    text: |-
      ter zake het niet naleven van de aan de vergunning verbonden voorwaarden, bedoeld in
      [artikel 8, eerste of tweede lid][ref1], een last onder bestuursdwang of een bestuurlijke boete is opgelegd en de
      verhuurder deze voorwaarden opnieuw niet naleeft binnen een tijdvak van vier jaar nadat de last onder bestuursdwang
      of de bestuurlijke boete is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel8
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '8'
        hoofdstuk: '4'
  - number: 10.1.c
    text: |-
      die vergunning is verleend op grond van door de houder van die vergunning verstrekte gegevens waarvan deze wist of
      redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren;
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel10
  - number: 10.1.d
    text: |-
      een omgevingsvergunning als bedoeld in
      [artikel 5.1, eerste lid, onderdeel a, of tweede lid, aanhef en onderdeel a, van de Omgevingswet][ref1]
      voor de realisatie van die woon- of verblijfsruimte, of een vergunning als bedoeld in
      [artikel 21, eerste lid, van de Huisvestingswet 2014][ref2], geheel of gedeeltelijk is ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel21
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel10
    references:
