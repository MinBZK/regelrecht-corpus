      - id: ref4
        bwb_id: BWBR0048028
        artikel: '8'
        hoofdstuk: '4'
  - number: 19.3.b
    text: |-
      het bedrag dat is vastgesteld voor de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], voor het overtreden van de verboden, bedoeld
      in [artikel 5, eerste lid, onderdeel a of b][ref2], of [artikel 12, derde lid][ref3], of voor het handelen in
      strijd met de op basis van [artikel 8, eerste of tweede lid][ref4], aan een vergunning als bedoeld in artikel
      5, eerste lid, onderdeel a of b, verbonden voorwaarden indien binnen een tijdvak van vier jaar voorafgaand aan
      de constatering van die overtreding een bestuurlijke boete is opgelegd voor overtreding van die verboden of het
      handelen in strijd met de regels van goed verhuurderschap, bedoeld in [artikel 2][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0048028#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0048028#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel19
    references:
