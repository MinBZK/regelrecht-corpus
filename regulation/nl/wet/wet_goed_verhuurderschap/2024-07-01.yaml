        artikel: '8'
        hoofdstuk: '4'
  - number: '19.2'
    text: |-
      Indien de gemeenteraad een verhuurverordening vaststelt, bepaalt hij dat een bestuurlijke boete kan worden opgelegd
      ter zake van het overtreden van de verboden, bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1], of
      [artikel 12, derde lid][ref2], of de op basis van [artikel 8, eerste of tweede lid][ref3], aan een vergunning als
      bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref4], verbonden voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0048028#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0048028#Artikel5
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0048028
