preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is om regels te stellen waarmee misstanden bij het
    verhuren van woon- en verblijfsruimte kunnen worden voorkomen en tegengegaan;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *arbeidsmigrant:* onderdaan van een
      andere lidstaat van de Europese Unie die zijn hoofdverblijf niet in Nederland heeft en in Nederland verblijft om
      tijdelijke werkzaamheden te verrichten;
        - *beheerder:* burgemeester en wethouders of een door hen aangewezen: a. andere natuurlijke of rechtspersoon dan
      de verhuurder die uit hoofde van beroep of bedrijf op het terrein van de huisvesting werkzaam is, en aan wie een
      vergunning als bedoeld in [artikel 5, eerste lid][ref1], is of kan worden verleend; b. toegelaten instelling; of
      c. dochtermaatschappij;
        - *dochtermaatschappij:* dochtermaatschappij van een toegelaten instelling als bedoeld in
      [artikel 1, tweede lid, van de Woningwet][ref2];
        - *gebouw:* gebouw als bedoeld in [artikel 1, eerste lid, van de Woningwet][ref3];
        - *toegelaten instelling:* toegelaten instelling als bedoeld in [artikel 19 van de Woningwet][ref4];
        - *verhuurbemiddelaar:* natuurlijke of rechtspersoon die als de lasthebber, bedoeld in
      [artikel 414, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref5], namens de verhuurder handelingen verricht
      om een overeenkomst van huur van een woon- of verblijfsruimte tot stand te brengen;
        - *verblijfsruimte:* gebouw of deel van een gebouw dat bestemd is of gebruikt wordt voor de huisvesting van
      arbeidsmigranten;
        - *verhuurder:* verhuurder niet zijnde een toegelaten instelling of een dochtermaatschappij;
        - *verhuurverordening:* verhuurverordening als bedoeld in [artikel 5, eerste lid][ref6];
        - *woondiscriminatie:* het bij het aanbieden of verhuren van woon- of verblijfsruimte
      handelen in strijd met [artikel 7 van de Algemene wet gelijke behandeling][ref7] of met
      [paragraaf 3a van de Wet gelijke behandeling op grond van handicap of chronische ziekte][ref8];
        - *woonruimte:* besloten ruimte die, al dan niet tezamen met een of meer andere ruimten, bestemd of geschikt is
      voor bewoning, alsmede een kavel die bestemd is voor het plaatsen van een woonwagen, waarop voorzieningen aanwezig
      zijn die op het leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen worden
      aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
