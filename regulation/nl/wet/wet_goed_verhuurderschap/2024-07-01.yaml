  - number: '19.3'
    text: 'De op grond van het tweede lid op te leggen bestuurlijke boete bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel19
  - number: 19.3.a
    text: |-
      het bedrag dat is vastgesteld voor de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], voor het overtreden van de verboden, bedoeld in
      [artikel 5, eerste lid, onderdeel a of b][ref2], of [artikel 12, derde lid][ref3], of voor het handelen in strijd
      met de op basis van [artikel 8, eerste of tweede lid][ref4], aan een vergunning als bedoeld in artikel 5, eerste
      lid, onderdeel a of b, verbonden voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0048028#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0048028#Artikel8
    url: https://wetten.overheid.nl/BWBR0048028/2024-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0048028
        artikel: '5'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0048028
        artikel: '12'
