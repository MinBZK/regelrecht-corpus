  - number: '7'
    text: |-
      1 Een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1], wordt geweigerd indien
      voor de realisatie van die woon- of verblijfsruimte een vereiste omgevingsvergunning als bedoeld in
      [artikel 5.1, eerste lid, aanhef en onderdeel a, of tweede lid, aanhef en onderdeel a, van de Omgevingswet][ref2],
      of indien de betrokken woon- of verblijfsruimte is gerealiseerd en op grond van
      [artikel 4.3, eerste lid, onderdeel a, van de Omgevingswet][ref3] bij algemene maatregel van bestuur
      is bepaald dat het feitelijk in gebruik nemen van het bouwwerk of de bouwwerken die onderdeel uitmaken
      van een bouwactiviteit verboden is zonder voorafgaande melding, of een vergunning als bedoeld in
      [artikel 21, eerste lid, van de Huisvestingswet 2014][ref4], vereist is en de verhuurder de vereiste vergunning of
      melding of een aanvraag voor die vergunning waarop het bevoegd gezag nog niet heeft beslist, niet heeft overgelegd
      bij de aanvraag.

      2 Een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref5], kan uitsluitend worden geweigerd:

      a. indien aan de verhuurder binnen een tijdvak van acht jaar voorafgaand aan de aanvraag een bestuurlijke boete of
      een last onder bestuursdwang is opgelegd voor het handelen door de verhuurder in strijd met:

      1°. de regels van goed verhuurderschap, bedoeld in de [artikelen 2][ref6] en [3][ref7] of [artikel 2a][ref8]
      of [artikel 2b][ref9];

      2°. een verbod op grond van:

      i. [artikel 5, eerste lid, onderdeel a of b][ref10];

      ii. [artikel 8, tweede lid][ref11], en [artikel 21, eerste lid, van de Huisvestingswet 2014][ref12]; of

      iii. [artikel 5.1, eerste lid, aanhef en onderdeel a, of tweede lid, aanhef en onderdeel a, van de Omgevingswet][ref13];

      3°. de op grond van [artikel 4.1, eerste lid, van de Omgevingswet][ref14] in een omgevingsplan gestelde regels over
      het gebruik of de staat van open erven of terreinen of het gebruik van gebouwen, of over het tegengaan van hinder,
      of de op grond van [artikel 4.3, eerste lid, aanhef en onderdeel a, en vierde lid, van de Omgevingswet][ref15]
      gestelde verboden voor en regels of voorschriften over bouwactiviteiten en het gebruik en in stand houden van
      bouwwerken;

      4°. de aan een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref16], verbonden voorwaarden,
      bedoeld in [artikel 8, eerste of tweede lid][ref17];

      5°. de aan een vergunning als bedoeld in [artikel 21, eerste lid, van de Huisvestingswet 2014][ref18] verbonden
      voorwaarden en voorschriften, bedoeld in [artikel 24 van de Huisvestingswet 2014][ref19];

      b. indien ten aanzien van de verhuurder een besluit als bedoeld in [artikel 12, eerste lid][ref20], is genomen en
      het beheer overeenkomstig [artikel 16][ref21] nog niet is beëindigd;

      c. in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref22].

      3 Voordat toepassing wordt gegeven aan het tweede lid, onderdeel c, kan het
      Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref23], om een advies als
      bedoeld in [artikel 9 van die wet][ref24] worden gevraagd.

      4 Indien de vergunning, bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref25], wordt geweigerd en deze
      vergunning betrekking heeft op een woon- of verblijfsruimte die op het moment van de weigering van de vergunning is
      verhuurd, kunnen burgemeester en wethouders een besluit nemen als bedoeld in [artikel 12, eerste lid][ref26].


