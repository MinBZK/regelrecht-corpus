  - number: '23'
    text: |-
      1 De verplichting tot het schriftelijk vastleggen van de huurovereenkomst, bedoeld in
      [artikel 2, tweede lid, onderdeel d][ref1], is uitsluitend van toepassing op huurovereenkomsten die worden
      afgesloten na het tijdstip van inwerkingtreding van deze wet.

      2 Het schriftelijk verstrekken van informatie aan de huurder, bedoeld in
      [artikel 2, tweede lid, onderdeel e][ref2], vindt plaats:

      a. voor huurovereenkomsten die zijn afgesloten na het tijdstip van inwerkingtreding van deze wet op het moment
      waarop de huurovereenkomst wordt aangegaan;

      b. voor huurovereenkomsten die zijn afgesloten voor de inwerkingtreding van deze wet, verstrekt de verhuurder deze
      informatie aan de huurder uiterlijk één jaar na het tijdstip van inwerkingtreding van deze wet.

      3 De verplichting tot het afzonderlijk vastleggen van de huurovereenkomst van de arbeidsovereenkomst, bedoeld
      in [artikel 2, derde lid, onderdeel a][ref3], is uitsluitend van toepassing op huurovereenkomsten die worden
      afgesloten na het tijdstip van inwerkingtreding van deze wet.

      4 Het schriftelijk verstrekken van informatie aan de huurder, bedoeld in [artikel 2, derde lid, onderdeel b][ref4],
      vindt plaats:

      a. voor huurovereenkomsten die zijn afgesloten na het tijdstip van inwerkingtreding van deze wet op het moment
      waarop de huurovereenkomst wordt aangegaan;

      b. voor huurovereenkomsten die zijn afgesloten voor de inwerkingtreding van deze wet uiterlijk drie maanden na het
      tijdstip van inwerkingtreding van deze wet.

      5 Het tijdvak van acht jaar, bedoeld in [artikel 7, tweede lid, onderdeel a][ref5], met betrekking tot de regels
      van goed verhuurderschap, bedoeld in artikel 7, tweede lid, onderdeel a, onder 1°, het tijdvak van vier jaar,
      bedoeld in [artikel 10, eerste lid, onderdeel a][ref6], vangt aan op het tijdstip van inwerkingtreding van deze
      wet.

      6 Het tijdvak van acht jaar, bedoeld in [artikel 7, tweede lid, onderdeel a][ref7] met betrekking tot
      een verbod als bedoeld in artikel 7, tweede lid, onderdeel a, onder 2°, en de voorwaarden, bedoeld in
      artikel 7, tweede lid, onderdeel a, onder 4°, vangt aan op het tijdstip waarop het verbod, bedoeld in
      [artikel 5, eerste lid, onderdeel a of b][ref8], in werking treedt.

      7 In afwijking van het tweede lid geldt dat de informatie, bedoeld in
      [artikel 2, tweede lid, onderdeel e, onder 6°][ref9], enkel schriftelijk wordt verstrekt aan de huurder voor
      huurovereenkomsten die zijn afgesloten na het tijdstip van inwerkingtreding van de Wet betaalbare huur.


