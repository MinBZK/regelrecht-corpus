  - number: '16'
    text: |-
      1 Burgemeester en wethouders beëindigen het beheer:

      a. als de verhuurder door middel van een verhuurplan naar het oordeel van burgemeester en wethouders voldoende
      aannemelijk heeft gemaakt dat hij in de toekomst zal handelen in overeenstemming met de regels van goed
      verhuurderschap, bedoeld in de [artikelen 2][ref1] en [3][ref2] of [artikel 2a][ref3], of de van toepassing
      zijnde voorwaarden, bedoeld in [artikel 8, eerste of tweede lid][ref4];

      b. indien van toepassing, de noodzakelijke voorzieningen of aanpassingen, bedoeld in
      [artikel 14, eerste lid][ref5], zijn uitgevoerd; en

      c. indien van toepassing, de resterende kosten, bedoeld in [artikel 15, vierde lid][ref6], door de verhuurder zijn
      voldaan.

      2 Indien het eigendom van de woon- of verblijfsruimte of het gebouw waarin die woon- of verblijfsruimte is gelegen
      door de verhuurder is overgedragen aan een nieuwe eigenaar beëindigen burgemeester en wethouders het beheer:

      a. indien van toepassing, de noodzakelijke voorzieningen of aanpassingen, bedoeld in
      [artikel 14, eerste lid][ref7], zijn uitgevoerd;

      b. indien van toepassing, de resterende kosten, bedoeld in [artikel 15, vierde lid][ref8], zijn voldaan; en

      c. indien voor het verhuren van die woon- of verblijfsruimte een vergunning als bedoeld in
      [artikel 5, eerste lid, onderdeel a of b][ref9], verplicht is en deze aan de nieuwe eigenaar is verstrekt.


