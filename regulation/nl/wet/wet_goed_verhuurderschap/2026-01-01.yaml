  - number: '11'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder beheer:

      a. het verhuren van een woon- of verblijfsruimte;

      b. het innen van de huur en andere vergoedingen voor de woon- of verblijfsruimte; en

      c. het verrichten van alle handelingen met betrekking tot die woon- of verblijfsruimte die volgens het burgerlijk
      recht tot de rechten en plichten van een verhuurder behoren met uitzondering van vervreemden en bezwaren.
    url: https://wetten.overheid.nl/BWBR0048028/2026-01-01#Artikel11
  - number: '12'
    text: |-
      1 Burgemeester en wethouders kunnen de verhuurder verplichten tot het aan een beheerder in beheer geven van een
      woon- of verblijfsruimte of een gebouw waarin die woon- of verblijfsruimte is gelegen, indien:

      a. de verhuurder binnen een tijdvak van vier jaar voorafgaand aan de constatering dat hij handelt in strijd met
      de regels van goed verhuurderschap, bedoeld in de [artikelen 2][ref1] en [3][ref2] of [artikel 2a][ref3], reeds
      tweemaal een bestuurlijke boete is opgelegd voor het handelen in strijd met die regels; en

      b. in het geval genoemd in [artikel 7, vierde lid][ref4].

      2 Burgemeester en wethouders verplichten de verhuurder tot het aan een beheerder in beheer geven van een
      woon- of verblijfsruimte of een gebouw waarin die woon- of verblijfsruimte is gelegen, in het geval genoemd in
      [artikel 10, vierde lid][ref5].

      3 Het is de verhuurder tot wie het besluit, bedoeld in het eerste of tweede lid, is gericht, gedurende de termijn
      waarvoor de woon- of verblijfsruimte of het gebouw waarin die woon- of verblijfsruimte gelegen is in beheer is
      genomen, verboden om beheershandelingen te verrichten.

      4 De beoogde beheerder is niet verplicht de beheersopdracht te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
