  - number: 23a
    text: |-
      1 [Artikel 2a, eerste lid][ref1], is niet van toepassing op huurovereenkomsten die zijn afgesloten voor het
      tijdstip van inwerkingtreding van de [Wet betaalbare huur][ref2].

      2 In afwijking van het eerste lid is [artikel 2a, eerste lid][ref3], van toepassing op voor het
      tijdstip van inwerkingtreding van de [Wet betaalbare huur][ref4] afgesloten huurovereenkomsten
      die betrekking hebben op zelfstandige woonruimten met een op dat tijdstip krachtens
      [artikel 10 van de Uitvoeringswet huurprijzen woonruimte][ref5] geldende maximale huurprijs die niet hoger is dan
      het bedrag, genoemd in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref6], en indien de
      feitelijke huurprijs niet hoger is dan dat bedrag.

      3 In afwijking van het eerste lid is [artikel 2a, eerste lid][ref7], een jaar na het tijdstip van
      inwerkingtreding van de [Wet betaalbare huur][ref8] van toepassing op de voor dat tijdstip afgesloten
      huurovereenkomsten die betrekking hebben op zelfstandige woonruimten met een op dat tijdstip krachtens
      [artikel 10 van de Uitvoeringswet huurprijzen woonruimte][ref9] geldende maximale huurprijs die lager is dan
      het bedrag, genoemd in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref10], indien de
      feitelijke huurprijs hoger is dan dat bedrag.


