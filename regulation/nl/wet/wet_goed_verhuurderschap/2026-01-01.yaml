  - number: 2b
    text: |-
      Het is verhuurders, toegelaten instellingen en dochtermaatschappijen verboden om in geval van een huurovereenkomst
      als bedoeld in [artikel 247][ref1] of [artikel 247a van Boek 7 van het Burgerlijk Wetboek][ref2], behoudens
      [artikel 255a van dat boek][ref3], de huurprijs te verhogen met een percentage dat hoger is dan het percentage,
      bedoeld in [artikel 10, derde lid, van de Uitvoeringswet huurprijzen woonruimte][ref4].


