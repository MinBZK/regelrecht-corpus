  - number: '13'
    text: |-
      In het besluit, bedoeld in [artikel 12, eerste of tweede lid][ref1], stellen burgemeester en wethouders de
      huurprijs van de woon- of verblijfsruimte vast op een bedrag dat redelijk is in het economisch verkeer en voldoet
      aan de voor de betreffende huurprijs geldende wettelijke regels die de beheerder in rekening mag brengen bij de
      gebruikers van de woon- of verblijfsruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel12
    url: https://wetten.overheid.nl/BWBR0048028/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '12'
        hoofdstuk: '5'
  - number: '14'
    text: |-
      1 Indien een woon- of verblijfsruimte of het gebouw waarin die woon- of verblijfsruimte gelegen is, noodzakelijke
      voorzieningen of aanpassingen behoeft, kunnen burgemeester en wethouders besluiten dat de beheerder binnen een in
      dat besluit bepaalde termijn die voorzieningen aanbrengt of aanpassingen uitvoert.

      2 De uitvoering van de voorzieningen of aanpassingen, bedoeld in het eerste lid, geschiedt op kosten van de
      verhuurder.
    url: https://wetten.overheid.nl/BWBR0048028/2026-01-01#Artikel14
  - number: '15'
    text: |-
      1 In het besluit, bedoeld in [artikel 12, eerste of tweede lid][ref1], bepalen burgemeester en wethouders een
      kostendekkende beheervergoeding die de verhuurder aan hen is verschuldigd ten behoeve van het beheer.

      2 Burgemeester en wethouders verrekenen de door de beheerder geïnde huur voor de woonruimte of vergoeding voor
      het gebruik van de verblijfsruimte met de beheervergoeding en de verschuldigde kosten van de voorzieningen of
      aanpassingen, bedoeld in [artikel 14, eerste lid][ref2].

      3 Op basis van de verrekening bepalen burgemeester en wethouders het bedrag dat de beheerder verschuldigd is aan
      de verhuurder.

      4 Indien blijkt uit de verrekening dat de geïnde huur van de woonruimte of vergoeding voor het gebruik van
      de verblijfsruimte lager zijn dan de som van de beheervergoeding en de verschuldigde kosten, bedoeld in
      [artikel 14, tweede lid][ref3], kunnen burgemeester en wethouders het resterende bedrag bij de verhuurder
      invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel14
