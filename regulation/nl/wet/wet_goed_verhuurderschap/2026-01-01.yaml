  - number: '17'
    text: |-
      Burgemeester en wethouders dragen zorg voor de bestuursrechtelijke handhaving van het bij of krachtens deze wet
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0048028/2026-01-01#Artikel17
  - number: '18'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van
      burgemeester en wethouders aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in het Gemeenteblad.

      3 Burgemeester en wethouders zijn bevoegd tot het opleggen van een bestuurlijke boete als bedoeld in
      [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel19
    url: https://wetten.overheid.nl/BWBR0048028/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0048028
        artikel: '19'
        hoofdstuk: '6'
  - number: '19'
    text: |-
      1 De bestuurlijke boete ter zake van het handelen in strijd met de regels van goed verhuurderschap, bedoeld in de
      [artikelen 2][ref1] en [3][ref2] of [artikel 2a][ref3], of het verbod, bedoeld in [artikel 2b][ref4], bedraagt
      ten hoogste:

      a. het bedrag dat is vastgesteld voor de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5];

      b. het bedrag dat is vastgesteld voor de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref6], indien binnen een tijdvak van vier jaar voorafgaand
      aan de constatering van de overtreding een bestuurlijke boete is opgelegd voor het handelen in strijd met de regels
      van goed verhuurderschap, bedoeld in de [artikelen 2][ref7] en [3][ref8] of [artikel 2a][ref9] of het verbod,
      bedoeld in [artikel 2b][ref10], of, indien toepassing is gegeven aan het tweede lid, voor het overtreden van de
      verboden, bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref11], of [artikel 12, derde lid][ref12], of de
      op basis van [artikel 8, eerste of tweede lid][ref13], aan een vergunning als bedoeld in artikel 5, eerste lid,
      onderdeel a of b, verbonden voorwaarden.

      2 Indien de gemeenteraad een verhuurverordening vaststelt, bepaalt hij dat een bestuurlijke boete kan worden
      opgelegd ter zake van het overtreden van de verboden, bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref14],
      of [artikel 12, derde lid][ref15], of de op basis van [artikel 8, eerste of tweede lid][ref16], aan een vergunning
      als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref17], verbonden voorwaarden.

      3 De op grond van het tweede lid op te leggen bestuurlijke boete bedraagt ten hoogste:

      a. het bedrag dat is vastgesteld voor de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref18], voor het overtreden van de verboden, bedoeld in
      [artikel 5, eerste lid, onderdeel a of b][ref19], of [artikel 12, derde lid][ref20], of voor het handelen in strijd
      met de op basis van [artikel 8, eerste of tweede lid][ref21], aan een vergunning als bedoeld in artikel 5, eerste
      lid, onderdeel a of b, verbonden voorwaarden;

      b. het bedrag dat is vastgesteld voor de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref22], voor het overtreden van de verboden, bedoeld
      in [artikel 5, eerste lid, onderdeel a of b][ref23], of [artikel 12, derde lid][ref24], of voor het handelen in
      strijd met de op basis van [artikel 8, eerste of tweede lid][ref25], aan een vergunning als bedoeld in artikel
      5, eerste lid, onderdeel a of b, verbonden voorwaarden indien binnen een tijdvak van vier jaar voorafgaand aan
      de constatering van die overtreding een bestuurlijke boete is opgelegd voor overtreding van die verboden of het
      handelen in strijd met de regels van goed verhuurderschap, bedoeld in de [artikelen 2][ref26] en [3][ref27] of
      [artikel 2a][ref28].


