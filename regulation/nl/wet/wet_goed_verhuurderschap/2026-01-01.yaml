  - number: '10'
    text: |-
      1 Burgemeester en wethouders kunnen een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1],
      uitsluitend intrekken voor één of meerdere woon- of verblijfsruimten indien:

      a. ter zake het niet naleven van de regels van goed verhuurderschap, bedoeld in de [artikelen 2][ref2] en
      [3][ref3] of [artikel 2a][ref4], een last onder bestuursdwang of een bestuurlijke boete is opgelegd en de
      verhuurder deze regels opnieuw niet naleeft binnen een tijdvak van vier jaar nadat de last onder bestuursdwang of
      de bestuurlijke boete is opgelegd;

      b. ter zake het niet naleven van de aan de vergunning verbonden voorwaarden, bedoeld in
      [artikel 8, eerste of tweede lid][ref5], een last onder bestuursdwang of een bestuurlijke boete is opgelegd en de
      verhuurder deze voorwaarden opnieuw niet naleeft binnen een tijdvak van vier jaar nadat de last onder bestuursdwang
      of de bestuurlijke boete is opgelegd;

      c. die vergunning is verleend op grond van door de houder van die vergunning verstrekte gegevens waarvan deze wist
      of redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren;

      d. een omgevingsvergunning als bedoeld in
      [artikel 5.1, eerste lid, onderdeel a, of tweede lid, aanhef en onderdeel a, van de Omgevingswet][ref6]
      voor de realisatie van die woon- of verblijfsruimte, of een vergunning als bedoeld in
      [artikel 21, eerste lid, van de Huisvestingswet 2014][ref7], geheel of gedeeltelijk is ingetrokken;

      e. de verboden, bedoeld in [artikel 21, eerste lid, van de Huisvestingswet 2014][ref8] of
      [artikel 5.1, eerste lid, onderdeel a, of tweede lid, aanhef en onderdeel a, van de Omgevingswet][ref9], met
      betrekking tot de woon- of verblijfsruimten worden overtreden; of

      f. een bestuurlijke boete is opgelegd op grond van
      [artikel 35, tweede lid, onderdeel d, van de Huisvestingswet 2014][ref10].

      2 De vergunning, bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref11],
      kan voorts worden ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref12].

      3 Voordat toepassing wordt gegeven aan het tweede lid, kan het Bureau bevordering integriteitsbeoordelingen door
      het openbaar bestuur, bedoeld in [artikel 8 van de Wet bevordering integriteitsbeoordelingen][ref13] door het
      openbaar bestuur, om een advies als bedoeld in [artikel 9 van die wet][ref14] worden gevraagd.

      4 Indien de vergunning, bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref15], wordt ingetrokken en deze
      vergunning betrekking heeft op een woon- of verblijfsruimte die op het moment van de intrekking is verhuurd, nemen
      burgemeester en wethouders een besluit als bedoeld in [artikel 12, tweede lid][ref16].


