  - number: '2'
    text: |-
      1 Een verhuurder of verhuurbemiddelaar van een woon- of verblijfsruimte handelt in overeenstemming met de regels
      van goed verhuurderschap.

      2 Onder goed verhuurderschap wordt verstaan:

      a. het zich onthouden van iedere vorm van ongerechtvaardigd onderscheid, in ieder geval door:

      1°. het hanteren van een heldere en transparante selectieprocedure;

      2°. het gebruiken en communiceren van objectieve selectiecriteria bij het openbaar aanbieden van de woon- of
      verblijfsruimte;

      3°. het motiveren van de keuze voor de gekozen huurder aan de afgewezen kandidaat- huurders;

      b. het zich onthouden van iedere vorm van intimidatie;

      c. het zich onthouden van het in rekening brengen van een waarborgsom die hoger is dan hetgeen is bepaald in
      [artikel 261b, tweede lid van Boek 7 van het Burgerlijk Wetboek][ref1];

      d. het schriftelijk vastleggen van de huurovereenkomst;

      e. het schriftelijk verstrekken van informatie aan de huurder over:

      1°. de rechten en plichten van de huurder ten aanzien van het gehuurde, voor zover deze rechten en plichten niet in
      de huurovereenkomst zijn opgenomen;

      2°. indien een waarborgsom, als bedoeld in [artikel 261b van Boek 7 van het Burgerlijk Wetboek][ref2], in rekening
      wordt gebracht, de hoogte van de waarborgsom, de wijze waarop en de termijnen waarbinnen bij beëindiging van de
      huurovereenkomst de vordering van de huurder op de verhuurder ten aanzien van de waarborgsom wordt vastgesteld;

      3°. de contactgegevens van een contactpunt waar de huurder terecht kan bij zaken die het gehuurde betreffen;

      4°. de contactgegevens van het meldpunt, bedoeld in [artikel 4][ref3], van de gemeente waarin het gehuurde is
      gelegen;

      5°. indien servicekosten als bedoeld in [artikel 237, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref4],
      in rekening worden gebracht, de betalingsverplichting van de huurder waarbij geldt dat jaarlijks een volledige
      kostenspecificatie aan de huurder dient te worden verstrekt; en

      6°. de waardering van de kwaliteit van de woonruimte, bedoeld in artikel 10, eerste lid, van de Uitvoeringswet
      huurprijzen woonruimte op de datum van ingang van de huurovereenkomst en de krachtens dat lid bepaalde bijbehorende
      maximale huurprijs, en indien krachtens die wet ten aanzien van de woonruimte een prijsopslag geldt, tevens de
      bewijsstukken waaruit het gelden van deze opslag blijkt; en

      f. het zich onthouden van het in rekening brengen van servicekosten anders dan in overeenstemming met de
      [artikelen 259][ref5] en [261 van Boek 7 van het Burgerlijk Wetboek][ref6].

      3 Onverminderd het tweede lid wordt in het geval van verhuur van verblijfsruimte aan arbeidsmigranten:

      a. de huurovereenkomst afzonderlijk van de arbeidsovereenkomst vastgelegd; en

      b. de informatie, bedoeld in het tweede lid, onderdeel e, waaronder mede begrepen de rechten en plichten van de
      huurder ten aanzien van het gehuurde die in de huurovereenkomst zijn opgenomen, verstrekt in een taal waaraan de
      arbeidsmigrant de voorkeur geeft, tenzij er een andere taal kan worden gebruikt die hij begrijpt en waarin hij
      helder kan communiceren.

      4 Onverminderd het tweede en derde lid handelt de verhuurbemiddelaar in overeenstemming met
      [artikel 417, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref7].

      5 Bij ministeriële regeling kunnen nadere regels worden gegeven over de informatie die een verhuurder of
      verhuurbemiddelaar aan de huurder verstrekt op grond van het tweede lid, onderdeel e, onder 1°.

      6 De verhuurder die een huurovereenkomst heeft opgezegd op grond van
      [artikel 274, eerste lid, onder h, van Boek 7 van het Burgerlijk Wetboek][ref8] doet een melding bij het
      meldpunt als bedoeld in [artikel 4, eerste lid][ref9].


