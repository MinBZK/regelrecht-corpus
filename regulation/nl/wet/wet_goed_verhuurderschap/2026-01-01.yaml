        hoofdstuk: '2'
  - number: '5'
    text: |-
      1 De gemeenteraad kan in een verhuurverordening bepalen dat het voor een verhuurder verboden is om:

      a. een in de verordening aangewezen categorie van woonruimte die gelegen is in een in die verordening aangewezen
      gebied, zonder vergunning van burgemeester en wethouders te verhuren;

      b. een in de verordening aangewezen categorie van verblijfsruimte zonder vergunning van burgemeester en wethouders
      te verhuren.

      2 De gemeenteraad maakt van de bevoegdheid, bedoeld in het eerste lid, onderdeel a, slechts gebruik indien dat in
      het aangewezen gebied noodzakelijk en geschikt is voor het behoud van de leefbaarheid.

      3 Bij de voorbereiding van de vaststelling of wijziging van een verhuurverordening voeren burgemeester
      en wethouders overleg met burgemeester en wethouders van de overige gemeenten die deel uitmaken van de
      woningmarktregio, bedoeld in [artikel 1, onderdeel k, van de Huisvestingswet 2014][ref1], waarin de gemeente is
      gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0035303#Artikel1
    url: https://wetten.overheid.nl/BWBR0048028/2026-01-01#Artikel5
