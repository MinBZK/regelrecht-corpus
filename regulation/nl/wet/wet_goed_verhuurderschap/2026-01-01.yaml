  - number: '20'
    text: |-
      1 Burgemeester en wethouders maken het feit dat een bestuurlijke boete als bedoeld in [artikel 19][ref1],
      is opgelegd voor het handelen in strijd met de regels van goed verhuurderschap, bedoeld in de
      [artikelen 2][ref2] en [3][ref3] of [artikel 2a][ref4], overtreding van de verboden, bedoeld in
      [artikel 2b][ref5], [artikel 5, eerste lid, onderdeel a of b][ref6], of een besluit als bedoeld in
      [artikel 12, eerste of tweede lid][ref7], is genomen, openbaar teneinde de naleving ervan te bevorderen,
      woningzoekenden en huurders te informeren en inzicht te geven in het uitvoeren van toezicht op de naleving van deze
      artikelen, met dien verstande dat:

      a. de namen van betrokken natuurlijke personen niet openbaar worden gemaakt, indien het belang van
      openbaarmaking naar het oordeel van de burgemeester en wethouders niet opweegt tegen het belang, bedoeld in
      [artikel 5.1, tweede lid, onderdeel e, van de Wet open overheid][ref8];

      b. geen openbaarmaking plaatsvindt, indien het belang van de openbaarmaking naar het
      oordeel van burgemeester en wethouders niet opweegt tegen de belangen, bedoeld in
      [artikel 5.1, tweede lid, onderdeel c of d, van de Wet open overheid][ref9].

      2 De openbaarmaking geschiedt niet eerder dan nadat tien werkdagen zijn verstreken na de dag waarop het besluit van
      openbaarmaking aan belanghebbende bekend is gemaakt.

      3 Bij de openbaarmaking wordt vermeld of tegen een besluit tot oplegging van een bestuurlijke boete een
      rechtsmiddel is ingesteld dan wel of daartoe de mogelijkheid bestaat.

      4 Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref10], wordt de openbaarmaking opgeschort totdat de
      voorzieningenrechter een uitspraak heeft gedaan.

      5 Indien de openbaarmaking in strijd is of zou kunnen komen met het doel van het toezicht op de naleving dat door
      de door burgemeester en wethouders aangewezen ambtenaren wordt uitgeoefend, blijft openbaarmaking achterwege.

      6 De openbaarmaking van het feit dat een bestuurlijke boete is opgelegd voor het handelen in strijd met de regels
      van goed verhuurderschap, bedoeld in de [artikelen 2][ref11] en [3][ref12] of [artikel 2a][ref13], of overtreding
      van de verboden, bedoeld in [artikel 2b][ref14] of [artikel 5, eerste lid, onderdeel a of b][ref15], wordt
      verwijderd vier jaar na de dagtekening van het besluit van openbaarmaking.

      7 De openbaarmaking van het feit dat een besluit als bedoeld in [artikel 12, eerste of tweede lid][ref16], is
      genomen wordt verwijderd op het moment dat burgemeester en wethouders besluiten tot het beëindigen van het beheer
      op grond van [artikel 16][ref17].

      8 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de openbaar te maken gegevens,
      waaronder de mogelijke reactie van een belanghebbende in verband met de openbaarmaking van zijn gegevens, de
      termijn waarop deze gegevens beschikbaar worden gesteld en de wijze waarop de openbaarmaking plaatsvindt.


