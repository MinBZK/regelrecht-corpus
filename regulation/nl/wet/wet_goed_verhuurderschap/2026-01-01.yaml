  - number: '4'
    text: |-
      1 Burgemeester en wethouders stellen een meldpunt in waar klachten over ongewenst verhuurgedrag en de in
      [artikel 2, zesde lid][ref1], genoemde opzeggingen kunnen worden gemeld.

      2 Burgemeester en wethouders zijn bevoegd tot het verwerken van persoonsgegevens ten behoeve van het afwikkelen
      van bij het meldpunt ingediende klachten. Burgemeester en wethouders zijn verwerkingsverantwoordelijke voor deze
      verwerking.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de verwerking van de
      persoonsgegevens. Deze nadere regels hebben in ieder geval betrekking op de vastlegging, de bewaartermijn en de
      vernietiging van de persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel2
    url: https://wetten.overheid.nl/BWBR0048028/2026-01-01#Artikel4
