  - number: '8'
    text: |-
      1 Burgemeester en wethouders kunnen aan een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a][ref1],
      voorwaarden verbinden die uitsluitend betrekking hebben op:

      a. de wijze waarop de verhuurder aantoont hoe hij invulling geeft aan de regels van goed verhuurderschap, bedoeld
      in de [artikelen 2][ref2] en [3][ref3] of [artikel 2a][ref4];

      b. het opstellen en uitvoeren van een onderhoudsplan waarvan een afschrift binnen een door burgemeester en
      wethouders te bepalen termijn aan hen wordt toegezonden, dat ten minste bevat:

      1°. de in de periode van de komende vijf jaar uit te voeren onderhouds- en herstelwerkzaamheden aan en
      vernieuwingen van het gebouw;

      2°. een schatting van de aan de werkzaamheden en de vernieuwingen, bedoeld in onderdeel 1°, verbonden kosten en een
      gelijkmatige toerekening van die kosten aan de onderscheiden jaren; en

      3°. een schatting van de benodigde jaarlijkse reservering voor andere dan de gewone jaarlijkse kosten na de periode
      waarop het onderhoudsplan betrekking heeft.

      2 Burgemeester en wethouders kunnen aan een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel b][ref5],
      voorwaarden verbinden die uitsluitend betrekking hebben op:

      a. de wijze waarop de verhuurder aantoont hoe hij invulling geeft aan de regels van goed verhuurderschap, bedoeld
      in de [artikelen 2][ref6] en [3][ref7] of [artikel 2a][ref8];

      b. het in gebruik geven van een afzonderlijk afsluitbare verblijfsruimte die voldoet aan de daarvoor geldende eisen
      van de bouwregelgeving aan iedere arbeidsmigrant die geen huishouden vormt met een andere arbeidsmigrant; of

      c. de voorzieningen voor het bewaren en bereiden van voeding, wasruimte en doucheruimte die in het gebouw waarin de
      verblijfsruimte gelegen is aanwezig moeten zijn, rekening houdend met het maximaal aantal arbeidsmigranten die in
      dat gebouw kunnen verblijven.

      3 Indien de verblijfsruimte een woonruimte betreft die bestemd is of gebruikt wordt voor de huisvesting van
      arbeidsmigranten, kunnen burgemeester en wethouders, onverminderd het tweede lid, aan een vergunning als bedoeld in
      [artikel 5, eerste lid, onderdeel b][ref9], ook de voorwaarden bedoeld in het eerste lid, onderdeel b verbinden.

      4 De voorwaarde, bedoeld in het tweede lid, onderdeel b, kan uitsluitend aan de vergunning,
      bedoeld in [artikel 5, eerste lid, onderdeel b][ref10], worden verbonden voor verblijfsruimte
      die in gebruik wordt genomen na inwerkingtreding van deze wet. Voor verblijfsruimte die reeds
      in gebruik was voor inwerkingtreding van deze wet of waarvoor een vergunning als bedoeld in
      [artikel 5.1, eerste lid, onderdeel a, of tweede lid, aanhef en onderdeel a, van de Omgevingswet][ref11], is
      verstrekt voor inwerkingtreding van deze wet, kunnen burgemeester en wethouders de voorwaarde aan de vergunning
      verbinden dat de desbetreffende verblijfsruimte binnen drie jaar na inwerkingtreding van deze wet aan de
      voorwaarde, bedoeld in het tweede lid onderdeel b, moet voldoen.


