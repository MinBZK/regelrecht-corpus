        artikel: '1'
  - number: '6'
    text: |-
      1 Een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref1], kan slechts worden aangevraagd
      door de verhuurder van de woon- of verblijfsruimte.

      2 In het geval van een aanvraag voor een vergunning als bedoeld in [artikel 5, eerste lid, onderdeel a of b][ref2],
      betrekking heeft op een woon- of verblijfsruimte of het gebouw waarin die woon- of verblijfsruimte
      is gelegen en voor de realisatie van deze functie een omgevingsvergunning als bedoeld in
      [artikel 5.1, eerste lid, onderdeel a, of tweede lid, aanhef en onderdeel a, van de Omgevingswet][ref3], of een
      vergunning als bedoeld in [artikel 21, eerste lid, van de Huisvestingswet 2014][ref4] is aangevraagd, maar nog
      niet is verleend, wordt de aanvraag, bedoeld in het eerste lid, aangehouden tot dat een beslissing is genomen op de
      aanvraag van een omgevingsvergunning als bedoeld in artikel 5.1, eerste lid, onderdeel a, of tweede lid, aanhef en
      onderdeel a, van de Omgevingswet, of een vergunning als bedoeld in artikel 21, eerste lid, van de Huisvestingswet
      2014.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0048028#Artikel5
