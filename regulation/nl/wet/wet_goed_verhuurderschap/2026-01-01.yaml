  - number: '9'
    text: |-
      1 Burgemeester en wethouders beslissen op de aanvraag, bedoeld in [artikel 6, eerste lid][ref1], binnen acht weken
      na de datum van ontvangst van de aanvraag.

      2 Burgemeester en wethouders kunnen de termijn, bedoeld in het eerste lid, eenmaal verlengen met ten hoogste zes
      weken. Zij maken hun besluit daartoe bekend binnen de termijn, bedoeld in het eerste lid.

      3 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0048028#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
