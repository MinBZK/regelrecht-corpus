regulatory_layer: WET
publication_date: '2000-09-19'
valid_from: '2001-09-01'
bwb_id: BWBR0011615
url: https://wetten.overheid.nl/BWBR0011615/2001-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bepalingen ten aanzien van de straf van onbetaalde
    arbeid ten algemenen nutte te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011615/2001-09-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011615/2001-09-01#ArtikelV
  - number: VI
    text: |-
      Deze wet heeft geen gevolgen ten aanzien van strafzaken die voor de inwerkingtreding daarvan bij wege van verkorte
      dagvaarding, oproeping of dagvaarding aanhangig zijn gemaakt. Deze wet heeft eveneens geen gevolgen ten aanzien
      van voor de inwerkingtreding van deze wet veroordeelden tot de straf van het verrichten van onbetaalde arbeid
      ten algemenen nutte. De artikelen 22b tot en met 22j, zoals deze luidden voor het moment van inwerkingtreding van
      deze wet, blijven in dezen van toepassing. Hetzelfde geldt voor beslissingen waarbij gratie is verleend onder de
      voorwaarde van het verrichten van onbetaalde arbeid ten algemenen nutte, genomen voor de inwerkingtreding van deze
      wet.
    url: https://wetten.overheid.nl/BWBR0011615/2001-09-01#ArtikelVI
