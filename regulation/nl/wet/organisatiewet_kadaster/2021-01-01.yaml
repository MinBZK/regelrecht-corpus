  - number: '57'
    text: |-
      Deze wet treedt in werking met ingang van 1 mei 1994 of op een bij koninklijk besluit te bepalen ander tijdstip,
      dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel57
  - number: '58'
    text: 'Deze wet wordt aangehaald als: Organisatiewet Kadaster.'
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel58
