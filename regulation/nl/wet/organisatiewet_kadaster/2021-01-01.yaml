  - number: '2.1'
    text: |-
      Er is een Dienst voor het kadaster en de openbare registers. De Dienst is werkzaam in het Europese deel van
      Nederland en in de openbare lichamen Bonaire, Sint Eustatius en Saba. Hij bezit rechtspersoonlijkheid en is
      gevestigd te Apeldoorn.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel2
  - number: '2.2'
    text: |-
      De Dienst is belast met de hem bij of krachtens de [Kadasterwet][ref1], de [Kadasterwet BES][ref2] of andere wetten
      opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0004541
      [ref2]: https://wetten.overheid.nl/BWBR0043565
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004541
      - id: ref2
        bwb_id: BWBR0043565
  - number: '2.3'
    text: |-
      De Dienst kan andere werkzaamheden verrichten dan die, voortvloeiend uit de in het tweede lid bedoelde taken,
      indien die werkzaamheden bijdragen aan de doelmatigheid van de uitoefening van de in het tweede lid bedoelde taken
      of een betere benutting van de ten behoeve van die uitoefening bij de Dienst aanwezige bedrijfsmiddelen.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het bestuur kan in het kader van internationale samenwerking of op verzoek van een of meer van Onze ministers of
      een ander bestuursorgaan de bij de Dienst in het kader van de uitoefening van zijn taken als bedoeld in het tweede
      lid aanwezige specifieke deskundigheid in beperkte mate en voor een beperkte tijdsduur ter beschikking stellen
      aan een internationale organisatie of instelling, een regering of instelling van een andere staat of aan een
      bestuursorgaan. Het bestuur kan aan die terbeschikkingstelling voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel2
  - number: 2a
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op de Dienst, met uitzondering van
      [artikel 15 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: '3'
    text: De Dienst heeft een bestuur en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel3
  - number: '7'
    text: |-
      Het bestuur is belast met het besturen van de Dienst. De voorzitter en overige leden van het bestuur worden benoemd
      voor een tijdvak van ten hoogste vijf jaren en zijn terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel7
  - number: '8'
    text: |-
      Het bestuur vertegenwoordigt de Dienst in en buiten rechte. De bevoegdheid tot vertegenwoordiging komt mede toe aan
      ieder bestuurslid.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel8
  - number: '9'
    text: Het bestuur stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel9
  - number: '10.1'
    text: De raad van toezicht bestaat uit ten minste drie en ten hoogste vijf leden.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel10
  - number: '10.2'
    text: |-
      De leden van de raad van toezicht hebben op persoonlijke titel zitting in de raad en oefenen hun functie uit zonder
      last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel10
  - number: '11.1'
    text: Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel11
  - number: '11.2'
    text: |-
      Onze Minister stelt de raad van toezicht in de gelegenheid voor iedere te vervullen plaats in de raad een
      voordracht te doen van één persoon. Onze Minister wijkt niet af van de voordracht dan na overleg met de raad.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel11
  - number: '11.3'
    text: |-
      De ondernemingsraad en het bestuur kunnen aan de raad van toezicht personen voor plaatsing op de voordracht
      aanbevelen. De raad van toezicht deelt hun daartoe tijdig mee wanneer en ten gevolge waarvan in zijn midden een
      plaats moet worden vervuld.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel11
  - number: '11.4'
    text: |-
      De raad van toezicht geeft aan de ondernemingsraad kennis van een voorgenomen voordracht. Binnen vier weken na
      verzending van deze kennisgeving kan de ondernemingsraad bedenkingen uiten tegen benoeming van de voor te dragen
      persoon op grond van de verwachting dat die persoon ongeschikt zal zijn voor de vervulling van de taak van lid van
      de raad van toezicht, of dat de raad bij benoeming van die persoon niet naar behoren zal zijn samengesteld.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel11
  - number: '11.5'
    text: |-
      Indien de ondernemingsraad binnen de in het vijfde lid genoemde termijn geen bedenkingen uit, draagt de raad van
      toezicht de betrokken persoon voor. De raad draagt een persoon, tegen de benoeming waarvan de ondernemingsraad
      bedenkingen heeft geuit, niet voor dan nadat hij daarover overleg heeft gevoerd met de ondernemingsraad. Bij een
      zodanige voordracht stelt de raad Onze Minister op de hoogte van de bedenkingen en doet hij Onze Minister verslag
      van het overleg met de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel11
  - number: '11.6'
    text: |-
      De voorzitter en de overige leden van de raad van toezicht worden benoemd voor een tijdvak van vier jaren en zijn
      aansluitend éénmalig voor een tijdvak van vier jaren herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel11
  - number: '11.7'
    text: |-
      Zolang niet is voorzien in een vacature in de raad van toezicht, vormen de overblijvende leden de raad van
      toezicht. Indien alle leden ontbreken, benoemt Onze Minister onverwijld een of meer personen die tijdelijk de taken
      van de raad van toezicht vervullen.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel11
  - number: '12.1'
    text: |-
      De raad van toezicht ziet toe op de werkzaamheden van het bestuur en op de algemene gang van zaken in de
      organisatie van de Dienst. Hij staat het bestuur met raad ter zijde.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel12
  - number: '12.2'
    text: |-
      Bij de vervulling van zijn taak richt de raad zich naar het belang van de Dienst, daaronder begrepen het belang van
      de behoorlijke vervulling van de bij of krachtens de wet aan de Dienst opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel12
  - number: '12.3'
    text: |-
      Het bestuur verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak noodzakelijke gegevens. Het
      ziet erop toe dat aan de leden van de raad desgevraagd toegang wordt verleend tot de lokaliteiten van de Dienst en
      inzage wordt verleend van boeken en bescheiden van de Dienst.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister kan bepalen dat het bestuur de voorafgaande instemming behoeft van de raad van toezicht voor een
      beslissing als bedoeld in [artikel 32 van de Kaderwet zelfstandige bestuursorganen][ref1] of dat het bestuur,
      ingeval hij een beslissing als bedoeld in dat artikel aan zijn voorafgaande instemming heeft onderworpen, die
      beslissing pas aan hem kan voorleggen nadat de raad van toezicht heeft verklaard tegen die beslissing geen
      bedenkingen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel32
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '32'
  - number: '13.2'
    text: 'Het bestuur heeft in ieder geval de voorafgaande instemming nodig van de raad van toezicht met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel13
  - number: 13.2.a
    text: |-
      de reglementen, bedoeld in de [artikelen 9][ref1], [16][ref2] en [17][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006463#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0006463#Artikel17
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006463
        artikel: '16'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0006463
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 13.2.b
    text: belangrijke reorganisaties.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel13
  - number: '13.3'
    text: |-
      Het bestuur heeft de voorafgaande instemming nodig van Onze Minister voor het verrichten van werkzaamheden als
      bedoeld in [artikel 2, derde lid][ref1]. Het bestuur legt die beslissing voor aan Onze Minister nadat de raad van
      toezicht heeft verklaard tegen die beslissing geen bedenkingen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '2'
        hoofdstuk: '1'
  - number: '14.1'
    text: |-
      De raad van toezicht kan geen beslissingen nemen indien niet ten minste de helft van het aantal leden ter
      vergadering aanwezig is.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel14
  - number: '14.2'
    text: |-
      De raad van toezicht regelt bij reglement zijn werkwijze, waaronder in ieder geval de openbaarheid van zijn
      vergaderingen. Het reglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel14
  - number: '15.1'
    text: Onze Minister kan aan de leden van de raad van toezicht een bezoldiging toekennen ten laste van de Dienst.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel15
  - number: '15.2'
    text: |-
      De leden van de raad hebben aanspraak op vergoeding door de Dienst van de door hen in de uitoefening van hun
      functie gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel15
  - number: '15.3'
    text: |-
      Het bestuur stelt aan de raad van toezicht een secretaris ter beschikking. De secretaris is wat betreft de
      werkzaamheden ten behoeve van de raad van toezicht uitsluitend verantwoording verschuldigd aan de voorzitter van
      de raad.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel15
  - number: '16.1'
    text: Er is een gebruikersraad.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: '16.2'
    text: |-
      Het bestuur kan bij reglement bepalen dat de gebruikersraad bestaat uit een rechtszekerheidskamer voor de taken
      van de Dienst op het gebied van rechtszekerheid en een geoinformatiekamer voor de taken van de Dienst op het gebied
      van geoinformatie.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: '16.3'
    text: |-
      Ingeval bij wettelijk voorschrift aan de Dienst een andere taak wordt opgedragen, dan bedoeld in het tweede lid,
      kan het bestuur bij reglement de werkzaamheden van een kamer uitbreiden met die andere taak.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: '16.4'
    text: 'Tot de personen die zitting hebben in de gebruikersraad behoren in elk geval een vertegenwoordiger van:'
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: 16.4.a
    text: notarissen;
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: 16.4.b
    text: tussenpersonen in onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: 16.4.c
    text: Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Defensie;
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: 16.4.d
    text: provincies;
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: 16.4.e
    text: gemeenten;
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: 16.4.f
    text: waterschappen;
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: 16.4.g
    text: |-
      grondroerders als bedoeld in
      [artikel 1, onderdeel g, van de Wet informatie-uitwisseling bovengrondse en ondergrondse netten en netwerken][ref1]
      ;


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel1
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '1'
  - number: 16.4.h
    text: |-
      beheerders als bedoeld in
      [artikel 1, onderdeel h, van de Wet informatie-uitwisseling bovengrondse en ondergrondse netten en netwerken][ref1]
      , en


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel1
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '1'
  - number: 16.4.i
    text: eigenaren van registergoederen.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: '16.5'
    text: |-
      Het bestuur stelt aan de gebruikersraad een secretaris ter beschikking. De secretaris is wat betreft de
      werkzaamheden ten behoeve van de gebruikersraad uitsluitend verantwoording verschuldigd aan de voorzitter van de
      gebruikersraad.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: '16.6'
    text: 'Het bestuur regelt nader bij reglement:'
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: 16.6.a
    text: de samenstelling van de gebruikersraad;
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: 16.6.b
    text: |-
      de wijze waarop de organisaties van gebruikers van door de Dienst geleverde diensten gerechtigd zijn een
      vertegenwoordiger en een plaatsvervangend vertegenwoordiger aan te wijzen in de gebruikersraad of, indien het
      bestuur gebruik maakt van de mogelijkheid, bedoeld in het tweede lid, in één of beide kamers, en
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: 16.6.c
    text: |-
      de gevallen waarin en de voorwaarden waaronder de gebruikersraad of, indien het bestuur gebruik maakt van de
      mogelijkheid, bedoeld in het tweede lid, een kamer een commissie kan instellen.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16
  - number: 16a.1
    text: |-
      Het bestuur voert met de gebruikersraad of, indien het bestuur gebruik heeft gemaakt van de mogelijkheid,
      bedoeld in [artikel 16, tweede lid][ref1], met de kamers overleg over de kwaliteit en de doelmatigheid
      van de dienstverlening door de Dienst, over de tarieven die daarvoor in rekening worden gebracht, over het
      meerjarenbeleidsplan en over andere zaken van gemeenschappelijk belang.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel16
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '16'
        hoofdstuk: '3'
  - number: 16a.2
    text: |-
      De gebruikersraad of een kamer kan het bestuur op diens verzoek of uit eigen beweging in kennis stellen van de
      binnen de gebruikersraad of de kamer levende standpunten over een onderwerp als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16a
  - number: 16a.3
    text: |-
      Een commissie als bedoeld in [artikel 16, zesde lid, onderdeel c][ref1], kan het bestuur op diens verzoek of uit
      eigen beweging in kennis stellen van de binnen die commissie levende standpunten over een onderwerp, waarvoor zij
      is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel16
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '16'
        hoofdstuk: '3'
  - number: 16a.4
    text: Onder de dienstverlening, bedoeld in het eerste lid, wordt niet verstaan het beheer van een landelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel16a
  - number: '17'
    text: Het bestuur stelt bij reglement de hoofdlijnen vast van de inrichting van de organisatie van de Dienst.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel17
  - number: '19.1'
    text: Het bestuur stelt de begroting vast als onderdeel van het door hem vast te stellen meerjarenbeleidsplan.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel19
  - number: '19.2'
    text: |-
      Het besluit tot vaststelling van het meerjarenbeleidsplan behoeft de voorafgaande instemming van de raad van
      toezicht.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel19
  - number: '19.3'
    text: |-
      Het meerjarenbeleidsplan geeft een overzicht van de door de Dienst te verrichten werkzaamheden en een zo getrouw
      mogelijke doorkijk van het geschetste beeld in de begroting over de volgende vier jaren na het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel19
  - number: '20'
    text: |-
      [Artikel 29 van de Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op het meerjarenbeleidsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel29
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '29'
  - number: '21'
    text: Het bestuur stelt de jaarrekening vast nadat de raad van toezicht daarmee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel21
  - number: '31'
    text: |-
      De raad van toezicht verschaft Onze Minister alle verlangde inlichtingen, met inachtneming van het door Onze
      Minister vastgestelde informatiestatuut.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel31
  - number: 31a
    text: |-
      Onze Minister stelt regels over de uitoefening van het toezicht op de Dienst door Onze Minister en de raad van
      toezicht.
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel31a
  - number: '54'
    text: |-
      Het bepaalde in de [artikelen 11, zevende lid, tweede zin][ref1], [84, vierde lid][ref2], en
      [117 van de Kadasterwet][ref3] en [30, eerste en tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref4],
      zoals die artikelen luidden vóór het tijdstip van het in werking treden van deze wet, blijft van toepassing met
      betrekking tot aansprakelijkheid en schadevergoeding ter zake van in die artikelen bedoelde feiten die zich hebben
      voorgedaan vóór dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel117
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel30
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel54
