preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Rijksdienst van het Kadaster en de Openbare
    Registers te verzelfstandigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *bestuur:* bestuur als bedoeld in
      [artikel 3][ref1];
        - *Dienst:* Dienst voor het kadaster en de openbare registers als bedoeld in [artikel 2][ref2];
        - *kamer:* rechtszekerheidskamer of geoinformatiekamer als bedoeld in [artikel 16, tweede lid][ref3];
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *raad van toezicht:* raad van toezicht als bedoeld in [artikel 3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006463#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006463#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0006463#Artikel3
    url: https://wetten.overheid.nl/BWBR0006463/2021-01-01#Artikel1
