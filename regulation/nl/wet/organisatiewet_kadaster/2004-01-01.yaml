$id: organisatiewet_kadaster
regulatory_layer: WET
publication_date: '2020-05-22'
valid_from: '2004-01-01'
bwb_id: BWBR0006463
url: https://wetten.overheid.nl/BWBR0006463/2004-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Rijksdienst van het Kadaster en de Openbare
    Registers te verzelfstandigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel1
  - number: 1.a
    text: |-
      Dienst: de Dienst voor het kadaster en de openbare registers, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '2'
        hoofdstuk: '1'
  - number: 1.b
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel1
  - number: 1.c
    text: |-
      bestuur: het bestuur, bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel3
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.d
    text: |-
      raad van toezicht: de raad van toezicht, bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel3
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.1'
    text: |-
      Er is een Dienst voor het kadaster en de openbare registers. Hij bezit rechtspersoonlijkheid en is gevestigd te
      Apeldoorn.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel2
  - number: '2.2'
    text: |-
      De Dienst is belast met de hem bij of krachtens de [Kadasterwet][ref1] of andere wetten opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0004541
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004541
  - number: '2.3'
    text: |-
      De Dienst kan andere werkzaamheden verrichten dan die, voortvloeiend uit de in het tweede lid bedoelde taken,
      indien die werkzaamheden bijdragen aan de doelmatigheid van de uitoefening van de in het tweede lid bedoelde taken
      of een betere benutting van de ten behoeve van die uitoefening bij de Dienst aanwezige bedrijfsmiddelen.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het bestuur kan in het kader van internationale samenwerking of op verzoek van een of meer van Onze ministers of
      een ander bestuursorgaan de bij de Dienst in het kader van de uitoefening van zijn taken als bedoeld in het tweede
      lid aanwezige specifieke deskundigheid in beperkte mate en voor een beperkte tijdsduur ter beschikking stellen
      aan een internationale organisatie of instelling, een regering of instelling van een andere staat of aan een
      bestuursorgaan. Het bestuur kan aan die terbeschikkingstelling voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel2
  - number: '3'
    text: De Dienst heeft een bestuur en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel3
  - number: '4.1'
    text: Onze Minister benoemt de leden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel4
  - number: '4.2'
    text: |-
      De raad van toezicht doet Onze Minister voor iedere te vervullen plaats in het bestuur een voordracht van ten
      minste twee personen. Onze Minister wijkt niet van de voordracht af dan na overleg met de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel4
  - number: '4.3'
    text: |-
      In geval van ontstentenis of belet van een lid van het bestuur, kan de raad van toezicht voorzien in de waarneming
      van diens functie.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel4
  - number: '5'
    text: |-
      De bezoldiging van de leden van het bestuur wordt vastgesteld door de raad van toezicht en behoeft de goedkeuring
      van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel5
  - number: '6.1'
    text: |-
      Iedere bestuurder kan te allen tijde worden geschorst door de raad van toezicht of door Onze Minister. Een
      schorsing door de raad van toezicht kan te allen tijde door Onze Minister worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel6
  - number: '6.2'
    text: Iedere bestuurder kan te allen tijde worden ontslagen door Onze Minister, de raad van toezicht gehoord.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel6
  - number: '7.1'
    text: |-
      Behoudens beperkingen, voortvloeiend uit het bij of krachtens deze wet bepaalde, is het bestuur belast met het
      besturen van de Dienst.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het bestuur is voorts belast met het vaststellen van de regels en het nemen van de beslissingen waartoe het
      krachtens de [Kadasterwet][ref1] verplicht of bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0004541
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004541
  - number: '8.1'
    text: |-
      Behoudens het bepaalde in het tweede lid, vertegenwoordigt het bestuur de Dienst in en buiten rechte. De
      bevoegdheid tot vertegenwoordiging komt mede toe aan ieder der bestuurders.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel8
  - number: '8.2'
    text: |-
      In alle gevallen waarin de Dienst een tegenstrijdig belang heeft met een of meer bestuurders, wordt de Dienst
      vertegenwoordigd door de raad van toezicht of door een door die raad daartoe aangewezen lid van die raad.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel8
  - number: '9'
    text: |-
      Elke bestuurder is tegenover de Dienst gehouden tot een behoorlijke vervulling van de hem opgedragen taak. Indien
      het een aangelegenheid betreft die tot de werkkring van twee of meer bestuurders behoort, is ieder van hen voor het
      geheel aansprakelijk ter zake van een tekortkoming, tenzij deze niet aan hem is te wijten en hij niet nalatig is
      geweest in het treffen van maatregelen om de gevolgen daarvan af te wenden.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel9
  - number: '10.1'
    text: De raad van toezicht bestaat uit ten minste drie en ten hoogste vijf leden.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel10
  - number: '10.2'
    text: Een persoon, in dienst van de Dienst, kan niet tevens lid zijn van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel10
  - number: '11.1'
    text: Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel11
  - number: '11.2'
    text: |-
      De raad van toezicht doet Onze Minister voor iedere te vervullen plaats in de raad een voordracht van één persoon.
      De voordracht is met redenen omkleed. Onze Minister wijkt niet van de voordracht af, dan na overleg met de raad.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel11
  - number: '11.3'
    text: |-
      Het medezeggenschapsorgaan, bedoeld in [artikel 18, derde lid][ref1], en het bestuur kunnen aan de raad van
      toezicht personen voor plaatsing op de voordracht aanbevelen. De raad van toezicht deelt hun daartoe tijdig mee
      wanneer en ten gevolge waarvan in zijn midden een plaats moet worden vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel18
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '18'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '11.4'
    text: |-
      De raad van toezicht geeft aan het medezeggenschapsorgaan kennis van een voorgenomen voordracht. Binnen acht weken
      na verzending van deze kennisgeving kan het medezeggenschapsorgaan bedenkingen uiten tegen benoeming van de voor te
      dragen persoon op grond van de verwachting dat die persoon ongeschikt zal zijn voor de vervulling van de taak van
      lid van de raad van toezicht, of dat de raad bij benoeming van die persoon niet naar behoren zal zijn samengesteld.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel11
  - number: '11.5'
    text: |-
      Indien het medezeggenschapsorgaan binnen de in het vierde lid genoemde termijn geen bedenkingen uit, draagt
      de raad van toezicht de betrokken persoon voor. De raad draagt een persoon, tegen de benoeming waarvan het
      medezeggenschapsorgaan bedenkingen heeft geuit, niet voor dan nadat hij daarover overleg heeft gevoerd met het
      medezeggenschapsorgaan. Bij een zodanige voordracht stelt de raad Onze Minister op de hoogte van de bedenkingen en
      doet hij Onze Minister verslag van het overleg met het medezeggenschapsorgaan.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel11
  - number: '11.6'
    text: |-
      De leden van de raad van toezicht worden benoemd voor een periode van ten hoogste vier jaar. Zij kunnen eenmaal
      worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel11
  - number: '11.7'
    text: |-
      Zolang niet is voorzien in een vacature in de raad van toezicht, vormen de overblijvende leden de raad van
      toezicht. Indien alle leden ontbreken, benoemt Onze Minister onverwijld een of meer personen die tijdelijk de taken
      van de raad van toezicht vervullen.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel11
  - number: '12.1'
    text: |-
      De raad van toezicht ziet toe op de werkzaamheden van het bestuur en op de algemene gang van zaken in de
      organisatie van de Dienst. Hij staat het bestuur met raad ter zijde.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel12
  - number: '12.2'
    text: |-
      Bij de vervulling van zijn taak richt de raad zich naar het belang van de Dienst, daaronder begrepen het belang van
      de behoorlijke vervulling van de bij of krachtens de wet aan de Dienst opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel12
  - number: '12.3'
    text: |-
      Ten aanzien van de taakvervulling door de raad van toezicht is [artikel 9][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel9
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.4'
    text: |-
      Het bestuur verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak noodzakelijke gegevens. Het
      ziet erop toe dat aan de leden van de raad desgevraagd toegang wordt verleend tot de lokaliteiten van de Dienst en
      inzage wordt verleend van boeken en bescheiden van de Dienst.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel12
  - number: '13.1'
    text: |-
      Aan goedkeuring dan wel instemming van de raad van toezicht zijn onderworpen beslissingen van het bestuur met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
  - number: 13.1.a
    text: |-
      de reglementen, bedoeld in de [artikelen 16][ref1], [17][ref2], [18, tweede lid][ref3], en [20, tweede lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0006463#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0006463#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0006463#Artikel20
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '16'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006463
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006463
        artikel: '18'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006463
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 13.1.b
    text: |-
      de begroting, bedoeld in [artikel 21][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel21
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '21'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 13.1.c
    text: investeringen die een door de raad van toezicht vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
  - number: 13.1.d
    text: het aangaan of garanderen van geldleningen die een door de raad van toezicht vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
  - number: 13.1.e
    text: |-
      het verrichten van werkzaamheden als bedoeld in [artikel 2, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '2'
        hoofdstuk: '1'
  - number: 13.1.f
    text: |-
      het aangaan of verbreken van duurzame samenwerking met een andere rechtspersoon, indien deze samenwerking of
      verbreking van ingrijpende betekenis is voor de Dienst;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
  - number: 13.1.g
    text: het oprichten of mede-oprichten van een privaatrechtelijke rechtspersoon of het deelnemen in een vennootschap;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
  - number: 13.1.h
    text: belangrijke reorganisaties;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
  - number: 13.1.i
    text: |-
      periodieke rapportages aan Onze Minister, als bedoeld in [artikel 31, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel31
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '31'
        hoofdstuk: '6'
  - number: '13.2'
    text: |-
      De raad van toezicht verleent geen goedkeuring aan beslissingen als bedoeld in het eerste lid, onder *e* en *g*,
      dan nadat Onze Minister heeft verklaard daartegen geen bedenkingen te hebben.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
  - number: '13.3'
    text: |-
      De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing
      ten aanzien van de instemming van de raad van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '14.1'
    text: |-
      De raad van toezicht kan geen beslissingen nemen indien niet ten minste de helft van het aantal leden ter
      vergadering aanwezig is.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel14
  - number: '14.2'
    text: |-
      De raad van toezicht regelt bij reglement zijn werkwijze, waaronder in ieder geval de openbaarheid van zijn
      vergaderingen.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel14
  - number: '15.1'
    text: Onze Minister kan aan de leden van de raad van toezicht een bezoldiging toekennen ten laste van de Dienst.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel15
  - number: '15.2'
    text: |-
      De leden van de raad hebben aanspraak op vergoeding door de Dienst van de door hen in de uitoefening van hun
      functie gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel15
  - number: '15.3'
    text: De raad van toezicht heeft een eigen secretariaat.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel15
  - number: '16.1'
    text: Er is een gebruikersraad.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
  - number: '16.2'
    text: |-
      De gebruikersraad bestaat uit een kamer voor de diensten die verband houden met in elk geval de
      taken, bedoeld in [artikel 3, eerste lid, onderdelen a, b, d, e, h, i en j, van de Kadasterwet][ref1]
      en een kamer voor de diensten die verband houden met in elk geval de taken, bedoeld in
      [artikel 3, eerste lid, onderdelen c, f, h, i en j, van de Kadasterwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '3'
  - number: '16.3'
    text: |-
      Bij het reglement, bedoeld in het zesde lid, kan het bestuur de werkzaamheden van een kamer
      uitbreiden tot diensten die verband houden met een taak die aan de Dienst is opgedragen krachtens
      [artikel 3, tweede lid, van de Kadasterwet][ref1] of bij of krachtens een andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
  - number: '16.4'
    text: 'Tot de personen die zitting hebben in de gebruikersraad behoren in elk geval een vertegenwoordiger van:'
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
  - number: 16.4.a
    text: notarissen;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
  - number: 16.4.b
    text: tussenpersonen in onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
  - number: 16.4.c
    text: iedere minister die gebruik maakt van geografische gegevens;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
  - number: 16.4.d
    text: provincies;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
  - number: 16.4.e
    text: gemeenten, en
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
  - number: 16.4.f
    text: waterschappen.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
  - number: '16.5'
    text: De gebruikersraad heeft een secretariaat.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
  - number: '16.6'
    text: |-
      Het bestuur regelt nader bij reglement de samenstelling van de gebruikersraad en de wijze waarop de organisaties
      van gebruikers van door de Dienst geleverde diensten gerechtigd zijn een vertegenwoordiger en een plaatsvervangend
      vertegenwoordiger in een of beide kamers van de gebruikersraad aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16
  - number: 16a.1
    text: |-
      Het bestuur voert overleg met elke kamer van de gebruikersraad over de kwaliteit en de doelmatigheid van
      de dienstverlening door de Dienst, over de tarieven die daarvoor in rekening worden gebracht, over het
      meerjarenbeleidsplan en over andere zaken van gemeenschappelijk belang.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16a
  - number: 16a.2
    text: |-
      Het bestuur kan in afwijking van het eerste lid met beide kamers van de gebruikersraad gezamenlijk overleg voeren
      over de onderwerpen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16a
  - number: 16a.3
    text: |-
      De kamers van de gebruikersraad kunnen het bestuur op diens verzoek of uit eigen beweging in kennis stellen van de
      binnen de betrokken kamer levende standpunten over de onderwerpen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel16a
  - number: '17'
    text: |-
      Het bestuur stelt bij reglement de hoofdlijnen vast van de inrichting van de organisatie van de Dienst, met
      inachtneming van het bepaalde krachtens [artikel 4, eerste en tweede lid, van de Kadasterwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel4
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '4'
  - number: '18.1'
    text: |-
      Het personeel van de Dienst, de leden van het bestuur daaronder begrepen, is ambtenaar in de zin van de
      [Ambtenarenwet][ref1], behoudens degenen met wie een arbeidsovereenkomst is gesloten naar burgerlijk recht.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '18.2'
    text: |-
      Voor zover deze onderwerpen niet reeds bij of krachtens de wet zijn geregeld, stelt het bestuur voor de ambtenaren,
      door of vanwege de Dienst aangesteld, bij reglement voorschriften vast betreffende:
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.a
    text: aanstelling, schorsing en ontslag;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.b
    text: het onderzoek naar de geschiktheid en de bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.c
    text: bezoldiging en wachtgeld;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.d
    text: diensttijden;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.e
    text: verlof en vakantie;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.f
    text: voorzieningen in verband met ziekte;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.g
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.h
    text: woon- verblijfs- en bereikbaarheidsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.i
    text: medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.j
    text: overige rechten en verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.k
    text: disciplinaire straffen;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.l
    text: |-
      de wijze waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt gevoerd
      over aangelegenheden van algemeen belang voor de rechtstoestand van het personeel;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: 18.2.m
    text: de behandeling van geschillen inzake de onderwerpen, genoemd in de onderdelen *i* en *l*.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
  - number: '18.3'
    text: |-
      De voorschriften, bedoeld in het tweede lid, onder *i*, voorzien in elk geval in de instelling van een
      medezeggenschapsorgaan dat de bevoegdheden uitoefent, daaraan in [artikel 11][ref1] toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel11
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '18.4'
    text: |-
      [Artikel 126, eerste tot en met derde lid, van de Ambtenarenwet][ref1] is van overeenkomstige toepassing, met dien
      verstande, dat voor Gedeputeerde Staten wordt gelezen: de raad van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel126
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '126'
  - number: '19'
    text: 'De baten van de Dienst bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel19
  - number: 19.a
    text: |-
      de opbrengsten uit het kadastraal recht, bedoeld in [artikel 108 van de Kadasterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel108
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '108'
  - number: 19.b
    text: de opbrengsten uit vergoedingen voor andere bij of krachtens de wet aan de Dienst opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel19
  - number: 19.c
    text: de opbrengsten uit andere werkzaamheden, uit deelnemingen en uit samenwerkingen met derden;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel19
  - number: 19.d
    text: andere baten, hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel19
  - number: '20.1'
    text: |-
      Het bestuur houdt zodanige aantekeningen omtrent de vermogenstoestand van de Dienst, dat daaruit te allen tijde
      zijn rechten en verplichtingen kunnen worden gekend.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het bestuur stelt bij reglement de werkwijze vast voor het financiële beheer en de administratieve organisatie van
      de Dienst.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel20
  - number: '20.3'
    text: Het boekjaar van de Dienst is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel20
  - number: '21'
    text: |-
      Het bestuur stelt tijdig voor afloop van een boekjaar een financiële begroting vast voor het volgende boekjaar. De
      begroting is in overeenstemming met het meerjarenbeleidsplan, bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel22
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '22.1'
    text: |-
      Tegelijk met de opstelling van de begroting stelt het bestuur een meerjarenbeleidsplan op. Het meerjarenbeleidsplan
      wordt vastgesteld door de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel22
  - number: '22.2'
    text: 'Het meerjarenbeleidsplan geeft voor de eerstvolgende vijf boekjaren in elk geval:'
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel22
  - number: 22.2.a
    text: |-
      een overzicht van de door de Dienst te verrichten werkzaamheden ter uitvoering van de aan de Dienst bij of
      krachtens de wet opgedragen taken en een raming van de daarmee gemoeide kosten en opbrengsten;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel22
  - number: 22.2.b
    text: |-
      een overzicht van de voorgenomen andere werkzaamheden van de Dienst, als bedoeld in [artikel 2, derde lid][ref1],
      en een raming van de daarmee gemoeide kosten en opbrengsten.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '2'
        hoofdstuk: '1'
  - number: '23.1'
    text: |-
      De raad van toezicht zendt de begroting waarmee hij heeft ingestemd en het door hem vastgestelde
      meerjarenbeleidsplan voor 1 oktober van het daaraan voorafgaande boekjaar toe aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel23
  - number: '23.2'
    text: |-
      Bij de toezending van de in het eerste lid genoemde stukken kan de raad van toezicht aan Onze
      Minister een beredeneerd voorstel doen tot wijziging van het kadastraal recht, bedoeld in
      [artikel 108 van de Kadasterwet][ref1]. Daarbij voegt de raad een verslag van het overleg dat ter zake is gevoerd
      met de gebruikersraad, bedoeld in [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0006463#Artikel16
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0006463
        artikel: '16'
        hoofdstuk: '3'
  - number: '24.1'
    text: |-
      Het meerjarenbeleidsplan behoeft de instemming van Onze Minister. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing, met
      dien verstande dat Onze Minister aan de instemming voorwaarden kan verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '24.2'
    text: |-
      Indien Onze Minister het voornemen heeft aan het meerjarenbeleidsplan geheel of gedeeltelijk instemming te
      onthouden, dan wel voorwaarden aan de instemming te verbinden, wordt de raad van toezicht daarvan in kennis
      gesteld en gedurende ten hoogste vier weken in de gelegenheid gesteld wijzigingen in het meerjarenbeleidsplan aan
      te brengen.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel24
  - number: '25.1'
    text: |-
      Jaarlijks stelt het bestuur een jaarrekening op. De jaarrekening omvat een balans en een
      winst- en verliesrekening met een toelichting. De [artikelen 362 tot en met 390][ref1] en
      [405 tot en met 414 van Boek 2 van het Burgerlijk Wetboek][ref2] zijn van overeenkomstige toepassing, met
      uitzondering van de daarin opgenomen bepalingen die betrekking hebben op het in aandelen verdeeld zijn van het
      kapitaal van een vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel362
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel405
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '362'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '405'
  - number: '25.2'
    text: |-
      Jaarlijks stelt het bestuur een jaarverslag vast. Het jaarverslag wordt vastgesteld met overeenkomstige toepassing
      van [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '391'
  - number: '26.1'
    text: |-
      Onze Minister verleent opdracht tot onderzoek van de jaarrekening aan een openbaar accountant, die hetzij
      registeraccountant is, hetzij Accountant-Administratieconsulent ten aanzien van wie bij de inschrijving in het
      in [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1] bedoelde register een
      aantekening is geplaatst als bedoeld in [artikel 36, derde lid, van die wet][ref2]. De opdracht kan worden verleend
      aan een organisatie waarin accountants die mogen worden aangewezen, samenwerken. De opdracht kan te allen tijde
      worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '26.2'
    text: |-
      [Artikel 393, derde tot en met zevende lid, van Boek 2 van het Burgerlijk Wetboek][ref1] zijn op het in te stellen
      onderzoek van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '26.3'
    text: De kosten van het onderzoek komen ten laste van de Dienst.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel26
  - number: '27'
    text: 'Het bestuur legt de jaarrekening en het jaarverslag over aan de raad van toezicht, vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel27
  - number: 27.a
    text: de verklaring van de accountant omtrent de getrouwheid van de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel27
  - number: 27.b
    text: |-
      een opgave van de gebeurtenissen na de balansdatum met belangrijke financiële gevolgen voor de Dienst, onder
      mededeling van de omvang van die gevolgen.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel27
  - number: '28.1'
    text: |-
      De jaarrekening wordt vastgesteld door de raad van toezicht. [Artikel 25, eerste lid, tweede en derde volzin][ref1],
      is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel25
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '25'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '28.2'
    text: De jaarrekening behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel28
  - number: '28.3'
    text: |-
      De raad van toezicht zendt de jaarrekening en het jaarverslag binnen vier maanden na afloop van het
      boekjaar toe aan Onze Minister, vergezeld van de verklaring van de accountant en van de opgave, bedoeld in
      [artikel 27, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel27
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '28.4'
    text: |-
      De jaarrekening is ondertekend door de leden van het bestuur en door de leden van de raad van toezicht. Indien van
      een of meer van deze leden de ondertekening ontbreekt, wordt daarvan onder opgave van reden melding gemaakt aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel28
  - number: '28.5'
    text: |-
      Onze Minister kan de termijn, genoemd in het derde lid, in bijzondere omstandigheden verlengen, doch ten hoogste
      met zes maanden.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel28
  - number: '29.1'
    text: |-
      Binnen acht dagen nadat de raad van toezicht in kennis is gesteld van de goedkeuring van de jaarrekening maakt het
      bestuur de jaarrekening, het jaarverslag en de stukken, bedoeld in [artikel 27][ref1], openbaar. De openbaarmaking
      geschiedt door terinzagelegging van de genoemde stukken ten kantore van het bestuur. Van de terinzagelegging wordt
      mededeling gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel27
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '29.2'
    text: |-
      Het bestuur ziet erop toe dat aan een ieder die daarom verzoekt, inzage wordt verleend in de in het eerste lid
      genoemde stukken, en een volledig of gedeeltelijk afschrift daarvan wordt verstrekt tegen ten hoogste de kostprijs
      van het maken van een zodanig afschrift.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel29
  - number: '30.1'
    text: |-
      Indien door de jaarrekening, door tussentijdse cijfers die de Dienst bekend heeft gemaakt of door het jaarverslag
      een misleidende voorstelling wordt gegeven van de toestand van de Dienst, zijn de bestuurders tegenover derden
      hoofdelijk aansprakelijk voor de schade, door dezen dientengevolge geleden. De bestuurder die bewijst dat dit aan
      hem niet te wijten is, is niet aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel30
  - number: '30.2'
    text: |-
      Indien door de jaarrekening een misleidende voorstelling wordt gegeven van de toestand van de Dienst, zijn de leden
      van de raad van toezicht naast de bestuurders tegenover derden hoofdelijk aansprakelijk voor de schade, door dezen
      dientengevolge geleden. Het lid dat bewijst dat zulks niet aan een tekortkoming zijnerzijds in het toezicht is te
      wijten, is niet aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel30
  - number: '31.1'
    text: |-
      Het bestuur en de raad van toezicht verstrekken Onze Minister desgevraagd alle gegevens waarover hij naar zijn
      oordeel moet beschikken met het oog op de uitoefening van zijn bevoegdheden krachtens deze wet of krachtens andere
      wetten, voor zover bij of krachtens die andere wetten taken zijn opgedragen aan de Dienst. Van door het bestuur aan
      Onze Minister verstrekte gegevens wordt door het bestuur mededeling gedaan aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel31
  - number: '31.2'
    text: |-
      Onze Minister kan bepalen dat het bestuur daarbij aangegeven gegevens als bedoeld in het eerste lid, aan hem
      verstrekt in de vorm van een periodieke rapportage.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel31
  - number: '31.3'
    text: |-
      Onze Minister kan de accountant, bedoeld in [artikel 26, eerste lid][ref1], opdracht verlenen daarbij aangegeven
      gegevens als bedoeld in het eerste lid, te onderzoeken. De kosten van het onderzoek komen ten laste van de Dienst.
      Het bestuur ziet erop toe dat aan de accountant de naar diens oordeel voor het onderzoek nodige toegang tot de
      lokaliteiten van de Dienst en inzage van boeken en bescheiden van de Dienst wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel26
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '26'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '32'
    text: |-
      Onze Minister zendt telkens na vijf jaar aan de Staten-Generaal een verslag over de doeltreffendheid en
      doelmatigheid van het functioneren van de Dienst.
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel32
  - number: '53'
    text: |-
      Tot het tijdstip waarop de reglementen, bedoeld in de [artikelen 17][ref1], [18][ref2] en [20, tweede lid][ref3],
      in werking treden, blijven de voorschriften van kracht die ter zake golden, onmiddellijk voorafgaand aan het
      tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006463#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0006463#Artikel20
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006463
        artikel: '18'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006463
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '54'
    text: |-
      Het bepaalde in de [artikelen 11, zevende lid, tweede zin][ref1], [84, vierde lid][ref2], en
      [117 van de Kadasterwet][ref3] en [30, eerste en tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref4],
      zoals die artikelen luidden vóór het tijdstip van het in werking treden van deze wet, blijft van toepassing met
      betrekking tot aansprakelijkheid en schadevergoeding ter zake van in die artikelen bedoelde feiten die zich hebben
      voorgedaan vóór dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel117
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel30
    url: https://wetten.overheid.nl/BWBR0006463/2004-01-01#Artikel54
