  - number: 2a
    text: |-
      1 Een visvergunning wordt verleend indien:

      a. het vissersvaartuig stond ingeschreven in het visserijregister of dient ter vervanging van een of meer
      vissersvaartuigen die stonden ingeschreven in het visserijregister;

      b. de oorspronkelijke registratie na 1 januari 2003 is doorgehaald op grond van
      [artikel 8, onderdeel a, van het Registratiebesluit][ref1];

      c. er minder dan zes jaar is verstreken vanaf het moment van doorhaling van die registratie;

      d. wordt voldaan aan [artikel 6, vierde lid, van het Registratiebesluit][ref2];

      e. het motorvermogen en de tonnage van dat vissersvaartuig niet meer bedraagt dan voor de doorhaling van de
      inschrijving;

      f. het vissersvaartuig behoort tot hetzelfde segment als voor het moment van doorhaling, respectievelijk behoort
      tot hetzelfde segment als het vissersvaartuig dat wordt vervangen, en

      g. wordt voldaan aan [artikel 4, tweede lid][ref3].

      2 In afwijking van het eerste lid wordt een visvergunning verleend voor een vissersvaartuig waarvan het
      motorvermogen of de tonnage is toegenomen, indien ten aanzien van het vissersvaartuig reeds een visvergunning
      was verleend wat betreft het oorspronkelijke motorvermogen of de oorspronkelijke tonnage, en de aanvrager van de
      visvergunning kan aantonen dat:

      a. de omvang van de toename van het motorvermogen of de tonnage, overeenkomt met het motorvermogen of de tonnage,
      of een deel daarvan, van een vissersvaartuig waarvan de registratie na 1 januari 2003 is doorgehaald op grond van
      [artikel 8, onderdeel a, van het Registratiebesluit][ref4] en er minder dan zes jaar is verstreken vanaf het moment
      van doorhaling van die registratie, en

      b. hij kan beschikken over de in het visserijregister als gevolg van de doorhaling van de registratie, bedoeld in
      onderdeel a, vrijgekomen capaciteit.

      3 In afwijking van het eerste lid wordt een visvergunning voor een vissersvaartuig verleend indien:

      a. het vaartuig wordt ingezet voor de kweek of de teelt van aquatische organismen op percelen, of

      b. met het vaartuig met de mosselkor op mosselpercelen wordt gevist en op basis van een vergunning als bedoeld in
      [artikel 36 van de Uitvoeringsregeling visserij][ref5] slechts incidenteel wordt gevist op mosselzaad buiten de
      percelen en het vaartuig niet is uitgerust voor het gebruik van andere vistuigen dan de mosselkor.

      4 In afwijking van het eerste tot en met derde lid kan de minister besluiten geen visvergunning te verlenen indien
      hij dit noodzakelijk acht voor de nakoming van de verplichtingen zoals opgenomen in artikel 12 van [verordening nr.
      2371/2002](32002R2371) en in [verordening nr. 1438/2003](32003R1438).


