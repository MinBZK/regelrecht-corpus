    text: |-
      Het is verboden de visserij uit te oefenen met een vissersvaartuig waarvan het motorvermogen of de tonnage groter
      is dan het motorvermogen of de tonnage dat staat vermeld op de ten behoeve van dat vissersvaartuig verleende
      visvergunning.
    url: https://wetten.overheid.nl/BWBR0016244/2011-01-01#Artikel5
  - number: '6'
    text: |-
      1 De visvergunning is niet geldig vanaf het tijdstip dat door de minister of een controleur wordt geconstateerd
      dat:

      a. het vermogen van de hoofdmotor of hoofdmotoren van het vissersvaartuig hoger is dan het op de visvergunning
      vermelde motorvermogen;

      b. er ten aanzien van de hoofdmotor of hoofdmotoren van het vissersvaartuig wijzigingen zijn opgetreden ten
      opzichte van het desbetreffende zegelplan of de in [artikel 4, eerste lid][ref1], bedoelde aanmelding, of

      c. de tonnage van het vissersvaartuig hoger is dan de op de visvergunning vermelde tonnage.

      2 Indien de minister of een controleur een constatering doet als bedoeld in het eerste lid, verstrekt hij aan de
      ondernemer of diens vertegenwoordiger terstond een schriftelijke verklaring hieromtrent. In deze verklaring wordt
      tenminste de desbetreffende constatering alsmede de datum en het tijdstip daarvan vermeld.

      3 De minister besluit de ongeldigheid van de visvergunning op te heffen, indien de ondernemer of diens gemachtigde
      hem bescheiden heeft doen toekomen waaruit te zijnen genoegen blijkt dat:

      a. indien het betreft de situatie, bedoeld in het eerste lid, aanhef en onderdelen a of b, het vermogen van
      de hoofdmotor of hoofdmotoren van dat vissersvaartuig het op de visvergunning vermelde motorvermogen niet
      overschrijdt, onderscheidenlijk er ten aanzien van de hoofdmotor of hoofdmotoren van dat vissersvaartuig geen
      afwijkingen zijn ten opzichte van het zegelplan of de in [artikel 4, eerste lid][ref2], bedoelde aanmelding;

      b. indien het betreft de situatie, bedoeld in het eerste lid, aanhef en onderdeel c, de tonnage van het
      vissersvaartuig de op de visvergunning vermelde tonnage niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0016244#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0016244#Artikel4
