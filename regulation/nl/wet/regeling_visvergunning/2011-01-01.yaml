    text: |-
      1 Het is verboden met een vissersvaartuig de visserij uit te oefenen op de in het tweede lid genoemde soorten,
      tenzij het vissersvaartuig behoort tot het segment MFL 1.

      2 De soorten, bedoeld in het eerste lid, zijn: haring, koolvis, makreel, schelvis, wijting, tong, schol, heek,
      kabeljauw, sprot, zeeduivel, horsmakreel, blauwe wijting en kever.
    url: https://wetten.overheid.nl/BWBR0016244/2011-01-01#Artikel8
