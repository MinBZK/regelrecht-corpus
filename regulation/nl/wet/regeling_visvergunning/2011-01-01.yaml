  - number: '7'
    text: |-
      1 De minister kan op verzoek van een ondernemer de tonnage van een vissersvaartuig verhogen als bedoeld in
      artikel 11, vijfde lid, van [verordening nr. 2371/2002](32002R2371), indien wordt voldaan aan de voorwaarden,
      bedoeld in artikel 8 van [verordening nr. 1438/2003](32003R1438), en de verbouwing van het vissersvaartuig heeft
      plaatsgevonden na 1 januari 2003 of zal plaatsvinden.

      2 Het verzoek tot verhoging van de tonnage wordt schriftelijk gedaan en wordt ingediend bij de directeur.

      3 Bij het verzoek, bedoeld in het tweede lid, worden gegevens overgelegd waaruit blijkt dat wordt voldaan aan
      artikel 8, onderdelen d, e en f, van [verordening nr. 1438/2003](32003R1438). In ieder geval worden de volgende
      documenten overgelegd:

      a. een beschrijving van de situatie voor en na de verbouwing;

      b. een bouwtekening waaruit het aantal ton blijkt waarmee de tonnage wordt verhoogd, en

      c. een offerte betreffende de verbouwingswerkzaamheden.

      4 Na ontvangst van het verzoek bericht de minister de verzoeker of het verzoek naar zijn voorlopig oordeel aan de
      voorwaarden voldoet en stelt de minister een termijn vast waarbinnen de verbouwing uiterlijk moet zijn voltooid.

      5 Uiterlijk binnen zes weken na afloop van de termijn, bedoeld in het vijfde lid, zendt de verzoeker de directeur
      een kopie van de meetbrief, bedoeld in [artikel 4 van de Meetbrievenwet 1981][ref1], die naar aanleiding van de
      verbouwing is afgegeven.

      6 Na ontvangst van de meetbrief, bedoeld in het vijfde lid, stelt de minister het aantal ton, waarmee de tonnage
      wordt verhoogd, vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel4
