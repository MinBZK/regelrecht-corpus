  - number: '4'
    text: |-
      1 Voor zover een vissersvaartuig is aangemeld bij divisie Scheepvaart van de Inspectie Verkeer en
      Waterstaat zoals vereist krachtens [artikel 20, tweede lid, van het Vissersvaartuigenbesluit][ref1] of
      [artikel 1.11 van het Vissersvaartuigenbesluit 2002][ref2] heeft de ondernemer van een vissersvaartuig of diens
      gemachtigde de desbetreffende aanmelding aan boord van het vissersvaartuig.

      2 Voor zover het motorvermogen van een vissersvaartuig meer dan 100 kW is, doet de ondernemer van een
      vissersvaartuig of diens gemachtigde na opmaak of wijziging van het zegelplan een afschrift hiervan toekomen aan de
      Algemene Inspectiedienst van het Ministerie van Economische Zaken, Landbouw en Innovatie in Kerkrade en heeft hij
      het zegelplan aan boord van het vissersvaartuig.

      3 De ondernemer van een vissersvaartuig of diens gemachtigde doet onverwijld doch in ieder geval vóór het
      tijdstip van aanlanding melding van wijzigingen die zich ten aanzien van de hoofdmotor of hoofdmotoren van
      het desbetreffende vaartuig hebben voorgedaan ten opzichte van de in het eerste lid bedoelde aanmelding of het
      bij dat vaartuig behorende zegelplan en die hem bekend waren of hem redelijkerwijs bekend hadden moeten zijn.
      Redelijkerwijs bekend worden in ieder geval geacht te zijn wijzigingen die kennelijk zijn opgetreden door menselijk
      toedoen.

      4 De melding, bedoeld in het derde lid, geschiedt op een wijze als omschreven in
      [artikel 3, vijfde lid, aanhef en onderdeel a, van de Regeling stelselmatige controle bij aanlanding 1988][ref3],
      aan de meldkamer van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit in
      Kerkrade.


