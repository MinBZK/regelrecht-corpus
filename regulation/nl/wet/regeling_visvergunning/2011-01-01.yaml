  - number: '2'
    text: |-
      1 Het is verboden zonder geldige visvergunning met een vissersvaartuig dan wel een vaartuig dat is geregistreerd
      in een andere lidstaat dan Nederland, de visserij uit te oefenen op de bestanden, bedoeld in artikel 3, onderdeel
      g, van [verordening nr. 2371/2002](32002R2371), tenzij het een vissersvaartuig betreft waarmee uitsluitend de
      visserij, bedoeld in [artikel 1, vierde lid, onderdeel d, van de Visserijwet 1963][ref1] wordt uitgeoefend.

      2 Een visvergunning wordt op aanvraag door de minister verleend overeenkomstig [artikel 2a][ref2].

      3 De aanvraag tot inschrijving van een vaartuig in het visserijregister, bedoeld
      in [artikel 6 van het Registratiebesluit][ref3], alsmede de mededeling, bedoeld in
      [artikel 7, tweede lid, van het Registratiebesluit][ref4] wordt in voorkomend geval als een aanvraag tot verlening
      van een visvergunning beschouwd.

      4 De ondernemer van een vissersvaartuig ten aanzien waarvan een visvergunning is verleend, of diens gemachtigde
      heeft de visvergunning aan boord van het vissersvaartuig aanwezig.


