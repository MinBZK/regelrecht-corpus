  - number: '3'
    text: |-
      1 De minister trekt de visvergunning in indien:

      a. het vissersvaartuig niet meer is geregistreerd in het visserijregister, of

      b. de visserijactiviteiten van een vissersvaartuig definitief worden beëindigd als bedoeld in artikel 23 van
      verordening (EG) nr. 1198/2006 van de Raad van 27 juli 2006 inzake het Europees Visserijfonds (PbEU L223) en
      ten aanzien van de beëindiging door de Minister of door de Commissie van de Europese Gemeenschappen subsidie is
      verleend.

      2 Een visvergunning wordt geschorst in de situatie, bedoeld in artikel 29, tweede lid, van Verordening (EG)
      nr. 1224/2009 van de Raad van de Europese Unie van 20 november 2009 tot vaststelling van een communautaire
      controleregeling die de naleving van de regels van het gemeenschappelijk visserijbeleid moet garanderen, tot
      wijziging van Verordeningen (EG) nr. 847/96, (EG) nr. 2371/2002, (EG) nr. 811/2004, (EG) nr. 768/2005, (EG) nr.
      2115/2005, (EG) nr. 2166/2005, (EG) nr. 388/2006, (EG) nr. 509/2007, (EG) nr. 676/2007, (EG) nr. 1098/2007, (EG)
      nr. 1300/2008, (EG) nr. 1342/2008 en tot intrekking van Verordeningen (EEG) nr. 2847/93, (EG) nr. 1627/94 en (EG)
      nr. 1966/2006 (PbEU L 343).

      3 De minister kan de visvergunning voor een bepaalde periode schorsen of intrekken indien naar het oordeel van
      de minister:

      a. met het vissersvaartuig de visserij kennelijk is uitgeoefend in strijd met [artikel 5][ref1] van deze regeling,
      met de [artikelen 2 tot en met 4][ref2] en [10 tot met 10b van de Regeling technische maatregelen 2000][ref3]
      of met de [artikelen 10][ref4], [18, onderdelen a en c][ref5], en
      [artikel 19, eerste, tweede en vierde lid, van de Regeling instandhoudingsmaatregelen zeevisserij][ref6];

      b. de ondernemer van een vissersvaartuig ten aanzien van wie een visvergunning is verleend, of diens gemachtigde,
      niet voldoet aan de voorschriften gesteld in de visvergunning.

      4 De periode bedoeld in het derde lid is niet korter dan 3 weken en niet langer dan 8 weken en wordt vastgesteld
      afhankelijk van de ernst en omvang van de overtreding.

      5 In afwijking van het vierde lid is de periode bedoeld in het derde lid niet korter dan 6 weken en niet langer
      dan 16 weken, indien binnen twee jaar na afloop van de schorsing of intrekking met het betrokken vissersvaartuig
      wederom hetzelfde artikel genoemd in onderdeel a van het derde lid wordt overtreden of de ondernemer of diens
      gemachtigde wederom niet voldoet aan de voorschriften gesteld in de visvergunning.

      6 Het is verboden de visserij uit te oefenen, vis te vangen, aan boord te hebben, over te laden op een ander
      vissersvaartuig of aan te landen met een vissersvaartuig waarvan de visvergunning is geschorst of ingetrokken.


