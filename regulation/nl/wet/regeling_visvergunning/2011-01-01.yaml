    text: |-
      1 Deze regeling verstaat onder:

      a. ondernemer: degene te wiens naam het vissersvaartuig in het visserijregister staat geregistreerd;

      b. minister: de Minister van Economische Zaken, Landbouw en Innovatie;

      c. directeur: Directeur Agroketens en Visserij van het Ministerie van Economische Zaken, Landbouw en Innovatie;

      d. [verordening nr. 2371/2002](32002R2371): [Verordening (EG) nr. 2371/2002](32002R2371) van de Raad van de
      Europese Unie van 20 december 2002 inzake de instandhouding en de duurzame exploitatie van de visbestanden in het
      kader van het gemeenschappelijk visserijbeleid (PbEG L 358);

      e. [verordening nr. 1438/2003](32003R1438): [Verordening (EG) nr. 1438/2003](32003R1438) van de Commissie
      van de Europese Gemeenschappen van 12 augustus 2003 tot vaststelling van bepalingen ter uitvoering van het
      gemeenschappelijk vlootbeleid als omschreven in hoofdstuk III van [Verordening (EG) nr. 2371/2003](32003R2371) van
      de Raad (PbEU L 204);

      f. motorvermogen: maximaal continue-vermogen zonder aftrek van door de motor aangedreven hulpmachines,
      uitgedrukt in kW dat de hoofdmotor of hoofdmotoren zonder overbelasting kan respectievelijk, kunnen leveren,
      en dat mechanisch, elektrisch, hydraulisch of anderszins kan worden aangewend voor de voortstuwing van het
      vaartuig, zoals is vastgesteld door de divisie Scheepvaart van de Inspectie Verkeer en Waterstaat ingevolge het
      [Vissersvaartuigenbesluit][ref1] of het [Vissersvaartuigenbesluit 2002][ref2], of in voorkomend geval blijkt uit
      een verklaring inzake het maximaal continue-vermogen, opgesteld door de fabrikant of de leverancier;

      g. *visvergunning:* vergunning als bedoeld in Verordening (EG) nr. 1281/2005 van de Commissie van de Europese
      Gemeenschappen van 3 augustus 2005 betreffende het beheer van de visvergunningen en de minimum informatie welke
      deze moet bevatten;

      h. Registratiebesluit: [Besluit registratie vissersvaartuigen 1998][ref3];

      i. visserijregister: register als bedoeld in [artikel 4 van het Registratiebesluit][ref4];

      j. zegelplan: door de fabrikant of leverancier van de hoofdmotor of hoofdmotoren van het vissersvaartuig dan wel
      door een meetbureau overeenkomstig door de minister beschikbaar gestelde modellen opgemaakt overzicht, bestaand uit
      een tekening en een geschrift, waaruit blijkt: welke onderdelen van de hoofdmotor of hoofdmotoren zijn verzegeld,
      waar de verzegelingen zijn aangebracht en welke kenmerken zij hebben, en waar en op welke wijze de stelbouten
      en breekbouten van de hoofdmotor of hoofdmotoren zijn geplaatst en ingesteld, en waarop door een meetbureau is
      verklaard dat de feitelijke toestand van de motor of hoofdmotoren overeenkomt met de in het overzicht opgenomen
      gegevens;

      k. *controleur:* persoon die belast is met controle in het kader van Verordening (EG) nr. 1224/2009 van de Raad
      van de Europese Unie van 20 november 2009 tot vaststelling van een communautaire controleregeling die de naleving
      van de regels van het gemeenschappelijk visserijbeleid moet garanderen, tot wijziging van Verordeningen (EG) nr.
      847/96, (EG) nr. 2371/2002, (EG) nr. 811/2004, (EG) nr. 768/2005, (EG) nr. 2115/2005, (EG) nr. 2166/2005, (EG) nr.
      388/2006, (EG) nr. 509/2007, (EG) nr. 676/2007, (EG) nr. 1098/2007, (EG) nr. 1300/2008, (EG) nr. 1342/2008 en tot
      intrekking van Verordeningen (EEG) nr. 2847/93, (EG) nr. 1627/94 en (EG) nr. 1966/2006 (PbEU L 343);

      l. segment: vlootsegment MFL1, MFL2 of AQU, waartoe het vissersvaartuig op grond van de vermelding op de
      visvergunning behoort;

      m. meetbureau: een instelling met deskundigheid op het gebied van meting van motorvermogens en afstelling van
      motoren en terzake geaccrediteerd.

      2 Voor de toepassing van deze regeling vindt het aanlanden van vis plaats op het tijdstip waarop het
      vissersvaartuig direct of indirect verbinding met de wal heeft gekregen.

      3 De zegels bestemd voor verzegeling van de hoofdmotor of hoofdmotoren als bedoeld in het eerste lid, onderdeel
      j, worden beschikbaar gesteld door de Algemene Inspectiedienst van het Ministerie van Economische Zaken, Landbouw
      en Innovatie.


