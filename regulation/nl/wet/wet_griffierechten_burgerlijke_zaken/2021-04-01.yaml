  - number: '12'
    text: |-
      1 Indien de vordering strekt tot betaling van een geldsom en de eiser zijn eis vermeerdert overeenkomstig
      [artikel 130 van het Wetboek van Burgerlijke Rechtsvordering][ref1], wordt het griffierecht verhoogd tot het
      griffierecht, dat partijen verschuldigd zouden zijn geweest, indien de vermeerderde eis was opgenomen in de
      procesinleiding.

      2 Indien het verzoek strekt tot betaling van een geldsom en de verzoeker zijn verzoek vermeerdert overeenkomstig
      [artikel 283 van het Wetboek van Burgerlijke Rechtsvordering][ref2], is het eerste lid van overeenkomstige
      toepassing.

      3 Bij heffing van het verhoogde griffierecht op de voet van het eerste of tweede lid wordt uitgegaan van de
      tarieven die gelden op het tijdstip waarop de eis of het verzoek wordt vermeerderd.

      4 Partijen zijn het verhoogde griffierecht verschuldigd vanaf het tijdstip van de vermeerdering van de eis of het
      verzoek en zorgen dat het griffierecht binnen vier weken nadien is bijgeschreven op de rekening van het gerecht
      waar de zaak dient dan wel ter griffie is gestort. Indien de rechter de vermeerdering van de eis of het verzoek
      echter buiten beschouwing laat, blijft de heffing beperkt tot het oorspronkelijk geheven bedrag en wordt het
      eventueel te veel betaalde griffierecht door de griffier teruggestort.

      5 Het griffierecht wordt niet verhoogd, indien op het tijdstip waarop de eis dan wel het verzoek wordt vermeerderd
      een van de stukken, bedoeld in [artikel 16, eerste lid, onder a of b][ref3], is overlegd.

