  - number: '10'
    text: |-
      1 De hoogte van het griffierecht wordt bepaald aan de hand van de vordering dan wel het verzoek in de
      procesinleiding.

      2 In zaken waarin een vordering tot onteigening wordt gedaan wordt de hoogte van het griffierecht bepaald aan de
      hand van de som die in de dagvaarding als schadeloosstelling wordt aangeboden. In cassatie wordt het griffierecht
      geheven ter hoogte van de vordering van onbepaalde waarde op basis van de tabel die als bijlage bij deze wet is
      gevoegd.

      1 De hoogte van het griffierecht wordt bepaald aan de hand van de vordering in de dagvaarding dan wel het verzoek
      in het verzoekschrift of het beroepschrift.

      2 In zaken waarin een vordering tot onteigening wordt gedaan wordt de hoogte van het griffierecht bepaald aan de
      hand van de som die in de dagvaarding als schadeloosstelling wordt aangeboden. In cassatie wordt het griffierecht
      geheven ter hoogte van de vordering van onbepaalde waarde op basis van de tabel die als bijlage bij deze wet is
      gevoegd.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel10
  - number: '11'
    text: |-
      1 Op het griffierecht wordt in mindering gebracht het griffierecht dat reeds is voldaan in de zaak waarop de
      procesinleiding betrekking heeft.

      2 Indien in een zaak waarbij een vordering is ingesteld, de eiser de procesinleiding intrekt voordat de verweerder
      in de procedure is verschenen of uiterlijk in de procedure had kunnen verschijnen, wordt van de eiser een derde
      deel van het ingevolge [artikel 3][ref1] verschuldigde griffierecht geheven met een maximum van € 81 voor
      onvermogenden, € 270 voor natuurlijke personen en € 539 voor rechtspersonen. Indien de eiser het griffierecht reeds
      heeft voldaan, stort de griffier het te veel betaalde griffierecht aan de eiser terug.

      3

      4 De eiser bericht de griffie schriftelijk dat hij de vordering intrekt.

      Op het griffierecht wordt in mindering gebracht het griffierecht dat reeds is voldaan in de zaak waarop het geding
      of verzoekschrift betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028899#Artikel3
