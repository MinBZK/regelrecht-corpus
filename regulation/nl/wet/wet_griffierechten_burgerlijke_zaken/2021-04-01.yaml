  - number: 9a.1
    text: |-
      Indien een verweerder of belanghebbende betwist dat de zaak moet worden behandeld door de
      internationale handelskamer van de rechtbank Amsterdam of van het gerechtshof Amsterdam als bedoeld in
      [artikel 30r, eerste lid, eerste volzin, van het Wetboek van Burgerlijke Rechtsvordering][ref1], is de verweerder
      of belanghebbende het griffierecht verschuldigd dat bij de rechtbank, respectievelijk het gerechtshof, wordt
      geheven voor andere zaken dan kantonzaken, niet zijnde zaken als bedoeld in artikel 30r, eerste lid, eerste volzin,
      van het Wetboek van Burgerlijke Rechtsvordering. Indien de rechter het incidentele verweer afwijst, wordt alsnog
      het griffierecht verhoogd voor zover uit de tabel die als bijlage bij deze wet is gevoegd volgt dat een hoger
      bedrag aan griffierecht dient te worden geheven, met dien verstande dat het eerder geheven griffierecht hierop in
      mindering wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel30r
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 30r
  - number: 9a.2
    text: |-
      Indien een zaak door de internationale handelskamer van de rechtbank Amsterdam of van het gerechtshof Amsterdam
      wordt verwezen naar een andere rechter om verder te worden behandeld en beslist, wordt het griffierecht verminderd
      voor zover uit de tabel die als bijlage bij deze wet is gevoegd, volgt dat een lager bedrag aan griffierecht dient
      te worden geheven. Het te veel betaalde griffierecht wordt door de griffier teruggestort.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel9a
  - number: 9a.3
    text: |-
      Indien een zaak door een andere kamer van de rechtbank Amsterdam of van het gerechtshof Amsterdam wordt verwezen
      naar de internationale handelskamer van die rechtbank of van dat gerechtshof om verder te worden behandeld en
      beslist, wordt het griffierecht verhoogd voor zover uit de tabel die als bijlage bij deze wet is gevoegd, volgt dat
      een hoger bedrag aan griffierecht dient te worden geheven, met dien verstande dat het eerder geheven griffierecht
      hierop in mindering wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel9a
  - number: 9a.4
    text: |-
      De verweerder of belanghebbende is het ingevolge het eerste lid, tweede volzin, en het derde lid te heffen
      griffierecht verschuldigd vanaf het moment dat het incidentele verweer is afgewezen of de beslissing tot verwijzing
      is gegeven, en zorgt dat het griffierecht binnen vier weken nadien is bijgeschreven op de rekening van het gerecht
      waar de zaak dient, dan wel ter griffie is gestort.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel9a
  - number: 9a.5
    text: |-
      Het eerste, tweede en vierde lid zijn van overeenkomstige toepassing op het griffierecht bij de
      voorzieningenrechter, bedoeld in [artikel 30r, derde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel30r
