preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet tarieven in burgerlijke zaken te vervangen door
    een nieuwe regeling en dat in verband hiermee ook enkele andere wetten dienen te worden gewijzigd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goed gevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Veiligheid en Justitie; b. *Hoge Raad:* de Hoge Raad
      der Nederlanden; c. *zaken waarbij een vordering wordt ingesteld:* zaken als bedoeld in
      [artikel 78 van het Wetboek van Burgerlijke Rechtsvordering][ref1]; d. *zaken waarbij een verzoek wordt ingediend:*
      zaken als bedoeld in [artikel 261 van het Wetboek van Burgerlijke Rechtsvordering][ref2].

      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Veiligheid en Justitie; b. *Hoge Raad:* de Hoge
      Raad der Nederlanden; c. *zaken die bij dagvaarding worden ingeleid:* zaken als bedoeld in
      [artikel 78 van het Wetboek van Burgerlijke Rechtsvordering][ref3]; d. *zaken waarbij een verzoek wordt ingediend:*
      zaken als bedoeld in [artikel 261 van het Wetboek van Burgerlijke Rechtsvordering][ref4].


