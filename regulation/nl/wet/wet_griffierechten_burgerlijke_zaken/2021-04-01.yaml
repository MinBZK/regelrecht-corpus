  - number: '2'
    text: |-
      De bedragen die genoemd zijn in deze wet en in de tabel die als bijlage bij deze wet is gevoegd, kunnen jaarlijks
      met ingang van 1 januari bij regeling van Onze Minister worden gewijzigd, voor zover de consumentenprijsindex
      daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel2
  - number: '3'
    text: |-
      1 In zaken waarbij een vordering wordt ingesteld, wordt van elke eiser en elke verschenen verweerder voor iedere
      instantie een griffierecht geheven, voor zover bij of krachtens deze wet of een andere wet niet anders is bepaald.

      2 In zaken waarbij een verzoek wordt ingediend, wordt voor de indiening van een verzoek of een verweerschrift een
      griffierecht geheven, voor zover bij of krachtens deze wet of een andere wet niet anders is bepaald.

      3 De eiser is het griffierecht verschuldigd vanaf de indiening van de procesinleiding, en in
      geval van een kort geding vanaf de indiening van de procesinleiding bij de aanvraag als bedoeld in
      [artikel 254, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1], en zorgt dat het griffierecht
      binnen vier weken nadien is bijgeschreven op de rekening van het gerecht waar de zaak dient dan wel ter griffie
      is gestort. De verweerder is het griffierecht verschuldigd vanaf zijn verschijning in het geding en zorgt dat het
      griffierecht binnen vier weken nadien is bijgeschreven op de rekening van het gerecht waar de zaak dient dan wel
      ter griffie is gestort.

      4 De verzoeker en de belanghebbende zijn het griffierecht verschuldigd vanaf de indiening van de procesinleiding
      respectievelijk het verweerschrift en zorgen dat het griffierecht binnen vier weken nadien is bijgeschreven op de
      rekening van het gerecht waar de behandeling plaatsvindt dan wel ter griffie is gestort.

      5 De hoogte van het griffierecht wordt bepaald aan de hand van de tabel die als bijlage bij deze wet is gevoegd.

      1 In zaken die bij dagvaarding worden ingeleid, wordt op de eerste roldatum, dan wel in zaken als bedoeld in
      [artikel 254 van het Wetboek van Burgerlijke Rechtsvordering][ref2] op de eerste terechtzitting, van elke eiser en
      elke verschenen gedaagde voor iedere instantie een griffierecht geheven, voor zover bij of krachtens deze wet of
      een andere wet niet anders is bepaald.

      2 Voor de indiening van een verzoekschrift of een verweerschrift wordt een griffierecht geheven, voor zover bij of
      krachtens deze wet of een andere wet niet anders is bepaald.

      3 De eiser is het griffierecht verschuldigd vanaf de eerste uitroeping van de zaak ter terechtzitting of bij
      gebreke daarvan vanaf de eerste roldatum en zorgt dat het griffierecht binnen vier weken nadien is bijgeschreven
      op de rekening van het gerecht waar de zaak dient dan wel ter griffie is gestort. De gedaagde is het griffierecht
      verschuldigd vanaf zijn verschijning in het geding en zorgt dat het griffierecht binnen vier weken nadien is
      bijgeschreven op de rekening van het gerecht waar de zaak dient dan wel ter griffie is gestort.

      4 De verzoeker en de belanghebbende zijn het griffierecht verschuldigd vanaf de indiening van het verzoekschrift
      respectievelijk het verweerschrift en zorgen dat het griffierecht binnen vier weken nadien is bijgeschreven op de
      rekening van het gerecht waar de behandeling plaatsvindt dan wel ter griffie is gestort.

      5 De hoogte van het griffierecht wordt bepaald aan de hand van de tabel die als bijlage bij deze wet is gevoegd.


