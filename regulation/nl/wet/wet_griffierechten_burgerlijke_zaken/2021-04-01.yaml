        bwb_id: BWBR0005289
        artikel: '97'
  - number: '15'
    text: |-
      1 Van eisers, verzoekers, verweerders en belanghebbenden die bij dezelfde advocaat of gemachtigde verschijnen en
      gelijkluidende procesinleidingen indienen of gelijkluidend verweer voeren, wordt slechts eenmaal een gezamenlijk
      griffierecht geheven.

      2 Behoren tot degenen bedoeld in het eerste lid, zowel natuurlijke personen als niet-natuurlijke personen, dan,
      wordt het griffierecht geheven dat niet-natuurlijke personen verschuldigd zijn. Behoren tot degenen bedoeld in
      het eerste lid, zowel onvermogenden als anderen, dan wordt het griffierecht geheven dat deze laatsten verschuldigd
      zijn.

      1 Van partijen die bij dezelfde advocaat of gemachtigde verschijnen en gelijkluidende conclusies nemen of
      gelijkluidend verweer voeren, wordt slechts eenmaal een gezamenlijk griffierecht geheven. Hetzelfde geldt
      voor verzoekers en belanghebbenden die bij dezelfde advocaat of gemachtigde verschijnen en gelijkluidende
      verzoekschriften of verweerschriften indienen.

      2 Indien tot partijen of tot verzoekers of belanghebbenden als bedoeld in het eerste lid, zowel natuurlijke
      personen als niet-natuurlijke personen behoren, wordt het griffierecht geheven dat niet-natuurlijke personen
      verschuldigd zijn. Behoren tot degenen bedoeld in het eerste lid, zowel onvermogenden als anderen, dan wordt het
      griffierecht geheven dat deze laatsten verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel15
  - number: '16.1'
    text: |-
      De griffier heft het griffierecht voor onvermogenden dat is opgenomen in de tabel die als bijlage bij deze wet is
      gevoegd, indien op het tijdstip waarop het griffierecht wordt geheven, is overgelegd:
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel16
  - number: 16.1.a
    text: |-
      een afschrift van het besluit tot toevoeging, bedoeld in [artikel 29 van de Wet op de rechtsbijstand][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel29
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '29'
  - number: 16.1.b
    text: |-
      een verklaring van het bestuur van de raad voor rechtsbijstand als bedoeld in
      [artikel 7, derde lid, onderdeel e, van de Wet op de rechtsbijstand][ref1] waaruit blijkt dat het
      inkomen niet meer bedraagt dan de inkomens, bedoeld in de algemene maatregel van bestuur krachtens
      [artikel 35, tweede lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '35'
  - number: '16.2'
    text: |-
      Kan een partij op het tijdstip waarop het griffierecht wordt geheven nog geen afschrift
      van het besluit tot toevoeging overleggen ten gevolge van omstandigheden die redelijkerwijs
      niet aan haar zijn toe te rekenen, maar heeft zij wel een aanvraag als bedoeld in
      [artikel 24, tweede lid, van de Wet op de Rechtsbijstand ][ref1]ingediend, dan heft de griffier het griffierecht
      voor onvermogenden, indien de desbetreffende partij een afschrift van die aanvraag overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel24
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '24'
  - number: '16.3'
    text: |-
      Heeft de griffier op basis van het eerste of tweede lid het griffierecht voor onvermogenden geheven
      en wordt de toevoeging nadien ingetrokken dan wel geweigerd op basis van [artikel 28][ref1] of
      [artikel 33 van de Wet op de rechtsbijstand][ref2], dan wordt het griffierecht verhoogd tot het griffierecht
      dat de desbetreffende partij verschuldigd is op basis van de tabel die als bijlage bij deze wet is gevoegd. De
      partij, bedoeld in het eerste en tweede lid, is het verhoogde griffierecht verschuldigd vanaf het moment waarop de
      toevoeging is ingetrokken dan wel geweigerd en zorgt dat het griffierecht binnen vier weken nadien is bijgeschreven
      op de rekening van het gerecht waar de zaak dient dan wel ter griffie is gestort.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel33
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '33'
  - number: '16.4'
    text: |-
      Kan een partij op het tijdstip waarop het griffierecht wordt geheven geen stukken als bedoeld in het eerste en
      tweede lid overleggen ten gevolge van omstandigheden die redelijkerwijs niet aan haar zijn toe te rekenen, maar
      kan zij voordat de rechter het eindvonnis heeft gewezen dan wel de eindbeschikking heeft gegeven alsnog een van
      de stukken, bedoeld in het eerste lid, overleggen, dan wordt het griffierecht verlaagd tot het griffierecht voor
      onvermogenden dat is opgenomen in de tabel die als bijlage bij deze wet is gevoegd, en wordt het te veel betaalde
      griffierecht door de griffier teruggestort.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel16
  - number: '17.1'
    text: |-
      In elk faillissement betaalt de curator uit de baten van de boedel bij het deponeren van de eerste uitdelingslijst
      of zodra de uitspraak tot homologatie van een akkoord in kracht van gewijsde is gegaan, een griffierecht van € 657.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel17
  - number: '17.2'
    text: |-
      Onder het griffierecht, bedoeld in het eerste lid, is niet begrepen het griffierecht dat ingevolge
      [artikel 3, eerste lid][ref1], wordt geheven voor verificatiegeschillen. Partijen zijn dit griffierecht
      verschuldigd vanaf hun verschijning op de bepaalde zitting en zorgen dat het griffierecht binnen vier weken nadien
      is bijgeschreven op de rekening van het gerecht waar de zaak dient dan wel ter griffie is gestort.


      [ref1]: https://wetten.overheid.nl/BWBR0028899#Artikel3
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028899
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '17.3'
    text: |-
      Van de niet-geverifieerde schuldeiser die ingevolge [artikel 349aa van de Faillissementswet][ref1] verzet doet
      tegen de uitdelingslijst, wordt overeenkomstig [artikel 3, tweede lid][ref2], griffierecht geheven, met dien
      verstande dat indien tevens door wel geverifieerde schuldeisers verzet wordt gedaan tegen de uitdelingslijst, geen
      griffierecht wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel349aa
      [ref2]: https://wetten.overheid.nl/BWBR0028899#Artikel3
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 349aa
      - id: ref2
        bwb_id: BWBR0028899
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '17.4'
    text: |-
      Het eerste tot en met het derde lid zijn van overeenkomstige toepassing bij toepassing van de
      schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel17
  - number: '18.1'
    text: |-
      [Artikel 17][ref1] is van overeenkomstige toepassing in geval van een op de voet van
      [artikel 60b, eerste lid, van de Faillissementswet][ref2] aan de curator gegeven opdracht om het beheer van de
      onder bewind staande goederen over te nemen en voor de vereffening zorg te dragen, gegeven door de rechtbank op
      verzoek van een schuldeiser die op de goederen verhaal heeft, maar niet in het faillissement kan opkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028899#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel60b
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028899
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: 60b
  - number: '18.2'
    text: |-
      [Artikel 17, eerste tot en met derde lid][ref1], is van overeenkomstige toepassing in geval van benoeming door de
      rechter van een of meer vereffenaars van een ontbonden rechtspersoon, van een gemeenschap of van een nalatenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0028899#Artikel17
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028899
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '19.1'
    text: |-
      Voor de opening van een gerechtelijke rangregeling buiten faillissement en de benoeming van een rechter-commissaris
      als bedoeld in de [artikelen 481, eerste lid][ref1], [552, eerste lid][ref2], [584f, tweede lid][ref3] en
      [776 van het Wetboek van Burgerlijke Rechtsvordering][ref4] wordt van de verzoeker een griffierecht geheven van
      € 392. De [artikelen 3, vierde lid][ref5], en [16][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel481
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel552
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel584f
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel776
      [ref5]: https://wetten.overheid.nl/BWBR0028899#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0028899#Artikel16
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '481'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '552'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 584f
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '776'
      - id: ref5
        bwb_id: BWBR0028899
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0028899
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '19.2'
    text: |-
      In het geval van verwijzing ingevolge tegenspraak wordt griffierecht geheven overeenkomstig
      [artikel 3, eerste lid][ref1]. Partijen zijn het griffierecht verschuldigd vanaf hun verschijning op de bepaalde
      zitting en zorgen dat het griffierecht binnen vier weken nadien is bijgeschreven op de rekening van het gerecht
      waar de zaak dient dan wel ter griffie is gestort.


      [ref1]: https://wetten.overheid.nl/BWBR0028899#Artikel3
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028899
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 19a.1
    text: |-
      Voor de indiening van verzoeken als bedoeld in de [artikelen 42a][ref1], [371, eerste lid][ref2],
      [376, eerste lid][ref3], [377, derde lid][ref4], [378, eerste lid][ref5], [379, eerste lid][ref6], en
      [383, zevende lid, van de Faillissementswet][ref7] wordt van de verzoeker het griffierecht geheven bij de rechtbank
      voor andere zaken dan kantonzaken met betrekking tot een vordering van onbepaalde waarde op basis van de tabel die
      als bijlage bij deze wet is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel42a
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel371
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel376
      [ref4]: https://wetten.overheid.nl/BWBR0001860#Artikel377
      [ref5]: https://wetten.overheid.nl/BWBR0001860#Artikel378
      [ref6]: https://wetten.overheid.nl/BWBR0001860#Artikel379
      [ref7]: https://wetten.overheid.nl/BWBR0001860#Artikel383
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 42a
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '371'
      - id: ref3
        bwb_id: BWBR0001860
        artikel: '376'
      - id: ref4
        bwb_id: BWBR0001860
        artikel: '377'
      - id: ref5
        bwb_id: BWBR0001860
        artikel: '378'
      - id: ref6
        bwb_id: BWBR0001860
        artikel: '379'
      - id: ref7
        bwb_id: BWBR0001860
        artikel: '383'
  - number: 19a.2
    text: |-
      Voor de indiening van een verzoek tot homologatie van een akkoord als bedoeld in
      [artikel 383, eerste lid, van de Faillissementswet][ref1] wordt van de verzoeker het griffierecht geheven bij de
      rechtbank voor andere zaken dan kantonzaken met betrekking tot een vordering, dan wel een verzoek met een beloop
      van meer dan € 100.000 op basis van de tabel die als bijlage bij deze wet is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel383
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '383'
  - number: 19a.3
    text: |-
      Voor de indiening van een verzoek tot afwijzing van het verzoek tot homologatie van het akkoord als bedoeld
      in [artikel 383, achtste lid, van de Faillissementswet][ref1] wordt van een stemgerechtigde schuldeiser of
      aandeelhouder het griffierecht geheven bij de rechtbank voor andere zaken dan kantonzaken op basis van de tabel die
      als bijlage bij deze wet is gevoegd. De hoogte van het griffierecht wordt bepaald aan de hand van het bedrag van
      hun vordering of het nominale bedrag van hun aandeel.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel383
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '383'
  - number: 19a.4
    text: |-
      Bij de toepassing van het eerste en het tweede lid geldt, dat als het verzoek wordt gedaan door een
      herstructureringsdeskundige, het griffierecht wordt geheven van de schuldenaar.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel19a
  - number: '20.1'
    text: |-
      Aan elke partij wordt, ongeacht of van haar ingevolge deze wet of een andere wet griffierecht is geheven, kosteloos
      verstrekt:
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel20
  - number: 20.1.a
    text: een grosse of afschrift van alle vonnissen, arresten en beschikkingen;
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel20
  - number: 20.1.b
    text: |-
      verdere grossen, afschriften van vonnissen, arresten en beschikkingen voor zover deze nodig mochten zijn voor de
      tenuitvoerlegging, voor het aanwenden van rechtsmiddelen of krachtens wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel20
  - number: 20.1.c
    text: één afschrift van alle akten en processen-verbaal die met betrekking tot de behandeling ter zitting zijn opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel20
  - number: '20.2'
    text: |-
      Geen griffierecht wordt in rekening gebracht voor beslissingen, akten en processen-verbaal, die een rechtstreeks
      uitvloeisel zijn van vonnissen, arresten of beschikkingen, met inbegrip van grossen of afschriften op de voet van
      het vorige lid.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel20
  - number: '20.3'
    text: Onze Minister kan nadere regelen stellen omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel20
  - number: '21'
    text: |-
      1 Onverminderd de overige artikelen van deze wet worden aan partijen en aan belanghebbenden afschriften van
      of uittreksels uit vonnissen, arresten, beschikkingen, akten, processen-verbaal, registers of andere stukken
      kosteloos afgegeven, indien en voor zover zij daarbij belang hebben en niet in staat zijn op andere wijze in de
      behoefte te voorzien. Bij weigering van de griffier kunnen partijen een verzoek tot afgifte van een afschrift of
      uittrekstel indienen bij de voorzieningenrechter of in kantonzaken, de kantonrechter. Hiervoor is geen griffierecht
      verschuldigd. Tegen de beslissing op het verzoek, bedoeld in de tweede volzin, is geen hogere voorziening
      toegelaten.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de griffierechten,
      verschuldigd voor de verstrekking van afschriften van en uittreksels uit vonnissen, arresten en beschikkingen
      anders dan in de gevallen, bedoeld in het eerste lid.

      3

      4 Voor de uitgifte van afschriften en uittreksels uit de registers van de burgerlijke stand met bijlagen worden de
      bedragen berekend, bedoeld bij de [Wet rechten burgerlijke stand][ref1].

      1 Onverminderd de overige artikelen van deze wet worden aan partijen en aan belanghebbenden afschriften van
      of uittreksels uit vonnissen, arresten, beschikkingen, akten, processen-verbaal, registers of andere stukken
      kosteloos afgegeven, indien en voor zover zij daarbij belang hebben en niet in staat zijn op andere wijze in de
      behoefte te voorzien. Bij weigering van de griffier kunnen partijen een verzoek tot afgifte van een afschrift of
      uittrekstel indienen bij de voorzieningenrechter of in kantonzaken, de kantonrechter. Hiervoor is geen griffierecht
      verschuldigd. Tegen de beslissing op het verzoek, bedoeld in de tweede volzin, is geen hogere voorziening
      toegelaten.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de griffierechten,
      verschuldigd voor de verstrekking van afschriften van en uittreksels uit vonnissen, arresten en beschikkingen
      anders dan in de gevallen, bedoeld in het eerste lid.

      3 Voor de geregelde verstrekking van niet-getekende afschriften van of uittreksels uit de rol aan advocaten of
      gemachtigden wordt een griffierecht geheven van € 21 per maand.

      4 Voor de uitgifte van afschriften en uittreksels uit de registers van de burgerlijke stand met bijlagen worden de
      bedragen berekend, bedoeld bij de [Wet rechten burgerlijke stand][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001851
      [ref2]: https://wetten.overheid.nl/BWBR0001851
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001851
      - id: ref2
        bwb_id: BWBR0001851
  - number: '22.1'
    text: |-
      Voor elke akte, proces-verbaal, beschikking of een andere beslissing, gedaan, gegeven of opgemaakt door een rechter
      of een griffier anders dan in de gevallen waarvoor in de voorgaande artikelen het griffierecht geregeld is, wordt
      een griffierecht geheven van € 132.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel22
  - number: '22.2'
    text: |-
      Voor de noodzakelijke afschriften van akten, processen-verbaal of andere beslissingen wordt geen griffierecht
      geheven.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel22
  - number: '22.3'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ter uitvoering van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel22
  - number: '23.1'
    text: |-
      Voor de inschrijving van de huwelijkse voorwaarden of van de voorwaarden van een geregistreerd partnerschap in het
      openbaar huwelijksgoederenregister, bedoeld in [artikel 116 van Boek 1 van het Burgerlijk Wetboek][ref1], wordt van
      degene die inschrijving verzoekt een griffierecht geheven van € 199.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
  - number: '23.2'
    text: |-
      Voor de legalisatie van handtekeningen wordt voor iedere handtekening een griffierecht geheven van € 21, met dien
      verstande dat meerdere handtekeningen van dezelfde persoon op hetzelfde stuk als één handtekening worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel23
  - number: '23.3'
    text: |-
      Voor zover niet anders is bepaald in [artikel 24][ref1] wordt voor de afgifte van apostilles als bedoeld in
      artikel 3, eerste lid, van het op 5 oktober 1961 te ’s-Gravenhage tot stand gekomen Verdrag tot afschaffing van het
      vereiste van legalisatie van buitenlandse openbare akten, een griffierecht geheven van € 21 voor iedere apostille.


      [ref1]: https://wetten.overheid.nl/BWBR0028899#Artikel24
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028899
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '24'
    text: |-
      Geen griffierecht wordt geheven van openbare colleges en van ambtenaren van openbare lichamen voor de afgifte van
      afschriften of uittreksels van stukken, of de legalisaties van handtekeningen dan wel afgifte van apostilles als
      bedoeld in [artikel 23, derde lid][ref1], voor zover zij deze stukken behoeven voor de waarneming van de dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0028899#Artikel23
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028899
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '25.1'
    text: Geen griffierecht wordt geheven voor beëdigingen die ingevolge wettelijk voorschrift plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel25
  - number: '25.2'
    text: Voor de afgifte van afschriften van de akte van beëdiging wordt eveneens geen griffierecht geheven.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel25
  - number: '26'
    text: |-
      Bij algemene maatregel van bestuur kunnen de bedragen worden vastgesteld, welke wegens werkzaamheden, tijdverzuim
      en daarmede verband houdende noodzakelijke kosten, en wegens reis- en verblijfkosten toekomen aan:
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel26
  - number: 26.a
    text: |-
      houders of bewaarders van stukken, die opgeroepen worden om stukken, welke onder hun berusting of bewaring zijn,
      voor de rechter te brengen;
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel26
  - number: 26.b
    text: deskundigen, en
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel26
  - number: 26.c
    text: getuigen.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel26
  - number: '27'
    text: |-
      Verschotten voor advertenties, exploten en oproepingen anders dan per post die door de griffier vooruitbetaald
      zijn, worden door belanghebbenden terugbetaald.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel27
  - number: '28'
    text: |-
      Voor de voldoening van het griffierecht en de verschotten zijn medeaansprakelijk de advocaten of gemachtigden van
      de desbetreffende partijen of van de desbetreffende belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel28
  - number: '29.1'
    text: |-
      Degene die de griffierechten en verschotten heeft betaald, kan gedurende een maand na die betaling tegen de
      beslissing van de griffier tot heffing van het griffierecht of de verschotten door indiening van een verzoek in
      verzet komen bij het gerecht waaraan het griffierecht of de verschotten werden betaald.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel29
  - number: '29.2'
    text: Tegen de beslissing van het gerecht is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel29
  - number: '29.3'
    text: Voor de indiening van het verzoek, bedoeld in het eerste lid, wordt geen griffierecht geheven.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel29
  - number: '30.1'
    text: |-
      Bij gebreke van betaling geschiedt de invordering van de griffierechten en de door de griffier vooruitbetaalde
      verschotten krachtens een door de griffier uit te vaardigen dwangbevel.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel30
  - number: '30.2'
    text: |-
      Het dwangbevel wordt uitvoerbaar verklaard indien het een enkelvoudige kamer betreft, door de rechter in die
      kamer dan wel, indien het een meervoudige kamer betreft, door de voorzitter van die kamer van het betrokken
      gerecht. Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] kan worden tenuitvoergelegd, indien tenminste een maand na de
      betekening is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '30.3'
    text: |-
      Gedurende een maand na de betekening van het dwangbevel kan de schuldenaar bij het betrokken gerecht, rechtdoende
      in burgerlijke zaken, daartegen door indiening van een verzoek in verzet komen.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel30
  - number: '30.4'
    text: Tegen de beslissing van het gerecht is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel30
  - number: '30.5'
    text: Voor de indiening van het verzoek, bedoeld in het derde lid, wordt geen griffierecht geheven.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel30
  - number: '31.1'
    text: |-
      De [artikelen 1 tot en met 26][ref1], [57][ref2] en [58 van de Wet tarieven in burgerlijke zaken][ref3] komen te
      vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001852#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0001852#Artikel58
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001852
        artikel: '57'
      - id: ref3
        bwb_id: BWBR0001852
        artikel: '58'
  - number: '31.2'
    text: |-
      De [Wet van 1 juli 1999][ref1] (Stb. 1999, 285) tot verruiming van de mogelijkheid om het griffierecht in
      burgerlijke zaken gedeeltelijk in debet te doen stellen wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010574
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0010574
  - number: '57'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen dan wel subonderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel57
  - number: '58'
    text: 'Deze wet wordt aangehaald als: Wet griffierechten burgerlijke zaken.'
    url: https://wetten.overheid.nl/BWBR0028899/2021-04-01#Artikel58
