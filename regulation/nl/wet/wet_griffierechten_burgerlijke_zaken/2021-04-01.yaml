      1 De vordering tot voeging of tussenkomst, bedoeld in
      [artikel 217 van het Wetboek van Burgerlijke Rechtsvordering][ref1], geldt voor de partij die de vordering
      instelt, als het aanvangen van een nieuwe zaak. Van hem wordt een bedrag aan griffierecht geheven met betrekking
      tot de vordering in de oorspronkelijke zaak op basis van de tabel die als bijlage bij deze wet is gevoegd.
      Geen griffierecht wordt geheven van de partij die zich voegt aan de zijde van de verweerder als bedoeld in
      [artikel 4, eerste lid, onder b][ref2].

      2 De partij, bedoeld in het eerste lid, is het griffierecht verschuldigd vanaf het tijdstip waarop hij de vordering
      tot voeging of tussenkomst indient en zorgt dat het griffierecht binnen vier weken nadien is bijgeschreven op de
      rekening van het gerecht waar de zaak dient dan wel ter griffie is gestort.

      1 De vordering tot voeging of tussenkomst, bedoeld in
      [artikel 217 van het Wetboek van Burgerlijke Rechtsvordering][ref3], geldt voor de partij die de vordering
      instelt, als het aanvangen van een nieuwe zaak. Van hem wordt een bedrag aan griffierecht geheven met betrekking
      tot de vordering in de oorspronkelijke zaak op basis van de tabel die als bijlage bij deze wet is gevoegd.
      Geen griffierecht wordt geheven van de partij die zich voegt aan de zijde van de gedaagde als bedoeld in
      [artikel 4, eerste lid, onder b][ref4].

      2 De partij, bedoeld in het eerste lid, is het griffierecht verschuldigd vanaf het tijdstip waarop hij de vordering
      tot voeging of tussenkomst indient en zorgt dat het griffierecht binnen vier weken nadien is bijgeschreven op de
      rekening van het gerecht waar de zaak dient dan wel ter griffie is gestort.


