      1 Indien de eis strekt tot veroordeling tot schadevergoeding op te maken bij staat, maar de rechter in het
      vonnis of het arrest overeenkomstig [artikel 97 van Boek 6 van het Burgerlijk Wetboek][ref1] de schade heeft
      begroot, wordt alsnog het griffierecht geheven dat partijen verschuldigd zouden zijn geweest, indien de eis in
      de procesinleiding had gestrekt tot betaling van een bepaalde geldsom ten belope van de begrote schade. Het reeds
      voldane griffierecht wordt hierop in mindering gebracht.

      2 Partijen zijn het nader vastgestelde griffierecht verschuldigd vanaf het tijdstip waarop de rechter het vonnis
      of het arrest, bedoeld in het eerste lid, heeft gewezen en zorgen dat het griffierecht binnen vier weken nadien is
      bijgeschreven op de rekening van het gerecht waar de zaak dient dan wel ter griffie is gestort.

      1 Indien de eis strekt tot veroordeling tot schadevergoeding op te maken bij staat, maar de rechter in het
      vonnis of het arrest overeenkomstig [artikel 97 van Boek 6 van het Burgerlijk Wetboek][ref2] de schade heeft
      begroot, wordt alsnog het griffierecht geheven dat partijen verschuldigd zouden zijn geweest, indien de eis in de
      dagvaarding had gestrekt tot betaling van een bepaalde geldsom ten belope van de begrote schade. Het reeds voldane
      griffierecht wordt hierop in mindering gebracht.

      2 Partijen zijn het nader vastgestelde griffierecht verschuldigd vanaf het tijdstip waarop de rechter het vonnis
      of het arrest, bedoeld in het eerste lid, heeft gewezen en zorgen dat het griffierecht binnen vier weken nadien is
      bijgeschreven op de rekening van het gerecht waar de zaak dient dan wel ter griffie is gestort.


