    text: |-
      Het verzet door een derde tegen een vonnis of een arrest dat hem in zijn rechten benadeelt, bedoeld in de
      [negende titel van het Eerste Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1], geldt voor de derde die
      het verzet doet, als het aanvangen van een nieuwe zaak. [Artikel 3, eerste, derde en vijfde lid][ref2], zijn op de
      derde van overeenkomstige toepassing.


