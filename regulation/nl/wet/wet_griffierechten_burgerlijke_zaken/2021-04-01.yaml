    text: |-
      1 Indien een zaak waarbij een vordering wordt ingesteld met toepassing van [artikel 73][ref1]
      of [220 van het Wetboek van Burgerlijke Rechtsvordering ][ref2]wordt verwezen naar een ander gerecht om verder te
      worden behandeld en beslist, wordt van elke eiser en, voor zover van toepassing, elke verschenen verweerder opnieuw
      griffierecht geheven, met dien verstande dat het eerder geheven griffierecht hierop in mindering wordt gebracht.

      2 Indien een zaak waarbij een verzoek wordt ingediend met toepassing van
      [artikel 73 van het Wetboek van Burgerlijke Rechtsvordering][ref3] wordt verwezen naar een ander gerecht om verder
      te worden behandeld en beslist, wordt van elke verzoeker en elke belanghebbende, voor zover deze een verweerschrift
      heeft ingediend, opnieuw griffierecht geheven, met dien verstande dat het eerder geheven griffierecht hierop in
      mindering wordt gebracht.

      3 De eiser en de bij de eerste rechter verschenen verweerder zijn het ingevolge het eerste lid te heffen
      griffierecht verschuldigd vanaf de dag van de eerstvolgende proceshandeling bij de rechter naar wie de zaak is
      verwezen en zorgen dat het griffierecht binnen vier weken nadien is bijgeschreven op de rekening van het gerecht
      waar de zaak dient dan wel ter griffie is gestort.

      4 De verzoeker en de belanghebbende zijn het ingevolge het tweede lid te heffen griffierecht verschuldigd vanaf de
      beschikking tot verwijzing en zorgen dat het griffierecht binnen vier weken nadien is bijgeschreven op de rekening
      van het gerecht waar de zaak dient dan wel ter griffie is gestort.

      5 Indien een zaak, met toepassing van [artikel 73 van het Wetboek van Burgerlijke Rechtsvordering][ref4] wordt
      verwezen naar een lagere rechter bij een ander gerecht om verder te worden behandeld en beslist, wordt het
      griffierecht verminderd voor zover uit de tabel die als bijlage bij deze wet is gevoegd, volgt dat een lager bedrag
      aan griffierecht dient te worden geheven, en wordt het te veel betaalde griffierecht door de griffier teruggestort.

      1 Indien een zaak die bij dagvaarding moet worden ingeleid met toepassing van [artikel 73][ref5]
      of [220 van het Wetboek van Burgerlijke Rechtsvordering ][ref6]wordt verwezen naar een andere gerecht om verder te
      worden behandeld en beslist, wordt van elke eiser en, voor zover van toepassing, elke verschenen gedaagde opnieuw
      griffierecht geheven, met dien verstande dat het eerder geheven griffierecht hierop in mindering wordt gebracht.

      2 Indien een zaak waarbij een verzoek wordt ingediend met toepassing van
      [artikel 73 van het Wetboek van Burgerlijke Rechtsvordering][ref7] wordt verwezen naar een ander gerecht om verder
      te worden behandeld en beslist, wordt van elke verzoeker en elke belanghebbende, voor zover deze een verweerschrift
      heeft ingediend, opnieuw griffierecht geheven, met dien verstande dat het eerder geheven griffierecht hierop in
      mindering wordt gebracht.

      3 De eiser en de bij de eerste rechter verschenen gedaagde zijn het ingevolge het eerste lid te heffen griffierecht
      verschuldigd vanaf de dag waarop de zaak ter rolle dient bij de rechter naar wie de zaak is verwezen en zorgen dat
      het griffierecht binnen vier weken nadien is bijgeschreven op de rekening van het gerecht waar de zaak dient dan
      wel ter griffie is gestort.

      4 De verzoeker en de belanghebbende zijn het ingevolge het tweede lid te heffen griffierecht verschuldigd vanaf de
      beschikking tot verwijzing en zorgen dat het griffierecht binnen vier weken nadien is bijgeschreven op de rekening
      van het gerecht waar de zaak dient dan wel ter griffie is gestort.

      5 Indien een zaak, met toepassing van [artikel 73 van het Wetboek van Burgerlijke Rechtsvordering][ref8] wordt
      verwezen naar een lagere rechter bij een ander gerecht om verder te worden behandeld en beslist, wordt het
      griffierecht verminderd voor zover uit de tabel die als bijlage bij deze wet is gevoegd, volgt dat een lager bedrag
      aan griffierecht dient te worden geheven, en wordt het te veel betaalde griffierecht door de griffier teruggestort.


