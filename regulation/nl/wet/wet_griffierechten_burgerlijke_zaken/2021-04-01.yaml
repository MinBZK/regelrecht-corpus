  - number: '4'
    text: |-
      1 Geen griffierecht wordt geheven van: a. het openbaar ministerie indien het ambtshalve
      optreedt; b. de verweerder in een zaak in behandeling bij de kantonrechter of de pachtkamer
      bij de rechtbank; c. de oorspronkelijke eiser in geval van verzet als bedoeld in de
      [achtste afdeling van de tweede titel van het Eerste Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1];
      d. de oorspronkelijke eiser en de oorspronkelijke verweerder in geval van verzet door derden als bedoeld in de
      [negende titel van het Eerste Boek van het Wetboek van Burgerlijke Rechtsvordering][ref2]; e. de partij in een
      zaak in vrijwaring als bedoeld in [artikel 210 van het Wetboek van Burgerlijke Rechtsvordering][ref3] die in de
      hoofdzaak reeds griffierecht verschuldigd is geworden, en f. partijen en anderen die verschijnen in de prejudiciële
      procedure als bedoeld in [artikel 393 van het Wetboek van Burgerlijke Rechtsvordering][ref4].

      2 Geen griffierecht wordt geheven voor: a. het indienen van een verweerschrift bij de kantonrechter of
      de pachtkamer bij de rechtbank; b. het instellen van een tegenvordering of tegenverzoek als bedoeld in
      [artikel 30i, achtste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref5]; c. het instellen
      van incidenteel beroep als bedoeld in de [artikelen 339, derde lid][ref6], [361, vierde lid][ref7], en
      [410 van het Wetboek van Burgerlijke Rechtsvordering][ref8]; d. het indienen van een zelfstandig verzoek als
      bedoeld in [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref9]; e. het doen van
      rekening en verantwoording als bedoeld in [artikel 771 van het Wetboek van Burgerlijke Rechtsvordering][ref10];
      f. de indiening van een verzoekschrift, indien dit verzoekschrift in de loop van een aanhangig geding wordt
      ingediend en op dit geding betrekking heeft; g. de indiening van een verzoekschrift strekkende tot begroting van
      de nakosten als bedoeld in [artikel 237, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref11];
      h. het voeren van verweer tegen handelingen als bedoeld onder b tot en met g; i. het doen van een eigen
      aangifte tot faillietverklaring als bedoeld in [artikel 4, eerste lid, van de Faillissementswet][ref12],
      alsmede voor het aanwenden van een rechtsmiddel tegen de afwijzing van deze aangifte; j. de indiening van een
      verzoekschrift tot het van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen als bedoeld in
      [artikel 284, eerste lid, van de Faillissementswet][ref13], alsmede voor het aanwenden van een rechtsmiddel tegen
      de afwijzing van dit verzoek, en k. de indiening van een verzoek tot rangschikking.

      3 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent bepaalde categorieën van zaken waarbij een
      vordering wordt ingesteld of een verzoek wordt ingediend, waarin geen griffierecht wordt geheven.

      1 Geen griffierecht wordt geheven van: a. het openbaar ministerie indien het ambtshalve
      optreedt; b. de gedaagde in een zaak in behandeling bij de kantonrechter of de pachtkamer
      bij de rechtbank; c. de oorspronkelijke eiser in geval van verzet als bedoeld in de
      [achtste afdeling van de tweede titel van het Eerste Boek van het Wetboek van Burgerlijke Rechtsvordering][ref14];
      d. de oorspronkelijke eiser en de oorspronkelijke gedaagde in geval van verzet door derden als bedoeld in de
      [negende titel van het Eerste Boek van het Wetboek van Burgerlijke Rechtsvordering][ref15]; e. de partij in een
      zaak in vrijwaring als bedoeld in [artikel 210 van het Wetboek van Burgerlijke Rechtsvordering][ref16] die in de
      hoofdzaak reeds griffierecht verschuldigd is geworden, en f. partijen en anderen die verschijnen in de prejudiciële
      procedure als bedoeld in [artikel 393 van het Wetboek van Burgerlijke Rechtsvordering][ref17].

      2 Geen griffierecht wordt geheven voor: a. het indienen van een verweerschrift bij de kantonrechter
      of de pachtkamer bij de rechtbank; b. het instellen van een eis in reconventie als bedoeld
      in [artikel 136 van het Wetboek van Burgerlijke Rechtsvordering][ref18]; c. het instellen van
      incidenteel beroep als bedoeld in de [artikelen 339, derde lid][ref19], [361, vierde lid][ref20], en
      [410 van het Wetboek van Burgerlijke Rechtsvordering][ref21]; d. het indienen van een zelfstandig verzoek als
      bedoeld in [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref22]; e. het doen van
      rekening en verantwoording als bedoeld in [artikel 771 van het Wetboek van Burgerlijke Rechtsvordering][ref23];
      f. de indiening van een verzoekschrift, indien dit verzoekschrift in de loop van een aanhangig geding wordt
      ingediend en op dit geding betrekking heeft; g. de indiening van een verzoekschrift strekkende tot begroting van
      de nakosten als bedoeld in [artikel 237, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref24];
      h. het voeren van verweer tegen handelingen als bedoeld onder b tot en met g; i. het doen van een eigen
      aangifte tot faillietverklaring als bedoeld in [artikel 4, eerste lid, van de Faillissementswet][ref25],
      alsmede voor het aanwenden van een rechtsmiddel tegen de afwijzing van deze aangifte; j. de indiening van een
      verzoekschrift tot het van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen als bedoeld in
      [artikel 284, eerste lid, van de Faillissementswet][ref26], alsmede voor het aanwenden van een rechtsmiddel tegen
      de afwijzing van dit verzoek, en k. de indiening van een verzoek tot rangschikking.

      3 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent bepaalde categorieën van zaken die bij
      dagvaarding of met een verzoekschrift worden ingeleid, waarin geen griffierecht wordt geheven.


