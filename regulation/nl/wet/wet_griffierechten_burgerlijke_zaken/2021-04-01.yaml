  - number: '8'
    text: |-
      1 Indien een zaak, in behandeling bij een kamer voor kantonzaken, met toepassing van
      [artikel 71, eerste lid][ref1], of [220, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] wordt
      verwezen naar een kamer voor andere zaken dan kantonzaken van hetzelfde gerecht om verder te worden behandeld en
      beslist, wordt het griffierecht van elke eiser dan wel elke verzoeker verhoogd voor zover op basis van de tabel die
      als bijlage bij deze wet is gevoegd, een hoger bedrag aan griffierecht dient te worden geheven. Van elke verschenen
      verweerder dan wel belanghebbende, voor zover deze een verweerschrift heeft ingediend, wordt alsnog griffierecht
      geheven.

      2 De eiser en de bij de eerste rechter verschenen verweerder zijn de ingevolge het eerste lid te heffen verhoging
      van het griffierecht verschuldigd vanaf de dag van de eerstvolgende proceshandeling bij de rechter naar wie de zaak
      is verwezen en zorgen dat het griffierecht binnen vier weken nadien is bijgeschreven op de rekening van het gerecht
      waar de zaak dient dan wel ter griffie is gestort.

      3 De verzoeker en de belanghebbende zijn de ingevolge het eerste lid te heffen verhoging van het griffierecht
      verschuldigd vanaf de beslissing tot verwijzing en zorgen dat het griffierecht binnen vier weken nadien is
      bijgeschreven op de rekening van het gerecht waar de zaak dient dan wel ter griffie is gestort.

      4 Indien een zaak in behandeling bij een kamer voor andere zaken dan kantonzaken, met toepassing van
      [artikel 71, tweede lid][ref3], of [220, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref4] wordt
      verwezen naar een kamer voor kantonzaken van hetzelfde gerecht om verder te worden behandeld en beslist, wordt het
      griffierecht verminderd voor zover op basis van de tabel die als bijlage bij deze wet is gevoegd, een lager bedrag
      aan griffierecht dient te worden geheven, en wordt het te veel betaalde griffierecht door de griffier teruggestort.

      1 Indien een zaak, in behandeling bij een kamer voor kantonzaken, met toepassing van
      [artikel 71, eerste lid][ref5], of [220, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref6] wordt
      verwezen naar een kamer voor andere zaken dan kantonzaken van hetzelfde gerecht om verder te worden behandeld en
      beslist, wordt het griffierecht van elke eiser dan wel elke verzoeker verhoogd voor zover op basis van de tabel die
      als bijlage bij deze wet is gevoegd, een hoger bedrag aan griffierecht dient te worden geheven. Van elke verschenen
      gedaagde dan wel belanghebbende, voor zover deze een verweerschrift heeft ingediend, wordt alsnog griffierecht
      geheven.

      2 De eiser en de bij de eerste rechter verschenen gedaagde zijn de ingevolge het eerste lid te heffen verhoging
      van het griffierecht verschuldigd vanaf de dag waarop de zaak ter rolle dient bij de rechter naar wie de zaak is
      verwezen en zorgen dat het griffierecht binnen vier weken nadien is bijgeschreven op de rekening van het gerecht
      waar de zaak dient dan wel ter griffie is gestort.

      3 De verzoeker en de belanghebbende zijn de ingevolge het eerste lid te heffen verhoging van het griffierecht
      verschuldigd vanaf de beslissing tot verwijzing en zorgen dat het griffierecht binnen vier weken nadien is
      bijgeschreven op de rekening van het gerecht waar de zaak dient dan wel ter griffie is gestort.

      4 Indien een zaak in behandeling bij een kamer voor andere zaken dan kantonzaken, met toepassing van
      [artikel 71, tweede lid][ref7], of [220, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref8] wordt
      verwezen naar een kamer voor kantonzaken van hetzelfde gerecht om verder te worden behandeld en beslist, wordt het
      griffierecht verminderd voor zover op basis van de tabel die als bijlage bij deze wet is gevoegd, een lager bedrag
      aan griffierecht dient te worden geheven, en wordt het te veel betaalde griffierecht door de griffier teruggestort.


