$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: begrippencode_elektriciteit
regulatory_layer: WET
publication_date: '2025-11-28'
valid_from: '2025-01-01'
bwb_id: BWBR0037938
url: https://wetten.overheid.nl/BWBR0037938/2025-01-01
preamble:
  text: |-
    Gelet op artikel 36 en artikel 55 van de Elektriciteitswet 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037938/2025-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In de voorwaarden als bedoeld in de [artikelen 27][ref1], [31][ref2] en [54 van de Elektriciteitswet 1998][ref3]
      wordt verstaan onder:

        - *Aangeslotene:* Een ieder, die beschikt over een aansluiting op een net;
        - *Aanraakspanning:* Spanning tussen gelijktijdig bereikbare geleidende delen, wanneer deze geleidende delen niet
      in aanraking zijn met een persoon of dier;
        - *Aansluit- en transportovereenkomst:* Overeenkomst tussen een aangeslotene en een netbeheerder betreffende de
      aansluiting op een net en het transport van elektriciteit over dat net;
        - *Aansluitcapaciteit:* Het transportvermogen van de aansluiting zoals door een potentiële aangeslotene is
      aangevraagd en waarvoor het aansluittarief wordt betaald;
        - *Aansluitdienst:* Het verzorgen en instandhouden van een aansluiting van een aangeslotene of ander net op een net
      en het desgevraagd beschikbaar stellen van een meetinrichting;
        - *Aansluitingenregister:* Een register, ingericht en beheerd door de netbeheerder voor de aansluitingen op zijn
      net, waarin per aansluiting die gegevens zijn vastgelegd die nodig zijn voor de communicatie tussen netbeheerders
      en marktpartijen aangaande balanceringsverantwoordelijkheid, de facilitering van de mutatieprocessen, de uitvoering
      van het leveranciersmodel en de productie van duurzame elektriciteit;
        - *Aansluittarief:* Het tarief in rekening gebracht door de netbeheerder bij een aangeslotene ter dekking van de
      kosten van de aansluitdienst;
        - *Aansluitvoorwaarden:* De technische en operationele voorwaarden waaraan een netbeheerder en een aangeslotene ten
      minste moeten voldoen;
        - *Aanwezige transportcapaciteit:* De maximale capaciteit dat een net aan kan, met inachtneming van de van
      toepassing zijnde netontwerpcriteria en operationele veiligheidsgrenzen;
        - *Actief telwerk:* Een telwerk waarin daadwerkelijk de gemeten hoeveelheid elektrische energie wordt vastgelegd en
      waarvan de stand wordt uitgelezen t.b.v. de marktprocessen;
        - *Actuele [leverancier / BRP / meetverantwoordelijke]:* De [leverancier / BRP / meetverantwoordelijke] die voor
      een bepaalde aansluiting de rechten en plichten van een [leverancier / BRP / meetverantwoordelijke] uitoefent en
      als zodanig in het aansluitingenregister staat geregistreerd;
        - *Administratieve status van een aansluiting:* De aanduiding in het aansluitingenregister waaruit blijkt dat de
      aansluiting administratief aangesloten of administratief afgesloten is, te weten of de aansluiting wel of niet
      beschikbaar is voor gebruik op de energiemarkt;
        - *Adresgegevens:* Straatnaam, huisnummer met eventuele toevoegingen, postcode en plaatsnaam;
        - *Afgelezen meterstand:* Een meterstand die ter plaatse van de meetinrichting visueel is afgelezen;
        - *Afschakelplan:* Plan waarin wordt aangegeven onder welke condities en op welke wijze door het afschakelen
      van een beperkte hoeveelheid belasting uitbreiding van een grootschalige storing in het Nederlandse
      elektriciteitsvoorzieningssysteem kan worden voorkomen;
        - *Allocatiepunt:* Virtueel punt ter plaatse van het overdrachtspunt van een aansluiting, waar de energie-
      uitwisseling tussen een installatie en het net administratief aan een marktpartij wordt toegewezen alsof de meting
      op het overdrachtspunt van de aansluiting heeft plaatsgevonden;
        - *Artikel-1-lid-2-of-3-aansluiting:* Een aansluiting van een afnemer als bedoeld in
      [artikel 1, tweede of derde lid, van de Wet][ref4];
        - *Avondtarief:* [Vervallen]
        - *Bedrijfstijd (BT):* Het standaardjaarafname op een aansluiting gedeeld door het op die aansluiting
      gecontracteerd transportvermogen of het vermogen dat overeenkomt met de doorlaatwaarde van die aansluiting;
        - *Bedrijfsvoeringcriteria:* Criteria die ten aanzien van de veiligheid en betrouwbaarheid van het transport van
      elektrische energie worden gehanteerd door netbeheerders;
        - *Benodigde transportcapaciteit:* De transportcapaciteit nodig om aan de vraag naar transport van alle
      gecontracteerde aangeslotenen in een (deel)net te voldoen, als bedoeld in artikel 2.3 van de Regeling
      investeringsplan en kwaliteit elektriciteit en gas;
        - *Beschermde afnemer:* [Vervallen]
        - *Beschermde producent:* [Vervallen]
        - *Beschikbare transportcapaciteit:* Het deel van de aanwezige transportcapaciteit dat niet wordt ingezet om aan de
      benodigde transportcapaciteit te voldoen. De beschikbare transportcapaciteit is gelijk aan het verschil tussen de
      aanwezige transportcapaciteit en de benodigde transportcapaciteit;
        - *Biedzone Nederland:* Het gebied als bedoeld in artikel 2, derde lid, van de Verordening (EU) 543/2013 voor
      Nederland, omvattende het geografische gebied van Nederland en de Nederlandse exclusieve economische zone;
        - *Blokorder:* Een opdracht tot het aankopen of verkopen van elektriciteit gedurende een aaneengesloten periode van
      méér dan één klokuur;
        - *BRP-register:* Een door de netbeheerder van het landelijk hoogspanningsnet ingericht en beheerd register, waarin
      de namen, adressen, telefoon- en faxnummers alsmede de gegevens ten behoeve van computermatige communicatie vermeld
      staan van de (rechts)personen die door de netbeheerder van het landelijk hoogspanningsnet als BRP zijn erkend;
        - *Bulk PV-switch:* [Vervallen]
        - *Capaciteitstariefcode:* De aanduiding in het aansluitingenregister van het op een aansluiting van toepassing
      zijnde nettarief;
        - *CG-aangeslotene:* Een aangeslotene of CSP waarvan een bieding overeenkomstig [artikel 9.41, vierde lid][ref5],
      is afgeroepen dan wel waarvoor een capaciteitsbeperking overeenkomstig artikel 9.41, vierde lid, of
      [artikel 9.45, vijfde lid][ref6], is opgedragen;
        - *Comptabele meetinrichting:* Een meetinrichting ten behoeve van de verrekening;
        - *Cos φ:* De arbeidsfactor in het geval van zuiver sinusvormige spanning en stroom;
        - *CSP:* Een marktdeelnemer die congestiemanagementdiensten levert aan een netbeheerder;
        - *Datavalidatie:* De controle op volledigheid en juistheid van de meetdata;
        - *Deelnet:* Een net met een bepaald spanningsniveau met sterke samenhang, aangesloten op een net van hogere
      spanning;
        - *Distributienet:* Een net dat wordt beheerd door een regionale netbeheerder;
        - *Draaiprogramma:* [Vervallen]
        - *Draaivermogen:* [Vervallen]
        - *EAN-code:* Uniek identificatienummer conform de Europese Artikel Nummering;
        - *EAN-codeboek:* Een online toegankelijk uittreksel van het aansluitingenregister;
        - *Elektriciteitsopslageenheid:* Een eenheid die actief vermogen vanuit het net kan afnemen en in het net kan
      injecteren door omzetting van elektrische energie in een vorm van energie die kan worden opgeslagen, de opslag van
      die energie en de daaropvolgende omzetting van die energie in elektrische energie;
        - *Elektriciteitsvoorzieningssysteem:* Het totale systeem van onderling verbonden netten en aansluitingen;
        - *Energietransactie:* Een overeenkomst die inhoudt dat een zekere hoeveelheid elektrische energie (in MWh) wordt
      geproduceerd en afgenomen;
        - *Enkeltarief:* [Vervallen]
        - *Enkel telwerk:* Het telwerk van een kleinverbruikmeetinrichting met één actief telwerk;
        - *Enkelvoudige storing:* De uitval van een elektriciteitsproductie-eenheid of een willekeurig element in het
      elektriciteitsvoorzieningssysteem;
        - *(Normale toestand met) enkelvoudige storingsreserve:* De toestand van een net (waarin de normale toestand blijft
      gehandhaafd) wanneer een enkelvoudige storing optreedt (ook wel: n-1 reserve);
        - *(Normale toestand met) enkelvoudige storingsreserve tijdens onderhoud:* Een (normale toestand met) enkelvoudige
      storingsreserve ten tijde van het uit bedrijf zijn van één willekeurig element ten behoeve van onderhoud;
        - *Energieprogramma:* Een door een BRP opgesteld en bij de netbeheerder van het landelijk hoogspanningsnet
      ingediend programma dat voor elke onbalansverrekeningsperiode in een etmaal bevat: (i) de positie; (ii) het intern
      commercieel handelsprogramma; (iii) het extern commercieel handelsprogramma;
        - *Fiscale entiteit:* Organisatorische eenheid die beschikt over een eigen BTW-nummer;
        - *Foutspanning:* Spanning die optreedt als gevolg van een isolatiefout tussen het punt waar de fout optreedt en
      de referentieaarde;
        - *Frequentierelais:* Een voorziening, reagerend op frequentiedaling via vooraf ingestelde frequentiewaarden,
      waarmee belasting automatisch kan worden afgeschakeld;
        - *Fysieke meteropname:* Het door een netbeheerder, meetbedrijf of meetverantwoordelijke ter plaatse van de
      meetinrichting aflezen van (een) meterstand(en) van die meetinrichting;
        - *Fysieke status van de aansluiting:* De aanduiding of de aansluiting fysiek aangesloten of fysiek afgesloten is,
      te weten of de aansluiting wel of niet beschikbaar is voor uitwisseling van elektriciteit of gas tussen het net en
      de aangesloten installatie;
        - *Garantiebeheerinstantie:* [Vervallen]
        - *GCvO-installatie:* Een elektriciteitsproductie-installatie of een op grond van de criteria uit
      [artikel 24 van de Regeling garanties van oorsprong en certificaten van oorsprong][ref7] afgebakend deel
      daarvan, die of dat op grond van [artikel 16, eerste lid, onderdeel h, van de Elektriciteitswet 1998][ref8]
      wordt aangemerkt als een installatie voor de productie van elektriciteit als bedoeld in
      [artikel 73, eerste lid van de Elektriciteitswet 1998][ref9];
        - *Geautoriseerde meterstand:* [Vervallen]
        - *Gebiedsgrens:* [vervallen]
        - *Gecontracteerd transportvermogen:* Het vermogen dat een aangeslotene redelijkerwijs verwacht maximaal op enig
      moment in het jaar nodig te hebben op zijn aansluiting;
        - *Gecorrigeerd geprofileerde afname (GGA):* Verondersteld geprofileerde afname die is gecorrigeerd met de
      restantvolumecorrectiefactor;
        - *Gecorrigeerd geprofileerde invoeding (GGI):* Verondersteld geprofileerde invoeding die is gecorrigeerd met de
      restantvolumecorrectiefactor;
        - *Gevraagde transportcapaciteit:* De transportcapaciteit nodig om aan de vraag naar transport van één individuele
      aangeslotene, namelijk de aanvrager, te voldoen;
        - *Grootschalige storing:* De uitval van verscheidene elementen in het elektriciteitsvoorzieningssysteem of
      productie-eenheden waardoor in een groot gebied dan wel bij een groot aantal aangeslotenen de transportdienst
      onderbroken wordt;
        - *Grootverbruikaansluiting:* Een aansluiting met een totale maximale doorlaatwaarde groter dan 3x80A of een
      aansluiting zoals bedoeld in [artikel 1, lid 2 of lid 3, van de Wet][ref10];
        - *Grootverbruiker:* Een aangeslotene, niet zijnde een kleinverbruiker;
        - *HAR:* Harmonised allocation rules for long-term transmission rights in accordance with Article 51 of Commission
      Regulation (EU) 2016/1719 of 26 September 2016 establishing a Guideline on Forward Capacity Allocation;
        - *Herkomstindicatie:* De oorsprong van de door de meetverantwoordelijke of netbeheerder vastgestelde meetgegevens;
        - *Hinderlijke spanningsdip:* Een spanningsdip met een duur van 10 tot 200 milliseconde en een restspanning van
      minder dan 40%, of met een duur van 200 tot 500 milliseconde en een restspanning van minder dan 70% of met een duur
      van 500 tot 5.000 milliseconde en een restspanning van minder dan 80%;
        - *Hoogspanning:* Spanningsniveau hoger dan 1000 V;
        - *Hoogspanningsnet:* Net bestemd voor het transport van elektriciteit op een spanningsniveau groter dan 35 kV en
      dat als zodanig wordt bedreven;
        - *Inhuizing:* Een verhuizing waarbij een (rechts)persoon een onroerende zaak betrekt en de beschikkingsbevoegdheid
      over de aansluiting op zich neemt;
        - *In-switch:* [Vervallen]
        - *Installatie:* Het samenstel van elektrisch materieel en leidingen van een aangeslotene, te rekenen na het
      overdrachtspunt van de aansluiting;* * MvT Elektriciteitswet: Voor zover het een producent van elektriciteit
      betreft, wordt hieronder verstaan de elektriciteitscentrale als geheel; voor zover het een afnemer van
      elektriciteit betreft, wordt hieronder verstaan alles wat – doorgaans achter de elektriciteitsmeter – in de woning
      of vestiging elektriciteit verbruikt. Tot de installatie kan ook behoren de verbinding tussen een vestiging van een
      aangeslotene en het punt waarop de aangeslotene is voorzien van een aansluiting op het net;
        - *Inzetbaar vermogen:* [Vervallen]
        - *Klantsleutel:* een bij een kleinverbruiker behorend identificatiekenmerk bestaande uit de laatste drie cijfers
      van diens IBAN of de dag en de maand van diens geboortedatum;
        - *Kleinverbruikaansluiting:* Een aansluiting met een totale maximale doorlaatwaarde kleiner dan of gelijk aan
      3x80A niet zijnde een artikel 1, lid 2 of 3-aansluiting;
        - *Kleinverbruiker:* De in [artikel 95a, eerste lid van de Elektriciteitswet 1998][ref11] bedoelde afnemer;
        - *Kleinverbruikmeetinrichting:* Een meetinrichting bij een kleinverbruikaansluiting, zijnde een op afstand
      uitleesbare kleinverbruikmeetinrichting of een niet op afstand uitleesbare kleinverbruikmeetinrichting;
        - *KORRR:* De methodologie met de belangrijkste organisatorische vereisten, rollen en verantwoordelijkheden ten
      aanzien van gegevensuitwisseling in verband met de operationele veiligheid, als bedoeld in artikel 40, zesde lid,
      van de Verordening (EU) 2017/1485 (GL SO);
        - *kWmax:* De werkelijk voorgekomen maximale belasting van het net door een aangeslotene op een netaansluiting, die
      bij een meetperiode van 15 minuten of minder wordt bepaald op basis van de waarde per klokkwartier en die bij een
      andere meetperiode wordt bepaald op basis van de hoogste waarde per meetperiode;
        - *kW:* de maximale, in de tijd variërende gewogen belasting van het net door een aangeslotene op een aansluiting;
        - *Laagspanning:* Een spanningsniveau kleiner dan of gelijk aan 1 kV in geval van een wisselspanningsnet en kleiner
      dan of gelijk aan 1,5 kV in geval van een gelijkspanningsnet;
        - *Laagspanningsnet:* Net bestemd voor het transport van elektriciteit op een spanningsniveau kleiner dan
      of gelijk aan 1 kV in geval van een wisselspanningsnet en kleiner dan of gelijk aan 1,5 kV in geval van een
      gelijkspanningsnet en dat als zodanig wordt bedreven;
        - *Laagtarief:* [Vervallen]
        - *Laag telwerk:* Een telwerk van een kleinverbruikmeetinrichting met twee of meer telwerken dat gebruikt wordt of
      kan worden voor de bepaling van de met het net uitgewisselde energie tijdens laaguren.
        - *Laaguren:* Uren van de dag waarvoor, in geval van een meetinrichting met dubbel telwerk, de met het net
      uitgewisselde elektrische energie wordt geregistreerd door het laagtelwerk. Deze periode wordt ook wel aangeduid
      als “off-peak”;
        - *Leveranciersregister:* Administratie van bedrijfsgegevens en operationele contactgegevens van de leveranciers
      van elektriciteit of gas in Nederland;
        - *Marktpartij:* Iedere partij die gerechtigd is om transacties in elektriciteit af te sluiten op de Nederlandse
      elektriciteitsmarkt;
        - *Marktsegment:* De aanduiding in het aansluitingenregister van de categorie waartoe een aansluiting behoort, te
      weten: 'a. Een kleinverbruikaansluiting, of: b. Een grootverbruikaansluiting, niet zijnde een artikel 1, lid 2 of 3-'
      aansluiting, of; c. Een grootverbruikaansluiting, zijnde een artikel 1, lid 2 of 3-aansluiting;
        - *Meetgegevens:* Alle gegevens die afkomstig zijn uit een meetinrichting (zoals meterstanden) of die daarvan zijn
      afgeleid (zoals volumes) of die als zodanig worden gebruikt (zoals door middel van profielensystematiek berekende
      gegevens omtrent volumes);
        - *Meetmethode:* De aanduiding in het aansluitingenregister van de wijze waarop de energie-uitwisseling op de
      aansluiting wordt vastgesteld;
        - *Meetmiddel (van de meetinrichting):* Een kWh-meter, kvarh-meter, stroom- of spanningstransformator;
        - *Meetverantwoordelijke:* Een persoon die meetverantwoordelijkheid uitoefent en die daarvoor conform
      [bijlage 4 van de Meetcode elektriciteit][ref12] en/of [bijlage 3 van de Meetcode gas RNB](onbekend) is erkend;
        - *Meetverantwoordelijkheid:* De verantwoordelijkheid van de aangeslotene voor het aanwezig zijn
      op de aansluiting van een op grond van [hoofdstuk 2 van de Meetcode elektriciteit][ref13] vereiste
      meetinrichting, meetinrichtingen in het kader van de eigen opwekking en meetinrichtingen in het kader van de
      [Wet milieukwaliteit elektriciteitsproductie][ref14], alsmede voor het correct en tijdig (doen) vaststellen en
      (doen) doorgeven van meetgegevens op grond van [hoofdstuk 6 van de Informatiecode elektriciteit en gas][ref15];
        - *Meterbeheerder:* Een organisatorische eenheid die verantwoordelijk is voor ontwerp, plaatsing, beheer, onderhoud
      en verwijdering van de meetinrichting;
        - *Meterplaatser:* Een persoon, niet zijnde een netbeheerder, die conform [artikel 26ad, lid 6][ref16]
      of [artikel 26ae, lid 7 van de Elektriciteitswet 1998][ref17] of [artikel 13d, lid 6][ref18], of
      [artikel 13e, lid 7, van de Gaswet][ref19], op verzoek van een kleinverbruiker een meetinrichting plaatst bij een
      kleinverbruikaansluiting en die daarvoor conform [bijlage 4 van de Meetcode elektriciteit][ref20] en/of [bijlage 3
      van de Meetcode gas RNB](onbekend) is erkend;
        - *Middenspanningsnet:* Net bestemd voor het transport van elektriciteit op een spanningsniveau groter dan 1 kV,
      maar kleiner dan of gelijk aan 35 kV en dat als zodanig wordt bedreven.
        - *MP-erkenner:* De instantie die conform [bijlage 4 van de Meetcode elektriciteit][ref21] en [bijlage 3 van de
      Meetcode gas RNB](onbekend) door de gezamenlijke netbeheerders is aangewezen om de meterplaatsers te erkennen;
        - *Mutatiedatum:* De datum waarop door de netbeheerder de wijziging van stamgegevens in het aansluitingenregister
      wordt geëffectueerd;
        - *MV-erkenner:* De instantie die conform [bijlage 4 van de Meetcode elektriciteit][ref22] en [bijlage 3 van de
      Meetcode gas RNB](onbekend) is aangewezen om de meetverantwoordelijken te erkennen;
        - *MV-register:* Een register waarin de namen, adressen, telefoon- en faxnummers alsmede de
      gegevens ten behoeve van elektronische gegevensuitwisseling zijn vermeld van de op grond van
      [B4.2.1.1 van de Meetcode elektriciteit][ref23] en [B3.2.1.1 van de Meetcode gas RNB](onbekend) erkende
      meetverantwoordelijken;
        - *Nachttarief:* [Vervallen]
        - *Netaansluiting:* [Vervallen]
        - *Netaansluitpunt:* Het fysieke punt dat de grens tussen de aansluiting en het net van de netbeheerder aangeeft;
        - *Netbeheerdersregister:* Administratie van bedrijfsgegevens en operationele contactgegevens van de netbeheerders
      in Nederland;
        - *Netgebied:* Een aaneengesloten en samenhangend deel van een net van één netbeheerder, waarbinnen de processen
      allocatie en reconciliatie plaatsvinden;
        - *Nettarief:* De door de aangeslotene verschuldigde bedragen als bedoeld in
      [artikel 95cb van de Elektriciteitswet 1998][ref24] en [artikel 44b van de Gaswet][ref25];
        - *Netverliezen (NV):* Saldo van energie ingevoed op en energie afgenomen van een bepaald net gedurende een
      bepaalde tijd;
        - *Netvlak:* Een deel van het net waarvoor geldt dat de verbruikers aangesloten op dit deel van het net eenzelfde
      tarief in rekening krijgen;
        - *Niet op afstand uitleesbare kleinverbruikmeetinrichting:* Een meetinrichting die niet voldoet aan het
      [Besluit op afstand uitleesbare meetinrichtingen][ref26];
        - *Nieuwe [leverancier / BRP / meetverantwoordelijke]:* De [leverancier / BRP / meetverantwoordelijke] die voor een
      bepaalde aansluiting de rechten en plichten van een [leverancier / BRP / meetverantwoordelijke] zal gaan uitoefenen
      en die zich als zodanig in het aansluitingenregister heeft aangemeld of zal gaan aanmelden;
        - *Nominaal meetvermogen:* Het schijnbaar vermogen, overeenkomstig het bepaalde in
      [B3.1.1.2.1 tot en met B3.1.1.2.4 van de Meetcode elektriciteit][ref27], te berekenen uit de nominale primaire
      spanning van de spanningstransformatoren en de nominale primaire stroom van de stroomtransformatoren;
        - *Normaaltarief:* [Vervallen]
        - *Normaal telwerk:* Een telwerk van een kleinverbruikmeetinrichting met twee of meer telwerken dat gebruikt wordt
      of kan worden voor de bepaling van de met het net uitgewisselde energie tijdens normaaluren;
        - *Normaaluren:* Uren van de dag waarvoor, in geval van een meetinrichting met dubbel telwerk, de met het net
      uitgewisselde elektrische energie wordt geregistreerd door het normaaltelwerk. Deze periode wordt ook wel aangeduid
      als “peak”;
        - *OBIS-code:* Een code volgens het in IEC 62056-61 vastgelegde OBject Identification System, waarmee elementen van
      meetapparatuur kunnen worden geïdentificeerd;
        - *Onbalansprijszone Nederland:* Het gebied als bedoeld in artikel 2, dertiende lid, van de Verordening (EU)
      2017/2195 (GL EB) voor Nederland, omvattende het geografische gebied van Nederland en de Nederlandse exclusieve
      economische zone (en valt dus samen met de biedzone Nederland);
        - *Onbalansverrekeningsperiode:* De tijdseenheid waarmee de onbalansverrekening plaatsvindt, te weten 15 minuten,
      ofwel per klokkwartier;
        - *Onbalanszone Nederland:* Het gebied als bedoeld in artikel 2, elfde lid, van de Verordening (EU) 2017/2195 (GL
      EB) voor Nederland, omvattende het geografische gebied van Nederland en de Nederlandse exclusieve economische zone
      (en valt dus samen met de biedzone Nederland);
        - *Onbemeten aansluiting:* Een aansluiting waarbij op grond van [artikel 2.30][ref28] of
      [2.31 van de Netcode elektriciteit][ref29] geen meetinrichting aanwezig is;
        - *Op afstand uitleesbare kleinverbruikmeetinrichting:* Een meetinrichting die voldoet aan het
      [Besluit op afstand uitleesbare meetinrichtingen][ref30];
        - *Opgesteld vermogen:* Het maximale vermogen van een elektriciteitsproductie-eenheid dat onder nominale condities
      benut kan worden voor het leveren van elektrische energie (nameplate capacity).
        - *Opwekvermogen:* [Vervallen]
        - *Oude [leverancier / BRP / meetverantwoordelijke]:* De [leverancier / BRP / meetverantwoordelijke] die voor een
      bepaalde aansluiting de rechten en plichten zal gaan verliezen of heeft verloren en als gevolg daarvan uit het
      aansluitingenregister is verwijderd of zal worden verwijderd;
        - *Overdrachtspunt:* Het fysieke punt waar respectievelijk een scheiding tussen de aansluiting van twee netten
      onderling of tussen de aansluiting van een net en de installatie van de aangeslotene kan worden gerealiseerd;
        - *P4:* Onderdeel van de op afstand uitleesbare kleinverbruikmeetinrichting door middel waarvan de netbeheerder
      en de leverancier en in geval van een door de aangeslotene verstrekte machtiging een derde, toegang hebben tot de
      meetgegevens van die kleinverbruikmeetinrichting;
        - *Particulier net:* [Vervallen]
        - *Per unit (pu):* De referentiespanning die in een laagspanningsnet gelijk is aan de spanning U te weten 230 V,
      in een middenspanningsnet gelijk is aan de spanning U, in een hoogspanningsnet met een spanningsniveau kleiner dan
      of gelijk aan 220 kV gelijk is aan spanning U, en in een hoogspanningsnet met een spanningsniveau groter dan 220 kV
      gelijk is aan de spanning U;
        - *Primair allocatiepunt:* Het eerste aan een aansluiting toegekende allocatiepunt;
        - *Primair gedeelte van de meetinrichting:* De eventueel aanwezige spannings- en stroommeettransformatoren met
      inbegrip van de aansluitklemmen waarop het secundaire deel van de meetinrichting is aangesloten;
        - *Primaire energiebron:* Een aanduiding voor de soort brandstof en/of energiebron voor de elektriciteitsproductie-
      eenheid, onderverdeeld in de volgende types: – zon; – wind; – water; – biomassa; – kolen; – gas; – olie; –
      nucleair; – overig;
        - *Productiemeetinrichting:* Een meetinrichting waarmee de hoeveelheid opgewekte elektrische energie op de plaats
      waar de GCvO-installatie met de rest van de elektrische installatie verbonden is wordt gemeten;
        - *Profielcategorie (PC):* Een classificering van aansluitingen op grond van objectief vast te stellen kenmerken,
      zoals aansluitwaarde, schakeltijden, gecontracteerd transportvermogen, vastgesteld afnametype en bedrijfstijd;
        - *Profielgrootverbruikaansluiting:* Een grootverbruikaansluiting waarbij een profielgrootverbruikmeetinrichting
      aanwezig is;
        - *Profielgrootverbruikmeetinrichting:* Een meetinrichting die voldoet aan de in
      [4.3.4 van de Meetcode elektriciteit][ref31] genoemde eisen;
        - *Prognose:* Een door de aangeslotene of diens BRP per tijdsperiode opgestelde en bij de betreffende netbeheerder
      ingediende planning van de som van afname of invoeding per primaire energiebron per overdrachtspunt van de
      aansluiting of verzamelpunt dat valt onder de verantwoordelijkheid van de aangeslotene of diens BRP;
        - *Programmeringszone Nederland:* Het gebied als bedoeld in artikel 3, tweede lid, onderdeel 91, van de Verordening
      (EU) 2017/1485 (GL SO) voor Nederland, omvattende het geografische gebied van Nederland en de Nederlandse
      exclusieve economische zone (en valt dus samen met de biedzone Nederland);
        - *Raad van bestuur van de mededingingsautoriteit:* [Vervallen]
        - *Reconciliatie:* Verrekening over een bepaalde periode op basis van het verschil tussen het ten behoeve van
      balanceringsverantwoordelijkheid vastgestelde volume en het vastgestelde werkelijke volume tegen een gewogen
      marktprijs per MWh;
        - *Recreatienet:* Een net waarvoor niet op grond van [artikel 10, negende lid, van de Wet][ref32]
      een netbeheerder is aangewezen en waarvan de onroerende zaken als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref33] waarmee het net een
      verbinding vormt ingevolge het bestemmingsplan, de WOZ-beschikking of een notariële akte recreatieve doeleinden
      hebben of ingevolge het bestemmingsplan, de WOZ-beschikking of een notariële akte niet bestemd zijn voor permanente
      bewoning en voor recreatieve doeleinden zijn bestemd;
        - *Referentie biedzone prijs:* Een op grond van de methodologie bedoeld in artikel 45 van de Verordening (EU)
      2015/1222 (GL CACM) vastgestelde prijs die door de netbeheerder van het landelijk hoogspanningsnet wordt toegepast
      voor onbalansverrekening en die kan worden toegepast voor de afwikkeling van andere ondersteunende diensten
      indien de fallback procedure op grond van [artikel 12.16 van de Netcode elektriciteit][ref34] of artikel 44 van
      Verordening (EU) 2015/1222 (GL CACM) van toepassing is;
        - *Referentienummer:* Een door de verzendende partij aan een bericht toe te kennen nummer waarmee het bericht en
      een eventuele reactie daarop in zijn administratie traceerbaar is;
        - *Regelbaar vermogen voor afname-congestie:* Vermogen dat overeenkomstig
      [artikel 9.31, eerste lid, van de Netcode elektriciteit][ref35] voor inzet beschikbaar is;
        - *Regelbaar vermogen voor invoedings-congestie:* Vermogen dat overeenkomstig
      [artikel 9.31, eerste lid, van de Netcode elektriciteit][ref36] voor inzet beschikbaar is, vermeerderd met
      het overige vermogen van elektriciteitsproductie-eenheden dat bij inzet van de verplichting overeenkomstig
      [artikel 9.1, vierde lid, van de Netcode elektriciteit][ref37], met toepassing van een ondergrens van 1 MW,
      beschikbaar is voor het verminderen van elektriciteitsinvoeding;
        - *Regeling betreffende meer dan één NEMO in een biedzone:* De regeling opgenomen in de besluiten ACM/
      DE/2017/201098 en ACM/DE/2017/201104 van 17 februari 2017 van de ACM;
        - *Regeling garanties van oorsprong:* Regeling garanties van oorsprong voor duurzame elektriciteit
      Elektriciteitswet 1998;
        - *Regeling groencertificaten:* [Vervallen]
        - *Regelzone Maasvlakte – Groot-Brittannië:* Het gebied als bedoeld in artikel 2, zesde lid, van de Verordening
      (EU) 543/2013 voor de verbinding Maasvlakte – Groot-Brittannië, omvattende de landsgrensoverschrijdende
      gelijksstroomverbinding met Groot-Brittannië voor zover deze wordt beheerd door de daarvoor aangewezen
      interconnector-beheerder overeenkomstig haar wettelijke taken;
        - *Regelzone Nederland:* Het gebied als bedoeld in artikel 2, zesde lid, van de Verordening (EU) 543/2013 voor
      Nederland, omvattende het landelijk hoogspanningsnet, het net op zee en de landsgrensoverschrijdende netten voor
      zover deze worden beheerd door de netbeheerder van het landelijk hoogspanningsnet;
        - *Regionaal hoogspanningsnet:* Net bestemd voor het transport van elektriciteit op een spanningsniveau van 50 kV
      of hoger, maar lager dan 110 kV en dat als zodanig wordt bedreven;
        - *Regionale netbeheerder:* Een netbeheerder die is aangewezen voor het beheer van één of meer netten, anders dan
      het landelijk hoogspanningsnet;
        - *Rekening:* [Vervallen]
        - *Reparatiemethodiek:* De wijze waarop de meetverantwoordelijke of netbeheerder meetgegevens heeft gecorrigeerd
      of berekend;
        - *Restantvolume:* Het volume dat nog niet toegewezen is, na toewijzing van gemeten afnames en invoedingen,
      berekende afnames en invoedingen en het netverlies;
        - *Restantvolumecorrectiefactor (RCF):* Factor ter verdeling van het restantvolume;
        - *Restspanning:* Laagste waarde van de drie gekoppelde spanningen die optreedt op het netaansluitpunt van een
      productie-installatie tijdens een kortsluiting in het net;
        - *Risicogebied:* Deelgebied in het voor een netbeheerder krachtens [artikel 36][ref38] of
      [37 van de Elektriciteitswet 1998][ref39] vastgestelde gebied waar het risico op lichamelijk letsel ten gevolge van
      een kortsluiting in het laagspanningsnet groter is dan in de rest van het voor hem vastgestelde gebied;
        - *SAP:* All TSOs’ proposal for the establishment of a single Allocation Platform (SAP) in accordance with Article
      49 and for the cost sharing methodology in accordance with Article 59 of Commission Regulation (EU) 2016/1719
      establishing a Guideline on Forward Capacity Allocation, zoals goedgekeurd door de Autoriteit Consument en Markt
      (hierna: de ACM) bij besluit ACM/DE/2017/205795 van 17 oktober 2017;
        - *Schakelstoring:* Een storing in de meetinrichting waardoor de aansturing van de telwerken niet heeft
      plaatsgevonden op de bij het profiel behorende tijden.
        - *Secundair allocatiepunt:* Een door de netbeheerder aan een aansluiting toegekend allocatiepunt, niet zijnde het
      primaire allocatiepunt;
        - *Secundaire bekabeling (van de meetinrichting):* Bekabeling tussen de aansluitklemmen van de secundaire
      wikkelingen van de meettransformatoren en de kWh-meters en in voorkomend geval de kvarh-meters;
        - *Secundair gedeelte van de meetinrichting:* Het deel van de meetinrichting vanaf de aansluitklemmen van de
      secundaire wikkelingen van de meettransformatoren tot en met de kWh-meters en de kvarh-meters en de dagelijks op
      afstand uitleesbare meetinrichting;
        - *Secundaire regeling:* [Vervallen]
        - *Secundair reservevermogen:* [Vervallen]
        - *Spanning Uc:* de door de netbeheerder aangegeven en met de aangeslotene overeengekomen waarde van de spanning;
      Dit is tevens de toegekende spanning, zoals gedefinieerd in de norm “NEN-EN 50160:2010” (“Spanningskarakteristieken
      in openbare elektriciteitsnetten”);
        - *Spanning U:* De nominale spanning “nominal system voltage”, zoals gedefinieerd in de norm “NEN-EN-IEC
      60038” (“CENELEC normen toegekende spanning”);
        - *Spanningsvariatie ΔU:* De maximum snelle spanningsvariatie, zoals gedefinieerd in de norm “NEN-EN-IEC 61000-4-
      30:2015 en” (“Elektromagnetische compatibiliteit (EMC) – Deel 4-30: Beproevingen en meettechnieken – Meetmethode
      van de kwaliteit van de elektriciteitsvoorziening”);
        - *Spanningsvariatie ΔU:* De stationaire snelle spanningsvariatie, zoals gedefinieerd in de norm “NEN-EN-IEC 61000-
      4-30:2015 en” (“Elektromagnetische compatibiliteit (EMC) – Deel 4-30: Beproevingen en meettechnieken – Meetmethode
      van de kwaliteit van de elektriciteitsvoorziening”);
        - *Standaardjaarafname (SJA):* De verwachte afname op een aansluiting bij gestandaardiseerde condities en op basis
      van een genormaliseerd jaar;
        - *Standaardjaarinvoeding (SJI):* De verwachte invoeding op een aansluiting bij gestandaardiseerde condities en op
      basis van een genormaliseerd jaar;
        - *Standaardprofiel:* Een vooraf vastgestelde tijdreeks van profielfracties, voor een bepaalde profielcategorie;
        - *Stroomsommatie (van de meetinrichting):* Het sommeren van meetstromen door parallelschakeling van de secundaire
      wikkelingen van stroomtransformatoren of door toepassing van sommeerstroomtransformatoren;
        - *Switch:* De wisseling van leverancier, BRP of meetverantwoordelijke op een aansluiting;
        - *Syntactisch correct:* Voldoet aan de specificaties, bedoeld in
      [9.1.1 van de Informatiecode elektriciteit en gas][ref40];
        - *Systeemdienstentarief:* [Vervallen]
        - *System operator:* De netbeheerder van het landelijk hoogspanningsnet, waar deze verantwoordelijke is voor het
      leveren van de systeemdiensten;
        - *Tariefcategorie (TC):* Eén van de categorieën volgens [3.7.1 van de Tarievencode elektriciteit][ref41], waarbij
      binnen categorie f: “LS” nog worden onderscheiden de categorieën van aangeslotenen met een meetinrichting met
      enkeltelwerk, aangeslotenen met een meetinrichting met dubbel telwerk die omstreeks 21:00 uur omschakelt van
      normaal- of totaaltelwerk naar laagtelwerk en aangeslotenen met een meetinrichting met dubbel telwerk die omstreeks
      23:00 uur omschakelt van normaal- of totaaltelwerk naar laagtelwerk;
        - *Tariefdrager:* Een element om de aan een deelmarkt toegedeelde kosten bij de aan het netvlak aangesloten
      verbruikers in rekening te brengen;
        - *Tariefperiode (TP):* Een aaneengesloten periode van normaaluren of laaguren;
        - *Tariefzone:* De aanduiding in het aansluitingenregister van het kenmerk van een telwerk, te weten
      normaaltelwerk, totaaltelwerk of laagtelwerk. Ingeval van een enkeltelwerk wordt altijd de aanduiding
      normaaltelwerk gebruikt;
        - *Telemetriegrootverbruikaansluiting:* Een grootverbruikaansluiting die geen profielgrootverbruikaansluiting is;
        - *Telemetriegrootverbruikmeetinrichting:* Een meetinrichting die voldoet aan de in
      [4.3.5 van de Meetcode elektriciteit][ref42] genoemde eisen;
        - *Telwerk:* Een samenstel van cijferrollen bij een Ferrarismeter dan wel een dataregister van een digitale kWh-
      meter waarin de gemeten totale hoeveelheid elektrische energie voor een bepaalde energierichting voor normaaluren
      of laaguren wordt vastgelegd;
        - *Telwerkindicatie:* De identificatie van de onderscheiden telwerken op een meetinrichting: a. Bij een
      handopgenomen meetinrichting zoals zichtbaar op de meter zelf, en; b. Bij een meetinrichting die op afstand
      uitleesbaar is door middel van de OBIS-code;
        - *Toegankelijk meetregister:* Een register, bevattende vastgestelde meterstanden en verbruiken betreffende
      kleinverbruikaansluitingen;
        - *Toestemmingssleutel:* een door de leverancier toegekend uniek kenmerk aan de door hem van de klant ontvangen
      toestemming;
        - *Totaal verondersteld geprofileerd volume (TVGV):* De som van de absolute waarde van alle veronderstelde
      geprofileerde afnames en invoedingen in het net van de netbeheerder;
        - *Totaaltelwerk:* Een telwerk van een kleinverbruikmeetinrichting met twee of meer telwerken dat gebruikt wordt of
      kan worden voor de bepaling van de met het net uitgewisselde energie tijdens normaal- en laaguren tezamen;
        - *Transactiepartij:* Een natuurlijke of rechtspersoon die in het energieprogramma van een BRP als bedoeld in
      [artikel 10.2 van de Netcode elektriciteit][ref43] als partij is vermeld op de grond dat die BRP in dat programma
      een energietransactie met die natuurlijke of rechtspersoon verantwoordt;
        - *Transit:* Elektriciteitstransport door een land als gevolg van een contract tussen partijen in twee andere
      landen, uitgevoerd door de netbeheerder van het landelijk hoogspanningsnet;
        - *Transportdienst:* Het transporteren van elektriciteit van producenten naar verbruikers door gebruik te maken van
      het net. Hieronder wordt mede verstaan het oplossen van fysieke congestie, het compenseren van netverliezen en het
      in stand houden van de spannings- en blindvermogenshuishouding;
        - *Transporttarief:* Het tarief in rekening gebracht door de netbeheerder bij een aangeslotene ter dekking van de
      kosten van de transportdienst;
        - *Type aansluiting:* De aanduiding in het aansluitingenregister of de aansluiting geschikt is voor: a. Uitsluitend
      transport van elektriciteit of gas vanuit het net naar de aangesloten installatie, of; b. Uitsluitend transport van
      elektriciteit of gas vanuit de aangesloten installatie naar het net, of; c. Een combinatie van beide;
        - *Uitgelezen meterstand:* Een meterstand die met behulp van elektronische hulpmiddelen ter plaatse van de
      meetinrichting of op afstand is uitgelezen;
        - *Uithuizing:* Een verhuizing waarbij een (rechts)persoon een onroerende zaak verlaat en de
      beschikkingsbevoegdheid over de aansluiting beëindigt;
        - *Uit-switch:* [Vervallen]
        - *Uitwisseling met het buitenland:* De som van alle importen uit het buitenland van elektrische energie verminderd
      met de som van alle exporten naar het buitenland van elektrische energie;
        - *Validatiestatus:* Het resultaat van de datavalidatie door de meetverantwoordelijke van de betreffende
      meetgegevens;
        - *Vastgesteld afnametype:* De bepaling per aansluiting of sprake is van afname met invoeding of afname zonder
      invoeding;
        - *Vastgestelde meterstand:* Een meterstand die na collectie en succesvolle validatie is vastgesteld door:
      a. Het meetbedrijf (ingeval deze meterstand betrekking heeft op een kleinverbruikmeetinrichting) of b. De
      meetverantwoordelijke (ingeval deze meterstand betrekking heeft op een grootverbruikmeetinrichting);
        - *Verbruiker:* Een aangeslotene die elektrische energie afneemt van het net;
        - *Verliesbericht:* Het bericht waarmee de netbeheerder aan de oude leverancier, oude BRP of oude
      meetverantwoordelijke aankondigt dat de desbetreffende marktpartij met ingang van de datum in het verliesbericht de
      rechten en plichten voor de in het verliesbericht vermelde aansluiting zal verliezen;
        - *Vermenigvuldigingsfactor:* In geval van elektriciteit het samenstel van alle correctiefactoren met betrekking
      tot de fysieke meting die nodig zijn om uit de tellerstanden de daadwerkelijke hoeveelheid met het net
      uitgewisselde energie te kunnen vaststellen; In geval van gas het product van alle specifiek voor de meetinrichting
      van toepassing zijnde factoren op telwerkniveau met uitzondering van de volumeherleidingsfactor om tot een
      normaalvolume te komen;
        - *Verondersteld geprofileerde afname (VGA):* De profielfractie voor afname (PFA) vermenigvuldigd met de som van de
      standaardjaarafnames van alle allocatiepunten per BRP per leverancier per netgebied in een profielcategorie;
        - *Verondersteld geprofileerde invoeding (VGI):* De profielfractie voor invoeding (PFI) vermenigvuldigd met
      de som van de standaardjaarinvoedingen van alle allocatiepunten per BRP per leverancier per netgebied in een
      profielcategorie;
        - *Verordening:* [Vervallen]
        - *Verordening (EU) 2015/1222 (GL CACM):* Verordening (EU) 2015/1222 van de Commissie van 24 juli 2015 tot
      vaststelling van richtsnoeren betreffende capaciteitstoewijzing en congestiebeheer;
        - *Verordening (EU) 2016/631 (NC RfG):* Verordening (EU) 2016/631 van de Commissie van 14 april 2016 tot
      vaststelling van een netcode betreffende eisen voor de aansluiting van elektriciteitsproducenten op het net;
        - *Verordening (EU) 2016/1388 (NC DCC):* Verordening (EU) 2016/1388 van de Commissie van 17 augustus 2016 tot
      vaststelling van een netcode voor aansluiting van verbruikers;
        - *Verordening (EU) 2016/1447 (NC HVDC):* Verordening (EU) 2016/1447 van de Commissie van 26 augustus 2016 tot
      vaststelling van een netcode betreffende eisen voor de aansluiting op het net van hoogspanningsgelijkstroomsystemen
      en op gelijkstroom aangesloten power park modules;
        - *Verordening (EU) 2016/1719 (GL FCA):* Verordening (EU) 2016/1719 van de Commissie van 26 september 2016 tot
      vaststelling van richtsnoeren betreffende capaciteitstoewijzing op de lange termijn;
        - *Verordening (EU) 2017/1485 (GL SO):* Verordening (EU) 2017/1485 van de Commissie van 2 augustus 2017 tot
      vaststelling van richtsnoeren betreffende het beheer van elektriciteitstransmissiesystemen;
        - *Verordening (EU) 2017/2195 (GL EB):* Verordening (EU) 2017/2195 van de Commissie van 28 november 2017 tot
      vaststelling van richtsnoeren voor elektriciteitsbalancering;
        - *Verordening (EU) 2017/2196 (NC ER):* Verordening (EU) 2017/2196 van de Commissie van 28 november 2017 tot
      vaststelling van een netcode voor de noodtoestand en het herstel van het elektriciteitsnet;
        - *Verordening (EU) 543/2013:* Verordening (EU) Nr. 543/2013 van de commissie van 14 juni 2013 betreffende de
      toezending en publicatie van gegevens inzake de elektriciteitsmarkten en houdende wijziging van bijlage I bij
      [Verordening (EG) nr. 714/2009](32009R0714) van het Europees parlement en de Raad;
        - *Verwervingsbericht:* Het bericht waarmee de netbeheerder aan de nieuwe leverancier, nieuwe BRP of nieuwe
      meetverantwoordelijke bevestigt dat de desbetreffende marktpartij met ingang van de datum in het verwervingsbericht
      de rechten en plichten voor de in het verwervingsbericht vermelde aansluiting zal verkrijgen;
        - *Verzamelpunt:* Een punt in het net, aan te wijzen door de netbeheerder, dat gebruikt kan worden door de BRP’s
      voor het opgeven van hun prognoses zijnde de som van de prognoses van de netaansluitpunten van die BRP op lager
      gelegen spanningsniveaus achter het desbetreffende punt;
        - *Voorzieningsgebied:* Het gebied of de gebieden zoals genoemd in de aanwijzing van de netbeheerder;
        - *Vrije afnemer:* [Vervallen]
        - *Werkdag:* Een dag, niet zijnde een zaterdag of een zondag en niet zijnde een algemeen erkende feestdag als
      bedoeld in [artikel 3, eerste lid, van de Algemene Termijnenwet][ref44], noch een in het tweede of krachtens het
      derde lid van genoemd artikel met een algemeen erkende feestdag gelijkgestelde dag;
        - *Wet:* De [Elektriciteitswet 1998][ref45];
        - *XBID-project:* Het XBID-project zoals gedefinieerd in artikel 2 van de regeling betreffende meer dan één NEMO in
      een biedzone.


