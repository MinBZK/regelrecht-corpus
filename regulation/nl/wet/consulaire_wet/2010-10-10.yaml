$id: consulaire_wet
regulatory_layer: WET
publication_date: '2019-02-15'
valid_from: '2010-10-10'
bwb_id: BWBR0001847
url: https://wetten.overheid.nl/BWBR0001847/2010-10-10
preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is de bevoegdheid der consulaire ambtenaren tot het
    opmaken van burgerlijke akten, en de consulaire regtsmagt bij eene wet te regelen;

    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Aan de consulaire ambtenaren, bij algemene maatregel van rijksbestuur aan te wijzen, wordt toegekend:'
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel1
  - number: 1.1.a
    text: de bevoegdheid tot het opmaken van akten van de burgerlijke stand,
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel1
  - number: 1.1.b
    text: de bevoegdheid tot het opmaken van andere burgerlijke akten,
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel1
  - number: 1.1.c
    text: |-
      de bevoegdheid tot het verrichten van bepaalde handelingen van vrijwillige rechtspraak in burgerlijke zaken, in
      Nederland aan kantonrechters en in de landen Aruba, Curaçao of Sint Maarten of in de openbare lichamen Bonaire,
      Sint Eustatius en Saba aan leden van het gerecht in eerste aanleg opgedragen.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel1
  - number: '1.2'
    text: |-
      Evenzo kan bij algemene maatregel van rijksbestuur een bepaalde onder a of b begrepen bevoegdheid afzonderlijk aan
      consulaire ambtenaren worden verleend.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel1
  - number: '1.3'
    text: |-
      Rechtspraak bij andere wetten aan diplomatieke en consulaire ambtenaren opgedragen, wordt uitgeoefend
      overeenkomstig de regelen van deze wet.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel1
  - number: '1.4'
    text: |-
      De consulaire ambtenaren oefenen een hun toegekende bevoegdheid uit binnen het ressort dat Onze Minister van
      Buitenlandse Zaken voor de consulaire post waaraan zij verbonden zijn, heeft vastgesteld, en slechts ten behoeve
      van daarin aanwezige Nederlanders.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel1
  - number: '1.5'
    text: Een consulaire ambtenaar mag scheidsman zijn.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel1
  - number: '2'
    text: |-
      Onder consulaire ambtenaren verstaat deze wet de aan het hoofd van consulaire posten gestelde diplomatieke en
      consulaire ambtenaren en de verdere leden van het personeel van de buitenlandse dienst, die aan een consulaire post
      een consulaire betrekking bekleden.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel2
  - number: '3'
    text: |-
      Bij afwezigheid of verhindering van de, ingevolge [art. 1][ref1] aangewezen, consulaire ambtenaar, wordt
      deze vervangen door de ter plaatse zijner vestiging aanwezige consulaire ambtenaar van mindere rang, en, bij
      ontstentenis van zodanige ambtenaar, door de persoon, die tot het waarnemen zijner betrekking aangewezen is.


      [ref1]: https://wetten.overheid.nl/BWBR0001847#Artikel1
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001847
        artikel: '1'
        hoofdstuk: Eerste
  - number: '4'
    text: |-
      Ter vervulling van zijn in [artikel 1][ref1] genoemde bevoegdheden kan een consulaire ambtenaar een tolk benoemen
      of, bij voorkomende omstandigheden, een persoon tijdelijk met de betrekking van tolk belasten.


      [ref1]: https://wetten.overheid.nl/BWBR0001847#Artikel1
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001847
        artikel: '1'
        hoofdstuk: Eerste
  - number: '5'
    text: |-
      De tolk, krachtens het voorgaande artikel benoemd of aangewezen, legt, alvorens zijn betrekking te aanvaarden, in
      handen van de consulaire ambtenaar de eed (de belofte) af, dat hij die betrekking getrouw zal waarnemen.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel5
  - number: '7.1'
    text: |-
      Grossen van overeenkomstig [artikel 17][ref1] opgemaakte akten voeren aan het hoofd de woorden "In naam des
      Konings".


      [ref1]: https://wetten.overheid.nl/BWBR0001847#Artikel17
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001847
        artikel: '17'
        hoofdstuk: Tweede
  - number: '7.2'
    text: |-
      Deze grossen en grossen van uit kracht van de wet door een consulaire ambtenaar gedane uitspraken zijn in het
      Koninkrijk uitvoerbaar, mits in behoorlijke vorm opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel7
  - number: '7.3'
    text: |-
      Na het wijzen van een scheidsrechterlijke uitspraak zendt de consulaire ambtenaar deze uitspraak, met een afschrift
      van zijn schriftelijke benoeming als scheidsman door de partijen of met een authentiek afschrift daarvan, aan
      de president van de arrondissementsrechtbank te ’s-Gravenhage die daarop een bevelschrift stelt als bedoeld in
      [artikel 642 van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref1], dan wel een overeenkomstige
      regeling in de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '642'
  - number: '8'
    text: |-
      Voor alle uitspraken en akten, uit kracht van de wet door consulaire ambtenaren opgemaakt of verleden, is het
      gebruik van elke levende taal geoorloofd, mits de gebezigde taal wordt verstaan door de partijen en door allen die
      bij het opmaken of verlijden der akten verschijnen ofwel de inhoud aan hen die de gebezigde taal niet verstaan,
      wordt vertolkt door een volgens [artikel 5][ref1] beëdigde tolk.


      [ref1]: https://wetten.overheid.nl/BWBR0001847#Artikel5
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001847
        artikel: '5'
        hoofdstuk: Eerste
  - number: '9'
    text: |-
      Bij de uitoefening van rechtspraak en het verrichten van andere handelingen van rechters neemt de consulaire
      ambtenaar zoveel mogelijk de voorschriften in acht die in de[ twaalfde titel van het Eerste Boek van het
      Nederlandse Wetboek van Burgerlijke Rechtsvordering](onbekend) aan rechters en griffiers zijn gegeven, dan wel een
      overeenkomstige regeling in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel9
  - number: '10.1'
    text: |-
      Door een consulaire ambtenaar als getuige opgeroepen binnen het consulaire ressort aanwezige Nederlanders die geen
      geldige reden van verschoning hebben, moeten verschijnen en onder ede (belofte) de gehele waarheid en niets dan de
      waarheid zeggen.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel10
  - number: '10.2'
    text: |-
      Een door een consulaire ambtenaar benoemde deskundige die zijn benoeming aanneemt moet, onder ede (belofte) de hem
      toevertrouwde last naar geweten vervullen.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel10
  - number: '10.3'
    text: |-
      De consulaire ambtenaar is bevoegd binnen het consulaire ressort aanwezige Nederlanders op te roepen die
      echtgenoot, bloed- of aanverwant, voogd, toeziende voogd, curator, bijzondere curator of toeziende curator zijn van
      degene over wiens rechten een zaak behandeld wordt. De opgeroepene die geen geldige reden van verschoning heeft, is
      verplicht in persoon of, waar de wet zulks toelaat, bij gemachtigde te verschijnen.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Een consulaire ambtenaar kan worden gewraakt op een of meer der in
      [artikel 30 van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref1] genoemde gronden, dan wel een
      overeenkomstige regeling in de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel30
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '30'
  - number: '11.2'
    text: |-
      Op de wraking beslist de onmiddellijk boven hem gestelde ambtenaar of bij gebreke daarvan de secretaris-generaal
      van het Departement van Buitenlandse Zaken, zonder mogelijkheid van beroep.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      Indien een consulaire ambtenaar zich verschoont of indien zijn wraking gegrond bevonden wordt, voorziet de
      onmiddellijk boven hem gestelde ambtenaar of bij gebreke daarvan de secretaris-generaal van het Departement
      van Buitenlandse Zaken in zijn vervanging door een andere consulaire ambtenaar die niet aan de eerstgenoemde
      ondergeschikt mag zijn.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel11
  - number: 11a.1
    text: |-
      Alle vonnissen en beschikkingen van een consulaire ambtenaar zijn bij voorraad uitvoerbaar, voor zover hij niet
      anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel11a
  - number: 11a.2
    text: |-
      Van de einduitspraken van een consulaire ambtenaar kan gedurende drie maanden na de uitspraak bij beroepschrift
      hoger beroep worden ingesteld bij de arrondissements-rechtbank te ’s-Gravenhage of, indien het recht van Aruba,
      Curaçao of Sint Maarten of van de openbare lichamen Bonaire, Sint Eustatius en Saba is toegepast, bij het gerecht
      in eerste aanleg in het betrokken rijksdeel. Tegen einduitspaken die een voorlopige beslissing behelzen, staat geen
      rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel11a
  - number: 11b
    text: |-
      Alle uitspraken en akten, uit kracht van de wet door consulaire ambtenaren opgemaakt of verleden zijn geldig, ook
      wanneer de bij de Nederlandse wetten of in voorkomend geval de bij de Nederlandse, Arubaanse, Curaçaose of Sint
      Maartense wettelijke bepalingen voorgeschreven formaliteiten daarbij niet in acht zijn genomen, mits in dit geval
      in het stuk de redenen vermeld zijn waarom het verzuim der voorgeschreven formaliteiten onvermijdelijk was.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel11b
  - number: '12.1'
    text: |-
      Een consulaire ambtenaar is, voorzover hem de bevoegdheid tot het opmaken van akten van de burgerlijke stand is
      toegekend, bevoegd tot de verrichtingen, aan de ambtenaren van de burgerlijke stand bij Nederlandse, Arubaanse,
      Curaçaose of Sint Maartense wettelijke bepalingen opgedragen.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      De aldus, overeenkomstig die wettelijke bepalingen, door hem opgemaakte akten van de burgerlijke stand hebben
      gelijke kracht, als waren zij in het Koninkrijk opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel12
  - number: '12.3'
    text: De aangiften van geboorte in de consulaire ressorten moeten binnen dertig dagen na de bevalling worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel12
  - number: '13'
    text: |-
      Indien een aanstaande echtgenoot die Nederlander is, in het tijdvak van zes maanden voorafgaande aan de dag der
      huwelijksvoltrekking woonplaats binnen het Koninkrijk heeft gehad, verzoekt de consulaire ambtenaar, te wiens
      overstaan het huwelijk zal worden voltrokken, de ambtenaren van de burgerlijke stand van de plaatsen, waar
      die aanstaande echtgenoot in dat tijdvak woonplaats binnen het Koninkrijk heeft gehad, zorg te dragen voor de
      afkondiging van het voorgenomen huwelijk in hun standplaats.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel13
  - number: '14.1'
    text: |-
      De door de consulaire ambtenaren opgemaakte akten van de burgerlijke stand worden in één of meer registers
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel14
  - number: '14.2'
    text: |-
      De voorschriften, bij of krachtens het Burgerlijk Wetboek vastgesteld voor het houden van registers van de
      burgerlijke stand, daaronder begrepen het afgeven van afschriften of uittreksels, zijn - zoveel als dit, gelet op
      het toepasselijke materiële recht, mogelijk is - van toepassing. De registers worden gewaarmerkt en gekanttekend
      door een daartoe door Onze Minister van Buitenlandse Zaken aan te wijzen ambtenaar van dat Departement.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel14
  - number: '14.3'
    text: |-
      Een der dubbelen wordt bewaard in de archieven van het consulaire post; het andere aan Onze voornoemde Minister
      opgezonden, door wiens tussenkomst het ter griffie van de arrondissements-rechtbank te *’s-Gravenhage* wordt
      overgebracht.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel14
  - number: '15'
    text: |-
      De volmachten en andere stukken, welke bij de akten van de burgerlijke stand worden gevorderd, blijven aangehecht
      aan de registers, welke ter griffie van de arrondissements-rechtbank te *’s-Gravenhage* moeten worden overgebracht.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel15
  - number: '16'
    text: |-
      Ten opzichte van de in het vorig artikel bedoelde registers worden aan de griffier der arrondissements-rechtbank te
      *’s-Gravenhage* dezelfde verplichtingen opgelegd als met betrekking tot de overige ter griffie dier rechtbank zich
      bevindende registers van de burgerlijke stand op hem rusten.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel16
  - number: 16a.1
    text: |-
      Van de verzoeken tot doorhaling van een akte in of tot aanvulling of verbetering van de registers van de
      burgerlijke stand die binnen een consulair ressort zijn of hadden moeten worden gehouden, neemt de arrondissements-
      rechtbank te ’s-Gravenhage kennis, behoudens hoger beroep.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel16a
  - number: 16a.2
    text: |-
      [Artikel 29 van boek 1 van het Nederlands Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel29
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '29'
  - number: '17.1'
    text: |-
      Een consulaire ambtenaar is, voor zover hem de bevoegdheid tot het opmaken van andere burgerlijke akten dan die van
      de burgerlijke stand is toegekend, bevoegd tot verrichtingen, aan de notaris bij Nederlandse, Arubaanse, Curaçaose
      of Sint Maartense wettelijke bepalingen opgedragen.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel17
  - number: '17.2'
    text: |-
      De door hem of te zijnen overstaan overeenkomstig die wettelijke bepalingen verleden akten hebben gelijke kracht
      als waren zij in het Koninkrijk verleden.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel17
  - number: '18'
    text: |-
      De door Nederlanders binnen het ressort van een in het vorige artikel vermelde ambtenaar overeenkomstig de
      voorschriften van het Nederlandse, Arubaanse, Curaçaose of Sint Maartense recht opgemaakte olographische en geheime
      testamenten zijn geldig, na bij die ambtenaar in bewaring te zijn gesteld, mede met inachtneming van hetgeen
      daarover in het Nederlandse, Nederlands-Antilliaanse of Arubaanse recht is bepaald.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel18
  - number: 19a.1
    text: 'De consulaire ambtenaren, voor zover zij bevoegd zijn tot het opmaken van:'
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.1.a
    text: openbare akten bevattende uiterste willen of herroeping van uiterste willen,
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.1.b
    text: akten van superscriptie,
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.1.c
    text: akten bevattende bewaargeving of teruggave van uiterste willen,
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.1.d
    text: |-
      akten van giften van de gehele of gedeeltelijke nalatenschap, de gift van een of meer goederen uit de nalatenschap
      daaronder begrepen,
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.1.e
    text: |-
      akten van benoeming ingaande bij overlijden, zijn verplicht uiterlijk op de eerste werkdag volgende op die waarop
      zij zulk een akte hebben opgemaakt aan Onze Minister van Buitenlandse Zaken op een door Onze Minister van Justitie
      vastgesteld formulier in tweevoud opgave te doen van de in het volgende lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.2
    text: 'Deze gegevens zijn:'
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.2.1°
    text: het nummer waaronder de akte in het door de consulaire ambtenaar gehouden repertorium is vermeld,
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.2.2°
    text: de datum van de akte en de soort van de akte, naar de onderscheiding van het vorige lid,
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.2.3°
    text: |-
      de eerste drie voornamen, het aantal van de voornamen, en de naam, geboorteplaats, geboortedatum en woonplaats van
      de persoon die de akte deed opmaken, voor zover deze gegevens zijn opgenomen, of een verklaring dat en waarom deze
      niet kunnen worden opgegeven,
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.2.4°
    text: de voorletters, naam, ambtsbetrekking en standplaats van de consulaire ambtenaar die de akte heeft opgemaakt,
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.2.5°
    text: |-
      indien een openbare akte bevattende een uiterste wil of herroeping van een uiterste wil is opgemaakt, de mededeling
      of bij deze akte alle vorige uiterste willen al dan niet zijn herroepen.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.3
    text: |-
      Onze Minister van Buitenlandse Zaken zendt de ontvangen opgaven onverwijld naar het testamentenregister, dan wel
      een overeenkomstig register in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: 19a.4
    text: |-
      Van een in dit artikel bedoelde opgave wordt op de dag, waarop zij is geschied, in het repertorium aantekening
      gedaan.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel19a
  - number: '20'
    text: Deze wet kan worden aangehaald onder de titel van Consulaire Wet.
    url: https://wetten.overheid.nl/BWBR0001847/2010-10-10#Artikel20
