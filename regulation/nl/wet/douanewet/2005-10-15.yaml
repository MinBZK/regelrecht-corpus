preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de douanewetgeving te herzien en daarbij regels vast te
    stellen voor de goede werking van verordening (EEG) nr. 2913/92 van de Raad van de Europese Gemeenschappen van 12
    oktober 1992 tot vaststelling van het communautair douanewetboek (PbEG L 302), verordening (EEG) nr. 2658/87 van de
    Raad van de Europese Gemeenschappen van 23 juli 1987 met betrekking tot de tarief- en statistieknomenclatuur en het
    gemeenschappelijk douanetarief (PbEG L 256), internationale overeenkomsten en autonome regelingen van de Europese
    Gemeenschappen op het gebied van tariefpreferenties, tariefschorsingen, tariefcontingenten en retaliatierechten,
    verordening (EEG) nr. 918/83 van de Raad van de Europese Gemeenschappen van 28 maart 1983 betreffende de instelling
    van een communautaire regeling inzake douanevrijstellingen (PbEG L 105), verordening (EG) nr. 3283/94 van de Raad
    van de Europese Unie van 22 december 1994 inzake beschermende maatregelen tegen invoer met dumping uit landen die
    geen lid zijn van de Europese Gemeenschap (PbEG L 349), verordening (EG) nr. 3284/94 van de Raad van de Europese
    Unie van 22 december 1994 inzake beschermende maatregelen tegen invoer met subsidiëring uit landen die geen lid
    zijn van de Europese Gemeenschap (PbEG L 349), beschikking nr. 2424/88/EGKS van de Commissie van de Europese
    Gemeenschappen van 29 juli 1988 betreffende beschermende maatregelen tegen invoer met dumping of subsidiëring uit
    landen die geen lid zijn van de Europese Gemeenschap voor Kolen en Staal (PbEG L 209) en, voor zover het betreft de
    regelingen van de Europese Gemeenschappen inzake het handelsverkeer met derde landen of lidstaten van de Europese
    Unie waarvoor in de desbetreffende toetredingsakten overgangsmaatregelen zijn voorzien, uitwerking te geven aan
    verordeningen en besluiten op het gebied van heffingen van gelijke werking die bij de invoer van goederen van
    toepassing zijn, alsmede regelingen op het gebied van de landbouwheffingen en andere belastingen bij invoer die
    zijn vastgesteld in het kader van het gemeenschappelijk landbouwbeleid of in het kader van specifieke regelingen
    die op bepaalde door verwerking van landbouwprodukten verkregen goederen van toepassing zijn;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De bepalingen van deze wet zijn van toepassing op de rechten bij invoer en de rechten bij uitvoer ten einde de
      goede werking van het ter zake geldende recht van de Europese Gemeenschappen te waarborgen.

      2 In deze wet en de daarop berustende bepalingen wordt verstaan onder rechten bij invoer:

      a. douanerechten in de zin van het vierde lid en heffingen van gelijke werking die bij de invoer van goederen van
      toepassing zijn;

      b. landbouwheffingen en andere belastingen bij invoer die zijn vastgesteld in het kader van het gemeenschappelijk
      landbouwbeleid of in dat van de specifieke regelingen die op bepaalde door verwerking van landbouwprodukten
      verkregen goederen van toepassing zijn.

      3 In deze wet en de daarop berustende bepalingen wordt verstaan onder rechten bij uitvoer:

      a. douanerechten en heffingen van gelijke werking die bij de uitvoer van goederen van toepassing zijn;

      b. landbouwheffingen en andere belastingen bij uitvoer die zijn vastgesteld in het kader van het gemeenschappelijk
      landbouwbeleid of in dat van de specifieke regelingen die op bepaalde door verwerking van landbouwprodukten
      verkregen goederen van toepassing zijn.

      4 Onder de naam "douanerechten" wordt een belasting geheven overeenkomstig hetgeen dienaangaande, mede onder de
      benaming invoerrecht, is bepaald bij of krachtens het Koninkrijk verbindende verdragen en in al hun onderdelen
      verbindende besluiten van bij zodanige verdragen opgerichte volkenrechtelijke organisaties.

      5 Hetgeen in deze wet en de daarop berustende bepalingen is bepaald ten aanzien van de rechten bij invoer, is van
      overeenkomstige toepassing op de rechten bij uitvoer, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel1
  - number: '2'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder Communautair douanewetboek: [verordening
      (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992 tot vaststelling van
      het communautair douanewetboek (*PbEG* L 302).

      2 In deze wet en de andere wetten inzake de rechten bij invoer en de rechten bij uitvoer, alsmede de daarop
      berustende bepalingen, wordt in aanvulling op de begripsbepalingen van het Communautair douanewetboek verstaan
      onder:

      a. wettelijke bepalingen: de bepalingen inzake de rechten bij invoer en de rechten bij uitvoer, waaronder begrepen
      de regelingen bedoeld in [artikel 1, vierde lid][ref1];

      b. toepassingsverordening Communautair douanewetboek: [verordening (EEG) nr. 2454/93](31993R2454) van de Commissie
      van de Europese Gemeenschappen van 2 juli 1993 houdende vaststelling van enkele bepalingen ter uitvoering van
      [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen tot vaststelling van het
      communautair douanewetboek (*PbEG* L 253);

      c. landbouwheffingen: zowel landbouwheffingen als andere belastingen bij invoer die zijn vastgesteld in het kader
      van het gemeenschappelijk landbouwbeleid of in dat van specifieke regelingen die op bepaalde door verwerking van
      landbouwprodukten verkregen goederen van toepassing zijn;

      d. anti-dumpingheffingen en compenserende heffingen: heffingen die zijn ingesteld krachtens [verordening (EG) nr.
      384/96](31996R0384) van de Raad van de Europese Unie van 22 december 1995 betreffende beschermende maatregelen
      tegen invoer met dumping uit landen die geen lid zijn van de Europese Gemeenschap (PbEG 1996 L 56) of [verordening
      (EG) nr. 2026/97](31997R2026) van de Raad van de Europese Unie van 6 oktober 1997 betreffende bescherming tegen
      invoer met subsidiëring uit landen die geen lid van de Europese Gemeenschap zijn (PbEG L 288);

      e. besloten terreinen: terreinen die door gebouwen dan wel door muren, schuttingen of dergelijke afsluitingen van
      de openbare landweg zijn afgescheiden;

      f. erf: het onmiddellijk aan een woning of ander gebouw gelegen, daarbij behorende en daarmede in gebruik zijnde
      terrein;

      g. schip: elk vaartuig, hoe ook genaamd en van welke aard ook.

      3 In deze wet en de andere wetten inzake de rechten bij invoer en de rechten bij uitvoer, alsmede de daarop
      berustende bepalingen, wordt mede verstaan onder:

      a. gebouwen: onroerende tanks, alsmede de daarbij behorende leidingen;

      b. terreinen: wateren;

      c. werktuigen: voor bewaring van goederen dienende grondvaten, tanks, bakken en dergelijke ruimtehoudende lichamen;

      d. identificatiemaatregelen: sluitingen.

      4 Goederen die, zonder te worden verplaatst, zich elders bevinden dan in of op een gebouw, erf of besloten terrein
      worden in ieder geval geacht in vervoer te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel1
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel2
    references:
