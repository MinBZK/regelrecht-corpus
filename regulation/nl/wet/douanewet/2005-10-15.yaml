        artikel: '2'
  - number: '14'
    text: |-
      1 Aan onderzoek door de inspecteur zijn mede onderworpen vervoermiddelen, de zich daarin of daarop bevindende
      goederen en goederen in vervoer, alsmede de daarop betrekking hebbende bescheiden waarvan de kennisneming van
      belang kan zijn voor de heffing van de rechten bij invoer.

      2 Ten behoeve van het onderzoek is, op vordering van de inspecteur, gedaan overeenkomstig bij ministeriële regeling
      te stellen regels:

      a. de gezagvoerder van een schip gehouden het schip terstond vaart te doen minderen, te doen bijdraaien of te doen
      stilhouden en aanleggen;

      b. de bestuurder van een ander vervoermiddel dan een schip gehouden dit terstond te doen stilhouden en, indien het
      vervoermiddel door mechanische kracht wordt voortbewogen, de motor buiten werking te stellen;

      c. de persoon die goederen vervoert die zich niet in of op een vervoermiddel bevinden gehouden terstond stil te
      staan.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel14
  - number: '15'
    text: |-
      1 Bij het onderzoek, bedoeld in [artikel 14, eerste lid][ref1], mag een woning die aanwezig is op of in
      het vervoermiddel zonder toestemming van de bewoner slechts worden binnengetreden door ambtenaren van de
      rijksbelastingdienst die door de inspecteur zijn aangewezen.

      2 De inspecteur is bevoegd tot het geven van een machtiging als bedoeld in
      [artikel 2 van de Algemene wet op het binnentreden][ref2]. Ten aanzien van uit zee binnenkomende en ter zee
      uitgaande vervoermiddelen kan die bevoegdheid mede worden uitgeoefend door een door Onze Minister aangewezen
      inspecteur.

      3 Ten aanzien van alle binnenkomende en uitgaande vervoermiddelen zijn de [artikelen 5, eerste lid][ref3], en
      [7 van de Algemene wet op het binnentreden][ref4] niet van toepassing.


