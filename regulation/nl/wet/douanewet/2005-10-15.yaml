        artikel: '48'
        hoofdstuk: '6'
  - number: '60'
    text: Deze wet treedt in werking op een bij wet te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel60
  - number: '61'
    text: 'Deze wet wordt aangehaald als: Douanewet.'
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel61
