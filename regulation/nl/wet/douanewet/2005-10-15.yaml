  - number: '54'
    text: |-
      Ter zake van de compenserende interesten, bedoeld in de artikelen 589 en 709 van de toepassingsverordening
      Communautair douanewetboek, is [artikel 36][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel36
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel54
