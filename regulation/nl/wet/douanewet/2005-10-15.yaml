  - number: '51'
    text: |-
      1 Degene die van goederen waaraan herkenningsmiddelen of denatureringsmiddelen zijn toegevoegd, die
      herkenningsmiddelen of denatureringsmiddelen daarvan geheel of ten dele afscheidt, de werking ervan geheel of ten
      dele opheft of verandert, wordt gestraft met geldboete van de derde categorie.

      2 Degene die een der in het eerste lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf van
      ten hoogste twee jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig geheven rechten bij invoer.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel51
  - number: 51a
    text: |-
      Het recht tot strafvervolging op de voet van dit hoofdstuk, of ingevolge de [artikelen 70][ref1] en
      [71 van de Algemene wet inzake rijksbelastingen][ref2], met betrekking tot een verzuim of een vergrijp als bedoeld
      in [hoofdstuk 5][ref3] van deze wet, vervalt ten aanzien van degene aan wie de inspecteur ter zake van dat verzuim
      of dat vergrijp reeds een bestuurlijke boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0007632#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel51a
