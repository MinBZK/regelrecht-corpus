  - number: '53'
    text: |-
      1 Indien met betrekking tot goederen onder douanetoezicht de belanghebbende bij de goederen nalaat de bij
      wettelijke bepalingen voorgeschreven verplichtingen na te komen, kunnen de goederen door de inspecteur in bewaring
      worden genomen. Indien de belanghebbende bij de goederen bekend is, wordt tot de inbewaringneming niet overgegaan
      voordat deze is aangemaand de verplichtingen binnen een bij de aanmaning gestelde termijn na te komen.

      2 [Artikel 52, derde lid][ref1], is bij de inbewaringneming van overeenkomstige toepassing. Indien de
      belanghebbende bij de goederen bekend is, wordt mededeling omtrent de inbewaringneming aan belanghebbende gedaan.

      3 Indien niet binnen zes maanden na de mededeling omtrent de inbewaringneming de verplichtingen alsnog zijn
      nagekomen, kunnen de goederen overeenkomstig bij ministeriële regeling te stellen regels worden verkocht of in
      bijzondere gevallen worden vernietigd.

      4 De in het derde lid vermelde termijn geldt niet, indien de goederen aan spoedige, aanmerkelijke,
      waardevermindering onderhevig zijn of indien de bewaring of het onderhoud ervan gevaar oplevert dan wel hoge kosten
      meebrengt.

      5 De opbrengst der goederen - in geval van uitoefening van het recht van verhaal hetgeen is overgebleven - wordt,
      na aftrek van de kosten en van een bij algemene maatregel van bestuur vast te stellen vergoeding, uitgekeerd aan
      de belanghebbende bij de goederen die binnen drie jaren na de mededeling omtrent de inbewaringneming zulks vordert,
      bij gebreke waarvan de opbrengst of hetgeen is overgebleven aan de staat vervalt. Voor zover de goederen na het
      verstrijken van die termijn niet zijn verkocht, vervallen de goederen aan de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel52
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '52'
        hoofdstuk: '7'
  - number: 53a
    text: |-
      [Afdeling 5.3 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de in de [artikelen 52][ref2] en
      [53][ref3] bedoelde bevoegdheden.


