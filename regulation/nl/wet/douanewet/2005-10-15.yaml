  - number: '55'
    text: |-
      Het doen van aangifte als bedoeld in de artikelen 43 en 59, eerste lid, van het Communautair douanewetboek, is geen
      aanvraag in de zin van [artikel 1:3, derde lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel13
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 1:3
  - number: '56'
    text: |-
      Indien ingevolge artikel 198 van het Communautair douanewetboek aanvulling dan wel vervanging van de gestelde
      zekerheid wordt geëist, draagt belanghebbende er zorg voor dat deze aanvulling dan wel vervanging geschiedt binnen
      vier weken nadat deze eis is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel56
  - number: '57'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de talen waarin aangiften kunnen worden
      gedaan.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel57
  - number: '58'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wettelijke
      bepalingen nadere regels worden gesteld ter aanvulling van de in de wettelijke bepalingen geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel58
  - number: '59'
    text: |-
      Ten aanzien van de invordering van de rechten bij invoer en de rechten bij uitvoer blijft [artikel 48][ref1] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel48
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel59
    references:
