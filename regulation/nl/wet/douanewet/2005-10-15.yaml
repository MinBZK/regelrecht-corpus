        artikel: '1'
        hoofdstuk: '1'
  - number: '3'
    text: |-
      Indien in wettelijke bepalingen is voorzien dat nationale voorschriften van toepassing zijn dan wel dat de bevoegde
      ministers of de bevoegde autoriteiten van de lid-staten algemeen verbindende voorschriften vaststellen of kunnen
      vaststellen, kunnen die voorschriften worden vastgesteld bij algemene maatregel van bestuur of bij ministeriële
      regeling.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel3
  - number: '4'
    text: |-
      1 Indien in wettelijke bepalingen is voorzien dat bevoegdheden inzake de toepassing van die bepalingen zijn
      opgedragen aan de bevoegde autoriteiten, de douaneautoriteiten of de douanediensten van de lid-staten, worden die
      bevoegdheden uitgeoefend door de inspecteur onderscheidenlijk de ontvanger.

      2 Van het eerste lid kan worden afgeweken bij ministeriële regeling voor zover de aard van de bevoegdheid daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel4
  - number: '5'
    text: |-
      1 De inspecteur kan een aangifte tot plaatsing onder een douaneregeling die bij hem wordt ingediend op de voet van
      artikel 68 van het Communautair douanewetboek aan een verificatie onderwerpen.

      2 Bij verificatie van een aangifte worden de resultaten van het onderzoek van de goederen geacht overeen te komen
      met de aangifte indien de bevonden verschillen blijven binnen de spelingen die daartoe bij ministeriële regeling
      zijn vastgesteld.

      3 De inspecteur deelt de resultaten van de verificatie van een aangifte mede aan de aangever. Indien de verificatie
      leidt tot de vaststelling van een gegeven dat afwijkt van hetgeen in de aangifte is vermeld, is met betrekking tot
      die vaststelling [artikel 3:47 van de Algemene wet bestuursrecht][ref1] niet van toepassing.

      4 Bij ministeriële regeling kunnen regels worden gesteld omtrent de wijze waarop een onderzoek van goederen of van
      bepaalde hoedanigheden van goederen geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel347
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:47
  - number: '6'
    text: |-
      1 De aangever is bevoegd om met betrekking tot de hoeveelheid, de soort of andere bij ministeriële regeling
      aangewezen grondslagen van de rechten bij invoer heronderzoek van de goederen te vorderen, tenzij de resultaten van
      de verificatie van een aangifte overeenkomen met de desbetreffende aangifte. Artikel 69, eerste en tweede lid, van
      het Communautair douanewetboek en de artikelen 241, eerste lid, en 243, eerste lid, van de toepassingsverordening
      Communautair douanewetboek zijn van overeenkomstige toepassing.

      2 Desgevraagd kan de inspecteur toestaan dat het heronderzoek van de goederen beperkt blijft tot een gedeelte van
      de aan het onderzoek onderworpen goederen.

      3 Het heronderzoek van de goederen wordt gevorderd binnen vierentwintig uur nadat van de resultaten van de
      verificatie van de aangifte mededeling is gedaan aan de aangever. De inspecteur kan deze termijn verlengen. De
      aangever kan afstand doen van het recht tot het vorderen van heronderzoek van de goederen.

      4 De persoon die het onderzoek van de goederen heeft verricht, neemt niet deel aan het heronderzoek van de
      goederen.

      5 De inspecteur deelt de resultaten van het heronderzoek mede aan de aangever.

      6 De resultaten van het heronderzoek gelden als de resultaten van het onderzoek bedoeld in artikel 68, onderdeel
      *b*, van het Communautair douanewetboek.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel6
  - number: '7'
    text: |-
      Indien tussen de resultaten van het onderzoek van de goederen en die van het heronderzoek van de goederen in het
      voordeel van de belanghebbende een zodanig verschil bestaat dat de in [artikel 5, tweede lid][ref1], bedoelde
      spelingen zijn overschreden, worden op daartoe gedaan verzoek de kosten die door belanghebbende voor het
      heronderzoek van de goederen zijn gemaakt van rijkswege vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel5
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel7
    references:
