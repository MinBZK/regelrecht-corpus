  - number: '50'
    text: |-
      1 Degene die een tot stand gebrachte identificatiemaatregel met betrekking tot een vervoermiddel, bergingsmiddel,
      verpakkingsmiddel, goederen, werktuig, leiding, gebouw of terrein, of deel daarvan, in strijd met wettelijke
      bepalingen schendt, wordt gestraft met geldboete van de derde categorie.

      2 Degene die een der in het eerste lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf van
      ten hoogste twee jaren of geldboete van de vierde categorie.

      3 Met dezelfde straf als in het eerste lid vermeld wordt gestraft degene die een hem bij [artikel 24][ref1]
      opgelegde verplichting niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel24
