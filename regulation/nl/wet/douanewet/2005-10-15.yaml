        bwb_id: BWBR0007632
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '8'
    text: |-
      1 Een ieder die in Nederland een bedrijf uitoefent (administratieplichtige) is gehouden van zijn vermogenstoestand
      en van alles betreffende zijn bedrijf, naar de eisen van dat bedrijf, op zodanige wijze een administratie te voeren
      en de daartoe behorende boeken, bescheiden en andere gegevensdragers op zodanige wijze te bewaren, dat te allen
      tijde zijn rechten en verplichtingen alsmede de voor de heffing van de rechten bij invoer overigens van belang
      zijnde gegevens hieruit duidelijk blijken.

      2 Tot de administratie behoort hetgeen ingevolge wettelijke bepalingen wordt bijgehouden, aangetekend of opgemaakt.

      3 Administratieplichtigen zijn verplicht de in de voorgaande leden bedoelde gegevensdragers gedurende zeven jaren
      te bewaren.

      4 De op een gegevensdrager aangebrachte gegevens, uitgezonderd de op papier gestelde balans en staat van baten
      en lasten, kunnen op een andere gegevensdrager worden overgebracht en bewaard, mits de overbrenging geschiedt met
      juiste en volledige weergave der gegevens en deze gegevens gedurende de volledige bewaartijd beschikbaar zijn en
      binnen redelijke tijd leesbaar kunnen worden gemaakt.

      5 De administratie dient zodanig te zijn ingericht en te worden gevoerd en de gegevensdragers dienen zodanig te
      worden bewaard, dat controle daarvan door de inspecteur binnen een redelijke termijn mogelijk is. Daartoe verleent
      de administratieplichtige de benodigde medewerking met inbegrip van het verschaffen van het benodigde inzicht in de
      opzet en de werking van de administratie.

      6 Onverminderd het bepaalde in [artikel 15i van Boek 3 van het Burgerlijk Wetboek][ref1] en in de
      [artikelen 10][ref2] en [24 van Boek 2 van het Burgerlijk Wetboek][ref3] kunnen bij of krachtens algemene maatregel
      van bestuur ten behoeve van de heffing van de rechten bij invoer regels worden gegeven ingevolge welke onder nader
      te stellen voorwaarden ontheffing wordt verleend van in de voorgaande leden bedoelde verplichtingen, dan wel kunnen
      nadere regels worden gegeven omtrent de wijze waarop aan deze verplichtingen moet worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel24
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel8
    references:
      - id: ref1
