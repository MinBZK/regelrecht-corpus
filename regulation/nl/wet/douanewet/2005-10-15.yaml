  - number: '16'
    text: |-
      1 Bij onderzoek van goederen is de inspecteur bevoegd van de goederen monsters te nemen. De inspecteur neemt in
      ieder geval een monster indien belanghebbende hierom verzoekt.

      2 Het monster of hetgeen daarvan is overgebleven wordt desverlangd, zodra het kan worden gemist, aan de
      belanghebbende teruggegeven.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel16
  - number: '17'
    text: |-
      1 Aan lijfsvisitatie door de inspecteur zijn onderworpen, personen die aanwezig zijn in of op de in
      de [artikelen 12][ref1] en [14][ref2] bedoelde entrepots, ruimten voor tijdelijke opslag, plaatsen,
      spoorwegemplacementen, havens, luchthavens, terreinen, gebouwen, erven en vervoermiddelen of deze locaties of
      vervoermiddelen juist hebben verlaten.

      2 De in het eerste lid bedoelde personen zijn op vordering van de inspecteur gehouden stil te staan en deze te
      volgen naar een door hem aangewezen plaats.

      3 Op vordering van de inspecteur zijn reizigers, die zich bevinden in een vervoermiddel dat juist het douanegebied
      van de Gemeenschap is binnengekomen of dat bestemd is om aanstonds te vertrekken om dat douanegebied te verlaten,
      gehouden hun plaats- of vervoerbewijs te vertonen. Deze verplichting geldt eveneens voor reizigers die een
      dergelijk vervoermiddel juist hebben verlaten dan wel die op het punt staan daarin te worden opgenomen.

      4 Lijfsvisitatie geschiedt door personen van hetzelfde geslacht als dat van de persoon die aan visitatie wordt
      onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007632#Artikel14
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007632
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '18'
    text: |-
      De verplichtingen welke volgens paragraaf twee en paragraaf drie bestaan jegens de inspecteur, gelden mede jegens
      iedere door Onze Minister aangewezen andere ambtenaar van de rijksbelastingdienst.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel18
  - number: '19'
    text: |-
      Bij algemene maatregel van bestuur kunnen, in het belang van het bedrijfsleven, onder de nodige voorzieningen ter
      verzekering van de heffing van de rechten bij invoer regels worden gegeven ter vereenvoudiging van de wijze van
      douanetoezicht op goederen die zich onder een douaneregeling bevinden.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel19
  - number: '20'
    text: |-
      Goederen aangevoerd uit zee of door de lucht worden, behoudens tegenbewijs, geacht uit zee onderscheidenlijk door
      de lucht het douanegebied van de Gemeenschap te zijn binnengekomen.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel20
  - number: '21'
    text: |-
      1 Goederen aanwezig in of op schepen, op weg naar zee of bestemd om aanstonds naar zee te vertrekken, zomede
      goederen die op het punt staan om in die schepen te worden opgenomen, worden aangemerkt als goederen die over zee
      het douanegebied van de Gemeenschap zullen uitgaan, tenzij blijkt dat de goederen bestemd zijn voor een plaats
      in het douanegebied van de Gemeenschap en het vervoer zal geschieden zonder dat het schip het douanegebied van de
      Gemeenschap uitgaat.

      2 Goederen aanwezig in luchtvaartuigen, bestemd om aanstonds op te stijgen, zomede goederen die op het punt staan
      om in die luchtvaartuigen te worden opgenomen, worden aangemerkt als goederen die door de lucht het douanegebied
      van de Gemeenschap zullen uitgaan, tenzij blijkt dat de goederen bestemd zijn voor een plaats in het douanegebied
      van de Gemeenschap en het vervoer zal geschieden zonder dat het luchtvaartuig het douanegebied van de Gemeenschap
      uitgaat.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel21
  - number: '22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden bepalingen vastgesteld met betrekking tot het binnenbrengen
      en het uitgaan via de zee van schepen en de daarin of daarop aanwezige goederen.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel22
  - number: '23'
    text: |-
      1 Bij de uitoefening van hun taak dragen de ambtenaren van de rijksbelastingdienst een legitimatiebewijs bij zich,
      afgegeven door Onze Minister of een door hem aangewezen ambtenaar.

      2 Onverminderd [artikel 1, eerste en tweede lid, van de Algemene wet op het binnentreden][ref1] tonen zij hun
      legitimatiebewijs desgevraagd onverwijld.

      3 Het legitimatiebewijs bevat een foto van de ambtenaar en vermeldt in ieder geval diens naam en hoedanigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel1
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '1'
  - number: '24'
    text: |-
      1 Ter verzekering van de heffing van de rechten bij invoer kan de inspecteur identificatiemaatregelen tot
      stand brengen met betrekking tot, dan wel tot bewaking overgaan van, vervoermiddelen, bergingsmiddelen,
      verpakkingsmiddelen, goederen, werktuigen, leidingen, gebouwen of terreinen, of delen daarvan.

      2 Een identificatiemaatregel welke is tot stand gebracht buiten het douanegebied van de Gemeenschap wordt, tenzij
      op deze maatregel artikel 250, eerste streepje, van het Communautair douanewetboek van toepassing is, met de
      maatregelen, bedoeld in het eerste lid, slechts gelijkgesteld indien de inspecteur de buiten het douanegebied van
      de Gemeenschap tot stand gebrachte identificatiemaatregel heeft aanvaard.

      3 De beheerder die door de inspecteur van diens voornemen om een identificatiemaatregel tot stand te brengen in
      kennis is gesteld, draagt er zorg voor dat de inspecteur deze maatregel op een deugdelijke wijze tot stand kan
      brengen.

      4 Behoudens indien zich, al dan niet in het kader van een douaneregeling, gevallen voordoen als bedoeld in artikel
      72, tweede lid, van het Communautair douanewetboek, draagt de beheerder er zorg voor dat een door de inspecteur tot
      stand gebrachte identificatiemaatregel in stand blijft.

      5 Ten aanzien van de in het derde en in het vierde lid opgelegde verplichtingen kan voor de beheerder niet
      het bestaan van overmacht worden aangenomen, indien hij niet onverwijld nadat hem bekend is geworden dat een
      identificatiemaatregel niet op deugdelijke wijze is tot stand gebracht of een identificatiemaatregel niet in stand
      is gebleven, daarvan aan de inspecteur mededeling doet.

      6 Bij algemene maatregel van bestuur worden regels gesteld bij of krachtens welke de in het eerste lid bedoelde
      identificatiemaatregelen kunnen worden tot stand gebracht door anderen dan de inspecteur.

      7 Degene die anders dan als inspecteur bevoegd is om een identificatiemaatregel tot stand te brengen, draagt er
      zorg voor dat die maatregel op een deugdelijke wijze tot stand wordt gebracht.

      8 Indien een identificatiemaatregel is tot stand gebracht ingevolge het zesde lid, rust op de beheerder
      de in het vierde lid genoemde verplichting als gold het een ingevolge het eerste lid tot stand gebrachte
      identificatiemaatregel. Het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel24
  - number: '25'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:

      a. de vaststelling van de inhoudsruimte van bergingsmiddelen en werktuigen;

      b. de controle van peilinstrumenten en meetapparaten.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel25
  - number: '26'
    text: |-
      1 Aan enige instelling van vervoer toevertrouwde brieven worden zonder goedvinden van de afzender of van de
      geadresseerde slechts geopend indien de rechter-commissaris in de rechtbank van het arrondissement waarbinnen de
      brief is aangetroffen, daartoe, op verzoek van de inspecteur, bevel heeft gegeven.

      2 Het bevel wordt slechts gegeven indien het vermoeden bestaat dat zich in de brief goederen bevinden.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel26
  - number: '27'
    text: |-
      1 De inspecteur heeft het recht in de uitoefening van zijn werkzaamheden waartoe hij ingevolge wettelijke
      bepalingen bevoegd is, geweld te gebruiken wanneer het daarmee beoogde doel dit, mede gelet op de aan het gebruik
      van geweld verbonden gevaren, rechtvaardigt en dat doel niet op een andere wijze kan worden bereikt.

      2 Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf.

      3 De ambtenaren van de rijksbelastingdienst zijn bevoegd tot het onderzoek aan de kleding van personen bij de
      werkzaamheden waartoe zij ingevolge wettelijke bepalingen bevoegd zijn, indien uit feiten of omstandigheden blijkt
      dat een onmiddellijk gevaar dreigt voor hun leven of veiligheid, die van de ambtenaren zelf of van derden en dit
      onderzoek noodzakelijk is ter afwending van dit gevaar.

      4 De uitoefening van de bevoegdheden bedoeld in het eerste en derde lid dient in verhouding tot het beoogde doel
      redelijk en gematigd te zijn.

      5 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel27
  - number: '28'
    text: |-
      1 In het kader van de uitoefening van de werkzaamheden waartoe de inspecteur ingevolge wettelijke bepalingen
      bevoegd is, is degene die overeenkomstig artikel 14 van het Communautair douanewetboek gehouden is tot het
      verlenen van de nodige bijstand, dan wel degene die van zijnentwege aanwezig is, gehouden desgevorderd die bijstand
      te verlenen en de daarvoor benodigde werklieden en hulpmiddelen kosteloos te verstrekken. Bij gebreke daarvan
      kan de inspecteur op kosten van de belanghebbende in het nodige voorzien of, voor zover het verrichten van de
      werkzaamheden niet in het belang van de rijksbelastingdienst is geboden, deze achterwege laten.

      2 Indien de inspecteur dit voor het deugdelijk verrichten van de werkzaamheden noodzakelijk oordeelt, is de
      belanghebbende gehouden op daartoe gedane vordering de vervoermiddelen of andere goederen ten aanzien waarvan de
      werkzaamheden worden verricht op zijn kosten over te brengen naar een door de inspecteur aangewezen plaats.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel28
  - number: '29'
    text: |-
      De inspecteur heeft het recht in de uitoefening van werkzaamheden waartoe hij ingevolge wettelijke bepalingen
      bevoegd is, de hulp in te roepen van de politie en de Koninklijke marechaussee of andere delen van de krijgsmacht.
      Deze zijn verplicht aan de vordering onmiddellijk te voldoen.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel29
  - number: '30'
    text: |-
      1 Door Onze Minister kan een persoon als douane-expediteur worden toegelaten.

      2 Een toelating als douane-expediteur kan worden geweigerd aan een persoon die in de laatstverlopen vijf jaren
      wegens een in wettelijke bepalingen strafbaar gesteld feit onherroepelijk is veroordeeld.

      3 Douane-expediteurs die niet in Nederland wonen of zijn gevestigd, zijn gehouden in Nederland woonplaats te kiezen
      of een vaste inrichting op te richten.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel30
  - number: '31'
    text: |-
      Van de mogelijkheid om bij het doen van een douaneaangifte als indirect vertegenwoordiger op te treden als bedoeld
      in [artikel 5, tweede lid][ref1], tweede streepje, van het Communautair douanewetboek kan slechts gebruik worden
      gemaakt door een douane-expediteur. Hij dient daartoe schriftelijk te zijn gemachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel5
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '32'
    text: |-
      De douane-expediteur is gehouden aan zijn opdrachtgever een rekening te verstrekken waarin de ten behoeve van deze
      aan het Rijk betaalde rechten bij invoer, administratieve boeten, interest en kosten afzonderlijk zijn omschreven.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel32
  - number: 32a
    text: |-
      1 Douane-expediteurs hebben voor de door hen ten behoeve van hun opdrachtgever betaalde rechten bij invoer,
      administratieve boete, interest en kosten gedurende een jaar na de aan het Rijk gedane betaling een voorrecht op
      alle vermogensbestanddelen van de opdrachtgever.

      2 Het in het eerste lid toegekende voorrecht heeft gelijke rangorde als het in
      [artikel 21 van de Invorderingswet 1990][ref1] toegekende voorrecht van ’s Rijks schatkist, met dien verstande dat
      dit laatste voorrecht voorgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel21
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '21'
  - number: '33'
    text: |-
      1 Onze Minister kan op grond van laakbare handelingen, gepleegd in de uitoefening van het bedrijf van douane-
      expediteur, diens toelating als douane-expediteur intrekken, indien tevoren aan de douane-expediteur wegens vroeger
      gepleegde laakbare handelingen in de laatstverlopen drie jaren een waarschuwing, houdende de feiten waarop zij is
      gegrond, is uitgereikt.

      2 In afwijking van het eerste lid kan Onze Minister de toelating als douane-expediteur onmiddellijk intrekken
      indien de douane-expediteur onherroepelijk is veroordeeld vanwege een in wettelijke bepalingen strafbaar gesteld
      feit.

      3 Aan de douane-expediteur wiens toelating is ingetrokken, wordt, behoudens in bijzondere gevallen, een nieuwe
      toelating niet verleend voordat vijf jaren sedert de intrekking zijn verlopen.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel33
  - number: '35'
    text: |-
      1 Bij algemene maatregel van bestuur worden de gevallen vastgesteld waarin de belanghebbende ter zake van het
      verrichten van ambtelijke werkzaamheden kosten aan het Rijk is verschuldigd.

      2 Bij ministeriële regeling wordt het tarief van kosten die verschuldigd zijn krachtens het eerste lid vastgesteld.

      3 Het tarief wordt zodanig vastgesteld dat de verschuldigde kosten de werkelijke kosten zoveel mogelijk benaderen.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel35
  - number: '36'
    text: |-
      1 De inspecteur stelt het bedrag van de door belanghebbende verschuldigde kosten vast bij beschikking.

      2 Een onjuiste beschikking kan door de inspecteur ambtshalve worden verminderd.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel36
  - number: '37'
    text: |-
      1 Indien voor goederen in tijdelijke opslag waarvoor een summiere aangifte is gedaan de formaliteiten welke nodig
      zijn om deze goederen een douanebestemming te geven niet worden vervuld binnen de ingevolge artikel 49 van het
      Communautair douanewetboek geldende termijn, vormt dit een verzuim ter zake waarvan de inspecteur degene die de
      formaliteiten binnen deze termijn dient te vervullen en degene door wiens toedoen de formaliteiten niet binnen deze
      termijn worden vervuld ieder een boete van ten hoogste € 90 kan opleggen.

      2 Indien het niet vervullen van de in het eerste lid bedoelde formaliteiten binnen de ingevolge artikel 49 van het
      Communautair douanewetboek geldende termijn, een douaneschuld doet ontstaan en het daaruit voortvloeiende bedrag
      aan rechten bij invoer hoger is dan € 90, terwijl het niet vervullen van die formaliteiten binnen die termijn is
      te wijten aan opzet of grove schuld van één of meer van degenen, bedoeld in het eerste lid, vormt dit een vergrijp
      ter zake waarvan de inspecteur hem, onderscheidenlijk ieder van hen, een boete van ten hoogste 100 percent van het
      bedrag van de rechten kan opleggen.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel37
  - number: '38'
    text: |-
      1 Indien voor goederen welke zijn geplaatst onder de douaneregeling douanevervoer, actieve veredeling (systeem
      inzake schorsing), behandeling onder douanetoezicht of tijdelijke invoer, de formaliteiten ter beëindiging van
      die regeling in strijd met wettelijke bepalingen niet of niet tijdig worden vervuld, vormt dit een verzuim ter
      zake waarvan de inspecteur degene die die formaliteiten dient te vervullen en degene door wiens toedoen die
      formaliteiten niet of niet tijdig worden vervuld een boete van ten hoogste € 90 kan opleggen.

      2 Indien het in strijd met wettelijke bepalingen niet of niet tijdig vervullen van de in het eerste lid bedoelde
      formaliteiten een douaneschuld doet ontstaan en het daaruit voortvloeiende bedrag aan rechten bij invoer hoger is
      dan € 90, terwijl het in strijd met wettelijke bepalingen niet of niet tijdig vervullen van die formaliteiten is
      te wijten aan opzet of grove schuld van één of meer van degenen, bedoeld in het eerste lid, vormt dit een vergrijp
      ter zake waarvan de inspecteur hem, onderscheidenlijk ieder van hen, een boete van ten hoogste 100 percent van het
      bedrag van de rechten kan opleggen.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel38
  - number: '39'
    text: |-
      1 Indien in een douane-entrepot of in een vrij entrepot een vermis wordt bevonden, vormt dit een verzuim ter zake
      waarvan de inspecteur de entreposeur, de entrepositaris, onderscheidenlijk de operateur, een boete van ten hoogste
      € 90 kan opleggen.

      2 Indien het in het eerste lid bedoelde vermis een douaneschuld doet ontstaan en het daaruit voortvloeiende
      bedrag aan rechten bij invoer hoger is dan € 90, terwijl dat vermis is te wijten aan opzet of grove schuld van
      de entreposeur, de entrepositaris, onderscheidenlijk de operateur, vormt dit een vergrijp ter zake waarvan de
      inspecteur hem een boete van ten hoogste 100 percent van het bedrag van de rechten kan opleggen.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel39
  - number: '40'
    text: |-
      Het overtreden van een krachtens wettelijke bepalingen vastgestelde algemene maatregel van bestuur of ministeriële
      regeling kan bij die algemene maatregel van bestuur of ministeriële regeling worden aangemerkt als een verzuim ter
      zake waarvan de inspecteur degene aan wie het verzuim te wijten is een boete kan opleggen van ten hoogste het in
      die algemene maatregel van bestuur of ministeriële regeling te vermelden bedrag. Dat bedrag beloopt ten hoogste €
      90 indien het verzuim betrekking heeft op een algemene maatregel van bestuur, en beloopt ten hoogste € 45 indien
      het verzuim betrekking heeft op een ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel40
  - number: '41'
    text: |-
      De bevoegdheid tot het opleggen van de boeten, bedoeld in dit hoofdstuk, vervalt door verloop van drie jaren na het
      tijdstip waarop het verzuim of het vergrijp waarop de boete betrekking heeft, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel41
  - number: '44'
    text: |-
      1 Degene die goederen het douanegebied van de Gemeenschap binnenbrengt in strijd met de artikelen 38 en 39 van
      het Communautair douanewetboek of goederen in andere delen van het douanegebied van de Gemeenschap binnenbrengt
      in strijd met artikel 177 van het Communautair douanewetboek, dan wel binnengebrachte goederen in strijd met de
      artikelen 40 en 41 van het Communautair douanewetboek niet bij de inspecteur aanbrengt of van de overeenkomstig
      artikel 40 van het Communautair douanewetboek aangebrachte goederen in strijd met de artikelen 43 en 44 van het
      Communautair douanewetboek geen summiere aangifte doet, wordt gestraft met geldboete van de derde categorie, of,
      indien dit bedrag hoger is, ten hoogste eenmaal het bedrag van de rechten bij invoer die van de goederen zijn
      verschuldigd.

      2 Degene die een der in het eerste lid omschreven feiten begaat met het oogmerk de rechten bij invoer die van de
      goederen zijn verschuldigd, te ontduiken of de ontduiking daarvan te bevorderen, wordt gestraft met gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal
      het bedrag van die rechten.

      3 Degene die uit zee of door de lucht goederen aanvoert ten aanzien waarvan het in [artikel 20][ref1] genoemde
      tegenbewijs niet wordt geleverd, wordt geacht die goederen uit zee, onderscheidenlijk door de lucht, binnen het
      douanegebied van de Gemeenschap te hebben gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel20
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '45'
    text: |-
      Degene die goederen in strijd met wettelijke bepalingen niet aanbrengt bij een douanekantoor van uitgang,
      of goederen buiten het douanegebied van de Gemeenschap voert in strijd met artikel 183 van het Communautair
      douanewetboek, wordt gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel45
  - number: '46'
    text: |-
      1 Degene die goederen waarvoor een in wettelijke bepalingen voorziene aangifte niet is gedaan, lost, laadt,
      vervoert, in enig gebouw, erf of besloten terrein inslaat, voorhanden heeft of daaruit uitslaat, koopt, verkoopt,
      te koop aanbiedt of aflevert, wordt gestraft met geldboete van de derde categorie of, indien dit bedrag hoger is,
      ten hoogste eenmaal het bedrag van de rechten bij invoer die van de goederen zijn verschuldigd.

      2 Degene die een der in het eerste lid omschreven feiten begaat, terwijl hij weet of vermoedt dat de rechten
      bij invoer van de in dat lid bedoelde goederen niet zijn voldaan, noch de heffing van die rechten overeenkomstig
      wettelijke bepalingen is verzekerd, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de
      vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het bedrag van die rechten.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel46
  - number: '47'
    text: |-
      1 Degene die in strijd met wettelijke bepalingen goederen waarvoor vrijstelling van rechten bij invoer wordt
      genoten, gebruikt of doet gebruiken op een wijze of voor doeleinden waarvoor de vrijstelling niet geldt, of
      aan goederen die in het vrije verkeer zijn gebracht met toepassing van een verlaagd recht bij invoer of van een
      nulrecht uit hoofde van hun bijzondere bestemming, een bestemming heeft gegeven die afwijkt van die met het oog
      waarop het verlaagde recht bij invoer of het nulrecht is toegepast, wordt gestraft met geldboete van de derde
      categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het bedrag van de van die goederen te weinig geheven
      rechten bij invoer.

      2 Degene die een der in het eerste lid omschreven feiten opzettelijk begaat, wordt gestraft met gevangenisstraf van
      ten hoogste een jaar of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig geheven rechten bij invoer.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel47
  - number: '48'
    text: |-
      1 Degene die:

      a. een ingevolge wettelijke bepalingen vereiste aangifte onjuist of onvolledig doet;

      b. ingevolge wettelijke bepalingen verplicht is tot:

      1°. het verstrekken van inlichtingen, gegevens of aanwijzingen, en deze niet, onjuist of onvolledig verstrekt;

      2°. het vertonen, overgeven of voor raadpleging beschikbaar stellen van bepaalde gegevensdragers, of de inhoud
      daarvan, en een zodanige verplichting niet nakomt;

      3°. het vertonen, overgeven of voor raadpleging beschikbaar stellen van bepaalde gegevensdragers, of de inhoud
      daarvan, en valse of vervalste gegevensdragers vertoont, overgeeft of voor raadpleging beschikbaar stelt, dan wel
      de inhoud daarvan in valse of vervalste vorm voor dit doel beschikbaar stelt;

      4°. het voeren van een administratie overeenkomstig de daaraan bij of krachtens wettelijke bepalingen gestelde
      eisen, en een zodanige administratie niet voert;

      5°. het bewaren van boeken, bescheiden of andere gegevensdragers, en deze niet bewaart;

      6°. het verlenen van medewerking als bedoeld in [artikel 8, vijfde lid][ref1], en deze medewerking niet verleent;

      wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie.

      2 Degene die opzettelijk een der feiten begaat, omschreven in het eerste lid, onderdeel b, onder 1°, 2°, 4°,
      5° of 6°, wordt, indien het feit ertoe strekt dat te weinig rechten bij invoer worden geheven, gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie of, indien dit bedrag hoger is, ten
      hoogste eenmaal het bedrag van de te weinig geheven rechten.

      3 Degene die opzettelijk een der feiten begaat, omschreven in het eerste lid, onderdeel a of b, onder 3°, wordt,
      indien het feit ertoe strekt dat te weinig rechten bij invoer worden geheven, gestraft met gevangenisstraf van
      ten hoogste zes jaren of geldboete van de vijfde categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het
      bedrag van de te weinig geheven rechten.

      4 Indien het feit, ter zake waarvan de verdachte kan worden vervolgd, zowel valt onder een van de bepalingen van
      het tweede of het derde lid, als onder die van [artikel 225, tweede lid, van het Wetboek van Strafrecht][ref2], is
      strafvervolging op grond van genoemd [artikel 225, tweede lid][ref3], uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel48
