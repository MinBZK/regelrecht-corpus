        artikel: 15i
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '24'
  - number: '9'
    text: |-
      1 De administratieplichtige is gehouden desgevraagd aan de inspecteur de boeken, bescheiden en andere
      gegevensdragers, of de inhoud daarvan, - zulks ter keuze van de inspecteur - waarvan de raadpleging van belang kan
      zijn voor de toepassing van wettelijke bepalingen, terstond voor dit doel beschikbaar te stellen.

      2 De in het eerste lid bedoelde verplichting geldt eveneens voor een derde bij wie zich gegevensdragers, of de
      inhoud daarvan, van de administratieplichtige bevinden.

      3 De inspecteur stelt de administratieplichtige wiens gegevensdragers hij bij een derde voor raadpleging vordert
      hiervan gelijktijdig in kennis.

      4 Toegelaten moet worden, dat kopieën, leesbare afdrukken of uittreksels worden gemaakt van de voor raadpleging
      beschikbaar gestelde gegevensdragers of de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel9
  - number: '10'
    text: |-
      1 Onze Ministers, openbare lichamen en rechtspersonen die bij of krachtens een bijzondere wet rechtspersoonlijkheid
      hebben verkregen, de onder hen ressorterende instellingen en diensten, alsmede lichamen die hoofdzakelijk
      uitvoering geven aan het beleid van het Rijk, verschaffen, mondeling, schriftelijk of op andere wijze - zulks
      ter keuze van de inspecteur -, de gegevens en inlichtingen, en wel kosteloos, die hun door de inspecteur voor de
      uitvoering van de wettelijke bepalingen worden gevraagd.

      2 Onze Minister kan, op verzoek, ontheffing verlenen van de in het eerste lid omschreven verplichting.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel10
  - number: 10a
    text: |-
      Een ieder die de leeftijd van veertien jaar heeft bereikt, is, indien dit voor de toepassing van wettelijke
      bepalingen te zijnen aanzien van belang kan zijn, verplicht op vordering van de inspecteur terstond een
      identiteitsbewijs als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '11'
    text: |-
      1 Degene die een aan onderzoek onderworpen entrepot, ruimte voor tijdelijke opslag, plaats, spoorwegemplacement,
      haven, luchthaven, terrein, gebouw, erf of vervoermiddel in gebruik heeft, is verplicht ten behoeve van een
      ingevolge wettelijke bepalingen te verrichten onderzoek de inspecteur en de door deze aangewezen personen
      desgevraagd toegang te verlenen tot alle gedeelten van die locatie of dat vervoermiddel.

      2 De gevraagde toegang moet worden verleend op elk tijdstip.

      3 Degene die een locatie of vervoermiddel als bedoeld in het eerste lid in gebruik heeft, is verplicht desgevraagd
      de aanwijzingen te geven die voor het onderzoek nodig zijn.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel11
  - number: '12'
    text: |-
      Aan onderzoek door de inspecteur zijn onderworpen:

      a. entrepots en ruimten voor tijdelijke opslag;

      b. plaatsen die door TNT Post Groep N.V. tot behandeling van postzendingen worden gebezigd;

      c. spoorwegemplacementen, plaatsen voor distributie en overslag voor goederen die over de weg worden vervoerd,
      havens, haventerreinen en luchthavens;

      d. alle niet-besloten terreinen met uitzondering van erven;

      e. gebouwen, erven en besloten terreinen die tot stalling of herstelling van vervoermiddelen zijn ingericht of
      kennelijk daartoe worden gebezigd;

      f. niet onder onderdeel *a* of *b* vallende gebouwen, erven en besloten terreinen:

      1°. waarvoor een krachtens wettelijke bepalingen vereiste toestemming, vergunning, goedkeuring of aanwijzing van
      kracht is;

      2°. die in een ingevolge wettelijke bepalingen gedane aangifte of kennisgeving zijn vermeld als de plaatsen waar
      zich in de aangifte of kennisgeving omschreven goederen bevinden;

      alsmede de aldaar aanwezige goederen en de op die bedoelde locaties en goederen betrekking hebbende bescheiden
      waarvan de kennisneming van belang kan zijn voor de heffing van de rechten bij invoer.
    url: https://wetten.overheid.nl/BWBR0007632/2005-10-15#Artikel12
  - number: '13'
    text: |-
      1 Bij het onderzoek, bedoeld in [artikel 12][ref1], mag een woning zonder toestemming van de bewoner slechts worden
      binnengetreden door ambtenaren van de rijksbelastingdienst die door de inspecteur zijn aangewezen.

      2 De inspecteur is bevoegd tot het geven van een machtiging als bedoeld in
      [artikel 2 van de Algemene wet op het binnentreden][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel2
