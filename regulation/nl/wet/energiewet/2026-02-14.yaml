  - number: 7.52.3
    text: |-
      De door de Autoriteit Consument en Markt op grond van [hoofdstuk 2, paragraaf 2.2, van de Gaswet][ref1]
      vastgestelde voorwaarden ten aanzien van het meten van gegevens, zoals die luidden onmiddellijk voor het tijdstip
      van inwerkingtreding van de [artikelen 2.46][ref2], [2.48][ref3], [2.55][ref4], [3.52][ref5], [3.55][ref6],
      [3.56 tot en met 3.58][ref7], [3.60][ref8], [4.2][ref9], [4.5 tot en met 4.7][ref10] en [4.13][ref11], blijven na
      inwerkingtreding van die artikelen van toepassing, totdat de bij ministeriële regeling te stellen regels, bedoeld
      in die artikelen, zijn vastgesteld en in werking getreden.


