  - number: 7.49.2
    text: |-
      Indien sprake is van een aansluitpunt als bedoeld in de [Gaswet][ref1] zoals die luidde voor 1 januari 2019,
      beperkt de taak, bedoeld in [artikel 3.41, eerste lid][ref2], zich tot het in gebruik geven, beheren en onderhouden
      van dat aansluitpunt.


