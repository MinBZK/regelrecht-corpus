  - number: 3.110.4
    text: 'De Autoriteit Consument en Markt betrekt bij het vaststellen van de tarieven correcties met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.4.a
    text: |-
      tarieven uit voorgaande jaren die zijn gewijzigd bij rechterlijke uitspraak of door herziening van een besluit door
      de Autoriteit Consument en Markt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.4.b
    text: |-
      tarieven uit voorgaande jaren die zijn vastgesteld met inachtneming van een methodebesluit of inkomstenbesluit dat
      bij onherroepelijke rechterlijke uitspraak is vernietigd of bij onherroepelijk besluit van de Autoriteit Consument
      en Markt is herzien, op basis van een herziene vaststelling van deze tarieven met inachtneming van die rechterlijke
      uitspraak of dat besluit en het verdisconteren van het verschil.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.5
    text: |-
      De Autoriteit Consument en Markt kan bij het vaststellen van de totale toegestane of beoogde inkomsten, bedoeld in
      het tweede lid, of de tarieven correcties betrekken voor:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.5.a
    text: verschillen tussen vastgestelde rekenvolumes en gerealiseerde volumes;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.5.b
    text: verschillen tussen vastgestelde toegestane of beoogde inkomsten en gerealiseerde inkomsten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.5.c
    text: 'toegestane of beoogde inkomsten of tarieven die:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.5.c.1°
    text: |-
      zijn of worden vastgesteld met inachtneming van onjuiste of onvolledige gegevens en de Autoriteit Consument en
      Markt, bij beschikking over juiste of volledige gegevens, andere tarieven zou hebben vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.5.c.2°
    text: zijn of worden vastgesteld met gebruikmaking van geschatte gegevens en de feitelijke gegevens daarvan afwijken;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.5.c.3°
    text: |-
      zijn of worden vastgesteld met gebruikmaking van gegevens omtrent kosten voor wettelijke taken of verplichtingen,
      die de systeembeheerder niet heeft uitgevoerd of waarvoor de systeembeheerder geen of minder kosten heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.6
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.6.a
    text: |-
      het indienen van een voorstel voor de tarieven door de transmissie- of distributiesysteembeheerder als bedoeld in
      het eerste lid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.6.b
    text: |-
      de procedure en wijze van besluitvorming door de Autoriteit Consument en Markt bij ontbreken van een voorstel van
      de transmissie- of distributiesysteembeheerder als bedoeld in eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.111.1
    text: |-
      De op grond van [artikel 3.110][ref1] vastgestelde tarieven treden in werking op een door de Autoriteit Consument
      en Markt te bepalen datum en gelden tot 1 januari van het volgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.111
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
  - number: 3.111.2
    text: |-
      Indien op 1 januari de tarieven voor dat jaar nog niet zijn vastgesteld en in werking getreden, gelden de tarieven
      uit het voorgaande jaar tot de datum van inwerkingtreding van de tarieven voor dat jaar.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.111
  - number: 3.111.3
    text: |-
      Een transmissie- of distributiesysteembeheerder publiceert zijn tarieven op een voor eenieder kenbare en
      toegankelijke wijze.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.111
  - number: 3.112.1
    text: |-
      De transmissie- en distributiesysteembeheerders stellen voor de tarieven, bedoeld in
      [artikel 3.106, tweede lid][ref1] een voorstel voor de berekeningsmethode op en leggen dit ter goedkeuring voor
      aan de Autoriteit Consument en Markt. Per transmissie- of distributiesysteembeheerder of soort transmissie- of
      distributiesysteembeheerder kan een afzonderlijk voorstel voor de berekeningsmethode worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.112.2
    text: |-
      De Autoriteit Consument en Markt keurt de berekeningsmethode die ingevolge het eerste lid aan haar wordt voorgelegd
      goed indien deze:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.112
  - number: 3.112.2.a
    text: |-
      leidt tot tarieven die transparant zijn, niet discrimineren en de werkelijke kosten van de
      transmissie- of distributiesysteembeheerder in verband met het uitvoeren van de taken, bedoeld in
      [artikel 3.106, tweede lid][ref1], reflecteren, voor zover deze kosten efficiënt zijn; en


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.112.2.b
    text: dubbele vergoeding van kosten vermijdt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.112
  - number: 3.112.3
    text: |-
      De Autoriteit Consument en Markt past [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] toe bij de
      voorbereiding van de goedkeuring, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 3.112.4
    text: |-
      Een transmissie- of distributiesysteembeheerder publiceert de voor hem geldende door de Autoriteit Consument en
      Markt op grond van het tweede lid goedgekeurde berekeningsmethoden op een voor eenieder kenbare en toegankelijke
      wijze.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.112
  - number: 3.112.5
    text: |-
      De Autoriteit Consument en Markt bepaalt dat de transmissie- of distributiesysteembeheerder een door hem op grond
      van [artikel 3.106, eerste lid, onderdeel b][ref1], in rekening gebracht tarief aanpast, indien de Autoriteit
      Consument en Markt naar aanleiding van een klacht als bedoeld in [artikel 5.4, eerste lid][ref2], vaststelt dat dit
      tarief niet voldoet aan de vereisten, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel5
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 3.113.1
    text: |-
      De Autoriteit Consument en Markt stelt jaarlijks het tarief voor het uitvoeren van een tijdelijke taak vast
      op basis van een daartoe strekkend voorstel van de transmissie- of distributiesysteembeheerder, indien bij het
      toekennen van die tijdelijke taak is bepaald dat voor het uitvoeren daarvan een tarief in rekening wordt gebracht
      bij de aangeslotenen of, in het geval van de transmissiesysteembeheerder voor gas, de netgebruiker, ten behoeve van
      wie de tijdelijke taak wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.113
  - number: 3.113.2
    text: |-
      De tarieven zijn transparant, niet-discriminerend en reflecteren de kosten van de transmissie- of
      distributiesysteembeheerder voor het uitvoeren van de tijdelijke taak, voor zover deze efficiënt zijn en niet
      kunnen worden toegerekend aan andere aan die transmissie- of distributiesysteembeheerder opgedragen wettelijke
      taken of verplichtingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.113
  - number: 3.113.3
    text: |-
      [Artikel 3.110, vierde lid, en vijfde lid, onderdeel c][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.113
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
  - number: 3.113.4
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.113
  - number: 3.113.4.a
    text: |-
      de procedure voor het indienen van een voorstel voor de tarieven door de transmissie- of
      distributiesysteembeheerder;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.113
  - number: 3.113.4.b
    text: de termijn waarbinnen de Autoriteit Consument en Markt een besluit neemt; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.113
  - number: 3.113.4.c
    text: de inwerkingtreding van de tarieven.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.113
  - number: 3.113.5
    text: |-
      De transmissie- of distributiesysteembeheerder publiceert het op grond van het eerste lid vastgestelde tarief op
      een voor eenieder kenbare en toegankelijke wijze.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.113
  - number: 3.114.1
    text: |-
      Een beheerder van een gesloten systeem brengt voor het uitvoeren van de bij of krachtens [paragraaf 3.5.5][ref1]
      aan hem opgedragen taken of verplichtingen bij aangeslotenen op zijn systeem een tarief in rekening dat is
      vastgesteld met inachtneming van een vooraf door hem opgestelde en bekendgemaakte berekeningsmethode, die leidt tot
      tarieven die de kosten in verband met de uitvoering van zijn taken of verplichtingen reflecteren en transparant en
      niet-discriminerend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.114
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.5.5
        afdeling: '3.5'
  - number: 3.114.2
    text: |-
      De Autoriteit Consument en Markt bepaalt dat een beheerder van een gesloten systeem de door hem toegepaste
      berekeningsmethode of een door hem in rekening gebracht tarief aanpast, indien de Autoriteit Consument en
      Markt naar aanleiding van een klacht als bedoeld in [artikel 5.4, eerste lid][ref1], vaststelt dat deze
      berekeningsmethode of dit tarief niet in overeenstemming is met de vereisten, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel5
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.114
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 3.115.1
    text: |-
      Een LNG-beheerder brengt voor het uitvoeren van de bij of krachtens [paragraaf 3.5.3][ref1] aan hem opgedragen
      taken of verplichtingen een tarief in rekening dat is vastgesteld met inachtneming van een vooraf door de
      Autoriteit Consument en Markt goedgekeurde berekeningsmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.5.3
        afdeling: '3.5'
  - number: 3.115.2
    text: |-
      De Autoriteit Consument en Markt keurt de berekeningsmethode goed indien deze objectieve criteria hanteert en leidt
      tot tarieven die niet-discriminerend en transparant zijn.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.115
  - number: 3.115.3
    text: |-
      De LNG-beheerder publiceert de goedgekeurde berekeningsmethode en de met inachtneming daarvan vastgestelde tarieven
      voorafgaand aan de inwerkingtreding daarvan op een voor eenieder kenbare en toegankelijke wijze.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.115
  - number: 3.115.4
    text: |-
      De Autoriteit Consument en Markt bepaalt dat een LNG-beheerder een door hem op grond van het eerste lid in rekening
      gebracht tarief aanpast, indien de Autoriteit Consument en Markt naar aanleiding van een klacht als bedoeld in
      [artikel 5.4, eerste lid][ref1], vaststelt dat dit tarief niet voldoet aan de vereisten, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel5
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 3.115.5
    text: 'Bij ministeriële regeling worden regels gesteld over de procedure en termijn voor:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.115
  - number: 3.115.5.a
    text: |-
      het ter goedkeuring voorleggen van een voorstel voor een berekeningsmethode aan de Autoriteit Consument en Markt;
      en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.115
  - number: 3.115.5.b
    text: goedkeuring door de Autoriteit Consument en Markt, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.115
  - number: '3.116'
    text: |-
      Een interconnectorsysteembeheerder brengt voor het uitvoeren van de taken, bedoeld in [artikel 3.88][ref1] en
      [3.90][ref2] tarieven in rekening, waarbij [artikel 3.106][ref3], [paragraaf 3.6.2][ref4] en [artikel 3.112][ref5]
      van overeenkomstige toepassing zijn, met dien verstande dat voor transmissie- of distributiesysteembeheerder of
      «transmissiesysteembeheerder voor elektriciteit» steeds wordt gelezen «interconnectorsysteembeheerder».


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
