  - number: 2.47.1
    text: |-
      Een aangeslotene met een kleine aansluiting verleent de distributiesysteembeheerder de nodige medewerking aan de
      uitvoering van de taken, genoemd in de [artikelen 3.51][ref1] en [3.53, tweede lid, tweede volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
  - number: 2.47.2
    text: |-
      Een aangeslotene met een grote aansluiting, niet zijnde een aangeslotene als bedoeld in het derde of vierde
      lid of een beheerder van een gesloten systeem voor gas, draagt er zorg voor dat op zijn aansluiting een
      meetverantwoordelijke partij actief is.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.47
  - number: 2.47.3
    text: |-
      Een aangeslotene met een grote aansluiting op het transmissiesysteem voor gas die uitsluitend gas onttrekt,
      verleent de transmissiesysteembeheerder voor gas de nodige medewerking aan de uitvoering van de taken, genoemd
      in [artikel 3.54][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
  - number: 2.47.4
    text: |-
      Een aangeslotene met een grote aansluiting op het transmissiesysteem voor gas die uitsluitend gas invoedt of die
      een gasopslagbeheerder is, voert de meetactiviteiten uit overeenkomstig [artikel 2.55][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.3
        afdeling: '2.5'
  - number: 2.48.1
    text: 'Een meetverantwoordelijke partij:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
  - number: 2.48.1.a
    text: |-
      installeert en beheert op of nabij ieder overdrachtspunt een meetinrichting die voldoet aan de krachtens
      [artikel 2.46, derde lid][ref1], gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 2.48.1.b
    text: |-
      indien van toepassing, installeert en beheert een meetinrichting op de bij de krachtens
      [artikel 2.46, tweede lid, onderdeel a][ref1], vastgestelde plaatsen;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 2.48.1.c
    text: |-
      geeft overeenkomstig het bepaalde bij of krachtens [artikel 4.8, zesde lid][ref1], gegevens van de door hem
      beheerde meetinrichtingen door;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 2.48.1.d
    text: verzamelt en valideert per geïnstalleerde meetinrichting meetgegevens en stelt deze vast.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
  - number: 2.48.2
    text: |-
      Bij ministeriële regeling worden voor de verschillende soorten meetinrichtingen die krachtens
      [artikel 2.46, derde lid][ref1], zijn toegestaan regels gesteld over:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 2.48.2.a
    text: het installeren en beheren van meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
  - number: 2.48.2.b
    text: het soort meetgegevens dat wordt verzameld, gevalideerd of vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
  - number: 2.48.2.c
    text: de frequentie waarmee meetgegevens worden verzameld, gevalideerd of vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
  - number: 2.48.2.d
    text: de wijze waarop meetgegevens worden verzameld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
  - number: 2.48.2.e
    text: de nauwkeurigheidseisen voor het verzamelen van meetgegevens;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
  - number: 2.48.2.f
    text: de methoden voor het herleiden en berekenen van de hoeveelheid gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
  - number: 2.48.2.g
    text: de methoden voor het herleiden en berekenen ten behoeve van het valideren en vaststellen van meetgegevens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
  - number: 2.48.3
    text: |-
      Een meetverantwoordelijke partij kan met een aangeslotene overeenkomen dat de aangeslotene de meetgegevens ten
      aanzien van de kwaliteit van het door hem ingevoede gas zelf verzamelt, valideert en vaststelt. In dat geval geeft
      de aangeslotene de meetgegevens overeenkomstig het eerste lid, onderdeel c, door.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.48
  - number: 2.49.1
    text: |-
      Een meetverantwoordelijke partij past een door Onze Minister goedgekeurd protocol voor een periodieke controle
      van meetinrichtingen toe op de bij of krachtens [artikel 2.46, derde lid][ref1], en de bij of krachtens
      [artikel 5 van de Metrologiewet][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.49
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0019517
        artikel: '5'
  - number: 2.49.2
    text: Bij ministeriële regeling kunnen eisen worden gesteld aan het protocol.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.49
  - number: 2.50.1
    text: |-
      Het is verboden zonder een erkenning als bedoeld in het vierde lid, bij aangeslotenen als bedoeld in
      [artikel 2.47, tweede lid][ref1], meetinrichtingen te installeren en te beheren en daar te meten.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 2.50.2
    text: 'Een meetverantwoordelijke partij:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.50
  - number: 2.50.2.a
    text: |-
      beschikt over de benodigde organisatorische en technische kwaliteiten alsmede voldoende deskundigheid voor een
      goede uitvoering van zijn verplichtingen; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.50
  - number: 2.50.2.b
    text: |-
      is redelijkerwijs in staat de verplichtingen als opgenomen in [artikel 2.48][ref1], [afdeling 4.1][ref2] en de
      [artikelen 4.7][ref3] en [4.11][ref4] na te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0050714
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
      - id: ref4
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 2.50.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de vereisten, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.50
  - number: 2.50.4
    text: |-
      De Autoriteit Consument en Markt verleent een meetverantwoordelijke partij op aanvraag een erkenning als de
      meetverantwoordelijke partij voldoet aan de eisen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.50
  - number: 2.50.5
    text: De Autoriteit Consument en Markt kan voorschriften en beperkingen verbinden aan een erkenning.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.50
  - number: 2.50.6
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.50
  - number: 2.50.6.a
    text: de voorwaarden waaraan een aanvraag moet voldoen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.50
  - number: 2.50.6.b
    text: de procedure voor de aanvraag van een erkenning;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.50
  - number: 2.50.6.c
    text: |-
      de informatie die een meetverantwoordelijke partij na het verlenen van de erkenning al dan niet periodiek moet
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.50
  - number: 2.51.1
    text: |-
      De Autoriteit Consument en Markt kan een erkenning als bedoeld in [artikel 2.50, vierde lid][ref1], wijzigen of
      intrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.51
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
  - number: 2.51.1.a
    text: |-
      de houder van de erkenning niet langer voldoet aan één of meer verplichtingen, gesteld bij of krachtens de
      [artikelen 2.48][ref1] of [2.50, tweede lid, onderdeel a][ref2], [afdeling 4.1][ref3] en de [artikelen 4.7][ref4]
      en [4.11][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0050714#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.51
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
      - id: ref3
        bwb_id: BWBR0050714
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref4
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
      - id: ref5
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 2.51.1.b
    text: de houder van de erkenning dit verzoekt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.51
  - number: 2.51.1.c
    text: de houder van de erkenning de in de erkenning opgenomen voorschriften of opgelegde beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.51
  - number: 2.51.1.d
    text: |-
      de houder van de erkenning bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid; of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.51
  - number: 2.51.1.e
    text: |-
      de houder van de erkenning om andere redenen niet langer in staat moet worden geacht de erkende activiteit of in de
      erkenning opgenomen voorschriften na te komen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.51
  - number: 2.51.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      tijdelijke voorzieningen en de procedure bij intrekking van de erkenning.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.51
  - number: 2.52.1
    text: |-
      Een meetverantwoordelijke partij rapporteert aan de Autoriteit Consument en Markt over de uitvoering van het
      bepaalde bij of krachtens [artikel 2.48][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.52
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
  - number: 2.52.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de frequentie waarmee gerapporteerd wordt en de
      eisen waaraan een rapportage moet voldoen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.52
  - number: 2.53.1
    text: |-
      Een erkenning als bedoeld in [artikel 2.50, vierde lid][ref1], kan slechts worden overgedragen met toestemming van
      de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.53
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
  - number: 2.53.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de voorwaarden voor en de
      procedure bij het overdragen van een erkenning als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.53
  - number: 2.54.1
    text: |-
      Een leverancier die actief is op een primair allocatiepunt van een aangeslotene met een kleine aansluiting
      die beschikt over een meetinrichting zonder communicatiefunctionaliteit of een meetinrichting waarvan de
      communicatiefunctionaliteit administratief is uitgeschakeld:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.54
  - number: 2.54.1.a
    text: verzamelt en valideert meetgegevens en stelt deze vast ten behoeve van de aangeslotene;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.54
  - number: 2.54.1.b
    text: |-
      geeft overeenkomstig het bepaalde bij of krachtens [artikel 4.8, zesde lid][ref1], gegevens door.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.54
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 2.54.2
    text: De aangeslotene verleent medewerking aan de leverancier bij het verzamelen van meetgegevens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.54
  - number: 2.54.3
    text: 'Bij ministeriële regeling wordt bepaald welke meetgegevens worden verzameld en worden voorts regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.54
  - number: 2.54.3.a
    text: de frequentie waarmee meetgegevens worden verzameld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.54
  - number: 2.54.3.b
    text: de wijze waarop meetgegevens worden verzameld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.54
  - number: 2.54.3.c
    text: de nauwkeurigheidseisen voor het verzamelen van meetgegevens;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.54
  - number: 2.54.3.d
    text: de methoden voor het herleiden en berekenen ten behoeve van het valideren en vaststellen van meetgegevens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.54
  - number: 2.55.1
    text: |-
      Een aangeslotene met een grote aansluiting op het transmissiesysteem voor gas die uitsluitend gas invoedt of die
      een gasopslagbeheerder is:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
  - number: 2.55.1.a
    text: installeert en beheert op of nabij ieder overdrachtspunt een meetinrichting;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
  - number: 2.55.1.b
    text: verzamelt en valideert meetgegevens en stelt deze per geïnstalleerde meetinrichting vast; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
  - number: 2.55.1.c
    text: |-
      geeft overeenkomstig het bepaalde bij of krachtens [artikel 4.8, vijfde lid][ref1], gegevens van de door hem
      beheerde meetinrichtingen door.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 2.55.2
    text: 'Bij ministeriële regeling worden ten aanzien van de verplichtingen, genoemd in het eerste lid regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
  - number: 2.55.2.a
    text: het installeren en beheren van meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
  - number: 2.55.2.b
    text: het soort meetgegevens dat wordt verzameld, gevalideerd of vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
  - number: 2.55.2.c
    text: de frequentie waarmee meetgegevens worden verzameld, gevalideerd of vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
  - number: 2.55.2.d
    text: de wijze waarop meetgegevens worden verzameld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
  - number: 2.55.2.e
    text: de nauwkeurigheidseisen voor het verzamelen van meetgegevens;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
  - number: 2.55.2.f
    text: de methoden voor het herleiden en berekenen van de hoeveelheid gas en de energie-inhoud van het gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
  - number: 2.55.2.g
    text: de methoden voor het herleiden en berekenen ten behoeve van het valideren en vaststellen van meetgegevens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.55
  - number: 2.56.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het voor een partij, uitgezonderd de
      distributiesysteembeheerder of meetverantwoordelijke partij, in bij die maatregel te bepalen situaties en op
      daarbij te bepalen plaatsen, verboden is zonder erkenning van de Autoriteit Consument en Markt meetinrichtingen als
      bedoeld in [artikel 2.46, tweede lid][ref1], te installeren en te beheren en daar te meten.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.56
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 2.56.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen onderdelen van deze wet met betrekking tot een
      meetverantwoordelijke partij van overeenkomstige toepassing worden verklaard op de partij, bedoeld in het eerste
      lid, en kunnen ook overigens regels worden gesteld over de aanvraag, vereisten, wijziging, intrekking en overdracht
      van de erkenning, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.56
  - number: 2.57.1
    text: |-
      Een garantie van oorsprong voor elektriciteit uit hernieuwbare bronnen toont bij uitsluiting aan dat een producent
      de daarop aangegeven hoeveelheid elektriciteit heeft geproduceerd uit hernieuwbare bronnen of met energie uit
      hernieuwbare bronnen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.57
  - number: 2.57.2
    text: |-
      Een garantie van oorsprong voor elektriciteit geproduceerd in een installatie voor hoogrenderende
      warmtekrachtkoppeling toont bij uitsluiting aan dat een producent de daarop aangegeven hoeveelheid elektriciteit
      heeft geproduceerd in een installatie voor hoogrenderende warmtekrachtkoppeling.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.57
  - number: 2.57.3
    text: |-
      Een garantie van oorsprong voor gas uit hernieuwbare bronnen toont bij uitsluiting aan dat een producent de daarop
      aangegeven hoeveelheid gas heeft geproduceerd uit hernieuwbare bronnen of met energie uit hernieuwbare bronnen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.57
  - number: 2.57.4
    text: |-
      Een garantie van oorsprong voor elektriciteit uit niet-hernieuwbare bronnen toont bij uitsluiting aan dat een
      producent de daarop aangegeven hoeveelheid elektriciteit heeft geproduceerd uit een andere energiebron dan
      hernieuwbare bronnen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.57
  - number: 2.58.1
    text: |-
      Onze Minister is belast met het uitgeven, overdragen en innemen via een elektronisch systeem van garanties van
      oorsprong als bedoeld in [artikel 2.57][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.58.2
    text: |-
      Onze Minister opent op aanvraag van een in Nederland gevestigde producent, handelaar, leverancier, marktdeelnemer
      die aggregeert, eindafnemer, handelaar in garanties van oorsprong of de Nederlandse emissieautoriteit, bedoeld in
      [artikel 2.1 van de Wet milieubeheer][ref1], een rekening voor garanties van oorsprong. Bij deze aanvraag overlegt
      de producent het resultaat van de vaststelling, bedoeld in [artikel 3.63][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.7
        afdeling: '3.3'
  - number: 2.58.3
    text: |-
      Onze Minister boekt op aanvraag garanties van oorsprong als bedoeld in [artikel 2.57][ref1], op een daarbij
      aangegeven rekening voor garanties van oorsprong, indien een in Nederland gevestigde producent of, indien is
      voldaan aan de regels gesteld bij of krachtens het vierde lid, een marktdeelnemer die aggregeert, bij deze aanvraag
      de gegevens overlegt omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.58.3.a
    text: |-
      de gemeten hoeveelheid geproduceerde elektriciteit uit hernieuwbare bronnen of uit andere bronnen, gas uit
      hernieuwbare bronnen; of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.58
  - number: 2.58.3.b
    text: |-
      indien een producent van elektriciteit of gas gebruik maakt van omzetting van energie in een andere vorm van
      energie:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.58
  - number: 2.58.3.b.1°
    text: de gemeten hoeveelheid geproduceerde elektriciteit of geproduceerd gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.58
  - number: 2.58.3.b.2°
    text: |-
      de gemeten hoeveelheid energie uit hernieuwbare bronnen of uit andere bronnen die is gebruikt voor de opwekking van
      de hoeveelheid, bedoeld onder 1°; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.58
  - number: 2.58.3.b.3°
    text: |-
      het bewijs van afboeking of verzoek tot afboeking van garanties van oorsprong als
      bedoeld in [artikel 2.57][ref1], garanties van oorsprong voor thermische energie uit
      hernieuwbare bronnen als bedoeld in [artikel 1, eerste lid, van de Warmtewet][ref2]
      of garanties van oorsprong voor ander gas uit hernieuwbare bronnen als bedoeld in
      [artikel 1 van de Wet implementatie EU-richtlijn hernieuwbare energie voor garanties van oorsprong][ref3] van een
      Nederlandse rekening voor garanties van oorsprong voor de gemeten hoeveelheid onder 2°.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0046743#Artikel1
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0046743
        artikel: '1'
  - number: 2.58.4
    text: |-
      Bij ministeriële regeling worden regels gesteld over de situaties waarin en de voorwaarden waaronder Onze Minister
      garanties van oorsprong als bedoeld in [artikel 2.57, eerste lid][ref1], bijboekt op de rekening voor garanties van
      oorsprong van een marktdeelnemer die aggregeert ten behoeve van een actieve afnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.58.5
    text: |-
      Onze Minister kan de taken, bedoeld in het eerst tot en met derde lid, mandateren aan een niet-ondergeschikte
      die onafhankelijk is van producenten, handelaren, marktdeelnemers die aggregeren en handelaren in garanties van
      oorsprong.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.58
  - number: '2.59'
    text: |-
      Een leverancier zorgt ervoor dat als bewijs van levering van elektriciteit, of gas uit hernieuwbare bronnen, aan
      een in Nederland gevestigde eindafnemer binnen één maand na de levering een corresponderende hoeveelheid garanties
      van oorsprong als bedoeld in [artikel 2.57][ref1] van een Nederlandse rekening voor garanties van oorsprong wordt
      afgeboekt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.59
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.60.1
    text: |-
      Garanties van oorsprong uitgegeven door een onafhankelijke instantie in een andere lidstaat van de Europese
      Unie, die naar aard en strekking overeenkomen met in Nederland uitgegeven garanties van oorsprong als bedoeld in
      [artikel 2.57][ref1] worden daarmee gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.60
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.60.2
    text: |-
      Garanties van oorsprong uitgegeven door een onafhankelijke instantie in een derde land worden niet erkend, behalve
      indien de Europese Unie daarvoor een overeenkomst heeft afgesloten met het derde land en de energie rechtstreeks
      uit dat land wordt ingevoerd of uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.60
  - number: 2.61.1
    text: |-
      Bij ministeriële regeling worden tarieven vastgesteld ter dekking van de kosten die worden gemaakt met betrekking
      tot de activiteiten, bedoeld in [artikel 2.58][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.61.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.61
  - number: 2.61.2.a
    text: |-
      de informatie die een producent, handelaar, leverancier, marktdeelnemer die aggregeert, eindafnemer, handelaar
      in garanties van oorsprong, transmissie- of distributiesysteembeheerder, of de transmissiesysteembeheerder voor
      elektriciteit op zee verstrekt aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.61
  - number: 2.61.2.b
    text: |-
      de uitgifte en de geldigheidsduur van garanties van oorsprong als bedoeld in [artikel 2.57][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.61.2.c
    text: |-
      de gegevens die worden vermeld op garanties van oorsprong als bedoeld in [artikel 2.57][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.61.2.d
    text: |-
      de voorwaarden waaronder en de wijze waarop een producent, handelaar, leverancier, marktdeelnemer die aggregeert,
      eindafnemer, of handelaar in garanties van oorsprong, gebruik kunnen maken van de door hen verkregen garanties van
      oorsprong als bedoeld in [artikel 2.57][ref1], of deze kunnen verhandelen;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.61.2.e
    text: |-
      de vaststelling, bedoeld in [artikel 3.63][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.7
        afdeling: '3.3'
  - number: 2.61.2.f
    text: |-
      het meten van de hoeveelheden, bedoeld in [artikel 2.58, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.61.2.g
    text: dat het verstrekken van de informatie, bedoeld in onderdeel a, uitsluitend langs elektronische weg kan geschieden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.61
  - number: 2.61.3
    text: |-
      De regels, bedoeld in het tweede lid, kunnen verschillen voor de verschillende soorten garanties van oorsprong als
      bedoeld in [artikel 2.57][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.62.1
    text: |-
      Het is een aangeslotene op het transmissie- of distributiesysteem van gas met ingang van 1 oktober 2022 verboden
      via een aansluiting die is verbonden met dat deel van het transmissie- of distributiesysteem voor gas waarmee
      laagcalorisch gas wordt getransporteerd in een gasjaar meer dan 100 miljoen m3(n) gas aan dat transmissie- of
      distributiesysteem te onttrekken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.62
  - number: 2.62.2
    text: |-
      Indien installaties die behoren tot eenzelfde onderneming of instelling, die onderling technische, organisatorische
      of functionele bindingen hebben en in elkaars onmiddellijke nabijheid zijn gelegen, van gas worden voorzien
      door middel van meer dan één aansluiting, is het met ingang van 1 oktober 2022 verboden via die gezamenlijke
      aansluitingen meer dan 100 miljoen m3(n) gas te onttrekken aan dat deel van het transmissie- of distributiesysteem
      voor gas waarmee laagcalorisch gas wordt getransporteerd, indien een of meerdere van die aansluitingen na 20 juli
      2020 zijn gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.62
  - number: 2.62.3
    text: Dit artikel vervalt met ingang van 1 oktober 2030 of op een bij koninklijk besluit eerder te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.62
  - number: 2.62.4
    text: Het eerste en tweede lid zijn niet van toepassing op een aangeslotene, zijnde een gasopslagbeheerder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.62
  - number: 2.63.1
    text: |-
      Het is een aangeslotene op het transmissie- of distributiesysteem van gas die in de gasjaren 2016/2017,
      2017/2018 en 2018/2019 in ten minste twee van die gasjaren meer dan 100 miljoen m3 (n) gas via diens aansluiting
      heeft onttrokken en die verbonden is met dat deel van het transmissie- of distributiesysteem voor gas waarmee
      laagcalorisch gas wordt getransporteerd, met ingang van 1 oktober 2022 verboden via die aansluiting gas aan dat
      deel van het transmissie- of distributiesysteem te onttrekken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.63
  - number: 2.63.2
    text: |-
      Deze aangeslotene meldt zo spoedig mogelijk na inwerkingtreding van dit artikel schriftelijk aan de
      transmissiesysteembeheerder voor gas dat zijn aansluiting omgeschakeld of buiten werking gesteld dient te worden
      en verstrekt hem alle gegevens die naar diens oordeel relevant zijn voor een voor de bedrijfsprocessen van de
      aangeslotene doelmatige en efficiënte planning van het omschakelen onderscheidenlijk buiten werking stellen van de
      betrokken aansluiting. De aangeslotene stuurt een afschrift van deze melding en de daarbij gevoegde gegevens aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.63
  - number: 2.63.3
    text: Het eerste en tweede lid zijn niet van toepassing op een aangeslotene, zijnde een gasopslagbeheerder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.63
  - number: 2.64.1
    text: |-
      De aangeslotene die ingevolge [artikel 2.63, tweede lid][ref1], de transmissiesysteembeheerder voor gas heeft
      gemeld dat diens aansluiting buiten werking gesteld dient te worden, informeert de transmissiesysteembeheerder
      en Onze Minister over de planning van de buitenwerkingstelling, voorzien van een onderbouwing van de benodigde
      tijd voor de onderscheiden activiteiten die naar zijn oordeel noodzakelijk zijn om afgesloten te kunnen worden
      van het transmissie- of distributiesysteem voor gas en, voor zover aan de orde, over te kunnen stappen naar een
      alternatieve energiebron.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.64
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
  - number: 2.64.2
    text: |-
      Indien de planning naar het oordeel van de aangeslotene als gevolg van gewijzigde omstandigheden aanpassing
      behoeft, informeert de eindafnemer de transmissiesysteembeheerder voor gas en Onze Minister zo spoedig mogelijk
      over de aangepaste planning. De aangepaste planning wordt voorzien van een onderbouwing van elke afwijking ten
      opzichte van de eerder ingediende planning.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.64
  - number: 2.65.1
    text: |-
      Onze Minister kan een aangeslotene op diens verzoek ontheffing verlenen van het verbod, bedoeld in
      [artikel 2.63, eerste lid][ref1], gedurende een in de ontheffing te bepalen periode, voor zover verlenging
      noodzakelijk is vanwege omstandigheden die niet zijn toe te rekenen aan de aangeslotene of redelijkerwijs niet door
      hem hadden kunnen worden voorzien of voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.65
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
  - number: 2.65.2
    text: |-
      Onze Minister kan een aangeslotene die op grond van [artikel 2.63, tweede lid][ref1], heeft gemeld dat diens
      aansluiting afgesloten dient te worden, op diens verzoek ontheffing verlenen van het verbod, bedoeld in artikel
      2.63, eerste lid, gedurende een in de ontheffing te bepalen periode, voor zover verlenging voor die periode
      noodzakelijk is om tot een stabiel verbruik van energie uit een andere bron dan gas afkomstig uit het transmissie-
      of distributiesysteem voor gas te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.65
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
  - number: 2.65.3
    text: |-
      Indien een ontheffing als bedoeld in het eerste of tweede lid is verleend, is [artikel 2.62, eerste lid][ref1],
      niet van toepassing op de betreffende aangeslotene voor de duur van die ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.65
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
  - number: 2.65.4
    text: |-
      Onze Minister kan een aangeslotene een ontheffing verlenen van het verbod, bedoeld in
      [artikel 2.62, eerste lid][ref1], voor zover dit gelet op de leveringszekerheid van gas, warmte of elektriciteit
      nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.65
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
  - number: 2.65.5
    text: |-
      Aan een ontheffing kunnen voorschriften en beperkingen worden verbonden, die mede betrekking kunnen hebben op de
      maximale toegestane hoeveelheid laagcalorisch gas die per gasjaar of gedurende de periode waarvoor de ontheffing is
      verleend door de afnemer aan het transmissie- of distributiesysteem voor gas mag worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.65
  - number: 2.65.6
    text: Het is verboden in strijd te handelen met aan een ontheffing verbonden voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.65
  - number: 2.65.7
    text: 'Onze Minister kan een ontheffing intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.65
  - number: 2.65.7.a
    text: niet langer wordt voldaan aan de gronden voor verlening van een ontheffing;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.65
  - number: 2.65.7.b
    text: |-
      degene aan wie de ontheffing is verleend in strijd handelt met een aan de ontheffing verbonden voorschrift of
      beperking;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.65
  - number: 2.65.7.c
    text: |-
      onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een andere
      beschikking zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.65
  - number: 2.65.8
    text: |-
      Onze Minister stuurt een afschrift van een op grond van dit artikel genomen besluit tot verlening of intrekking van
      een ontheffing aan de Autoriteit Consument en Markt en aan de transmissiesysteembeheerder voor gas.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.65
  - number: 2.66.1
    text: Het is verboden te handelen in strijd met de artikelen 3, 4 en 5 van [verordening 1227/2011](32011R1227).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.66
  - number: 2.66.2
    text: Overtreding van het eerste lid is een misdrijf.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.66
  - number: '2.67'
    text: |-
      Het is een natuurlijk persoon of rechtspersoon, niet zijnde een systeembeheerder, verboden wettelijke taken of
      verplichtingen uit te voeren, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.67
  - number: 2.67.a
    text: werkzaamheden die een systeembeheerder aan die natuurlijk persoon of rechtspersoon uitbesteedt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.67
  - number: 2.67.b
    text: |-
      de aanleg of verwijdering van een leiding en daarmee verbonden hulpmiddelen, bedoeld in [artikel 3.39][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.67
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 2.67.c
    text: werkzaamheden die verband houden met tijdelijke taken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.67
  - number: 2.68.1
    text: |-
      Een huishoudelijk eindafnemer en een micro-onderneming hebben recht op kosteloze toegang tot ten minste één
      onafhankelijk vergelijkingsinstrument dat de gehele energiemarkt bestrijkt of meerdere vergelijkingsinstrumenten
      die in voldoende mate de markt bestrijken, waarmee ze het aanbod van leveranciers, met uitzondering van het aanbod
      om ten behoeve van eindafnemers te faciliteren in peer-to-peer-handel, kunnen vergelijken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.68
  - number: 2.68.2
    text: |-
      Het vergelijkingsinstrument als bedoeld in het eerste lid, voldoet aan bij of krachtens algemene maatregel van
      bestuur nader te stellen regels.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.68
  - number: 2.68.3
    text: |-
      Een vergelijkingsinstrument dat voldoet aan de eisen, bedoeld in het tweede lid, wordt op verzoek van de aanbieder
      van het vergelijkingsinstrument gecertificeerd door de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.68
  - number: 2.68.4
    text: |-
      Indien naar het oordeel van Onze Minister de toegang, bedoeld in het eerste lid, niet door het normale
      functioneren van de markt wordt of zal kunnen worden gegarandeerd, kan Onze Minister een partij aanwijzen die een
      vergelijkingsinstrument voor ten hoogste tien jaar verzorgt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.68
  - number: 2.68.5
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.68
  - number: 2.68.5.a
    text: de procedure voor de aanvraag van de certificering, bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.68
  - number: 2.68.5.b
    text: 'de aanwijzing, bedoeld in het vierde lid, welke regels onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.68
  - number: 2.68.5.b.1°
    text: de voor de aanwijzing te volgen procedure;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.68
  - number: 2.68.5.b.2°
    text: voorschriften en beperkingen die aan de aanwijzing worden verbonden;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.68
  - number: 2.68.5.b.3°
    text: |-
      taken die aan de Autoriteit Consument en Markt worden opgedragen en bevoegdheden die aan de Autoriteit Consument en
      Markt worden verleend in het geval een aanwijzing is gegeven.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.68
  - number: 2.68.6
    text: |-
      Als niet langer voldaan wordt aan de voorschriften, bedoeld in het tweede lid, dan wel de voorschriften en
      beperkingen, bedoeld in het vijfde lid, onderdeel b, kan de Autoriteit Consument en Markt de certificering
      onderscheidenlijk Onze Minister de aanwijzing intrekken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.68
  - number: 3.1.1
    text: |-
      Een onderneming die eigenaar is van of die alle aandelen heeft in de rechtspersoon die eigenaar is van een
      transmissiesysteem, distributiesysteem of interconnectorsysteem draagt er zorg voor:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.1
  - number: 3.1.1.a
    text: |-
      dat de beheerder van het systeem krachtens [artikel 3.4][ref1] is gecertificeerd of, indien het systeem voldoet
      aan de kenmerken gesteld bij of krachtens [artikel 3.7][ref2], dat het systeem krachtens artikel 3.7 als gesloten
      systeem is erkend; en


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.1.1.b
    text: |-
      dat krachtens [artikel 3.2][ref1] of [3.6][ref2] een beheerder voor zijn systeem is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.1.2
    text: |-
      Een onderneming die eigenaar is van een LNG-systeem of een gasopslagsysteem draagt er zorg voor dat krachtens
      [artikel 3.2, eerste lid, onderdeel h respectievelijk i][ref1], een beheerder is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.1.3
    text: |-
      Een onderneming die eigenaar is van een systeem waarvoor geen beheerder is aangewezen, handelt als beheerder van
      zijn systeem. De wettelijke taken en verplichtingen zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.1
  - number: 3.2.1
    text: |-
      Onze Minister kan op aanvraag een rechtspersoon die eigenaar is van of die alle aandelen heeft in de rechtspersoon
      die eigenaar is van een:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.2
  - number: 3.2.1.a
    text: transmissiesysteem voor elektriciteit, aanwijzen als beheerder van dat transmissiesysteem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.2
  - number: 3.2.1.b
    text: interconnectorsysteem voor elektriciteit aanwijzen als beheerder van dat interconnectorsysteem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.2
  - number: 3.2.1.c
    text: transmissiesysteem voor gas, aanwijzen als beheerder van dat transmissiesysteem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.2
  - number: 3.2.1.d
    text: interconnectorsysteem voor gas aanwijzen als beheerder van dat interconnectorsysteem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.2
  - number: 3.2.1.e
    text: distributiesysteem voor elektriciteit, aanwijzen als beheerder van dat distributiesysteem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.2
  - number: 3.2.1.f
    text: distributiesysteem voor gas, aanwijzen als beheerder van dat distributiesysteem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.2
  - number: 3.2.1.g
    text: |-
      transmissiesysteem voor elektriciteit op zee, aanwijzen als beheerder van dat transmissiesysteem, mits die
      rechtspersoon onderdeel uitmaakt van de infrastructuurgroep waartoe de transmissiesysteembeheerder voor
      elektriciteit behoort;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.2
  - number: 3.2.1.h
    text: LNG-systeem, aanwijzen als beheerder van dat systeem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.2
  - number: 3.2.1.i
    text: gasopslagsysteem, aanwijzen als beheerder van dat systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.2
  - number: 3.2.2
    text: |-
      In afwijking van het eerste lid kan Onze Minister bij overdracht van de eigendom van een systeem indien de
      aanwijzing vervalt, op aanvraag van de rechtspersoon die eigenaar wordt van of die alle aandelen krijgt in de
      rechtspersoon die eigenaar wordt van dat systeem, die rechtspersoon aanwijzen als beheerder van het betreffende
      systeem. De aanwijzing treedt in werking op de dag waarop overdracht van de eigendom van het systeem plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.2
  - number: 3.3.1
    text: |-
      Onze Minister wijst een aanvraag van een rechtspersoon als bedoeld in
      [artikel 3.2, eerste lid, de onderdelen a tot en met g][ref1], af als die rechtspersoon niet krachtens
      [artikel 3.4][ref2] is gecertificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.3.2
    text: |-
      Onze Minister kan een aanvraag van een rechtspersoon als bedoeld in
      [artikel 3.2, eerste lid, onderdelen a, c, e of f][ref1], afwijzen of voorschriften verbinden aan de aanwijzing
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.3.2.a
    text: |-
      de rechtspersoon niet voldoet aan de bij of krachtens [paragraaf 3.2.1][ref1] gestelde voorschriften inzake
      inrichting van de rechtspersoon of de infrastructuurgroep waartoe die rechtspersoon behoort niet voldoet
      aan de bij of krachtens [paragraaf 3.2.2][ref2] gestelde voorschriften inzake de infrastructuurgroep en de
      infrastructuurbedrijven; of


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.3.2.b
    text: |-
      de rechtspersoon redelijkerwijs niet in staat moet worden geacht de taken of verplichtingen gesteld bij of
      krachtens de [afdelingen 3.3][ref1] en [3.4][ref2] uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3.3.3
    text: |-
      Onze Minister kan een aanvraag van een rechtspersoon als bedoeld in
      [artikel 3.2, eerste lid, onderdeel b of d][ref1], afwijzen of voorschriften verbinden aan de aanwijzing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.3.3.a
    text: |-
      de rechtspersoon niet voldoet aan de bij of krachtens [artikel 3.90][ref1] geldende bepalingen inzake de inrichting
      van de rechtspersoon; of


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.3.3.b
    text: |-
      de rechtspersoon redelijkerwijs niet in staat moet worden geacht de taken of verplichtingen gesteld bij of
      krachtens [paragraaf 3.5.2][ref1] uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.3.4
    text: |-
      Onze Minister kan een aanvraag van een rechtspersoon als bedoeld in [artikel 3.2, eerste lid, onderdeel g][ref1],
      afwijzen of voorschriften verbinden aan de aanwijzing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.3.4.a
    text: |-
      de rechtspersoon niet voldoet aan de krachtens [artikel 3.85][ref1] geldende bepalingen inzake inrichting van de
      rechtspersoon of de infrastructuurgroep waartoe de rechtspersoon behoort niet voldoet aan de krachtens dat artikel
      geldende bepalingen inzake de infrastructuurgroep; of


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
