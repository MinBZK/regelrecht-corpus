        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
  - number: 3.86.1.b
    text: een eindafnemer die geen elektriciteit opwekt anders dan voor eigen gebruik.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.86
  - number: 3.86.2
    text: |-
      De transmissiesysteembeheerder voor elektriciteit op zee doet op verzoek van een aangeslotene als bedoeld in het
      eerste lid een aanbod tot het verzorgen van transport van elektriciteit over zijn systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.86
  - number: 3.86.3
    text: |-
      In afwijking van het eerste lid, onderdeel b, en het tweede lid kan de transmissiesysteembeheerder
      voor elektriciteit op zee een verzoek van een eindafnemer afwijzen indien er onvoldoende aansluit- of
      transportcapaciteit beschikbaar is op het dichtstbijzijnde voor aansluiting geschikte punt op zijn systeem om aan
      het verzoek te kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.86
  - number: 3.87.1
    text: |-
      Een aangeslotene als bedoeld in [artikel 3.86, eerste lid, onderdeel a][ref1], heeft recht op vergoeding van schade
      door de transmissiesysteembeheerder voor elektriciteit op zee, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.87
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
  - number: 3.87.1.a
    text: |-
      deze transmissiesysteembeheerder het voor de ontsluiting van het windpark noodzakelijk deel van het
      transmissiesysteem op zee geheel of gedeeltelijk later oplevert dan in het ontwikkelkader, bedoeld in
      [artikel 3.83][ref1], is opgenomen en de aangeslotene hierdoor geheel of gedeeltelijk geen elektriciteit kan laten
      transporteren;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.87
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
  - number: 3.87.1.b
    text: |-
      de hoeveelheid met het aangesloten windpark geproduceerde elektriciteit die in een kalenderjaar niet kan worden
      getransporteerd over het transmissiesysteem op zee groter is dan de hoeveelheid elektriciteit die niet kan worden
      getransporteerd wegens gemiddeld voor het transmissiesysteem voor elektriciteit op zee redelijkerwijs noodzakelijk
      onderhoud en de aangeslotene hierdoor geheel of gedeeltelijk geen elektriciteit kan laten transporteren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.87
  - number: 3.87.2
    text: |-
      De vergoeding van de schade bestaat uit gevolgschade en de schade ten gevolge van gederfde of uitgestelde inkomsten
      door het niet kunnen laten transporteren van met het aangesloten windpark geproduceerde elektriciteit, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.87
  - number: 3.87.3
    text: |-
      Een aangeslotene als bedoeld in [artikel 3.86, eerste lid, onderdeel a][ref1], draagt er zorg voor dat de schade zo
      veel mogelijk beperkt blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.87
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
  - number: 3.87.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het recht op schadevergoeding,
      bedoeld in het eerste lid, en de bestanddelen van de vergoeding, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.87
  - number: 3.88.1
    text: |-
      Een interconnectorsysteembeheerder voor elektriciteit, die een interconnectorsysteem voor elektriciteit met
      een lidstaat of een land dat onderdeel uitmaakt van de Europese economische ruimte beheert die krachtens
      [artikel 3.2, eerste lid, aanhef en onderdeel b][ref1], is aangewezen, is uit dien hoofde belast met de taken en
      verplichtingen die bij of krachtens [verordening 2019/943](32843R2019) of andere bindende EU-rechtshandeling op het
      gebied van elektriciteit aan interconnectorsysteembeheerders zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.88
    references:
