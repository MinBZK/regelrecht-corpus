  - number: 3.86.1
    text: |-
      De transmissiesysteembeheerder voor elektriciteit op zee doet op verzoek een aanbod tot aanleg van een aansluiting
      op zijn systeem of een aanbod om een aansluiting in gebruik te geven, te beheren en te onderhouden aan:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.86
  - number: 3.86.1.a
    text: |-
      een houder van een vergunning als bedoeld in [artikel 16, eerste lid, van de Wet windenergie op zee][ref1],
      overeenkomstig het ontwikkelkader windenergie op zee, bedoeld in [artikel 3.83][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.86
    references:
