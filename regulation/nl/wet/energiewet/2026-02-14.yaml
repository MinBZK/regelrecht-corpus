        afdeling: '3.6'
  - number: 3.117.a
    text: |-
      de taak, bedoeld in [artikel 3.86, eerste lid, onderdeel a][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.117
    references:
