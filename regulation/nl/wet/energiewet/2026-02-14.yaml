        bwb_id: BWBR0007119
        artikel: '16'
  - number: 1.4.1
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden meerdere onroerende zaken als bedoeld in
      [artikel 16, onderdeel c, van de Wet waardering onroerende zaken][ref1], beschouwd als één onroerende zaak als
      bedoeld in artikel 16 van de Wet waardering onroerende zaken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 1.4.1.a
    text: 'de onroerende zaken zich bevinden in een bouwwerk met:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.1.a.1°
    text: |-
      een woonfunctie bestemd voor bewoners die zijn ingeschreven bij een instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref1] of een universiteit of hogeschool als bedoeld in
      [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] of die zich
      voorbereiden op een promotie als bedoeld in [artikel 7.18 van laatstgenoemde wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 1.4.1.a.2°
    text: een woonoppervlak van maximaal 50 vierkante meter per wooneenheid; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.1.a.3°
    text: |-
      gemeenschappelijke ruimtes die een meeromvattende functie hebben dan de reguliere functie van gemeenschappelijke
      ruimten in een appartementencomplex; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.1.b
    text: de eigenaar van de onroerende zaken zijn keuze hiervoor kenbaar maakt bij zijn systeembeheerder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.2
    text: |-
      De keuze, bedoeld in het eerste lid, onderdeel b, kan slechts worden ingetrokken ingeval van ingrijpende renovatie
      van het bouwwerk.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.3
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden twee of meer op land gelegen installaties voor
      productie, opslag, conversie of verbruik van elektriciteit beschouwd als één installatie en één onroerende zaak als
      bedoeld in [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 1.4.3.a
    text: de installaties zich in elkaars onmiddellijke nabijheid bevinden;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.3.b
    text: |-
      de eigenaren van die installaties gezamenlijk een aansluitovereenkomst en een transportovereenkomst hebben gesloten
      met de transmissie- of distributiesysteembeheerder voor elektriciteit; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.3.c
    text: |-
      de gevraagde aansluitcapaciteit meer bedraagt dan een bij of krachtens algemene maatregel van bestuur vastgesteld
      minimum;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.3.d
    text: |-
      het aantal installaties niet meer bedraagt dan een bij of krachtens algemene maatregel van bestuur vastgesteld
      maximum.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.4
    text: |-
      De eigenaren van de installaties melden de ingebruikname van een gezamenlijke aansluiting als bedoeld in het derde
      lid zo spoedig mogelijk aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.5
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden verschillende op land gelegen
      windparken of installaties voor productie van elektriciteit met behulp van zonne-energie die behoren
      tot eenzelfde groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1],
      beschouwd als één installatie en één onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 1.4.5.a
    text: de installaties zich in elkaars onmiddellijke nabijheid bevinden; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.5.b
    text: deze installaties onderling technische, organisatorische of functionele bindingen hebben.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.4.6
    text: |-
      Het vijfde lid is niet van toepassing indien de transmissie- of distributiesysteembeheerder voor elektriciteit aan
      de producent een aanbod voor het aanleggen van meerdere aansluitingen heeft gedaan en dit leidt tot lagere kosten
      voor de transmissie- of distributiesysteembeheerder voor elektriciteit.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.4
  - number: 1.5.1
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt een organisatie die geen onderneming is,
      beschouwd als een:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.5
  - number: 1.5.1.a
    text: |-
      micro-onderneming indien de organisatie eindafnemer of actieve afnemer is en minder dan tien werknemers heeft, een
      jaaromzet of een jaarlijks balanstotaal heeft van ten hoogste € 2 miljoen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.5
  - number: 1.5.1.b
    text: |-
      kleine onderneming indien de organisatie eindafnemer of actieve afnemer is en minder dan vijftig werknemers heeft,
      een jaaromzet of een jaarlijks balanstotaal heeft van ten hoogste € 10 miljoen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.5
  - number: 1.5.2
    text: |-
      De vertegenwoordiger van een groep gezamenlijk optredende eindafnemers beschikt over toestemming tot
      vertegenwoordiging van de betrokken eindafnemers.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.5
  - number: 1.6.1
    text: |-
      Deze wet en de daarop berustende bepalingen zijn mede van toepassing binnen de exclusieve economische zone
      van Nederland zoals vastgesteld bij of krachtens de [Rijkswet instelling exclusieve economische zone][ref1],
      op de daar aanwezige systemen, installaties die zijn aangesloten op die systemen en de marktdeelnemers,
      balanceringsverantwoordelijken of eindafnemers die gebruik maken van die systemen.


      [ref1]: https://wetten.overheid.nl/BWBR0010480
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0010480
  - number: 1.6.2
    text: |-
      In afwijking van het eerste lid is deze wet en de daarop berustende bepalingen van toepassing op
      interconnectorsystemen voor gas met derde landen vanaf het connectiepunt met het Nederlands transmissiesysteem voor
      gas tot en met de territoriale zee.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.6
  - number: 1.7.1
    text: |-
      Bij de toepassing van de regels gesteld bij of krachtens deze wet is het uitgangspunt dat energiearmoede wordt
      tegengegaan.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.7
  - number: 1.7.2
    text: Bij algemene maatregel van bestuur geeft Onze Minister een definitie van energiearmoede.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.7
  - number: 1.7.3
    text: |-
      Jaarlijks wordt gelijktijdig met de klimaat- en energieverkenning als bedoeld in
      [artikel 6 van de Klimaatwet][ref1] door een of meer bij algemene maatregel van bestuur aan te wijzen instanties
      een monitor uitgevoerd van de mate van energiearmoede in de samenleving, wie het betreft en wat de ontwikkelingen
      zijn met betrekking tot het terugdringen van energiearmoede.


      [ref1]: https://wetten.overheid.nl/BWBR0042394#Artikel6
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0042394
        artikel: '6'
  - number: 2.1.1
    text: |-
      Een aangeslotene sluit voor het afnemen van elektriciteit of gas van een transmissie- of distributiesysteem met het
      oog op het verbruik daarvan een leveringsovereenkomst of een leveringsovereenkomst inzake peer-to-peer handel.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.1
  - number: 2.1.2
    text: |-
      Een eindafnemer is vrij een leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel te sluiten
      met een leverancier van zijn keuze.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.1
  - number: 2.1.3
    text: Een actieve afnemer is vrij een aggregatieovereenkomst te sluiten met een marktdeelnemer van zijn keuze.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.1
  - number: 2.2.1
    text: |-
      Een eindafnemer van elektriciteit of actieve afnemer die op zijn aansluiting met meer dan één marktdeelnemer een
      overeenkomst sluit inzake levering, teruglevering of facilitering in peer-to-peer-handel, draagt er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.2
  - number: 2.2.1.a
    text: |-
      hij op of nabij het overdrachtspunt van zijn aansluiting beschikt over een meetinrichting waarvan de
      communicatiefunctionaliteit wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.2
  - number: 2.2.1.b
    text: |-
      overeenkomstig [artikel 3.44, derde lid][ref1], aan zijn aansluiting voldoende additionele allocatiepunten zijn
      toegekend, opdat elke gecontracteerde marktdeelnemer actief kan zijn op een eigen allocatiepunt; en


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 2.2.1.c
    text: |-
      de afname of invoeding ten behoeve van elke gecontracteerde marktdeelnemer kan worden vastgesteld op basis
      van meetgegevens die tot stand komen met behulp van meetinrichtingen die voldoen aan het bepaalde krachtens
      [artikel 2.46, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 2.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de voorwaarden waaronder
      een eindafnemer of actieve afnemer op zijn aansluiting met meer dan één marktdeelnemer een overeenkomst kan
      sluiten.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.2
  - number: 2.2.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat in afwijking van het eerste lid, onderdeel
      c, het verbruik kan worden toegerekend op basis van afspraken tussen marktdeelnemers, indien deze afspraken voldoen
      aan de bij die maatregel vast te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.2
  - number: 2.3.1
    text: 'Het is een marktdeelnemer verboden een eindafnemer of actieve afnemer:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.3
  - number: 2.3.1.a
    text: |-
      ervan te weerhouden elektriciteit te produceren met het oog op eigen verbruik, opslag, verkoop of levering aan
      derden, of actief te zijn op het gebied van flexibiliteit of energie-efficiëntie,
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.3
  - number: 2.3.1.b
    text: ervan te weerhouden te participeren in een energiegemeenschap;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.3
  - number: 2.3.1.c
    text: |-
      ervan te weerhouden een recht uit te oefenen dat hem op grond van [artikel 2.1, tweede of derde lid][ref1] toekomt;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: 2.3.1.d
    text: |-
      ervan te weerhouden op zijn aansluiting met meer dan één marktdeelnemer overeenkomsten te sluiten als bedoeld in
      [artikel 2.2, eerste lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: 2.3.1.e
    text: |-
      te benadelen omdat hij activiteiten als bedoeld in de onderdelen a, b of d, onderneemt of een recht als bedoeld in
      onderdeel c uitoefent.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.3
  - number: 2.3.2
    text: |-
      Bepalingen in overeenkomsten met eindafnemers of actieve afnemers die strijdig zijn met één of meerdere van de in
      het eerste lid genoemde verboden zijn vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.3
  - number: 2.4.1
    text: |-
      Een energiegemeenschap neemt in haar statuten, of, in geval van een personenvennootschap, in een overeenkomst, ten
      minste op dat:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.4
  - number: 2.4.1.a
    text: de participatie in de energiegemeenschap open en vrijwillig is;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.4
  - number: 2.4.1.b
    text: de leden, vennoten, of aandeelhouders het recht hebben de energiegemeenschap te verlaten; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.4
  - number: 2.4.1.c
    text: |-
      de feitelijke zeggenschap over de energiegemeenschap is gelegen bij leden, vennoten of aandeelhouders die
      natuurlijk personen, micro-ondernemingen, kleine ondernemingen, gemeenten, waterschappen, provincies of
      gemeenschappelijke regelingen zijn.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.4
  - number: 2.4.2
    text: 'Een energiegemeenschap die hernieuwbare energieprojecten ontwikkelt, kan:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.4
  - number: 2.4.2.a
    text: |-
      in aanvulling op het eerste lid, in de statuten of de overeenkomst opnemen dat de leden, vennoten of aandeelhouders
      van de energiegemeenschap enkel natuurlijk personen, gemeenten, waterschappen, provincies, gemeenschappelijke
      regelingen of micro-ondernemingen, kleine ondernemingen of middelgrote ondernemingen zijn;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.4
  - number: 2.4.2.b
    text: |-
      in afwijking van het eerste lid, onderdeel c, de feitelijke zeggenschap over de energiegemeenschap bij die
      leden, vennoten of aandeelhouders van de rechtspersoon leggen, die in de nabije omgeving van de hernieuwbare-
      energieprojecten zijn gevestigd; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.4
  - number: 2.4.2.c
    text: in haar statuten bepalen dat de deelnemende leden, vennoten of aandeelhouders een gelijk stemrecht hebben.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.4
  - number: 2.5.1
    text: |-
      Een leverancier die elektriciteit of gas levert aan een eindafnemer levert tegen transparante en redelijke prijzen
      alsmede onder transparante en redelijke voorwaarden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.5
  - number: 2.5.2
    text: 'Een prijs is niet redelijk indien die prijs:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.5
  - number: 2.5.2.a
    text: onevenredig hoog is gezien de kosten van de leverancier, en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.5
  - number: 2.5.2.b
    text: niet concurrerend is.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.5
  - number: 2.5.3
    text: |-
      Een leverancier die elektriciteit of gas levert aan een eindafnemer presenteert zijn prijzen en voorwaarden
      op een dusdanige wijze dat eindafnemers in staat zijn prijzen en voorwaarden van verschillende leveranciers te
      vergelijken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.5
  - number: 2.5.4
    text: |-
      Een leverancier die ten behoeve van een eindafnemer faciliteert in peer-to-peer-handel handelt tegen transparante
      kosten alsmede onder transparante en redelijke voorwaarden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.5
  - number: 2.5.5
    text: |-
      Een leverancier die faciliteert in peer-to-peer-handel draagt er zorg voor dat de hoeveelheid elektriciteit die
      op grond van door hem gesloten leveringsovereenkomsten inzake peer-to-peer-handel wordt geleverd aan eindafnemers
      over de periode van een jaar niet groter is dan de hoeveelheid elektriciteit die op grond van door hem gesloten
      terugleveringsovereenkomsten inzake peer-to-peer-handel in dat jaar wordt teruggeleverd door actieve afnemers.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.5
  - number: 2.5.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de voorwaarden aan
      leveranciers in het eerste tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.5
  - number: 2.6.1
    text: Een leverancier levert een eindafnemer elektriciteit of gas op basis van een leveringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.2
    text: |-
      Een leverancier faciliteert in peer-to-peer-handel ten behoeve van een eindafnemer op basis van een
      leveringsovereenkomst inzake peer-to-peer-handel.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.3
    text: 'Een leverancier draagt er zorg voor dat de overeenkomst met een eindafnemer:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.3.a
    text: transparant en volledig is;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.3.b
    text: is gesteld in begrijpelijke taal; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.3.c
    text: voor het sluiten ervan wordt verstrekt aan de eindafnemer.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.4
    text: |-
      Een leverancier verstrekt een eindafnemer voorafgaand aan het sluiten van de overeenkomst een samenvatting van de
      belangrijkste voorwaarden uit de overeenkomst in begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.5
    text: |-
      Een leverancier registreert bij het sluiten van de overeenkomst of deze gesloten is met een huishoudelijk
      eindafnemer of een micro-onderneming.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.6
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.6.a
    text: de inhoud van de overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.6.b
    text: het wijzigen en opzeggen van de overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.6.c
    text: de registratieplicht, bedoeld in het vijfde lid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.6.d
    text: |-
      de informatie die de leverancier een eindafnemer verstrekt over de energiebronnen bij levering van elektriciteit of
      gas uit hernieuwbare bronnen en de wijze waarop deze wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.6.6.e
    text: |-
      overige informatie die een leverancier een eindafnemer al dan niet periodiek en al dan niet kosteloos verstrekt en
      de wijze waarop deze wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.6
  - number: 2.7.1
    text: |-
      Een leverancier verstrekt zijn eindafnemers periodiek en kosteloos facturen, factureringsinformatie en informatie
      over energiebronnen, waarin de gegevens inzake de geleverde elektriciteit of het geleverde gas op transparante en
      begrijpelijke wijze is weergegeven.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.7
  - number: 2.7.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.7
  - number: 2.7.2.a
    text: de inhoud en inrichting van facturen, factureringsinformatie en informatie over energiebronnen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.7
  - number: 2.7.2.b
    text: de frequentie van facturen, factureringsinformatie en informatie over energiebronnen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.7
  - number: 2.7.2.c
    text: het verstrekken van gegevens aan de eindafnemer over het verbruik van elektriciteit of gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.7
  - number: 2.7.2.d
    text: het toesturen van facturen, factureringsinformatie en informatie over energiebronnen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.7
  - number: 2.7.2.e
    text: |-
      de omstandigheden waarin en termijnen waarbinnen een leverancier de facturen, factureringsinformatie en informatie
      over energiebronnen verstrekt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.7
  - number: 2.7.3
    text: |-
      De informatie over energiebronnen ten aanzien van elektriciteit wordt onderbouwd door middel van garanties van
      oorsprong als bedoeld in [artikel 2.57, eerste, tweede of vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.7.4
    text: |-
      De informatie over energiebronnen ten aanzien van gas uit hernieuwbare bronnen wordt onderbouwd door middel van
      garanties van oorsprong als bedoeld in [artikel 2.57, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 2.8.1
    text: |-
      Een leverancier voorziet in een transparante, kosteloze en eenvoudige interne procedure voor de behandeling van
      klachten van zijn eindafnemers.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.8
  - number: 2.8.2
    text: 'Bij ministeriële regeling worden regels gesteld, die kunnen verschillen per type eindafnemer, over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.8
  - number: 2.8.2.a
    text: de voorwaarden en inrichting waaraan de klachtenprocedure moet voldoen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.8
  - number: 2.8.2.b
    text: de termijnen die gelden voor de klachtenprocedure.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.8
  - number: 2.9.1
    text: |-
      Een leverancier, niet zijnde een leverancier die faciliteert in peer-to-peer-handel of een energiegemeenschap,
      met meer dan 200.000 eindafnemers, biedt eindafnemers die beschikken over een meetinrichting waarvan
      communicatiefunctionaliteit wordt gebruikt desgevraagd een leveringsovereenkomst aan, waarin de prijsvariatie op de
      spotmarkten wordt weerspiegeld en waarbij de intervallen gelijk of groter zijn aan de marktvereffeningsperiode van
      die markten.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.9
  - number: 2.9.2
    text: |-
      De leverancier verstrekt een eindafnemer voorafgaand aan het sluiten van een leveringsovereenkomst als bedoeld in
      het eerste lid, informatie over de mogelijkheden, kosten en risico's van deze overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.9
  - number: '2.10'
    text: |-
      Een leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel met een huishoudelijk
      eindafnemer of een micro-onderneming, die niet voldoet aan het bepaalde bij of krachtens
      [artikel 2.6, derde, vierde en zesde lid][ref1], is vernietigbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1
        afdeling: '2.2'
  - number: 2.11.1
    text: |-
      Het Nederlands recht is van toepassing op een overeenkomst tussen een leverancier en een huishoudelijk eindafnemer
      of een micro-onderneming.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.11
  - number: 2.11.2
    text: |-
      De Nederlandse rechter is bij uitsluiting bevoegd kennis te nemen van geschillen over een leveringsovereenkomst of
      leveringsovereenkomst inzake peer-to-peer-handel.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.11
  - number: 2.11.3
    text: |-
      Een beding in een leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel dat in strijd is met
      het eerste of tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.11
  - number: 2.12.1
    text: |-
      [Afdeling 3a van titel 3 van Boek 6 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing op een
      leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel tussen een leverancier en een micro-
      onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3A
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: 3A
  - number: 2.12.2
    text: |-
      De [artikelen 236][ref1] en [237 van Boek 6 van het Burgerlijk Wetboek][ref2] zijn mede van toepassing op
      voorwaarden in een leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel tussen een leverancier
      en een micro-ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel237
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '237'
  - number: '2.13'
    text: |-
      Als een leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel eindigt, verstrekt de leverancier
      de eindafnemer binnen een bij ministeriële regeling te bepalen termijn een eindafrekening.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.13
  - number: 2.14.1
    text: |-
      Als een eindafnemer overstapt naar een andere leverancier, zorgt de nieuwe leverancier ervoor dat de handelingen
      die noodzakelijk zijn voor deze overstap worden verricht.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.14
  - number: 2.14.2
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop en de termijn waarbinnen de leverancier de
      overstap realiseert.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.14
  - number: 2.15.1
    text: |-
      Een leverancier kan een huishoudelijk eindafnemer of een micro-onderneming voor de opzegging van een
      leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel door die eindafnemer alleen een
      opzegvergoeding in rekening brengen, indien het een tussentijdse opzegging betreft van een overeenkomst voor
      bepaalde duur en een vooraf of tijdens de overeenkomst vast overeengekomen prijs of vast overeengekomen kosten, en
      de opzegvergoeding in de overeenkomst is opgenomen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.15
  - number: 2.15.2
    text: Bij ministeriële regeling worden nadere regels gesteld over de voorwaarden en de hoogte van de opzegvergoeding.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.15
  - number: '2.16'
    text: |-
      Een leverancier brengt met betrekking tot een overstap van een huishoudelijk eindafnemer of een micro-onderneming,
      buiten de eventueel op grond van [artikel 2.15][ref1] in rekening te brengen kosten geen andere kosten in rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.3
        afdeling: '2.2'
  - number: 2.17.1
    text: |-
      Het is verboden zonder vergunning als bedoeld in [artikel 2.18, derde lid][ref1], elektriciteit of gas te leveren
      aan een eindafnemer met een kleine aansluiting of te faciliteren in peer-to-peer-handel ten behoeve van een
      eindafnemer met een kleine aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.4
        afdeling: '2.2'
  - number: 2.17.2
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.a
    text: 'mag een energiegemeenschap die elektriciteit of gas produceert deze leveren zonder vergunning, indien:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.a.1°
    text: |-
      de energiegemeenschap over de periode van een jaar niet meer elektriciteit of gas levert dan ze op jaarbasis
      invoedt op het systeem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.a.2°
    text: |-
      wordt geleverd aan eindafnemers met een kleine aansluiting die leden of aandeelhouders van de energiegemeenschap
      zijn; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.a.3°
    text: |-
      de energiegemeenschap niet meer leden of afzonderlijke aandeelhouders heeft dan een bij ministeriële regeling vast
      te stellen aantal;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.b
    text: |-
      mag een actieve afnemer met een kleine aansluiting die elektriciteit produceert, deze zonder vergunning leveren,
      indien hij over de periode van een jaar niet meer elektriciteit levert dan hij zelf invoedt op het systeem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.c
    text: |-
      mag een leverancier zonder vergunning leveren dan wel faciliteren in peer-to-peer-handel indien er sprake is van
      een overeenkomst met een groep eindafnemers, waarbij:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.c.1°
    text: |-
      de meerderheid van de in de groep participerende eindafnemers rechtspersoon is of handelt in de uitoefening van een
      beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.c.2°
    text: de in de groep participerende eindafnemers onderling technische, organisatorische of functionele bindingen hebben;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.c.3°
    text: |-
      de vertegenwoordiger beschikt over toestemming tot vertegenwoordiging van de bij de overeenkomst betrokken
      eindafnemers; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.c.4°
    text: |-
      de eindafnemers met een kleine aansluiting voorafgaand aan het sluiten van de leveringsovereenkomst door de
      vertegenwoordiger, bedoeld onder 3°, zijn gewezen op de gevolgen voor hun rechtspositie en zij uitdrukkelijk met
      die gevolgen hebben ingestemd;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.d
    text: |-
      mag een producent van elektriciteit of gas zonder vergunning leveren aan een eindafnemer
      met een kleine aansluiting indien die eindafnemer een dochtermaatschappij in de zin van
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1] is van die producent;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 2.17.2.e
    text: |-
      mag een leverancier elektriciteit of gas zonder vergunning leveren aan eindafnemers met een kleine aansluiting die
      zijn aangesloten op een gesloten systeem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.17.2.f
    text: |-
      mag een buiten Nederland gevestigde leverancier zonder vergunning elektriciteit of gas leveren aan of zonder
      vergunning faciliteren in peer-to-peer-handel ten behoeve van ten hoogste 500 eindafnemers met een kleine
      aansluiting die gevestigd zijn in gebieden aan de Nederlandse landsgrens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.17
  - number: 2.18.1
    text: |-
      Een leverancier die krachtens [artikel 2.17][ref1] vergunningplichtig is, beschikt over de benodigde
      organisatorische, financiële en technische kwaliteiten alsmede over voldoende deskundigheid en is tevens
      aangesloten bij een instantie voor buitengerechtelijke geschilbeslechting.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.4
        afdeling: '2.2'
  - number: 2.18.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de vereisten, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.18
  - number: 2.18.3
    text: |-
      De Autoriteit Consument en Markt verleent een leverancier op aanvraag een vergunning als hij voldoet aan de eisen,
      gesteld bij of krachtens het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.18
  - number: 2.18.4
    text: De Autoriteit Consument en Markt kan voorschriften en beperkingen verbinden aan een vergunning.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.18
  - number: 2.18.5
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.18
  - number: 2.18.5.a
    text: de voorwaarden waaraan een aanvraag moet voldoen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.18
  - number: 2.18.5.b
    text: de procedure voor de aanvraag van een vergunning;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.18
  - number: 2.18.5.c
    text: de informatie die de vergunninghouder na het verlenen van de vergunning al dan niet periodiek moet verstrekken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.18
  - number: 2.18.6
    text: |-
      De leverancier namens wie of voor wie personen of instanties overeenkomsten afsluiten draagt er zorg voor dat
      deze personen of instanties beschikken over de kwaliteiten en deskundigheid die voor de leverancier gelden. Bij
      ministeriële regeling kunnen ten aanzien van deze personen of instanties tevens aanvullende regels gesteld worden
      in verband met specifieke kenmerken van het namens of voor de leverancier afsluiten van overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.18
  - number: 2.19.1
    text: 'De Autoriteit Consument en Markt kan een vergunning wijzigen of intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.19
  - number: 2.19.1.a
    text: |-
      de vergunninghouder niet voldoet aan één of meer bij of krachtens deze wet of de
      [artikelen 193b tot en met 193j van Boek 6 van het Burgerlijk Wetboek][ref1] opgelegde verplichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel193b
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 193b
  - number: 2.19.1.b
    text: de vergunninghouder dit verzoekt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.19
  - number: 2.19.1.c
    text: de vergunninghouder de in de vergunning opgenomen voorschriften of opgelegde beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.19
  - number: 2.19.1.d
    text: |-
      de houder van de vergunning bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid; of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.19
  - number: 2.19.1.e
    text: |-
      de vergunninghouder om andere redenen niet langer in staat moet worden geacht de vergunde activiteit of in de
      vergunning opgenomen voorschriften na te komen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.19
  - number: 2.19.2
    text: |-
      In de gevallen, bedoeld in het eerste lid, onderdelen a en c tot en met e, kan de Autoriteit Consument en Markt
      ter bescherming van eindafnemers met een kleine aansluiting de vergunninghouder bij beschikking een verbod opleggen
      om aan eindafnemers met een kleine aansluiting een leveringsovereenkomst aan te bieden gedurende een bij die
      beschikking aan te geven termijn.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.19
  - number: 2.20.1
    text: |-
      Een vergunning kan worden geweigerd of ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 2.20.2
    text: |-
      Voordat toepassing wordt gegeven aan het eerste lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 2.21.1
    text: |-
      Een vergunning kan met inachtneming van de vereisten, gesteld bij of krachtens
      [artikel 2.18, eerste of tweede lid][ref1], slechts worden overgedragen met toestemming van de Autoriteit Consument
      en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.4
        afdeling: '2.2'
  - number: 2.21.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de voorwaarden voor en de procedure bij
      het overdragen van een vergunning als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.21
  - number: 2.21.3
    text: |-
      De Autoriteit Consument en Markt kan de toestemming weigeren of intrekken in het geval en onder de voorwaarden,
      bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 2.21.4
    text: |-
      Indien een vergunning wordt overgedragen, neemt de overnemende vergunninghouder alle leveringsovereenkomsten
      en leveringsovereenkomsten inzake peer-to-peerhandel over die de overdragende vergunninghouder
      met eindafnemers met een kleine aansluiting heeft gesloten. In afwijking van het eerste lid van
      [artikel 159 van boek 6 van het Burgerlijk Wetboek][ref1] is medewerking van de eindafnemer niet vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel159
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '159'
  - number: '2.22'
    text: |-
      Een vergunninghouder, niet zijnde een vergunninghouder die enkel faciliteert in peer-to-peer-handel of een
      energiegemeenschap, doet een aanbod tot levering van elektriciteit of gas aan iedere eindafnemer met een kleine
      aansluiting, die daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.22
  - number: 2.23.1
    text: |-
      Een vergunninghouder, niet zijnde een vergunninghouder die enkel faciliteert in peer-to-peer-handel of een
      energiegemeenschap, is verplicht om aan eindafnemers met een kleine aansluiting naast eventuele andere vrije
      contractvormen, levering volgens de modelcontracten, bedoeld in het tweede lid, aan te bieden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.23
  - number: 2.23.2
    text: |-
      De Autoriteit Consument en Markt stelt ter bescherming van de belangen van eindafnemers met een kleine aansluiting
      een modelcontract vast:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.23
  - number: 2.23.2.a
    text: voor een bepaalde tijd van tenminste twaalf maanden met vaste tarieven; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.23
  - number: 2.23.2.b
    text: voor een onbepaalde tijd met variabele tarieven.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.23
  - number: 2.23.3
    text: |-
      Het modelcontract bedoeld in tweede lid, onderdeel a, ziet ook op invoeding van elektriciteit als bedoeld in
      [artikel 2.31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.7
        afdeling: '2.2'
  - number: '2.24'
    text: |-
      De vergunninghouder doet, indien hij voorziet of behoort te voorzien dat hij niet langer in staat zal zijn om zijn
      plicht tot levering van elektriciteit of gas aan zijn eindafnemers met een kleine aansluiting na te komen, daarvan
      onverwijld mededeling aan de transmissiesysteembeheerder en aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.24
  - number: 2.25.1
    text: |-
      Ingeval van intrekking van een vergunning of faillissement van een vergunninghouder kunnen
      leveringsovereenkomsten of leveringsovereenkomsten inzake peer-to-peerhandel die de vergunninghouder heeft
      gesloten met eindafnemers met een kleine aansluiting binnen een bij algemene maatregel van bestuur te
      bepalen termijn worden overgedragen aan een andere vergunninghouder. In afwijking van het eerste lid van
      [artikel 159 van boek 6 van het Burgerlijk Wetboek][ref1] is medewerking van de eindafnemer niet vereist. Een
      eindafnemer met een kleine aansluiting is gedurende een bij algemene maatregel van bestuur te bepalen termijn
      niet bevoegd zijn geldende overeenkomst met de vergunninghouder wiens vergunning wordt ingetrokken dan wel die in
      faillissement verkeert, op te zeggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel159
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '159'
  - number: 2.25.2
    text: |-
      De Autoriteit Consument en Markt wijst na een bij algemene maatregel van bestuur te bepalen termijn een of meer
      vergunninghouders aan die de levering van elektriciteit of gas overeenkomstig het derde en vierde lid voortzetten
      aan de eindafnemers met een kleine aansluiting die nog een overeenkomst hebben met de vergunninghouder wiens
      vergunning wordt ingetrokken dan wel die in faillissement verkeert, volgens een bij algemene maatregel van bestuur
      te bepalen wijze van verdeling van de eindafnemers over de aangewezen vergunninghouders.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.25
  - number: 2.25.3
    text: |-
      Vanaf het moment dat het besluit van de Autoriteit Consument en Markt, bedoeld in het tweede lid, in werking treedt
      worden de overeenkomsten, bedoeld in het eerste lid, die niet aan een andere vergunninghouder zijn overgedragen
      geacht te zijn beëindigd, en is de aangewezen vergunninghouder jegens een hem toebedeelde eindafnemer gehouden tot
      levering van elektriciteit of gas en is de eindafnemer voor die levering een vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.25
  - number: 2.25.4
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.25
  - number: 2.25.4.a
    text: |-
      de verstrekking van gegevens over de eindafnemers, die voor de overdracht van overeenkomsten als bedoeld in het
      eerste lid noodzakelijk zijn, door de vergunninghouder of de curator in diens faillissement aan bij die maatregel
      aan te wijzen partijen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.25
  - number: 2.25.4.b
    text: de termijn waarbinnen en de voorwaarden waaronder de verplichtingen, bedoeld in het derde lid, worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.25
  - number: 2.25.4.c
    text: de inkoopovereenkomsten van vergunninghouders om de leveringszekerheid te verzekeren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.25
  - number: 2.26.1
    text: |-
      Een vergunninghouder neemt preventieve maatregelen om het beëindigen van levering aan of de facilitering in peer-
      to-peer-handel ten behoeve van een eindafnemer met een kleine aansluiting wegens wanbetaling zoveel mogelijk te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.26
  - number: 2.26.2
    text: |-
      Een vergunninghouder beëindigt de levering aan of de facilitering in peer-to-peer-handel ten behoeve van een
      eindafnemer met een kleine aansluiting niet, behoudens in bij ministeriële regeling te bepalen gevallen of onder
      bij die regeling te bepalen voorwaarden. De regeling voorziet in waarborgen voor de bescherming van kwetsbare
      afnemers.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.26
  - number: 2.26.3
    text: 'Bij ministeriële regeling worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.26
  - number: 2.26.3.a
    text: |-
      de maatregelen die een vergunninghouder neemt om betalingsachterstanden te verhelpen of te voorkomen, waaronder de
      verstrekking van bepaalde gegevens over de eindafnemer aan aan te wijzen instanties;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.26
  - number: 2.26.3.b
    text: |-
      het beperken, opschorten, beëindigen of hervatten van de levering aan of facilitering in peer-to-peer-handel ten
      behoeve van eindafnemers met een kleine aansluiting.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.26
  - number: 2.27.1
    text: |-
      Een leverancier die actief is op een primair allocatiepunt behorend bij een kleine aansluiting, factureert en
      int de voor deze aansluiting aan een distributiesysteembeheerder periodiek verschuldigde tarieven. De leverancier
      brengt hiervoor geen kosten in rekening aan de distributiesysteembeheerder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.27
  - number: 2.27.2
    text: |-
      De betaling door een aangeslotene aan de leverancier van overeenkomstig het eerste lid gefactureerde bedragen,
      geldt als bevrijdende betaling.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.27
  - number: 2.27.3
    text: |-
      Rechtsvorderingen tot betaling van de door de leverancier overeenkomstig het eerste lid gefactureerde bedragen
      verjaren door verloop van twee jaren. Indien de leverancier een vordering tot betaling van de factuur, bedoeld in
      het eerste lid, niet heeft gedaan binnen twee jaar nadat de vordering opeisbaar is geworden, vervalt het recht om
      voor de betreffende dienst bij deze aangeslotene te factureren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.27
  - number: 2.27.4
    text: |-
      De leverancier draagt per periode de overeenkomstig het eerste lid gefactureerde of te factureren bedragen af aan
      de desbetreffende distributiesysteembeheerder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.27
  - number: 2.27.5
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.27
  - number: 2.27.5.a
    text: de administratie die een leverancier bijhoudt in verband met de uitvoering van het eerste lid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.27
  - number: 2.27.5.b
    text: |-
      de omvang en het moment van de afdracht, bedoeld in het vierde lid, ten behoeve van een gelijkmatige afdracht aan
      de distributiesysteembeheerders.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.27
  - number: 2.28.1
    text: |-
      Een leverancier die actief is op een primair allocatiepunt behorend bij een kleine aansluiting, faciliteert
      bij de totstandkoming, wijziging en opzegging van een aansluit- of transportovereenkomst tussen een
      distributiesysteembeheerder en de aangeslotene en de informatieverstrekking tussen beide partijen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.28
  - number: 2.28.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop invulling wordt gegeven aan
      de facilitering, bedoeld in het eerste lid, en de informatie die de leverancier in dat kader verstrekt aan de
      aangeslotene of de distributiesysteembeheerder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.28
  - number: '2.29'
    text: |-
      Een leverancier die actief is op een primair allocatiepunt behorend bij een kleine aansluiting, zendt klachten
      of vragen van de aangeslotene over het systeembeheer onverwijld door naar de systeembeheerder op wie de klacht of
      vraag betrekking heeft, onder gelijktijdige mededeling daarvan aan de eindafnemer.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.29
  - number: 2.30.1
    text: 'Een actieve afnemer of een aangeslotene binnen een energiegemeenschap heeft het recht om energie te delen, indien:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.30
  - number: 2.30.1.a
    text: |-
      de actieve afnemer of energiegemeenschap een overeenkomst inzake energie delen sluit met een leverancier die
      energie delen aanbiedt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.30
  - number: 2.30.1.b
    text: |-
      elke actieve afnemer of aangeslotene binnen de energiegemeenschap met de onder a bedoelde leverancier een
      leverings- of terugleveringsovereenkomst heeft;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.30
  - number: 2.30.1.c
    text: |-
      elke actieve afnemer of aangeslotene binnen de energiegemeenschap beschikt over een meetinrichting waarvan de
      communicatiefunctionaliteit wordt gebruikt; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.30
  - number: 2.30.1.d
    text: de elektriciteit gedeeld wordt per onbalansverrekeningsperiode.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.30
  - number: 2.30.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de lokaliteit waarop energie
      gedeeld mag worden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.30
  - number: 2.31.1
    text: |-
      Als een eindafnemer met een kleine aansluiting hernieuwbare elektriciteit produceert en hij geen
      terugleveringsovereenkomst heeft gesloten met een andere marktdeelnemer dan zijn leverancier, en voor zover die
      elektriciteit niet is gedeeld met een andere eindafnemer, berekent de leverancier het verbruik ten behoeve van de
      facturering en inning van de leveringskosten door de aan het systeem onttrokken elektriciteit te verminderen met de
      op het systeem ingevoede elektriciteit, waarbij de vermindering maximaal de hoeveelheid aan het systeem onttrokken
      elektriciteit bedraagt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.31
  - number: 2.31.2
    text: |-
      Als een eindafnemer met een kleine aansluiting niet-hernieuwbare elektriciteit produceert en hij geen
      terugleveringsovereenkomst heeft gesloten met een andere marktdeelnemer dan zijn leverancier, en voor zover die
      elektriciteit niet is gedeeld met een andere eindafnemer, berekent de leverancier het verbruik ten behoeve van de
      facturering en inning van de leveringskosten door de aan het systeem onttrokken elektriciteit te verminderen met de
      op het systeem ingevoede elektriciteit, met een maximum van 5.000 kWh aan op het systeem ingevoede elektriciteit,
      voor zover het saldo van de aan het systeem onttrokken minus de op het systeem ingevoede elektriciteit niet minder
      dan nul bedraagt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.31
  - number: 2.31.3
    text: |-
      Als de door de eindafnemer op het systeem ingevoede hoeveelheid elektriciteit groter is dan de hoeveelheid die
      ingevolge het eerste of tweede lid in mindering wordt gebracht op de door die leverancier geleverde elektriciteit,
      betaalt de leverancier aan de betreffende eindafnemer voor het meerdere een redelijke vergoeding. De redelijke
      vergoeding voor hernieuwbare elektriciteit kan niet worden vastgesteld op een negatief bedrag.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.31
  - number: 2.31.4
    text: |-
      Indien aan de aansluiting meerdere allocatiepunten zijn toegekend, is het eerste tot en met derde lid van
      toepassing op een leverancier die levert op een allocatiepunt dat direct verbonden is met het overdrachtspunt en
      waaraan door de distributiesysteembeheerder zowel afname als invoeding wordt toegewezen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.31
  - number: 2.31.5
    text: |-
      [Artikel 2.5, eerste, derde en zesde lid][ref1], zijn van overeenkomstige toepassing op de vergoeding en
      voorwaarden waaronder de elektriciteit wordt ingevoed, met dien verstande dat de hoogte van de vergoeding wordt
      bepaald overeenkomstig het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1
        afdeling: '2.2'
  - number: 2.32.1
    text: |-
      Een leverancier bewaart zijn administratie inzake overeenkomsten met eindafnemers, handelaren of
      transmissiesysteembeheerders en elektriciteitsderivaten met handelaren of transmissiesysteembeheerders gedurende
      een periode van vijf jaar en houdt deze gedurende die periode ter beschikking voor de Autoriteit Consument en Markt
      en de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.32
  - number: 2.32.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over exacte gegevens die vallen onder de bewaarplicht,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.32
  - number: 2.32.3
    text: |-
      De Autoriteit Consument en Markt kan informatie uit de administratie van een leverancier ter beschikking te stellen
      aan een marktdeelnemer indien ten aanzien van de administratie van leveranciers van elektriciteit is voldaan aan
      artikel 64, derde lid, van [richtlijn 2019/944](32019L0944) en van leveranciers van gas is voldaan aan artikel 44,
      derde lid, van [richtlijn 2009/73](32009L0073).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.32
  - number: 2.33.1
    text: |-
      Op een actieve afnemer als bedoeld in [artikel 2.17, tweede lid, onderdeel b][ref1], is [artikel 2.8][ref2] en
      [artikel 2.32][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.4
        afdeling: '2.2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.1
        afdeling: '2.2'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.7
        afdeling: '2.2'
  - number: 2.33.2
    text: |-
      Op een actieve afnemer die elektriciteit levert aan een eindafnemer via een marktdeelnemer die faciliteert in peer-
      to-peer-handel is [afdeling 2.2][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: 2.34.1
    text: Een marktdeelnemer neemt elektriciteit af van een actieve afnemer op basis van een terugleveringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.34
  - number: 2.34.2
    text: |-
      Een marktdeelnemer faciliteert in peer-to-peer-handel ten behoeve van een actieve afnemer op basis van een
      terugleveringsovereenkomst inzake peer-to-peer-handel.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.34
  - number: 2.34.3
    text: Een marktdeelnemer levert een vraagresponsdienst aan een actieve afnemer op basis van een vraagresponsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.34
  - number: 2.34.4
    text: 'Een marktdeelnemer die een aggregatieovereenkomst sluit, draagt er zorg voor dat deze overeenkomst:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.34
  - number: 2.34.4.a
    text: transparant en volledig is;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.34
  - number: 2.34.4.b
    text: is gesteld in begrijpelijke taal; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.34
  - number: 2.34.4.c
    text: voor het sluiten ervan wordt verstrekt aan de actieve afnemer.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.34
  - number: 2.34.5
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.34
  - number: 2.34.5.a
    text: de inhoud van de overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.34
  - number: 2.34.5.b
    text: het wijzigen en opzeggen van de overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.34
  - number: 2.34.5.c
    text: |-
      informatie die een marktdeelnemer een actieve afnemer al dan niet periodiek en al dan niet kosteloos verstrekt en
      de wijze waarop deze wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.34
  - number: 2.35.1
    text: |-
      Een marktdeelnemer die met een actieve afnemer een aggregatieovereenkomst heeft gesloten, verstrekt die afnemer
      periodiek en kosteloos een factuur en informeert hem periodiek en kosteloos over de teruggeleverde elektriciteit of
      verandering van zijn verbruik.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.35
  - number: 2.35.2
    text: De informatie is op begrijpelijke en transparante wijze weergegeven.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.35
  - number: 2.35.3
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.35
  - number: 2.35.3.a
    text: de informatie die wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.35
  - number: 2.35.3.b
    text: wijze waarop de facturen en informatie worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.35
  - number: 2.35.3.c
    text: de frequentie van de facturering en informatieverstrekking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.35
  - number: 2.36.1
    text: |-
      Een marktdeelnemer die aan aggregatie doet voorziet in een transparante, kosteloze en eenvoudige interne procedure
      voor de behandeling van klachten van zijn actieve afnemers.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.36
  - number: 2.36.2
    text: 'Bij ministeriële regeling worden regels gesteld, die kunnen verschillen per type afnemer, over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.36
  - number: 2.36.2.a
    text: de voorwaarden en inrichting waaraan de klachtenprocedure moet voldoen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.36
  - number: 2.36.2.b
    text: de termijnen die gelden voor de klachtenprocedure.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.36
  - number: 2.37.1
    text: |-
      Het Nederlands recht is van toepassing op een aggregatieovereenkomst met een actieve afnemer die tevens
      huishoudelijk eindafnemer of micro-onderneming is.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.37
  - number: 2.37.2
    text: |-
      De Nederlandse rechter is bij uitsluiting bevoegd kennis te nemen van geschillen over aggregatieovereenkomsten met
      een actieve afnemer die tevens huishoudelijk eindafnemer of micro-onderneming is.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.37
  - number: 2.37.3
    text: Een beding in een aggregatieovereenkomst dat strijdig is met het eerste of tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.37
  - number: '2.38'
    text: |-
      Als een aggregatieovereenkomst eindigt, verstrekt de marktdeelnemer die partij was bij die overeenkomst, de actieve
      afnemer binnen een bij ministeriële regeling te bepalen termijn een eindafrekening.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.38
  - number: 2.39.1
    text: |-
      Een marktdeelnemer kan een actieve afnemer die tevens huishoudelijk eindafnemer of een micro-onderneming is,
      voor de opzegging van een aggregatieovereenkomst door die actieve afnemer, alleen een opzegvergoeding in rekening
      brengen, indien het een tussentijdse opzegging betreft van een aggregatieovereenkomst voor bepaalde duur en een
      vast overeengekomen prijs of vast overeengekomen kosten, en de opzegvergoeding in de aggregatieovereenkomst is
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.39
  - number: 2.39.2
    text: Bij ministeriële regeling worden nadere regels gesteld over de voorwaarden en de hoogte van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.39
  - number: 2.40.1
    text: |-
      Als een actieve afnemer overstapt naar een andere marktdeelnemer aan wie hij teruglevert, die ten behoeve van hem
      faciliteert in peer-to-peer-handel, of die hem vraagresponsdiensten levert, zorgt de nieuwe marktdeelnemer ervoor
      dat de handelingen die noodzakelijk zijn voor deze overstap worden verricht.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.40
  - number: 2.40.2
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop en de termijn waarbinnen de nieuwe
      marktdeelnemer de overstap realiseert.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.40
  - number: 2.40.3
    text: |-
      De nieuwe marktdeelnemer brengt voor een overstap van een actieve afnemer of groep actieve afnemers, die
      tevens huishoudelijk eindafnemer of een micro-onderneming is of zijn, buiten de eventueel op grond van
      [artikel 2.39][ref1] in rekening te brengen kosten, geen andere kosten in rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.40
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 2.41.1
    text: |-
      Een marktdeelnemer die op een allocatiepunt niet tevens de leverancier is, levert op dat allocatiepunt geen
      vraagresponsdiensten, tenzij met de balanceringsverantwoordelijke voor elektriciteit op dat allocatiepunt een
      overeenkomst op basis van het aanbod, bedoeld in het tweede lid is gesloten.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.41
  - number: 2.41.2
    text: |-
      Als een marktdeelnemer met een actieve afnemer ten aanzien van een allocatiepunt een vraagresponsovereenkomst
      heeft gesloten, doet de balanceringsverantwoordelijke voor elektriciteit op dat allocatiepunt, al dan niet
      in samenspraak met de leverancier op dat allocatiepunt de marktdeelnemer die vraagresponsdiensten levert op
      diens verzoek een redelijk aanbod inzake de financiële compensatie en de voorwaarden voor de aanpassing van
      het elektriciteitsprogramma als gevolg van de vraagrespons, over de vergoeding van eventuele onbalanskosten die
      hierdoor ontstaan en de uitwisseling van relevante gegevens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.41
  - number: 2.41.3
    text: |-
      Marktdeelnemers passen bij de berekening van de financiële compensatie een door de Autoriteit Consument en
      Markt vast te stellen berekeningsmethode toe, waarbij zowel rekening wordt gehouden met de ingekochte maar
      door vraagrespons niet verkochte elektriciteit als de niet ingekochte maar door vraagrespons extra verkochte
      elektriciteit.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.41
  - number: 2.41.4
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.41
  - number: 2.41.4.a
    text: de uitgangspunten waaraan een berekeningsmethode ten minste moet voldoen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.41
  - number: 2.41.4.b
    text: de inhoud van het aanbod, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.41
  - number: 2.41.4.c
    text: de termijn waarbinnen een redelijk aanbod moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.41
  - number: 2.41.5
    text: |-
      Het eerste lid is niet van toepassing indien een markdeelnemer die vraagresponsdiensten levert, optreedt als
      aanbieder van diensten aan de transmissie- of distributiesysteembeheerder van elektriciteit in verband met
      systeembehoeften.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.41
  - number: 2.42.1
    text: |-
      De marktdeelnemer die door een aangeslotene is gecontracteerd op een allocatiepunt, draagt er zorg voor dat
      er overeenkomstig artikel 5 van [verordening 2019/943](32843R2019) een balanceringsverantwoordelijke voor
      elektriciteit actief is op dat allocatiepunt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.42
  - number: 2.42.2
    text: |-
      Een producent of actieve afnemer die niet via een marktdeelnemer elektriciteit verkoopt, of een eindafnemer die
      niet via een marktdeelnemer elektriciteit koopt, is er zelf verantwoordelijk voor dat er overeenkomstig artikel
      5 van [verordening 2019/943](32843R2019) een balanceringsverantwoordelijke voor elektriciteit actief is op het
      betreffende allocatiepunt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.42
  - number: 2.43.1
    text: |-
      Een aangeslotene met een grote aansluiting op een transmissie- of distributiesysteem voor gas, of een
      marktdeelnemer namens die aangeslotene, sluit met het oog op het afnemen of invoeden van gas een overeenkomst met
      een netgebruiker om transportcapaciteit te boeken op het transmissiesysteem voor gas.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.43
  - number: 2.43.2
    text: |-
      In afwijking van het eerste lid draagt bij een gasopslagsysteem, een LNG-systeem, een interconnectorsysteem
      voor gas of een gasproductienet, de gebruiker van deze systemen of leidingen, of een marktdeelnemer namens deze
      gebruiker, er zorg voor dat een netgebruiker transportcapaciteit boekt op het transmissiesysteem voor gas met het
      oog op de invoeding of afname van gas op het transmissiesysteem van gas.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.43
  - number: 2.43.3
    text: |-
      Voor een aangeslotene met een kleine aansluiting op een distributiesysteem voor gas draagt de door de aangeslotene
      gecontracteerde leverancier er zorg voor dat een netgebruiker transportcapaciteit boekt op het transmissiesysteem
      voor gas met het oog op de levering van gas aan deze aangeslotene.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.43
  - number: 2.43.4
    text: |-
      De netgebruiker, bedoeld in het eerste tot en met derde lid, is de balanceringsverantwoordelijke voor gas op het
      aan die aansluiting toegekende allocatiepunt, dan wel, indien van toepassing, voor het door hem gecontracteerde
      deel van het aan het gasopslagsysteem, LNG-systeem, interconnectorsysteem voor gas of gasproductienet toegekende
      allocatiepunt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.43
  - number: '2.44'
    text: |-
      Als gas binnen het transmissiesysteem voor gas wordt overgedragen naar een andere balanceringsportfolio dan vindt
      deze overdracht plaats op een virtueel handelspunt op dat systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.44
  - number: 2.45.1
    text: |-
      Als een aangeslotene, marktdeelnemer of gebruiker als bedoeld in [artikel 2.43, tweede lid][ref1], kiest voor een
      andere balanceringsverantwoordelijke, zorgt de nieuw gecontracteerde balanceringsverantwoordelijke ervoor dat de
      handelingen die noodzakelijk zijn voor deze overstap worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.45
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 2.45.2
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop en de termijn waarbinnen de nieuwe
      balanceringsverantwoordelijke de overstap realiseert.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.45
  - number: 2.45.3
    text: |-
      Een balanceringsverantwoordelijke brengt de aangeslotene, marktdeelnemer of gebruiker voor de overstap geen kosten
      in rekening.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.45
  - number: 2.46.1
    text: |-
      Een aangeslotene beschikt op of nabij ieder overdrachtspunt over een geïnstalleerde meetinrichting die voldoet aan
      de krachtens het derde lid gestelde eisen, tenzij:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.1.a
    text: |-
      de aangeslotene beschikt over een onbemeten aansluiting die voldoet aan bij ministeriële regeling te stellen
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.1.b
    text: |-
      de aangeslotene een onderneming is als bedoeld in [artikel 1.3, eerste lid][ref1], met een aansluiting op een
      gesloten systeem van de beheerder, bedoeld in [artikel 1 van de Spoorwegwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel1
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '1'
  - number: 2.46.1.c
    text: |-
      de aangeslotene behoort tot het bedrijf van de beheerder van een gesloten systeem en de beheerder van het gesloten
      systeem elektriciteit of gas aan deze aangeslotene levert.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.2
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.2.a
    text: |-
      situaties waarin een aangeslotene tevens beschikt over een geïnstalleerde meetinrichting op een andere plaats
      dan op of nabij een overdrachtspunt, waarbij kan worden bepaald dat die andere plaats wordt aangemerkt als een
      additioneel allocatiepunt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.2.b
    text: welke partij bij aangeslotenen met een kleine aansluiting in die situatie de meetinrichting installeert en beheert;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.2.c
    text: |-
      welke partij bij aangeslotenen met een kleine aansluiting in die situatie de meetgegevens verzamelt, valideert
      en vaststelt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.2.d
    text: |-
      welke partij de invoeding, de onttrekking of het verbruik van elektriciteit of gas vaststelt bij een onbemeten
      aansluiting als bedoeld in het eerste lid, onderdeel a, en de wijze waarop deze partij die gegevens vaststelt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de eisen en functionaliteiten waaraan een meetinrichting of
      een onderdeel van een meetinrichting ten minste moet voldoen. Deze regels kunnen in ieder geval verschillen:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.3.a
    text: voor verschillende categorieën aansluitingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.3.b
    text: voor verschillende categorieën aangeslotenen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.3.c
    text: voor verschillende categorieën meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.3.d
    text: voor verschillende overdrachtspunten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.3.e
    text: voor verschillende allocatiepunten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.3.f
    text: naar plaats van de meetinrichting, al dan niet op of nabij een overdrachtspunt of additioneel allocatiepunt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.3.g
    text: naar type activiteit;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.3.h
    text: naar functionaliteit;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
  - number: 2.46.3.i
    text: |-
      naar hetgeen op grond van de [artikelen 2.48][ref1], [2.54][ref2], [2.55][ref3], [3.57][ref4], [3.58][ref5],
      [3.59][ref6] en [3.60][ref7] gemeten moet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0050714#Artikel3
