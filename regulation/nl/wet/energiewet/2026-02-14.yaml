    text: de voorwaarden waaronder gegevens moeten worden aangeleverd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.9.1
    text: |-
      Een transmissie- of distributiesysteembeheerder gebruikt de bij ministeriële regeling te bepalen gegevens die in
      zijn register zijn opgenomen voor de uitvoering van zijn wettelijke taken of verplichtingen met betrekking tot het:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.9
  - number: 4.9.1.a
    text: beheren en onderhouden van zijn systeem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.9
  - number: 4.9.1.b
    text: bepalen van tarieven;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.9
  - number: 4.9.1.c
    text: uitvoeren van een aansluitovereenkomst;
