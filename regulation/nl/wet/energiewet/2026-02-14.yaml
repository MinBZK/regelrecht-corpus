        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.88.2
    text: |-
      Een interconnectorsysteembeheerder voor elektriciteit stelt op zijn systeem beschikbare zoneoverschrijdende
      capaciteit ter beschikking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.88
  - number: 3.88.3
    text: |-
      Een interconnectorsysteembeheerder voor gas die krachtens [artikel 3.2, eerste lid, aanhef en onderdeel d][ref1],
      is aangewezen, is uit dien hoofde belast met de taken en verplichtingen die bij of krachtens [verordening 715/2009]
      (32009R0715) of andere bindende EU-rechtshandeling op het gebied van gas aan interconnectorsysteembeheerders zijn
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.88
