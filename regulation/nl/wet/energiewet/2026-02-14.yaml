        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
  - number: 7.30.1
    text: |-
      Een rekening die is geopend op grond van [artikel 73 van de Elektriciteitswet 1998][ref1] zoals dit luidde
      onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van [artikel 2.58, tweede lid][ref2], wordt
      aangemerkt als rekening geopend op grond van artikel 2.58, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.30
    references:
