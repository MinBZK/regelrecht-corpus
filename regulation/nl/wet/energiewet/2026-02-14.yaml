  - number: 7.30.3
    text: |-
      Een garantie van oorsprong voor duurzame elektriciteit die is uitgegeven op grond van
      [artikel 73 van de Elektriciteitswet 1998][ref1] zoals dit luidde onmiddellijk voorafgaand aan het tijdstip
      van inwerkingtreding van [artikel 2.57, eerste lid][ref2], wordt aangemerkt als garantie van oorsprong voor
      elektriciteit uit hernieuwbare bronnen uitgegeven op grond van artikel 2.57, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.30
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 7.30.4
    text: |-
      Een garantie van oorsprong voor elektriciteit geproduceerd in een installatie voor hoogrenderende
      warmtekrachtkoppeling die is uitgegeven op grond van [artikel 73 van de Elektriciteitswet 1998][ref1] zoals dit
      luidde onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van [artikel 2.57, tweede lid][ref2], wordt
      aangemerkt als garantie van oorsprong voor elektriciteit geproduceerd in een installatie voor hoogrenderende
      warmtekrachtkoppeling uitgegeven op grond van artikel 2.57, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.30
    references:
