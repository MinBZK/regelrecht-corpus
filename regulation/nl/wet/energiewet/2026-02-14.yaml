  - number: 4.12.1
    text: 'Bij algemene maatregel van bestuur kan:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.12
  - number: 4.12.1.a
    text: |-
      een andere partij worden aangewezen die ter uitvoering van [artikel 4.1, tweede lid][ref1], een register moeten
      bijhouden;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
