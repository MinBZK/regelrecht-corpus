      en verzoeken om het nemen van besluiten op grond van de [Elektriciteitswet 1998][ref1] en de [Gaswet][ref2] en
      bezwaren tegen besluiten op grond van de Elektriciteitswet 1998 en de Gaswet worden, met uitzondering van de
      besluiten en bezwaren tegen besluiten, bedoeld in [artikel 7.42, tweede lid][ref3], geacht met ingang van dat
      tijdstip van rechtswege aanvragen, verzoeken en bezwaren te zijn op grond van deze wet.


