      boodschap van 19 mei 2020 ingediende voorstel van wet tot wijziging van de [Mijnbouwwet][ref2] (het verwijderen
      of hergebruiken van mijnbouwwerken en investeringsaftrek) (Kamerstukken ) blijft van toepassing op reeds aangegane
      verplichtingen ter uitvoering van de taak, bedoeld in [artikel 54, eerste lid, onderdeel b, van de Gaswet][ref3]
      zoals dat luidde voor inwerkingtreding van dat voorstel van wet.


