        paragraaf: 2.6.1
        afdeling: '2.6'
  - number: 7.30.6
    text: |-
      Een garantie van oorsprong voor hernieuwbare energiebronnen die is uitgegeven op grond van
      [artikel 66i van de Gaswet][ref1] zoals dit luidde onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding
      van [artikel 2.57, derde lid][ref2], wordt aangemerkt als garantie van oorsprong voor gas uit hernieuwbare bronnen
      uitgegeven op grond van artikel 2.57, derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel66i
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
