preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede ter implementatie van richtlijn (EU) 2019/944
    van het Europees Parlement en de Raad van 5 juni 2019 betreffende gemeenschappelijke regels voor elektriciteit
    en tot wijziging van Richtlijn 2012/27/EU, verordening (EU) 2019/943 van het Europees Parlement en de Raad van
    5 juni 2019 betreffende de interne markt voor elektriciteit en verordening (EU) 2019/942 van het Europees Parlement
    en de Raad van 5 juni 2019 tot oprichting van een Agentschap van de Europese Unie voor de samenwerking tussen
    energieregulators, en met inachtneming van het belang van het betrouwbaar, duurzaam, doelmatig en milieuhygiënisch
    verantwoord functioneren van de elektriciteits- en gasvoorziening te komen tot een hernieuwd regelgevend kader met
    betrekking tot de productie, het transport en de levering van elektriciteit en gas;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aangeslotene:* ieder die van een
      systeembeheerder de beschikking heeft gekregen over een aansluiting;
        - *aansluiting:* deel van een transmissie- of distributiesysteem dat bestaat uit één of meer leidingen en
      daarmee verbonden hulpmiddelen, tussen: a. een transmissie- of distributiesysteem en een onroerende zaak als
      bedoeld in [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1]; b. systemen
      van verschillende systeembeheerders, met uitzondering van systeemkoppelingen; c. het transmissiesysteem voor
      elektriciteit op zee en een windpark op zee of tussen het transmissiesysteem voor elektriciteit op zee en de
      installatie van een eindafnemer; d. een transmissie- of distributiesysteem voor gas en een gasproductienet;
        - *aansluitovereenkomst:* overeenkomst op basis van een aanbod als bedoeld in de
      [artikelen 3.41, eerste lid][ref2], [3.86, eerste lid][ref3], of [3.105, tweede lid, onderdeel a][ref4];
        - *Acer:* Agentschap als bedoeld in artikel 1 van [verordening 2019/942](32842R2019);
        - *actieve afnemer:* een eindafnemer, of een groep gezamenlijk optredende eindafnemers, die binnen een eigen
      of gezamenlijke installatie zelfopgewekte of gedeelde elektriciteit verbruikt of opslaat, die zelfopgewekte
      elektriciteit verkoopt of deelt, die gedeelde elektriciteit verbruikt of opslaat, of die gebruik maakt van
      flexibiliteits- of energie-efficiëntiediensten, mits die activiteiten niet zijn belangrijkste commerciële
      activiteit vormen;
        - *aggregatieovereenkomst:* terugleveringsovereenkomst, terugleveringsovereenkomst inzake peer-to-peer-handel,
      vraagresponsovereenkomst, of andere overeenkomst inzake aggregeren;
        - *aggregeren:* combineren van vraagrespons of ingevoede elektriciteit van verschillende actieve afnemers met het
      oog op wederverkoop;
        - *allocatiepunt:* administratief punt waar invoeding, onttrekking of verbruik van elektriciteit of gas wordt
      toegerekend aan een marktdeelnemer;
        - *Autoriteit Consument en Markt:* Autoriteit Consument en Markt, bedoeld in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref5];
        - *balanceringsportfolio:* groepering van de invoedingen en onttrekkingen en handelsberichten voor verkoop en
      inkoop, van een balanceringsverantwoordelijke voor gas;
        - *balanceringsverantwoordelijke:* balanceringsverantwoordelijke voor elektriciteit of gas;
        - *balanceringsverantwoordelijke voor elektriciteit:* natuurlijk persoon of rechtspersoon die verantwoordelijk
      is voor de onbalans die hij, of degene die hij vertegenwoordigt, veroorzaakt in het transmissie- of
      distributiesysteem voor elektriciteit en die overeenkomstig de methoden of voorwaarden voor elektriciteit, bedoeld
      in [artikel 3.119][ref6], door de transmissiesysteembeheerder voor elektriciteit als balanceringsverantwoordelijke
      is toegelaten;
        - *balanceringsverantwoordelijke voor gas:* natuurlijk persoon of rechtspersoon die verantwoordelijk is voor
      de onbalans die hij, of degene die hij vertegenwoordigt, veroorzaakt in het transmissie- of distributiesysteem
      voor gas en die overeenkomstig de methoden of voorwaarden voor gas, bedoeld in [artikel 3.119][ref7], door de
      transmissiesysteembeheerder voor gas als balanceringsverantwoordelijke is toegelaten;
        - *beheerder van een gesloten systeem:* rechtspersoon die op grond van [artikel 3.6][ref8] is aangewezen;
        - *bindende EU-rechtshandelingen:* door de instellingen van de Europese Unie vastgestelde richtlijnen,
      verordeningen, besluiten zonder vermelding van adressaten en besluiten met vermelding van adressaten, voor zover
      mede tot Nederland gericht;
        - *bindende gedragslijn:* enkele last tot het verrichten van bepaalde handelingen als bedoeld in
      [artikel 5:2, tweede lid, van de Algemene wet bestuursrecht][ref9] ter bevordering van de naleving van wettelijke
      voorschriften en die niet wegens een overtreding wordt opgelegd;
        - *biomassa:* biologisch afbreekbare fractie van producten, afvalstoffen en residuen van biologische oorsprong
      uit de landbouw, met inbegrip van plantaardige en dierlijke stoffen, de bosbouw en aanverwante bedrijfstakken, met
      inbegrip van de visserij en de aquacultuur, alsmede de biologisch afbreekbare fractie van afval, met inbegrip van
      industrieel en huishoudelijk afval van biologische oorsprong;
        - *buitenlandse transmissiesysteembeheerder:* entiteit in een andere lidstaat die op grond van nationale wettelijke
      regels is belast met het beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 35, van [richtlijn
      2019/944](32019L0944) of artikel 2, onderdeel 4, van [richtlijn 2009/73](32009L0073);
        - *CO-terminal:* faciliteit voor de ontvangst en overslag van koolstofdioxide, met inbegrip van de invoeding
      van koolstofdioxide in of het onttrekken van koolstofdioxide aan de infrastructuur voor het transport van
      koolstofdioxide, hervergassing van vloeibare koolstofdioxide of het vloeibaar maken van gasvormig koolstofdioxide,
      ondersteunende diensten en tijdelijke opslag die nodig zijn voor het proces van ontvangst en overslag of de toegang
      tot of de goede werking van de CO-terminal of de infrastructuur voor het transport van koolstofdioxide;
        - *communicatiefunctionaliteit:* functionaliteit voor het verzenden en ontvangen van gegevens voor informatie-,
      monitoring- en controledoeleinden door middel van een vorm van elektronische communicatie;
        - *congestie:* congestie voor elektriciteit of voor gas;
        - *congestie voor elektriciteit:* congestie als bedoeld in artikel 2, onderdeel 4, van [verordening 2019/943]
      (32843R2019);
        - *congestie voor gas:* situatie waarin de maximale transportcapaciteit van een deel van een transmissie- of
      distributiesysteem voor gas niet voldoende is om te voorzien in de behoefte aan transport;
        - *congestiebeheer:* stelsel van procedures dat voorkomt dat zich congestie voordoet en de maatregelen die
      bewerkstelligen dat congestie wordt opgeheven;
        - *congestiebeheers- of systeembeheersdienst:* dienst inzake de verandering van de belasting van het transmissie-
      of distributiesysteem voor elektriciteit die wordt ingezet ten behoeve van congestiebeheer of een efficiënter
      beheer of efficiëntere ontwikkeling van het transmissie- of distributiesysteem voor elektriciteit;
        - *connectiepunt:* fysiek punt dat een aangrenzend buitenlands transmissiesysteem voor gas, een
      interconnectorsysteem voor gas of een productienet voor gas verbindt met een Nederlands transmissiesysteem voor
      gas;
        - *delen van energie:* zelfverbruik door één of meer actieve afnemers van hernieuwbare energie; a. die is opgewekt
      of opgeslagen door een installatie achter een andere aansluiting die de actieve afnemers geheel of gedeeltelijk
      gezamenlijk bezitten, leasen of huren; of b. waarop het recht al dan niet gratis is overgedragen door een andere
      actieve afnemer;
        - *directe lijn:* directe lijn als bedoeld in [artikel 3.9, eerste lid][ref10];
        - *distributiesysteem:* distributiesysteem voor elektriciteit of voor gas;
        - *distributiesysteembeheerder:* distributiesysteembeheerder voor elektriciteit of voor gas;
        - *distributiesysteembeheerder voor elektriciteit:* rechtspersoon die op grond van
      [artikel 3.2, eerste lid, onderdeel e][ref11], is aangewezen;
        - *distributiesysteembeheerder voor gas:* rechtspersoon die op grond van
      [artikel 3.2, eerste lid, onderdeel f][ref12], is aangewezen;
        - *distributiesysteem voor elektriciteit:* stelsel van leidingen en daarmee verbonden hulpmiddelen ten behoeve
      van transport van elektriciteit op een spanningsniveau lager dan 110 kilovolt met het oog op de belevering aan
      eindafnemers of handelaren, de levering zelf niet inbegrepen;
        - *distributiesysteem voor gas:* stelsel van leidingen en daarmee verbonden hulpmiddelen ten behoeve van lokaal
      of regionaal transport van gas met het oog op de belevering aan eindafnemers of handelaren, de levering zelf niet
      inbegrepen, niet zijnde een gasproductienet;
        - *eindafnemer:* aangeslotene die elektriciteit of gas koopt of wil kopen voor eigen gebruik;
        - *energiehandelsmarkt:* markt voor het verhandelen van elektriciteit of gas, capaciteit, balanceringsdiensten, of
      ondersteunende diensten, in alle tijdsbestekken, waaronder termijn, day-ahead en intraday, daaronder begrepen een
      over-the-counter-markt of elektriciteits- of gasbeurs;
        - *elektriciteitsopslagfaciliteit:* faciliteit waarmee elektriciteit wordt opgeslagen;
        - *elektriciteit uit hernieuwbare bronnen:* elektriciteit die is geproduceerd met hernieuwbare bronnen of met
      energie uit hernieuwbare bronnen, met uitzondering van elektriciteit die afkomstig is van accumulatiesystemen;
        - *elektriciteitsprogramma:* groepering van de handelsprogramma’s en indien dat krachtens de methoden of
      voorwaarden, bedoeld in [artikel 3.119][ref13], is voorgeschreven, de groepering van invoedingen en onttrekkingen
      per allocatiepunt, van een balanceringsverantwoordelijke voor elektriciteit;
        - *energiegemeenschap:* juridische entiteit die ten behoeve van haar leden, vennoten of aandeelhouders activiteiten
      op de energiemarkt verricht en als hoofddoel heeft het bieden van milieuvoordelen of economische of sociale
      voordelen aan haar leden, vennoten of aandeelhouders of aan de plaatselijke gebieden waar ze werkzaam is, en niet
      is gericht op het maken van winst;
        - *energie uit hernieuwbare bronnen:* energie die is geproduceerd uit hernieuwbare bronnen of energie die is
      geproduceerd met gebruik van energie uit hernieuwbare bronnen;
        - *garantie van oorsprong:* gegevens op een rekening voor garanties van oorsprong die betrekking hebben op:
      a. energie uit hernieuwbare bronnen en waarmee wordt aangetoond dat een producent een hoeveelheid energie uit
      hernieuwbare bronnen heeft geproduceerd; of b. elektriciteit uit niet-hernieuwbare bronnen en waarmee wordt
      aangetoond dat een producent een hoeveelheid elektriciteit uit een andere energiebron dan hernieuwbare bronnen
      heeft geproduceerd;
        - *gas:* a. aardgas dat bij een temperatuur van 15 °C en bij een druk van 1,01325 bar in gasvormige toestand
      verkeert en voor ten minste voor 75% bestaat uit methaan; of b. gas uit hernieuwbare bronnen;
        - *gasjaar:* periode vanaf 1 oktober in enig jaar tot en met 30 september van het daaropvolgende kalenderjaar;
        - *gasopslagsysteem:* systeem voor de opslag van gas, met inbegrip van het gedeelte van een LNG-systeem
      dat voor opslag wordt gebruikt, maar met uitzondering van het gedeelte dat wordt gebruikt voor gasproductie
      en met uitzondering van een systeem voor de opslag van gas dat uitsluitend ten dienste staat van een
      transmissiesysteembeheerder voor gas bij de uitvoering van zijn wettelijke taken of verplichtingen;
        - *gasopslagbeheerder:* rechtspersoon die op grond van [artikel 3.2, eerste lid, onderdeel i][ref14], is
      aangewezen;
        - *gasproductienet:* stelsel van één of meer leidingen en daarmee verbonden hulpmiddelen die onderdeel
      uitmaken van een olie- of gaswinningsproject of die worden gebruikt voor het transport van gas rechtstreeks
      van een gaswinningsproject naar een gasverwerkingsinstallatie, een gasopslagsysteem of een aansluiting op een
      transmissiesysteem voor gas;
        - *gas uit hernieuwbare bronnen* stof die bij een temperatuur van 15 °C en bij een druk van 1,01325 bar
      in gasvormige toestand verkeert en voor ten minste voor 75% bestaat uit methaan en die is geproduceerd met
      hernieuwbare bronnen of met energie uit hernieuwbare bronnen;
        - *gegevensuitwisselingsentiteit:* rechtspersoon als bedoeld in [artikel 4.15, eerste lid][ref15];
        - *gesloten systeem:* systeem als bedoeld in [artikel 3.7, eerste lid][ref16];
        - *grote aansluiting:* aansluiting met een doorlaatwaarde groter dan 3 x 80 Ampère voor elektriciteit of 40 m3(n)
      per uur voor gas;
        - *handelaar:* natuurlijk persoon of rechtspersoon die elektriciteit of gas koopt voor wederverkoop;
        - *hernieuwbare bronnen:* wind, zon, omgevingslucht, oppervlaktewater, rioolwater, aardwarmte, zee, waterkracht,
      biomassa, stortgas, rioolwaterzuiveringsgas en biogas;
        - *huishoudelijk eindafnemer:* eindafnemer die elektriciteit of gas koopt of wil kopen voor eigen huishoudelijk
      gebruik;
        - *infrastructuurbedrijf:* groepsmaatschappij als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref17] die onderdeel uitmaakt van de infrastructuurgroep, met
      uitzondering van één of meer transmissie- of distributiesysteembeheerders;
        - *infrastructuurgroep:* groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref18] waarvan
      één of meer transmissie- of distributiesysteembeheerders onderdeel uitmaken;
        - *inkomstenbesluit:* besluit op grond van [artikel 3.109][ref19];
        - *installatie:* leidingen en daarmee duurzaam verbonden elektrotechnisch of gastechnisch materieel dat of
      apparatuur die: a. zijn bestemd voor of ten dienste staat van het verbruik of de productie van elektriciteit of gas
      of de opslag van elektriciteit; b. wordt gebruikt of beheerd door een aangeslotene; en c. zich ten opzichte van een
      transmissie- of distributiesysteem of een directe lijn bevindt achter het overdrachtspunt of de voorzieningen die
      de directe lijn beveiligen;
        - *installatie voor hoogrenderende warmtekrachtkoppeling:* installatie voor de opwekking van elektriciteit door
      middel van warmtekrachtkoppeling als bedoeld in artikel 2, onderdeel 34, van [richtlijn 2012/27](32012L0027);
        - *interconnector* interconnector voor elektriciteit of voor gas die deel uitmaakt van het systeem van een
      transmissiesysteembeheerder of een transmissiesysteembeheerder voor elektriciteit op zee;
        - *interconnector voor elektriciteit* transmissieleiding en daarmee verbonden hulpmiddelen die deel uitmaakt van
      het systeem van een transmissiesysteembeheerder voor elektriciteit, die de grens tussen Nederland en een lidstaat,
      een land dat onderdeel uitmaakt van de Europese economische ruimte, of een derde land, overschrijdt of overspant,
      en een Nederlands transmissiesysteem voor elektriciteit of een transmissiesysteem voor elektriciteit op zee met een
      transportsysteem voor elektriciteit van die lidstaat of dat land koppelt;
        - *interconnector voor gas* transmissieleiding en daarmee verbonden hulpmiddelen die deel uitmaakt van het systeem
      van een transmissiesysteembeheerder voor gas, die de grens tussen Nederland en een lidstaat, een land dat onderdeel
      uitmaakt van de Europese economische ruimte, of een derde land, overschrijdt of overspant, en een Nederlands
      transmissiesysteem voor gas met een transportsysteem voor gas van die lidstaat of dat land koppelt;
        - *interconnectorsysteembeheerder:* interconnectorsysteembeheerder voor elektriciteit of gas;
        - *interconnectorsysteembeheerder voor elektriciteit:* rechtspersoon die op grond van
      [artikel 3.2, eerste lid, onderdeel b][ref20], is aangewezen;
        - *interconnectorsysteembeheerder voor gas:* rechtspersoon die op grond van
      [artikel 3.2, eerste lid, onderdeel d][ref21], is aangewezen;
        - *interconnectorsysteem:* interconnectorsysteem voor elektriciteit of voor gas;
        - *interconnectorsysteem voor elektriciteit:* transmissieleiding en daarmee verbonden hulpmiddelen die geen deel
      uitmaken van een systeem van een transmissiesysteem voor elektriciteit of een transmissiesysteem voor elektriciteit
      op zee en die de grens tussen Nederland en een lidstaat, een land dat onderdeel uitmaakt van de Europese
      economische ruimte, of een derde land, overschrijdt of overspant, en een Nederlands transmissiesysteem voor
      elektriciteit met een transportsysteem voor elektriciteit van die lidstaat of dat land koppelt;
        - *interconnectorsysteem voor gas:* transmissieleiding en daarmee verbonden hulpmiddelen die geen deel uitmaken
      van een systeem van een transmissiesysteem voor gas en die de grens tussen Nederland en een lidstaat, een land
      dat onderdeel uitmaakt van de Europese economische ruimte, of een derde land, overschrijdt of overspant, en een
      Nederlands transmissiesysteem voor gas met een transportsysteem voor gas van die lidstaat of dat land koppelt;
        - *invoeder:* aangeslotene die elektriciteit of gas invoedt op het systeem;
        - *kleine aansluiting:* aansluiting met een doorlaatwaarde kleiner dan of gelijk aan 3 x 80 Ampère voor
      elektriciteit of 40 m3(n) per uur voor gas;
        - *kleine onderneming:* eindafnemer of actieve afnemer die een onderneming is met minder dan vijftig werknemers en
      een jaaromzet of een jaarlijks balanstotaal van ten hoogste € 10 miljoen;
        - *kwetsbare afnemer:* kwetsbare afnemer als bedoeld in artikel 28 van [richtlijn 2019/944](32019L0944);
        - *leverancier:* natuurlijk persoon of rechtspersoon die elektriciteit of gas levert aan een eindafnemer of die ten
      behoeve van een eindafnemer faciliteert in peer-to-peer-handel;
        - *leveringsovereenkomst:* overeenkomst voor de levering van elektriciteit of gas aan een eindafnemer;
        - *leveringsovereenkomst inzake peer-to-peer-handel:* overeenkomst op grond waarvan ten behoeve van een eindafnemer
      peer-to-peer-handel kan plaatsvinden;
        - *LNG-beheerder:* rechtspersoon die op grond van [artikel 3.2, eerste lid, onderdeel h][ref22], is aangewezen;
        - *LNG-systeem:* systeem dat gebruikt wordt voor het vloeibaar maken van gas, voor de invoer of de verlading, en
      voor de hervergassing van vloeibaar gas, met inbegrip van ondersteunende diensten en tijdelijke opslag die nodig
      zijn voor het proces van hervergassing en de daaropvolgende invoeding op het systeem, en met uitzondering van een
      LNG-systeem dat uitsluitend ten dienste staat van een transmissiesysteembeheerder voor gas bij de uitvoering van
      zijn wettelijke taken of verplichtingen;
        - *marktdeelnemer:* natuurlijk persoon of rechtspersoon die elektriciteit of gas koopt of verkoopt zonder
      tussenkomst van een andere marktdeelnemer, die produceert, die aggregeert, die levert, die faciliteert in peer-to-
      peer-handel, of die vraagresponsdiensten of energieopslagdiensten voor elektriciteit verleent, met uitzondering van
      een natuurlijk persoon of rechtspersoon voor zover die elektriciteit deelt;
        - *meetinrichting:* instrument of samenstel van instrumenten met een meetfunctie dat ten minste de invoeding,
      onttrekking of het verbruik van elektriciteit of gas meet, met uitzondering van hulpmiddelen die de meetfunctie
      ondersteunen en die onderdeel zijn van een aansluiting;
        - *meetverantwoordelijke partij:* natuurlijk persoon of rechtspersoon die is erkend op grond van
      [artikel 2.50, vierde lid][ref23];
        - *methodebesluit:* besluit op grond van [artikel 3.108][ref24];
        - *micro-onderneming:* eindafnemer of actieve afnemer die een onderneming is met minder dan tien werknemers en een
      jaaromzet of een jaarlijks balanstotaal van ten hoogste € 2 miljoen;
        - *middelgrote onderneming:* eindafnemer die een onderneming is met minder dan 250 werknemers en een jaaromzet van
      ten hoogste € 50 miljoen of een jaarlijks balanstotaal van ten hoogste € 43 miljoen;
        - *netgebruiker:* netgebruiker als bedoeld in artikel 2, eerste lid, onderdeel 11, van [verordening 715/2009]
      (32009R0715);
        - *niet-frequentiegerelateerde ondersteunende dienst:* dienst die gebruikt wordt door een transmissie-
      of distributiesysteembeheerder voor elektriciteit voor spanningsregeling in stationaire toestand, snelle
      blindstroominjecties, inertie voor plaatselijke systeemstabiliteit, kortsluitstroom, blackstartmogelijkheden en
      inzetbaarheid in eilandbedrijf;
        - *omschakelen:* een aangeslotene voorzien van een aansluiting met een doorlaatwaarde groter dan 40 m3(n) per uur,
      waarmee hoogcalorisch gas kan worden onttrokken aan het transmissiesysteem voor gas en met een voor die aansluiting
      geschikte druk en voldoende capaciteit, waarbij die aansluiting in de plaats treedt van de aansluiting waarmee
      laagcalorisch gas aan het transmissiesysteem voor gas wordt onttrokken;
        - *onderneming:* entiteit, ongeacht rechtsvorm of wijze van financiering, die een economische activiteit verricht,
      in de zin van artikel 101, eerste lid, van het Verdrag betreffende de werking van de Europese Unie;
        - *ondersteunende dienst voor elektriciteit:* dienst die nodig is voor de exploitatie van een transmissie- of
      distributiesysteem voor elektriciteit, met inbegrip van balanceringsdiensten en niet-frequentiegerelateerde
      ondersteunende diensten, maar uitgezonderd congestiebeheers- of systeembeheersdiensten;
        - *ondersteunende dienst voor gas:* dienst die nodig is voor de toegang tot of de werking van een transmissie- of
      distributiesysteem voor gas, een LNG-systeem of een gasopslagsysteem, met inbegrip van het opvangen van fluctuaties
      in systeembelasting, menging en injecteren van inerte gassen, maar uitgezonderd onderdelen van het systeem die
      uitsluitend ten dienste staan van transmissiesysteembeheerders bij de uitvoering van hun taken of verplichtingen;
        - *Onze Minister:* Onze Minister van Klimaat en Groene Groei;
        - *opslaan van elektriciteit:* uitstellen van uiteindelijk gebruik van elektriciteit tot een later moment dan
      het moment waarop de elektriciteit is geproduceerd, of omzetten van elektrische energie in een vorm van energie
      die wordt opgeslagen om het daarna weer om te zetten in elektrische energie of die andere vorm van energie in het
      systeem te gebruiken;
        - *overdrachtspunt:* fysiek punt dat de overgang markeert tussen een transmissie- of distributiesysteem en een
      installatie, een transmissie- of distributiesysteem en een directe lijn of tussen twee systemen;
        - *peer-to-peer-handel:* levering van hernieuwbare elektriciteit die is geproduceerd door een actieve afnemer aan
      een eindafnemer, onder vooraf bepaalde voorwaarden voor de automatische uitvoering en afwikkeling van die levering,
      rechtstreeks of via de marktdeelnemer die de automatische uitvoering en afwikkeling realiseert;
        - *primair allocatiepunt:* eerste aan een aansluiting toegekend allocatiepunt;
        - *producent:* natuurlijk persoon of rechtspersoon die elektriciteit of gas produceert;
        - *register:* gestructureerd geheel van gegevens die volgens bepaalde criteria toegankelijk zijn, ongeacht of dit
      geheel gecentraliseerd of gedecentraliseerd is, dan wel op functionele of geografische gronden is verspreid;
        - *registerbeheerder:* partij die op grond van de [artikelen 4.5][ref25], [4.6][ref26] of [4.7][ref27] of krachtens
      [artikel 4.12][ref28] een register bijhoudt;
        - *rekening voor garanties van oorsprong:* staat waarop een tegoed van garanties van oorsprong kan worden geboekt
      in het elektronische systeem voor het uitgeven, overdragen en innemen van garanties van oorsprong;
        - *richtlijn 2009/73:* [Richtlijn 2009/73/EG](32009L0073) van het Europees Parlement en de Raad van 13 juli 2009
      betreffende gemeenschappelijke regels voor de interne markt voor gas en tot intrekking van [Richtlijn 2003/55/EG]
      (32003L0055) (PbEU 2009, L 211);
        - *richtlijn 2012/27:* [Richtlijn 2012/27/EU](32012L0027) van het Europees Parlement en de Raad van 25 oktober
      2012 betreffende energie-efficiëntie, tot wijziging van [Richtlijnen 2009/125/EG](32009L0125) en [2010/30/EU]
      (32010L0030) en houdende intrekking van de [Richtlijnen 2004/8/EG](32004L0008) en [2006/32/EG](32006L0032) (PbEU
      2012, L 315);
        - *richtlijn 2019/944:* [Richtlijn (EU) 2019/944](32019L0944) van het Europees Parlement en de Raad van 5 juni
      2019 betreffende gemeenschappelijke regels voor de interne markt voor elektriciteit en tot wijziging van [Richtlijn
      2012/27/EU](32012L0027) (PbEU 2019, L 158);
        - *systeem:* transmissiesysteem, distributiesysteem, interconnectorsysteem, gasopslagsysteem of LNG-systeem;
        - *systeembeheerder:* beheerder van een systeem;
        - *systeemkoppeling:* deel van een transmissie- of distributiesysteem dat bestaat uit één of meer leidingen en
      daarmee verbonden hulpmiddelen: a. die twee van de volgende systemen koppelen: 1°. een transmissiesysteem, niet
      zijnde een gesloten systeem; 2°. een transmissiesysteem voor elektriciteit op zee; 3°. een distributiesysteem,
      niet zijnde een gesloten systeem; 4°. een interconnectorsysteem; b. die twee distributiesystemen, die beide geen
      gesloten systeem zijn, koppelen;
        - *tarievenbesluit:* besluit op grond van [artikel 3.110][ref29];
        - *terugleveren:* verkopen van elektriciteit door een actieve afnemer aan een marktdeelnemer die aggregeert;
        - *terugleveringsovereenkomst:* overeenkomst op grond waarvan een actieve afnemer zelf geproduceerde elektriciteit
      verkoopt aan een marktdeelnemer die aggregeert;
        - *terugleveringsovereenkomst inzake peer-to-peer-handel:* overeenkomst op grond waarvan ten behoeve van een
      actieve afnemer peer-to-peer-handel kan plaatsvinden;
        - *tijdelijke taken:* taken als bedoeld in [artikel 3.73][ref30];
        - *transmissiesysteem:* transmissiesysteem voor elektriciteit, transmissiesysteem voor elektriciteit op zee of
      transmissiesysteem voor gas;
        - *transmissiesysteembeheerder:* transmissiesysteembeheerder voor elektriciteit of voor gas;
        - *transmissiesysteembeheerder voor elektriciteit:* rechtspersoon die op grond van
      [artikel 3.2, eerste lid, onderdeel a][ref31], is aangewezen;
        - *transmissiesysteembeheerder voor elektriciteit op zee:* rechtspersoon die op grond van
      [artikel 3.2, eerste lid, onderdeel g][ref32], is aangewezen;
        - *transmissiesysteembeheerder voor gas:* rechtspersoon die op grond van
      [artikel 3.2, eerste lid, onderdeel c][ref33], is aangewezen;
        - *transmissiesysteem voor elektriciteit:* stelsel van leidingen en daarmee verbonden hulpmiddelen ten behoeve
      van het transport van elektriciteit op een spanningsniveau gelijk aan of groter dan 110 kilovolt met het oog op de
      belevering aan eindafnemers of handelaren, de levering zelf niet inbegrepen, daaronder begrepen interconnectoren;
        - *transmissiesysteem voor elektriciteit op zee:* stelsel van leidingen en daarmee verbonden hulpmiddelen ten
      behoeve van het transport van elektriciteit op een spanningsniveau gelijk aan of groter dan 110 kilovolt met
      het oog op de belevering aan eindafnemers of handelaren, de levering zelf niet inbegrepen, daaronder begrepen
      interconnectoren, die primair één of meer windparken op zee verbinden met een transmissiesysteem voor elektriciteit
      of met dat systeem en een transportsysteem voor elektriciteit van een ander land;
        - *transmissiesysteem voor gas:* stelsel van leidingen en daarmee verbonden hulpmiddelen ten behoeve van het
      transport van gas vooral onder hoge druk met het oog op de belevering aan eindafnemers of handelaren, de levering
      zelf niet inbegrepen, niet zijnde een gasproductienet of hogedrukleidingen die in de eerste plaats voor lokale
      distributie worden gebruikt, daaronder begrepen interconnectoren;
        - *transportovereenkomst:* overeenkomst op basis van een aanbod als bedoeld in de
      [artikelen 3.46, eerste lid][ref34], [3.47, eerste lid][ref35], [3.86, tweede lid][ref36] of
      [3.105, tweede lid, onderdeel b][ref37];
        - *vergunninghouder:* houder van een vergunning als bedoeld in [artikel 2.18, derde lid][ref38];
        - *verordening 1227/2011:* [Verordening (EU) 1227/2011](32011R1227) van het Europees Parlement en de Raad van
      25 oktober 2011 betreffende de integriteit en transparantie van de groothandelsmarkt voor energie en tot intrekking
      van [Verordening (EG) 1228/2003](32003R1228) (PbEU 2001, L 326);
        - *verordening 2017/1938:* [Verordening (EU) 2017/1938](32017R1938) van het Europees Parlement en de Raad van
      25 oktober 2017 betreffende maatregelen tot veiligstelling van de gasleveringszekerheid en houdende intrekking van
      [Verordening (EU) 994/2010](32010R0994) (PbEU 2017, L 280);
        - *verordening 2018/1999:* [Verordening (EU) 2018/1999](32018R1999) van het Europees Parlement en de Raad van
      11 december 2018 inzake de governance van de energie-unie en van de klimaatactie, tot wijziging van [Richtlijn
      94/22/EG](31994L0022), [Richtlijn 98/70/EG](31998L0070), [Richtlijn 2009/31/EG](32009L0031), [Verordening (EG) nr.
      663/2009](32009R0663), [Verordening (EG) nr. 715/2009](32009R0715), [Richtlijn 2009/73/EG](32009L0073), [Richtlijn
      2009/119/EG](32009L0119) van de Raad, [Richtlijn 2010/31/EU](32010L0031), [Richtlijn 2012/27/EU](32012L0027),
      [Richtlijn 2013/30/EU](32013L0030) en [Richtlijn (EU) 2015/652](32015L0652) van de Raad, en tot intrekking van
      [Verordening (EU) nr. 525/2013](32013R0525) (PbEU 2018, L328);
        - *verordening 2019/941:* [Verordening (EU) 2019/941](32019R0941) van het Europees Parlement en de Raad van
      5 juni 2019 betreffende risicoparaatheid in de elektriciteitssector en tot intrekking van [Richtlijn 2005/89/EG]
      (32005L0089) (PbEU 2019, L 158);
        - *verordening 2019/942:* [Verordening (EU) 2019/942](32019R0942) van het Europees Parlement en de Raad van 5 juni
      2019 tot oprichting van een Agentschap van de Europese Unie voor de samenwerking tussen energieregulators (PbEU
      2019, L 158);
        - *verordening 2019/943:* [Verordening (EU) 2019/943](32019R0943) van het Europees Parlement en de Raad van 5 juni
      2019 betreffende de interne markt voor elektriciteit (PbEU 2019, L 158);
        - *verordening 2022/869:* [Verordening (EU) 2022/869](32022R0869) van het Europees Parlement en de Raad van 30 mei
      2022 betreffende richtsnoeren voor de trans-Europese energie-infrastructuur en tot wijziging van [Verordeningen
      (EG) nr. 715/2009](32009R0715), [(EU) 2019/942](32019R0942) en [(EU) 2019/943](32019R0943), en [Richtlijnen
      2009/73](32009L0073) (EG) en [(EU) 2019/944](32019L0944), en tot intrekking van [Verordening (EU) nr. 347/2013]
      (32013R0347) (PbEU 2022, L 152);
        - *verordening 715/2009:* [Verordening (EG) 715/2009](32009R0715) van het Europees Parlement en de Raad van 13 juli
      2009 betreffende de voorwaarden voor de toegang tot aardgastransmissienetten en tot intrekking van [Verordening
      (EG) 1775/2005](32005R1775) (PbEU 2009, L 211);
        - *volledig geïntegreerde netwerkcomponent:* geïntegreerd onderdeel van het distributie- of transmissiesysteem
      dat door een transmissie- of distributiesysteembeheerder voor elektriciteit uitsluitend wordt gebruikt voor
      het waarborgen van een veilig en betrouwbaar beheer van het distributie- of transmissiesysteem, en niet voor
      balancerings- of congestiebeheer;
        - *vraagrespons:* verandering van het verbruik of de invoeding van elektriciteit bij eindafnemers ten opzichte
      van hun normale verbruiks- of terugleverpatronen, in reactie op marktsignalen of systeembehoeften, met als doel de
      vraagvermindering, of -verhoging te verkopen op een energiehandelsmarkt;
        - *vraagresponsovereenkomst:* overeenkomst op grond waarvan een marktdeelnemer ten behoeve van een eindafnemer
      vraagrespons kan toepassen;
        - *waterstofgas:* gasmengsel dat ten minste voor 98 procent bestaat uit waterstof en bij een temperatuur van 15 °C
      en bij een druk van 1,01325 bar in gasvormige toestand verkeert;
        - *waterstofopslagfaciliteit:* een faciliteit voor de ondergrondse opslag van waterstofgas dan wel het gedeelte van
      een waterstofterminal dat voor opslag wordt gebruikt;
        - *waterstofterminal:* faciliteit die wordt gebruikt voor het omzetten van vloeibare waterstof of vloeibare
      derivaten van waterstof in waterstofgas, dan wel het omzetten van waterstofgas in vloeibare waterstof, met inbegrip
      van ondersteunende diensten en tijdelijke opslag noodzakelijk voor het omzetten en invoeden in, dan wel onttrekken
      aan de infrastructuur voor het transport van waterstof;
        - *wettelijke taken of verplichtingen:* taken of verplichtingen die bij of krachtens deze wet aan een
      systeembeheerder zijn opgedragen;
        - *windpark:* installatie voor de productie van elektriciteit met behulp van wind;
        - *zeggenschap:* rechten, overeenkomsten of andere middelen die, afzonderlijk of tezamen, met inachtneming van
      alle feitelijke of juridische omstandigheden, het mogelijk maken een beslissende invloed uit te oefenen op de
      activiteiten van een onderneming, met name: 1°. eigendoms- of gebruiksrechten op alle vermogensbestanddelen van
      een onderneming of delen daarvan; 2° rechten of overeenkomsten die een beslissende invloed verschaffen op de
      samenstelling, het stemgedrag of de besluiten van de organen van een onderneming;
        - *zoneoverschrijdende capaciteit:* zoneoverschrijdende capaciteit als bedoeld in artikel 2, onderdeel 70, van
      [verordening 2019/943](32843R2019).


