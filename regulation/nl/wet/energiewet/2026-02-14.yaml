      worden vastgesteld op basis van [artikel 40a van de Elektriciteitswet 1998][ref2] respectievelijk
      [artikel 81e, tweede lid, van de Gaswet][ref3] en de krachtens deze artikelen vastgestelde
      [Regeling meettarieven][ref4], zoals die luidden onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding
      van deze wet, tot het moment waarop voor de eerste maal na inwerkingtreding van deze wet de op grond van
      [artikel 3.110][ref5] vastgestelde tarieven in werking treden.


