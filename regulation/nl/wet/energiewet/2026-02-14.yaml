        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 4.10.2
    text: |-
      In het geval een aangeslotene op een gesloten systeem niet behoort tot het bedrijf van de beheerder van het
      gesloten systeem en die beheerder niet aan die aangeslotene elektriciteit of gas levert, verstrekt een beheerder
      van een gesloten systeem aan leveranciers, marktdeelnemers die aggregeren, balanceringsverantwoordelijken,
      meetverantwoordelijke partijen, Onze Minister en andere systeembeheerders de bij ministeriële regeling te bepalen
      gegevens die in zijn register zijn opgenomen ten behoeve van het:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.10
  - number: 4.10.2.a
    text: sluiten, uitvoeren en beëindigen van een overeenkomst;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.10
  - number: 4.10.2.b
    text: overstappen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.10
  - number: 4.10.2.c
    text: verstrekken van facturen, factureringsinformatie, opwekkingsgegevens en verbruiksgegevens;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.10
  - number: 4.10.2.d
    text: uitvoeren van de balanceringsverantwoordelijkheid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.10
  - number: 4.10.2.e
    text: uitvoeren van metingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.10
  - number: 4.10.2.f
    text: uitgeven van garanties van oorsprong.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.10
  - number: 4.10.3
    text: |-
      Indien het tweede lid van toepassing is, verstrekt een beheerder van een gesloten systeem ter uitvoering van
      [artikel 4.1, tweede lid, onderdelen b, c, d en e][ref1], de bij ministeriële regeling te bepalen gegevens die
      hij in zijn register heeft opgenomen aan de verzoekende partij of aan een ander zoals bepaald door de verzoekende
      partij.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.10
