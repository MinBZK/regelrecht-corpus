  - number: '7.35'
    text: |-
      Voor de toepassing van deze wet worden leidingen en daarmee verbonden hulpmiddelen ten behoeve van
      transport van elektriciteit die één of meer windparken op zee verbinden met een transmissiesysteem voor
      elektriciteit en waarvoor voor de datum waarop deze wet in werking treedt een vergunning op grond van de
      [Wet beheer rijkswaterstaatswerken][ref1] of op grond van [artikel 6.5 van de Waterwet][ref2] is verleend, geacht
      geen onderdeel uit te maken van het transmissiesysteem voor elektriciteit op zee.


      [ref1]: https://wetten.overheid.nl/BWBR0008331
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
