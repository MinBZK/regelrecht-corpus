    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.9
  - number: 4.9.2.f
    text: uitvoeren van metingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.9
  - number: 4.9.2.g
    text: uitgeven van garanties van oorsprong;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.9
  - number: 4.9.2.h
    text: beheren en onderhouden van systemen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.9
