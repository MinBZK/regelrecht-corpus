  - number: '7.55'
    text: |-
      Verschillende artikelen van [afdeling 7.2][ref1], of onderdelen daarvan, komen te vervallen op een bij koninklijk
      besluit te bepalen tijdstip dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden
      vastgesteld.


