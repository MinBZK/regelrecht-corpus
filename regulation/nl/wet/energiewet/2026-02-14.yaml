      Een transmissie- of distributiesysteembeheerder verstrekt de gegevens, bedoeld in het tweede en derde lid, middels
      de faciliteit van de gegevensuitwisselingsentiteit en geeft de gegevensuitwisselingsentiteit ter uitvoering van
      [artikel 4.16][ref1] toegang tot zijn register.


