        afdeling: '3.1'
  - number: '3.89'
    text: |-
      Ten minste de helft van de aandelen in een interconnectorsysteembeheerder voor elektriciteit berusten direct
      of indirect bij de Staat der Nederlanden, waarbij onder indirect berusten van aandelen wordt verstaan dat de
      desbetreffende aandelen berusten bij één of meer rechtspersonen waarvan alle aandelen worden gehouden door de
      staat of bij een rechtspersoon die een volledige dochtermaatschappij is van één of meer rechtspersonen waarvan alle
      aandelen worden gehouden door de staat.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.89
  - number: 3.90.1
    text: |-
      De [artikelen 3.10][ref1], [3.24][ref2], [3.25, eerste lid][ref3], [3.75, onderdeel b][ref4], [3.76][ref5],
      [3.77][ref6] en [3.78][ref7] zijn van overeenkomstige toepassing op een interconnectorsysteembeheerder,
