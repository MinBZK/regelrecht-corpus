  - number: 7.52.4
    text: |-
      Voor zover de in het tweede en derde lid bedoelde voorwaarden betrekking hebben op de uitwisseling van gegevens,
      blijven deze voorwaarden na inwerkingtreding van [hoofdstuk 4][ref1] van toepassing, totdat de bij ministeriële
      regeling te stellen regels, bedoeld in hoofdstuk 4, zijn vastgesteld en in werking getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.52
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '4'
  - number: 7.52.5
    text: Voor zover een voorwaarde strijdig is met het bij of krachtens deze wet bepaalde, gaat de voorwaarde voor.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.52
  - number: 7.52.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing, bedoeld in het tweede tot en met
      vierde lid, en kunnen voorwaarden worden uitgezonderd van deze toepassing.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.52
  - number: 7.53.1
    text: |-
      [Artikel 13 van het Besluit factuur, verbruiks- en indicatief kostenoverzicht energie][ref1], zoals dat luidde
      onmiddellijk voor het tijdstip van inwerkingtreding van [artikel 4.9][ref2], blijft na inwerkingtreding van artikel
      4.9 van toepassing, totdat de bij ministeriële regeling te stellen regels, bedoeld in artikel 4.9, derde lid, zijn
      vastgesteld en in werking getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0036646#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel4
