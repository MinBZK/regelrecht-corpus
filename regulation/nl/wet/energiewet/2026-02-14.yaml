  - number: 4.10.1.b
    text: bepalen van tarieven;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.10
  - number: 4.10.1.c
    text: uitvoeren van aansluit- en transportovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.10
  - number: 4.10.1.d
    text: transporteren;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.10
  - number: 4.10.1.e
    text: beheren en onderhouden van zijn meetinrichtingen;
