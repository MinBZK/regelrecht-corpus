      of [39 van de Elektriciteitswet 1998][ref2] of [artikel 2b, zevende lid][ref3], of [35a van de Gaswet][ref4]
      vastgestelde algemene maatregel van bestuur worden in geval van een transmissiesysteembeheerder en in geval
      van een krachtens artikel 4 van [verordening 2015/1222](33122R2015) door de Autoriteit Consument en Markt
      aangewezen benoemde elektriciteitsmarktbeheerder gelijkgesteld met methoden of voorwaarden als bedoeld in
      [artikel 3.121, tweede lid][ref5], en in geval van een interconnectorsysteembeheerder met methoden of voorwaarden
