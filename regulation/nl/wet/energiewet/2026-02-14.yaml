        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
  - number: 3.118.2.a
    text: |-
      voor «transmissie- of distributiesysteembeheerder» of «transmissie- en distributiesysteembeheerders» of «de
      transmissiesysteembeheerder voor elektriciteit» steeds wordt gelezen «de transmissiesysteembeheerder voor
      elektriciteit op zee»;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.118
  - number: 3.118.2.b
    text: voor «toegestane of beoogde inkomsten» steeds wordt gelezen «toegestane vergoeding»;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.118
  - number: 3.118.2.c
    text: voor «tarieven» steeds wordt gelezen «de voor een jaar totale toegestane vergoeding»; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.118
  - number: 3.118.2.d
    text: |-
      bij de vaststelling van de voor een jaar totale toegestane vergoeding geen nadere onderscheiding en opbouw daarvan,
      conform [artikel 3.107, derde lid][ref1], in acht behoeft te worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
  - number: 3.118.3
    text: |-
      Indien de transmissiesysteembeheerder voor elektriciteit op zee schade heeft moeten vergoeden op grond
      van [artikel 3.87][ref1] verdisconteert de Autoriteit Consument en Markt het aan schadevergoeding betaalde
      bedrag in de voor een jaar totale toegestane vergoeding. Indien sprake is van grove nalatigheid van de
      transmissiesysteembeheerder voor elektriciteit op zee, verdisconteert de Autoriteit Consument en Markt enkel het
      in een jaar aan schadevergoeding betaalde bedrag in de voor dat jaar totale toegestane of beoogde vergoeding voor
      zover dit het bedrag van € 10 miljoen overstijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
  - number: 3.118.4
    text: |-
      Voor zover de op grond van het tweede lid voor een jaar vastgestelde totale toegestane vergoeding niet wordt gedekt
      door de subsidie, bedoeld in [artikel 5.14][ref1], of ontvangsten uit procedures voor het ter beschikking stellen
      van zoneoverschrijdende capaciteit of congestiebeheer brengt de transmissiesysteembeheerder voor elektriciteit op
      zee het restant in rekening bij de transmissie- of distributiesysteembeheerders voor elektriciteit volgens een bij
      algemene maatregel van bestuur te bepalen verdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel5
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.2'
  - number: 3.119.1
    text: |-
      Een transmissie- of distributiesysteembeheerder of de transmissiesysteembeheerder voor elektriciteit op
      zee past bij de uitvoering van wettelijke taken of verplichtingen met betrekking tot aansluiten op en
      transporteren van elektriciteit of gas over het systeem, ter beschikking stellen van op het systeem beschikbare
      zoneoverschrijdende capaciteit, meten, balanceren en inkopen van ondersteunende diensten of congestiebeheers- of
      systeembeheersdiensten, methoden of voorwaarden toe die vooraf zijn goedgekeurd door de Autoriteit Consument en
      Markt overeenkomstig [artikel 3.121, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.119
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.119.2
    text: |-
      Op een overeenkomst tussen een transmissie- of distributiesysteembeheerder of de transmissiesysteembeheerder voor
      elektriciteit op zee en een aangeslotene, netgebruiker, marktdeelnemer of balanceringsverantwoordelijke, zijn de
      door de Autoriteit Consument en Markt overeenkomstig [artikel 3.121][ref1] goedgekeurde methoden of voorwaarden
      en de methoden of voorwaarden waarover Acer krachtens artikel 5 van [verordening 2019/942](32842R2019) een
      besluit heeft genomen, alsmede de rechtstreeks bij of krachtens [verordening 715/2009](32009R0715) of [verordening
      2019/943](32843R2019) geldende methoden of voorwaarden van toepassing. Elk beding strijdig met die methoden of
      voorwaarden is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.119
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.119.3
    text: |-
      Een transmissie- of distributiesysteembeheerder of de transmissiesysteembeheerder voor elektriciteit op zee
      publiceert op een voor eenieder kenbare en toegankelijke wijze:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.119
  - number: 3.119.3.a
    text: de door de Autoriteit Consument en Markt goedgekeurde methoden of voorwaarden;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.119
  - number: 3.119.3.b
    text: |-
      de vindplaats van de methoden of voorwaarden waarover Acer krachtens artikel 5 van [verordening 2019/942]
      (32842R2019) een besluit heeft genomen; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.119
  - number: 3.119.3.c
    text: |-
      de vindplaats van rechtstreeks bij of krachtens [verordening 715/2009](32009R0715) of [verordening 2019/943]
      (32843R2019) geldende methoden of voorwaarden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.119
  - number: 3.120.1
    text: |-
      Elke transmissie- of distributiesysteembeheerder voor elektriciteit en, voor zover relevant, de
      transmissiesysteembeheerder voor elektriciteit op zee, en elke transmissie- of distributiesysteembeheerder voor
      gas draagt zorg voor de totstandkoming van een gezamenlijk voorstel voor of aanvulling of wijziging van methoden
      of voorwaarden, bedoeld in [artikel 3.119][ref1], en het ter goedkeuring voorleggen daarvan aan de Autoriteit
      Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.120
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.120.2
    text: |-
      Bij de totstandkoming van het voorstel voeren de transmissie- en distributiesysteembeheerders voor elektriciteit,
      voor zover relevant met de transmissiesysteembeheerder voor elektriciteit op zee, of de transmissie- en
      distributiesysteembeheerders voor gas, in ieder geval overleg met de ten aanzien van het voorstel relevante
      representatieve organisaties van aangeslotenen, netgebruikers, marktdeelnemers en balanceringsverantwoordelijken in
      een transparant en participatief proces en verwerkt de resultaten hiervan in het voorstel.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.120
  - number: 3.120.3
    text: 'Indien de Autoriteit Consument en Markt dat noodzakelijk acht kan zij:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.120
  - number: 3.120.3.a
    text: |-
      de transmissie- en distributiesysteembeheerders voor elektriciteit, in voorkomend geval met de
      transmissiesysteembeheerder voor elektriciteit op zee, of de transmissie- en distributiesysteembeheerders voor gas,
      opdragen een gezamenlijk voorstel als bedoeld in het eerste lid op te stellen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.120
  - number: 3.120.3.b
    text: |-
      uit eigen beweging een ontwerp voor of aanvulling of wijziging van methoden of voorwaarden opstellen,
      waarbij de Autoriteit Consument en Markt de transmissie- en distributiesysteembeheerders voor elektriciteit
      en, voor zover relevant, de transmissiesysteembeheerder voor elektriciteit op zee, of de transmissie- en
      distributiesysteembeheerders voor gas, alsmede representatieve organisaties van aangeslotenen, netgebruikers,
      marktdeelnemers en balanceringsverantwoordelijken betrekt in een transparant en participatief proces.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.120
  - number: 3.120.4
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.120
  - number: 3.120.4.a
    text: de procedure voor de totstandkoming van een voorstel als bedoeld in het eerste of derde lid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.120
  - number: 3.120.4.b
    text: de inhoud en onderbouwing van een voorstel als bedoeld in het eerste of derde lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.120
  - number: 3.121.1
    text: |-
      De Autoriteit Consument en Markt keurt de methoden of voorwaarden die ingevolge [artikel 3.120][ref1] aan
      haar worden voorgelegd goed indien de resultaten van het overleg met de representatieve organisaties, bedoeld
      in artikel 3.120, tweede lid, zijn verwerkt in de methoden of voorwaarden en deze methoden of voorwaarden
      objectief, evenredig, transparant, niet discriminerend, in overeenstemming zijn met deze wet en met bindende EU-
      rechtshandelingen, en de volgende belangen dienen:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.121.1.a
    text: waarborging van de interoperabiliteit van systemen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
  - number: 3.121.1.b
    text: |-
      het betrouwbaar, duurzaam, doelmatig en milieu hygiënisch verantwoord functioneren van de elektriciteits- en
      gasvoorziening;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
  - number: 3.121.1.c
    text: de bevordering van de ontwikkeling van het handelsverkeer op de elektriciteits- en gasmarkt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
  - number: 3.121.1.d
    text: |-
      de bevordering van het doelmatig handelen van aangeslotenen, netgebruikers, marktdeelnemers of
      balanceringsverantwoordelijken;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
  - number: 3.121.1.e
    text: |-
      een goede kwaliteit van de dienstverlening van transmissie- en distributiesysteembeheerders of de
      transmissiesysteembeheerder voor elektriciteit op zee;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
  - number: 3.121.1.f
    text: |-
      een objectieve, transparante en niet discriminatoire handhaving van de balans op transmissie- of
      distributiesystemen op een wijze die de kosten weerspiegelt; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
  - number: 3.121.1.g
    text: niet-discriminatoire deelname van alle netgebruikers, marktdeelnemers of balanceringsverantwoordelijken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
  - number: 3.121.2
    text: |-
      De Autoriteit Consument en Markt keurt de methoden of voorwaarden waarvoor ingevolge een krachtens [verordening
      715/2009](32009R0715) of [verordening 2019/943](32843R2019) vastgestelde uitvoeringshandeling of gedelegeerde
      handeling door een transmissie- of distributiesysteembeheerder, de transmissiesysteembeheerder voor elektriciteit
      op zee of een derde partij een voorstel is opgesteld en aan haar wordt voorgelegd, goed indien deze in
      overeenstemming zijn met het bepaalde bij of krachtens [verordening 715/2009](32009R0715) of [verordening 2019/943]
      (32843R2019).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
  - number: 3.121.3
    text: |-
      De Autoriteit Consument en Markt kan vereisen dat de aan haar voorgelegde methoden of voorwaarden worden gewijzigd
      voordat zij deze goedkeurt en kan hiervoor aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
  - number: 3.121.4
    text: |-
      Indien de Autoriteit Consument en Markt ingevolge [artikel 3.120, derde lid, onderdeel b][ref1], uit
      eigen beweging een ontwerp voor methoden of voorwaarden heeft opgesteld kan zij deze vaststellen. De aldus
      vastgestelde methoden of voorwaarden gelden vervolgens als goedgekeurde methoden of voorwaarden als bedoeld in
      [artikel 3.119, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.121.5
    text: |-
      De Autoriteit Consument en Markt publiceert een op grond van dit artikel genomen besluit op een voor eenieder
      kenbare en toegankelijke wijze.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
  - number: 3.121.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de procedure voor de goedkeuring van de methoden
      en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.121
  - number: 3.122.1
    text: |-
      Een interconnectorsysteembeheerder past bij de uitvoering van de bij of krachtens [paragraaf 3.5.2][ref1] aan
      hem opgedragen taken of verplichtingen methoden of voorwaarden toe die vooraf zijn goedgekeurd door de Autoriteit
      Consument en Markt overeenkomstig [artikel 3.123][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.122
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.122.2
    text: |-
      Een LNG-beheerder past bij de uitvoering van de bij of krachtens [paragraaf 3.5.3][ref1] aan hem opgedragen taken
      of verplichtingen, methoden of voorwaarden toe die vooraf zijn goedgekeurd door de Autoriteit Consument en Markt
      overeenkomstig [artikel 3.123][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.122
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.5.3
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.122.3
    text: |-
      [Artikel 3.119, tweede en derde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.122
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.123.1
    text: |-
      De Autoriteit Consument en Markt keurt de methoden of voorwaarden van een interconnectorsysteembeheerder,
      bedoeld in [artikel 3.122, eerste lid][ref1], op basis van een daartoe strekkend voorstel van de betreffende
      interconnectorsysteembeheerder goed indien deze in overeenstemming zijn met het bepaalde bij of krachtens
      [verordening 715/2009](32009R0715), [verordening 2019/943](32843R2019) of andere bindende EU-rechtshandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.123
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.123.2
    text: |-
      De Autoriteit Consument en Markt keurt de methoden of voorwaarden van een LNG-beheerder, bedoeld in
      [artikel 3.122, tweede lid][ref1], op basis van een daartoe strekkend voorstel van de betreffende LNG-beheerder
      goed indien deze redelijk, transparant en niet discriminerend zijn en in overeenstemming zijn met deze wet en
      bindende EU-rechtshandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.123
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.123.3
    text: |-
      De Autoriteit Consument en Markt kan vereisen dat de aan haar voorgelegde methoden of voorwaarden worden gewijzigd
      voordat zij deze goedkeurt en kan hiervoor aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.123
  - number: 3.123.4
    text: |-
      De Autoriteit Consument en Markt publiceert een op grond van dit artikel genomen besluit op een voor eenieder
      kenbare en toegankelijke wijze.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.123
  - number: 3.123.5
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van de methoden of voorwaarden van de LNG-beheerder, bedoeld in het
      tweede lid, nadere regels worden gesteld over de procedure tot goedkeuring van de methoden of voorwaarden en de
      publicatie en inwerkingtreding van de methoden of voorwaarden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.123
  - number: 3.124.1
    text: |-
      De Autoriteit Consument en Markt kan op verzoek voor een in de ontheffing te bepalen periode ontheffing verlenen
      van [artikel 3.119, eerste lid][ref1], indien onverkorte toepassing daarvan naar het oordeel van de Autoriteit
      Consument en Markt in het voorliggende geval ongewenste gevolgen heeft en de vereisten en belangen, bedoeld in
      [artikel 3.121, eerste lid][ref2], zich daar niet tegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.124
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.124.2
    text: |-
      [Artikel 3.119, tweede lid][ref1], is niet van toepassing voor zover een ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.124
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.124.3
    text: |-
      De Autoriteit Consument en Markt kan voorschriften en beperkingen verbinden aan de ontheffing en kan de ontheffing
      of de daaraan verbonden voorschriften of beperkingen wijzigen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.124
  - number: 3.124.4
    text: 'De Autoriteit Consument en Markt kan de ontheffing intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.124
  - number: 3.124.4.a
    text: de houder van de ontheffing hierom verzoekt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.124
  - number: 3.124.4.b
    text: de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.124
  - number: 3.124.4.c
    text: |-
      de houder van de ontheffing bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      juiste en volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.124
  - number: 3.124.4.d
    text: |-
      zij, gelet op de vereisten en belangen, bedoeld in [artikel 3.121, eerste lid][ref1], van oordeel is dat intrekking
      van de ontheffing noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.124
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.124.5
    text: |-
      De Autoriteit Consument en Markt publiceert een op grond van dit artikel genomen besluit op een voor eenieder
      kenbare en toegankelijke wijze.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.124
  - number: 3.125.1
    text: |-
      Indien een transmissie- of distributiesysteembeheerder, een transmissiesysteembeheerder voor elektriciteit op zee,
      een interconnectorsysteembeheerder of een LNG-beheerder bij het sluiten van overeenkomsten algemene voorwaarden
      toepast waarop [artikel 3.119, eerste lid][ref1], of [artikel 3.122][ref2] niet van toepassing is, zijn deze
      redelijk, transparant en niet-discriminerend.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.125
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.125.2
    text: |-
      De [artikelen 236][ref1] en [237 van boek 6 van het Burgerlijk Wetboek][ref2] zijn van toepassing op algemene
      voorwaarden, bedoeld in het eerste lid, in een overeenkomst tussen een distributiesysteembeheerder en een
      aangeslotene met een kleine aansluiting die handelt in de uitoefening van een beroep of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel237
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.125
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '237'
  - number: '3.126'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.126
  - number: 3.126.a
    text: |-
      de informatie die ten minste in een aansluitovereenkomst of transportovereenkomst tussen een
      distributiesysteembeheerder en een aangeslotene met een kleine aansluiting moet zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.126
  - number: 3.126.b
    text: |-
      de documenten en informatie die een distributiesysteembeheerder aan een leverancier als bedoeld in de
      [artikelen 2.27][ref1] en [2.28][ref2] verstrekt ten behoeve van de naleving van die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.126
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.5
        afdeling: '2.2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.5
        afdeling: '2.2'
  - number: '3.127'
    text: |-
      Onze Minister beslist, nadat de Autoriteit Consument en Markt, of in voorkomend geval, Acer, hierover advies heeft
      uitgebracht, op een verzoek om ontheffing als bedoeld in artikel 63 van [verordening 2019/943](32843R2019).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.127
  - number: 3.128.1
    text: |-
      Onze Minister kan voor een nieuw interconnectorsysteem voor gas op verzoek ontheffing verlenen van de
      [artikelen 3.1, eerste lid, onderdeel a][ref1], en [3.2, eerste lid, onderdeel d][ref2], voor wat betreft het
      vereiste dat het interconnectorsysteem direct of indirect in eigendom moet zijn van de rechtspersoon die aanwijzing
      verzoekt, [artikel 3.90, eerste lid][ref3], ten aanzien van het van overeenkomstige toepassing verklaarde
      [artikel 3.10][ref4], artikel 3.90, derde lid, ten aanzien van het van overeenkomstige toepassing verklaarde
      [artikel 3.47, eerste lid][ref5], en [artikel 3.122, eerste lid][ref6], voor een in de ontheffing te bepalen
      periode, indien wordt voldaan aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.128
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0050714
