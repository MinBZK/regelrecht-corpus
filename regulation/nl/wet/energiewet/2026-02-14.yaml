  - number: '3.80'
    text: |-
      De transmissie- en distributiesysteembeheerders voor elektriciteit voldoen aan de transmissiesysteembeheerder voor
      elektriciteit op zee de door deze op grond van [artikel 3.118, vierde lid][ref1], bij hen in rekening gebrachte
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.80
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.4
        afdeling: '3.6'
  - number: '3.81'
    text: |-
      Een transmissiesysteembeheerder voor gas of een interconnectorsysteembeheerder voor gas informeert de Autoriteit
      Consument en Markt over technische overeenkomsten over interconnectoren of interconnectorsystemen voor gas met
      derde landen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.81
  - number: '3.82'
    text: |-
      Het transmissiesysteem voor elektriciteit op zee omvat de systemen die bestemd zijn voor het transport van
      elektriciteit en die één of meer windparken op zee verbinden met het transmissiesysteem voor elektriciteit of met
      dit systeem en het transportsysteem voor elektriciteit van een ander land met uitzondering van leidingen en daarmee
      verbonden hulpmiddelen ten behoeve van het transport van elektriciteit die één of meer windparken op zee verbinden
      met het transmissiesysteem voor elektriciteit en waarvoor voor 1 januari 2016 een vergunning op grond van de
      [Wet beheer rijkswaterstaatswerken][ref1] of op grond van [artikel 6.5 van de Waterwet][ref2] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008331
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.82
    references:
      - id: ref1
        bwb_id: BWBR0008331
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 3.83.1
    text: |-
      Onze Minister stelt een kader vast inzake de ontwikkeling van windenergie op zee en het gebruik van het
      transmissiesysteem voor elektriciteit op zee. In het ontwikkelkader wordt in ieder geval opgenomen:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.83
  - number: 3.83.1.a
    text: de locatie van één of meerdere windparken;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.83
  - number: 3.83.1.b
    text: het verwachte tijdstip van ingebruikname van ieder windpark;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.83
  - number: 3.83.1.c
    text: de verwachte levensduur van windparken;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.83
  - number: 3.83.1.d
    text: het maximale vermogen van ieder windpark;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.83
  - number: 3.83.1.e
    text: de minimale transportcapaciteit ten behoeve van ieder windpark;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.83
  - number: 3.83.1.f
    text: de wijze van elektrische ontsluiting van ieder windpark;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.83
  - number: 3.83.1.g
    text: de beoogde opleveringsdatum van onderdelen van het transmissiesysteem voor elektriciteit op zee;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.83
  - number: 3.83.1.h
    text: |-
      toekomstige ontwikkelingen inzake windenergie op zee en het gebruik van het transmissiesysteem voor elektriciteit
      op zee.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.83
  - number: 3.83.2
    text: Onze Minister kan het ontwikkelkader wijzigen of aanvullen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.83
  - number: 3.83.3
    text: |-
      De transmissiesysteembeheerder voor elektriciteit op zee werkt het ontwikkelkader uit in het investeringsplan,
      bedoeld in [artikel 3.85][ref1] juncto [artikel 3.34][ref2], en voert zijn wettelijke taken of verplichtingen uit
      in overeenstemming met het ontwikkelkader.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.83
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.84.1
    text: |-
      De transmissiesysteembeheerder voor elektriciteit op zee die krachtens [artikel 3.2, eerste lid, onderdeel g][ref1],
      is aangewezen, is uit dien hoofde belast met de taken en verplichtingen die bij of krachtens [verordening 2019/943]
      (32843R2019) aan transmissiesysteembeheerders zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.84
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.84.2
    text: |-
      De transmissiesysteembeheerder voor elektriciteit op zee stelt op zijn systeem beschikbare zoneoverschrijdende
      capaciteit ter beschikking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.84
  - number: '3.85'
    text: |-
      De [artikelen 3.10][ref1], [3.11][ref2], [3.13][ref3], [3.14][ref4], [3.15][ref5], [3.17][ref6], [3.18][ref7],
      [3.19, eerste, tweede, derde en vijfde lid][ref8], [3.20][ref9], [3.21][ref10], [3.22][ref11], [3.24][ref12],
      [3.25][ref13], [3.28][ref14], [3.30 tot en met 3.36][ref15], [3.49, tweede en derde lid][ref16], [3.63][ref17],
      [3.75][ref18], [3.76][ref19], [3.77][ref20], [3.78][ref21], [3.79, onderdelen a en b][ref22], en [3.125][ref23]
      zijn van overeenkomstige toepassing op de transmissiesysteembeheerder voor elektriciteit op zee met
      dien verstande dat voor «transmissie- of distributiesysteembeheerder», «transmissiesysteembeheerder» of
      «distributiesysteembeheerder» telkens wordt gelezen «transmissiesysteembeheerder voor elektriciteit op zee».


