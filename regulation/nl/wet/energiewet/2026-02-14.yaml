  - number: 5.21.2
    text: |-
      De op grond van het eerste lid, onderdelen a en b, vast te stellen bestuurlijke boete
      bedraagt ten hoogste het bedrag dat is vastgesteld voor de zesde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] of, indien dat meer is, ten hoogste 1% van de omzet
      van de overtreder.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 5.21.3
    text: |-
      De op grond van het eerste lid, onderdelen c, d, e, f en g vast te stellen bestuurlijke
      boete bedraagt ten hoogste het bedrag dat is vastgesteld voor de zesde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] of, indien dat meer is, ten hoogste 10% van de omzet
      van de overtreder.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 5.21.4
    text: |-
      De bestuurlijke boete die ingevolge het tweede en derde lid ten hoogste kan worden opgelegd wordt verhoogd met
      100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref1], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5.22.1
    text: |-
      Eenieder verstrekt Onze Minister desgevraagd de gegevens, bescheiden of inlichtingen en verschaft hem desgevraagd
      inzage in de gegevens of bescheiden die redelijkerwijs nodig zijn voor de uitvoering van zijn taken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.22
  - number: 5.22.2
    text: |-
      Onze Minister kan een redelijke termijn stellen waarbinnen de gegevens, inlichtingen of bescheiden, bedoeld in het
      eerste lid, worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.22
  - number: 5.22.3
    text: |-
      Zij die uit hoofde van ambt, beroep of enig wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het
      verlenen van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.22
  - number: '5.23'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor een systeembeheerder met betrekking tot zijn wettelijke
      taken of verplichtingen regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.23
  - number: 5.23.a
    text: het verstrekken van gegevens, bescheiden en inlichtingen aan de Autoriteit Consument en Markt of aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.23
  - number: 5.23.b
    text: het bewaren, registreren en openbaar maken van gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.23
  - number: 5.24.1
    text: |-
      Gegevens, bescheiden of inlichtingen die Onze Minister in verband met enige werkzaamheid ten behoeve van de
      uitvoering van deze wet of van EU-verordeningen en EU-besluiten inzake elektriciteit of gas verkrijgt, mogen
      uitsluitend worden gebruikt voor de toepassing van deze wet, die EU-verordeningen en EU-besluiten en van een
      andere wettelijke regeling dan deze wet die de toepassing of mede de toepassing van bepalingen op het gebied van
      elektriciteit of gas betreffen, voor zover die bescheiden, gegevens of inlichtingen noodzakelijk zijn voor de
      uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.24
  - number: 5.24.2
    text: 'In afwijking van het eerste lid is Onze Minister bevoegd bescheiden, gegevens of inlichtingen, te verstrekken aan:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.24
  - number: 5.24.2.a
    text: |-
      een buitenlandse instelling, die op grond van nationale wettelijke regels is belast met de toepassing van de regels
      op het gebied van elektriciteit of gas, voor zover die bescheiden, gegevens of inlichtingen van betekenis zijn of
      kunnen zijn voor de uitoefening van de taak van die instelling;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.24
  - number: 5.24.2.b
    text: |-
      een bestuursorgaan dat op grond van deze wet of van een andere wettelijke regeling dan deze wet is belast met
      taken die de toepassing of mede de toepassing van bepalingen op het gebied van elektriciteit of gas betreffen,
      voor zover die bescheiden, gegevens of inlichtingen van noodzakelijk zijn voor de uitoefening van de taak van dat
      bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.24
  - number: 5.24.2.c
    text: |-
      Acer, voor zover die bescheiden, gegevens of inlichtingen van betekenis kunnen zijn voor de uitoefening van de taak
      van Acer.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.24
  - number: 5.24.3
    text: 'Op basis van het tweede lid kunnen uitsluitend bescheiden, gegevens of inlichtingen worden verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.24
  - number: 5.24.3.a
    text: de verdere geheimhouding van de bescheiden, gegevens of inlichtingen in voldoende mate is gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.24
  - number: 5.24.3.b
    text: |-
      voldoende is gewaarborgd dat de bescheiden, gegevens of inlichtingen niet zullen worden gebruikt voor een ander
      doel dan waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.24
  - number: 5.24.4
    text: |-
      Indien Onze Minister op grond van [artikel 5.13, derde lid][ref1], een transmissiesysteembeheerder opdraagt
      werkzaamheden te verrichten, zijn het eerste tot en met het derde lid van overeenkomstige toepassing op die
      systeembeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel5
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.24
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.2'
  - number: 5.25.1
    text: |-
      In afwijking van [artikel 7, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1] en onverminderd
      artikel 7, derde lid, van die wet is de Autoriteit Consument en Markt bevoegd gegevens of inlichtingen te
      verstrekken aan Acer, voor zover die gegevens of inlichtingen van betekenis kunnen zijn voor de uitoefening van de
      taak van Acer.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel7
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '7'
  - number: 5.25.2
    text: |-
      [Artikel 7, vierde lid, van de Instellingswet Autoriteit Consument en Markt][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel7
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '7'
  - number: 5.26.1
    text: |-
      De Europese Commissie kan van een marktdeelnemer, een transmissiesysteembeheerder of interconnectorsysteembeheerder
      de gegevens, bescheiden of inlichtingen verlangen die zij nodig heeft voor de uitvoering van artikel 52 van
      [richtlijn 2019/944](32019L0944) of artikel 10 van [richtlijn 2009/73](32009L0073).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.26
  - number: 5.26.2
    text: |-
      Degene aan wie een verzoek is gedaan om gegevens, bescheiden of inlichtingen te verstrekken als bedoeld in het
      eerste lid, is verplicht binnen de door de Europese Commissie gestelde redelijke termijn alle medewerking te
      verlenen die deze redelijkerwijs kan vorderen bij de uitoefening van haar bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.26
  - number: 5.27.1
    text: |-
      Overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels is een door Onze Minister vast
      te stellen vergoeding verschuldigd voor kosten die samenhangen met het behandelen van een aanvraag om of het geven
      van een beschikking inzake een bij of krachtens deze wet door Onze Minister te verlenen instemming, aanwijzing,
      ontheffing of vergunning.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.27
  - number: 5.27.2
    text: |-
      De vergoeding bedraagt ten hoogste de gemaakte kosten en wordt in rekening gebracht bij de aanvrager of degene aan
      wie de beschikking is gericht.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.27
  - number: 5.27.3
    text: |-
      Bij gebreke van volledige betaling binnen de gestelde termijn kan Onze Minister een verschuldigde vergoeding
      invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.27
  - number: 5.27.4
    text: |-
      Ten aanzien van de in het eerste lid bedoelde vergoedingen is, voor zover niet al van
      toepassing, [afdeling 4.4][ref1], met uitzondering van de [artikelen 4:85][ref2] en
      [4:95, van de Algemene wet bestuursrecht][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.4.1
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 6.1.1
    text: |-
      Werken met een nationaal belang waarvoor Onze Minister in ieder geval een projectbesluit als bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref1] vaststelt, zijn de volgende projecten:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 6.1.1.a
    text: |-
      de aanleg of uitbreiding van een productie-installatie, met inbegrip van de aansluiting van die installatie op een
      systeem, met een capaciteit van ten minste 100 MW, indien het betreft een windpark op land;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.1.b
    text: |-
      de aanleg of uitbreiding van een productie-installatie, met inbegrip van de aansluiting van die installatie op
      een systeem, met een capaciteit van ten minste 100 MW, indien het betreft een installatie voor de opwekking van
      duurzame elektriciteit met behulp van zonne-energie;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.1.c
    text: |-
      de aanleg of uitbreiding van een productie-installatie, met inbegrip van de aansluiting van die installatie op een
      systeem, met een capaciteit van ten minste 50 MW, indien het betreft een installatie voor de opwekking van duurzame
      elektriciteit anders dan met behulp van windenergie of zonne-energie;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.1.d
    text: |-
      de aanleg of uitbreiding van een productie-installatie voor de opwekking van andere dan duurzame elektriciteit,
      met inbegrip van de aansluiting van die installatie op een systeem, indien die productie-installatie een capaciteit
      heeft of zal krijgen van ten minste 500 MW;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.1.e
    text: |-
      een project van gemeenschappelijk belang als bedoeld in artikel 2, onderdeel 5, van [verordening 2022/869]
      (32769R2022) of van wederzijds belang, als bedoeld in artikel 2, onderdeel 6, van [verordening 2022/869]
      (32769R2022);
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.1.f
    text: de aanleg of uitbreiding van een interconnectorsysteem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.1.g
    text: |-
      een uitbreiding van het transmissiesysteem voor elektriciteit voor zover het betreft delen van het systeem voor het
      transport van elektriciteit op een spanningsniveau van 220 kilovolt of hoger;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.1.h
    text: de aanleg of uitbreiding van het transmissiesysteem voor elektriciteit op zee;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.1.i
    text: |-
      een uitbreiding van het transmissiesysteem voor gas, voor zover het betreft de van dat systeem deel uitmakende
      leidingen met een druk van ten minste 40 bar en een diameter van ten minste 45,7 centimeter;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.1.j
    text: |-
      de aanleg of uitbreiding van een LNG-systeem met een jaarlijkse hervergassingscapaciteit van ten minste 4 miljard
      m3 gas, met inbegrip van de aansluiting van dat systeem op een transmissie- of distributiesysteem voor gas; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.1.k
    text: |-
      de aanleg van een productie-installatie voor waterstofgas met behulp van elektrolyse met een bij regeling
      van Onze Minister in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties vast te
      stellen minimale capaciteit en voor de bij die regeling te bepalen gevallen, met inbegrip van de aansluiting op
      leidingen en daarmee verbonden hulpmiddelen ten behoeve van transport van waterstofgas of een transmissie- of
      distributiesysteem voor elektriciteit.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.2
    text: |-
      [Artikel 16.7 van de Omgevingswet][ref1] is van toepassing op de coördinatie van besluiten ter uitvoering van
      projectbesluiten als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16'
  - number: 6.1.3
    text: |-
      In afwijking van het eerste lid kan Onze Minister besluiten geen projectbesluit vast te stellen als naar zijn
      oordeel besluitvorming door een bestuursorgaan van een gemeente of van een provincie het project kan versnellen
      of daaraan anderszins aanmerkelijke voordelen zijn verbonden, en het college van burgemeester en wethouders van de
      betreffende gemeente respectievelijk gedeputeerde staten van de betreffende provincie daarmee instemmen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.4
    text: |-
      Onze Minister geeft tegelijk met of zo snel mogelijk na de bekendmaking van een besluit als bedoeld in het derde
      lid kennis van dat besluit op de in [artikel 12 van de Bekendmakingswet][ref1] bepaalde wijze en doet mededeling
      van dat besluit door toezending daarvan aan de initiatiefnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
  - number: 6.1.5
    text: Het vierde lid is van overeenkomstige toepassing als een besluit als bedoeld in het derde lid wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.1.6
    text: |-
      Voor projecten als bedoeld in het eerste lid, onderdeel e, stelt Onze Minister, in overeenstemming met Onze
      Minister van Volkshuisvesting en Ruimtelijke Ordening, een handleiding vast als bedoeld in artikel 9, eerste lid,
      van de verordening, genoemd in dat onderdeel.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.1
  - number: 6.2.1
    text: |-
      Werken met een provinciaal belang waarvoor gedeputeerde staten in ieder geval een projectbesluit als bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref1] vaststellen, zijn de volgende projecten:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 6.2.1.a
    text: |-
      de aanleg of uitbreiding van een windpark met een capaciteit van ten minste 15 MW maar minder dan 100 MW, met
      inbegrip van de aansluiting van dat windpark op een systeem; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.2
  - number: 6.2.1.b
    text: |-
      de aanleg of uitbreiding van een productie-installatie voor opwekking van duurzame elektriciteit met behulp van
      zonne-energie met een capaciteit van ten minste 50 MW maar minder dan 100 MW, met inbegrip van de aansluiting van
      die installatie op een systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.2
  - number: 6.2.2
    text: |-
      In afwijking van het eerste lid kunnen gedeputeerde staten besluiten geen projectbesluit vast te stellen als
      naar hun oordeel besluitvorming door een bestuursorgaan van een gemeente het project kan versnellen of daaraan
      anderszins aanmerkelijke voordelen zijn verbonden, en het college van burgemeester en wethouders van de betreffende
      gemeente daarmee instemmen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.2
  - number: 6.2.3
    text: |-
      Gedeputeerde staten geven tegelijk met of zo snel mogelijk na de bekendmaking van een besluit als bedoeld in
      het tweede lid kennis van dat besluit op de in [artikel 12 van de Bekendmakingswet][ref1] bepaalde wijze en doen
      mededeling van dat besluit door toezending daarvan aan de initiatiefnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
  - number: 6.2.4
    text: Het derde lid is van overeenkomstige toepassing als een besluit als bedoeld in het tweede lid wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.2
  - number: 6.3.1
    text: |-
      Iedere wijziging van zeggenschap als bedoeld in [artikel 26 van de Mededingingswet][ref1] over een LNG-systeem of
      in een onderneming die eigenaar is van een LNG-systeem wordt voorafgaand aan de wijziging door één van de bij de
      wijziging betrokken partijen binnen een bij ministeriële regeling te bepalen termijn gemeld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel26
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '26'
  - number: 6.3.2
    text: |-
      Iedere wijziging van zeggenschap als bedoeld in [artikel 26 van de Mededingingswet][ref1] in een productie-
      installatie met een nominaal elektrisch vermogen van in totaal meer dan 100 MW of in een onderneming die een of
      meer productie-installaties met een nominaal elektrisch vermogen van in totaal meer dan 100 MW beheert, wordt
      voorafgaand aan de wijziging door één van de bij deze wijziging betrokken partijen binnen een bij ministeriële
      regeling te bepalen termijn gemeld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel26
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '26'
  - number: 6.3.3
    text: |-
      Onze Minister kan binnen een bij ministeriële regeling te bepalen termijn op grond van overwegingen
      van openbare veiligheid, de leveringszekerheid of de voorzieningszekerheid de wijziging, bedoeld
      in het eerste lid, verbieden of opdragen maatregelen te treffen. De [artikelen 19][ref1] en
      [20 van de Wet veiligheidstoets investeringen, fusies en overnames][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel20
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '20'
  - number: 6.3.4
    text: |-
      Onze Minister kan aan het verbod of de opdracht op grond van het derde lid beperkingen of voorschriften verbinden.
      Het is verboden in strijd te handelen met een voorschrift of beperking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.3
  - number: 6.3.5
    text: De LNG-beheerder of producent neemt het verbod in acht of volgt de opdracht op.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.3
  - number: 6.3.6
    text: |-
      Rechtshandelingen die strekken tot een wijziging van zeggenschap als bedoeld in het eerste of tweede lid, die niet
      overeenkomstig die leden zijn gemeld, of die in strijd zijn met het verbod of de opdracht, bedoeld in het derde
      lid, zijn door een rechterlijke uitspraak vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.3
  - number: 6.3.7
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de melding, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.3
  - number: 6.4.1
    text: Onze Minister stelt ten minste eens in de vijf jaar een Nationaal plan energiesysteem vast.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.4
  - number: 6.4.2
    text: 'Het Nationaal plan energiesysteem bevat de hoofdlijnen van het rijksbeleid, gericht op:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.4
  - number: 6.4.2.a
    text: de transitie naar een klimaatneutraal, robuust, betaalbaar en betrouwbaar energiesysteem in Nederland;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.4
  - number: 6.4.2.b
    text: |-
      het bevorderen van de strategische onafhankelijkheid van het aanbod van bronnen van energie, van dragers van
      energie en van grondstoffen buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.4
  - number: 6.4.3
    text: 'Het Nationaal plan energiesysteem bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.4
  - number: 6.4.3.a
    text: |-
      de beschrijving van sectorale transitiepaden naar klimaatneutraliteit en van ontwikkelpaden van de transitie van
      bronnen en dragers van energie met fossiele oorsprong naar hernieuwbare bronnen en dragers van energie en naar
      kernenergie als bedoeld in [artikel 1, eerste lid, onderdeel a, van de Kernenergiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '1'
  - number: 6.4.3.b
    text: |-
      een analyse van factoren die van invloed kunnen zijn op de ontwikkeling naar een klimaatneutraal energiesysteem of
      die daarbij meegewogen moeten worden;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.4
  - number: 6.4.3.c
    text: |-
      beleid ten aanzien van de nationale productie van energie, de infrastructuur voor energie, de aard, omvang en inzet
      van eventuele opslag of reserves voor verschillende energiedragers en de omzetting van energiedragers;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.4
  - number: 6.4.3.d
    text: |-
      beleid ten aanzien van de diversificatie van energiebronnen en ten aanzien van de diversificatie van de import
      van energiedragers;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.4
  - number: 6.4.3.e
    text: |-
      een beschrijving van de risico’s, gelet op de doelen, bedoeld in het tweede lid, en het beleid ten aanzien van de
      beheersing daarvan; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.4
  - number: 6.4.3.f
    text: |-
      een overzicht van en visie op de beoogde resultaten van het in het tweede lid bedoelde rijksbeleid en de wijzen
      waarop die resultaten zullen worden nagestreefd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.4
  - number: 6.5.1
    text: Onze Minister legt een ontwerp van een Nationaal plan energiesysteem aan eenieder ter consultatie voor.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.5
  - number: 6.5.2
    text: Onze Minister stelt het Nationaal plan energiesysteem vast in overeenstemming met het gevoelen van de ministerraad.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.5
  - number: 6.5.3
    text: Onze Minister zendt het Nationaal plan energiesysteem aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.5
  - number: 6.5.4
    text: |-
      Onze Minister zendt ten aanzien van de beleidsontwikkeling ter uitvoering van het Nationaal plan energiesysteem
      jaarlijks uiterlijk op 1 november aan beide kamers der Staten-Generaal een energienota, met een beschrijving van in
      ieder geval:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.5
  - number: 6.5.4.a
    text: de voortgang van de realisatie van het energiebeleid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.5
  - number: 6.5.4.b
    text: de gevolgen voor de rijksbegroting van het energiebeleid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.5
  - number: 6.5.4.c
    text: de gevolgen voor huishoudens, ondernemingen en overheden van significante ontwikkelingen in het energiebeleid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.5
  - number: 6.6.1
    text: Er is een Raad voor Energie.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.6
  - number: 6.6.2
    text: De Raad voor Energie bestaat uit een voorzitter en ten hoogste acht andere leden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.6
  - number: 6.6.3
    text: |-
      De voorzitter en de leden hebben aantoonbare expertise en ervaring ten aanzien van energiebeleid en vraagstukken
      met betrekking tot leveringszekerheid en energieonafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.6
  - number: 6.7.1
    text: |-
      De Raad voor Energie heeft tot taak de regering en beide kamers der Staten-Generaal te adviseren over het te voeren
      beleid, gericht op:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.7
  - number: 6.7.1.a
    text: de transitie naar een klimaatneutraal, robuust, betaalbaar en betrouwbaar energiesysteem in Nederland;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.7
  - number: 6.7.1.b
    text: |-
      het bevorderen van de strategische onafhankelijkheid van het aanbod van bronnen van energie, van dragers van
      energie en van grondstoffen buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.7
  - number: 6.7.2
    text: |-
      De Raad voor Energie brengt ten minste een advies uit ter voorbereiding van het Nationaal plan energiesysteem,
      waarbij in het advies in ieder geval aandacht wordt besteed aan:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.7
  - number: 6.7.2.a
    text: overmatige afhankelijkheden en kwetsbaarheden in het Nederlandse energiesysteem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.7
  - number: 6.7.2.b
    text: |-
      de mate waarin de beleidsdoelen voor nationale energieproductie, in combinatie met het beleid van ons omliggende
      landen en de overige onderdelen van het Nederlandse energiebeleid, leiden tot voldoende energieonafhankelijkheid
      van de Nederlandse energievoorziening; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.7
  - number: 6.7.2.c
    text: |-
      de klimaatneutraliteit, robuustheid, betrouwbaarheid en betaalbaarheid van het Nederlandse energiesysteem op de
      lange termijn.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.7
  - number: '6.8'
    text: |-
      De voordracht voor een krachtens de [artikelen 3.20, eerste en tweede lid][ref1], [3.27, vijfde lid][ref2],
      [3.36, eerste lid][ref3], en [3.87, vierde lid][ref4], vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
      - id: ref4
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
  - number: '6.9'
    text: |-
      Voor de toepassing van [artikel 20, tweede lid, van Boek 5 van het Burgerlijk Wetboek][ref1] wordt een systeem
      beschouwd als een net.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel20
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '20'
  - number: 6.10.1
    text: |-
      De [Mededingingswet][ref1] is mede van toepassing op het continentaal plat ten aanzien van het verrichten van
      transport van gas met behulp van een gasproductienet.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: 6.10.2
    text: |-
      Ten aanzien van het transport van gas, bedoeld in het eerste lid, wordt onder gasproductienet niet verstaan de
      pijpleidingen die ter plaatse binnen een olie- of gaswinningsproject worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.10
  - number: '6.11'
    text: |-
      Een representatieve organisatie van partijen op de elektriciteits- of gasmarkt wordt geacht belanghebbende te zijn
      bij besluiten van de Autoriteit Consument en Markt als bedoeld in [Afdeling 3.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 6.12.1
    text: |-
      Provinciale staten en de gemeenteraad zijn niet bevoegd het produceren, transporteren, opslaan of leveren van
      elektriciteit of gas in het belang van de energievoorziening aan regels te binden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.12
  - number: 6.12.2
    text: |-
      Het eerste lid is niet van toepassing op het door provinciale staten of de gemeenteraad stellen van regels in het
      belang van de energietransitie in bij of krachtens algemene maatregel van bestuur te bepalen gevallen en onder
      daarbij te bepalen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.12
  - number: 6.12.3
    text: |-
      Provinciale staten en de gemeenteraad kunnen bij verordening bepalen dat een producent bij de aanleg of uitbreiding
      van een installatie voor de productie van energie uit hernieuwbare bronnen vanaf een bij die verordening te bepalen
      capaciteit, op een bij die verordening te bepalen wijze motiveert:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.12
  - number: 6.12.3.a
    text: |-
      welke inspanningen hij heeft verricht om mede-eigendom ten aanzien van de voorgenomen installatie en de exploitatie
      daarvan door een bij die verordening te bepalen kring van partijen, gevestigd in de nabije omgeving van de
      installatie, te bevorderen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.12
  - number: 6.12.3.b
    text: welk percentage mede-eigendom is overeengekomen; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.12
  - number: 6.12.3.c
    text: |-
      voor zover minder dan 50 procent mede-eigendom is overeengekomen, wat de redenen daarvan zijn en of er andere
      vormen van financiële participatie zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.12
  - number: 6.13.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de uitvoering van EU-
      verordeningen krachtens artikel 194 van het Verdrag betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.13
  - number: 6.13.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de uitvoering van onderdelen van bindende EU-
      rechtshandelingen, vastgesteld krachtens [richtlijn 2009/73](32009L0073), [richtlijn 2019/944](32019L0944),
      [verordening 715/2009](32009R0715) en [verordening 2019/943](32843R2019).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.13
  - number: 6.13.3
    text: |-
      Hetgeen ingevolge deze wet bij algemene maatregel van bestuur kan worden geregeld, kan in afwijking daarvan bij
      ministeriële regeling worden geregeld, indien de regels uitsluitend strekken ter uitvoering van een bindende EU-
      rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.13
  - number: 6.13.4
    text: |-
      Een wijziging van een bindende EU-rechtshandeling waarnaar in voorschriften, gesteld bij of krachtens deze wet,
      wordt verwezen, gaat voor de toepassing van die voorschriften gelden met ingang van de dag waarop aan die wijziging
      uitvoering moet zijn gegeven dan wel bij gebreke daarvan, de dag waarop die wijziging is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.13
  - number: 6.13.5
    text: |-
      Onze Minister kan besluiten dat een wijziging als bedoeld in het vierde lid in afwijking van dat lid op een eerder
      tijdstip gaat gelden. Dit besluit wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.13
  - number: 6.13.6
    text: |-
      Indien een bindende EU-rechtshandeling waarnaar in deze wet of de daarop berustende bepalingen wordt verwezen, in
      het kader van hercodificatie wordt ingetrokken en vervangen door een nieuwe bindende EU-rechtshandeling, kunnen
      bij ministeriële regeling de verwijzingen naar de ingetrokken bindende EU-rechtshandeling worden vervangen door
      verwijzingen naar de nieuwe bindende EU-rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.13
  - number: '6.14'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de laadinfrastructuur voor
      elektrisch vervoer ter uitvoering van bindende onderdelen van EU-rechtshandelingen op het gebied van elektrisch
      vervoer.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel6.14
  - number: '7.21'
    text: |-
      Als op grond van [artikel 95d van de Elektriciteitswet 1998][ref1] of [artikel 45 van de Gaswet][ref2], zoals dit
      luidde onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van [artikel 2.18, derde lid][ref3], een
      vergunning is verleend, wordt deze vergunning voor de duur van deze vergunning aangemerkt als een vergunning als
      bedoeld in artikel 2.18, derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95d
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95d
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.4
        afdeling: '2.2'
  - number: '7.22'
    text: |-
      Indien op grond van [artikel 95f, tweede lid, van de Elektriciteitswet 1998][ref1] en
      [artikel 47, tweede lid, van de Gaswet][ref2], zoals die luidden onmiddellijk voorafgaand aan het tijdstip van
      inwerkingtreding van [artikel 2.25][ref3], kleinverbruikers zijn toegedeeld aan een aangewezen vergunninghouder,
      blijven de regels krachtens genoemde artikelen van de [Elektriciteitswet 1998][ref4] en de [Gaswet][ref5] ten
      aanzien van de verbintenissen met kleinverbruikers van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95f
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0009755
      [ref5]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95f
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.4
        afdeling: '2.2'
      - id: ref4
        bwb_id: BWBR0009755
      - id: ref5
        bwb_id: BWBR0011440
  - number: 7.23.1
    text: |-
      Indien voor inwerkingtreding van [artikel 2.46][ref1] een aangeslotene met grote aansluiting met een
      gecontracteerd vermogen van minder dan 0,1 MW, met uitzondering van een aangeslotene als bedoeld in
      [artikel 1.3, tweede lid][ref2], beschikt over een meetinrichting zonder communicatiefunctionaliteit die voldoet
      aan de krachtens [artikel 36 van de Elektriciteitswet 1998][ref3] gestelde voorwaarden zoals deze luidden voor de
      inwerkingtreding van artikel 2.46, mag een aangeslotene deze meetinrichting tot en met 31 december 2025 gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '36'
  - number: 7.23.2
    text: |-
      Indien voor inwerkingtreding van [artikel 3.55, eerste lid][ref1], bij een systeemkoppeling tussen
      een distributiesysteem en een transmissiesysteem voor elektriciteit op grond van de krachtens
      [artikel 36 van de Elektriciteitswet 1998][ref2] gestelde voorwaarden zoals deze luidden voor de inwerkingtreding
      van artikel 3.55, eerste lid, geen meetinrichting is vereist, beschikt deze systeemkoppeling uiterlijk op
      31 december 2029 over een geïnstalleerde meetinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel36
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '36'
  - number: 7.24.1
    text: |-
      Een meetinrichting zonder communicatiefunctionaliteit waarover een aangeslotene als bedoeld in
      [artikel 1.3, tweede lid][ref1], voor inwerkingtreding van [artikel 2.46][ref2] beschikt, wordt tot 1 januari 2028
      aangemerkt als een meetinrichting die voldoet aan de krachtens artikel 2.46, derde lid, gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 7.24.2
    text: |-
      Zodra een aangeslotene als bedoeld in het eerste lid beschikt over een meetinrichting die voldoet aan de krachtens
      [artikel 2.46, derde lid][ref1], gestelde eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 7.24.2.a
    text: maakt hij gebruik van de communicatiefunctionaliteit van die meetinrichting; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.24
  - number: 7.24.2.b
    text: |-
      verzamelt een erkende meetverantwoordelijke partij bij deze aangeslotene uiterlijk op 1 januari 2028 de
      meetgegevens met de krachtens [artikel 2.48, tweede lid][ref1], vastgestelde frequentie.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
  - number: 7.25.1
    text: |-
      Indien voor inwerkingtreding van [artikel 2.46][ref1] een aangeslotene met grote aansluiting op een systeem
      voor gas met een jaarlijks verbruik van ten hoogste 170.000 m3 gas beschikt over een meetinrichting zonder
      communicatiefunctionaliteit die voldoet aan de krachtens [artikel 12f van de Gaswet][ref2] gestelde voorwaarden
      zoals deze luidden voor de inwerkingtreding van artikel 2.46, mag een aangeslotene deze meetinrichting tot en met
      31 december 2026 gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12f
  - number: 7.25.2
    text: |-
      Een erkende meetverantwoordelijke partij verzamelt bij een aangeslotene als bedoeld in het eerste lid, uiterlijk op
      1 januari 2027 de meetgegevens met de krachtens [artikel 2.48, tweede lid][ref1], vastgestelde frequentie.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
  - number: 7.26.1
    text: |-
      Indien voor inwerkingtreding van deze wet door een systeembeheerder op verzoek een meetinrichting ter beschikking
      is gesteld aan een aangeslotene met een grote aansluiting, blijft de systeembeheerder deze meetinrichting op
      verzoek ter beschikking stellen en wordt deze meetinrichting op verzoek van de aangeslotene beheerd door de
      systeembeheerder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.26
  - number: 7.26.2
    text: |-
      Indien voor inwerkingtreding van deze wet een aangeslotene met een aansluiting op het transmissiesysteem voor
      gas een meetinrichting beheert, kan de aangeslotene deze meetinrichting blijven beheren tot de aangeslotene de
      transmissiesysteembeheerder voor gas verzoekt om de situatie te beëindigen. De aangeslotene verleent daarbij de
      nodige medewerking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.26
  - number: 7.26.3
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.26
  - number: 7.26.3.a
    text: de installatie en het beheer van meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.26
  - number: 7.26.3.b
    text: het verzamelen, valideren en vaststellen van meetgegevens;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.26
  - number: 7.26.3.c
    text: |-
      de doorgifte van gegevens van de beheerde meetinrichtingen en meetgegevens aan een bij die ministeriële regeling te
      bepalen registerbeheerder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.26
  - number: 7.27.1
    text: |-
      Een meetinrichting met communicatiefunctionaliteit die voor inwerkingtreding van deze wet aan een
      aangeslotene met een kleine aansluiting ter beschikking is gesteld en die niet of niet geheel voldoet
      aan de krachtens [artikel 95la, eerste lid, van de Elektriciteitswet 1998][ref1] of de krachtens
      [artikel 42a, eerste lid, van de Gaswet][ref2] gestelde eisen zoals deze luidden onmiddellijk voorafgaand
      aan het tijdstip van inwerkingtreding van deze wet, wordt voor 15 jaren, te rekenen vanaf de datum van
      terbeschikkingstelling aan die aangeslotene aangemerkt als een meetinrichting die voldoet aan de krachtens
      [artikel 2.46, derde lid][ref3], gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42a
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.27
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95la
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 42a
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 7.27.2
    text: |-
      Een meetinrichting met communicatiefunctionaliteit die voor inwerkingtreding van deze wet aan
      een aangeslotene met een kleine aansluiting ter beschikking is gesteld en die tenminste voldoet
      aan de krachtens [artikel 95la, eerste lid, van de Elektriciteitswet 1998][ref1] of de krachtens
      [artikel 42a, eerste lid, van de Gaswet][ref2] gestelde eisen zoals deze luidden onmiddellijk voorafgaand aan het
      tijdstip van inwerkingtreding van deze wet, wordt aangemerkt als een meetinrichting die voldoet aan de krachtens
      [artikel 2.46, derde lid][ref3], gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42a
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.27
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95la
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 42a
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 7.28.1
    text: |-
      Een distributiesysteembeheerder stelt in een bij algemene maatregel van bestuur te bepalen periode op een
      door hem voorzien tijdstip aan aangeslotenen met een kleine aansluiting een meetinrichting die voldoet aan de
      krachtens [artikel 2.46, derde lid][ref1], gestelde eisen op of nabij het overdrachtspunt beschikbaar, tenzij
      hij redelijkerwijs niet in staat is die meetinrichting te plaatsen en de oorzaak daarvan niet in de macht van de
      aangeslotene ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 7.28.2
    text: |-
      Een distributiesysteembeheerder stelt een aangeslotene met een kleine aansluiting op zijn verzoek op een ander
      tijdstip dan het door de systeembeheerder op grond van het eerste lid voorziene tijdstip binnen vier maanden
      een meetinrichting met communicatiefunctionaliteit ter beschikking tenzij dit ertoe leidt dat de planning die
      de distributiesysteembeheerder hanteert om te voldoen aan de in het eerste lid bedoelde verplichting, niet wordt
      gehaald.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.28
  - number: 7.28.3
    text: |-
      Een distributiesysteembeheerder stelt aan een aangeslotene met een kleine aansluiting op zijn verzoek een
      meetinrichting met communicatiefunctionaliteit beschikbaar:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.28
  - number: 7.28.3.a
    text: |-
      indien de bestaande meetinrichting wordt vervangen, tenzij het ter beschikking stellen niet kostenefficiënt is in
      verhouding tot de geraamde potentiële energiebesparingen op lange termijn;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.28
  - number: 7.28.3.b
    text: indien een nieuwe aansluiting wordt aangelegd in een gebouw;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.28
  - number: 7.28.3.c
    text: indien een gebouw ingrijpend wordt gerenoveerd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.28
  - number: 7.28.4
    text: |-
      Indien een systeembeheerder redelijkerwijs niet in staat is een meetinrichting die voldoet aan de krachtens
      [artikel 2.46, derde lid][ref1], gestelde eisen te plaatsen en de oorzaak daarvan niet in de macht van de
      aangeslotene ligt, mag een aangeslotene met een kleine aansluiting de geïnstalleerde meetinrichting die niet
      voldoet aan de krachtens artikel 2.46, derde lid, gestelde eisen blijven gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 7.28.5
    text: |-
      Indien een meetinrichting met communicatiefunctionaliteit door een distributiesysteembeheerder ter beschikking
      is gesteld ingevolge het tweede of derde lid, is de desbetreffende aangeslotene aan de desbetreffende
      distributiesysteembeheerder een vergoeding verschuldigd in verband met de meerkosten.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.28
  - number: 7.28.6
    text: |-
      Een distributiesysteembeheerder zendt Onze Minister de persoonsgegevens van een aangeslotene met
      een kleine aansluiting indien hij deze aangeslotene een meetinrichting die voldoet aan de krachtens
      [artikel 2.46, derde lid][ref1], gestelde eisen ter beschikking heeft gesteld maar dit niet heeft geleid tot
      installatie van die meetinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 7.29.1
    text: |-
      Indien een meetverantwoordelijke partij die de krachtens [artikel 36 van de Elektriciteitswet 1998][ref1]
      onderscheidenlijk [artikel 12f van de Gaswet][ref2] gestelde voorwaarden zoals deze luidden voor de
      inwerkingtreding van [artikel 2.50][ref3], is erkend, wordt deze erkenning tot het tijdstip waarop de Autoriteit
      Consument en Markt heeft besloten op een aanvraag om een erkenning als bedoeld in artikel 2.50 aangemerkt als een
      erkenning als bedoeld in artikel 2.50.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12f
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.29
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 12f
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
  - number: 7.29.2
    text: |-
      Een meetverantwoordelijke partij als bedoeld in het eerste lid vraagt binnen twee jaar na inwerkingtreding van
      [artikel 2.50][ref1] een erkenning aan bij de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.29
    references:
