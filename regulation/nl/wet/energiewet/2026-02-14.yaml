        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref4
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref5
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.4
        afdeling: '3.3'
      - id: ref6
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.128.1.a
    text: de aanleg van het interconnectorsysteem versterkt de mededinging bij de levering van gas en de leveringszekerheid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.128
  - number: 3.128.1.b
    text: |-
      het risico van de investering nodig voor de aanleg van het interconnectorsysteem is zo groot dat de aanleg niet zal
      plaatsvinden als geen ontheffing wordt verleend;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.128
  - number: 3.128.1.c
    text: |-
      de eigendom van het interconnectorsysteem berust bij een ander dan de beheerder van het transmissiesysteem voor gas
      waarop de nieuw interconnectorsysteem zal worden aangesloten,
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.128
  - number: 3.128.1.d
    text: de gebruikers van het interconnectorsysteem wordt een tarief in rekening gebracht; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.128
  - number: 3.128.1.e
    text: |-
      de ontheffing belemmert niet de mededinging op of de doelmatige werking van de interne gasmarkt of de doelmatige
      werking van het transmissiesysteem voor gas waarop de nieuw interconnectorsysteem wordt aangesloten.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.128
  - number: 3.128.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op aanmerkelijke uitbreidingen van de capaciteit van bestaande
      interconnectorsystemen en op wijzigingen van de interconnectorsystemen die de ontwikkeling van nieuwe bronnen van
      gasvoorziening bevorderen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.128
  - number: 3.129.1
    text: |-
      Onze Minister kan voor een nieuw LNG-systeem of gasopslagsysteem op verzoek een ontheffing verlenen van het
      bepaalde bij of krachtens de [artikelen 3.94, eerste en vierde lid][ref1], [3.100, eerste en vierde lid][ref2],
      [3.103][ref3], [3.115][ref4], [3.122, tweede lid][ref5], voor een in de ontheffing bepaalde periode, indien wordt
      voldaan aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.129
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.3
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.4
        afdeling: '3.5'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.4
        afdeling: '3.5'
      - id: ref4
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.4
        afdeling: '3.6'
      - id: ref5
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.129.1.a
    text: |-
      de aanleg van het LNG-systeem of het gasopslagsysteem versterkt de mededinging bij de levering van gas en de
      leveringszekerheid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.129
  - number: 3.129.1.b
    text: |-
      het risico van de investering nodig voor de aanleg van het LNG-systeem of het gasopslagsysteem is zo groot dat de
      aanleg niet zal plaatsvinden als geen ontheffing wordt verleend;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.129
  - number: 3.129.1.c
    text: |-
      de eigendom van het LNG-systeem of het gasopslagsysteem berust bij een ander dan de beheerder van het
      transmissiesysteem voor gas waarop het nieuwe LNG-systeem of opslagsysteem zal worden aangesloten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.129
  - number: 3.129.1.d
    text: de gebruikers van het LNG-systeem of het gasopslagsysteem wordt een tarief in rekening gebracht; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.129
  - number: 3.129.1.e
    text: |-
      de ontheffing belemmert niet de mededinging op of de doelmatige werking van de interne gasmarkt of de doelmatige
      werking van het transmissiesysteem voor gas waarop het nieuwe LNG-systeem of gasopslagsysteem wordt aangesloten.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.129
  - number: 3.129.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op aanmerkelijke uitbreidingen van de capaciteit van een bestaand
      LNG-systeem of opslagsysteem en op een wijziging van een bestaand LNG-systeem of opslagsysteem die de ontwikkeling
      van nieuwe bronnen van gasvoorziening bevorderen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.129
  - number: 3.129.3
    text: |-
      De ontheffing kan betrekking hebben op het gehele nieuwe systeem onderscheidenlijk de aanmerkelijke uitbreiding of
      wijziging van een bestaand systeem dan wel op gedeelten daarvan.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.129
  - number: 3.130.1
    text: |-
      Onze Minister beslist zo spoedig mogelijk op een aanvraag om een ontheffing als bedoeld in
      [artikel 3.128, eerste lid][ref1], of [artikel 3.129, eerste lid][ref2], maar uiterlijk binnen zes maanden na
      ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.130.2
    text: |-
      Indien de aanvraag voor een ontheffing betrekking heeft op een interconnectorsysteem voor gas, wordt de termijn
      voor het nemen van een besluit gerekend vanaf de datum waarop de laatste van de uit de landen betrokken regulerende
      instantie een verzoek om ontheffing heeft ontvangen en kan Onze Minister het nemen van een besluit ten hoogste
      eenmaal met een periode van drie maanden verlengen indien Acer met de verlenging heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
  - number: 3.130.3
    text: Onze Minister kan voorschriften en beperkingen verbinden aan een ontheffing.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
  - number: 3.130.4
    text: |-
      Onze Minister verbindt ten minste voorschriften aan de ontheffing, bedoeld in [artikel 3.128, eerste lid][ref1], of
      [artikel 3.129, eerste lid][ref2], met betrekking tot de niet-discriminerende toegang tot het interconnectorsyteem,
      het LNG-systeem of gasopslagsysteem, onder andere over de mechanismen voor het beheer of de toewijzing van
      capaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.130.5
    text: |-
      Onze Minister zendt het besluit, bedoeld in het eerste lid, en alle relevante gegevens onverwijld aan de Europese
      Commissie.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
  - number: 3.130.6
    text: |-
      Indien twee jaar na inwerkingtreding van het besluit, bedoeld in het eerste lid, de bouw van de infrastructuur nog
      niet van start is gegaan of wanneer vijf jaar na inwerkingtreding van het besluit, bedoeld in het eerste lid, de
      infrastructuur nog niet openbaar is geworden, vervalt de ontheffing.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
  - number: 3.130.7
    text: |-
      In afwijking van het zesde lid wordt de van toepassing zijnde vervaltermijn als bedoeld in het zesde lid,
      opgeschort indien een houder van de ontheffing ten minste drie maanden voor afloop van die vervaltermijn, bedoeld
      in het zesde lid, Onze Minister verzoekt om vast te stellen dat de vertraging het gevolg is van grote hindernissen
      die buiten de macht liggen van de houder van de ontheffing, totdat Onze Minister op dat verzoek heeft beslist.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
  - number: 3.130.8
    text: |-
      In afwijking van het zesde lid vervalt de ontheffing niet indien Onze Minister het verzoek, bedoeld in het zevende
      lid, toewijst.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
  - number: 3.130.9
    text: 'Bij ministeriële regeling worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
  - number: 3.130.9.a
    text: |-
      de inhoud van en de procedure voor de besluiten, bedoeld in het eerste en zevende lid, waaronder de inhoud van en
      de procedure voor de kennisgeving, bedoeld in het vijfde lid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
  - number: 3.130.9.b
    text: de voorschriften die aan de ontheffing kunnen worden verbonden;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
  - number: 3.130.9.c
    text: de bekendmaking en inwerkingtreding van het besluit, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
  - number: 3.130.10
    text: |-
      In afwijking van [artikel 6:8, eerste lid, van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het
      indienen van een bezwaarschrift aan op de dag van inwerkingtreding van een besluit als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.130
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 4.1.1
    text: |-
      Gegevens binnen de reikwijdte van deze wet kunnen worden onderscheiden in gegevens die worden verzameld,
      aangeleverd, ontvangen, bewerkt, verstrekt, waar toegang toe is en die worden uitgewisseld.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
  - number: 4.1.2
    text: 'De gegevens, bedoeld in het eerste lid, worden gebruikt voor processen, zijnde:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
  - number: 4.1.2.a
    text: |-
      het functioneren van het energiesysteem, waarbinnen afnemen, leveren, terugleveren, faciliteren in peer-to-peer-
      handel, delen, aggregeren, overstappen, produceren, invoeden, opslaan, handelen, balanceren, meten, aansluiten,
      transporteren en het beheren en onderhouden van systemen in onderlinge samenhang plaatsvindt met het bepaalde bij
      of krachtens de [hoofdstukken 2][ref1] en [3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0050714
        hoofdstuk: '3'
  - number: 4.1.2.b
    text: |-
      het verkrijgen van inzage door een aangeslotene, een eindafnemer, een actieve afnemer of een invoeder in gegevens
      die op hem betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
  - number: 4.1.2.c
    text: |-
      de toegang tot en uitwisseling van gegevens van een aangeslotene, een eindafnemer, een actieve afnemer of een
      invoeder aan een ander op basis van een verzoek van die aangeslotene, eindafnemer, actieve afnemer of invoeder;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
  - number: 4.1.2.d
    text: |-
      de toegang tot en uitwisseling van gegevens van een aangeslotene, een eindafnemer, een actieve afnemer of een
      invoeder, indien bij of krachtens een andere wet is bepaald dat een bij of krachtens die andere dan deze wet
      genoemde persoon toegang heeft tot de bij of krachtens die andere wet genoemde gegevens;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
  - number: 4.1.2.e
    text: |-
      de toegang tot en uitwisseling van gegevens van een aangeslotene, een eindafnemer, een actieve afnemer of een
      invoeder op grond van een bij ministeriële regeling aangewezen onderdeel van een bindende EU-rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
  - number: 4.1.3
    text: |-
      Bij ministeriële regeling worden ten behoeve van de [artikelen 4.2 tot en met 4.12][ref1] regels gesteld over:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.1.3.a
    text: de inrichting van de processen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
  - number: 4.1.3.b
    text: de voorwaarden waaraan een proces voldoet;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
  - number: 4.1.3.c
    text: de voorwaarden waaraan gegevens voldoen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
  - number: 4.1.4
    text: |-
      Dit hoofdstuk is niet van toepassing op de toegang tot en de uitwisseling van gegevens die op grond van de
      verordeningen genoemd in [artikel 3.23][ref1] worden uitgewisseld, met uitzondering van bij ministeriële regeling
      aangewezen gegevens uit een bij ministeriële regeling aangewezen EU-verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 4.2.1
    text: |-
      Een partij die gegevens verzamelt of bewerkt draagt zorg voor de betrouwbaarheid en volledigheid daarvan en past
      redelijke procedures voor correctie van gegevens toe.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.2
  - number: 4.2.2
    text: Een procedure is redelijk, wanneer dit blijkt uit de aard, inhoud en wijze van totstandkoming ervan.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.2
  - number: 4.2.3
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.2
  - number: 4.3.1
    text: |-
      Een partij die gegevens verzamelt, aanlevert, ontvangt, bewerkt of in een register heeft opgenomen, neemt passende
      en evenredige technische en organisatorische maatregelen om de risico’s voor de beveiliging van die gegevens te
      beheersen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.3
  - number: 4.3.2
    text: |-
      De maatregelen zorgen, gezien de stand van de techniek, voor een niveau van beveiliging dat is afgestemd op de
      risico’s die zich voordoen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.3
  - number: 4.3.3
    text: |-
      Een partij als bedoeld in het eerste lid neemt passende maatregelen om incidenten die de beveiliging van gegevens
      bedreigen, te voorkomen en de gevolgen van dergelijke incidenten zo veel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.3
  - number: 4.3.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de maatregelen, bedoeld in het
      eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.3
  - number: 4.4.1
    text: |-
      Een partij als bedoeld in [artikel 4.3, eerste lid][ref1], meldt onverwijld bij Onze Minister een inbreuk op de
      beveiliging van gegevens met aanzienlijke gevolgen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.4.1.a
    text: de toegang tot en uitwisseling van gegevens;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.4
  - number: 4.4.1.b
    text: de aangeslotene wiens gegevens het betreft.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.4
  - number: 4.4.2
    text: |-
      Een partij verstrekt Onze Minister op diens verzoek de informatie die nodig is om een gemelde inbreuk op de
      beveiliging van gegevens te beoordelen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.4
  - number: 4.4.3
    text: |-
      Indien openbaarmaking in het algemeen belang is, kan Onze Minister een beveiligingsincident, bedoeld in het eerste
      lid, openbaar maken of de betreffende partij verplichten tot openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.4
  - number: 4.4.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de melding,
      informatieverstrekking aan Onze Minister en openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.4
  - number: 4.5.1
    text: |-
      Een transmissie- of distributiesysteembeheerder houdt een register bij waarin hij bij ministeriële regeling te
      bepalen gegevens opneemt die hij op grond van deze wet verzamelt of bewerkt over:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.1.a
    text: aansluitingen, overdrachtspunten en allocatiepunten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.1.b
    text: aangeslotenen, waaronder gegevens uit een aansluitovereenkomst en een transportovereenkomst;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.1.c
    text: systeemkoppelingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.1.d
    text: installaties;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.1.e
    text: transport;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.1.f
    text: meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.1.g
    text: metingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.1.h
    text: |-
      onderwerpen, voor zover verbonden aan het uitvoeren van de taken of verplichtingen genoemd in de
      [paragrafen 3.3.7][ref1], [3.3.8][ref2] en [3.3.9][ref3] en onderwerpen, genoemd in [artikel 3.79][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.3.7
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.3.8
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.3.9
        afdeling: '3.3'
      - id: ref4
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 4.5.2
    text: |-
      Een transmissie- of distributiesysteembeheerder houdt een register bij waarin hij bij ministeriële regeling te
      bepalen gegevens opneemt die hij op grond van het bepaalde bij of krachtens deze wet ontvangt en bewerkt over:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.2.a
    text: |-
      het actief zijn van leveranciers, marktdeelnemers die aggregeren, balanceringsverantwoordelijken en
      meetverantwoordelijke partijen op een allocatiepunt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.2.b
    text: eindafnemers;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.2.c
    text: actieve afnemers;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.2.d
    text: invoeders;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.2.e
    text: |-
      de contractperiode en de opzegtermijn van een overeenkomst tussen een marktdeelnemer en een eindafnemer, een
      actieve afnemer of een invoeder;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.2.f
    text: installaties;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.2.g
    text: inning en facturatie van tarieven;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.2.h
    text: meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.2.i
    text: metingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.5.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de frequentie waarmee en de termijn waarbinnen een
      transmissie- of distributiesysteembeheerder gegevens verzamelt, bewerkt en opneemt in het register.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.5
  - number: 4.6.1
    text: |-
      Een beheerder van een gesloten systeem, met uitzondering van de beheerder, bedoeld in
      [artikel 1 van de Spoorwegwet][ref1], houdt een register bij waarin hij bij ministeriële regeling te bepalen
      gegevens opneemt die hij op grond van deze wet verzamelt of bewerkt over:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel1
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '1'
  - number: 4.6.1.a
    text: aansluitingen, overdrachtspunten en allocatiepunten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.1.b
    text: aangeslotenen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.1.c
    text: installaties;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.1.d
    text: transport;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.1.e
    text: meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.1.f
    text: metingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.1.g
    text: |-
      onderwerpen, genoemd in [artikel 3.79, onderdelen a tot en met c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 4.6.2
    text: |-
      In het geval een aangeslotene op een gesloten systeem niet behoort tot het bedrijf van de beheerder van het
      gesloten systeem en die beheerder niet aan die aangeslotene elektriciteit of gas levert, houdt een beheerder van
      een gesloten systeem een register bij waarin hij gegevens opneemt die hij op grond van deze wet ontvangt en bewerkt
      over:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.2.a
    text: |-
      leveranciers, marktdeelnemers die aggregeren, balanceringsverantwoordelijken en meetverantwoordelijke partijen op
      een allocatiepunt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.2.b
    text: installaties;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.2.b
    text: meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.2.c
    text: metingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.2.e
    text: |-
      de contractperiode en de opzegtermijn van een overeenkomst tussen een marktdeelnemer en een eindafnemer of een
      actieve afnemer.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.3
    text: |-
      De beheerder van een gesloten systeem zijnde de beheerder, bedoeld in [artikel 1 van de Spoorwegwet][ref1], houdt
      een register bij waarin hij bij ministeriële regeling te bepalen gegevens opneemt die hij op grond van deze wet
      en [Verordening (EU). 1301/2014](32014R1301) van de Commissie van 18 november 2014 betreffende de technische
      specificatie inzake interoperabiliteit van het subsysteem «energie» van het spoorwegsysteem in de Unie verzamelt of
      bewerkt over:


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel1
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '1'
  - number: 4.6.3.a
    text: aansluitingen, overdrachtspunten en allocatiepunten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.3.b
    text: aangeslotenen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.3.c
    text: metingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.4
    text: |-
      Bij ministeriële regeling worden regels gesteld over de frequentie waarmee en de termijn waarbinnen een beheerder
      van een gesloten systeem gegevens verzamelt, bewerkt en opneemt in het register.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.6.5
    text: Gegevens worden niet langer bewaard dan noodzakelijk is voor het doel van gebruik.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.6
  - number: 4.7.1
    text: |-
      Een meetverantwoordelijke partij houdt ter uitvoering van [artikel 2.48][ref1] en [artikel 3.56][ref2] een register
      bij waarin hij bij ministeriële regeling te bepalen gegevens opneemt die hij verzamelt of bewerkt over:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
  - number: 4.7.1.a
    text: meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.7
  - number: 4.7.1.b
    text: metingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.7
  - number: 4.7.2
    text: |-
      Bij ministeriële regeling worden regels gesteld over de frequentie waarmee en de termijn waarbinnen een
      meetverantwoordelijke partij gegevens verzamelt, bewerkt en opneemt in het register.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.7
  - number: 4.8.1
    text: |-
      Een leverancier levert de bij ministeriële regeling te bepalen door hem verzamelde gegevens aan bij een daarbij
      bepaalde registerbeheerder met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.1.a
    text: het actief zijn op een allocatiepunt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.1.b
    text: de eindafnemer;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.1.c
    text: de aansluitovereenkomst bij aangeslotenen met een kleine aansluiting;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.1.d
    text: de transportovereenkomst bij aangeslotenen met een kleine aansluiting;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.1.e
    text: het innen van tarieven bij aangeslotenen met een kleine aansluiting;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.1.f
    text: metingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.1.g
    text: |-
      de contractperiode en de opzegtermijn van de leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-
      handel met een eindafnemer op een allocatiepunt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.2
    text: |-
      Een marktdeelnemer die door een actieve afnemer elektriciteit teruggeleverd krijgt of ten behoeve van hem
      faciliteert in peer-to-peer-handel, levert de bij ministeriële regeling te bepalen door hem verzamelde gegevens aan
      bij een daarbij bepaalde registerbeheerder met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.2.a
    text: het actief zijn op een allocatiepunt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.2.b
    text: de actieve afnemer;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.2.c
    text: de contractperiode en de opzegtermijn van de aggregatieovereenkomst met een actieve afnemer
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.2.d
    text: de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.3
    text: |-
      Een marktdeelnemer die vraagresponsdiensten levert aan een actieve afnemer, levert de bij ministeriële regeling te
      bepalen door hem verzamelde gegevens aan bij een daarbij bepaalde registerbeheerder met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.3.a
    text: het actief zijn op een allocatiepunt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.3.b
    text: de actieve afnemer;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.3.c
    text: de contractperiode en de opzegtermijn van de vraagresponsovereenkomst met een actieve afnemer;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.4
    text: |-
      Een balanceringsverantwoordelijke levert de bij ministeriële regeling te bepalen door hem verzamelde gegevens aan
      bij een daarbij bepaalde registerbeheerder met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.4.a
    text: het actief zijn op een allocatiepunt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.4.b
    text: de eindafnemer, actieve afnemer of invoeder;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.4.c
    text: |-
      de contractperiode en de opzegtermijn van de balanceringsovereenkomst met een eindafnemer, actieve afnemer of
      invoeder op een allocatiepunt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.5
    text: |-
      Een aangeslotene met een grote aansluiting op een transmissiesysteem voor gas die alleen gas invoedt of een
      gasopslagbeheerder is levert de bij ministeriële regeling te bepalen door hem verzamelde gegevens aan bij een
      daarbij bepaalde registerbeheerder met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.5.a
    text: meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.5.b
    text: metingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.6
    text: |-
      Een meetverantwoordelijke partij levert de bij ministeriële regeling te bepalen door hem verzamelde gegevens aan
      bij een daarbij bepaalde registerbeheerder met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.6.a
    text: de aansluiting waarop hij actief is;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.6.b
    text: meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.6.c
    text: metingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
  - number: 4.8.7
    text: |-
      Indien op grond van [artikel 2.46, tweede lid][ref1], een meetinrichting is vereist, levert de partij die
      verantwoordelijk is voor het installeren en beheren van die meetinrichting en voor het verzamelen van meetgegevens,
      de bij ministeriële regeling te bepalen door hem verzamelde gegevens aan bij een daarbij bepaalde registerbeheerder
      met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
    references:
