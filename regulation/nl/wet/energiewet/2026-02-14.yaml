  - number: 7.53.2
    text: |-
      De door de Autoriteit Consument en Markt op grond van [hoofdstuk 4 van de Elektriciteitswet 1998][ref1] en
      [hoofdstuk 3 van de Gaswet][ref2] vastgestelde voorwaarden, zoals deze luidden onmiddellijk voorafgaand aan het
      tijdstip van inwerkingtreding van [hoofdstuk 4][ref3], blijven na inwerkingtreding van hoofdstuk 4 van toepassing,
      totdat de bij ministeriële regeling te stellen regels, bedoeld in die artikelen, zijn vastgesteld en in werking
      getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk3
