    text: |-
      Een transmissie- of distributiesysteembeheerder verstrekt ter uitvoering van
      [artikel 4.1, tweede lid, onderdelen b, c, d en e][ref1], de bij ministeriële regeling te bepalen gegevens aan de
      verzoekende partij of aan een ander zoals bepaald door de verzoekende partij.


