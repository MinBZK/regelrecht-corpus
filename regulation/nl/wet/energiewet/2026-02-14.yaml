        afdeling: '3.5'
  - number: 3.3.4.b
    text: |-
      de rechtspersoon redelijkerwijs niet in staat moet worden geacht de taken of verplichtingen gesteld bij of
      krachtens [paragraaf 3.5.1][ref1] uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
  - number: 3.3.5
    text: |-
      Onze Minister kan een aanvraag van een rechtspersoon als bedoeld in [artikel 3.2, eerste lid, onderdeel h][ref1],
      afwijzen of voorschriften verbinden aan de aanwijzing indien de rechtspersoon redelijkerwijs niet in staat moet
      worden geacht de taken of verplichtingen gesteld bij of krachtens [paragraaf 3.5.3][ref2] uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.5.3
        afdeling: '3.5'
  - number: 3.3.6
    text: |-
      Onze Minister kan een aanvraag van een rechtspersoon als bedoeld in [artikel 3.2, eerste lid, onderdeel i][ref1],
      afwijzen of voorschriften verbinden aan de aanwijzing indien de rechtspersoon redelijkerwijs niet in staat moet
      worden geacht de taken of verplichtingen gesteld bij of krachtens [paragraaf 3.5.4][ref2] uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.5.4
        afdeling: '3.5'
  - number: 3.3.7
    text: |-
      Als Onze Minister krachtens het tweede tot en met zesde lid, voorschriften verbindt aan de aanwijzing, strekken
      deze ertoe geconstateerde tekortkomingen, bedoeld in die leden, zo veel mogelijk weg te nemen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.3
  - number: 3.4.1
    text: |-
      De Autoriteit Consument en Markt certificeert op aanvraag een rechtspersoon die eigenaar is van of die
      alle aandelen heeft in de rechtspersoon die eigenaar is van een transmissie- of distributiesysteem of
      interconnectorsysteem indien ten aanzien van die rechtspersoon is voldaan aan de eisen gesteld bij of krachtens
      [artikel 3.10][ref1] respectievelijk [artikel 3.90, eerste lid][ref2], ten aanzien van de van overeenkomstige
      toepassing verklaring van artikel 3.10.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.4.2
    text: |-
      Als een persoon of rechtspersoon uit een land buiten de Europese Unie zeggenschap heeft over een eigenaar
      van een transmissiesysteem of een interconnectorsysteem of een beheerder van een transmissiesysteem of een
      interconnectorsysteem, besluit de Autoriteit Consument en Markt volgens de procedure van:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.4
  - number: 3.4.2.a
    text: |-
      artikel 53 van [richtlijn 2019/944](32019L0944) of is voldaan aan de eisen van het derde lid van dat artikel,
      als het een transmissiesysteem of een interconnectorsysteem of een beheerder van een transmissiesysteem of een
      interconnectorsysteem voor elektriciteit betreft; of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.4
  - number: 3.4.2.b
    text: |-
      artikel 11 van [richtlijn 2009/73](32009L0073) of is voldaan aan de eisen van het derde lid van dat artikel,
      als het een transmissiesysteem of een interconnectorsysteem of een beheerder van een transmissiesysteem of een
      interconnectorsysteem voor gas betreft.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.4
  - number: 3.4.3
    text: |-
      In afwijking van het eerste lid kan de Autoriteit Consument en Markt bij overdracht van de eigendom van een systeem
      indien de aanwijzing vervalt, op aanvraag de rechtspersoon certificeren die eigenaar wordt van of die alle aandelen
      krijgt in de rechtspersoon die eigenaar wordt van dat systeem indien ten aanzien van deze rechtspersoon, na
      verkrijging van de eigendom van het systeem, is voldaan aan de eisen gesteld bij of krachtens [artikel 3.10][ref1]
      of [artikel 3.90, eerste lid][ref2], ten aanzien van de van overeenkomstige toepassing verklaring van artikel 3.10.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.4.4
    text: |-
      Een systeembeheerder stelt de Autoriteit Consument en Markt in kennis van elke voorgenomen transactie die
      relevant is voor de beoordeling of nog wordt voldaan aan de eisen gesteld bij of krachtens [artikel 3.10][ref1] of
      [artikel 3.90, eerste lid][ref2], ten aanzien van de van overeenkomstige toepassing verklaring van artikel 3.10.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.5.1
    text: |-
      De Autoriteit Consument en Markt kan een certificering als bedoeld in [artikel 3.4, eerste of derde lid][ref1],
      intrekken als niet langer aan de eisen, gesteld bij of krachtens [artikel 3.10][ref2] of
      [artikel 3.90, eerste lid][ref3], ten aanzien van de van overeenkomstige toepassing verklaring van artikel 3.10
      wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.5.2
    text: |-
      De Autoriteit Consument en Markt stelt een onderzoek in naar de naleving van de eisen gesteld bij of krachtens
      [artikel 3.10][ref1] of [artikel 3.90, eerste lid][ref2], ten aanzien van de van overeenkomstige toepassing
      verklaring van artikel 3.10:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.5.2.a
    text: |-
      naar aanleiding va n een melding als bedoeld in [artikel 3.4, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.5.2.b
    text: |-
      op eigen initiatief wanneer ze kennis heeft van gewijzigde omstandigheden die kunnen leiden tot een inbreuk op de
      eisen gesteld bij of krachtens [artikel 3.10][ref1] of [artikel 3.90, eerste lid][ref2], ten aanzien van de van
      overeenkomstige toepassing verklaring van artikel 3.10; of


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 3.5.2.c
    text: op verzoek van de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.5
  - number: '3.6'
    text: 'De Autoriteit Consument en Markt wijst op aanvraag:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.6
  - number: 3.6.a
    text: |-
      van de eigenaar van een transmissie- of distributiesysteem voor elektriciteit dat krachtens [artikel 3.7][ref1] is
      erkend als gesloten systeem een door de eigenaar voorgedragen beheerder aan;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.6.b
    text: |-
      van de eigenaar van een distributiesysteem voor gas dat krachtens [artikel 3.7][ref1] is erkend als gesloten
      systeem een door de eigenaar voorgedragen beheerder aan.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.7.1
    text: |-
      De Autoriteit Consument en Markt erkent op aanvraag van de eigenaar van een transmissie- of distributiesysteem voor
      elektriciteit, of een distributiesysteem voor gas dat systeem als een gesloten systeem indien:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.7
  - number: 3.7.1.a
    text: |-
      er niet op grond van [artikel 3.2, eerste lid][ref1], al een beheerder is aangewezen voor het systeem;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.7.1.b
    text: de aanvrager geen onderdeel uitmaakt van een infrastructuurgroep;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.7
  - number: 3.7.1.c
    text: |-
      het bedrijfs- of productieproces van aangeslotenen op het systeem om specifieke technische of veiligheidsredenen
      geïntegreerd is met het systeem of het systeem primair elektriciteit of gas distribueert aan de eigenaar van het
      systeem of daarmee verwante ondernemingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.7
  - number: 3.7.1.d
    text: |-
      het systeem binnen een geografisch afgebakende industriële locatie, commerciële locatie of locatie met gedeelde
      diensten ligt en dat systeem technische, organisatorische of functionele bindingen heeft;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.7
  - number: 3.7.1.e
    text: op het systeem minder dan 1.000 aangeslotenen zijn;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.7
  - number: 3.7.1.f
    text: |-
      het systeem geen huishoudelijk eindafnemers voorziet, tenzij er sprake is van incidenteel gebruik door een klein
      aantal huishoudelijk eindafnemers dat werkzaam is bij of vergelijkbare betrekkingen heeft met de eigenaar van het
      gesloten systeem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.7
  - number: 3.7.1.g
    text: |-
      de veiligheid en betrouwbaarheid van het systeem naar het oordeel van de Autoriteit Consument en Markt voldoende is
      gewaarborgd; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.7
  - number: 3.7.1.h
    text: |-
      indien het en transmissie- of distributiesysteem voor elektriciteit betreft, het spanningsniveau van dit systeem
      ten hoogste 220 kilovolt bedraagt, met uitzondering van leidingen of hulpmiddelen ten behoeve van de omzetting van
      het spanningsniveau van elektriciteit direct achter de aansluiting van het systeem op een transmissiesysteem voor
      elektriciteit.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.7
  - number: 3.7.2
    text: |-
      De Autoriteit Consument en Markt erkent op aanvraag een systeem dat zal worden aangelegd als een gesloten systeem,
      indien aan de aanvrager voor de aanleg van dat systeem de daarvoor benodigde vergunningen, ontheffingen en
      toestemmingen zijn verstrekt en is voldaan aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.7
  - number: 3.8.1
    text: |-
      In geval van fusie, splitsing, ontbinding of faillissement van de rechtspersoon die als transmissie- of
      distributiesysteembeheerder of interconnectorsysteembeheerder is aangewezen, vervalt de aanwijzing als
      systeembeheerder van rechtswege.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.8
  - number: 3.8.2
    text: Het bestuursorgaan dat een aanwijzing of erkenning heeft verleend, is eveneens bevoegd deze in te trekken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.8
  - number: 3.8.3
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.8
  - number: 3.8.3.a
    text: het intrekken van een aanwijzing, certificering of erkenning;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.8
  - number: 3.8.3.b
    text: |-
      de overdracht van de eigendom van een systeem voor gevallen waarin een aanwijzing, certificering of erkenning
      vervalt, wordt ingetrokken of niet kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.8
  - number: 3.8.4
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.8
  - number: 3.8.4.a
    text: |-
      de eisen waaraan een aanvraag tot aanwijzing, certificering of erkenning moet voldoen en de informatie die bij een
      aanvraag moet worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.8
  - number: 3.8.4.b
    text: de voorschriften of beperkingen die aan een aanwijzing, certificering of erkenning kunnen worden verbonden;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.8
  - number: 3.8.4.c
    text: de voorwaarden waaronder een aanwijzing, certificering of erkenning kan worden gewijzigd;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.8
  - number: 3.8.4.d
    text: de procedure voor het behandelen en de termijnen voor beslissen op een verzoek;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.8
  - number: 3.8.4.e
    text: |-
      de informatie die bij een certificeringsonderzoek, bedoeld in het tweede lid, moet worden verstrekt en de procedure
      die bij dat onderzoek wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.8
  - number: 3.9.1
    text: |-
      Als directe lijn wordt aangemerkt één of meer leidingen en daarmee verbonden hulpmiddelen ten behoeve van het
      transport van elektriciteit of gas:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.9
  - number: 3.9.1.a
    text: |-
      die niet verbonden is met een systeem van elektriciteit of gas of met een andere leiding voor het transport en die
      een geïsoleerde productie-installatie van een producent rechtstreeks verbindt met een geïsoleerde eindafnemer; of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.9
  - number: 3.9.1.b
    text: |-
      die ten hoogste via de installatie van één aangeslotene op de leidingen is verbonden met een systeem van
      elektriciteit of gas of met een andere leiding voor het transport en die een productie-installatie voor
      elektriciteit of gas, met tussenkomst van een leverancier, rechtstreeks verbindt met één of meer eindafnemers,
      waarbij dit voor een huishoudelijk eindafnemer enkel is toegestaan indien deze werkzaam is bij of vergelijkbare
      betrekkingen heeft met de eigenaar van de directe lijn.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.9
  - number: 3.9.2
    text: 'Een eigenaar van een directe lijn meldt:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.9
  - number: 3.9.2.a
    text: de directe lijn zo spoedig mogelijk na ingebruikname aan de Autoriteit Consument en Markt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.9
  - number: 3.9.2.b
    text: |-
      een significante wijziging ten opzichte van een eerdere melding zo spoedig mogelijk na doorvoering van de
      betreffende wijziging aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.9
  - number: 3.9.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud van de meldingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.9
  - number: 3.10.1
    text: |-
      Een transmissie- of distributiesysteembeheerder maakt geen deel uit van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap
      behoort die elektriciteit, gas of waterstofgas produceert, levert of daarin handelt; onverminderd
      [artikel 3.19, tweede lid, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.10.2
    text: |-
      Rechtspersonen en vennootschappen die deel uitmaken van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap
      behoort die elektriciteit, gas of waterstofgas produceert, levert of daarin handelt, houden geen aandelen
      in een transmissie- of distributiesysteembeheerder of in een rechtspersoon die deel uitmaakt van een groep
      waartoe ook een transmissie- of distributiesysteembeheerder behoort en nemen niet deel in een vennootschap die
      deel uitmaakt van een groep waartoe ook een transmissie- of distributiesysteembeheerder behoort. Dit verbod
      is niet van toepassing op het houden van aandelen in, of deel nemen aan een aangewezen warmtebedrijf als
      bedoeld in [artikel 1.1 van de Wet collectieve warmte][ref2], die deel uitmaakt van een groep waartoe ook een
      transmissie- of distributiebeheerder hoort, of een rechtspersoon of vennootschap die werkzaamheden als bedoeld in
      [artikel 2.13, vijfde lid, van de Wet collectieve warmte][ref3] voor het aangewezen warmtebedrijf uitvoert en die
      deel uitmaakt van een groep waartoe ook een ook een transmissie- of distributiebeheerder hoort.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0052212#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0052212#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0052212
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0052212
        artikel: '2'
  - number: 3.10.3
    text: |-
      Een transmissie- of distributiesysteembeheerder of een met die beheerder verbonden groepsmaatschappij als bedoeld
      in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 3.10.3.a
    text: |-
      houdt geen aandelen in een rechtspersoon die elektriciteit, gas of waterstofgas produceert, levert of daarin
      handelt of in een rechtspersoon die deel uitmaakt van een groep waartoe ook een rechtspersoon behoort die
      elektriciteit, gas of waterstofgas produceert, levert of daarin handelt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
  - number: 3.10.3.b
    text: |-
      neemt niet deel in een vennootschap die elektriciteit, gas of waterstofgas produceert, levert of daarin handelt
      of in een vennootschap die deel uitmaakt van een groep waartoe ook een rechtspersoon of vennootschap behoort die
      elektriciteit, gas of waterstofgas produceert, levert of daarin handelt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
  - number: 3.10.4
    text: 'Een transmissie- of distributiesysteembeheerder is zodanig ingericht dat:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
  - number: 3.10.4.a
    text: |-
      een natuurlijk persoon of rechtspersoon die directe of indirecte zeggenschap uitoefent over een rechtspersoon of
      vennootschap die elektriciteit, gas of waterstofgas produceert, levert of daarin handelt, niet gelijktijdig directe
      of indirecte zeggenschap of enig recht uitoefent over een transmissiesysteembeheerder, distributiesysteembeheerder
      of diens systemen; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
  - number: 3.10.4.b
    text: |-
      een natuurlijk persoon of rechtspersoon die directe of indirecte zeggenschap uitoefent over een
      transmissiesysteembeheerder, een distributiesysteembeheerder of diens systemen, niet gelijktijdig directe of
      indirecte zeggenschap of enig recht uitoefent over een rechtspersoon of vennootschap die elektriciteit, gas of
      waterstofgas produceert, levert of daarin handelt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
  - number: 3.10.5
    text: |-
      Onder enig recht als bedoeld in het vierde lid wordt in ieder geval verstaan het recht om stemrechten uit te
      oefenen, de bevoegdheid om leden aan te wijzen van de raad van bestuur of de raad van toezicht of een rechtspersoon
      die het bedrijf juridisch vertegenwoordigt of het hebben van een meerderheidsaandeel.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
  - number: 3.10.6
    text: |-
      Voor de toepassing van het derde lid worden twee afzonderlijke overheidsorganen die direct of indirect zeggenschap
      uitoefenen over, enerzijds, een transmissiesysteembeheerder of een transmissiesysteem en, anderzijds, over een
      rechtspersoon of vennootschap die elektriciteit, gas of waterstofgas produceert, levert of daarin handelt, niet als
      dezelfde persoon of dezelfde personen beschouwd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
  - number: 3.10.7
    text: |-
      Voor de toepassing van het eerste tot en met vierde lid wordt onder produceren van elektriciteit niet verstaan het
      door een transmissie- of distributiesysteembeheerder voor elektriciteit opwekken en vervolgens gebruiken van die
      elektriciteit bij:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
  - number: 3.10.7.a
    text: |-
      de uitvoering van een niet-frequentiegerelateerde ondersteunende dienst met een volledig geïntegreerd
      netwerkcomponent, bedoeld in [artikel 3.28, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.10.7.b
    text: |-
      het voorzien in een niet-frequentiegerelateerde ondersteunende dienst indien hiervoor aan hem een ontheffing als
      bedoeld in [artikel 3.28, derde lid][ref1], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.10.7.c
    text: |-
      het voorzien in congestiebeheers- of systeembeheersdiensten indien hiervoor aan hem een ontheffing als bedoeld in
      [artikel 3.29, tweede lid][ref1] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.10.7.d
    text: |-
      het weer omzetten van opgeslagen energie in elektrische energie met behulp van een elektriciteitsopslagfaciliteit
      die op grond van [artikel 3.32, eerste lid][ref1], door de Autoriteit Consument en Markt is erkend als volledig
      geïntegreerde netwerkcomponent of waarvoor de Autoriteit Consument en Markt een ontheffing als bedoeld in
      [artikel 3.33, eerste lid][ref2], heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.10.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter implementatie van artikel
      43 van [richtlijn 2019/944](32019L0944) en artikel 9 van [richtlijn 2009/73](32009L0073).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.10
  - number: 3.11.1
    text: |-
      De [artikelen 155a][ref1], [158 tot en met 161a][ref2] en [164][ref3] dan wel [265a][ref4],
      [268 tot en met 271a][ref5] en [274 van Boek 2 van het Burgerlijk Wetboek][ref6] zijn van toepassing op een
      transmissiesysteembeheerder en haar statuten worden dienovereenkomstig ingericht.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel155a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel158
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel265
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel268
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel274
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 155a
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '158'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '164'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '265'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '268'
      - id: ref6
        bwb_id: BWBR0003045
        artikel: '274'
  - number: 3.11.2
    text: |-
      Als een transmissiesysteembeheerder een afhankelijke maatschappij is in de zin van [artikel 152][ref1] of
      [artikel 262 van Boek 2 van het Burgerlijk Wetboek][ref2] is het eerste lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel262
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '262'
  - number: 3.11.3
    text: 'In het in het tweede lid bedoelde geval:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.11
  - number: 3.11.3.a
    text: |-
      voldoet een rechtspersoon waarvan de transmissiesysteembeheerder een afhankelijke maatschappij is aan de in het
      eerste en tweede lid genoemde eisen; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.11
  - number: 3.11.3.b
    text: |-
      beschikt de raad van commissarissen van de rechtspersoon waarvan de transmissiesysteembeheerder
      een afhankelijke maatschappij is over de bevoegdheden tot goedkeuring van de besluiten van
      het bestuur van de transmissiesysteembeheerder, bedoeld in [artikel 164, eerste lid][ref1], of
      [artikel 274, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel274
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '164'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '274'
  - number: 3.12.1
    text: 'De statuten van een distributiesysteembeheerder bevatten in elk geval:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.12
  - number: 3.12.1.a
    text: de instelling van een raad van commissarissen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.12
  - number: 3.12.1.b
    text: de bepaling dat de aandeelhouders het kader vaststellen voor het bezoldigingsbeleid van de bestuurders;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.12
  - number: 3.12.1.c
    text: |-
      in afwijking van [artikel 129, derde lid][ref1], of
      [artikel 239, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref2], de bepaling dat aan de goedkeuring van de
      raad van commissarissen ten minste zijn onderworpen de besluiten van het bestuur van de rechtspersoon, bedoeld in
      [artikel 164, eerste lid][ref3], of [artikel 274, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel239
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel274
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '129'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '239'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '164'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '274'
  - number: 3.12.1.d
    text: |-
      de bepaling dat het reserveren en uitkeren van de jaarlijkse winst geschiedt met de instemming van de
      aandeelhouders en met inachtneming van de uitvoering van de aan de distributiesysteembeheerder opgedragen taak,
      bedoeld in [artikel 3.25, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.12.2
    text: |-
      Als een distributiesysteembeheerder een afhankelijke maatschappij is als bedoeld in [artikel 152][ref1] of
      [262 van Boek 2 van het Burgerlijk Wetboek][ref2], behoeven de statuten van die distributiesysteembeheerder, in
      afwijking van het eerste lid, onderdeel a, niet te voorzien in de instelling van een raad van commissarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel262
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '262'
  - number: 3.12.3
    text: 'In het in het tweede lid bedoelde geval:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.12
  - number: 3.12.3.a
    text: |-
      voldoet een rechtspersoon waarvan de distributiesysteembeheerder een afhankelijke maatschappij is aan de in het
      eerste lid, aanhef en onderdeel a, genoemde eisen; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.12
  - number: 3.12.3.b
    text: |-
      beschikt de raad van commissarissen van de distributiesysteembeheerder, bedoeld in onderdeel a, waarvan de
      distributiesysteembeheerder een afhankelijke maatschappij is over de bevoegdheden, bedoeld in het eerste lid,
      onderdeel c, ten aanzien van het bestuur van de distributiesysteembeheerder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.12
  - number: '3.13'
    text: |-
      Een transmissie- of distributiesysteembeheerder stelt het door hem beheerde systeem of een deel daarvan niet
      beschikbaar als zekerheid voor het aantrekken van financiële middelen anders dan voor hemzelf.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.13
  - number: 3.14.1
    text: De aandelen in een transmissiesysteembeheerder berusten direct of indirect bij de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.14
  - number: 3.14.2
    text: De aandelen in een distributiesysteembeheerder berusten direct of indirect bij één of meer openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.14
  - number: 3.14.3
    text: |-
      Onder indirect berusten van aandelen wordt verstaan dat de aandelen in een transmissiesysteembeheerder of
      distributiesysteembeheerder berusten bij één of meer rechtspersonen waarvan alle aandelen worden gehouden
      door de Staat der Nederlanden respectievelijk een openbaar lichaam of bij een rechtspersoon die een volledige
      dochtermaatschappij is van één of meer rechtspersonen waarvan alle aandelen worden gehouden door de staat
      respectievelijk één of meer openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.14
  - number: 3.14.4
    text: |-
      Onverminderd [artikel 3.13][ref1], berust de onbezwaarde eigendom van een transmissiesysteem direct of indirect bij
      de transmissiesysteembeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.14.5
    text: |-
      Onverminderd [artikel 3.13][ref1], berust de onbezwaarde eigendom van een distributiesysteem direct of indirect bij
      de distributiesysteembeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.14.6
    text: |-
      Onder indirect berusten van eigendom van een systeem wordt verstaan dat de eigendom van een transmissie- of
      distributiesysteem berust bij een rechtspersoon waarvan alle aandelen worden gehouden door de transmissie- of
      distributiesysteembeheerder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.14
  - number: 3.14.7
    text: |-
      Het vierde en vijfde lid zijn niet van toepassing indien voor een transmissie- of distributiesysteem een beheerder
      van een gesloten systeem is aangewezen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.14
  - number: 3.15.1
    text: |-
      In afwijking van [artikel 3.14, eerste lid][ref1], kunnen aandelen in een transmissiesysteembeheerder direct of
      indirect berusten bij een buitenlandse instelling die op grond van nationale wettelijke regels is belast met het
      beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 35, van [richtlijn 2019/944](32019L0944), of
      in artikel 2, onderdeel 4, van [richtlijn 2009/73](32009L0073) of bij de middellijk of onmiddellijk aandeelhouder
      van die buitenlandse instelling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.15.1.a
    text: |-
      ten minste 75 procent van de aandelen in de transmissiesysteembeheerder en de overwegende zeggenschap over de
      transmissiesysteembeheerder direct of indirect bij de staat blijft;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.15
  - number: 3.15.1.b
    text: de samenwerking tussen de transmissiesysteembeheerder en een buitenlandse instelling wordt bevorderd;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.15
  - number: 3.15.1.c
    text: |-
      er sprake is van een aandelenruil die de betrouwbaarheid, betaalbaarheid of duurzaamheid van het systeem ten goede
      komt; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.15
  - number: 3.15.1.d
    text: |-
      de aandelen in de transmissiesysteembeheerder of de groep, bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waar die transmissiesysteembeheerder deel van uitmaakt,
      komen te berusten bij een instelling die de beheerder is van een systeem dat een directe verbinding heeft met het
      transmissiesysteem in Nederland of dat door middel van een interconnectorsysteem met een transmissiesysteem in
      Nederland is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 3.15.2
    text: |-
      Het voornemen de aandelen in de transmissiesysteembeheerder direct of indirect te laten berusten bij een
      buitenlandse instelling of bij de middellijk of onmiddellijk aandeelhouder van die buitenlandse instelling behoeft
      instemming van beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.15
  - number: 3.15.3
    text: |-
      Onze Minister van Financiën treedt niet eerder in onderhandeling dan dertig dagen nadat hij schriftelijk mededeling
      heeft gedaan aan de Staten-Generaal van het voornemen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.15
  - number: 3.16.1
    text: |-
      Indien een transmissiesysteembeheerder voor gas deelneemt aan een gemeenschappelijke onderneming waaraan ook een
      verticaal geïntegreerde buitenlandse transmissiesysteembeheerder deelneemt, draagt de transmissiesysteembeheerder
      voor gas er zorg voor dat de gemeenschappelijke onderneming een nalevingsprogramma, met maatregelen die
      waarborgen dat discriminerend en concurrentieverstorend gedrag uitgesloten is, opstelt en implementeert in de
      gemeenschappelijke onderneming.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.16
  - number: 3.16.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inhoud van het nalevingsprogramma en de procedure
      van de totstandkoming van het nalevingsprogramma.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.16
  - number: 3.17.1
    text: |-
      Een transmissie- of distributiesysteembeheerder verricht geen andere werkzaamheden dan die noodzakelijk zijn voor
      een goede uitvoering van zijn wettelijke taken of verplichtingen of van taken die Onze Minister aan hem heeft
      gemandateerd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.17
  - number: 3.17.2
    text: 'In afwijking van het eerste lid mag een transmissie- of distributiesysteembeheerder:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.17
  - number: 3.17.2.a
    text: |-
      in opdracht van een andere systeembeheerder werkzaamheden uitvoeren ter uitvoering van de wettelijke taken of
      verplichtingen van die systeembeheerder; of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.17
  - number: 3.17.2.b
    text: |-
      indien dit noodzakelijk is voor de uitvoering van hun wettelijke taken of verplichtingen en indien dit een
      efficiënter beheer van de ondergrondse infrastructuur en vermindering van overlast voor de omgeving oplevert,
      samenwerken met rechtspersonen die werkzaamheden uitvoeren in de ondergrondse infrastructuur.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.17
  - number: 3.17.3
    text: |-
      Ingeval van uitbesteding van werkzaamheden behoudt de transmissie- of distributiesysteembeheerder de
      verantwoordelijkheid voor de onafhankelijke, volledige en juiste uitvoering van deze werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.17
  - number: 3.18.1
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.18
  - number: 3.18.1.a
    text: |-
      kunnen in het kader van het beheer, het onderhoud en de ontwikkeling van een veilig en betrouwbaar systeem,
      ter verzekering van de geheimhouding van gegevens, hulpmiddelen of materialen van beheerders van systemen of
      door beheerders van systemen met behulp van die gegevens, hulpmiddelen of materialen ingerichte werkmethoden of
      processen, worden aangewezen als essentieel in het kader van de bescherming van vitale processen voor de nationale
      veiligheid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.18
  - number: 3.18.1.b
    text: |-
      kunnen regels worden gesteld met betrekking tot de omgang met gegevens, hulpmiddelen, materialen, processen of
      werkmethoden die krachtens onderdeel a zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.18
  - number: 3.18.1.c
    text: |-
      kunnen ter bescherming van de in onderdeel a beschreven belangen regels worden gesteld aan de betrouwbaarheid van
      toeleveranciers of de door hen te leveren goederen of diensten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.18
  - number: 3.18.1.d
    text: |-
      kunnen ter bescherming van de in onderdeel a beschreven belangen regels worden gesteld aan het selectieproces
      van medewerkers die kennis hebben of krijgen van de krachtens onderdeel a aangewezen gegevens, hulpmiddelen,
      materialen, processen of werkmethoden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.18
  - number: 3.18.2
    text: |-
      Het controlecentrum van een transmissiesysteembeheerder van waaruit de aansturing van de uitvoering van de
      wettelijke taken of verplichtingen plaatsvindt, is gevestigd in Nederland.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.18
  - number: 3.19.1
    text: |-
      Een infrastructuurgroep verricht in hoofdzaak handelingen of activiteiten ter uitvoering van de taken of
      verplichtingen die zijn opgedragen aan de transmissie- of distributiesysteembeheerder die deel uitmaakt van die
      groep.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2
    text: 'Een infrastructuurbedrijf beperkt zich in Nederland tot:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.a
    text: |-
      ten aanzien van elektriciteit of gas handelingen of activiteiten die zijn gerelateerd aan het beheer van
      transmissie- of distributiesystemen en betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.a.1°
    text: het aanleggen, onderhouden en beheren van leidingen en daarmee verbonden hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.a.2°
    text: |-
      het in opdracht van een derde aanleggen, onderhouden en ter beschikking stellen van installaties of onderdelen
      van installaties;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.a.3°
    text: het schakelen van installaties, niet zijnde productie- of opslaginstallaties;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.a.4°
    text: het aanleggen, onderhouden en ter beschikking stellen van meetinrichtingen en het leveren van meetdiensten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.a.5°
    text: elektriciteits- of gasbeurzen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.b
    text: |-
      ten aanzien van waterstofgas, gas uit hernieuwbare bronnen, of andere gasvormige stoffen uit hernieuwbare bron dan
      gas, handelingen of activiteiten die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.b.1°
    text: |-
      het aanleggen, onderhouden en beheren van leidingen en daarmee verbonden hulpmiddelen ten behoeve van transport
      van waterstofgas, gas uit hernieuwbare bronnen en andere gasvormige stoffen uit hernieuwbare bron dan gas, het
      transport daarvan via die infrastructuur;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.b.2°
    text: |-
      het in opdracht van een derde aanleggen, onderhouden en ter beschikking stellen van installaties of onderdelen
      van installaties;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.b.3°
    text: |-
      het aanleggen, onderhouden en ter beschikking stellen van meetinrichtingen en het leveren van meetdiensten voor
      waterstofgas of andere gasvormige stoffen uit hernieuwbare bron dan gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.b.4
    text: waterstofbeurzen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.c
    text: |-
      ten aanzien van warmte, koude, koolstofdioxide of stoom of condensaat, handelingen of activiteiten die betrekking
      hebben op:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.c.1°
    text: |-
      het aanleggen, onderhouden en beheren van leidingen en daarmee verbonden hulpmiddelen ten behoeve van transport van
      warmte, koude, koolstofdioxide of stoom of condensaat en het transport daarvan via die infrastructuur;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.c.2°
    text: |-
      het aanleggen, onderhouden en ter beschikking stellen van meetinrichtingen en het leveren van meetdiensten voor
      warmte, koude, koolstofdioxide of stoom of condensaat;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.2.d
    text: |-
      handelingen of activiteiten die bij of krachtens de [Wet collectieve warmte][ref1] zijn toegestaan aan een
      aangewezen warmtebedrijf als bedoeld in [artikel 1.1 van die wet][ref2] bij de uitoefening van zijn bedrijf of die
      voortvloeien uit werkzaamheden als bedoeld in [artikel 2.13, vijfde lid, van de Wet collectieve warmte][ref3] die
      worden verricht voor het aangewezen warmtebedrijf, met uitzondering van de levering of handel van elektriciteit,
      gas of waterstofgas, alsmede de productie van elektriciteit, gas of waterstofgas, anders dan voor zelfgebruik
      of het veiligstellen van de leveringszekerheid, en onder de voorwaarde dat het aangewezen warmtebedrijf en
      het infrastructuurbedrijf dat werkzaamheden verricht voor het aangewezen warmtebedrijf geen nevenactiviteiten
      verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0052212
      [ref2]: https://wetten.overheid.nl/BWBR0052212#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0052212#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0052212
      - id: ref2
        bwb_id: BWBR0052212
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0052212
        artikel: '2'
  - number: 3.19.2.e
    text: |-
      ten aanzien van drinkwater, handelingen en activiteiten die betrekking hebben op het
      aanleggen, onderhouden en beheren van drinkwaterinfrastructuur, met inachtneming van
      [artikel 7, eerste lid, aanhef en onder b, van de Drinkwaterwet][ref1] en uitsluitend in overeenstemming met en
      onder verantwoordelijkheid van een drinkwaterbedrijf als bedoeld in [artikel 1 van de Drinkwaterwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel1
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '1'
  - number: 3.19.2.f
    text: |-
      handelingen of activiteiten die betrekking hebben op het aanleggen, onderhouden en beheren van infrastructuur ten
      behoeve van telecommunicatie en het transport van data via die infrastructuur.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.3
    text: |-
      Een infrastructuurbedrijf dat deel uitmaakt van een infrastructuurgroep waarvan een transmissiesysteembeheerder
      voor elektriciteit deel uitmaakt, mag handelingen en activiteiten verrichten met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.3.a
    text: het aanleggen, onderhouden en beheren van interconnectorsystemen en het transport via die interconnectorsystemen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.3.b
    text: garanties van oorsprong.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.4
    text: |-
      Een infrastructuurbedrijf dat deel uitmaakt van een infrastructuurgroep waarvan een transmissiesysteembeheerder
      voor gas deel uitmaakt, mag handelingen en activiteiten verrichten met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.4.a
    text: het aanleggen, onderhouden en beheren van interconnectorsystemen en het transport via die interconnectorsystemen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.4.b
    text: het aanleggen, onderhouden, beheren en exploiteren van LNG- en gasopslagsystemen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.4.c
    text: garanties van oorsprong;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.4.d
    text: |-
      het, in aanvulling op het tweede lid, onderdeel c, deelnemen aan het aanleggen, onderhouden, beheren en exploiteren
      van een geïntegreerde infrastructuur en faciliteiten voor transport en permanente opslag van koolstofdioxide dat
      door één juridische entiteit wordt aangestuurd;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.4.e
    text: |-
      het aanleggen, onderhouden, beheren en exploiteren van waterstofopslagfaciliteiten, waterstofterminals en andere
      infrastructuur voor de invoer, uitvoer, doorvoer, omzetting of overslag van waterstofgas of waterstofdragers;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.4.f
    text: |-
      het, in aanvulling op het tweede lid, onderdeel c, aanleggen, onderhouden, beheren en exploiteren van een CO-
      terminal.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.5
    text: |-
      Een infrastructuurbedrijf dat deel uitmaakt van een infrastructuurgroep waarvan een transmissie- of
      distributiesysteembeheerder voor elektriciteit deel uitmaakt, mag handelingen en activiteiten verrichten met
      betrekking tot het aanleggen en beheren van antenne-opstelpunten ten behoeve van ethercommunicatie.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.6
    text: |-
      Indien een infrastructuurbedrijf een productie-installatie voor elektriciteit, gas, waterstofgas,
      gas uit hernieuwbare bronnen of andere gasvormige stoffen uit hernieuwbare bronnen dan gas, of een
      elektriciteitsopslagfaciliteit ter beschikking stelt aan een derde als bedoeld in het tweede lid, onderdeel a,
      onder 2o, of het tweede lid, onderdeel b, onder 1ao, dan meldt hij dit aan de Autoriteit Consument en Markt en
      verstrekt daarbij de voor die terbeschikkingstelling geldende afspraken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.19.7
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de procedure voor de melding, bedoeld in het
      zesde lid, of de informatie die daarbij moet worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.19
  - number: 3.20.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen andere aan energie-infrastructuur gerelateerde handelingen
      of activiteiten worden toegestaan die een infrastructuurbedrijf voor een bij of krachtens deze maatregel vast te
      stellen periode van maximaal tien jaar kan verrichten, indien deze handelingen of activiteiten niet zijn gelegen op
      het gebied van productie, levering of handel van energiedragers.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.20
  - number: 3.20.2
    text: |-
      Indien handelingen of activiteiten op grond van het eerste lid worden aangewezen, worden bij of krachtens algemene
      maatregel van bestuur regels gesteld over de voortzetting of beëindiging van die handelingen of activiteiten.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.20
  - number: 3.21.1
    text: |-
      Een infrastructuurbedrijf houdt, buiten de aandelen in een transmissie- of distributiesysteembeheerder, geen
      aandelen in een rechtspersoon die in Nederland andere activiteiten verricht dan de handelingen of activiteiten die
      op grond van [artikel 3.19][ref1] of krachtens [artikel 3.20][ref2] zijn toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.21.2
    text: |-
      Een infrastructuurbedrijf neemt, buiten de deelname in een transmissie- of distributiesysteembeheerder, niet deel
      aan een vennootschap die in Nederland andere activiteiten verricht dan de handelingen of activiteiten die op grond
      van [artikel 3.19][ref1] of krachtens [artikel 3.20][ref2] zijn toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.21.3
    text: |-
      Indien een infrastructuurbedrijf aandelen houdt in, of deelneemt aan een aangewezen warmtebedrijf als bedoeld in
      [artikel 1.1 van de Wet collectieve warmte][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0052212#Artikel1
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0052212
        artikel: '1'
  - number: 3.21.3.a
    text: |-
      bevatten de statuten van het warmtebedrijf de bepaling dat de leden van het bestuur en de meerderheid van de leden
      van de raad van commissarissen geen statutaire bestuurder zijn van de transmissie- of distributiesysteembeheerder
      binnen de infrastructuurgroep waar het infrastructuurbedrijf deel van uitmaakt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.21
  - number: 3.21.3.b
    text: |-
      neemt het infrastructuurbedrijf bij zijn handelen als aandeelhouder of deelnemer een evenwichtige afweging tussen
      de belangen van het warmtebedrijf en van de infrastructuurgroep in acht;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.21
  - number: 3.21.3.c
    text: |-
      is in geval het warmtebedrijf zelf geen deel uitmaakt van de infrastructuurgroep, het bepaalde bij of krachtens
      artikel 3.22 van overeenkomstige toepassing;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.21
  - number: 3.21.3.d
    text: |-
      stelt de transmissie- of distributiesysteembeheerder binnen de infrastructuurgroep geen zekerheid ten behoeve van
      het warmtebedrijf, noch maakt het zich op andere wijze sterk of verbindt het zich hoofdelijk of anderszins naast of
      voor het warmtebedrijf.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.21
  - number: 3.21.4
    text: |-
      Het derde lid is van overeenkomstige toepassing op een infrastructuurbedrijf dat werkzaamheden als bedoeld in
      [artikel 2.13, vijfde lid, van de Wet collectieve warmte][ref1] verricht voor een aangewezen warmtebedrijf als
      bedoeld in [artikel 1.1 van de Wet collectieve warmte][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0052212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0052212#Artikel1
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0052212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0052212
        artikel: '1'
  - number: 3.21.5
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het derde lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.21
  - number: 3.22.1
    text: |-
      Een transmissie- of distributiesysteembeheerder bevoordeelt niet de infrastructuurbedrijven waarmee hij een
      infrastructuurgroep vormt boven andere ondernemingen en kent die bedrijven ook anderszins geen voordelen toe die
      verder gaan dan in het normale handelsverkeer gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.22
  - number: 3.22.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen handelingen worden aangemerkt als handelingen die voordelen
      genereren die verder gaan dan in het normale handelsverkeer gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.22
  - number: 3.23.1
    text: |-
      De transmissiesysteembeheerder voor elektriciteit die krachtens [artikel 3.2, eerste lid, onderdeel a][ref1],
      is aangewezen, is uit dien hoofde belast met de taken en verplichtingen die bij of krachtens [verordening
      2019/943](32843R2019), of andere bindende EU-rechtshandelingen op het gebied van elektriciteit aan
      transmissiesysteembeheerders voor elektriciteit zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.23.2
    text: |-
      Een transmissiesysteembeheerder voor elektriciteit stelt op zijn systeem beschikbare zoneoverschrijdende capaciteit
      ter beschikking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.23
  - number: 3.23.3
    text: |-
      De transmissiesysteembeheerder voor gas die krachtens [artikel 3.2, eerste lid, onderdeel c][ref1], is aangewezen,
      is uit dien hoofde belast met de taken en verplichtingen die bij of krachtens [verordening 715/2009](32009R0715),
      of andere bindende EU-rechtshandelingen op het gebied van gas, aan transmissiesysteembeheerders voor gas zijn
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.23.4
    text: |-
      Een distributiesysteembeheerder voor elektriciteit die krachtens [artikel 3.2, eerste lid, onderdeel e][ref1],
      is aangewezen, is uit dien hoofde belast met de taken en verplichtingen die bij of krachtens [verordening
      2019/943](32843R2019), of andere bindende EU-rechtshandelingen op het gebied van elektriciteit aan
      distributiesysteembeheerders voor elektriciteit zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.23.5
    text: |-
      Een distributiesysteembeheerder voor gas die krachtens [artikel 3.2, eerste lid, onderdeel f][ref1], is aangewezen,
      is uit dien hoofde belast met de taken en verplichtingen die bij of krachtens [verordening 715/2009](32009R0715),
      of andere bindende EU-rechtshandelingen op het gebied van gas aan distributiesysteembeheerders voor gas zijn
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.23.6
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van bindende EU-rechtshandelingen op het gebied van elektriciteit
      of gas, taken of verplichtingen aan een transmissie- of distributiesysteembeheerder worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.23
  - number: 3.24.1
    text: |-
      Een transmissie- of distributiesysteembeheerder handelt bij de uitoefening van zijn wettelijke taken of
      verplichtingen redelijk, transparant en niet discriminerend.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.24
  - number: 3.24.2
    text: |-
      Transmissie- en distributiesysteembeheerders werken bij de uitoefening van hun wettelijke taken of verplichtingen
      samen en verstrekken elkaar de gegevens die nodig zijn voor de uitvoering van hun wettelijke taken of
      verplichtingen of die nodig zijn ter waarborging en stimulering van een effectieve deelname van marktdeelnemers op
      de gas- en elektriciteitsmarkt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.24
  - number: 3.24.3
    text: |-
      Een transmissiesysteembeheerder verstrekt buitenlandse transmissiesysteembeheerders de informatie die nodig is om
      de veiligheid, betrouwbaarheid en doelmatigheid, alsmede de samenhangende ontwikkeling en interoperabiliteit van de
      systemen te waarborgen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.24
  - number: 3.24.4
    text: |-
      Bij de uitvoering van zijn wettelijke taken of verplichtingen houdt de transmissiesysteembeheerder voor
      elektriciteit rekening met de door de regionale coördinatiecentra, bedoeld in artikel 2, onderdeel 63, van
      [Verordening 2019/943](32843R2019), opgestelde aanbevelingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.24
  - number: 3.24.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop de samenwerking
      wordt vormgegeven en de informatie die partijen elkaar verstrekken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.24
  - number: 3.25.1
    text: |-
      Een transmissie- of distributiesysteembeheerder waarborgt dat zijn systeem op de korte en lange termijn kan voldoen
      aan een redelijke vraag naar transport van elektriciteit of gas en beheert, onderhoudt en ontwikkelt het systeem,
      onder economische voorwaarden, op zodanige wijze dat de veiligheid, betrouwbaarheid en doelmatigheid van dat
      systeem is gewaarborgd, en met inachtneming van de belangen van het milieu, digitalisering, energie-efficiëntie, de
      transitie naar een duurzaam energiesysteem en de werking van de Europese interne markt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.25
  - number: 3.25.2
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit neemt bij de ontwikkeling van het systeem in
      overweging of de inkoop van congestiebeheers- of systeembeheersdiensten verzwaring van het systeem kan voorkomen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.25
  - number: 3.25.3
    text: |-
      Als een transmissie- of distributiesysteembeheerder op verzoek en ten behoeve van een partij, die niet handelt in
      de hoedanigheid van aangeslotene of netgebruiker, werkzaamheden uitvoert in het kader van het beheer, het onderhoud
      of de ontwikkeling van zijn systeem, kan hij de redelijke kosten daarvoor in rekening brengen bij de verzoeker.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.25
  - number: 3.25.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de invulling van de taak,
      bedoeld in het eerste tot en met derde lid, en de wijze waarop uitvoering wordt gegeven aan het eerste tot en met
      derde lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.25
  - number: 3.26.1
    text: |-
      De transmissiesysteembeheerder voor elektriciteit ontwerpt het transmissiesysteem voor elektriciteit zodanig en
      houdt het zodanig in werking dat het transport van elektriciteit ook verzekerd is als zich een uitvalsituatie
      voordoet, in vol bedrijf, en ten tijde van onderhoud, tenzij:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.26
  - number: 3.26.1.a
    text: het aansluitingen betreft;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.26
  - number: 3.26.1.b
    text: bij algemene maatregel van bestuur voor een bepaalde uitvalsituatie vrijstelling is verleend;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.26
  - number: 3.26.1.c
    text: |-
      voor een specifiek onderdeel van het systeem op aanvraag van de transmissiesysteembeheerder ontheffing is verleend
      door de Autoriteit Consument en Markt. Aan de ontheffing kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.26
  - number: 3.26.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de verlening, wijziging en intrekking
      van een ontheffing als bedoeld in het eerste lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.26
  - number: 3.27.1
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit verplaatst op verzoek van een college van
      burgemeester en wethouders of van gedeputeerde staten bovengrondse delen van systemen die bestemd zijn voor
      transport van elektriciteit op een spanningsniveau van 50 kilovolt of hoger of vervangt deze door ondergrondse
      delen indien deze door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.27
  - number: 3.27.2
    text: Een aanwijzing als bedoeld in het eerste lid wordt bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.27
  - number: 3.27.3
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit onderzoekt op verzoek van een college van
      burgemeester en wethouders of van gedeputeerde staten de technische haalbaarheid, de ruimtelijke aspecten en de
      investeringskosten van het verplaatsen of vervangen van een deel van het systeem dat op grond van het eerste lid
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.27
  - number: 3.27.4
    text: |-
      Onze Minister kan op aanvraag van een transmissie- of distributiesysteembeheerder voor elektriciteit ontheffing
      verlenen van de verplichting op grond van het eerste lid voor een in die ontheffing aangewezen deel van het
      systeem, indien het vervangen of verplaatsen van dat deel technisch of ruimtelijk niet haalbaar is of strijdig is
      met het belang van leveringszekerheid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.27
  - number: 3.27.5
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.27
  - number: 3.27.5.a
    text: de kenmerken van de systeemonderdelen die kunnen worden aangewezen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.27
  - number: 3.27.5.b
    text: de voorwaarden voor vervanging of verplaatsing;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.27
  - number: 3.27.5.c
    text: de procedure voor de aanwijzing;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.27
  - number: 3.27.5.d
    text: |-
      het deel van de kosten die een transmissie- of distributiesysteembeheerder voor elektriciteit maakt voor de
      uitvoering van een verzoek als bedoeld in het eerste en derde lid dat wordt betaald door de verzoeker en de
      bestanddelen waaruit die kosten bestaan;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.27
  - number: 3.27.5.e
    text: de volgorde waarin het verplaatsen of vervangen plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.27
  - number: 3.27.5.f
    text: de procedure voor de aanvraag van een ontheffing als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.27
  - number: 3.28.1
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit koopt niet-frequentiegerelateerde ondersteunende
      diensten in en doet dit volgens transparante, niet-discriminerende en marktgebaseerde procedures die deelname van
      alle in aanmerking komende marktdeelnemers faciliteren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.28
  - number: 3.28.2
    text: |-
      Het eerste lid is niet van toepassing op niet-frequentiegerelateerde ondersteunende diensten die een transmissie-
      of distributiesysteembeheerder voor elektriciteit zelf uitvoert met gebruikmaking van een volledig geïntegreerde
      netwerkcomponent.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.28
  - number: 3.28.3
    text: |-
      De Autoriteit Consument en Markt kan op verzoek van een distributie- of transmissiesysteembeheerder voor
      elektriciteit ten aanzien van een specifieke niet-frequentie-ondersteunende dienst een ontheffing verlenen van de
      verplichting, bedoeld in het eerste lid, als de Autoriteit Consument en Markt van oordeel is dat de marktgebaseerde
      inkoop van die dienst economisch niet efficiënt is.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.28
  - number: 3.28.4
    text: De Autoriteit Consument en Markt kan voorschriften en beperkingen verbinden aan een ontheffing.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.28
  - number: 3.29.1
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit koopt congestiebeheers- of
      systeembeheersdiensten, niet zijnde redispatching als bedoeld in artikel 2, onderdeel 26, van [verordening
      2019/943](32843R2019), aan volgens transparante, niet-discriminerende en marktgebaseerde procedures die deelname
      van alle in aanmerking komende marktdeelnemers faciliteren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.29
  - number: 3.29.2
    text: |-
      Ten aanzien van de aankoop van congestiebeheers- of systeembeheersdiensten kan de Autoriteit Consument en Markt een
      distributie- of transmissiesysteembeheerder voor elektriciteit op verzoek een ontheffing verlenen van het eerste
      lid, als de Autoriteit Consument en Markt van oordeel is dat de marktgebaseerde inkoop economisch niet efficiënt is
      of dat een dergelijk aankoop zou leiden tot ernstige marktverstoringen of meer congestie.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.29
  - number: 3.29.3
    text: |-
      De Autoriteit Consument en Markt kan voorschriften en beperkingen verbinden aan een ontheffing als bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.29
  - number: 3.29.4
    text: |-
      Met het oog op de uitvoering van het eerste lid, worden in de methoden of voorwaarden, bedoeld in
      [artikel 3.119][ref1], ten minste opgenomen de specificaties voor het inkopen van congestiebeheers- of
      systeembeheersdiensten en, indien van toepassing, gestandaardiseerde marktproducten voor deze diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.30.1
    text: Een transmissie- of distributiesysteembeheerder treft doelmatige maatregelen om systeemverliezen te minimaliseren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.30
  - number: 3.30.2
    text: |-
      Een transmissie- of distributiesysteembeheerder koopt elektriciteit of gas ter dekking van zijn systeemverliezen
      in volgens transparante, niet-discriminerende en marktgebaseerde procedures die deelname van alle in aanmerking
      komende marktdeelnemers faciliteren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.30
  - number: 3.30.3
    text: |-
      Een transmissie- of distributiesysteembeheerder is verantwoordelijk voor de onbalans die het gevolg is van
      systeemverliezen binnen zijn systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.30
  - number: '3.31'
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit bezit, ontwikkelt, beheert of exploiteert geen
      elektriciteitsopslagfaciliteit, tenzij:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.31
  - number: 3.31.a
    text: |-
      het gaat om een deel van een transmissie- of distributiesysteem dat de Autoriteit Consument en Markt op verzoek
      van een transmissie- of distributiesysteembeheerder krachtens [artikel 3.32][ref1] heeft erkend als volledig
      geïntegreerde netwerkcomponent; of


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.31.b
    text: |-
      de Autoriteit Consument en Markt op verzoek van een transmissie- of distributiesysteembeheerder krachtens
      [artikel 3.33][ref1] ten aanzien van een specifieke elektriciteitsopslagfaciliteit een ontheffing heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.32.1
    text: |-
      De Autoriteit Consument en Markt erkent op aanvraag van een transmissie- of distributiesysteembeheerder voor
      elektriciteit een elektriciteitsopslagfaciliteit als volledig geïntegreerde netwerkcomponent als het voldoet aan de
      volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.32
  - number: 3.32.1.a
    text: het voldoet aan de eigenschappen van een volledig geïntegreerde netwerkcomponent; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.32
  - number: 3.32.1.b
    text: geschikt is voor het opslaan van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.32
  - number: 3.32.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de aanvraag en de informatie die daarbij moet worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.32
  - number: 3.33.1
    text: |-
      De Autoriteit Consument en Markt kan op verzoek van een transmissie- of distributiesysteembeheerder voor
      elektriciteit ten aanzien van een specifieke elektriciteitsopslagfaciliteit een ontheffing verlenen als is voldaan
      aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.33
  - number: 3.33.1.a
    text: |-
      de transmissie- of distributiesysteembeheerder heeft de faciliteit nodig voor de nakoming van de taak, bedoeld
      in [artikel 3.25][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.33.1.b
    text: |-
      de transmissie- of distributiesysteembeheerder gebruikt de faciliteit niet om elektriciteit of een andere
      energiedrager te kopen of te verkopen; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.33
  - number: 3.33.1.c
    text: |-
      de transmissie- of distributiesysteembeheerder heeft aangetoond dat marktpartijen de faciliteit niet tegen
      redelijke kosten of binnen een redelijke termijn kunnen bieden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.33
  - number: 3.33.2
    text: 'De Autoriteit Consument en Markt:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.33
  - number: 3.33.2.a
    text: |-
      kan een leidraad opstellen voor een billijke aanbestedingsprocedure voor een elektriciteitsopslagfaciliteit als
      bedoeld in het eerste lid, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.33
  - number: 3.33.2.b
    text: kan voorschriften en beperkingen verbinden aan een ontheffing als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.33
  - number: 3.33.2.c
    text: |-
      doet mededeling aan de Europese Commissie en aan Acer van een ontheffing als bedoeld in het eerste lid die is
      verleend aan een transmissiesysteembeheerder voor elektriciteit;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.33
  - number: 3.33.2.d
    text: |-
      houdt ten minste eens in de vijf jaar een openbare raadpleging over elektriciteitsopslagfaciliteiten waarvoor
      een ontheffing is verleend, om de potentiële beschikbaarheid en belangstelling om in dergelijke faciliteiten te
      investeren, te evalueren; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.33
  - number: 3.33.2.e
    text: |-
      trekt een ontheffing in als uit de evaluatie, bedoeld in onderdeel c, is gebleken dat marktpartijen in staat
      zijn dergelijke elektriciteitsopslagfaciliteiten op een kosteneffectieve manier te bezitten, te ontwikkelen, te
      exploiteren of te beheren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.33
  - number: 3.33.3
    text: |-
      In een besluit tot intrekking van een ontheffing als bedoeld in het tweede lid, onderdeel c, wordt aan de
      transmissie- of distributiesysteembeheerder een termijn van ten hoogste achttien maanden gesteld om het gebruik van
      de elektriciteitsopslagfaciliteit te beëindigen, tenzij deze krachtens [artikel 3.32][ref1] is erkend als volledig
      geïntegreerde netwerkcomponent.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.34.1
    text: Een transmissie- of distributiesysteembeheerder stelt periodiek een investeringsplan op.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.34
  - number: 3.34.2
    text: 'In een investeringsplan is ten minste opgenomen:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.34
  - number: 3.34.2.a
    text: |-
      een beschrijving en onderbouwing van de noodzakelijke uitbreidingsinvesteringen en vervangingsinvesteringen gelet
      op [artikel 3.25, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.34.2.b
    text: |-
      een beschrijving en onderbouwing van de congestiebeheers- of systeembeheersdiensten die de transmissie- of
      distributiesysteembeheerder voor elektriciteit zal inkopen om verzwaring van het systeem te voorkomen als bedoeld
      in [artikel 3.25, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.34.2.c
    text: |-
      een beschrijving en onderbouwing van de uitvoering van de investeringen, bedoeld in onderdeel a, waaronder de
      volgorde van uitvoering van de noodzakelijke uitbreidingsinvesteringen en factoren die vertraging in de uitvoering
      van een investering kunnen veroorzaken, en de inkoop van diensten, bedoeld in onderdeel b, voor de termijn waarvoor
      het investeringsplan geldt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.34
  - number: 3.34.3
    text: |-
      Bij de beschrijving en onderbouwing van de uitbreidingsinvesteringen en vervangingsinvesteringen, bedoeld in het
      tweede lid, onderdeel a, zijn ten minste opgenomen de investeringen:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.34
  - number: 3.34.3.a
    text: |-
      waarvoor een projectbesluit als bedoeld in [afdeling 5.2 de Omgevingswet][ref1] is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 3.34.3.b
    text: |-
      voor de ontsluiting van windparken, die zijn opgenomen in een programma als bedoeld in
      [afdeling 3.2 de Omgevingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling3.2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '3.2'
  - number: 3.34.3.c
    text: |-
      ter uitvoering van het ontwikkelkader, bedoeld in [artikel 3.83][ref1], en de daarvoor benodigde aanleg
      of uitbreiding van systeemkoppelingen tussen het transmissiesysteem voor elektriciteit op zee en het
      transmissiesysteem voor elektriciteit;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
  - number: 3.34.3.d
    text: |-
      die zijn opgenomen in een meerjarenprogramma infrastructuur energie en klimaat gericht op de energie- en
      klimaatdoelen uit het nationale energie- en klimaatplan, bedoeld in [verordening 2018/1999](31999R2018), en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.34
  - number: 3.34.3.e
    text: |-
      die nodig zijn om de aanbiedingen te doen als bedoeld in [artikel 3.38, derde lid][ref1], [3.40, vierde lid][ref2],
      [artikel 3.46, tweede lid][ref3], en [3.47, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.4
        afdeling: '3.3'
      - id: ref4
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.4
        afdeling: '3.3'
  - number: 3.35.1
    text: |-
      Een transmissie- of distributiesysteembeheerder legt een ontwerpinvesteringsplan voor aan eenieder ter consultatie
      en aan Onze Minister ten behoeve van het onderzoek bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.35
  - number: 3.35.2
    text: |-
      Onze Minister onderzoekt of het ontwerpinvesteringsplan van een transmissie- of distributiesysteembeheerder
      voldoende rekenschap geeft van:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.35
  - number: 3.35.2.a
    text: |-
      de krachtens [artikel 3.36, eerste lid, onderdeel f][ref1], vastgestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.35.2.b
    text: |-
      indien het een investeringsplan van een transmissiesysteembeheerder betreft, het ingevolge [verordening 2018/1999]
      (31999R2018) opgestelde nationale energie- en klimaatplan; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.35
  - number: 3.35.2.c
    text: |-
      indien het een transmissiesysteembeheerder voor elektriciteit betreft, het ingevolge artikel 15 van [verordening
      2019/943](32843R2019) vastgestelde actieplan.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.35
  - number: 3.35.3
    text: |-
      Een transmissie- of distributiesysteembeheerder verwerkt de consultatiereacties en de bevindingen van Onze Minister
      in het ontwerpinvesteringsplan en legt het ontwerpinvesteringsplan vervolgens ter toetsing voor aan de Autoriteit
      Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.35
  - number: 3.35.4
    text: |-
      De Autoriteit Consument en Markt toetst of een ontwerpinvesteringsplan voldoet aan de bij of krachtens
      de [artikelen 3.34 tot en met 3.36][ref1] gestelde eisen, waaronder of geen sprake is van overinvestering
      of onderinvestering in het licht van de taak, bedoeld in [artikel 3.25][ref2] en of de transmissie- of
      distributiesysteembeheerder in redelijkheid tot het ontwerpinvesteringsplan heeft kunnen komen. De Autoriteit
      Consument en Markt betrekt hierbij tevens de bevindingen van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: 3.35.5
    text: |-
      Een transmissie- of distributiesysteembeheerder stelt het investeringsplan vast na ontvangst van de
      toetsingsresultaten van de Autoriteit Consument en Markt en verantwoordt daarbij hoe deze toetsingsresultaten zijn
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.35
  - number: 3.35.6
    text: |-
      Een transmissie- of distributiesysteembeheerder voert de in het investeringsplan opgenomen investeringen en de
      inkoop van congestiebeheers- of systeembeheersdiensten uit conform het investeringsplan.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.35
  - number: 3.36.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.36.1.a
    text: de termijn waarvoor het investeringsplan geldt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.36.1.b
    text: de nadere inhoud en het aggregatieniveau van een investeringsplan;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.36.1.c
    text: de procedure waarlangs een investeringsplan tot stand komt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.36.1.d
    text: de wijze waarop de noodzaak van investeringen wordt beschreven en onderbouwd;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.36.1.e
    text: de wijze waarop de uitvoering van de investeringen wordt beschreven en onderbouwd;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.36.1.f
    text: |-
      de wijze waarop de volgorde van de uitvoering van de noodzakelijke uitbreidingsinvesteringen wordt bepaald, daarbij
      rekening houdend met het maatschappelijk belang van de investeringen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.36.1.g
    text: |-
      het tijdstip en de frequentie waarmee een investeringsplan dan wel onderdelen daarvan, wordt opgesteld dan wel
      aangepast;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.36.1.h
    text: de wijze waarop en bij wie een ontwerpinvesteringsplan wordt geconsulteerd;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.36.1.i
    text: de wijze waarop bekendheid wordt gegeven aan een investeringsplan;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.36.1.j
    text: |-
      de procedure waarlangs en de wijze waarop het ontwerpinvesteringsplan door de Autoriteit Consument en Markt wordt
      getoetst.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.36.2
    text: |-
      De regels, bedoeld in het eerste lid, kunnen in ieder geval verschillen voor verschillende systemen, verschillende
      delen van systemen met een verschillend spannings- of drukniveau en verschillende systeembeheerders.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.36
  - number: 3.37.1
    text: |-
      De Autoriteit Consument en Markt stelt, met inachtneming van een voorstel van de transmissie- en
      distributiesysteembeheerders voor elektriciteit respectievelijk gas, voor ieder van deze systeembeheerders een
      gebied vast waarbinnen de betreffende systeembeheerder de taak, bedoeld in [artikel 3.38, eerste lid][ref1],
      respectievelijk [3.40, eerste lid][ref2], verricht. De Autoriteit Consument en Markt kan daarbij tevens vaststellen
      in welke omstandigheden en onder welke voorwaarden een distributiesysteembeheerder deze taak mag verrichten in een
      aangrenzend gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.37
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.37.2
    text: |-
      De Autoriteit Consument en Markt publiceert een besluit als bedoeld in het eerste lid op een voor eenieder kenbare
      en toegankelijke wijze.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.37
  - number: 3.38.1
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit doet in het voor hem krachtens
      [artikel 3.37, eerste lid][ref1], vastgestelde gebied op verzoek een aanbod tot:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.38.1.a
    text: |-
      aanleg van een aansluiting op zijn systeem op een voor die aansluiting geschikt punt met een voor die aansluiting
      geschikt spanningsniveau; of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.38
  - number: 3.38.1.b
    text: wijziging van een aansluiting op zijn systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.38
  - number: 3.38.2
    text: |-
      De transmissie- of distributiesysteembeheerder doet een aanbod als bedoeld in het eerste lid binnen een redelijke
      termijn en realiseert een aansluiting binnen een redelijke termijn na aanvaarding van het aanbod.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.38
  - number: 3.38.3
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit kan het doen van een aanbod als bedoeld in
      het eerste lid, weigeren indien en voor zo lang er voor de verzochte aansluiting onvoldoende transportcapaciteit
      beschikbaar is op zijn systeem. De transmissie- of distributiesysteembeheerder neemt passende maatregelen,
      waaronder de benodigde uitbreidingsinvesteringen, om zo spoedig mogelijk alsnog een aanbod te doen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.38
  - number: 3.38.4
    text: |-
      Het eerste lid is niet van toepassing in bij algemene maatregel van bestuur aangewezen situaties waarin een
      transmissie- of distributiesysteem voor elektriciteit niet op economische voorwaarden kan worden beheerd,
      ontwikkeld en onderhouden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.38
  - number: 3.38.5
    text: |-
      Met het oog op de uitvoering van het derde lid wordt in de methoden of voorwaarden, bedoeld in
      [artikel 3.119][ref1], in ieder geval opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.38.5.a
    text: |-
      de wijze waarop een transmissie- of distributiesysteembeheerder voor elektriciteit bepaalt en onderbouwt dat voor
      de verzochte aansluiting onvoldoende transportcapaciteit beschikbaar is op zijn systeem en de informatie die hij
      daarover aan de verzoeker verschaft;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.38
  - number: 3.38.5.b
    text: |-
      de informatie die een transmissie- of distributiesysteembeheerder aan de verzoeker verschaft over de maatregelen
      die hij neemt om de transportcapaciteit op zijn systeem uit te breiden om een aanbod op het verzoek te kunnen doen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.38
  - number: 3.38.5.c
    text: |-
      de informatie die een transmissie- of distributiesysteembeheerder aan de verzoeker verschaft over redelijkerwijs
      beschikbare alternatieven voor de verzochte aansluiting.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.38
  - number: 3.39.1
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit doet op verzoek en met het oog op het
      realiseren van een aansluiting op zijn systeem een aanbod tot koppeling met zijn systeem van een door de verzoeker
      aangelegde leiding en daarmee verbonden hulpmiddelen, mits de leidingen en hulpmiddelen voldoen aan de voorafgaand
      aan de aanleg door de transmissie- of distributiesysteembeheerder gestelde technische vereisten waardoor de
      betrouwbaarheid van het door de transmissie- of distributiesystembeheerder beheerde systeem gewaarborgd blijft en:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.39
  - number: 3.39.1.a
    text: de te realiseren aansluiting een minimale aansluitwaarde heeft van 2,3 MVA; of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.39
  - number: 3.39.1.b
    text: |-
      de verzoeker een organisatorische eenheid is, die zich in hoofdzaak bezig houdt met openbaar vervoer per trein,
      tram, of trolley, met mijnbouwkundige activiteiten, met het beheer en de exploitatie van telecommunicatie- en
      kabelnetwerken, met het beheer van openbare verlichting of van verkeersregelinstallaties, dan wel met riolering,
      bemaling, waterzuivering of transport en distributie van water waarbij deze eenheid ingevolge de technische aard
      van de bedrijfsuitoefening beschikt over verscheidene aansluitingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.39
  - number: 3.39.2
    text: |-
      Met de koppeling, bedoeld in het eerste lid, worden de door de verzoeker aangelegde leiding en daarmee verbonden
      hulpmiddelen onderdeel van het transmissie- of distributiesysteem voor elektriciteit en wordt de transmissie-
      of distributiesysteembeheerder voor elektriciteit beschouwd als de bevoegde aanlegger hiervan als bedoeld in
      [artikel 20, tweede lid, van Boek 5 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel20
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '20'
  - number: 3.39.3
    text: |-
      [Artikel 3.38, derde lid][ref1], is van overeenkomstige toepassing op het doen van een aanbod, bedoeld in het
      eerste lid, met dien verstande dat voor «aansluiting» wordt gelezen «met koppeling te realiseren aansluiting».


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.39.4
    text: |-
      Met het oog op de uitvoering van het eerste lid worden in de methoden of voorwaarden, bedoeld in
      [artikel 3.119][ref1], in ieder geval opgenomen de voorwaarden waaraan een aangelegde leiding en daarmee verbonden
      hulpmiddelen als bedoeld in het eerste lid moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.40.1
    text: |-
      Een transmissie- of distributiesysteembeheerder voor gas doet in het voor hem krachtens
      [artikel 3.37, eerste lid][ref1], vastgestelde gebied op verzoek een aanbod tot:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.40.1.a
    text: |-
      aanleg van een aansluiting op zijn systeem op een voor die aansluiting geschikt punt met een voor die aansluiting
      geschikt drukniveau; of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
  - number: 3.40.1.b
    text: wijziging van een aansluiting op zijn systeem, anders dan het omschakelen van die aansluiting.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
  - number: 3.40.2
    text: |-
      De transmissie- of distributiesysteembeheerder doet een aanbod als bedoeld in het eerste lid, binnen een redelijke
      termijn en realiseert de aansluiting binnen een redelijke termijn na aanvaarding van het aanbod.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
  - number: 3.40.3
    text: 'Het eerste lid is niet van toepassing indien het verzoek ziet op:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
  - number: 3.40.3.a
    text: |-
      de aanleg van een kleine aansluiting voor het onttrekken van gas aan het transmissie- of distributiesysteem
      voor gas ten behoeve van een te bouwen bouwwerk waarvan niet reeds op 1 juli 2018 een vergunning als bedoeld
      in [artikel 2.1, eerste lid, onderdeel a, de Wet algemene bepalingen omgevingsrecht][ref1] was afgegeven of een
      bouwwerk dat na 1 januari 2015 zonder aansluiting op het distributiesysteem voor gas is gerealiseerd, tenzij een
      college van burgemeester en wethouders het gebied waarin dit bouwwerk wordt of is gebouwd heeft aangewezen als
      gebied waar aansluiting op het distributiesysteem voor gas strikt noodzakelijk is om zwaarwegende redenen van
      algemeen belang;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 3.40.3.b
    text: |-
      een aansluiting voor het onttrekken van laagcalorisch gas aan het transmissie- of distributiesysteem voor
      gas ten behoeve van een installatie die onderling technische, organisatorische of functionele bindingen
      heeft met en in de onmiddellijke nabijheid is gelegen van een installatie die als gevolg van het verbod in
      [artikel 2.62, eerste lid][ref1], niet meer is aangesloten op dat deel van zijn systeem waarmee laagcalorisch gas
      wordt getransporteerd;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
  - number: 3.40.3.c
    text: |-
      de aanleg van een aansluiting voor het onttrekken van gas aan het transmissie- of distributiesysteem in bij
      algemene maatregel van bestuur aangewezen situaties waarin een transmissie- of distributiesysteem voor gas niet op
      economische voorwaarden kan worden ontwikkeld, beheerd en onderhouden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
  - number: 3.40.4
    text: |-
      Een transmissie- of distributiesysteembeheerder voor gas kan het doen van een aanbod als bedoeld in het eerste
      lid weigeren indien er voor de verzochte aansluiting op grond van objectieve en technische criteria aantoonbaar
      onvoldoende capaciteit beschikbaar is, tenzij de verzoeker een producent is van gas uit hernieuwbare bronnen en het
      op grond van bij algemene maatregel van bestuur aan te wijzen criteria economisch verantwoord is om de capaciteit
      uit te breiden voor de verzochte aansluiting.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
  - number: 3.40.5
    text: |-
      Met het oog op de uitvoering van het vierde lid, wordt in de methoden of voorwaarden, bedoeld in
      [artikel 3.119][ref1], in ieder geval opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.40.5.a
    text: |-
      de wijze waarop een transmissie- of distributiesysteembeheerder voor gas bepaalt en onderbouwt dat voor de
      verzochte aansluiting onvoldoende capaciteit beschikbaar is en de informatie die hij daarover aan de verzoeker
      verschaft;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
  - number: 3.40.5.b
    text: |-
      de informatie die een transmissie- of distributiesysteembeheerder voor gas aan de verzoeker verschaft over de
      maatregelen die hij neemt om de capaciteit uit te breiden om een aanbod op het verzoek te kunnen doen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.40
  - number: 3.41.1
    text: |-
      Een transmissie- of distributiesysteembeheerder doet op verzoek een aanbod om een aansluiting in werking te
      stellen, in gebruik te geven, te beheren en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.41
  - number: 3.41.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de gevallen waarin een transmissie-
      of distributiesysteembeheerder:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.41
  - number: 3.41.2.a
    text: |-
      is gehouden een aansluiting buiten werking te stellen vanuit het belang van het goed functioneren van het stelsel
      van leveren, balanceren en meten; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.41
  - number: 3.41.2.b
    text: is gehouden een aansluiting te verwijderen na beëindiging van de aansluitovereenkomst.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.41
  - number: 3.41.3
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.41
  - number: 3.41.3.a
    text: |-
      de procedure die een transmissie- of distributiesysteembeheerder doorloopt voordat hij overgaat tot
      buitenwerkingstellen of verwijderen van een aansluiting;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.41
  - number: 3.41.3.b
    text: |-
      de informatie die een transmissie- of distributiesysteembeheerder voorafgaand aan een buitenwerkingstelling of
      verwijdering aan een aangeslotene verstrekt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.41
  - number: 3.42.1
    text: |-
      Een college van burgemeester en wethouders kan gebieden aanwijzen waar de taak voor een distributiesysteembeheerder
      voor gas als bedoeld in [artikel 3.40][ref1] niet geldt voor kleine aansluitingen voor het onttrekken van
      gas indien zich in dat gebied een andere energie-infrastructuur bevindt die kan voorzien in de verwachte
      warmtebehoefte.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.42.2
    text: |-
      Een college van burgemeester en wethouders meldt een besluit als bedoeld in het eerste lid, aan de Autoriteit
      Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.42
  - number: 3.42.3
    text: |-
      Een college van burgemeester en wethouders meldt een besluit als bedoeld in
      [artikel 3.40, derde lid, onderdeel a][ref1], aan de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.42.4
    text: 'De Autoriteit Consument en Markt houdt een register bij van:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.42
  - number: 3.42.4.a
    text: gebieden waarvoor een besluit als bedoeld in het eerste lid geldt; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.42
  - number: 3.42.4.b
    text: |-
      gebieden waarvoor een besluit als bedoeld in [artikel 3.40, derde lid, onderdeel a][ref1], geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
  - number: 3.42.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de melding, bedoeld in het tweede en derde lid, en de
      in het register, bedoeld in het vierde lid, te vermelden gegevens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.42
  - number: 3.43.1
    text: |-
      Een transmissie- of distributiesysteembeheerder stelt voor een aansluiting op zijn systeem de locatie van het
      overdrachtspunt vast, met inachtneming van de redelijke belangen van de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.43
  - number: 3.43.2
    text: |-
      Indien een aansluiting uit meerdere leidingen bestaat stelt de transmissie- of distributiesysteembeheerder per
      leiding de locatie van het overdrachtspunt vast.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.43
  - number: 3.43.3
    text: |-
      De betreffende transmissie- of distributiesysteembeheerders stellen gezamenlijk het overdrachtspunt van een
      systeemkoppeling vast.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.43
  - number: 3.44.1
    text: |-
      Een transmissie- of distributiesysteembeheerder kent ten behoeve van een aansluiting op zijn systeem een primair
      allocatiepunt toe.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.44
  - number: 3.44.2
    text: |-
      Indien krachtens [artikel 2.46, tweede lid, onderdeel a][ref1], is bepaald dat een plaats wordt aangemerkt als een
      additioneel allocatiepunt, kent een transmissie- of distributiesysteembeheerder voor elektriciteit aan die plaats
      een additioneel allocatiepunt toe.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 3.44.3
    text: |-
      Indien een aangeslotene op een transmissie- of distributiesysteem voor elektriciteit meer dan één marktdeelnemer
      contracteert inzake verbruik of invoeding, kent een transmissie- of distributiesysteembeheerder voor elektriciteit
      op verzoek van die aangeslotene een of meerdere additionele allocatiepunten toe.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.44
  - number: 3.45.1
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit geeft een meetverantwoordelijke partij
      toegang tot zijn systeem, voor zover dit noodzakelijk is voor de uitvoering van het bepaalde bij of krachtens
      [artikel 2.48][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.2
        afdeling: '2.5'
  - number: 3.45.2
    text: |-
      Bij ministeriële regeling kan worden bepaald tot welke delen van het systeem een meetverantwoordelijke partij
      toegang moet hebben en kunnen regels worden gesteld aan die toegang.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.45
  - number: 3.46.1
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit doet op verzoek een aanbod tot het verzorgen van
      transport van elektriciteit over zijn systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.46
  - number: 3.46.2
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit kan het doen van een aanbod weigeren, indien en
      voor zo lang er voor het verzochte transport op grond van objectieve en technische criteria aantoonbaar onvoldoende
      transportcapaciteit beschikbaar is op zijn systeem. De transmissie- of distributiesysteembeheerder neemt passende
      maatregelen om zo spoedig mogelijk een aanbod te doen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.46
  - number: 3.46.3
    text: |-
      In de methoden of voorwaarden, bedoeld in [artikel 3.119][ref1], wordt in ieder geval opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.46
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.46.3.a
    text: |-
      met het oog op de uitvoering van het eerste lid, de voorwaarden voor een aanbod van een transmissie- of
      distributiesysteembeheerder voor elektriciteit tot het verzorgen van transport van elektriciteit over zijn systeem
      aan meerdere aangeslotenen gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.46
  - number: 3.46.3.b
    text: |-
      met het oog op de uitvoering van het tweede lid, de wijze waarop een transmissie- of distributiesysteembeheerder
      voor elektriciteit bepaalt en onderbouwt dat onvoldoende transportcapaciteit beschikbaar is op zijn systeem en de
      informatie die hij daarover aan de verzoeker verschaft.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.46
  - number: 3.47.1
    text: |-
      Een transmissie- of distributiesysteembeheerder voor gas doet op verzoek een aanbod tot het verzorgen van transport
      van gas over zijn systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.47
  - number: 3.47.2
    text: |-
      Een transmissie- of distributiesysteembeheerder voor gas kan het doen van een aanbod als bedoeld in het eerste
      lid weigeren indien er voor het verzochte transport op grond van objectieve en technische criteria aantoonbaar
      onvoldoende capaciteit beschikbaar is op zijn systeem, tenzij het verzoek invoeding van gas uit hernieuwbare
      bronnen betreft en het op grond van bij algemene maatregel van bestuur aangewezen criteria economisch verantwoord
      is om de transportcapaciteit uit te breiden voor het verzochte transport.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.47
  - number: 3.47.3
    text: |-
      Met het oog op de uitvoering van het tweede lid, wordt in de methoden of voorwaarden, bedoeld in
      [artikel 3.119][ref1], in ieder geval opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.47
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.47.3.a
    text: |-
      de wijze waarop een transmissie- of distributiesysteembeheerder voor gas bepaalt en onderbouwt dat voor het
      verzochte transport onvoldoende capaciteit beschikbaar is op zijn systeem en de informatie die hij daarover aan de
      verzoeker verschaft;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.47
  - number: 3.47.3.b
    text: |-
      de informatie die een transmissie- of distributiesysteembeheerder voor gas aan de verzoeker verschaft over de
      maatregelen die hij neemt om de capaciteit uit te breiden om een aanbod op het verzoek te kunnen doen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.47
  - number: 3.48.1
    text: 'Een transmissie- of distributiesysteembeheerder voor gas:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.48
  - number: 3.48.1.a
    text: |-
      accepteert op zijn systeem gas dat voldoet aan de invoedspecificaties volgens bij ministeriële regeling gestelde
      regels;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.48
  - number: 3.48.1.b
    text: weert gas op zijn systeem dat niet voldoet aan deze specificaties; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.48
  - number: 3.48.1.c
    text: |-
      draagt er zorg voor dat gas dat op afleverpunten van het systeem wordt afgenomen voldoet aan de
      afleverspecificaties die Onze Minister bij ministeriële regeling vaststelt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.48
  - number: 3.48.2
    text: |-
      De transmissiesysteembeheerder voor gas mengt, bewerkt of behandelt gas dat op zijn systeem wordt ingevoed zo nodig
      teneinde te voldoen aan het eerste lid, aanhef en onderdeel c.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.48
  - number: 3.48.3
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel a, kan een transmissie- of distributiesysteembeheerder de
      invoeding van gas dat voldoet aan de krachtens dat artikellid gestelde invoedspecificaties weigeren, indien die
      invoeding ertoe zou leiden dat de transmissie- of distributiesysteembeheerder voor gas niet in redelijkheid kan
      voldoen aan het eerste lid, aanhef en onderdeel c.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.48
  - number: 3.48.4
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel b, accepteert een transmissiesysteembeheerder voor gas
      op verzoek invoeding van gas dat niet voldoet aan de krachtens het eerste lid, aanhef en onderdeel a, gestelde
      invoedspecificaties, indien hij dit redelijkerwijs en met gebruikmaking van het systeem kan mengen en kan voldoen
      aan het eerste lid, aanhef en onderdeel c.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.48
  - number: 3.48.5
    text: |-
      Een transmissiesysteembeheerder voor gas accepteert op verzoek invoeding van waterstofgas of andere gasvormige
      stoffen dan gas, indien hij dit redelijkerwijs en met gebruikmaking van het systeem kan mengen en kan voldoen aan
      het eerste lid, aanhef en onderdeel c.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.48
  - number: 3.48.6
    text: |-
      De invoedspecificaties en de afleverspecificaties, bedoeld in het eerste lid kunnen in ieder geval verschillen voor
      invoed- en afleverpunten en naar energie-inhoud, drukniveau en regio.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.48
  - number: 3.49.1
    text: 'De transmissiesysteembeheerder voor elektriciteit:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.49
  - number: 3.49.1.a
    text: |-
      treft voorzieningen voor de balancering van het door hem beheerde systeem en alle in Nederland aanwezige en
      onderling verbonden systemen voor elektriciteit; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.49
  - number: 3.49.1.b
    text: |-
      faciliteert balanceringsverantwoordelijken voor elektriciteit om hun verantwoordelijkheid ten aanzien van de balans
      van het systeem uit te voeren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.49
  - number: 3.49.2
    text: |-
      Een distributiesysteembeheerder voor elektriciteit faciliteert de transmissiesysteembeheerder voor elektriciteit
      bij de administratieve afhandeling van de balancering, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.49
  - number: 3.49.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de handelingen van een distributiesysteembeheerder voor
      elektriciteit ter uitvoering van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.49
  - number: 3.49.4
    text: |-
      Als een transmissie- of distributiesysteembeheerder voor elektriciteit een dienst in de vorm van een verandering in
      de elektriciteitsbelasting koopt bij een marktdeelnemer die vraagresponsdiensten levert:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.49
  - number: 3.49.4.a
    text: |-
      past de transmissiesysteembeheerder het elektriciteitsprogramma aan van de balanceringsverantwoordelijke voor
      elektriciteit die actief is op het betreffende allocatiepunt waarvan de flexibiliteit afkomstig is; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.49
  - number: 3.49.4.b
    text: |-
      verrekent de transmissiesysteembeheerder de in het elektriciteitsprogramma aangepaste hoeveelheid elektriciteit
      tussen de marktdeelnemer die vraagresponsdiensten levert en de balanceringsverantwoordelijke voor elektriciteit
      die actief is op het betreffende allocatiepunt waarvan de flexibiliteit afkomstig is conform een door de Autoriteit
      Consument en Markt vast te stellen berekeningsmethode.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.49
  - number: 3.49.5
    text: |-
      Bij de uitvoering van het eerste en tweede lid gebruikt een systeembeheerder voor elektriciteit van aangeslotenen
      met een kleine aansluiting ten hoogste meetgegevens per kwartier en aggregeert bij eerste gelegenheid de
      meetgegevens van de aangeslotenen op zijn systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.49
  - number: 3.50.1
    text: 'De transmissiesysteembeheerder voor gas:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.50
  - number: 3.50.1.a
    text: treft voorzieningen voor de balancering van het door hem beheerde systeem; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.50
  - number: 3.50.1.b
    text: |-
      faciliteert balanceringsverantwoordelijken voor gas om hun verantwoordelijkheid ten aanzien van de balans van het
      systeem uit te voeren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.50
  - number: 3.50.2
    text: |-
      Een distributiesysteembeheerder voor gas faciliteert de transmissiesysteembeheerder voor gas bij de administratieve
      afhandeling van de balancering, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.50
  - number: 3.50.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de handelingen van een distributiesysteembeheerder voor gas
      ter uitvoering van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.50
  - number: 3.50.4
    text: |-
      Een transmissiesysteembeheerder voor gas verschaft een balanceringsverantwoordelijke voor gas actuele en zo correct
      en volledig mogelijke informatie over:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.50
  - number: 3.50.4.a
    text: de mate waarin zijn balanceringsportfolio in evenwicht is; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.50
  - number: 3.50.4.b
    text: de mate waarin het landelijk transportsysteem in evenwicht is.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.50
  - number: 3.50.5
    text: |-
      Bij de uitvoering van het eerste en tweede lid aggregeert een systeembeheerder voor gas bij eerste gelegenheid de
      meetgegevens van de aangeslotenen op zijn systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.50
  - number: 3.51.1
    text: |-
      Een distributiesysteembeheerder stelt aan een aangeslotene met een kleine aansluiting voor elektriciteit of gas,
      die op grond van [artikel 2.46, eerste lid][ref1], over een meetinrichting moet beschikken, een meetinrichting met
      communicatiefunctionaliteit beschikbaar, installeert deze op of nabij het overdrachtspunt en doet een aanbod om de
      meetinrichting in gebruik te geven en te beheren.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 3.51.2
    text: |-
      Indien een distributiesysteembeheerder redelijkerwijs niet in staat is een meetinrichting met
      communicatiefunctionaliteit bij een aangeslotene met een kleine aansluiting te plaatsen en de oorzaak daarvan
      niet in de macht van de aangeslotene ligt, stelt de distributiesysteembeheerder een meetinrichting zonder
      communicatiefunctionaliteit ter beschikking, installeert deze op of nabij het overdrachtspunt en doet een aanbod om
      de meetinrichting in gebruik te geven en te beheren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.51
  - number: 3.51.3
    text: |-
      Een distributiesysteembeheerder die krachtens [artikel 2.46, tweede lid, onderdeel b][ref1], een meetinrichting
      installeert en beheert, stelt een meetinrichting beschikbaar, installeert deze op of nabij de andere plaats en doet
      een aanbod om de meetinrichting in gebruik te geven en te beheren.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 3.51.4
    text: |-
      Een distributiesysteembeheerder doet aan een aangeslotene met een kleine aansluiting voor elektriciteit of gas op
      diens verzoek een aanbod om binnen vier maanden een meetinrichting met communicatiefunctionaliteit ter beschikking
      te stellen:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.51
  - number: 3.51.4.a
    text: in het geval het eerder technisch onmogelijk was een meetinrichting met communicatiefunctionaliteit te plaatsen; of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.51
  - number: 3.51.4.b
    text: ter vervanging van een meetinrichting zonder communicatiefunctionaliteit.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.51
  - number: '3.52'
    text: 'Bij ministeriële regeling kunnen inzake aangeslotenen met een kleine aansluiting regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.52
  - number: 3.52.a
    text: de installatie en het beheer van meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.52
  - number: 3.52.b
    text: de administratie in verband met het vervangen, installeren of verwijderen van meetinrichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.52
  - number: 3.52.c
    text: |-
      de informatieverstrekking door een distributiesysteembeheerder over het gebruik en de mogelijkheden van een
      meetinrichting met communicatiefunctionaliteit.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.52
  - number: 3.53.1
    text: |-
      Een distributiesysteembeheerder schakelt op verzoek van een aangeslotene met een kleine aansluiting de
      communicatiefunctionaliteit administratief aan of uit.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.53
  - number: 3.53.2
    text: |-
      Indien een distributiesysteembeheerder op grond van [artikel 3.51, eerste lid][ref1], een meetinrichting
      met communicatiefunctionaliteit ter beschikking stelt aan een aangesloten met een kleine aansluiting, kan
      de aangeslotene deze weigeren. In dat geval stelt de distributiesysteembeheerder een meetinrichting zonder
      communicatiefunctionaliteit ter beschikking, installeert deze op of nabij het overdrachtspunt en doet een aanbod om
      de meetinrichting in gebruik te geven en te beheren.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.53
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
  - number: 3.53.3
    text: |-
      Een distributiesysteembeheerder zendt Onze Minister de persoonsgegevens van een aangeslotene met
      een kleine aansluiting indien hij deze aangeslotene een meetinrichting die voldoet aan de krachtens
      [artikel 2.46, derde lid][ref1], gestelde eisen ter beschikking heeft gesteld maar dit niet heeft geleid tot
      installatie van die meetinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.53
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
  - number: 3.54.1
    text: |-
      De transmissiesysteembeheerder voor gas stelt aan een aangeslotene op zijn systeem voor gas nabij het
      overdrachtspunt een meetinrichting beschikbaar, installeert deze en doet een aanbod om de meetinrichting in gebruik
      te geven en te beheren indien de aangeslotene:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.54
  - number: 3.54.1.a
    text: uitsluitend gas afneemt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.54
  - number: 3.54.1.b
    text: een beheerder van een gesloten systeem voor gas is.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.54
  - number: 3.54.2
    text: Bij ministeriële regeling worden regels gesteld over de installatie en het beheer van meetinrichtingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.54
  - number: 3.55.1
    text: |-
      Een systeembeheerder beschikt op of nabij het overdrachtspunt van een systeemkoppeling over een meetinrichting die
      voldoet aan de krachtens het tweede lid gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.55
  - number: 3.55.2
    text: |-
      Bij ministeriële regeling worden regels gesteld over de eisen en functionaliteiten waaraan een meetinrichting of
      een onderdeel van een meetinrichting, bedoeld in het eerste lid, ten minste moet voldoen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.55
  - number: 3.56.1
    text: |-
      Een systeembeheerder draagt er zorg voor dat op zijn systeemkoppeling een meetverantwoordelijke partij actief is
      die de meetinrichting als bedoeld in [artikel 3.55, eerste lid][ref1], installeert en beheert en wijst gezamenlijk
      met de bij een systeemkoppeling betrokken andere systeembeheerder een meetverantwoordelijke partij aan.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.56
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
  - number: 3.56.2
    text: |-
      Het eerste lid is niet van toepassing op een systeemkoppeling tussen het transmissiesysteem voor gas en een
      distributiesysteem voor gas.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.56
  - number: 3.56.3
    text: Bij ministeriële regeling worden regels gesteld over de installatie en het beheer van meetinrichtingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.56
  - number: 3.57.1
    text: |-
      Een distributiesysteembeheerder verzamelt, valideert en stelt de meetgegevens vast van aangeslotenen met een kleine
      aansluiting voor elektriciteit of gas, die beschikken over een door een distributiesysteembeheerder op grond van
      [artikel 3.51][ref1] geïnstalleerde meetinrichting waarvan de communicatiefunctionaliteit aan staat, indien dit
      noodzakelijk is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
  - number: 3.57.1.a
    text: |-
      het uitvoeren van de verplichtingen van een marktdeelnemer of balanceringsverantwoordelijke op grond van
      [hoofdstuk 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '2'
  - number: 3.57.1.b
    text: |-
      het uitvoeren van taken of verplichtingen bij of krachtens [hoofdstuk 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
  - number: 3.57.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
  - number: 3.57.2.a
    text: welke meetgegevens worden verzameld, gevalideerd of vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
  - number: 3.57.2.b
    text: 'de frequentie waarmee meetgegevens worden verzameld, gevalideerd of vastgesteld, waarbij:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
  - number: 3.57.2.b.1°
    text: de intervalfrequentie van verbruiks- invoedgegevens niet hoger is dan een kwartier; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
  - number: 3.57.2.b.2°
    text: verbruiks- en invoedgegevens ten hoogste één maal per dag worden verzameld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
  - number: 3.57.2.c
    text: de wijze waarop meetgegevens worden verzameld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
  - number: 3.57.2.d
    text: nauwkeurigheidseisen bij het verzamelen van meetgegevens;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
  - number: 3.57.2.e
    text: methoden voor het herleiden en berekenen van de hoeveelheid gas en de energie-inhoud van het gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
  - number: 3.57.2.f
    text: methoden voor het herleiden en berekenen ten behoeve van het valideren en vaststellen van meetgegevens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.57
  - number: '3.58'
    text: |-
      Een distributiesysteembeheerder verzamelt, valideert en stelt de meetgegevens vast van aangeslotenen met een
      kleine aansluiting voor elektriciteit of gas, die bij het overdrachtspunt beschikken over een meetinrichting zonder
      communicatiefunctionaliteit of een meetinrichting waarvan de communicatiefunctionaliteit niet wordt gebruikt:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.58
  - number: 3.58.a
    text: bij de vervanging van een meetinrichting;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.58
  - number: 3.58.b
    text: bij een aanpassing van een aansluiting;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.58
  - number: 3.58.c
    text: bij een aanpassing van een meetinrichting;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.58
  - number: 3.58.d
    text: |-
      bij aanwijzingen van onbetrouwbaarheid of onvolledigheid van meetgegevens, volgens bij ministeriële regeling te
      bepalen criteria.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.58
  - number: 3.59.1
    text: |-
      Een transmissiesysteembeheerder voor gas verzamelt, valideert en stelt de meetgegevens vast van een aangeslotene op
      zijn systeem indien de aangeslotene:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.59
  - number: 3.59.1.a
    text: uitsluitend gas onttrekt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.59
  - number: 3.59.1.b
    text: een beheerder van een gesloten systeem voor gas is.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.59
  - number: 3.59.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.59
  - number: 3.59.2.a
    text: welke meetgegevens worden verzameld, gevalideerd of vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.59
  - number: 3.59.2.b
    text: de frequentie waarmee meetgegevens worden verzameld, gevalideerd of vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.59
  - number: 3.59.2.c
    text: de wijze waarop meetgegevens worden verzameld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.59
  - number: 3.59.2.d
    text: nauwkeurigheidseisen bij het verzamelen van meetgegevens;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.59
  - number: 3.59.2.e
    text: methoden voor het herleiden en berekenen van de hoeveelheid gas en de energie-inhoud van het gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.59
  - number: 3.59.2.f
    text: methoden voor het herleiden en berekenen ten behoeve van het valideren en vaststellen van meetgegevens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.59
  - number: 3.60.1
    text: |-
      Een meetverantwoordelijke partij, bedoeld in [artikel 3.56, eerste lid][ref1], verzamelt, valideert en stelt de
      meetgegevens vast op een systeemkoppeling.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
  - number: 3.60.2
    text: |-
      Een transmissiesysteembeheerder voor gas verzamelt, valideert en stelt de meetgegevens vast op een systeemkoppeling
      tussen zijn systeem en een distributiesysteem voor gas.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.60
  - number: 3.60.3
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.60
  - number: 3.60.3.a
    text: welke meetgegevens worden verzameld, gevalideerd of vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.60
  - number: 3.60.3.b
    text: de frequentie waarmee meetgegevens worden verzameld, gevalideerd of vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.60
  - number: 3.60.3.c
    text: de wijze waarop meetgegevens worden verzameld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.60
  - number: 3.60.3.d
    text: nauwkeurigheidseisen bij het verzamelen van meetgegevens;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.60
  - number: 3.60.3.e
    text: methoden voor het herleiden en berekenen van de hoeveelheid gas en de energie-inhoud van het gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.60
  - number: 3.60.3.f
    text: methoden voor het herleiden en berekenen ten behoeve van het valideren en vaststellen van meetgegevens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.60
  - number: 3.61.1
    text: |-
      De transmissiesysteembeheerder voor gas en een distributiesysteembeheerder past een door Onze Minister goedgekeurd
      protocol voor een steekproefsgewijze controle van in gebruik zijnde meetinrichtingen op de bij of krachtens
      [artikel 2.46, derde lid][ref1], en de bij of krachtens [artikel 5 van de Metrologiewet][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.61
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0019517
        artikel: '5'
  - number: 3.61.2
    text: Bij ministeriële regeling kunnen eisen worden gesteld aan het protocol.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.61
  - number: '3.62'
    text: |-
      Een transmissiesysteembeheerder voor elektriciteit of gas heeft, indien Onze Minister hem dit opdraagt, tot taak
      werkzaamheden te verrichten ter uitvoering van [verordening 2019/941](32841R2019) respectievelijk [verordening
      2017/1938](31938R2017).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.62
  - number: '3.63'
    text: |-
      Een transmissie- of distributiesysteembeheerder stelt op verzoek van een aangeslotene op haar systeem, of van een
      aangeslotene op een gesloten systeem dat met haar systeem is verbonden, vast:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.63
  - number: 3.63.a
    text: |-
      of diens installatie geschikt is voor de opwekking van gas uit hernieuwbare bronnen, elektriciteit uit hernieuwbare
      bronnen of uit andere bronnen dan wel of sprake is van een installatie voor hoogrenderende warmtekrachtkoppeling;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.63
  - number: 3.63.b
    text: |-
      of de inrichting om te meten, die wordt gebruikt in de installatie geschikt is voor de meting van de hoeveelheid
      elektriciteit of gas die is geproduceerd; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.63
  - number: 3.63.c
    text: |-
      in geval van omzetting van energie in een andere vorm van energie, of de inrichting om te meten, die wordt gebruikt
      in de installatie geschikt is voor de meting van de hoeveelheid energie uit hernieuwbare bronnen of uit andere
      bronnen die is gebruikt voor de opwekking van de hoeveelheid, bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.63
  - number: 3.64.1
    text: |-
      De transmissiesysteembeheerder voor gas treft voorzieningen om vergunninghouders in staat te stellen de levering
      van gas aan alle aangeslotenen met een kleine aansluiting te verzorgen in perioden van extreme koude.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.64
  - number: 3.64.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de perioden van extreme koude en de te
      treffen voorzieningen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.64
  - number: '3.65'
    text: |-
      De transmissiesysteembeheerder voor gas zet, ten behoeve van aangeslotenen, netgebruikers, marktdeelnemers en
      balanceringsverantwoordelijken, indien noodzakelijk, gelet op het verschil tussen de kwaliteit van het zich in het
      transmissiesysteem bevindende gas en het aan het transmissiesysteem te onttrekken gas:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.65
  - number: 3.65.1°
    text: gas met een hogere energie-inhoud administratief of fysiek om naar een lagere energie-inhoud;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.65
  - number: 3.65.2°
    text: |-
      gas met een lagere energie-inhoud administratief om naar een hogere energie-inhoud, voor zover er gas met een
      hogere energie-inhoud voor omzetting beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.65
  - number: 3.66.1
    text: |-
      Een transmissiesysteembeheerder voor gas biedt jaarlijks voor een bij ministeriële regeling te bepalen datum, na
      raadpleging van de representatieve organisaties van aangeslotenen aan Onze Minister een overzicht aan met daarin:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.1.a
    text: |-
      de hoeveelheden hoog- en laagcalorisch gas die in een gasjaar benodigd zijn om te voorzien in de gasvraag van
      eindafnemers;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.1.b
    text: |-
      de capaciteit die in een gasjaar benodigd is om eindafnemers van zowel hoog- als laagcalorisch gas te voorzien en
      de middelen en methoden daarvoor beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.1.c
    text: |-
      de hoeveelheden hoog- en laagcalorisch gas die gedurende het gasjaar moeten worden opgeslagen om de in onderdeel a
      bedoelde hoeveelheid gas op betrouwbare wijze te kunnen leveren en de in onderdeel b bedoelde capaciteit op
      betrouwbare wijze beschikbaar te hebben; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.1.d
    text: de vraagontwikkeling voor de komende vijf jaar naar hoog- en laagcalorisch gas.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2
    text: 'Het overzicht bevat ten minste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.a
    text: |-
      de hoeveelheden hoog- en laagcalorisch gas en de bijbehorende capaciteiten, benodigd om eindafnemers in de volgende
      gevallen van gas te voorzien:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.a.1°
    text: |-
      extreme temperaturen gedurende een zeven dagen durende piekperiode die voorkomt met een statistische
      waarschijnlijkheid van eens in de twintig jaar;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.a.2°
    text: |-
      een periode van dertig dagen met een uitzonderlijk hoge gasvraag die voorkomt met een statistische
      waarschijnlijkheid van eens in de twintig jaar; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.a.3°
    text: |-
      een periode van dertig dagen in het geval van verstoring van de grootste afzonderlijke gasinfrastructuur onder
      gemiddelde winterse omstandigheden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.b
    text: |-
      de gewenste vulniveaus en de benodigde functionaliteiten van de gasopslaginstallaties voor respectievelijk hoog- en
      laagcalorisch gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.c
    text: |-
      het verwachte planmatig onderhoud aan de installaties van de netbeheerder van het landelijk gastransportnet en de
      daaruit voortvloeiende transportbeperkingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.d
    text: de verwachte ontwikkeling in de samenstelling van het hoogcalorisch gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.e
    text: 'de optimale inzet van andere middelen en methoden, waaronder:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.e.1°
    text: |-
      de beschikbare conversiecapaciteit per gasjaar om gas met een hogere energie-inhoud om te zetten naar gas met een
      lagere energie-inhoud;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.e.2°
    text: gasopslaginstallaties en LNG-installaties;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.e.3°
    text: de beschikbare capaciteit op de grenspunten;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.e.4°
    text: de verwachte productie van gas uit hernieuwbare energiebronnen; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.e.5°
    text: |-
      de inzet van de reservemiddelen waarover de netbeheerder van het landelijk gastransportnet beschikt om gas met
      een hogere energie-inhoud om te zetten naar gas met een lagere energie-inhoud, in het geval van een dag met een
      uitzonderlijk hoge vraag naar gas die zich met een statistische waarschijnlijkheid van eens in de twintig jaar
      voordoet.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.2.f
    text: de verwachte vraag naar hoog- en laagcalorisch gas van verschillende categorieën eindafnemers.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.3
    text: 'Het overzicht, bedoeld in het eerste lid, onderdeel d, bevat ten minste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.3.a
    text: |-
      de verwachte vraag naar hoog- en laagcalorisch gas waarbij een onderscheid in vraag tussen verschillende
      categorieën eindafnemers wordt aangegeven;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.3.b
    text: |-
      de verwachte vraag naar hoog- en laagcalorisch gas waarbij een onderscheid wordt gemaakt naar verschillende
      temperatuurscenario’s; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.3.c
    text: de verwachte inzet van de middelen en methoden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.66.4
    text: |-
      Bij ministeriële regeling wordt de datum, bedoeld in het eerste lid, vastgesteld en kunnen nadere regels worden
      gesteld omtrent het overzicht.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.66
  - number: 3.67.1
    text: |-
      De transmissiesysteembeheerder voor gas heeft, in het belang van het planmatig beheer van voorkomens van gas, ter
      verzekering op lange termijn van een behoedzaam en rationeel gebruik van deze natuurlijke hulpbron tot taak zorg
      te dragen voor de inname en het transport van gas uit de gasvoorkomens in gebieden binnen Nederland en op het
      continentaal plat.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.67
  - number: 3.67.2
    text: |-
      Indien de transmissiesysteembeheerder voor gas ter uitvoering van de in het eerste lid bedoelde taak moet
      investeren in de aanleg of uitbreiding van het transmissiesysteem dan meldt hij dit voornemen aan Onze Minister.
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de melding.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.67
  - number: 3.67.3
    text: |-
      Onze Minister besluit binnen 13 weken nadat de melding is gedaan, of een investering als bedoeld in het eerste lid,
      noodzakelijk is, gelet op het belang, bedoeld in het eerste lid. Indien Onze Minister besluit dat de investering
      niet noodzakelijk is, wordt de transmissiesysteembeheerder voor gas geacht te zijn ontheven van de in het eerste
      lid bedoelde taak voor dat voorkomen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.67
  - number: 3.67.4
    text: |-
      De transmissiesysteembeheerder voor gas overlegt jaarlijks aan Onze Minister een overzicht, waarin ten aanzien van
      de eerstvolgende twintig jaar ramingen zijn opgenomen met betrekking tot de uitoefening van de taak, bedoeld in het
      eerste lid, onder vermelding van daarbij gehanteerde vooronderstellingen en relevante onderscheiden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.67
  - number: 3.68.1
    text: |-
      De transmissiesysteembeheerder voor gas kan, ten einde te waarborgen dat hij de taken, bedoeld in
      [artikel 3.67][ref1] zo doelmatig mogelijk kan uitvoeren, voorwaarden stellen aan de wijze waarop het gas van
      de houders van Nederlandse winningsvergunningen dan wel degene met wie voor het gebruik van die vergunning een
      overeenkomst is gesloten inzake het voor gezamenlijke rekening winnen van gas, wordt ingenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.68
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.8
        afdeling: '3.3'
  - number: 3.68.2
    text: |-
      Systeembeheerders, marktdeelnemers, netgebruikers en aangeslotenen verstrekken de transmissiesysteembeheerder voor
      gas desgevraagd tijdig voldoende inlichtingen en gegevens om te waarborgen dat hij de taken, bedoeld in het eerste
      lid kan uitvoeren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.68
  - number: 3.68.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de in het eerste lid bedoelde voorwaarden en
      de in het tweede lid genoemde gegevens en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.68
  - number: '3.69'
    text: |-
      De transmissiesysteembeheerder voor gas verstrekt Onze Minister alle inlichtingen die hij nodig heeft voor de
      toepassing van [artikel 3.67, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.8
        afdeling: '3.3'
  - number: '3.70'
    text: |-
      De transmissiesysteembeheerder voor gas schakelt een aangeslotene op zijn systeem die ingevolge
      [artikel 2.62, tweede lid][ref1], heeft gemeld dat diens aansluiting omgeschakeld moet worden, om overeenkomstig
      de planning of aangepaste planning, bedoeld in [artikel 3.71, eerste lid][ref2], onderscheidenlijk tweede of
      derde lid, of, indien op grond van [artikel 2.64, eerste lid][ref3], een ontheffing is verleend aan de betrokken
      aangeslotene, overeenkomstig de aangepaste planning die aan die ontheffing ten grondslag ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.70
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.8
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
  - number: 3.71.1
    text: |-
      Ter uitvoering van de taak, bedoeld in [artikel 3.70][ref1], informeert de transmissiesysteembeheerder voor gas
      de betrokken aangeslotene en Onze Minister over de planning van de omschakeling, voorzien van een onderbouwing van
      de benodigde tijd voor de onderscheiden activiteiten ten behoeve van de omschakeling en de mate waarin rekening is
      gehouden met de gegevens, bedoeld in [artikel 2.63, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.8
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
  - number: 3.71.2
    text: |-
      Indien de planning, bedoeld in het eerste lid, naar het oordeel van de aangeslotene of de
      transmissiesysteembeheerder voor gas als gevolg van gewijzigde omstandigheden aanpassing behoeft, stelt de
      transmissiesysteembeheerder voor gas, in afstemming met de aangeslotene, een aangepaste planning op en informeert
      Onze Minister hier zo spoedig mogelijk over. De aangepaste planning wordt voorzien van een onderbouwing van elke
      afwijking ten opzichte van de eerder ingediende planning.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.71
  - number: 3.71.3
    text: |-
      Onze Minister kan de transmissiesysteembeheerder voor gas een bindende gedragslijn opleggen in verband met de
      planning of aangepaste planning van de onderscheiden activiteiten ten behoeve van de omschakeling, indien dit naar
      zijn oordeel in het belang is van de zo spoedig mogelijke afbouw of beëindiging van de gaswinning uit het gebied
      dat is aangewezen in de bij koninklijk besluit van 30 mei 1963, nr. 39 (Stcrt. 126) verleende winningsvergunning of
      in het economisch belang is van de aangeslotene. De transmissiesysteembeheerder voor gas stuurt binnen vier weken
      na ontvangst van de bindende gedragslijn een aangepaste planning aan Onze Minister en de betrokken aangeslotene.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.71
  - number: 3.72.1
    text: |-
      De transmissiesysteembeheerder voor gas zendt binnen een maand na afloop van een gasjaar een rapportage aan Onze
      Minister over:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.72
  - number: 3.72.1.a
    text: |-
      de voortgang van de uitvoering van de taak, bedoeld in [artikel 3.70][ref1], in relatie tot de geldende planning;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.8
        afdeling: '3.3'
  - number: 3.72.1.b
    text: |-
      in hoeverre het onttrekken van laagcalorisch gas aan het transmissie- of distributiesysteem door een aangeslotene
      als bedoeld in [artikel 2.62, eerste lid][ref1], via diens aansluiting is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
  - number: 3.72.2
    text: |-
      Onze Minister verstrekt de informatie, bedoeld in het eerste lid, binnen vier weken na ontvangst daarvan aan de
      Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.72
  - number: 3.72.3
    text: |-
      De transmissiesysteembeheerder voor gas informeert de Autoriteit Consument en Markt binnen vier weken na
      inwerkingtreding van dit artikel welke aangeslotenen in de gasjaren 2016/2017, 2017/2018 en 2018/2019 in ten minste
      twee van die gasjaren meer dan 100 miljoen m3(n) gas hebben onttrokken via diens aansluiting die verbonden is met
      dat deel van het transmissie- of distributiesysteem voor gas waarmee laagcalorisch gas wordt getransporteerd, en
      verstrekt daarbij tevens informatie over de hoeveelheid gas dat per betrokken aansluiting in de hiervoor genoemde
      gasjaren is onttrokken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.72
  - number: 3.72.4
    text: |-
      De transmissiesysteembeheerder voor gas verstrekt de Autoriteit Consument en Markt desgevraagd informatie over de
      hoeveelheid gas die een aangeslotene als bedoeld in het derde lid, via diens aansluiting heeft onttrokken aan dat
      deel van het transmissie- of distributiesysteem voor gas waarmee laagcalorisch gas wordt getransporteerd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.72
  - number: 3.72.5
    text: |-
      De transmissie- of distributiesysteembeheerders informeren de Autoriteit Consument en Markt binnen vier weken
      na afloop van een gasjaar welke aangeslotenen in het voorgaande gasjaar meer dan 100 miljoen m3(n) gas hebben
      onttrokken aan het transmissie- of distributiesysteem voor gas waarmee laagcalorisch gas wordt getransporteerd,
      of, voor zover van toepassing, dat geen enkele aangeslotene in dat gasjaar meer dan 100 miljoen m3(n) gas heeft
      onttrokken aan het transmissie- of distributiesysteem voor gas waarmee laagcalorisch gas wordt getransporteerd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.72
  - number: 3.72.6
    text: |-
      Indien een transmissie- of distributiesysteembeheerder in een gasjaar een aansluiting heeft gerealiseerd
      waarmee installaties van gas worden voorzien waarvan hij vermoedt dat die behoren tot eenzelfde onderneming of
      instelling, die onderling technische, organisatorische of functionele bindingen hebben en in elkaars onmiddellijke
      nabijheid zijn gelegen, en die al door hem van een aansluiting op het transmissie- of distributiesysteem waarmee
      laagcalorisch gas wordt getransporteerd zijn voorzien, informeert hij de Autoriteit Consument en Markt binnen vier
      weken na afloop van dat gasjaar over het realiseren van die aansluiting en de locatie daarvan. De transmissie- of
      distributiesysteembeheerder verstrekt daarbij tevens informatie over de betrokken aangeslotene of aangeslotenen
      en de hoeveelheid gas die in dat voorafgaande gasjaar door middel van elke afzonderlijke aansluiting op het
      transmissie- of distributiesysteem waarmee laagcalorisch gas wordt getransporteerd, is onttrokken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.72
  - number: 3.72.7
    text: |-
      Indien een transmissie- of distributiesysteembeheerder in een gasjaar op grond een aansluiting heeft gerealiseerd
      waarmee installaties van gas worden voorzien, waarvan hij vermoedt dat die behoren tot eenzelfde onderneming of
      instelling, die onderling technische, organisatorische of functionele bindingen hebben en in elkaars onmiddellijke
      nabijheid zijn gelegen, en al door een andere transmissie- of distributiesysteembeheerder van een aansluiting op
      het transmissie- of distributiesysteem waarmee laagcalorisch gas wordt getransporteerd zijn voorzien, informeert
      hij die andere transmissie- of distributiesysteembeheerder en de Autoriteit Consument en Markt over dit vermoeden.
      Op verzoek van de Autoriteit Consument en Markt verstrekken beide systeembeheerders de informatie, bedoeld in het
      zesde lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.72
  - number: 3.73.1
    text: |-
      Bij algemene maatregel van bestuur kunnen één of meer andere taken dan de op grond van deze wet opgedragen taken
      voor een bij die maatregel te bepalen periode van ten hoogste tien jaren per taak worden toegestaan aan een
      transmissie- of distributiesysteembeheerder indien:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.73
  - number: 3.73.1.a
    text: deze taken verband houden met de op grond van deze wet opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.73
  - number: 3.73.1.b
    text: deze taken van belang zijn voor het toekomstig beheer van het systeem; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.73
  - number: 3.73.1.c
    text: marktpartijen niet of in beperkte mate in de uitvoering van de taken voorzien.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.73
  - number: 3.73.2
    text: |-
      Indien het een transmissie- of distributiesysteembeheerder voor elektriciteit betreft, beoordeelt Autoriteit
      Consument en Markt voorafgaand aan het toekennen van een taak als bedoeld in het eerste lid, de noodzaak van de
      toekenning.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.73
  - number: 3.73.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de voortzetting of beëindiging van een overeenkomstig
      het eerste lid opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.73
  - number: 3.73.4
    text: |-
      Bij het toekennen van een tijdelijke taak als bedoeld in het eerste lid kunnen voorwaarden worden gesteld en kan
      worden bepaald dat voor de uitvoering van die taak een tarief in rekening wordt gebracht bij degenen ten behoeve
      van wie de tijdelijke taak wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.73
  - number: '3.74'
    text: |-
      Een transmissie- of distributiesysteembeheerder waarborgt bij de uitvoering van zijn wettelijke taken of
      verplichtingen de kwaliteit daarvan. Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.74
  - number: 3.74.a
    text: de wijze waarop die kwaliteit wordt gewaarborgd en daarover wordt gerapporteerd of gecommuniceerd;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.74
  - number: 3.74.b
    text: |-
      de wijze waarop een transmissie- of distributiesysteembeheerder omgaat met calamiteiten of voorvallen die nadelige
      gevolgen voor mens of milieu hebben of kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.74
  - number: '3.75'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.75
  - number: 3.75.a
    text: het financieel beheer van een transmissie- of distributiesysteembeheerder;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.75
  - number: 3.75.b
    text: |-
      de boekhouding van een transmissie- of distributiesysteembeheerder, waaronder eisen aan de scheiding van de
      boekhouding voor verschillende wettelijke taken of verplichtingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.75
  - number: '3.76'
    text: |-
      Een transmissie- of distributiesysteembeheerder verzamelt en gebruikt bij de uitvoering van zijn wettelijke taken
      of verplichtingen de daarvoor noodzakelijke gegevens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.76
  - number: 3.77.1
    text: |-
      Een transmissie- of distributiesysteembeheerder die bij de uitvoering van zijn wettelijke taken of verplichtingen
      de beschikking krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden,
      draagt er zorg voor dat die gegevens niet ter beschikking komen of kunnen komen van derden, tenzij enig wettelijk
      voorschrift anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.77
  - number: 3.77.2
    text: |-
      Een transmissie- of distributiesysteembeheer verstrekt beheerders van andere systemen de informatie die zij nodig
      hebben voor de naleving van hun wettelijke taken of verplichtingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.77
  - number: 3.77.3
    text: |-
      Een transmissie- of distributiesysteembeheerder verstrekt aangeslotenen, netgebruikers, marktdeelnemers en
      balanceringsverantwoordelijken, de informatie die ze nodig hebben voor een efficiënte toegang tot het transmissie-
      of distributiesysteem inclusief het gebruik ervan.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.77
  - number: 3.78.1
    text: |-
      Een transmissie- of distributiesysteembeheerder maakt uit eigen beweging gegevens die hij bij de uitvoering van
      zijn wettelijke taken of verplichtingen verzamelt en ontvangt, ten behoeve van inzicht in de structuur en het
      functioneren van het energiesysteem en de transitie naar een CO-arme energievoorziening openbaar, waarbij:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
  - number: 3.78.1.a
    text: |-
      hij geen tot een persoon herleidbare gegevens of gegevens waarvan hij het vertrouwelijk karakter kent of
      redelijkerwijs had moeten vermoeden, openbaar maakt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
  - number: 3.78.1.b
    text: hij geen gegevens openbaar maakt indien bij of krachtens deze of een andere wet openbaarmaking niet is toegestaan;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
  - number: 3.78.1.c
    text: |-
      bewerking en verrijking van gegevens is gericht op en beperkt is tot het voor derden begrijpelijk en toegankelijk
      maken van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
  - number: 3.78.2
    text: |-
      Een transmissie- of distributiesysteembeheerder verleent op verzoek toegang tot gegevens en wisselt gegevens uit,
      die hij bij de uitvoering van zijn wettelijke taken of verplichtingen verzamelt en ontvangt, waarbij:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
  - number: 3.78.2.a
    text: |-
      hij geen tot een persoon herleidbare gegevens of gegevens waarvan hij het vertrouwelijk karakter kent of
      redelijkerwijs had moeten vermoeden, openbaar maakt of toegang toe verleent of uitwisselt, met uitzondering van het
      bepaalde bij of krachtens [artikel 4.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 3.78.2.b
    text: |-
      hij geen gegevens openbaar of maakt indien bij of krachtens deze of een andere wet openbaarmaking niet is
      toegestaan;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
  - number: 3.78.2.c
    text: |-
      bewerking en verrijking van gegevens gericht is op en beperkt is tot het voor de verzoeker op een toegankelijke
      wijze beschikbaar stellen op een wijze dat de verzoeker de mogelijkheid van hergebruik en machine-uitleesbaarheid
      heeft.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
  - number: 3.78.3
    text: |-
      Voor het verlenen van toegang tot gegevens of het uitwisselen van gegevens, bedoeld in het tweede lid, kan de
      transmissie- of distributiesysteembeheerder de redelijke kosten in rekening brengen bij de verzoeker.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
  - number: 3.78.4
    text: |-
      In afwijking van [artikel 3.17, eerste lid][ref1], mag een transmissie- of distributiesysteembeheerder de
      uitvoering van de verplichtingen, bedoeld in het eerste tot en met derde lid, in gezamenlijkheid uitvoeren indien
      dit een efficiënte of effectieve openbaarmaking ten goede komt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.78.5
    text: 'Bij ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
  - number: 3.78.5.a
    text: gegevens worden aangewezen die een transmissie- of distributiesysteembeheerder in ieder geval openbaar maakt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
  - number: 3.78.5.b
    text: regels worden gesteld over de wijze van en voorwaarden voor openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.78
  - number: '3.79'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.79
  - number: 3.79.a
    text: het melden van storingen of onregelmatigheden in het transmissie- en distributiesysteem;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.79
  - number: 3.79.b
    text: het indienen van klachten en het afhandelen van die klachten door de transmissie- en distributiesysteembeheerders;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.79
  - number: 3.79.c
    text: |-
      het faciliteren van aangeslotenen door de transmissie- en distributiesysteembeheerders bij overstappen naar andere
      marktdeelnemers of balanceringsverantwoordelijken, verhuizingen of in- en uithuizingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.79
  - number: 3.79.d
    text: |-
      voorzieningen die een transmissie- of distributiesysteembeheerder ter ondersteuning van het gestelde krachtens
      [artikel 2.25][ref1] treft ten behoeve van aangeslotenen met een kleine aansluiting;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.79
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2.4
        afdeling: '2.2'
  - number: 3.79.e
    text: |-
      de informatie die een transmissie- of distributiesysteembeheerder een aangeslotene verstrekt met het oog
      op het voorkomen van buitenwerkingstelling van een aansluiting als bedoeld in [artikel 3.41][ref1] in geval
      van het faillissement of de intrekking van een vergunning, erkenning of toelating van een marktdeelnemer,
      balanceringsverantwoordelijke of meetverantwoordelijke partij, en de termijn waarbinnen deze informatie wordt
      verstrekt, in geval van intrekking van een vergunning als bedoeld in [artikel 2.17, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
