  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen deze wet en de daarop rustende bepalingen geheel of gedeeltelijk van
      toepassing worden verklaard op andere gasvormige stoffen dan gas.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.2
  - number: 1.3.1
    text: |-
      Een onderneming die zich in hoofdzaak bezighoudt met het vervoer van personen of goederen per trein wordt voor de
      toepassing van deze wet aangemerkt als een eindafnemer met een grote aansluiting, ook indien zij feitelijk geen
      aansluiting heeft.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.3
  - number: 1.3.2
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt als eindafnemer met een grote aansluiting voor
      elektriciteit beschouwd een organisatorische eenheid die zich in hoofdzaak bezig houdt met een bij ministeriële
      regeling vast te stellen activiteit, mits:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.3
  - number: 1.3.2.a
    text: deze eenheid vanwege de technische aard van de bedrijfsuitoefening beschikt over verscheidene aansluitingen; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.3
  - number: 1.3.2.b
    text: het totale aan de eenheid voor die bedrijfsuitoefening beschikbaar gestelde vermogen meer bedraagt dan 2 MVA.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.3
  - number: 1.3.3
    text: |-
      Voor een organisatorische eenheid als bedoeld in het tweede lid, wordt als aansluiting mede
      aangemerkt de verbinding bestaande uit één of meer leidingen en daarmee verbonden hulpmiddelen,
      tussen een transmissie- of distributiesysteem en een zaak die geen onroerende zaak is als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel1.3
    references:
