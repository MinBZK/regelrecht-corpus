      Onder een aansluiting voor gas wordt mede verstaan een aansluitpunt, dat bestaat uit een deel van de aansluiting
      van het transmissiesysteem of distributiesysteem tot en met de eerste afsluiter die is aangelegd voor 1 januari
      2019.
