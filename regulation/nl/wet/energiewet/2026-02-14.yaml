        afdeling: '2.6'
  - number: 7.30.2
    text: |-
      Een rekening die is geopend op grond van [artikel 66i van de Gaswet][ref1] zoals dit luidde onmiddellijk
      voorafgaand aan het tijdstip van inwerkingtreding van [artikel 2.58, tweede lid][ref2], wordt aangemerkt als
      rekening geopend op grond van artikel 2.58, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel66i
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel7.30
