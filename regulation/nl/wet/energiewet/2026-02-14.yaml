  - number: 7.34.2
    text: |-
      Als ingevolge een overeenkomst als bedoeld in het eerste lid, een ander dan een systeembeheerder voor elektriciteit
      over de eigendom van een systeem beschikt, behoeft, in afwijking van [artikel 3.14][ref1], de systeembeheerder voor
      elektriciteit niet over de eigendom van dat systeem te beschikken.


