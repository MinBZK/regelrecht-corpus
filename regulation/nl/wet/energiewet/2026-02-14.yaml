        afdeling: '3.5'
  - number: 3.117.b
    text: |-
      de taak bedoeld in [artikel 3.86, eerste, onderdeel b, en tweede lid][ref1], indien deze taak wordt uitgevoerd ten
      behoeve van aangeslotenen als bedoeld in artikel 3.86, eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.117
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
  - number: 3.118.1
    text: |-
      De Autoriteit Consument en Markt stelt de vergoeding vast voor het uitvoeren van de bij of krachtens
      [paragraaf 3.5.1][ref1] aan de transmissiesysteembeheerder voor elektriciteit op zee opgedragen taken of
      verplichtingen, met uitzondering van de taken bedoeld in [artikel 3.117][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.5.1
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.4
        afdeling: '3.6'
  - number: 3.118.2
    text: |-
      De [artikelen 3.108][ref1], [3.109][ref2] en [3.110][ref3] zijn van overeenkomstige toepassing, met dien verstande
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
