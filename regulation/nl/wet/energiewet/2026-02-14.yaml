    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.12
  - number: 4.12.2
    text: |-
      Bij toepassing van het eerste lid wordt bij ministeriële regeling bepaald welke gegevens ten behoeve van welke
      doelen, bedoeld in het eerste lid, de aangewezen partij:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.12
  - number: 4.12.2.a
    text: in zijn register verzamelt of bewerkt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.12
  - number: 4.12.2.b
    text: ontvangt en in zijn register opneemt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.12
  - number: 4.12.2.c
    text: aan een andere registerbeheerder aanlevert;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.12
  - number: 4.12.2.d
    text: gebruikt;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.12
  - number: 4.12.2.e
    text: aan welke derde verstrekt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.12
  - number: 4.12.3
    text: |-
      Een aangewezen partij verstrekt de gegevens, bedoeld in het tweede lid, middels de faciliteit van de
      gegevensuitwisselingsentiteit en geeft de gegevensuitwisselingsentiteit ter uitvoering van [artikel 4.16][ref1]
      toegang tot zijn register.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.13.1
    text: |-
      Onverminderd [artikel 4.2][ref1] gaat een registerbeheerder bij het ontvangen van gegevens de betrouwbaarheid en
      volledigheid daarvan na en past hij redelijke procedures voor correctie van gegevens door de partij van wie hij de
      gegevens heeft ontvangen toe.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.13.2
    text: |-
      Bij het beheer van zijn register voert een registerbeheerder een steekproefsgewijze en periodieke controle uit op
      betrouwbaarheid en volledigheid van de gegevens en past procedures voor correctie van gegevens toe.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.13
  - number: 4.13.3
    text: Een procedure is redelijk, wanneer dit blijkt uit de aard, inhoud en wijze van totstandkoming daarvan.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.13
  - number: 4.13.4
    text: |-
      Een registerbeheerder bewaart de gegevens die in een register zijn opgenomen gedurende een bij ministeriële
      regeling gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.13
  - number: 4.13.5
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.13
  - number: 4.14.1
    text: |-
      Een registerbeheerder neemt passende en evenredige technische en organisatorische maatregelen ter identificatie,
      authenticatie en autorisatie van degene die op grond van [artikel 4.8][ref1] gegevens aanlevert.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 4.14.2
    text: |-
      De maatregelen zorgen, gezien de stand van de techniek, voor een niveau van identificatie, authenticatie en
      autorisatie dat is afgestemd op de risico’s die zich voordoen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.14
  - number: 4.15.1
    text: |-
      De transmissie- en distributiesysteembeheerders richten gezamenlijk een rechtspersoon op die de taken van de
      gegevensuitwisselingsentiteit uitvoert en houden gezamenlijk de zeggenschap over deze rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.15
  - number: 4.15.2
    text: |-
      De transmissie- en distributiesysteembeheerders voorzien de gegevensuitwisselingsentiteit van voldoende middelen
      ter uitvoering van de bij of krachtens de [artikelen 4.16 tot en met 4.24][ref1] opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.16.1
    text: |-
      De gegevensuitwisselingsentiteit geeft overeenkomstig het bepaalde bij en krachtens de
      [artikelen 4.8 tot en met 4.11][ref1] toegang tot en faciliteert de uitwisseling van de gegevens, bedoeld in de
      [artikelen 4.8 tot en met 4.12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 4.16.2
    text: |-
      De gegevensuitwisselingsentiteit handelt redelijk, transparant en niet-discriminerend en bevoordeelt een
      transmissie- of distributiesysteembeheerder niet boven andere partijen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.16
  - number: 4.16.3
    text: |-
      De gegevensuitwisselingsentiteit biedt een of meerdere faciliteiten aan voor de toegang tot en de uitwisseling
      van gegevens, met toepassing van een elektronisch communicatiesysteem of een op basis van de afspraken, bedoeld in
      [artikel 4.25][ref1], gekozen systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.16.4
    text: De gegevensuitwisselingsentiteit houdt voor de uitvoering van de taak, bedoeld in het eerste lid, een register bij.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.16
  - number: 4.16.5
    text: Bij ministeriële regeling kunnen regels worden gesteld over de gegevens die worden opgenomen in het register.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.16
  - number: 4.17.1
    text: |-
      De gegevensuitwisselingsentiteit neemt passende en evenredige technische en organisatorische maatregelen om
      te zorgen voor toegang tot en uitwisseling van gegevens ten behoeve van de verschillende processen, bedoeld in
      [artikel 4.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.17.2
    text: |-
      De gegevensuitwisselingsentiteit past, met inachtneming van de interoperabiliteitsvoorschriften en procedures die
      zijn vastgesteld bij of krachtens artikel 24, tweede lid, van [richtlijn 2019/944](32019L0944) en met inachtneming
      van de afspraken, bedoeld in [artikel 4.25][ref1], procedures en voorwaarden toe die redelijk, objectief,
      transparant en niet discriminerend zijn en maakt deze openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.17.3
    text: |-
      De gegevensuitwisselingsentiteit past in ieder geval procedures en voorwaarden toe ten aanzien van toegang,
      gegevensuitwisseling, gegevensbescherming en gegevensbeveiliging.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.17
  - number: 4.17.4
    text: |-
      Een procedure of voorwaarde is redelijk, wanneer dit blijkt uit de aard, inhoud en wijze van totstandkoming
      daarvan.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.17
  - number: 4.17.5
    text: Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.17
  - number: '4.18'
    text: |-
      De gegevensuitwisselingsentiteit kan een partij die om toegang verzoekt de toegang tot en de uitwisseling van
      gegevens weigeren indien die partij de procedures, bedoeld in [artikel 4.17][ref1], niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.19.1
    text: |-
      De gegevensuitwisselingsentiteit verleent binnen een redelijke termijn op een gemakkelijke wijze toegang tot
      gegevens ten behoeve van de processen, bedoeld in [artikel 4.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.19.2
    text: |-
      De gegevensuitwisselingsentiteit neemt passende en evenredige technische en organisatorische maatregelen
      om meerdere partijen gelijktijdig toegang tot gegevens te verlenen ten behoeve van de processen, bedoeld in
      [artikel 4.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.19.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de termijn waarbinnen toegang tot gegevens wordt
      verleend. Deze termijn kan verschillen voor toegang tot gegevens ten behoeve van verschillende processen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.19
  - number: 4.19.4
    text: |-
      De gegevensuitwisselingsentiteit brengt geen kosten in rekening voor de toegang tot en uitwisseling van gegevens
      ten behoeve van de processen, bedoeld in [artikel 4.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.20.1
    text: |-
      De gegevensuitwisselingsentiteit neemt bij het verlenen van toegang tot gegevens passende en evenredige technische
      en organisatorische maatregelen ter identificatie, authenticatie en autorisatie:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.20
  - number: 4.20.1.a
    text: van degene aan wie hij toegang verleent; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.20
  - number: 4.20.1.b
    text: |-
      van de betreffende aangeslotene, eindafnemer, actieve afnemer of invoeder indien de toegang tot gegevens aan een
      ander is gebaseerd op een verzoek van die aangeslotene, eindafnemer, actieve afnemer of invoeder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.20
  - number: 4.20.2
    text: |-
      De maatregelen zorgen, gezien de stand van de techniek, voor een niveau van identificatie, authenticatie en
      autorisatie dat is afgestemd op de risico’s die zich voordoen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.20
  - number: 4.20.3
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de maatregelen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.20
  - number: 4.20.4
    text: |-
      De gegevensuitwisselingsentiteit verwerkt bij het verlenen van toegang tot gegevens het burgerservicenummer voor
      zover dit noodzakelijk is voor de identificatie, authenticatie en autorisatie van de betreffende aangeslotene,
      eindafnemer, actieve afnemer of invoeder, zijnde een natuurlijk persoon.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.20
  - number: 4.20.5
    text: |-
      De gegevensuitwisselingsentiteit is bij de toepassing van het vierde lid bevoegd de registraties, bedoeld in
      [artikel 3, eerste lid, onder d, van de Wet algemene bepalingen burgerservicenummer][ref1] te raadplegen.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 4.21.1
    text: |-
      De gegevensuitwisselingsentiteit neemt passende en evenredige technische en organisatorische maatregelen om de
      risico’s te beheersen:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.21
  - number: 4.21.1.a
    text: |-
      voor de beveiliging van gegevens die in een register als bedoeld in [artikel 4.16, vierde lid][ref1], zijn
      opgenomen; en


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.21.1.b
    text: |-
      het verlenen van toegang tot en het faciliteren van de uitwisseling van gegevens ten behoeve van de processen,
      bedoeld in [artikel 4.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.21.2
    text: |-
      De maatregelen zorgen, gezien de stand van de techniek, voor een niveau van beveiliging dat is afgestemd op de
      risico’s die zich voordoen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.21
  - number: 4.21.3
    text: |-
      De gegevensuitwisselingsentiteit neemt passende maatregelen om incidenten die de beveiliging van gegevens
      bedreigen, te voorkomen en de gevolgen van dergelijke incidenten zo veel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.21
  - number: 4.21.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de maatregelen, bedoeld in het
      eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.21
  - number: 4.22.1
    text: |-
      De gegevensuitwisselingsentiteit meldt onverwijld bij Onze Minister een inbreuk op de beveiliging van gegevens met
      aanzienlijke gevolgen voor:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.22
  - number: 4.22.1.a
    text: de toegang tot en uitwisseling van gegevens;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.22
  - number: 4.22.1.b
    text: de aangeslotene wiens gegevens het betreft.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.22
  - number: 4.22.2
    text: |-
      De gegevensuitwisselingsentiteit verstrekt Onze Minister op zijn verzoek de informatie die nodig is om een gemelde
      inbreuk op de beveiliging van gegevens te beoordelen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.22
  - number: 4.22.3
    text: |-
      Indien openbaarmaking in het algemeen belang is, kan Onze Minister een beveiligingsincident als bedoeld in het
      eerste lid, openbaar maken of de gegevensuitwisselingsentiteit verplichten tot openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.22
  - number: 4.22.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de melding,
      informatieverstrekking aan Onze Minister en openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.22
  - number: 4.23.1
    text: |-
      De gegevensuitwisselingsentiteit rapporteert jaarlijks aan de Autoriteit Consument en Markt over de uitvoering van
      zijn taken en maakt deze rapportage openbaar.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.23
  - number: 4.23.2
    text: |-
      De gegevensuitwisselingsentiteit rapporteert op verzoek van Onze Minister over de toepassing van de
      uitvoeringshandelingen als bedoeld in artikel 24, tweede lid, van [richtlijn 2019/944](32019L0944).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.23
  - number: 4.23.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de eisen waaraan de rapportages moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.23
  - number: 4.24.1
    text: |-
      De gegevensuitwisselingsentiteit voorziet in een transparante en eenvoudige procedure voor de behandeling van
      klachten van degene die gegevens aanlevert die in een register als bedoeld in [artikel 4.16, vierde lid][ref1],
      zijn opgenomen en degene die toegang vraagt tot gegevens ten behoeve de processen, bedoeld in
      [artikel 4.1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.24.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.24
  - number: 4.24.2.a
    text: de voorwaarden en inrichting waaraan de klachtenprocedure moet voldoen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.24
  - number: 4.24.2.b
    text: de termijnen die gelden voor de klachtenprocedure.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.24
  - number: 4.25.1
    text: |-
      De gegevensuitwisselingsentiteit treedt in overleg met de overige partijen die voor de processen, bedoeld
      in [artikel 4.1, tweede lid][ref1], overeenkomstig het bepaalde bij of krachtens deze wet gegevens dienen te
      verzamelen, aanleveren, ontvangen, bewerken, verstrekken of uitwisselen, alsmede met anderen die een belang
      hebben bij de uitvoering van deze processen, ten einde tot afspraken te komen die nodig zijn voor een effectieve,
      efficiënte en betrouwbare elektronische uitwisseling van gegevens ten behoeve van voornoemde processen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.25.2
    text: |-
      De gegevensuitwisselingsentiteit draagt zorg voor een effectieve, transparante en niet-discriminerende
      ondersteuning bij de totstandkoming en invoering van de afspraken.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.25
  - number: 4.25.3
    text: Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.25
  - number: 5.1.1
    text: |-
      De Autoriteit Consument en Markt is de nationale regulerende instantie, bedoeld in artikel 39, eerste lid, van
      [richtlijn 2009/73](32009L0073) en artikel 57, eerste lid, van [richtlijn 2019/944](32019L0944) en uit dien hoofde
      belast met de taken die aan de nationale regulerende instantie zijn opgedragen bij of krachtens [verordening
      715/2009](32009R0715), [verordening 1227/2011](32011R1227), [verordening 2017/1938](31938R2017), [verordening
      2019/941](32841R2019), [verordening 2019/942](32842R2019), [verordening 2019/943](32843R2019) en [verordening
      2022/869](32769R2022).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.1
  - number: 5.1.2
    text: 'De Autoriteit Consument en Markt is belast met de bij algemene maatregel van bestuur gestelde taken:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.1
  - number: 5.1.2.a
    text: ter uitvoering van [richtlijn 2009/73](32009L0073) en [richtlijn 2019/944](32019L0944);
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.1
  - number: 5.1.2.b
    text: die betrekking hebben op de samenwerking met bevoegde instanties van derde landen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.1
  - number: 5.1.3
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.1
  - number: 5.1.3.a
    text: |-
      kan de Autoriteit Consument en Markt, ter uitvoering van bindende EU-rechtshandelingen op het gebied van
      elektriciteit of gas, worden aangewezen als de nationale regulerende instantie, bevoegde instantie of bevoegde
      autoriteit en worden belast met taken of bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.1
  - number: 5.1.3.b
    text: kunnen procedurevoorschriften worden gesteld ter uitvoering van de in onderdeel a bedoelde taken of bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.1
  - number: 5.1.4
    text: |-
      De Autoriteit Consument en Markt houdt bij de uitoefening van de haar bij of krachtens deze wet toegekende taken
      en bevoegdheden rekening met artikel 40 van [richtlijn 2009/73](32009L0073) en artikel 58 van [richtlijn 2019/944]
      (32019L0944).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.1
  - number: 5.2.1
    text: |-
      De Autoriteit Consument en Markt ziet er op toe dat huishoudelijk eindafnemers en micro-ondernemingen verzekerd
      zijn van de levering van elektriciteit of gas tegen concurrerende, eenvoudig en duidelijk vergelijkbare,
      transparante, redelijke en niet-discriminerende prijzen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.2
  - number: 5.2.2
    text: |-
      De Autoriteit Consument en Markt kan ter verzekering van de levering, bedoeld in het eerste lid, een bindende
      gedragslijn opleggen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.2
  - number: 5.2.3
    text: |-
      De op grond van [artikel 12a, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1] aangewezen
      ambtenaren die zijn belast met het toezicht op de naleving van deze wet, zijn tevens belast met de uitvoering van
      de taak, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12a
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: 12a
  - number: 5.2.4
    text: |-
      Bij ministeriële regeling worden met het oog op de uitvoering van de taak, bedoeld in het eerste lid, regels
      gesteld over de verstrekking van gegevens door leveranciers aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.2
  - number: 5.3.1
    text: |-
      De Autoriteit Consument en Markt stelt jaarlijks een verslag op over de uitvoering van de haar bij of krachtens
      deze wet opgedragen taken. Het verslag bevat een overzicht van de behaalde resultaten en genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.3
  - number: 5.3.2
    text: De Autoriteit Consument en Markt zendt het verslag toe aan Onze Minister, Acer en de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.3
  - number: 5.4.1
    text: |-
      Een partij die een geschil heeft met een systeembeheerder over de wijze waarop deze beheerder zijn taken en
      bevoegdheden op grond van deze wet uitoefent, dan wel aan zijn verplichtingen op grond van deze wet voldoet, kan
      een klacht bij de Autoriteit Consument en Markt indienen. Een klacht omvat een aanvraag om een besluit.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.4
  - number: 5.4.2
    text: |-
      De Autoriteit Consument en Markt neemt binnen twee maanden na ontvangst van de klacht een besluit. In afwijking
      van [artikel 4:15 van de Algemene wet bestuursrecht][ref1] kan deze termijn met twee maanden worden verlengd als de
      Autoriteit Consument en Markt de indiener van de klacht, of de betreffende systeembeheerder om aanvullende gegevens
      verzoekt. Indien de indiener van de klacht daarmee instemt, kan de Autoriteit Consument en Markt een langere
      termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 5.4.3
    text: Het besluit van de Autoriteit Consument en Markt is bindend.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.4
  - number: 5.4.4
    text: |-
      Het indienen van een klacht als bedoeld in het eerste lid laat onverlet elke mogelijkheid voor de desbetreffende
      partij een hem ter beschikking staand rechtsmiddel aan te wenden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.4
  - number: 5.5.1
    text: |-
      Als de balanceringsverantwoordelijken, bedoeld in [artikel 2.41, tweede lid][ref1], een geschil hebben over
      de financiële compensatie of de voorwaarden voor aanpassing van het elektriciteitsprogramma als gevolg van de
      vraagrespons of de uitwisseling van relevante gegevens, over de vergoeding van eventuele onbalanskosten die
      hierdoor ontstaan en de uitwisseling van relevante gegevens kan elk van de balanceringsverantwoordelijken een
      klacht bij de Autoriteit Consument en Markt indienen. Een klacht omvat een aanvraag om een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 5.5.2
    text: Het besluit van de Autoriteit Consument en Markt is bindend.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.5
  - number: 5.5.3
    text: |-
      Het indienen van een klacht als bedoeld in het eerste lid laat onverlet elke mogelijkheid voor de desbetreffende
      partij een hem ter beschikking staand rechtsmiddel aan te wenden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.5
  - number: '5.6'
    text: |-
      In het geval van een landsgrensoverschrijdend geschil is de Autoriteit Consument en Markt onbevoegd te beslissen op
      een klacht als bedoeld in de [artikelen 5.4][ref1] respectievelijk [5.5][ref2], als de systeembeheerder waartegen
      de klacht is gericht onder de rechtsmacht van een andere lidstaat van de Europese Unie valt, dan wel, indien het
      een interconnectorsysteembeheerder voor gas betreft, onder de rechtsmacht van een ander land valt.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel5
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.7.1
    text: 'Onze Minister is belast met de taken die bij algemene maatregel van bestuur kunnen worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.7
  - number: 5.7.1.a
    text: ter uitvoering van [richtlijn 2009/73](32009L0073) en [richtlijn 2019/944](32019L0944);
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.7
  - number: 5.7.1.b
    text: die betrekking hebben op samenwerking met derde landen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.7
  - number: 5.7.2
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.7
  - number: 5.7.2.a
    text: |-
      kan Onze Minister, ter uitvoering van bindende EU-rechtshandelingen op het gebied van elektriciteit of gas, worden
      aangewezen als bevoegde instantie of bevoegde autoriteit of worden belast met taken of bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.7
  - number: 5.7.2.b
    text: kunnen procedurevoorschriften worden gesteld ter uitvoering van de in onderdeel a bedoelde taken of bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.7
  - number: 5.8.1
    text: |-
      Indien naar het oordeel van de Autoriteit Consument en Markt blijkt dat een transmissie- of
      distributiesysteembeheerder in onvoldoende mate of niet op een doelmatige wijze kan of zal kunnen voorzien in
      het door hem te bereiken niveau van de kwaliteit van zijn transportdienst of de totale behoefte aan capaciteit
      voor het transport van elektriciteit of gas over de door hem beheerde systemen, meldt zij dat na overleg met de
      desbetreffende beheerder aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.8
  - number: 5.8.2
    text: |-
      Nadat Onze Minister een melding heeft ontvangen, kan hij aan de desbetreffende beheerder opdragen voorzieningen te
      treffen teneinde zeker te stellen dat het transport van elektriciteit of gas in voldoende mate of op een doelmatige
      wijze plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.8
  - number: 5.9.1
    text: |-
      Indien Onze Minister vaststelt dat een transmissie- of distributiesysteembeheerder niet meer voldoet aan de eisen
      om te worden aangewezen, kan hij de desbetreffende beheerder opdragen door hem noodzakelijk geachte voorzieningen
      te treffen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.9
  - number: 5.9.2
    text: |-
      Indien een transmissie- of distributiesysteembeheerder niet voldoet aan een opdracht als bedoeld in het eerste lid,
      indien Onze Minister vaststelt dat opdrachten, bedoeld in [artikel 5.8, tweede lid][ref1], niet worden uitgevoerd
      of indien naar zijn oordeel door de bedrijfsvoering van deze beheerder de continuïteit of de betrouwbaarheid van
      de elektriciteits- of gasvoorziening in gevaar komt en onverwijld ingrijpen noodzakelijk is, kan Onze Minister de
      aanwijzing van de desbetreffende beheerder vervallen verklaren en uiterlijk op de dag waarop die aanwijzing vervalt
      een andere rechtspersoon als transmissie- of distributiesysteembeheerder aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel5
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.2'
  - number: 5.10.1
    text: |-
      Indien naar het oordeel van Onze Minister door de bedrijfsvoering van een transmissie- of
      distributiesysteembeheerder de continuïteit of de betrouwbaarheid van de leveringszekerheid of de
      voorzieningszekerheid in gevaar komt en onverwijld ingrijpen noodzakelijk is, kan Onze Minister de desbetreffende
      beheerder aanzeggen dat hij vanaf een bepaald tijdstip voor een bepaalde termijn de opdrachten dient op te volgen
      die aan hem worden gegeven door een door Onze Minister aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.10
  - number: 5.10.2
    text: |-
      Bij de aanzegging geeft Onze Minister aan ter bescherming van welk belang de aanzegging geschiedt. Bij de
      aanzegging kunnen voorschriften en beperkingen worden gesteld aan de te geven opdrachten. De aangewezen persoon
      verstrekt uitsluitend opdrachten ter bescherming van het aangegeven belang.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.10
  - number: 5.10.3
    text: De transmissie- of distributiesysteembeheerder verschaft de door Onze Minister aangewezen persoon alle medewerking.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.10
  - number: 5.10.4
    text: |-
      Voor schade die is voorgekomen uit handelen dat is verricht in strijd met het belang, bedoeld in het tweede lid,
      zijn bestuurders van de transmissie- of distributiesysteembeheerder persoonlijk aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.10
  - number: 5.11.1
    text: |-
      Onze Minister kan een transmissie- of distributiesysteembeheerder voor gas bij een plotselinge crisis op de
      energiemarkt of wanneer de fysieke veiligheid van personen, de veiligheid of betrouwbaarheid van apparatuur
      of installaties of de systeemintegriteit worden bedreigd, opdragen maatregelen als bedoeld in artikel 46 van
      [richtlijn 2009/73](32009L0073) te nemen. Aan de opdracht kunnen voorwaarden, voorschriften en beperkingen worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.11
  - number: 5.11.2
    text: |-
      Een aangeslotene, balanceringsverantwoordelijke of marktdeelnemer verleent de benodigde medewerking aan de
      uitvoering van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.11
  - number: 5.11.3
    text: |-
      Bij ministeriële regeling kunnen met het oog op het tegengaan en beheersen van elektriciteitscrises regels
      worden gesteld ter uitvoering van risicoparaatheidsplannen voor elektriciteit als bedoeld in hoofdstuk III, van
      [verordening 2019/941](32841R2019).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.11
  - number: 5.12.1
    text: |-
      Onze Minister kan de transmissiesysteembeheerder voor elektriciteit opdragen een strategische reserve in te richten
      als bedoeld in artikel 21, derde lid, van [verordening 2019/943](32843R2019).
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.12
  - number: 5.12.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de strategische reserve,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.12
  - number: 5.13.1
    text: |-
      Onze Minister verzamelt en analyseert systematisch inlichtingen en geaggregeerde gegevens met betrekking tot de
      leveringszekerheid en de voorzieningszekerheid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.13
  - number: 5.13.2
    text: |-
      Onze Minister stelt periodiek een verslag op voor elektriciteit of gas waarin hij zijn bevindingen en de getroffen
      of voorgenomen maatregelen vastlegt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.13
  - number: 5.13.3
    text: |-
      Onze Minister kan een transmissiesysteembeheerder opdragen werkzaamheden te verrichten ter uitvoering van het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.13
  - number: 5.13.4
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.13
  - number: 5.13.4.a
    text: over de gegevens, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.13
  - number: 5.13.4.b
    text: |-
      over de inhoud van een verslag, het proces van opstellen van een verslag, de frequentie van het opstellen en de
      datum waarvoor dit verslag wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.13
  - number: 5.13.4.c
    text: over de wijze waarop bekendheid wordt gegeven aan een verslag.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.13
  - number: 5.14.1
    text: |-
      Onze Minister kan een subsidie verstrekken aan een transmissiesysteembeheerder voor elektriciteit op zee
      ter dekking van de door de Autoriteit Consument en Markt op grond van [artikel 3.118][ref1] vastgestelde
      toegestane vergoeding voor de uitvoering van zijn wettelijke taken, met uitzondering van de taken bedoeld in
      [artikel 3.117][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.4
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.4
        afdeling: '3.6'
  - number: 5.14.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het verstrekken van de
      subsidie.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.14
  - number: 5.15.1
    text: |-
      Onze Minister kan een eindafnemer als bedoeld in [artikel 2.63, eerste lid][ref1], een vergoeding toekennen
      indien het verbod, bedoeld in dat artikel, voor die eindafnemer schade veroorzaakt die uitgaat boven het normale
      maatschappelijke risico en die de eindafnemer in vergelijking met anderen onevenredig zwaar treft.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
  - number: 5.15.2
    text: 'Schade blijft in elk geval voor rekening van de eindafnemer voor zover:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.15
  - number: 5.15.2.a
    text: hij het risico van het ontstaan van de schade heeft aanvaard;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.15
  - number: 5.15.2.b
    text: |-
      hij de schade had kunnen beperken door binnen redelijke grenzen maatregelen te nemen, die tot voorkoming of
      vermindering van de schade hadden kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.15
  - number: 5.15.2.c
    text: de schade anderszins het gevolg is van een omstandigheid die aan de aanvrager kan worden toegerekend; of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.15
  - number: 5.15.2.d
    text: de vergoeding van de schade anderszins is verzekerd.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.15
  - number: 5.15.3
    text: |-
      Indien het verbod, bedoeld in [artikel 2.63, eerste lid][ref1], tevens voordeel voor de eindafnemer heeft
      opgeleverd, wordt dit bij de vaststelling van de te vergoeden schade in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.6.2
        afdeling: '2.6'
  - number: 5.15.4
    text: 'Bij ministeriële regeling kunnen regels worden gesteld die betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.15
  - number: 5.15.4.a
    text: het moment waarop de vergoeding kan worden aangevraagd;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.15
  - number: 5.15.4.b
    text: de gegevens die bij een aanvraag worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.15
  - number: 5.15.4.c
    text: de termijn voor het geven van een beslissing op een aanvraag.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.15
  - number: 5.17.1
    text: 'De Autoriteit Consument en Markt is belast met het toezicht op de naleving van het bepaalde:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.17
  - number: 5.17.1.a
    text: |-
      bij of krachtens deze wet, met uitzondering van de [artikelen 2.41, tweede lid][ref1], [2.46, eerste lid][ref2], en
      [2.47, tweede lid][ref3], en de artikelen en onderwerpen, genoemd in [artikel 5.18, eerste lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0050714#Artikel5
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5.1
        afdeling: '2.5'
      - id: ref3
