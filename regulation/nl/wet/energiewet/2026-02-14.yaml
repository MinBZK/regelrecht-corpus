  - number: '3.91'
    text: |-
      Een LNG-beheerder die krachtens [artikel 3.2, eerste lid, aanhef en onderdeel h][ref1], is aangewezen, is uit dien
      hoofde belast met de taken en verplichtingen die krachtens [verordening 715/2009](32009R0715) of andere bindende
      EU-rechtshandeling op het gebied van gas aan LNG-beheerders zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.91
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '3.92'
    text: |-
      Een LNG-beheerder handelt bij de uitoefening van zijn wettelijke taken of verplichtingen redelijk, transparant en
      niet-discriminerend.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.92
  - number: '3.93'
    text: |-
      Een LNG-beheerder beheert, onderhoudt en ontwikkelt zijn systeem, onder economische voorwaarden, op zodanige wijze
      dat de veiligheid, betrouwbaarheid en doelmatigheid van dat systeem is gewaarborgd en met inachtneming van de
      belangen van het milieu.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.93
  - number: 3.94.1
    text: Een LNG-beheerder doet op verzoek een aanbod om LNG-activiteiten of ondersteunende diensten voor gas uit te voeren.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.94
  - number: 3.94.2
    text: |-
      Een LNG-beheerder kan weigeren een aanbod te doen indien binnen het LNG-systeem geen capaciteit beschikbaar is
      voor de verzochte LNG-activiteiten of in redelijkheid niet kan worden gevergd dat hij de verzochte capaciteit
      beschikbaar stelt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.94
  - number: 3.94.3
    text: Een weigering als bedoeld in het tweede lid is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.94
  - number: 3.94.4
    text: |-
      Met het oog op de uitvoering van het eerste en tweede lid, worden in de methoden of voorwaarden, bedoeld in
      [artikel 3.122, tweede lid][ref1], in ieder geval opgenomen, voorwaarden voor:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.94
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.94.4.a
    text: het uitvoeren van LNG-activiteiten of ondersteunende diensten voor gas; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.94
  - number: 3.94.4.b
    text: toe te passen technische specificaties.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.94
  - number: 3.95.1
    text: |-
      Een LNG-beheerder die bij de uitvoering van zijn wettelijke taken of verplichtingen de beschikking krijgt over
      gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, houdt die gegevens geheim
      tenzij enig wettelijk voorschrift anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.95
  - number: 3.95.2
    text: |-
      Een LNG-beheerder verstrekt beheerders van andere systemen de informatie die zij nodig hebben voor een zekere en
      doelmatige exploitatie van de systemen en voor de naleving van hun wettelijke taken of verplichtingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.95
  - number: 3.95.3
    text: 'Een LNG-beheerder:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.95
  - number: 3.95.3.a
    text: |-
      verstrekt gebruikers van het LNG-systeem de informatie die zij nodig hebben voor een efficiënte toegang tot dat
      systeem
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.95
  - number: 3.95.3.b
    text: |-
      maakt alle informatie openbaar die bijdraagt aan een doeltreffende mededinging en een efficiënte werking van de
      markt, voor zover deze redelijkerwijs te genereren is uit de informatie waarover de LNG-beheerder beschikt op basis
      van de uitvoering van zijn wettelijke taken of verplichtingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.95
  - number: 3.95.4
    text: |-
      Als een LNG-beheerder gegevens over zijn bedrijfsvoering die commercieel voordeel kunnen opleveren ter beschikking
      stelt aan derden, stelt hij deze gegevens onder gelijke voorwaarden beschikbaar aan anderen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.95
  - number: 3.95.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de informatie die een LNG-beheerder verstrekt aan
      systeembeheerders of gebruikers van het LNG-systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.95
  - number: '3.96'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de boekhouding van een LNG-beheerder,
      waaronder eisen aan de scheiding van de boekhouding voor verschillende wettelijke taken of verplichtingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.96
  - number: '3.97'
    text: |-
      Een gasopslagbeheerder die krachtens [artikel 3.2, eerste lid, aanhef en onderdeel i][ref1], is aangewezen, is uit
      dien hoofde belast met de taken en verplichtingen die bij of krachtens [verordening 715/2009](32009R0715) of andere
      bindende EU-rechtshandeling op het gebied van gas aan gasopslagbeheerders zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.97
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '3.98'
    text: |-
      Een gasopslagbeheerder handelt bij de uitoefening van zijn wettelijke taken of verplichtingen redelijk, transparant
      en niet-discriminerend.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.98
  - number: '3.99'
    text: |-
      Een gasopslagbeheerder beheert, onderhoudt en ontwikkelt zijn systeem, op economische voorwaarden, op zodanige
      wijze dat de veiligheid, betrouwbaarheid en doelmatigheid is geborgd en met inachtneming van de belangen van het
      milieu.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.99
  - number: 3.100.1
    text: |-
      Een gasopslagbeheerder onderhandelt op verzoek over toegang tot zijn gasopslagsysteem of de door hem aangeboden
      ondersteunende diensten als de toegang tot dat gasopslagsysteem in technische of economische zin noodzakelijk is
      voor een efficiënte toegang tot de gasmarkt met het oog op de levering aan aangeslotenen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.100
  - number: 3.100.2
    text: |-
      De gasopslagbeheerder kan weigeren gasopslagactiviteiten en ondersteunende diensten te verrichten als binnen zijn
      gasopslagsysteem geen capaciteit beschikbaar is voor de gasopslagactiviteiten of in redelijkheid niet kan worden
      gevergd dat hij alle capaciteit beschikbaar stelt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.100
  - number: 3.100.3
    text: Een weigering als bedoeld in het eerste lid is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.100
  - number: 3.100.4
    text: |-
      Een gasopslagbeheerder maakt een indicatie van de voorwaarden en tarieven die het bedrijf voornemens is in het
      volgende kalenderjaar toe te passen voor het verrichten van gasopslag en ondersteunende diensten, bekend.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.100
  - number: 3.100.5
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.100
  - number: 3.100.5.a
    text: |-
      de technische of economische noodzakelijkheid voor een efficiënte toegang tot het transmissie- of
      distributiesysteem met het oog op de levering aan aangeslotenen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.100
  - number: 3.100.5.b
    text: |-
      de procedure voor het vaststellen van de indicatie van de tarieven en voorwaarden en de bekendmaking van de
      indicatie van de tarieven en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.100
  - number: 3.101.1
    text: |-
      Een gasopslagbeheerder die bij de uitvoering van zijn wettelijke taken of verplichtingen de beschikking krijgt over
      gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, houdt die gegevens geheim
      tenzij enig wettelijk voorschrift anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.101
  - number: 3.101.2
    text: |-
      Een gasopslagbeheerder verstrekt beheerders van andere systemen de informatie die zij nodig hebben voor een zekere
      en doelmatige exploitatie van de systemen en voor de naleving van hun wettelijke taken of verplichtingen;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.101
  - number: 3.101.3
    text: 'Een gasopslagbeheerder:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.101
  - number: 3.101.3.a
    text: |-
      verstrekt gebruikers van het gasopslagsysteem de informatie die zij nodig hebben voor een efficiënte toegang tot
      dat systeem
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.101
  - number: 3.101.3.b
    text: |-
      maakt alle informatie openbaar die bijdraagt aan een doeltreffende mededinging en een efficiënte werking van de
      markt, voor zover deze redelijkerwijs te genereren is uit de informatie waarover de gasopslagbeheerder beschikt op
      basis van de uitvoering van zijn wettelijke taken of verplichtingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.101
  - number: 3.101.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de informatie die een gasopslagbeheerder verstrekt aan
      systeembeheerders of gebruikers van het gasopslagsysteem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.101
  - number: 3.101.5
    text: |-
      Als een gasopslagbeheerder gegevens over zijn bedrijfsvoering die commercieel voordeel kunnen opleveren ter
      beschikking stelt aan derden, stelt hij deze gegevens onder gelijke voorwaarden beschikbaar aan anderen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.101
  - number: '3.102'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de boekhouding van een
      gasopslagbeheerder, waaronder eisen aan de scheiding van de boekhouding voor verschillende wettelijke taken of
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.102
  - number: 3.103.1
    text: |-
      Als een gasopslagbeheerder tevens producent of leverancier is of deel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waarvan ook een producent of leverancier deel uitmaakt,
      en de gasopslagbeheerder krachtens [artikel 3.100][ref2] verplicht is te onderhandelen over de toegang tot zijn
      opslagsysteem, is de gasopslagbeheerder wat betreft de rechtsvorm, organisatie en besluitvorming onafhankelijk van
      de activiteiten op het gebied van productie en levering.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.103
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.5.4
        afdeling: '3.5'
  - number: 3.103.2
    text: |-
      Bij algemene maatregel van bestuur worden met het oog op onafhankelijkheid van de gasopslagbeheerder, nadere regels
      gesteld over de rechtsvorm, de organisatie en de besluitvorming van die gasopslagbeheerder.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.103
  - number: 3.104.1
    text: |-
      De [artikelen 3.24, eerste en tweede lid][ref1], [3.25, eerste lid][ref2], [3.43][ref3], [3.44][ref4],
      [3.77, eerste en derde lid][ref5], [artikel 3.79, onderdelen a tot en met c][ref6], zijn van overeenkomstige
      toepassing op een beheerder van een gesloten systeem, met dien verstande dat voor «transmissie- of
      distributiesysteembeheerder», «transmissiesysteembeheerder» of «distributiesysteembeheerder» telkens wordt gelezen
      «beheerder van een gesloten systeem».


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
      - id: ref4
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.3
        afdeling: '3.3'
      - id: ref5
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
      - id: ref6
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3.104.2
    text: |-
      De [artikelen 3.51, eerste lid en vierde lid, onderdeel b][ref1], en [3.57][ref2] zijn van overeenkomstige
      toepassing op een beheerder van een gesloten systeem, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.6
        afdeling: '3.3'
  - number: 3.104.2.a
    text: de beheerder van een gesloten systeem alleen een meetinrichting met communicatiefunctionaliteit plaatst op verzoek;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.104
  - number: 3.104.2.b
    text: |-
      het tarief voor installatie en onderhoud van de meetinrichting in rekening wordt gebracht conform
      [artikel 3.114][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.4
        afdeling: '3.6'
  - number: 3.105.1
    text: |-
      Een beheerder van een gesloten systeem kan op verzoek een aanbod doen tot aanleg of wijziging van een aansluiting
      op zijn systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.105
  - number: 3.105.2
    text: 'Een beheerder van een gesloten systeem doet op verzoek een aanbod tot:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.105
  - number: 3.105.2.a
    text: het in gebruik geven, beheren en onderhouden van een aansluiting op zijn systeem; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.105
  - number: 3.105.2.b
    text: het verzorgen van transport van elektriciteit of gas over zijn systeem.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.105
  - number: 3.105.3
    text: |-
      In afwijking van het tweede lid, kan een beheerder van een gesloten systeem weigeren een aanbod te doen, indien
      er redelijkerwijs onvoldoende transportcapaciteit beschikbaar is op zijn systeem. De beheerder van een gesloten
      systeem voorziet een weigering van een deugdelijke onderbouwing.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.105
  - number: 3.106.1
    text: |-
      Een transmissie- of distributiesysteembeheerder brengt voor het uitvoeren van wettelijke taken of verplichtingen
      bij aangeslotenen op zijn systeem, bij beheerders van transmissie- of distributiesystemen die via een
      systeemkoppeling zijn verbonden met zijn systeem, of, in het geval van de transmissiesysteembeheerder voor gas, bij
      netgebruikers tarieven in rekening:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.106
  - number: 3.106.1.a
    text: |-
      die vooraf door de Autoriteit Consument en Markt zijn vastgesteld overeenkomstig [paragraaf 3.6.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
  - number: 3.106.1.b
    text: |-
      die, indien de transmissie- of distributiesysteembeheerder daartoe op grond van het tweede lid verplicht is, zijn
      gebaseerd op een vooraf door de Autoriteit Consument en Markt overeenkomstig [artikel 3.112][ref1] goedgekeurde
      berekeningsmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.3
        afdeling: '3.6'
  - number: 3.106.2
    text: |-
      Indien de Autoriteit Consument en Markt ten aanzien van een wettelijk taak of verplichting van oordeel is dat het
      niet passend of doelmatig is om voor de uitvoering daarvan vooraf een uniform tarief vast te stellen overeenkomstig
      [paragraaf 3.6.2][ref1], bepaalt de Autoriteit Consument en Markt dat de tarieven daarvoor worden gebaseerd op een
      overeenkomstig [artikel 3.112][ref2] door de Autoriteit Consument en Markt goedgekeurde berekeningsmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0050714
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.3
        afdeling: '3.6'
  - number: 3.106.3
    text: 'Het eerste en tweede lid zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.106
  - number: 3.106.3.a
    text: |-
      indien het een tijdelijke taak betreft, voor zover bij het toekennen van de tijdelijke taak is bepaald dat de
      transmissie- of distributiesysteembeheerder voor het uitvoeren daarvan een tarief in rekening brengt bij degenen
      ten behoeve van wie die tijdelijke taak wordt uitgevoerd; en
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.106
  - number: 3.106.3.b
    text: |-
      voor zover de transmissie- of distributiesysteembeheerder voor het uitvoeren van een wettelijke taak of
      verplichting al op andere wijze een vergoeding ontvangt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.106
  - number: 3.106.4
    text: |-
      In afwijking van het eerste lid kan een transmissie- of distributiesysteembeheerder lagere tarieven in rekening
      brengen dan de overeenkomstig dit artikel vastgestelde tarieven, mits deze niet-discriminerend en transparant zijn.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.106
  - number: 3.106.5
    text: |-
      De Autoriteit Consument en Markt publiceert een besluit als bedoeld in het tweede lid op een voor eenieder kenbare
      en toegankelijke wijze.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.106
  - number: 3.107.1
    text: |-
      De Autoriteit Consument en Markt stelt de door transmissie- en distributiesysteembeheerders toe te passen tarieven
      waarop [artikel 3.106, eerste lid][ref1], van toepassing is, overeenkomstig deze paragraaf vast en met inachtneming
      van het bepaalde bij of krachtens [verordening 2019/943](32843R2019) en [verordening 715/2009](32009R0715) inzake
      tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.107
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.107.2
    text: |-
      De tarieven zijn transparant, niet-discriminerend en reflecteren de kosten van de transmissie- of
      distributiesysteembeheerder in verband met het uitvoeren van de wettelijke taken of verplichtingen voor zover deze
      kosten efficiënt zijn en niet dubbel worden vergoed.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.107
  - number: 3.107.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over algemene tariefbeginselen
      voor het onderscheiden van tarieven en toedelen van kostensoorten en het in aanmerking nemen van kostensoorten:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.107
  - number: 3.107.3.a
    text: |-
      als dit dient ter implementatie van onderdelen van [richtlijn 2009/73](32009L0073), [richtlijn 2012/27](32012L0027)
      of [richtlijn 2019/944](32019L0944); of
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.107
  - number: 3.107.3.b
    text: |-
      voor zover het Verdrag voor de werking van de Europese Unie of de kaders van de Europeesrechtelijke voorschriften
      inzake elektriciteit of gas daarvoor ruimte laten.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.107
  - number: 3.107.4
    text: |-
      De methoden of voorwaarden, bedoeld in [artikel 3.119][ref1], omvatten ten aanzien van de tarieven in ieder geval
      een nadere onderscheiding van de tarieven, de toedeling van kostensoorten aan deze tarieven en de wijze waarop de
      kostensoorten in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.107
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.5
        afdeling: '3.6'
  - number: 3.108.1
    text: |-
      De Autoriteit Consument en Markt stelt, overeenkomstig [afdeling 3.4 van de Algemene wet bestuursrecht][ref1],
      de tariefreguleringsmethode vast voor vaststelling van de tarieven, bedoeld in [artikel 3.107, eerste lid][ref2],
      voor onderscheidenlijk:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.108
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
  - number: 3.108.1.a
    text: de transmissiesysteembeheerder voor elektriciteit;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.108
  - number: 3.108.1.b
    text: distributiesysteembeheerders voor elektriciteit;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.108
  - number: 3.108.1.c
    text: de transmissiesysteembeheerder voor gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.108
  - number: 3.108.1.d
    text: distributiesysteembeheerders voor gas;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.108
  - number: 3.108.2
    text: |-
      De tariefreguleringsmethode strekt tot vergoeding van door de transmissie- of distributiesysteembeheerder
      te maken efficiënte kosten bedoeld in [artikel 3.107, tweede lid][ref1], stimuleert de transmissie- of
      distributiesysteembeheerder tot een efficiënte bedrijfsvoering, voorziet in een rendement dat in het economisch
      verkeer gebruikelijk is, en waarborgt een betrouwbare, betaalbare en duurzame energievoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.108
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
  - number: 3.108.3
    text: |-
      De tariefreguleringsmethode bepaalt de wijze waarop de per jaar toegestane of beoogde inkomsten ter dekking van de
      efficiënte kosten, bedoeld in het tweede lid, worden vastgesteld en, ten behoeve daarvan, in ieder geval:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.108
  - number: 3.108.3.a
    text: |-
      de wijze waarop de verwachte efficiënte kosten worden vastgesteld en, indien daarbij gebruik wordt gemaakt van
      rekenvolumes, de wijze en het moment waarop deze rekenvolumes worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.108
  - number: 3.108.3.b
    text: het rendement dat in het economische verkeer gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.108
  - number: 3.108.4
    text: |-
      Bij de wijze waarop de toegestane of beoogde inkomsten worden vastgesteld als bedoeld in het derde lid, kan de
      Autoriteit Consument en Markt bepalen dat deze kunnen worden aangepast in verband met de geleverde kwaliteit van
      een wettelijke taak of verplichting.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.108
  - number: 3.108.5
    text: |-
      De Autoriteit Consument en Markt bepaalt de periode waarvoor de tariefreguleringsmethode geldt. Deze periode
      bedraagt minimaal vier en maximaal zes jaar.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.108
  - number: 3.109.1
    text: |-
      De Autoriteit Consument en Markt stelt voorafgaand aan het eerste jaar van een reguleringsperiode als bedoeld
      in [artikel 3.108, vijfde lid][ref1], met inachtneming van het methodebesluit voor iedere transmissie- of
      distributiesysteembeheerder, de voor elk jaar van de reguleringsperiode toegestane inkomsten vast of de beoogde
      inkomsten en rekenvolumes.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.109
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
  - number: 3.109.2
    text: |-
      De Autoriteit Consument en Markt herziet de inkomstenbesluiten indien het methodebesluit, bedoeld in het eerste
      lid, bij een onherroepelijke rechterlijke uitspraak is vernietigd of bij een onherroepelijk besluit van de
      Autoriteit Consument en Markt is herzien, en neemt daarbij die uitspraak of dat besluit in acht.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.109
  - number: 3.110.1
    text: |-
      De Autoriteit Consument en Markt stelt voor iedere transmissie- of distributiesysteembeheerder, op basis van een
      daartoe strekkend voorstel van de transmissie- of distributiesysteembeheerder, jaarlijks de tarieven, bedoeld
      in [artikel 3.107, eerste lid][ref1], vast met inachtneming van de nadere regels over algemene tariefbeginselen,
      bedoeld in artikel 3.107, derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.2
        afdeling: '3.6'
  - number: 3.110.2
    text: |-
      De Autoriteit Consument en Markt stelt ten behoeve van de vaststelling van de tarieven de totale toegestane of
      beoogde inkomsten voor de transmissie- of distributiesysteembeheerder voor dat jaar vast en betrekt daarbij:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.2.a
    text: de op grond van het inkomstenbesluit vastgestelde toegestane of beoogde inkomsten voor dat jaar;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.2.b
    text: |-
      de rekenvolumes, indien het methodebesluit bepaalt dat deze bij de jaarlijkse vaststelling van de tarieven worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.3
    text: |-
      Ten behoeve van de vaststelling van de totale toegestane of beoogde inkomsten, bedoeld in het tweede lid, overweegt
      de Autoriteit Consument en Markt of het passend is om daarbij tevens te betrekken:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.3.a
    text: de relatieve wijziging van de consumentenprijsindex;
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
  - number: 3.110.3.b
    text: |-
      de voor dat jaar geschatte kosten voor de uitvoering van taken of verplichtingen als bedoeld in
      [artikel 3.106, eerste lid, aanhef en onderdeel a][ref1], waarmee geen rekening is gehouden bij de vaststelling van
      het methodebesluit, voor zover deze kosten efficiënt zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.6.1
        afdeling: '3.6'
  - number: 3.110.3.c
    text: |-
      de voorafgaand aan dat jaar gemaakte kosten voor de uitvoering van de taak bedoeld in [artikel 3.27][ref1], of
      een verplichting krachtens [artikel 3.8, derde lid, onderdeel b][ref2], waarmee geen rekening is gehouden in het
      methodebesluit, voor zover deze kosten efficiënt zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 3.110.3.d
    text: |-
      de voor dat jaar geschatte vermogenskosten voor investeringen die nog niet in gebruik zijn genomen en waarvoor
      gelet op [artikel 6.1][ref1] een projectbesluit als bedoeld in [afdeling 5.2 van de Omgevingswet][ref2] is
      vastgesteld door Onze Minister, voor zover deze kosten efficiënt zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
