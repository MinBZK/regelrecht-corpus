      [ref6]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel2.46
