  - number: 7.37.1
    text: |-
      Een transmissie- of distributiesysteembeheerder voor elektriciteit stelt voor de eerste maal een investeringsplan
      als bedoeld in [artikel 3.34][ref1] op, twee jaar nadat zij voor de laatste maal een investeringsplan heeft
      opgesteld op grond van [artikel 21 van de Elektriciteitswet 1998][ref2] zoals dat luidde onmiddellijk voorafgaand
      aan het tijdstip van inwerkingtreding van artikel 3.34. Tot dat tijdstip wordt het laatste investeringsplan dat is
      opgesteld op grond van artikel 21 van de Elektriciteitswet 1998 zoals dat luidde onmiddellijk voorafgaand aan het
      tijdstip van inwerkingtreding van [artikel 3.35, vijfde lid][ref3], beschouwd als investeringsplan als bedoeld in
      dat voorschrift.


