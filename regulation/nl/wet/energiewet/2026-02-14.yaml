        afdeling: '3.6'
  - number: '3.117'
    text: |-
      De transmissiesysteembeheerder voor elektriciteit op zee brengt tarieven in rekening, waarbij
      [artikel 3.106][ref1], [paragraaf 3.6.2][ref2] en [artikel 3.112][ref3] van overeenkomstige toepassing zijn,
      met dien verstande dat voor «transmissie- of distributiesysteembeheerder» of «transmissiesysteembeheerder voor
      elektriciteit» steeds wordt gelezen «transmissiesysteembeheerder voor elektriciteit op zee», voor het uitvoeren
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel3
