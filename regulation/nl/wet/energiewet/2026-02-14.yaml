      - id: ref2
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 3.110.3.e
    text: |-
      de voor dat jaar geschatte kosten voor investeringen die in dat jaar in gebruik zijn of worden genomen en waarvoor
      gelet op [artikel 6.1][ref1] een projectbesluit als bedoeld in [afdeling 5.2 van de Omgevingswet][ref2] is genomen,
      voor zover deze kosten efficiënt zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel3.110
