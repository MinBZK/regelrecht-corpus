  - number: 4.8.8
    text: |-
      Een partij levert de gegevens, bedoeld in eerste tot en met zevende lid, aan middels een faciliteit die de
      gegevensuitwisselingsentiteit daarvoor beschikbaar stelt.
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.8
