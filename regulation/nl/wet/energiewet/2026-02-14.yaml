  - number: 7.34.4
    text: |-
      De transmissiesysteembeheerder voor gas behoeft, in afwijking van [artikel 3.14][ref1], niet over de eigendom
      te beschikken van een aansluitleiding en daarmee verbonden hulpmiddelen die een buiten Nederland gelegen
      gasopslagsysteem verbindt met het transmissiesysteem voor gas indien hij onmiddellijk voorafgaand aan
      inwerkingtreding van artikel 3.14 niet over de eigendom van deze aansluitleiding en daarmee verbonden hulpmiddelen
      beschikte.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
