  - number: 4.9.2
    text: |-
      Een transmissie- of distributiesysteembeheerder verstrekt aan een leverancier, marktdeelnemer die
      aggregeert, balanceringsverantwoordelijke, meetverantwoordelijke partij, een andere transmissie- of
      distributiesysteembeheerder, een beheerder van een gesloten systeem en Onze Minister de bij ministeriële regeling
      te bepalen gegevens die in zijn register zijn opgenomen ten behoeve van het:
    url: https://wetten.overheid.nl/BWBR0050714/2026-02-14#Artikel4.9
  - number: 4.9.2.a
    text: sluiten, uitvoeren en beëindigen van een overeenkomst;
