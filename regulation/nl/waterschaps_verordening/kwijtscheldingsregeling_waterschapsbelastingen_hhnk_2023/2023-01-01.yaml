officiele_titel: Kwijtscheldingsregeling waterschapsbelastingen HHNK 2023
organisation: Hoogheemraadschap Hollands Noorderkwartier
url: https://lokaleregelgeving.overheid.nl/CVDR686061_1
articles:
  - number: '1'
    text: |-
      Kwijtschelding kan worden verleend voor de volgende waterschapsbelastingen:

        - watersysteemheffing ingezetenen (artikel 117, aanhef en onder a, van de Waterschapswet);
        - watersysteemheffing gebouwd (artikel 117, aanhef en onder d, van de Waterschapswet), voor zover de heffing wordt
      geheven van degene die krachtens eigendom, bezit of beperkt recht het genot heeft van een gebouwde onroerende zaak
      die geheel of gedeeltelijk bij hem in gebruik is als woonruimte;
        - zuiveringsheffing woonruimte (artikel 122d, lid 2, onder a van de Waterschapswet);
        - verontreinigingsheffing woonruimte (artikel 7.2, lid 3, onder a, van de Waterwet).
        - wegenheffing ingezetenen (artikel 122a, lid 2, onder a, van de Waterschapswet);
        - wegenheffing gebouwd (artikel 122a, lid 2, onder d, van de Waterschapswet), voor zover de heffing wordt geheven
      van degene die krachtens eigendom, bezit of beperkt recht het genot heeft van een gebouwde onroerende zaak die
      geheel of gedeeltelijk bij hem in gebruik is als woonruimte;
    url: https://lokaleregelgeving.overheid.nl/CVDR686061#Artikel1
  - number: '2'
    text: |-
      1. Bij de kwijtschelding van de in artikel 1 genoemde waterschapsbelastingen wordt, voor wat betreft de kosten van
      bestaan, aangesloten bij artikel 16 van de Uitvoeringsregeling Invorderingswet 1990, met dien verstande dat bij de
      berekening van deze kosten wordt uitgegaan van een percentage van 100% van de bijstandsnorm.

      2. In afwijking van het eerste lid worden voor pensioengerechtigde personen de kosten van bestaan gesteld op 100%
      van de in artikel 3 van de Regeling kwijtschelding belastingen medeoverheden bedoelde netto-ouderdomspensioen.
    url: https://lokaleregelgeving.overheid.nl/CVDR686061#Artikel2
  - number: '3'
    text: |-
      Bij de kwijtschelding van de in artikel 1 genoemde waterschapsbelastingen worden overeenkomstig het bepaalde in
      artikel 28, lid 3, van de Uitvoeringsregeling Invorderingswet 1990 als uitgaven mede in aanmerking genomen de
      nettokosten van kinderopvang.
    url: https://lokaleregelgeving.overheid.nl/CVDR686061#Artikel3
  - number: '4'
    text: |-
      Bij de kwijtschelding van de in artikel 1 genoemde waterschapsbelastingen wordt in afwijking van artikel 12,
      tweede lid, onderdeel d, van de Uitvoeringsregeling Invorderingswet 1990 het totale bedrag aan financiële middelen,
      bedoeld in dat onderdeel, verhoogd met:

        - € 2.000 voor de belastingschuldige en echtgenoot;
        - € 1.800 voor een alleenstaande ouder; en
        - € 1.500 voor een alleenstaande.
    url: https://lokaleregelgeving.overheid.nl/CVDR686061#Artikel4
  - number: '5'
    text: |-
      Deze regeling vindt mede toepassing op verzoeken om kwijtschelding van waterschapsbelastingen, die geen verband
      houden met de uitoefening van een bedrijf of beroep, verschuldigd door een natuurlijk persoon die een bedrijf of
      zelfstandig een beroep uitoefent.
    url: https://lokaleregelgeving.overheid.nl/CVDR686061#Artikel5
  - number: '6'
    text: |-
      1. Deze regeling kan worden aangehaald als 'Kwijtscheldingsregeling waterschapsbelastingen HHNK 2023' of
      'Kwijtscheldingsregeling waterschapsbelastingen Hoogheemraadschap Hollands Noorderkwartier 2023'.

      2. Deze regeling treedt in werking met ingang van 1 januari 2023.

      3. De 'Kwijtscheldingsregeling Hoogheemraadschap Hollands Noorderkwartier 2019' wordt ingetrokken, met dien
      verstande dat deze van toepassing blijft op belastingaanslagen, waarvan de dagtekening is gelegen voor de in het
      tweede lid genoemde datum.
    url: https://lokaleregelgeving.overheid.nl/CVDR686061#Artikel6
