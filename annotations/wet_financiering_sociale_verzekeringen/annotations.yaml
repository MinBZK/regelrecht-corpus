---
# Open vragen voor de jurist bij deze wet als taken (RFC-018, motivation questioning).
# Herkomst per taak in de eerste zin. Status per vraag in workflow.
# De vragen van de feitencheck staan in docs/feitencheck/.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.3/annotation-schema.json
annotations:
  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://wet_financiering_sociale_verzekeringen"
      selector:
        type: TextQuoteSelector
        exact: "is of wordt toegeleid of ten behoeve van wie loonkostensubsidie wordt verstrekt"
        suffix: " op grond van"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='38b']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open juristvraag uit de agenda van de vervolgsessie met SZW, november 2026
          (regelrecht-corpus-FCV, docs/szw/agenda-vervolgsessie-november.md), punt F1. Bij dit
          onderdeel gaat het om de toeleiding door de gemeente naar een dienstbetrekking. Besluiten
          die de gemeente of UWV nog neemt, tellen in het voorbeeld van het prototype als "ja": de
          loonwaarde is vastgesteld (Participatiewet, artikel 10d), het college verleent toestemming
          voor de proefplaatsing (Participatiewet, artikel 8a, tweede lid, onderdeel d), de
          kandidaat is door de gemeente toegeleid (dit onderdeel) en het college acht een
          voorziening noodzakelijk (Participatiewet, artikel 10). Onder "Waarom deze uitkomst?"
          staat: "Wat de gemeente of UWV nog moet beoordelen, telt in dit voorbeeld als ‘ja’."
          Vraag: is dat voor een voorbeeldberekening een verantwoorde weergave, of moet per regeling
          zichtbaar zijn welk besluit nog genomen moet worden?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open

  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://wet_financiering_sociale_verzekeringen"
      selector:
        type: TextQuoteSelector
        exact: "wordt onder een arbeidsbeperkte verstaan de persoon"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='38b']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: aantekening in het model bij de uitkomst voor de grond van opname in het
          doelgroepregister. Het eerste lid noemt de onderdelen a tot en met g naast elkaar. Een
          persoon kan aan meer dan een onderdeel voldoen. Het model geeft dan als grond van opname
          het eerste onderdeel dat past, in de volgorde a tot en met g, daarna het tweede en het
          zesde lid. De wet noemt geen rangorde; of iemand arbeidsbeperkte is, hangt er niet van af.
          Vraag: kent het eerste lid een rangorde tussen de onderdelen, en welke grond geldt als een
          persoon aan meer dan een onderdeel voldoet?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open
