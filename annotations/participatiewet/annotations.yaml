          Herkomst: review van het model van loonkostensubsidie en doelgroep, november 2026
          (regelrecht-corpus-FCV, PDR 0026, punt 2). De termijn loopt "nadat de loonwaarde is
          vastgesteld". Artikel 3, eerste lid, van het Besluit loonkostensubsidie en minimumbedragen
          studietoeslag Participatiewet 2021 laat het college de loonwaarde vaststellen op grond van
          het rapport van de loonwaardedeskundige en met inbreng van werknemer en werkgever. In het
          model is de dag van de vaststelling een aangeleverde datum; het model zegt niet welke dag
          dat is. De bron voor de chronolexografie-PoC neemt de dag van het rapport. Vraag: welke
          dag geldt als de dag waarop de loonwaarde is vastgesteld: de dag van het rapport, of de
          dag waarop het college de loonwaarde na de inbreng van werknemer en werkgever vaststelt?
