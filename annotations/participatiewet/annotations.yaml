          niet in het model: er is geen feit voor de dag waarop is vastgesteld dat de persoon niet
          tot de doelgroep behoort, en de doelgroep volgt alleen uit de feiten van artikel 6, eerste
          lid, onderdeel e. Vraag: beëindigt de vaststelling van dit lid alleen de
          loonkostensubsidie, of ook de aanspraak op begeleiding op de werkplek, en vanaf welke dag?
