          Herkomst: review van het model van loonkostensubsidie en doelgroep, november 2026
          (regelrecht-corpus-FCV, PR #14, punt 9, en PDR 0026); markering bij artikel 10d in het
          model. Dit artikel geeft het college de bevoegdheid om vast te stellen of een persoon tot
          de doelgroep loonkostensubsidie behoort. Artikel 10d, eerste lid, verleent
          loonkostensubsidie bij een persoon "die behoort tot de doelgroep loonkostensubsidie"; het
          achtste lid sluit het eerste en tweede lid uit "vanaf het moment dat is vastgesteld dat
          die persoon niet tot de doelgroep loonkostensubsidie behoort". Het model leidt de
          doelgroep af uit de feiten van artikel 6, eerste lid, onderdeel e, en vraagt geen
          vaststelling op grond van dit artikel. De bron voor de chronolexografie-PoC vraagt die
          vaststelling wel: zonder vaststelling wordt de aanvraag daar afgewezen. Vraag: vraagt
          artikel 10d, eerste lid, dat het college vooraf op grond van dit artikel heeft vastgesteld
          dat de persoon tot de doelgroep behoort, of volstaat het dat de persoon aan de
          omschrijving van artikel 6, eerste lid, onderdeel e, voldoet?
