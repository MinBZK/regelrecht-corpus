---
# Open vragen voor de jurist bij deze wet als taken (RFC-018, motivation questioning).
# Herkomst per taak in de eerste zin. Status per vraag in workflow.
# De vragen van de feitencheck staan in docs/feitencheck/.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.3/annotation-schema.json
annotations:
  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://participatiewet"
      selector:
        type: TextQuoteSelector
        exact: "alsmede personen als bedoeld in"
        suffix: " [artikel 10d, tweede lid][ref17];"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='6']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open juristvraag uit de agenda van de vervolgsessie met SZW, november 2026
          (regelrecht-corpus-FCV, docs/szw/agenda-vervolgsessie-november.md), punt A5a. Onderdeel e
          rekent "personen als bedoeld in artikel 10d, tweede lid" tot de doelgroep
          loonkostensubsidie. Artikel 10d, eerste lid, verleent loonkostensubsidie bij een persoon
          "die behoort tot de doelgroep loonkostensubsidie"; artikel 10d, tweede lid, eist een
          aanvraag "binnen zes maanden na het begin van de dienstbetrekking". In het model gaat voor
          de persoon van het tweede lid via dit onderdeel ook het eerste lid open, zonder de termijn
          van zes maanden. Voorbeeld: een schoolverlater uit het voortgezet speciaal onderwijs die
          acht maanden na de start aanvraagt, krijgt via het eerste lid toch loonkostensubsidie.
          Vraag: omvat "personen als bedoeld in artikel 10d, tweede lid" ook de aanvraagtermijn van
          dat lid, of alleen de omschrijving van de persoon?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open

  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://participatiewet"
      selector:
        type: TextQuoteSelector
        exact: "Het eerste lid, onderdeel a, is niet van toepassing op personen"
        prefix: "3 "
        suffix: ":"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='7']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open juristvraag uit de agenda van de vervolgsessie met SZW, november 2026
          (regelrecht-corpus-FCV, docs/szw/agenda-vervolgsessie-november.md), punt A1; feitencheck
          van het prototype iemand aannemen (moza-portaal main 0f8fcdd, 11 november 2026),
          bevindingen F76, F280 en F281 (de oordelen in F280 en F281 gaan over de vragen naar
          ondersteuning door de gemeente en het antwoord "Ja, algemene bijstand"). De verwijzing
          "persoon als bedoeld in artikel 7, eerste lid, onderdeel a" staat onder meer in artikel 6,
          eerste lid, onderdeel e, artikel 8a, tweede lid, onderdeel d, artikel 10c, eerste lid, en
          artikel 10d, tweede lid, onderdeel b. Het model leest die verwijzing met de uitzonderingen
          van dit derde lid. Artikel 7a, eerste lid, onderdeel a, noemt echter personen jonger dan
          27 jaar "als bedoeld in artikel 7, eerste lid, onderdeel a"; dat kan alleen zonder het
          derde lid, onderdeel a. Artikel 10b, eerste lid, gebruikt dezelfde verwijzing. Gevolg in
          het model: bij bijstand op een leeftijd van 26 jaar is er geen proefplaatsing (artikel
          8a), bij 27 jaar wel. Vraag: wordt de verwijzing naar artikel 7, eerste lid, onderdeel a,
          gelezen met of zonder de uitzonderingen van het derde lid? De feitencheck legt dezelfde
          vraag voor bij artikel 10d, tweede lid, onderdeel b: kan iemand met een WIA-uitkering die
          in de zes maanden voor de dienstbetrekking daarnaast algemene bijstand of een
          Anw-uitkering ontving, via dat onderdeel loonkostensubsidie krijgen, gelet op het derde
          lid, onderdeel c? Daarnaast stelt het prototype het ontvangen van algemene bijstand gelijk
          aan een persoon als bedoeld in het eerste lid, onderdeel a, en vraagt het naar feitelijk
          ontvangen ondersteuning, terwijl artikel 10d, tweede lid, onderdeel b, vraagt of de
          persoon in de zes maanden voor de dienstbetrekking "een persoon was als bedoeld in" die
          bepaling. Ook die punten hangen af van het antwoord op deze vraag.
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open

