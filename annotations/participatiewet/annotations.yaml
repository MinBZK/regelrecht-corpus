          heeft_aanspraak_op_voorziening_arbeidsinschakeling van dit artikel. Dit lid vraagt feiten
          die het voorbeeld niet kent; het portaal vult ze zelf in: (1) de persoon is geen persoon
          als bedoeld in de artikelen 34a, 35 en 36 van de Wet WIA; (2) de persoon heeft geen
          nabestaandenuitkering op grond van de Algemene nabestaandenwet; (3) de persoon is
          niet-uitkeringsgerechtigd als de werkgever "Geen uitkering" kiest; (4) het college acht de
          voorziening noodzakelijk, wat in het voorbeeld als "ja" telt (zie punt F1). Vragen: zijn
          (1) tot en met (3) verantwoorde aannames voor een voorbeeld in de situaties via de
          gemeente (bijstand of geen uitkering)? Is (3) dezelfde groep als de
          niet-uitkeringsgerechtigden in dit lid en in artikel 7, eerste lid, onderdeel a, 7°? En
