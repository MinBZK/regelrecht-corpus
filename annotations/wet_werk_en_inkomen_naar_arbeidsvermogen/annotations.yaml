# Open vragen bij deze wet als taken (RFC-018, motivation questioning).
# Herkomst: agenda vervolgsessie november, actieregister en feitencheck
# van het prototype iemand aannemen (moza-portaal). Status per vraag in workflow.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.3/annotation-schema.json
annotations:
  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://wet_werk_en_inkomen_naar_arbeidsvermogen"
      selector:
        type: TextQuoteSelector
        exact: "meeneembare voorzieningen ten behoeve van de inrichting van de arbeidsplaats"
        prefix: "c. "
        suffix: ", de productie-"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='35']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: feitencheck van het prototype iemand aannemen (moza-portaal main 0f8fcdd, 11
          november 2026), bevindingen F194 en F223 (de oordelen in die records gaan over de zinnen
          dat de werknemer in de situatie WIA een jobcoach of een aangepaste werkplek zelf bij UWV
          aanvraagt, F196 en het scherm na versturen). Het prototype zegt, ook op het scherm na
          versturen, dat een werknemer in de situatie WIA een jobcoach of een aangepaste werkplek
          zelf bij UWV aanvraagt, met dit artikel als bron. Het tweede lid, onderdeel c, noemt
          uitsluitend meeneembare voorzieningen voor de arbeidsplaats die in overwegende mate op het
          individu zijn afgestemd. Aanpassingen die "naar de aard der zaak duurzaam zijn verenigd
          met het bedrijf van de werkgever" vallen onder de subsidie aan de werkgever in artikel 36.
          Vraag: valt een aanpassing van de werkplek alleen onder dit artikel voor zover die
          meeneembaar en op de persoon afgestemd is, en vraagt de werkgever een vaste aanpassing aan
          op grond van artikel 36?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: feitencheck
        purpose: tagging
    workflow: open

  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://wet_werk_en_inkomen_naar_arbeidsvermogen"
      selector:
        type: TextQuoteSelector
        exact: "op aanvraag van de werkgever een tegemoetkoming in de kosten"
        prefix: "Het UWV kan "
        suffix: " verstrekken,"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='36']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: feitencheck van het prototype iemand aannemen (moza-portaal main 0f8fcdd, 11
          november 2026), bevinding F144. Het prototype zegt bij voorzieningen voor een werknemer
          met Wajong "Werknemer vraagt aan" (Wajong, artikel 2:22) en toont geen aanvraag door de
          werkgever. Het vierde lid laat UWV "op aanvraag van de werkgever een tegemoetkoming in de
          kosten" verstrekken als de werkgever persoonlijke ondersteuning geeft als bedoeld in
          artikel 2:22, tweede lid, onderdeel d, Wajong; het eerste en tweede lid geven de werkgever
          subsidie voor meerkosten bij een werknemer met een structurele functionele beperking.
          Vraag: gelden het eerste en vierde lid ook bij een werknemer met Wajong, zodat de
          werkgever daar zelf een aanvraag kan doen?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: feitencheck
        purpose: tagging
    workflow: open
