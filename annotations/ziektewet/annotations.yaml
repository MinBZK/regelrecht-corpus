---
# Open vragen voor de jurist bij deze wet als taken (RFC-018, motivation questioning).
# Herkomst per taak in de eerste zin. Status per vraag in workflow.
# De vragen van de feitencheck staan in docs/feitencheck/.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.3/annotation-schema.json
annotations:
  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://ziektewet"
      selector:
        type: TextQuoteSelector
        exact: "die, voorafgaand aan zijn dienstbetrekking, bedoeld in"
        prefix: "e. "
        suffix: " [artikel 3][ref25],"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='29b']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open juristvraag uit de agenda van de vervolgsessie met SZW, november 2026
          (regelrecht-corpus-FCV, docs/szw/agenda-vervolgsessie-november.md), punt C5; juristpunt in
          moza-portaal PR #277, punt 5. Het prototype toont bij de no-riskpolis waarom die geldt:
          Wajong (tweede lid, onderdeel a), doelgroep banenafspraak via de gemeente of
          loonkostensubsidie bij beschut werk (tweede lid, onderdeel e), en WIA (eerste lid). Een
          voorbeeld van de korte formulering: "Geldt hier omdat de kandidaat bij de doelgroep
          banenafspraak hoort (Ziektewet, artikel 29b lid 2 onder e)." Onderdeel f van het tweede
          lid noemt arbeid in een dienstbetrekking als bedoeld in artikel 10b, eerste lid, van de
          Participatiewet. De grond wordt in het portaal nu afgeleid uit de doelgroepen en de duur
          die de engine geeft; op de nieuwe corpusversie komt die rechtstreeks uit de engine
          (voldoet_aan_lid_2_a, _e, _f en voldoet_aan_lid_1). Vragen: zijn deze korte formuleringen
          juist voor een werkgever, ook bij beschut werk? En mag de grond worden afgeleid, of moet
          die rechtstreeks uit de engine komen?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open

  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://ziektewet"
      selector:
        type: TextQuoteSelector
        exact: "of een persoon is ten behoeve van wie loonkostensubsidie wordt verstrekt op grond"
        prefix: "is of werd toegeleid "
        regelrecht:hint:
          type: CssSelector
          value: "article[number='29b']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: markering in het model (regelrecht-corpus-FCV, review van 25 oktober 2026).
          Onderdeel e noemt eerst de persoon die door het college naar een dienstbetrekking is of
          werd toegeleid, dan de persoon ten behoeve van wie loonkostensubsidie wordt verstrekt op
          grond van artikel 10d, tweede lid, Participatiewet, en vervolgt met "en van wie door het
          Uitvoeringsinstituut werknemersverzekeringen is vastgesteld [...] dan wel van wie door het
          college [...] een loonwaarde is vastgesteld die minder bedraagt dan het wettelijk
          minimumloon". Het model laat de persoon met loonkostensubsidie op grond van artikel 10d,
          tweede lid, toe zonder die tweede eis en zonder de slotzin van het tweede lid over het
          moment waarop het recht ontstaat. Vraag: geldt de eis van een vaststelling door UWV of een
          loonwaarde onder het minimumloon ook voor de persoon met loonkostensubsidie op grond van
          artikel 10d, tweede lid, en geldt de slotzin van het tweede lid ook voor die persoon?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open
