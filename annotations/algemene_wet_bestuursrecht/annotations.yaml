# Open vragen bij deze wet als taken (RFC-018, motivation questioning).
# Herkomst: agenda vervolgsessie november, actieregister en feitencheck
# van het prototype iemand aannemen (moza-portaal). Status per vraag in workflow.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.3/annotation-schema.json
annotations:
  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://algemene_wet_bestuursrecht"
      selector:
        type: TextQuoteSelector
        exact: "waarop het besluit op de voorgeschreven wijze is"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='6:8']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: feitencheck van het prototype iemand aannemen (moza-portaal main 0f8fcdd, 11
          november 2026), bevinding F270 (de oordelen in dat record gaan over de zin "Doe dat binnen
          6 weken na [datum besluit]", F274). Het besluit in het prototype zegt "Doe dat binnen 6
          weken na [datum besluit]" en verwijst naar artikel 6:7. Artikel 6:7 regelt de duur van de
          bezwaartermijn; dit artikel, eerste lid, laat de termijn aanvangen met ingang van de dag
          na die waarop het besluit op de voorgeschreven wijze is bekendgemaakt. Het prototype gaat
          ervan uit dat de datum van het besluit en de datum van bekendmaking samenvallen. Vraag:
          hoort dit artikel bij de verwijzing, en mag de termijn in het voorbeeld worden gerekend
          vanaf de datum van het besluit?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: feitencheck
        purpose: tagging
    workflow: open
