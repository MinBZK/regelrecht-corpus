---
# Open vragen voor de jurist bij deze wet als taken (RFC-018, motivation questioning).
# Herkomst per taak in de eerste zin. Status per vraag in workflow.
# De vragen van de feitencheck staan in docs/feitencheck/.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.3/annotation-schema.json
annotations:
  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://wet_arbeidsongeschiktheidsvoorziening_jonggehandicapten"
      selector:
        type: TextQuoteSelector
        exact: "een geldelijke beloning van het minimumloon rechtvaardigt"
        prefix: "is dan de arbeidsprestatie die "
        suffix: ", vermindert het"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='2:20']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open juristvraag uit de agenda van de vervolgsessie met SZW, november 2026
          (regelrecht-corpus-FCV, docs/szw/agenda-vervolgsessie-november.md), punt D2; feitencheck
          van het prototype iemand aannemen (moza-portaal main 0f8fcdd, 11 november 2026), bevinding
          F47. Ligt het uurloon boven het minimumloon, dan telt het voorbeeld in het prototype
          loondispensatie niet mee, met de toelichting "boven het minimumloon hangt het van de cao
          af". Dit lid koppelt de vermindering aan een arbeidsprestatie die duidelijk minder is dan
          "de arbeidsprestatie die een geldelijke beloning van het minimumloon rechtvaardigt", en
          vermindert de aanspraak "in afwijking van hetgeen bij en krachtens de Wet minimumloon en
          minimumvakantiebijslag is bepaald". De cao wordt niet genoemd; een hoger loon kan ook
          alleen in de arbeidsovereenkomst zijn afgesproken. Vraag: klopt het dat loondispensatie
          boven het minimumloon van de cao afhangt, en is "niet meetellen" dan de juiste weergave?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open

  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://wet_arbeidsongeschiktheidsvoorziening_jonggehandicapten"
      selector:
        type: TextQuoteSelector
        exact: "ten gevolge van ziekte of gebrek duidelijk minder"
        prefix: "arbeidsovereenkomst als bedoeld in artikel 7 van die wet, "
        regelrecht:hint:
          type: CssSelector
          value: "article[number='2:20']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open punten van de loondispensatie in de bron voor de chronolexografie-PoC
          (regelrecht-corpus-FCV, chronolexografie/README.md). Dit lid laat het oordeel dat de
          arbeidsprestatie "ten gevolge van ziekte of gebrek duidelijk minder" is aan UWV en zegt
          niet hoe UWV dat vaststelt. Elders in de wet staat "rechtstreeks en objectief medisch vast
          te stellen gevolg van ziekte, gebrek, zwangerschap of bevalling" (onder meer artikel
          1a:1); dit artikel gebruikt die woorden niet. In de bron voor de chronolexografie-PoC
          ontleent UWV het verband met ziekte of gebrek aan het rapport van de arbeidsdeskundige;
          dat is fictief beleid. Vraag: geldt de maatstaf "rechtstreeks en objectief medisch vast te
          stellen" ook voor dit artikel, en wie beoordeelt het verband met ziekte of gebrek?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open

  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://wet_arbeidsongeschiktheidsvoorziening_jonggehandicapten"
      selector:
        type: TextQuoteSelector
        exact: "aanspraak op een geldelijke beloning voor de verrichte arbeid naar evenredigheid"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='2:20']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open punten van de loondispensatie in de bron voor de chronolexografie-PoC
          (regelrecht-corpus-FCV, chronolexografie/README.md). Dit lid zet de arbeidsprestatie af
          tegen "de arbeidsprestatie die een geldelijke beloning van het minimumloon rechtvaardigt".
          Artikel 1 van het Besluit loondispensatie Wajong zet de beloning af tegen "de beloning die
          voor dezelfde arbeid gebruikelijk is". De bron voor de chronolexografie-PoC rekent met het
          eerste: het percentage is de gerechtvaardigde beloning als percentage van het minimumloon
          per uur, met een bovengrens van 100 procent. Met het tweede is het percentage de gemeten
          prestatie zelf. Bij een gebruikelijke beloning gelijk aan het minimumloon geven beide
          hetzelfde bedrag. Bij een prestatie van 60 procent en een gebruikelijke beloning van €
          18,00 per uur geeft de eerste lezing € 10,80 en de tweede € 8,99 (minimumloon € 14,99).
          Vraag: waarnaar wordt de aanspraak "naar evenredigheid" verminderd, en kan het percentage
          van artikel 3 van het Besluit boven 100 uitkomen? Zie ook de taak bij artikel 1 van het
          Besluit (punt D1).
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open
