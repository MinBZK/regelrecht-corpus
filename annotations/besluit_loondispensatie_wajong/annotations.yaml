---
# Open vragen voor de jurist bij deze wet als taken (RFC-018, motivation questioning).
# Herkomst per taak in de eerste zin. Status per vraag in workflow.
# De vragen van de feitencheck staan in docs/feitencheck/.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.3/annotation-schema.json
annotations:
  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://besluit_loondispensatie_wajong"
      selector:
        type: TextQuoteSelector
        exact: "de beloning die voor dezelfde arbeid gebruikelijk is"
        prefix: "ten minste 25% lager ligt dan "
        suffix: "."
        regelrecht:hint:
          type: CssSelector
          value: "article[number='1']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open juristvraag uit de agenda van de vervolgsessie met SZW, november 2026
          (regelrecht-corpus-FCV, docs/szw/agenda-vervolgsessie-november.md), punt D1; feitencheck
          van het prototype iemand aannemen (moza-portaal main 0f8fcdd, 11 november 2026), bevinding
          F131. Het voorbeeld in het prototype neemt als gebruikelijke beloning het minimumloon per
          uur, en als gerechtvaardigde beloning het minimumloon maal de loonwaarde. Het voordeel per
          jaar is het verschil tussen het minimumloon en het uurloon dat UWV vaststelt, maal de uren
          en 52 weken, plus 8 procent vakantiegeld en ongeveer 20 procent werkgeverslasten. Dit
          artikel spreekt van "de beloning die voor dezelfde arbeid gebruikelijk is"; artikel 2:20
          Wajong van "de arbeidsprestatie die een geldelijke beloning van het minimumloon
          rechtvaardigt". Het prototype verwijst voor de grens van 25 procent alleen naar artikel
          2:20 Wajong; die grens staat in dit artikel. Vraag: is het minimumloon als gebruikelijke
          beloning een verantwoorde aanname voor een voorbeeld, of moet dat het loon uit de cao of
          het uurloon bij de werkgever zijn?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open

  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://besluit_loondispensatie_wajong"
      selector:
        type: TextQuoteSelector
        exact: "de eerste dag van de maand waarin deze is aangevraagd"
        suffix: "."
        regelrecht:hint:
          type: CssSelector
          value: "article[number='4']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open punten van de loondispensatie in de bron voor de chronolexografie-PoC
          (regelrecht-corpus-FCV, chronolexografie/README.md). De bron voor de chronolexografie-PoC
          neemt voor "de maand waarin deze is aangevraagd" de dagtekening van de aanvraag. Het kan
          ook de dag zijn waarop UWV de aanvraag ontvangt. Vraag: welke dag bepaalt de maand van de
          aanvraag: de dagtekening of de dag van ontvangst?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open

  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://besluit_loondispensatie_wajong"
      selector:
        type: TextQuoteSelector
        exact: "naar de verwachting van het UWV sprake zal zijn van een"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='5']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open punten van de loondispensatie in de bron voor de chronolexografie-PoC
          (regelrecht-corpus-FCV, chronolexografie/README.md). Dit artikel zegt "naar de verwachting
          van het UWV"; artikel 2 zegt "naar verwachting". In de bron voor de chronolexografie-PoC
          neemt UWV de verwachte duur over uit het rapport van de arbeidsdeskundige, zonder daarvan
          te kunnen afwijken; dat is fictief beleid. Vraag: wiens verwachting is bedoeld in artikel
          2 en in dit artikel, en past het overnemen van de verwachting uit het rapport van de
          arbeidsdeskundige bij "de verwachting van het UWV"?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open

  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://besluit_loondispensatie_wajong"
      selector:
        type: TextQuoteSelector
        exact: "doch ten hoogste voor vijf jaar"
        suffix: "."
        regelrecht:hint:
          type: CssSelector
          value: "article[number='5']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open punten van de loondispensatie in de bron voor de chronolexografie-PoC
          (regelrecht-corpus-FCV, chronolexografie/README.md). Loondispensatie wordt verleend "voor
          de periode" van de verwachte duur. De bron voor de chronolexografie-PoC neemt bij een
          periode van twaalf maanden met ingang van 1 juli 2026 als laatste dag 30 juni 2027, de dag
          vóór dezelfde datum twaalf maanden later. Vraag: is de laatste dag van de periode 30 juni
          2027 of 1 juli 2027?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open

  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://besluit_loondispensatie_wajong"
      selector:
        type: TextQuoteSelector
        exact: "Na afloop van deze periode is verlenging"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='5']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open punten van de loondispensatie in de bron voor de chronolexografie-PoC
          (regelrecht-corpus-FCV, chronolexografie/README.md). Verlenging is "na afloop" mogelijk.
          Artikel 4 laat loondispensatie ingaan op de eerste dag van de maand van de aanvraag. De
          artikelen zeggen niet wat geldt als de werkgever een nieuwe aanvraag doet terwijl de
          periode nog loopt. De bron voor de chronolexografie-PoC verbiedt dat niet en behandelt die
          aanvraag niet als verlenging. Vraag: kan een verlenging worden aangevraagd voordat de
          periode is afgelopen, en met ingang van welke dag wordt zij dan verleend?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open
