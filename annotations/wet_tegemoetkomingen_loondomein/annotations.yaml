---
# Open vragen voor de jurist bij deze wet als taken (RFC-018, motivation questioning).
# Herkomst per taak in de eerste zin. Status per vraag in workflow.
# De vragen van de feitencheck staan in docs/feitencheck/.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.3/annotation-schema.json
annotations:
  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://wet_tegemoetkomingen_loondomein"
      selector:
        type: TextQuoteSelector
        exact: "niet op enig moment in de periode van zes maanden voorafgaand aan de datum van indiensttreding"
        prefix: "b. "
        suffix: " in"
        regelrecht:hint:
          type: CssSelector
          value: "article[number='2.6']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: open juristvraag uit de agenda van de vervolgsessie met SZW, november 2026
          (regelrecht-corpus-FCV, docs/szw/agenda-vervolgsessie-november.md), punt E1. Het portaal
          toont het voorbehoud "niet eerder bij deze werkgever in dienst" alleen bij het
          loonkostenvoordeel arbeidsgehandicapte werknemer (dit artikel), en niet bij de doelgroep
          banenafspraak (artikel 2.10). Een eerdere controle meldt dat de engine het voorbehoud bij
          elke categorie meegeeft; dat wordt nog uitgezocht. Vraag: geldt de voorwaarde van zes
          maanden alleen voor dit artikel, of ook voor de artikelen 2.10 en 2.14?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open

  - type: Annotation
    motivation: questioning
    creator: RIG (FCV)
    target:
      source: "regelrecht://wet_tegemoetkomingen_loondomein"
      selector:
        type: TextQuoteSelector
        exact: "voor deze werknemer is verstreken"
        prefix: "[artikel 2.8][ref15], "
        suffix: "."
        regelrecht:hint:
          type: CssSelector
          value: "article[number='2.6']"
    body:
      - type: TextualBody
        value: >-
          Herkomst: markering in het model (regelrecht-corpus-FCV, review van 25 oktober 2026). Het
          derde lid zegt dat het eerste lid "niet of niet langer van toepassing" is als de periode
          van artikel 2.8 voor de werknemer is verstreken. De tegemoetkoming wordt per kalenderjaar
          berekend over de verloonde uren (artikel 4.1). Het model toetst op de peildatum of de
          periode is verstreken en zet dan de tegemoetkoming over het hele kalenderjaar op nul, ook
          voor de uren vóór het einde van de periode. Artikel 2.10, derde lid, heeft dezelfde vorm.
          Vraag: vervalt bij een periode die in de loop van het kalenderjaar eindigt de
          tegemoetkoming over het hele kalenderjaar, of alleen over de uren na het einde van de
          periode?
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: juristvraag
        purpose: tagging
    workflow: open
